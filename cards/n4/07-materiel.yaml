  fr:
    question: Dans un modèle de premier étage, quelle disposition annule la résultante axiale des forces
      de haute pression (HP) sur l’ensemble mobile du clapet ? Les pressions HP sont égales sur les surfaces
      considérées.
    choices:
    - text: Deux surfaces efficaces égales de l’ensemble mobile, soumises à des forces opposées
      correct: true
    - text: Deux surfaces efficaces égales de l’ensemble mobile, soumises à des forces de même sens
      correct: false
    - text: Deux surfaces efficaces égales, l’une mobile et l’autre sur le corps fixe, soumises à des
        forces opposées
      correct: false
    explanation: 'Pour neutraliser l’action axiale de la HP sur le clapet, les forces opposées doivent
      agir sur le même ensemble mobile et avoir la même intensité. Des surfaces efficaces égales soumises
      à la même HP donnent cette égalité. Des forces de même sens s’additionnent ; une force opposée sur
