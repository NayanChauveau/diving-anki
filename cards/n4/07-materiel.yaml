  fr:
    question: Dans un premier étage à piston simple, le ressort et la pression ambiante poussent le piston
      vers l’ouverture. La moyenne pression (MP) agit sur sa face opposée. Lorsque le plongeur inspire
      et que la MP baisse, quel mouvement tend à se produire ?
    choices:
    - text: Le piston s’éloigne du siège et laisse entrer du gaz haute pression
      correct: true
    - text: Le piston se rapproche du siège et coupe l’entrée de gaz haute pression
      correct: false
    - text: Le piston reste au siège jusqu’à une variation de la pression ambiante
      correct: false
    explanation: 'La MP contribue à la force de fermeture. Quand elle baisse, cette force devient insuffisante
      face aux forces ouvrantes : le piston s’éloigne du siège, et le gaz haute pression alimente la chambre
      MP. Lorsque la MP remonte, l’équilibre de fermeture est rétabli. À débit nul et sous pression, le
      passage est fermé ; il ne faut pas confondre cet état avec le premier étage non encore pressurisé.


