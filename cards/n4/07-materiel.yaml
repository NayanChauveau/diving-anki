  fr:
    question: 'Quelle association décrit les enveloppes gonflables A et B sur ces vues de dessus ? Les
      petits cercles représentent les blocs, les contours blancs les plongeurs et les zones bleues les
      enveloppes.


      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-label="Deux répartitions
      d’enveloppe gonflable vues de dessus : A derrière le dos, B autour du dos et des flancs ; contour
      du plongeur au centre de chaque vue" style="width:100%;max-width:600px;background:white"><g fill="#d5edf1"
      stroke="#397b94" stroke-width="3"><ellipse cx="150" cy="90" rx="100" ry="50"/><path d="M370 155
      V90 C370 20 530 20 530 90 V155 L495 165 V100 C495 80 405 80 405 100 V165 Z"/></g><g fill="#fff"
      stroke="#18394a" stroke-width="3"><ellipse cx="150" cy="160" rx="62" ry="48"/><ellipse cx="450"
      cy="160" rx="62" ry="48"/><circle cx="150" cy="76" r="23"/><circle cx="450" cy="76" r="23"/></g><g
      font-family="sans-serif" font-size="20" fill="#18394a"><text x="140" y="28">A</text><text x="440"
      y="28">B</text><text x="70" y="240">Avant du plongeur</text><text x="370" y="240">Avant du plongeur</text></g></svg>'
    choices:
    - text: 'A : dorsale ; B : enveloppante'
      correct: true
    - text: 'A : enveloppante ; B : dorsale'
      correct: false
    explanation: Une enveloppe dorsale place le volume gonflable essentiellement derrière le plongeur,
      autour du bloc. Une enveloppe enveloppante répartit aussi ce volume le long des flancs. Cette différence
      d’architecture influe sur la répartition de la poussée ; la position obtenue dépend également du
      lestage, du volume gonflé et de l’ensemble plongeur–matériel.
