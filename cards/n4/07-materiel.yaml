    - 'Revue individuelle : docs/reviews/n4/LOT_20_MATERIEL.md'
    fact_check: pass
  fr:
    question: Dans une station, quelle association décrit le rôle d’un clapet de refoulement et celui
      d’une soupape de sécurité ?
    choices:
    - text: 'Clapet : empêcher le retour du gaz ; soupape : décharger une surpression'
      correct: true
    - text: 'Clapet : décharger une surpression ; soupape : empêcher le retour du gaz'
      correct: false
    - text: 'Clapet : régler la pression finale ; soupape : commander l’arrêt du moteur'
      correct: false
    explanation: Le clapet de refoulement laisse passer le gaz vers l’aval et limite son retour dans le
      cylindre. Une soupape de sécurité tarée s’ouvre lorsque la pression atteint son seuil pour protéger
      la partie de circuit concernée. La commande électrique d’arrêt à une pression prévue est une autre
      fonction, assurée notamment par un pressostat. Une soupape de sécurité n’est pas le dispositif de
      régulation courante du gonflage.
- id: n4-materiel-compresseur-panne-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.28–29 ; N4-S11 Jourdren matériel p.5–6,24–31 ; fiche compresseur p.3
      et robinet p.1–2 ; contrôlés 2026-10-12
    - 'BAUER — extraits indexés notice Betreiberhandbuch, dépannage pression insuffisante/purges non étanches
      ; lien PDF ancien redirige ; catalogue accessoires 2025/2028 p.20 B-TIMER et suivi de cartouche
      : https://www.bauer-kompressoren.de/fileadmin/documents/products/spare-part-list/zubehoer_kataloge/High-pressure-accessories-catalogue_EN.pdf
      ; consultés 2026-10-12'
    - Schéma fonctionnel original docs/diagrams/n4/robinet-ouvert.svg ; exercice thermique gaz idéal,
      aucun seuil opérationnel de gonflage
    - 'Revue individuelle : docs/reviews/n4/LOT_21_MATERIEL.md'
    fact_check: pass
  fr:
    question: Une station met plus de temps que d’habitude à atteindre la même pression finale. Une fuite
      de gaz est localisée au robinet de purge, pourtant commandé fermé. Quel défaut est directement établi
      par cette observation ?
    choices:
    - text: Un défaut d’étanchéité de la purge
      correct: true
    - text: Un défaut d’ouverture du clapet d’admission
      correct: false
    - text: Un défaut de tarage du pressostat
      correct: false
    explanation: 'Le gaz s’échappe par un organe qui devrait être étanche : cette fuite réduit le débit
      disponible pour le remplissage. Une montée lente peut avoir d’autres causes, mais les seuls temps
      de gonflage ne permettraient pas de choisir entre elles. Ici, la localisation de la fuite désigne
      la purge ; elle ne démontre ni un défaut du clapet d’admission ni un mauvais tarage de la commande
      d’arrêt.'
- id: n4-materiel-compresseur-verification-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.28–29 ; N4-S11 Jourdren matériel p.5–6,24–31 ; fiche compresseur p.3
      et robinet p.1–2 ; contrôlés 2026-10-12
