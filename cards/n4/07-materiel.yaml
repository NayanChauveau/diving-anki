      par indiquer la pression du bloc ; à l’inspiration, son indication chute puis remonte. Pourquoi
      la lecture au repos masquait-elle le défaut ?
    choices:
    - text: L’équilibre statique se rétablit malgré la restriction ; le débit crée une chute de pression
