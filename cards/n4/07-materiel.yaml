    - N4-S01 — MFT GP-N4 mai 2026 p.28–29 ; fiches CODEP92 manomètre p.1 et inflateur p.1–4 ; relus 2026-10-12
    - SCUBAPRO RevQ juillet 2025 p.5–7 et 14, configuration certifiée/flexibles ; fichier sources/n3/scubapro-detendeurs-juillet-2025.pdf
    - 'Shearwater — Resources, FAQ How is Gas Time Remaining calculated : https://shearwater.com/pages/resources
      ; GTR consommation récente, remontée directe et réserve, sans arrêts ; consulté 2026-10-12'
    - 'Revue individuelle : docs/reviews/n4/LOT_26_MATERIEL.md'
    fact_check: pass
  fr:
    question: Pour remplacer un flexible MP d’un ensemble SCUBAPRO certifié, quels critères établissent
      une substitution conforme ?
    choices:
    - text: Filetages et pression adaptés, avec une référence autorisée pour cet ensemble
      correct: true
    - text: Filetages et pression adaptés, avec tout flexible de la même marque
      correct: false
    - text: Filetages et pression adaptés, avec tout flexible vendu pour la plongée
      correct: false
    explanation: La certification porte sur une combinaison de premier étage, second étage et flexible.
      Des filetages compatibles et une tenue en pression annoncée ne suffisent pas à établir que la pièce
      appartient à la combinaison autorisée. La référence prévue par le fabricant permet cette vérification.
      L’appartenance à une marque ou la vente comme accessoire de plongée ne prouve pas la compatibilité
      certifiée avec cet ensemble précis.
