    - 'Revue individuelle : docs/reviews/n4/LOT_26_MATERIEL.md'
    fact_check: pass
  fr:
    question: Sur un Shearwater avec sonde, sans palier obligatoire, que représente le GTR affiché lorsque
      la réserve est réglée ?
    choices:
    - text: Le temps au fond estimé avant une remontée directe terminée à la réserve réglée
      correct: true
    - text: Le temps respiratoire estimé jusqu’à atteindre la réserve en restant au fond
      correct: false
    - text: Le temps respiratoire estimé jusqu’à vider le bloc en restant au fond
      correct: false
    explanation: Le GTR (Gas Time Remaining) utilise la consommation récente pour estimer le temps encore
      possible à la profondeur actuelle avant qu’une remontée directe conduise à la réserve réglée. Le
      calcul inclut la consommation de remontée, mais pas les arrêts de sécurité ou de décompression.
      La pression provient du capteur ; la durée est une estimation fondée sur des hypothèses de consommation,
      de profondeur et de remontée.
