  fr:
    question: 'Sur cette coupe fonctionnelle d’un robinet ouvert, quels éléments sont repérés par A et
      B ?


      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Coupe fonctionnelle
      ouverte : gaz du bloc à gauche, sortie vers le détendeur en bas, repères A et B" style="width:100%;max-width:520px;background:white"><g
      fill="none" stroke="#397b94" stroke-width="5"><path d="M20 130 H150 V45 H370 V245 H290 V280 M20
      220 H215 V280"/><path d="M260 25 V95"/><path d="M220 95 H305 V115 H220 Z"/><path d="M150 165 H230
      M295 165 H370"/><path d="M40 175 H170 M165 168 L175 175 L165 182 M262 190 V250 M255 240 L262 250
      L269 240"/></g><g font-family="sans-serif" font-size="20" fill="#18394a"><text x="20" y="115">Bloc</text><text
      x="315" y="275">Sortie</text><text x="400" y="170">A</text><path d="M392 164 H345" stroke="#18394a"
      stroke-width="2"/><text x="400" y="105">B</text><path d="M392 99 H312" stroke="#18394a" stroke-width="2"/></g></svg>'
    choices:
    - text: 'A : siège fixe ; B : clapet mobile'
      correct: true
    - text: 'A : clapet mobile ; B : siège fixe'
      correct: false
    - text: 'A : joint de tige ; B : clapet mobile'
      correct: false
    explanation: 'Le siège A est la portée fixe de fermeture. Le clapet B descend jusqu’à cette portée
      pour interrompre le passage du gaz du bloc vers la sortie. Ici il est séparé du siège : le gaz passe
      dans l’ouverture. Le joint autour de la tige assure une autre étanchéité, vers l’extérieur, et n’est
      pas le siège de fermeture du circuit.'
- id: n4-materiel-robinet-etancheite-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N4
  status: reviewed
  review:
