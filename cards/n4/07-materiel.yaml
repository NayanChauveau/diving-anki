    - 'Revue individuelle : docs/reviews/n4/LOT_21_MATERIEL.md'
    fact_check: pass
  fr:
    question: Sur un robinet simple, fermé et déconnecté du détendeur, du gaz s’échappe par la sortie
      alors qu’aucune fuite n’est observée autour de la tige du volant. Quelle zone ne remplit pas sa
      fonction ?
    choices:
    - text: Le contact entre clapet et siège de fermeture
      correct: true
    - text: Le joint d’étanchéité autour de la tige du volant
      correct: false
    - text: Le joint entre robinet et col du bloc
      correct: false
    explanation: 'La fermeture doit empêcher le gaz du bloc d’atteindre la sortie : une fuite par cette
      sortie traduit un défaut de conservation au contact clapet-siège. Une fuite autour de la tige mettrait
      en cause son étanchéité vers l’extérieur ; une fuite au col concernerait la liaison robinet-bloc.
      Le constat localise une fonction défaillante sans déterminer à lui seul l’usure exacte de la pièce.'
- id: n4-materiel-robinet-volume-piege-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - 'N4-S01 — MFT GP-N4 mai 2026 p.28–29 ; fiches CODEP92 : premier étage piston simple p.1–2, piston
      compensé p.1–2 ; Jourdren matériel p.10–13 ; relus 2026-10-12'
    - SCUBAPRO — notice détendeurs juillet 2025, sources/n3/scubapro-detendeurs-juillet-2025.pdf, §5.1
      premiers étages ; contrôle de pertinence des montages, pas performance universelle
    - 'Modèles fonctionnels explicitement imposés : chambres et forces ; aucune équation numérique de
      forces exigée au MFT ; reprise après critique des formulations anciennes « au repos ouvert » et
      MP constante pour tous les détendeurs'
    - 'Revue individuelle : docs/reviews/n4/LOT_22_MATERIEL.md'
    fact_check: pass
  fr:
    question: Un bloc a deux sorties A et B, chacune avec son robinet, alimentées en amont par la même
      bouteille. Les deux détendeurs sont sous pression. On ferme uniquement A, sans purger aucun détendeur.
      Quelle partie conserve du gaz sous pression ?
    choices:
    - text: Les circuits des deux détendeurs A et B
      correct: true
    - text: Le circuit du détendeur B seulement
      correct: false
    - text: Le circuit du détendeur A seulement
      correct: false
    explanation: 'Fermer A coupe son alimentation depuis le bloc mais ne fait pas sortir le gaz déjà piégé
      en aval : son premier étage et ses flexibles restent sous pression. B reste alimenté puisque son
      robinet est ouvert. Fermeture et dépressurisation sont donc deux opérations différentes ; le montage
      décrit n’est pas un bi-bouteille à pont isolateur.'
