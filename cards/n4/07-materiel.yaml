  fr:
    question: Un premier étage maintient presque la même MP relative lorsque la pression du bloc baisse
      à profondeur constante. À la descente, sa MP absolue augmente avec la pression ambiante. Quelles
      fonctions expliquent respectivement ces deux comportements ?
    choices:
    - text: Compensation de la HP ; adaptation à l’ambiante
      correct: true
    - text: Adaptation à l’ambiante ; compensation de la HP
      correct: false
    - text: Compensation de la HP ; surcompensation à la profondeur
      correct: false
    explanation: 'La compensation réduit la dépendance de l’équilibre à la haute pression (HP) du bloc.
      L’adaptation à l’ambiante augmente la MP absolue avec la profondeur pour maintenir l’écart nécessaire
      au fonctionnement du second étage. Une hausse de MP absolue égale à celle de l’ambiante n’est pas,
      à elle seule, une surcompensation : il faudrait que l’écart MP–ambiante augmente dans un montage
      surcompensé à la profondeur.'
