  fr:
    question: Dans un modèle de premier étage non compensé, la haute pression (HP), le ressort et l’ambiante
      exercent des forces ouvrantes ; la moyenne pression (MP) exerce la force fermante. À profondeur
      constante, comment évolue la MP d’équilibre lorsque la HP diminue ? Surfaces et ressort inchangés.
    choices:
    - text: Elle diminue
      correct: true
    - text: Elle augmente
      correct: false
    - text: Elle reste indépendante de la HP
      correct: false
    explanation: 'Dans ce montage précis, la baisse de HP réduit une force ouvrante. Une force fermante
      moindre suffit alors à retrouver l’équilibre, donc la MP d’équilibre baisse. Le résultat dépend
      de la géométrie du mécanisme : il ne constitue pas une règle de sens pour tous les premiers étages
      non compensés. La compensation vise à supprimer cette dépendance directe au niveau de pression du
      bloc.'
