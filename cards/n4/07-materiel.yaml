  fr:
    question: Un clapet ferme une ouverture dans une paroi séparant une chambre à haute pression et une
      chambre à plus basse pression. Le clapet est placé du côté haute pression ; pour ouvrir, il doit
      s’écarter du siège vers cette chambre. Comment agit la différence de pression sur ce clapet ?
    choices:
    - text: 'Elle tend à le fermer : montage amont'
      correct: true
    - text: 'Elle tend à l’ouvrir : montage aval'
      correct: false
    - text: 'Elle tend à le fermer : montage aval'
      correct: false
    explanation: 'La pression supérieure plaque le clapet contre le siège : l’ouverture doit se faire
      contre cette action, c’est un montage amont. Dans un montage aval, le clapet est disposé de l’autre
      côté du siège et la différence de pression tend à l’écarter. La qualification dépend du sens de
      circulation et du montage ; le même mot ne peut pas être attribué à toute robinetterie sans coupe
      ou contexte.'
