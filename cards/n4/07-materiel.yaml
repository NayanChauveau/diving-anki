- id: n4-materiel-compresseur-cycle-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.28–29 ; N4-S11 Jourdren matériel p.24–30 ; N4-S40 fiche compresseur
      Poincelet p.1–3 ; relus 2026-10-12
    - 'BAUER — JUNIOR II, séparateurs et P21 : https://www.bauer-kompressoren.de/en_en/junior-ii ; P-filtersystems
      https://www.bauer-kompressoren.de/en_en/p-filtersysteme1 ; I26 refroidissement multi-étages https://www.bauer-kompressoren.de/en_en/i-26-baureihe
      ; consultés 2026-10-12'
    - BAUER — notice Betreiberhandbuch, extraits indexés dépannage (refroidissement, soupapes inter-étages)
      ; ancien lien PDF redirige, aucune lecture intégrale revendiquée ; contrôle 2026-10-12
    - 'Revue individuelle : docs/reviews/n4/LOT_20_MATERIEL.md'
    fact_check: pass
  fr:
    question: Dans un étage à piston, la pression dans le cylindre est devenue supérieure à celle de la
      conduite de sortie pendant la remontée du piston. Dans quel état sont les clapets lors du refoulement
      ?
    choices:
    - text: Admission fermé, refoulement ouvert
      correct: true
    - text: Admission ouvert, refoulement fermé
      correct: false
    - text: Admission fermé, refoulement fermé
      correct: false
    explanation: Le piston réduit le volume. Lorsque la pression du cylindre dépasse celle de la sortie,
      le clapet de refoulement laisse sortir le gaz ; le clapet d’admission reste fermé pour empêcher
      le retour vers l’entrée. Les deux clapets sont fermés pendant une partie de la compression, avant
      le début du refoulement. À l’admission, le mouvement du piston augmente le volume et le gaz entre
      par l’autre clapet.
- id: n4-materiel-compresseur-etages-001
  type: mcq
  deck: Matériel et préparation
  levels:
