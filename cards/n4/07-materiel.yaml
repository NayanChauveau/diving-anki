    fact_check: pass
  fr:
    question: Un récipient fermé et rigide contient un gaz idéal à 210 bar absolus et 42 °C. Il refroidit
      à 22 °C sans fuite. Quelle pression absolue obtient-on, arrondie au bar ? Utiliser T(K) = T(°C)
      + 273.
    choices:
    - text: 197 bar
      correct: true
    - text: 110 bar
      correct: false
    - text: 224 bar
      correct: false
    explanation: 'À quantité de gaz et volume constants, P/T est constant : P2 = 210 × (22 + 273)/(42
      + 273) = 210 × 295/315 ≈ 197 bar absolus. Utiliser les degrés Celsius donne à tort 110 bar ; inverser
      le rapport donne environ 224 bar. La baisse de pression peut donc provenir du refroidissement sans
      perte de gaz.'
- id: n4-materiel-robinet-schema-001
  type: mcq
  deck: Matériel et préparation
  levels:
