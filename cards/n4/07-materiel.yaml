      ; ancien lien PDF redirige, aucune lecture intégrale revendiquée ; contrôle 2026-10-12
    - 'Revue individuelle : docs/reviews/n4/LOT_20_MATERIEL.md'
    fact_check: pass
  fr:
    question: Dans un compresseur multi-étages, quel est l’intérêt de refroidir le gaz avant qu’il entre
      dans l’étage suivant ?
    choices:
    - text: Réduire sa température et le travail nécessaire à la compression suivante
      correct: true
    - text: Augmenter sa température et faciliter ainsi la compression suivante
      correct: false
    - text: Maintenir sa température pour empêcher la condensation de l’humidité
      correct: false
    explanation: 'La compression échauffe le gaz. Le refroidisseur transfère de la chaleur vers l’air
      ambiant ou un circuit d’eau ; un gaz refroidi demande moins de travail pour la compression suivante
      vers une même pression finale. Une ventilation insuffisante limite cette évacuation de chaleur.
      Le refroidissement peut aussi provoquer une condensation : les séparateurs et les purges traitent
      alors les liquides recueillis.'
- id: n4-materiel-compresseur-condensats-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N4
  status: reviewed
  review:
