  fr:
    question: Dans une station de gonflage, quelle distinction décrit le traitement de l’eau par le séparateur
      de condensats et par le tamis moléculaire de la cartouche ?
    choices:
    - text: Le séparateur retire l’eau liquide ; le tamis adsorbe l’humidité résiduelle du gaz
      correct: true
    - text: Le séparateur adsorbe la vapeur d’eau ; le tamis recueille l’eau liquide
      correct: false
    explanation: 'Le séparateur retire principalement des liquides du flux, puis ses purges les évacuent.
      Il ne garantit pas l’élimination des contaminants sous forme de vapeur ou de gaz. Les agents de
      la cartouche ont des fonctions distinctes : tamis moléculaire pour l’humidité résiduelle, charbon
      actif pour des vapeurs d’huile et odeurs ; certaines cartouches comportent aussi un catalyseur transformant
      le CO en CO2. Le contenu dépend du modèle et de l’usage.'
- id: n4-materiel-compresseur-soupape-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N4
  status: reviewed
  review:
