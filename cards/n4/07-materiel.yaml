      aucun seuil opérationnel de gonflage
    - 'Revue individuelle : docs/reviews/n4/LOT_21_MATERIEL.md'
    fact_check: pass
  fr:
    question: 'La fiche de suivi d’une station fixe le remplacement de sa cartouche au premier terme atteint
      : 30 heures de fonctionnement ou 3 mois après installation. Elle a fonctionné 18 heures depuis son
      installation il y a 4 mois. Que conclure sur cette échéance ?'
    choices:
    - text: 'L’échéance est dépassée : le remplacement doit précéder le gonflage'
      correct: true
    - text: 'L’échéance reste valable : il reste 12 heures de fonctionnement'
      correct: false
    - text: L’échéance est dépassée seulement après 30 heures et 3 mois réunis
      correct: false
    explanation: Le premier terme atteint suffit. Le délai calendaire de 3 mois est dépassé même si la
      durée de fonctionnement n’atteint pas 30 heures. Ces valeurs appartiennent à la fiche fictive donnée
      ; les limites réelles dépendent de la cartouche, de la machine et de ses conditions d’utilisation.
      Le suivi d’une station ne se résume donc pas au compteur horaire.
