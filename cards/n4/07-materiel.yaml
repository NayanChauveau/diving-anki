    - '2026-10-12 : schéma SVG fonctionnel original, critique des connexions et forces : docs/reviews/n4/LOT_103_SCHEMAS.md
      ; CODEP92 compresseur p.1–3 ; BAUER systèmes multi-étages ; schéma de compression, séparateurs et
      épuration non représentés.'
    - '2026-10-12 : lot107, libellés du SVG agrandis et raccourcis après inspection mobile ; sens des
      circuits et forces conservés ; docs/reviews/n4/LOT_107_LISIBILITE.md'
    fact_check: pass
  fr:
    question: Une station comporte trois cylindres de compression reliés en série, avec refroidissement
      entre eux. Comment évolue le gaz lors de son passage dans ces trois étages ?
    choices:
    - text: Chaque étage comprime le gaz reçu du précédent à une pression plus élevée
      correct: true
    - text: Chaque étage aspire séparément l’air ambiant et leurs débits s’additionnent
      correct: false
    - text: Le premier étage comprime le gaz et les suivants le stockent à cette même pression
      correct: false
    explanation: 'Les étages en série réalisent une élévation progressive de pression : la sortie du premier
      alimente l’entrée du deuxième, puis du troisième. Le refroidissement intermédiaire évacue une partie
      de la chaleur produite. Des cylindres de compression ne sont pas des bouteilles tampons. Le débit
      ne se calcule pas en additionnant les volumes déplacés de tous les étages, car le même flux traverse
      des pressions différentes.


      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" role="img" aria-label="Schéma fonctionnel
      : compression-serie" style="width:100%;max-width:620px;height:auto;background:#fff"><defs><marker
      id="compression-serie-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path
      d="M0 0 L8 4 L0 8" fill="#235a78"/></marker></defs><g font-family="sans-serif" font-size="20" fill="#16394a"><rect
      x="15" y="70" width="150" height="55" rx="8" fill="#eaf5fa" stroke="#235a78" stroke-width="2"/><text
      x="90.0" y="103.5" text-anchor="middle">Étage 1</text><rect x="235" y="70" width="150" height="55"
      rx="8" fill="#eaf5fa" stroke="#235a78" stroke-width="2"/><text x="310.0" y="103.5" text-anchor="middle">Étage
      2</text><rect x="455" y="70" width="150" height="55" rx="8" fill="#eaf5fa" stroke="#235a78" stroke-width="2"/><text
      x="530.0" y="103.5" text-anchor="middle">Étage 3</text><path d="M165 98H225" fill="none" stroke="#235a78"
      stroke-width="3" marker-end="url(#compression-serie-a)"/><path d="M385 98H445" fill="none" stroke="#235a78"
      stroke-width="3" marker-end="url(#compression-serie-a)"/><text x="90" y="45" text-anchor="middle">Air
      ambiant entrant</text><text x="310" y="158" text-anchor="middle">Refroidissement entre les étages</text><text
      x="310" y="195" text-anchor="middle">Pression de sortie : P1 &lt; P2 &lt; P3</text><text x="310"
      y="225" text-anchor="middle">Même flux, trois compressions en série</text></g></svg>'
- id: n4-materiel-compresseur-refroidissement-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.28–29 ; N4-S11 Jourdren matériel p.24–30 ; N4-S40 fiche compresseur
      Poincelet p.1–3 ; relus 2026-10-12
