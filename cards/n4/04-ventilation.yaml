    - 'Revue individuelle : docs/reviews/n4/LOT_11_VENTILATION.md'
    fact_check: pass
  fr:
    question: Quel phénomène correspond précisément à l’hématose pulmonaire ?
    choices:
    - text: Les échanges d’O2 et de CO2 entre l’air alvéolaire et le sang
      correct: true
    - text: Le renouvellement de l’air alvéolaire par inspiration et expiration
      correct: false
    - text: L’utilisation d’O2 par les cellules pour leur production d’énergie
      correct: false
    explanation: La ventilation renouvelle l’air ; l’hématose est l’échange des gaz dans les poumons,
      qui oxygène le sang et élimine du CO2. La respiration cellulaire utilise l’oxygène au niveau des
      cellules. Ces étapes sont liées mais désignent des opérations différentes.
