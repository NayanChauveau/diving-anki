  fr:
    question: 'Sur cette coupe simplifiée, quelles parois composent la barrière traversée par l’oxygène
      à l’interface A ?


      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-label="Schéma anatomique
      simplifié avec repères à identifier" style="width:100%;max-width:600px;height:auto;background:#fff"><g
      font-family="sans-serif" font-size="20" fill="#18394a"><rect x="35" y="45" width="210" height="170"
      rx="18" fill="#e7f3f7"/><rect x="275" y="45" width="285" height="170" rx="18" fill="#fae5e2"/><path
      d="M250 50 V210 M270 50 V210" stroke="#18394a" stroke-width="3"/><text x="90" y="130">Air alvéolaire</text><text
      x="365" y="130">Sang</text><path d="M260 25 V78" stroke="#18394a" stroke-width="2"/><text x="295"
      y="30">Interface A</text><ellipse cx="370" cy="175" rx="24" ry="12" fill="#cf7164"/><ellipse cx="470"
      cy="80" rx="24" ry="12" fill="#cf7164"/></g></svg>'
    choices:
    - text: La paroi alvéolaire et la paroi du capillaire
      correct: true
    - text: La plèvre viscérale et la plèvre pariétale
      correct: false
    - text: La paroi bronchique et la paroi du capillaire
      correct: false
    explanation: L’oxygène diffuse de l’air alvéolaire vers le sang à travers une très fine barrière associant
      notamment l’épithélium alvéolaire et l’endothélium capillaire. Les plèvres entourent le poumon ;
      les bronches conduisent l’air. Ni les plèvres ni la paroi d’une bronche ne constituent cette interface
      d’échange alvéolaire.
