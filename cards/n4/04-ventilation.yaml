    fact_check: pass
  fr:
    question: Quel volume pulmonaire n’est pas directement mesurable par une spirométrie simple des gaz
      inspirés et expirés ?
    choices:
    - text: Le volume résiduel
      correct: true
    - text: Le volume de réserve expiratoire
      correct: false
    - text: Le volume courant
      correct: false
    explanation: 'Le volume résiduel reste après une expiration maximale : il ne traverse pas le spiromètre.
      Sa mesure demande une méthode complémentaire, par exemple dilution de gaz ou pléthysmographie. La
      réserve expiratoire et le volume courant peuvent être mobilisés et mesurés par spirométrie. L’espace
      mort est un volume des voies conductrices, pas le volume résiduel.'
- id: n4-ventilation-regulation-co2-001
  type: mcq
  deck: Anatomie et physiologie
  levels:
  - N4
  status: reviewed
  review:
