    fact_check: pass
  fr:
    question: 'Sur ce schéma des voies conductrices, quels conduits correspondent respectivement à A,
      B et C ?


      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" aria-label="Schéma anatomique
      simplifié avec repères à identifier" style="width:100%;max-width:600px;height:auto;background:#fff"><g
      font-family="sans-serif" font-size="20" fill="#18394a"><g stroke="#397b94" stroke-width="14" fill="none"
      stroke-linecap="round"><path d="M300 35 V105 M300 105 L195 155 M300 105 L405 155"/><path d="M195
      155 L125 205 M195 155 L210 215 M405 155 L390 215 M405 155 L475 205" stroke-width="6"/></g><g fill="#e7f3f7"
      stroke="#397b94" stroke-width="2"><circle cx="113" cy="218" r="13"/><circle cx="135" cy="222" r="13"/><circle
      cx="210" cy="235" r="13"/><circle cx="390" cy="235" r="13"/><circle cx="465" cy="222" r="13"/><circle
      cx="487" cy="218" r="13"/></g><text x="275" y="25">Vers la bouche</text><text x="325" y="78">A</text><text
      x="425" y="143">B</text><path d="M490 180 L455 190" stroke="#18394a" stroke-width="2"/><text x="495"
      y="180">C</text></g></svg>'
    choices:
    - text: Trachée, bronche, bronchiole
      correct: true
    - text: Larynx, trachée, bronche
      correct: false
    - text: Trachée, bronchiole, bronche
      correct: false
    explanation: La trachée se divise en deux bronches principales. Leurs ramifications de plus petit
      calibre comprennent les bronchioles, qui conduisent vers la zone alvéolaire. Le larynx se situe
      en amont de la trachée ; il n’est pas le conduit qui se partage en deux bronches.
