      et https://training.seer.cancer.gov/anatomy/digestive/regions/pharynx.html ; position postérieure
      et fausse route ; consultés 2026-10-12'
    fact_check: pass
  fr:
    question: Dans le cou, quel conduit se situe immédiatement derrière la trachée et conduit les aliments
      vers l’estomac ?
    choices:
    - text: L’œsophage
      correct: true
    - text: Le pharynx
      correct: false
    - text: Le larynx
      correct: false
    explanation: L’œsophage descend derrière la trachée et rejoint l’estomac. Le pharynx, en amont, est
      un carrefour commun à l’air et aux aliments. Le larynx conduit l’air vers la trachée ; une fausse
      route peut faire passer aliments ou liquides dans cette voie aérienne.
