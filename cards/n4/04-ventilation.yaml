      ; Respiratory System, réchauffement/humidification par bouche et voies aériennes : https://www.nhlbi.nih.gov/health/lungs/respiratory-system
      ; consultés 2026-10-12'
    - 'DAN — Simon Mitchell, The Physiology of Compressed-Gas Diving, 01/08/2016, Mechanics / Net Effects
      of Respiratory Alterations : https://dan.org/alert-diver/article/the-physiology-of-compressed-gas-diving/
      ; relecture 2026-10-12 ; modèle hydrostatique original'
    - 'Revue individuelle : docs/reviews/n4/LOT_13_VENTILATION.md'
    fact_check: pass
  fr:
    question: À l’air, au repos hors de l’eau, chez un adulte sain dont l’oxygénation reste normale, quel
      changement tend à augmenter la commande ventilatoire ?
    choices:
    - text: Une hausse du CO2 artériel
      correct: true
    - text: Une baisse du CO2 artériel
      correct: false
    - text: Une hausse de l’O2 artériel
      correct: false
    explanation: Les chémorécepteurs participent à l’ajustement de la ventilation en fonction notamment
      du CO2, de l’acidité et, pour les récepteurs périphériques, de l’O2. Étirement et irritation mobilisent
      d’autres familles de capteurs. Une pression d’O2 suffisante n’empêche pas une rétention de CO2 ;
      la ventilation ne répond pas au seul manque d’oxygène.
- id: n4-ventilation-cercle-vicieux-001
  type: mcq
  deck: Anatomie et physiologie
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.26 ; N4-S16 — Jourdren appareil respiratoire p.7,9,14–17,21–22 ; confrontés
      aux primaires le 2026-10-12
