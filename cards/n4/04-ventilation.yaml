  fr:
    question: Quand la cage thoracique s’agrandit à l’inspiration, quel mécanisme entraîne normalement
      l’expansion des poumons ?
    choices:
    - text: Le couplage entre paroi thoracique et poumon par les feuillets pleuraux
      correct: true
    - text: La contraction du tissu pulmonaire sous l’action du nerf phrénique
      correct: false
    - text: L’action du surfactant dans la cavité entre les feuillets pleuraux
      correct: false
    explanation: 'La plèvre pariétale tapisse la paroi thoracique, la plèvre viscérale recouvre le poumon.
      Leur apposition et le fin film liquidien participent au couplage mécanique tout en facilitant le
      glissement. Les poumons ne sont pas des muscles : le nerf phrénique commande le diaphragme. Le surfactant
      agit dans les alvéoles, où il réduit la tension superficielle.'
