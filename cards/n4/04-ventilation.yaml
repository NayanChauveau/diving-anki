  fr:
    question: 'Modèle simplifié : un second étage fournit du gaz à la pression de l’eau à la bouche. La
      bouche est à 20 m et le centre des poumons à 20,3 m. Surface à 1 bar, +1 bar/10 m ; on néglige les
      résistances du matériel. Quelle différence pression du gaz − pression extérieure au centre des poumons
      obtient-on ?'
    choices:
    - text: '−0,03 bar : charge inspiratoire supplémentaire'
      correct: true
    - text: '+0,03 bar : charge expiratoire supplémentaire'
      correct: false
    - text: '−0,30 bar : charge inspiratoire supplémentaire'
      correct: false
    explanation: 'La bouche est à 3 bar, le centre des poumons à 3,03 bar. La différence vaut −0,03 bar
      : le gaz est fourni sous une pression inférieure à l’eau autour du thorax, ce qui ajoute une charge
      à l’inspiration. Inverser l’ordre des profondeurs changerait le signe. −0,30 bar correspondrait
      à 3 m d’écart, pas 0,3 m.'
