      L105 153.00 L107 156.91 L109 160.73 L111 164.35 L113 167.69 L115 170.68 L117 173.23 L119 175.28
      L121 176.78 L123 177.69 L125 178.00 L127 177.69 L129 176.78 L131 175.28 L133 173.23 L135 170.68
