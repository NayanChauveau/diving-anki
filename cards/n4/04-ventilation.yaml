  fr:
    question: Quand l’expiration devient active à l’effort, quel groupe musculaire contribue à comprimer
      le thorax et à chasser l’air ?
    choices:
    - text: Les abdominaux et les intercostaux internes
      correct: true
    - text: Le diaphragme et les intercostaux externes
      correct: false
    explanation: Les abdominaux augmentent la pression abdominale et repoussent le diaphragme vers le
      haut ; des intercostaux internes abaissent les côtes. À l’inverse, diaphragme et intercostaux externes
      participent surtout à l’inspiration. Au repos hors de l’eau, l’expiration calme repose principalement
      sur le recul élastique ; à l’effort et face aux résistances ventilatoires, elle peut devenir active.
