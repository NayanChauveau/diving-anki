      L153 138.31 L155 135.32 L157 132.77 L159 130.72 L161 129.22 L163 128.31 L165 128.00 L167 128.31
      L169 129.22 L171 130.72 L173 132.77 L175 135.32 L177 138.31 L179 141.65 L181 145.27 L183 149.09
      L185 153.00 L187 156.91 L189 160.73 L191 164.35 L193 167.69 L195 170.68 L197 173.23 L199 175.28
      L201 176.78 L203 177.69 L205 178.00 L207 177.69 L209 176.78 L211 175.28 L213 173.23 L215 170.68
      L217 167.69 L219 164.35 L221 160.73 L223 156.91 L225 153.00 Q255 40 275 40 Q320 40 350 232 Q385
      252 420 153 Q440 120 460 153 T500 153 T540 153" fill="none" stroke="#397b94" stroke-width="4"/><path
      d="M110 128 H225 M110 178 H225" stroke="#7395a6" stroke-width="1" stroke-dasharray="4 4"/><path
      d="M215 128 V178 M209 128 H221 M209 178 H221" stroke="#ad5a21" stroke-width="3"/><text x="226" y="162">A</text><text
      x="70" y="212">Cycles calmes</text><text x="260" y="24">Maximum inspiré</text><text x="370" y="251">Maximum
      expiré</text></g></svg>'
    choices:
    - text: Le volume courant
      correct: true
    - text: Le volume de réserve expiratoire
      correct: false
    - text: Le volume résiduel
      correct: false
    explanation: Le volume courant est le volume déplacé au cours d’un cycle calme. La réserve expiratoire
      est le volume supplémentaire expiré au-delà d’une expiration calme. Le volume résiduel reste dans
      les poumons après une expiration maximale ; il n’est pas l’amplitude d’un cycle.
- id: n4-ventilation-capacite-vitale-001
  type: mcq
  deck: Anatomie et physiologie
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.26 ; N4-S16 — Jourdren appareil respiratoire p.13–19 ; contrôlés 2026-10-12
    - 'NHLBI — Breathing Benefits, 27/06/2025, inspiration et expiration repos/effort : https://www.nhlbi.nih.gov/health/lungs/breathing-benefits
      ; contrôlé 2026-10-12'
    - 'ARTP — Statement on pulmonary function testing 2020, sections static lung volumes et vital capacity
      : https://pmc.ncbi.nlm.nih.gov/articles/PMC7337892/ ; consulté 2026-10-12 ; aucun seuil diagnostique
      repris'
    - 'Volumes et schéma originaux : valeurs d’exercice, pas normes de volumes individuels ; docs/diagrams/n4/volumes-pulmonaires.svg'
    - 'Revue individuelle : docs/reviews/n4/LOT_12_VENTILATION.md'
    fact_check: pass
  fr:
    question: 'Un exercice donne : volume courant 0,6 L ; réserve inspiratoire 2,4 L ; réserve expiratoire
      1,1 L ; volume résiduel 1,3 L. Quelle est la capacité vitale ?'
    choices:
    - text: 4,1 L
      correct: true
    - text: 5,4 L
      correct: false
    - text: 3,0 L
      correct: false
    explanation: 'La capacité vitale comprend le volume courant et les deux réserves : 0,6 + 2,4 + 1,1
      = 4,1 L. Ajouter le volume résiduel donnerait la capacité pulmonaire totale, 5,4 L. Les 3 L ne représentent
      que la capacité inspiratoire, volume courant plus réserve inspiratoire.'
