  fr:
    question: Lorsqu’on respire l’air sec du détendeur par la bouche, que deviennent le réchauffement
      et l’humidification du gaz inspiré ?
    choices:
    - text: Ils continuent dans les voies aériennes, avec transfert de chaleur et d’eau
      correct: true
    - text: Ils cessent dans les voies aériennes, car le gaz ne traverse plus les fosses nasales
      correct: false
    explanation: 'Contourner le nez ne supprime pas le conditionnement de l’air : la bouche et les voies
      aériennes réchauffent et humidifient encore le gaz. Ces transferts utilisent de la chaleur et de
      l’eau de l’organisme. L’air sec du bloc peut donc contribuer aux pertes respiratoires, sans que
      l’humidification soit devenue inexistante.'
