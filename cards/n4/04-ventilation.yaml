    - 'Revue individuelle : docs/reviews/n4/LOT_12_VENTILATION.md'
    fact_check: pass
  fr:
    question: Lors d’une inspiration calme hors de l’eau, quelle séquence décrit l’action du diaphragme
      et l’entrée d’air ?
    choices:
    - text: Contraction et abaissement du diaphragme ; volume thoracique accru ; pression alvéolaire abaissée
      correct: true
    - text: Relâchement et abaissement du diaphragme ; volume thoracique accru ; pression alvéolaire abaissée
      correct: false
    - text: Contraction et abaissement du diaphragme ; volume thoracique accru ; pression alvéolaire augmentée
      correct: false
    explanation: Le diaphragme se contracte, s’aplatit et s’abaisse. Le volume du thorax et des poumons
      augmente ; pendant l’entrée d’air, la pression alvéolaire devient légèrement inférieure à celle
      de l’air extérieur. Son relâchement participe au retour expiratoire. Une pression alvéolaire supérieure
      à l’extérieur pousserait l’air vers la sortie.
