    question: 'Sur ce schéma de volumes pulmonaires, que représente l’amplitude A des oscillations calmes
      ?


      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Courbe schématique
