      ; Respiratory System, réchauffement/humidification par bouche et voies aériennes : https://www.nhlbi.nih.gov/health/lungs/respiratory-system
      ; consultés 2026-10-12'
    - 'DAN — Simon Mitchell, The Physiology of Compressed-Gas Diving, 01/08/2016, Mechanics / Net Effects
      of Respiratory Alterations : https://dan.org/alert-diver/article/the-physiology-of-compressed-gas-diving/
      ; relecture 2026-10-12 ; modèle hydrostatique original'
    - 'Revue individuelle : docs/reviews/n4/LOT_13_VENTILATION.md'
    fact_check: pass
  fr:
    question: Dans un modèle, chaque inspiration ventile 150 mL de voies conductrices. Un plongeur passe
      de 15 inspirations de 600 mL par minute à 30 inspirations de 300 mL. La profondeur et l’effort de
      palmage restent les mêmes, mais le travail des muscles respiratoires augmente. Quel bilan peut entretenir
      la rétention de CO2 ?
    choices:
    - text: Le débit alvéolaire baisse ; le travail respiratoire peut produire davantage de CO2
      correct: true
    - text: Le débit alvéolaire reste identique ; le travail respiratoire accru élimine davantage de CO2
      correct: false
    explanation: Le débit total reste 9 L/min, mais le débit alvéolaire passe de (600 − 150) × 15 = 6,75
      L/min à (300 − 150) × 30 = 4,5 L/min. Les muscles respiratoires qui travaillent davantage produisent
      aussi du CO2. Moins de renouvellement alvéolaire face à cette production favorise sa rétention ;
      le CO2 stimule alors la commande ventilatoire, ce qui peut entretenir le travail respiratoire et
      l’essoufflement.
