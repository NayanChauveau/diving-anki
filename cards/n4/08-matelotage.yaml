  fr:
    question: Sur une carte marine, l’écart entre deux points reporté sur l’échelle des latitudes au niveau
      du trajet vaut 2,5 minutes. Quelle distance cela représente-t-il, en milles nautiques et en kilomètres
      ? Pour cette lecture, une minute de latitude correspond à un mille nautique ; 1 mille = 1 852 m.
    choices:
    - text: 2,5 milles, soit 4,63 km
      correct: true
    - text: 2,5 milles, soit 2,50 km
      correct: false
    - text: 150 milles, soit 277,80 km
      correct: false
    explanation: 'Une minute de latitude correspond à un mille nautique pour cette mesure sur la carte
      : 2,5 minutes donnent 2,5 milles. La conversion vaut 2,5 × 1,852 = 4,63 km. Le deuxième choix confond
      mille et kilomètre ; le troisième traite les 2,5 minutes comme des degrés en multipliant par 60.
      L’échelle des longitudes ne remplace pas celle des latitudes pour cette mesure.'
