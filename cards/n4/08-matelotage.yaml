  fr:
    question: Une carte indique une sonde de 12,4 m sous le zéro hydrographique. À l’heure prévue, la
      marée est de +3,1 m par rapport à ce même zéro. Quelle hauteur d’eau prévisible obtient-on ? Négliger
      les autres variations du niveau de la mer.
    choices:
    - text: 15,5 m
      correct: true
    - text: 9,3 m
      correct: false
    - text: 12,4 m
      correct: false
    explanation: 'La hauteur d’eau vaut sonde plus hauteur de marée : 12,4 + 3,1 = 15,5 m. Soustraire
      la marée donnerait 9,3 m, et garder 12,4 m ignorerait le niveau supérieur au zéro commun. Le résultat
      concerne l’heure indiquée : la profondeur évolue avec la marée.'
- id: n4-matelotage-parachute-ancre-001
  type: mcq
