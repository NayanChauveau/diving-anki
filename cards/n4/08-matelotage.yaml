  fr:
    question: On connaît les coordonnées d’une épave, mais on veut aussi vérifier son relief sous le bateau
      avant la mise à l’eau. Quelle répartition des tâches convient aux deux instruments ?
    choices:
    - text: 'GPS : rejoindre les coordonnées ; sondeur : observer les échos du relief'
      correct: true
    - text: 'GPS : observer les échos du relief ; sondeur : rejoindre les coordonnées'
      correct: false
    - text: 'GPS : rejoindre les coordonnées ; sondeur : mesurer seulement la hauteur de marée'
      correct: false
    explanation: Le GPS fournit une position géographique permettant de rejoindre un point enregistré.
      Un sondeur acoustique mesure le temps de retour d’échos et donne des informations sur le fond sous
      sa zone de mesure ; il peut aider à reconnaître une structure. Ces échos demandent une interprétation
      et ne prouvent pas à eux seuls l’identité d’une épave. La hauteur de marée relève d’un référentiel
      de niveau, pas seulement de la distance mesurée au fond.
- id: n4-matelotage-carte-symboles-001
  type: mcq
  deck: Matelotage et repérage
  levels:
  - N4
  status: reviewed
  review:
    sources:
