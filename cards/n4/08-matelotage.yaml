    - 'Revue individuelle : docs/reviews/n4/LOT_28_MATELOTAGE.md'
    fact_check: pass
  fr:
    question: Sur un taquet à deux cornes, quelle séquence décrit une fixation classique avec terminaison
      bloquante ?
    choices:
    - text: Tour autour de la base, croisements entre les cornes, demi-clé de blocage sur une corne
      correct: true
    - text: Tour autour de la base, demi-clés autour du dormant, extrémité laissée près des cornes
      correct: false
    - text: Tour autour de la base, croisements entre les cornes, extrémité passée simplement sous le
        taquet
      correct: false
    explanation: Le tour à la base reçoit la traction, les croisements répartissent la tenue entre les
      cornes, et une demi-clé finale correctement orientée bloque le brin libre. Les deux demi-clés autour
      du dormant relèvent d’un autre amarrage. Passer simplement le brin sous le taquet ne remplace pas
      la terminaison bloquante. Le geste doit être appris et réalisé avec un cordage et un taquet adaptés.
- id: n4-matelotage-ragage-001
  type: mcq
  deck: Matelotage et repérage
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.20 ; N4-S58 Foubert p.8,14–18 et marées ; lecture critique 2026-10-12
    - SHOM — Guide des levés hydrographiques V2.3 30 mars 2026, réduction au zéro hydrographique, https://services.data.shom.fr/static/specifications/Guide_Leves_hydrographiques_V2.3-20260330.pdf
      ; INT1 édition 7 2019, sondes et marées, https://services.data.shom.fr/static/legends/ASSEMBLAGE_DES_CARTES_MARINES_RASTERMARINE/001DNOA.pdf
      ; repères consultés 2026-10-12
    - Montages décrits fictifs, pas de ratio universel de longueur de mouillage, pas de procédure générale
      de relevage pneumatique ; rôle du pilote conservé
    - 'Revue individuelle : docs/reviews/n4/LOT_29_MATELOTAGE.md'
    - Rocna fabricant — Rode https://users.rocna.com/docs/rode/ et Scope vs Catenary https://rocna.com/faqs/scope-vs-catenary-what-really-matters-when-anchoring-with-a-rocna/
      ; limites de la chaînette en forte traction, consulté 2026-10-12
    fact_check: pass
  fr:
    question: Une amarre saine frotte sur une arête à chaque mouvement du bateau. Quelle mesure agit sur
      la cause du ragage sans remplacer la fonction d’amarrage ?
    choices:
    - text: Protéger le point de contact ou modifier le cheminement pour éviter l’arête
      correct: true
    - text: Augmenter la tension de l’amarre pour compenser l’usure au point de contact
      correct: false
    - text: Ajouter des tours au nœud terminal pour compenser l’usure au point de contact
      correct: false
    explanation: Le ragage est l’usure par frottement. Une protection adaptée au point de contact, ou
      un cheminement supprimant l’arête, agit sur cette cause. Serrer davantage l’amarre ou multiplier
      les tours au nœud ne répare pas une abrasion. Le cordage et la protection doivent être surveillés,
      et une amarre déjà détériorée ne devient pas saine par ajout d’une gaine.
- id: n4-matelotage-ligne-mouillage-001
  type: mcq
  deck: Matelotage et repérage
  levels:
  - N4
  status: reviewed
  review:
    sources:
