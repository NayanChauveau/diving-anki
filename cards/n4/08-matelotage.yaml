  fr:
    question: Le pilote prévoit d’utiliser une garde pour contrôler l’écartement du bateau du quai. Vous
      êtes chargé des amarres ; aucune instruction de largage n’a encore été donnée. Quelle conduite respecte
      cette manœuvre ?
    choices:
    - text: Garder la garde en place, préparer les autres amarres et attendre l’ordre de largage
      correct: true
    - text: Larguer la garde en premier, préparer les autres amarres et attendre l’ordre de propulsion
      correct: false
    - text: Larguer toutes les amarres, garder la garde à la main et attendre l’ordre de propulsion
      correct: false
    explanation: La garde prévue fait partie du dispositif choisi par le pilote pour contrôler le mouvement
      du bateau. L’équipier prépare sa tâche et largue sur instruction, puis récupère les cordages pour
      qu’ils restent clairs de l’hélice. Larguer prématurément la garde change le montage sur lequel le
      pilote comptait ; la tenir seulement à la main ne remplace pas une garde frappée pour recevoir l’effort
      prévu.
