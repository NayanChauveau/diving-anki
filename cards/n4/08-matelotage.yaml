cards:
- id: n4-matelotage-chaise-001
  type: mcq
  deck: Matelotage et repérage
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.20, nœuds usuels en situations réalistes ; N4-S58 Foubert Matelotage
      p.8–10 et annexes p.25–28 ; p.26 représentation cabestan/alouette inspectée visuellement 2026-10-12
    - 'Orléans Voile, club producteur du support Les 6 nœuds importants : https://www.orleansvoile.fr/fichiers/CCC_6_Noeuds.pdf
      ; chaise/cabestan/huit/taquet recoupés 2026-10-12 ; aucun schéma de tiers copié'
    - Questions théoriques préparatoires au geste ; choix de nœuds usuels parmi des fonctions différentes,
      aucun nœud présenté comme fixation universelle de sécurité
    - 'Revue individuelle : docs/reviews/n4/LOT_28_MATELOTAGE.md'
    fact_check: pass
  fr:
    question: On veut réaliser à l’extrémité d’un cordage une boucle de taille fixe, sans réunir deux
      cordages. Quel nœud usuel répond à cet objectif ?
    choices:
    - text: Un nœud de chaise
      correct: true
    - text: Un nœud d’écoute
      correct: false
    - text: Un nœud plat
      correct: false
    explanation: 'Le nœud de chaise forme une boucle fixe : sa taille ne se resserre pas comme celle d’un
      nœud coulant. Le nœud d’écoute sert à réunir deux cordages, notamment de diamètres différents ;
      le nœud plat réunit deux brins dans un usage adapté. Ces deux derniers ne réalisent pas à eux seuls
      la boucle terminale demandée.'
- id: n4-matelotage-cabestan-001
  type: mcq
  deck: Matelotage et repérage
  levels:
  - N4
  status: reviewed
  review:
