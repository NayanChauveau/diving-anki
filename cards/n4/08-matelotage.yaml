    fact_check: pass
  fr:
    question: Dans un mouillage mixte ancre–chaîne–câblot, quel mécanisme du poids de la chaîne peut réduire
      l’angle de traction sur l’ancre lorsque la ligne n’est pas tendue en ligne droite ?
    choices:
    - text: La chaîne forme une courbe et maintient la traction plus proche de l’horizontale
      correct: true
    - text: La chaîne s’allonge élastiquement et maintient la traction plus proche de l’horizontale
      correct: false
    explanation: 'Le poids de la chaîne favorise une courbe de la ligne : l’effort sur l’ancre peut rester
      plus horizontal qu’avec une ligne tendue directement vers le bateau. Quand la traction augmente,
      la ligne peut se tendre et cet effet se réduire. Le câblot apporte notamment une élasticité différente
      de celle de la chaîne ; la tenue dépend aussi du fond, de l’ancre et du dimensionnement de l’ensemble.'
