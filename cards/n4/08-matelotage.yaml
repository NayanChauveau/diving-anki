  fr:
    question: Dans une organisation avec courant, on prévoit un appui pour tenir un palier près du bateau
      et un cordage flottant pour rejoindre le bateau en surface. Quelle association correspond à ces
      deux usages ?
    choices:
    - text: 'Palier : pendeur ; surface : ligne de vie'
      correct: true
    - text: 'Palier : ligne de vie ; surface : pendeur'
      correct: false
    explanation: Le pendeur offre un support sous le bateau, utilisable lors de l’immersion, de la remontée
      ou d’un palier selon l’organisation. Une ligne de vie flottante permet de rester relié à un point
      de récupération en surface et de progresser vers celui-ci. Son implantation dépend du bateau et
      du courant ; elle doit faire partie de la consigne de récupération donnée aux plongeurs.
- id: n4-matelotage-rappel-reception-001
  type: mcq
  deck: Matelotage et repérage
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.20 ; N4-S58 Foubert p.17–23, rappel/repérage, relus 2026-10-12
    - MFT GP p.17–18 conduite collective et désaturation, paramètres et consignes ; appareil GPS/sondeur
      uniquement pour repérage, aucune délégation au GP de la conduite du bateau
    - Exercice d’alignements original docs/diagrams/n4/alignements-amers.svg ; géométrie plane fictive
      et points distincts, aucun site réel
    - 'Revue individuelle : docs/reviews/n4/LOT_30_MATELOTAGE.md'
    fact_check: pass
  fr:
    question: Le signal convenu rappelle immédiatement les palanquées vers la surface. Votre palanquée
      a des paliers obligatoires indiqués par ses ordinateurs et aucun accident ne nécessite une procédure
      d’urgence différente. Quelle conduite appliquez-vous ?
    choices:
    - text: Interrompre l’exploration et effectuer la remontée avec les paliers obligatoires
      correct: true
    - text: Interrompre l’exploration et remplacer les paliers obligatoires par le palier de sécurité
      correct: false
    - text: Interrompre l’exploration et appliquer la durée de remontée sans palier prévue au briefing
      correct: false
    explanation: Le rappel met fin à l’exploration et déclenche le retour suivant les consignes convenues.
      Il ne supprime pas les obligations de décompression dues au profil réellement effectué. Un palier
      de sécurité facultatif ne remplace pas les paliers obligatoires ; une estimation du briefing ne
      remplace pas les données actualisées du profil et des ordinateurs.
- id: n4-matelotage-amer-alignements-001
  type: mcq
  deck: Matelotage et repérage
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.20 ; N4-S58 Foubert p.17–23, rappel/repérage, relus 2026-10-12
    - MFT GP p.17–18 conduite collective et désaturation, paramètres et consignes ; appareil GPS/sondeur
      uniquement pour repérage, aucune délégation au GP de la conduite du bateau
    - Exercice d’alignements original docs/diagrams/n4/alignements-amers.svg ; géométrie plane fictive
      et points distincts, aucun site réel
    - 'Revue individuelle : docs/reviews/n4/LOT_30_MATELOTAGE.md'
    fact_check: pass
  fr:
    question: 'Depuis le bateau, B masque A et D masque C. Quelle position parmi 1, 2, 3 et 4 correspond
      simultanément à ces deux alignements sur ce plan ? Les amers et les positions sont des points.


      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-label="Plan de quatre
      amers A B C D sur la côte et quatre positions 1 2 3 4 en mer ; A B sont sur la verticale passant
      par 1 et 2 ; C D sur la diagonale passant par 2 et 3" style="width:100%;max-width:560px;background:white"><path
      d="M35 105 H530" stroke="#397b94" stroke-width="3"/><g fill="#18394a" font-family="sans-serif" font-size="22"><circle
      cx="170" cy="25" r="6"/><circle cx="170" cy="85" r="6"/><circle cx="290" cy="25" r="6"/><circle
      cx="260" cy="85" r="6"/><text x="184" y="30">A</text><text x="184" y="85">B</text><text x="305"
      y="30">C</text><text x="274" y="85">D</text><circle cx="170" cy="135" r="6"/><text x="180" y="137">1</text><circle
      cx="170" cy="265" r="6"/><text x="180" y="267">2</text><circle cx="210" cy="185" r="6"/><text x="220"
      y="187">3</text><circle cx="330" cy="220" r="6"/><text x="340" y="222">4</text><text x="390" y="72">Terre</text><text
      x="390" y="160">Mer</text></g></svg>'
    choices:
    - text: La position 2
      correct: true
    - text: La position 1
      correct: false
    - text: La position 3
      correct: false
    explanation: A et B déterminent une première droite ; C et D en déterminent une seconde. Le bateau
      est à leur intersection, ici la position 2. La position 1 appartient au seul alignement A–B et la
      position 3 au seul alignement C–D. Un seul alignement donne une ligne de position, pas une position
      unique.
- id: n4-matelotage-gps-sonar-001
  type: mcq
  deck: Matelotage et repérage
  levels:
  - N4
  status: reviewed
  review:
