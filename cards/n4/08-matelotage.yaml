    - 'Revue individuelle : docs/reviews/n4/LOT_28_MATELOTAGE.md'
    fact_check: pass
  fr:
    question: Quel nœud autour d’un support cylindrique est constitué de deux demi-clés à capeler, avec
      un brin diagonal qui croise les tours ?
    choices:
    - text: Un nœud de cabestan
      correct: true
    - text: Un nœud de tête d’alouette
      correct: false
    - text: Un tour mort et deux demi-clés
      correct: false
    explanation: 'Le cabestan correspond à deux demi-clés à capeler autour du support : le brin diagonal
      croise les tours et retient le montage. La tête d’alouette vient d’une boucle passée autour du support,
      à travers laquelle passent les deux brins. Dans le tour mort et deux demi-clés, le tour est autour
      du support, puis les demi-clés sont réalisées autour du dormant du cordage.'
