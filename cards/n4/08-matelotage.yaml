    - 'Revue individuelle : docs/reviews/n4/LOT_28_MATELOTAGE.md'
    fact_check: pass
  fr:
    question: Pour un nœud d’arrêt terminal que l’on souhaite pouvoir défaire après serrage, quel nœud
      usuel préfère-t-on au simple demi-nœud ?
    choices:
    - text: Un nœud en huit
      correct: true
    - text: Un nœud de chaise
      correct: false
    - text: Un nœud d’écoute
      correct: false
    explanation: 'Le nœud en huit est un nœud d’arrêt usuel, généralement plus facile à défaire après
      serrage que le demi-nœud simple. La chaise forme une boucle fixe et l’écoute réunit deux cordages.
      Le choix du diamètre du cordage et de l’orifice reste nécessaire : le nœud doit effectivement empêcher
      le passage dans la situation prévue.'
- id: n4-matelotage-taquet-001
  type: mcq
  deck: Matelotage et repérage
  levels:
