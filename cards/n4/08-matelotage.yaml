    - SHOM — Guide des levés hydrographiques V2.3 30 mars 2026, réduction au zéro hydrographique, https://services.data.shom.fr/static/specifications/Guide_Leves_hydrographiques_V2.3-20260330.pdf
      ; INT1 édition 7 2019, sondes et marées, https://services.data.shom.fr/static/legends/ASSEMBLAGE_DES_CARTES_MARINES_RASTERMARINE/001DNOA.pdf
      ; repères consultés 2026-10-12
