  fr:
    question: 'Sur cette carte fictive, les hachures désignent une zone où la plongée est interdite et
      × une roche dangereuse pour le mouillage. La hauteur de marée est +2 m. Quel point présente une
      profondeur prévisible de 22 m au maximum, hors zone interdite et hors roche ? Même zéro pour sondes
      et marée.


      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-label="Carte fictive
      : zone hachurée contenant A, roche signalée par X au point B, point C en dehors de ces deux éléments
      ; sondes A20 B18 C18 mètres" style="width:100%;max-width:560px;background:white"><defs><pattern
      id="n4-zone" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12 L12 0" stroke="#aaa"
      stroke-width="1"/></pattern></defs><rect x="30" y="30" width="210" height="160" fill="url(#n4-zone)"
      stroke="#555" stroke-width="2"/><g fill="#18394a" font-family="sans-serif" font-size="22"><circle
      cx="135" cy="95" r="5"/><text x="145" y="97">A 20</text><text x="345" y="100">× B 18</text><circle
      cx="365" cy="225" r="5"/><text x="375" y="227">C 18</text><text x="25" y="280">Sondes en mètres
      sous le zéro hydrographique</text></g></svg>'
    choices:
    - text: C
      correct: true
    - text: A
      correct: false
    - text: B
      correct: false
    explanation: C présente 18 + 2 = 20 m d’eau, hors zone interdite et hors roche. A présente 20 + 2
      = 22 m d’eau, mais se trouve dans la zone interdite. B présente 18 + 2 = 20 m d’eau, mais porte
      le symbole de roche. Les trois profondeurs respectent le plafond demandé ; les informations de zone
      et de fond déterminent le choix.
