      ; limites de la chaînette en forte traction, consulté 2026-10-12
    fact_check: pass
  fr:
    question: Quelle association distingue les fonctions d’un parachute d’ancre et d’un parachute de palier
      ?
    choices:
    - text: 'Ancre : aider le relevage par poussée ; palier : signaler la palanquée en surface'
      correct: true
    - text: 'Ancre : signaler la palanquée en surface ; palier : aider le relevage par poussée'
      correct: false
    explanation: Un parachute d’ancre est un dispositif de relevage qui utilise la poussée de l’eau sur
      un volume de gaz pour soulager la charge lors d’une manœuvre prévue avec le pilote. Un parachute
      de palier signale la présence des plongeurs à la surface. Les fonctions, les charges et les montages
      diffèrent ; le second ne remplace pas un matériel de relevage dimensionné.
- id: n4-matelotage-pendeur-ligne-vie-001
  type: mcq
