    - DORIS — Brochet Esox lucius, fiche mise à jour 26 décembre 2025, biotope/alimentation https://doris.ffessm.fr/Especes/Esox-lucius-Brochet-366
      ; consulté 2026-10-12, habitat préféré sans promesse d’observation
    - 'Longitude181 — Charte internationale du plongeur responsable https://www.longitude181.org/pdf/Charte-Francais.pdf
      p.4 ; limiter contacts et maîtriser flottabilité ; consulté 2026-10-12 ; bulles sous surplomb :
      objectif explicite du cours Jourdren p.12'
    - 'Revue individuelle : docs/reviews/n4/LOT_33_ENVIRONNEMENT.md'
    fact_check: pass
  fr:
    question: Une palanquée observe une faune fixée sous un surplomb depuis l’extérieur, sans y entrer.
      L’espace latéral est libre et tous savent s’y stabiliser. Pour éviter que les bulles expirées passent
      contre le plafond habité, quel placement convient ?
    choices:
    - text: Groupe stabilisé sur le côté, hors de la verticale du surplomb
      correct: true
    - text: Groupe stabilisé sous le plafond, sans contact des mains ni des palmes
      correct: false
    explanation: 'Les bulles remontent vers la surface : rester directement sous le surplomb les dirige
      contre sa face inférieure. Une observation latérale depuis l’espace libre évite cette trajectoire,
      tout en conservant l’absence de contact des mains, des palmes et des accessoires. Le guide organise
      les positions pour garder tous les plongeurs visibles ; si l’espace ne le permet pas, il choisit
      un autre point d’observation.'
