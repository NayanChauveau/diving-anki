    fact_check: pass
  fr:
    question: Quel rôle de nurserie peut jouer un herbier de posidonie pour des poissons juvéniles ?
    choices:
    - text: Offrir des abris et des ressources favorisant leur croissance
      correct: true
    - text: Offrir uniquement un support de ponte sans rôle après l’éclosion
      correct: false
    explanation: Les feuilles et la structure de l’herbier offrent des abris et des ressources alimentaires
      à divers juvéniles. Une nurserie contribue à leur développement ; elle ne se limite pas au lieu
      où les œufs ont été déposés, et tous les poissons ne dépendent pas du même habitat aux mêmes stades.
      La perte d’un herbier affecte donc un habitat, en plus de la plante elle-même.
