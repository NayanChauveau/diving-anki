      ; CNEBS embranchements éponges https://biologie.ffessm.fr/details-sur-les-embranchements ; consultés
      2026-10-12
    - DORIS — Gorgone pourpre Paramuricea clavata, description/alimentation https://doris.ffessm.fr/Especes/Paramuricea-clavata-Gorgone-pourpre-223
      ; Poulpe commun description/divers biologie chromatophores https://doris.ffessm.fr/Especes/Octopus-vulgaris-Poulpe-commun-847
      ; consultés 2026-10-12
    - OFB — Les herbiers marins https://ofb.gouv.fr/les-herbiers-marins et Restauration des herbiers de
      Posidonie à Porquerolles https://ofb.gouv.fr/restauration-des-herbiers-de-posidonie-a-porquerolles
      ; habitat/nurserie, consultés 2026-10-12 ; figures originales sans photographie de tiers
    - 'Revue individuelle : docs/reviews/n4/LOT_32_ENVIRONNEMENT.md'
    fact_check: pass
  fr:
    question: Quelle différence de mode de vie distingue une grande claveline adulte d’un poulpe commun
      adulte ?
    choices:
    - text: La claveline reste fixée au support ; le poulpe peut se déplacer entre des refuges
      correct: true
    - text: La claveline peut changer de support ; le poulpe reste fixé à son refuge
      correct: false
    explanation: La grande claveline est une ascidie dont les individus adultes vivent fixés, reliés en
      colonie par une base commune. Le poulpe peut quitter un refuge et se déplacer avec ses bras ou par
      propulsion d’eau. Un organisme fixé peut avoir des mouvements locaux, comme fermer ses siphons,
      sans changer de lieu de vie.
- id: n4-environnement-eponge-ascidie-001
  type: mcq
  deck: Environnement
  levels:
  - N4
  status: reviewed
  review:
