      Posidonie à Porquerolles https://ofb.gouv.fr/restauration-des-herbiers-de-posidonie-a-porquerolles
      ; habitat/nurserie, consultés 2026-10-12 ; figures originales sans photographie de tiers
    - 'Revue individuelle : docs/reviews/n4/LOT_32_ENVIRONNEMENT.md'
    fact_check: pass
  fr:
    question: 'Les flèches indiquent la circulation d’eau chez ces deux animaux filtrants. Quels groupes
      correspondent aux organisations A et B ?


      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img" aria-label="Deux animaux
      filtrants : A présente deux ouvertures distinctes, entrée au sommet et sortie sur le côté ; B présente
      de nombreux petits pores d’entrée et une grande ouverture de sortie" style="width:100%;max-width:560px;background:white"><g
      fill="#d5edf1" stroke="#397b94" stroke-width="3"><path d="M120 230 V210 C70 170 90 100 120 90 V50
      H150 V95 C165 85 180 90 180 115 V140 C190 180 165 205 155 210 V230 Z"/><path d="M350 230 V110 C350
      80 370 60 395 65 V95 H425 V65 C450 60 475 90 475 115 V230 Z"/></g><g fill="none" stroke="#18394a"
      stroke-width="3"><path d="M135 10 V65 M127 53 L135 65 L143 53 M173 110 H220 M208 102 L220 110 L208
      118 M410 85 V15 M402 27 L410 15 L418 27"/><path d="M315 135 H365 M315 175 H365 M510 135 H460 M510
      175 H460"/></g><g fill="#fff" stroke="#397b94" stroke-width="2"><circle cx="354" cy="135" r="5"/><circle
      cx="354" cy="175" r="5"/><circle cx="472" cy="135" r="5"/><circle cx="472" cy="175" r="5"/></g><g
      fill="#18394a" font-family="sans-serif" font-size="22"><text x="128" y="260">A</text><text x="403"
      y="260">B</text></g></svg>'
    choices:
    - text: 'A : ascidie ; B : éponge'
      correct: true
    - text: 'A : éponge ; B : ascidie'
      correct: false
    explanation: Une ascidie possède un siphon d’entrée et un siphon de sortie ; chez la grande claveline,
      le second est latéral et légèrement plus bas. Une éponge reçoit l’eau par de nombreux petits pores
      et la rejette par des ouvertures plus grandes, les oscules. Les deux filtrent des particules de
      l’eau, mais leur organisation diffère.
