  fr:
    question: Chez la gorgone pourpre Paramuricea clavata, que sont les structures à huit tentacules pennés
      entourant une bouche, qui sortent des rameaux et capturent des particules du courant ?
    choices:
    - text: Des polypes animaux participant à l’alimentation de la colonie
      correct: true
    - text: Des feuilles végétales participant à l’alimentation de la colonie
      correct: false
    - text: Des siphons d’ascidies participant à l’alimentation de la colonie
      correct: false
    explanation: 'La gorgone pourpre est une colonie de cnidaires : les polypes capturent des particules
      organiques en suspension et les nutriments sont partagés dans la colonie. Son aspect ramifié ne
      fait pas de ses polypes des feuilles. Les ascidies filtrent avec une autre organisation à siphons
      ; elles ne constituent pas les polypes de la gorgone.'
