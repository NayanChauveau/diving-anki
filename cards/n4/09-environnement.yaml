- id: n4-environnement-fixe-mobile-001
  type: mcq
  deck: Environnement
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.6,17 ; N4-S10 Jourdren protection environnement août2024 p.9,13–22
      ; relus 2026-10-12
    - DORIS FFESSM — Grande claveline, description/siphons https://doris.ffessm.fr/Especes/Clavelina-lepadiformis-Grande-claveline-355
