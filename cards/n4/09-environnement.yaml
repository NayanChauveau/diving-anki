  fr:
    question: Quel mécanisme permet au poulpe commun de modifier rapidement sa coloration, sans changer
      de refuge ?
    choices:
    - text: La modification de taille des organes pigmentaires de la peau
      correct: true
    - text: La libération d’encre sur la peau depuis la poche à encre
      correct: false
    - text: La production rapide de nouveaux pigments dans la peau
      correct: false
    explanation: Des organes pigmentaires de la peau, les chromatophores, changent de dimension et rendent
      leurs pigments plus ou moins visibles. Cela permet des changements rapides de coloration. L’encre
      est expulsée par un autre dispositif ; produire de nouveaux pigments n’explique pas ces modifications
      rapides. La coloration observée ne suffit pas à attribuer une intention certaine à l’animal.
- id: n4-environnement-eau-douce-habitat-001
  type: mcq
  deck: Environnement
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.6,17 conduite/protection milieu ; N4-S10 Jourdren environnement août2024
      p.9,12 ; relus 2026-10-12
    - DORIS — Brochet Esox lucius, fiche mise à jour 26 décembre 2025, biotope/alimentation https://doris.ffessm.fr/Especes/Esox-lucius-Brochet-366
      ; consulté 2026-10-12, habitat préféré sans promesse d’observation
    - 'Longitude181 — Charte internationale du plongeur responsable https://www.longitude181.org/pdf/Charte-Francais.pdf
      p.4 ; limiter contacts et maîtriser flottabilité ; consulté 2026-10-12 ; bulles sous surplomb :
      objectif explicite du cours Jourdren p.12'
    - 'Revue individuelle : docs/reviews/n4/LOT_33_ENVIRONNEMENT.md'
    fact_check: pass
  fr:
    question: Dans un lac où le brochet commun est présent, quel secteur correspond le mieux à son habitat
      préféré pour une observation de jour ?
    choices:
    - text: Une zone peu profonde et calme avec végétation aquatique
      correct: true
    - text: Une zone peu profonde et rapide avec roche nue
      correct: false
    - text: Une zone profonde en pleine eau sans végétation
      correct: false
    explanation: Le brochet commun, Esox lucius, préfère des eaux calmes et peu profondes offrant un couvert
      végétal. La végétation fournit notamment des caches pour sa chasse à l’affût. Ce choix oriente l’observation
      sans garantir la présence d’un individu à cet instant. Une zone de courant rapide et une pleine
      eau profonde sans couvert ne sont pas les secteurs qui correspondent le mieux à cette préférence.
- id: n4-environnement-groupe-approche-001
  type: mcq
  deck: Environnement
  levels:
  - N4
  status: reviewed
  review:
