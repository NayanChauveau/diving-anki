  fr:
    question: Dans un modèle à compartiment unique, la tension initiale du gaz inerte vaut 1 bar. L’équilibre
      cible vaut 3 bar pendant une période, puis 5 bar pendant une autre période. Les changements sont
      instantanés. Quelle tension obtient-on à la fin ?
    choices:
    - text: 3,5 bar
      correct: true
    - text: 3,0 bar
      correct: false
    - text: 4,0 bar
      correct: false
    explanation: 'Une période comble la moitié de l’écart à l’équilibre de la phase. Première phase :
      1 + (3 − 1)/2 = 2 bar. La seconde commence à 2 bar : 2 + (5 − 2)/2 = 3,5 bar. 3 bar recommence la
      seconde phase à 1 bar ; 4 bar applique deux périodes sous l’équilibre final de 5 bar.'
- id: n4-desaturation-decharge-transition-001
  type: mcq
  deck: Désaturation
