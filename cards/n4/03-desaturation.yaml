- id: n4-desaturation-certification-logiciel-001
  type: mcq
  deck: Désaturation
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - 'N4-S01 — MFT GP-N4 mai 2026 p.25 : absence de certification des logiciels, dissolution et procédures
      différentes ; vérifié le 2026-10-12'
    - 'N4-S07 — Jourdren, Pressions partielles et dissolution p.10–13 : cinétique par périodes ; modèles
      mathématiques fictifs, pas tables opérationnelles'
    - 'AFNOR — NF EN 13319 juin 2000, fiche officielle en vigueur et résumé du champ temps/profondeur
      : https://www.boutique.afnor.org/en-gb/standard/nf-en-13319/diving-accessories-depth-gauges-and-combined-depth-and-time-measuring-devic/fa048402/17312
      ; consulté 2026-10-12'
    - Suunto Zoop Novo, notice officielle rubrique Decompression dives (ceiling) ; Shearwater Peregrine
      français RevB 2020 p.15–16,25 (palier nominal) ; affichages fictifs distincts ; références déjà
      acquises N2/N3
    - 'Revue individuelle : docs/reviews/n4/LOT_09_DESATURATION.md'
    fact_check: pass
  fr:
    question: Sur un ordinateur de plongée, quelles fonctions sont couvertes par la conformité EN 13319
      ?
    choices:
    - text: La mesure du temps et de la profondeur
      correct: true
    - text: Le calcul des tensions des compartiments et des paliers
      correct: false
    - text: Le choix des Gradient Factors et des vitesses de remontée
      correct: false
    explanation: 'EN 13319 fixe des exigences relatives aux mesures de profondeur et de temps. Ce marquage
      ne certifie pas l’algorithme de désaturation : le logiciel utilise un modèle et des paramètres,
      dont le résultat ne constitue pas une mesure de la charge réelle du plongeur. Les Gradient Factors
      ajustent des limites de modèle, pas la précision du profondimètre.'
