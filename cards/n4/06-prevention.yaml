      ; consulté 2026-10-12'
    fact_check: pass
  fr:
    question: Quel est l’effet principal de la vasoconstriction cutanée sur le bilan thermique lors d’une
      exposition au froid ?
    choices:
    - text: Réduire le transfert de chaleur du sang vers la peau
      correct: true
    - text: Augmenter la production de chaleur par les muscles squelettiques
      correct: false
    explanation: 'La réduction du calibre des vaisseaux cutanés diminue le débit de sang chaud proche
      de la surface et limite les pertes de chaleur. Les frissons, eux, augmentent la production de chaleur
      par l’activité musculaire. Ces deux réponses ont des fonctions différentes : conserver la chaleur
      et en produire.'
- id: n4-prevention-thermodifferentielle-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.26 ; N4-S14 Jourdren froid septembre 2025 p.10–16 ; N4-S17 Melèse
      janvier 2024 p.23–24 ; N4-S23 Jourdren narcose p.8–11 ; relus 2026-10-12
    - 'RNLI — Cold Water Shock, réponse aiguë au froid et distinction du refroidissement : https://rnli.org/water-safety/know-the-risks/cold-water-shock
      ; consulté 2026-10-12'
    - 'Pendergast et al., Effect of Head-Out Immersion on Plasma Atrial Natriuretic Factor in Man, avril
      1987, abstract et conditions eau 35 °C : https://pubmed.ncbi.nlm.nih.gov/2951741/ et PDF éditeur
      https://www.ebm-journal.org/journals/experimental-biology-and-medicine/articles/10.3181/00379727-184-42497/pdf
      ; recoupé 2026-10-12'
    - 'DAN — Physiology of Compressed-Gas Diving (2016), Blood Volume Distribution et hypercapnie ; Your
      Lungs and Diving (2017) : https://dan.org/alert-diver/article/your-lungs-and-diving/ ; MFT actuel
      rôle facilitateur du CO2 ; vérifié 2026-10-12'
    - 'Revue individuelle : docs/reviews/n4/LOT_19_PREVENTION.md'
    fact_check: pass
  fr:
    question: Une personne non refroidie auparavant entre brutalement dans une eau froide. Dans les premières
      secondes, elle présente une inspiration involontaire et une ventilation incontrôlée. Quel phénomène
      thermique explique ce trouble immédiat ?
    choices:
    - text: Une réponse réflexe au refroidissement brutal de la peau
      correct: true
    - text: Une baisse déjà importante de la température centrale par hypothermie
      correct: false
    explanation: 'Le refroidissement brutal de la peau peut déclencher un choc au froid : inspiration
      involontaire, hyperventilation et modifications cardiovasculaires rapides. Il peut précéder une
      baisse importante de la température centrale et favoriser une inhalation d’eau ou un malaise. L’hypothermie
      correspond au refroidissement du corps qui s’installe avec les pertes de chaleur ; elle n’est pas
      nécessaire pour déclencher cette réponse immédiate.'
- id: n4-prevention-diurese-immersion-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.26 ; N4-S14 Jourdren froid septembre 2025 p.10–16 ; N4-S17 Melèse
