      : https://www.nidcd.nih.gov/health/balance-disorders ; anatomie et fonctions, consultés 2026-10-12'
    - 'DAN — Inner-Ear Barotrauma : https://dan.org/health-medicine/health-resources/diseases-conditions/inner-ear-barotrauma-iebt/
