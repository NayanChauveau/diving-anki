cards:
- id: n4-prevention-oreille-chaine-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.26 ; N4-S15 Jourdren oreille p.8–13 ; N4-S18 Jourdren apnée décembre
      2025 p.9–14 ; contrôlés 2026-10-12
    - 'NIDCD/NIH — How Do We Hear : https://www.nidcd.nih.gov/health/how-do-we-hear et Balance Disorders
      : https://www.nidcd.nih.gov/health/balance-disorders ; anatomie et fonctions, consultés 2026-10-12'
    - 'DAN — Inner-Ear Barotrauma : https://dan.org/health-medicine/health-resources/diseases-conditions/inner-ear-barotrauma-iebt/
      ; Hypoxia in Breath-Hold Diving : https://dan.org/alert-diver/article/hypoxia-in-breath-hold-diving/
      ; consultés 2026-10-12'
    - Schéma auditif original docs/diagrams/n4/chaine-auditive.svg ; exercice de PpO2 fictif sans diagnostic
      de syncope ni seuil universel
    - 'Revue individuelle : docs/reviews/n4/LOT_17_PREVENTION.md'
    fact_check: pass
  fr:
    question: 'Sur cette chaîne auditive simplifiée, quels éléments correspondent à A, B et C ?


      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="Chaîne mécanique
      simplifiée : membrane A, ensemble de trois osselets B, entrée de l’oreille interne puis structure
      en spirale C" style="width:100%;max-width:640px;height:auto;background:#fff"><g fill="none" stroke="#397b94"
      stroke-width="5"><path d="M100 50 L118 180"/><path d="M118 100 L190 100 L220 130 L275 110 L320 110"/><circle
      cx="190" cy="100" r="14"/><circle cx="220" cy="130" r="14"/><path d="M275 110 L285 135 L310 135
      L320 110 M335 88 V137"/><path d="M338 112 C370 60 495 40 515 130 C535 225 390 235 385 145 C382 90
      475 82 475 143 C475 181 420 188 417 147 C415 125 449 122 449 145"/></g><g font-family="sans-serif"
      font-size="22" fill="#18394a"><text x="90" y="215">A</text><text x="210" y="70">B</text><text x="545"
      y="158">C</text><path d="M530 151 H490" stroke="#18394a" stroke-width="2"/></g></svg>'
    choices:
    - text: Tympan, osselets, cochlée
      correct: true
    - text: Tympan, osselets, canaux semi-circulaires
      correct: false
    - text: Fenêtre ronde, osselets, cochlée
      correct: false
    explanation: 'Le tympan transmet sa vibration à la chaîne des trois osselets : marteau, enclume et
      étrier. L’étrier agit sur la fenêtre ovale, et le mouvement est transmis aux liquides de l’oreille
      interne, dont la cochlée transforme les vibrations en message nerveux auditif. Les canaux semi-circulaires
      participent à l’équilibre ; la fenêtre ronde se trouve à l’interface moyenne/interne, pas au début
      de cette chaîne.'
- id: n4-prevention-oreille-vestibule-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.26 ; N4-S15 Jourdren oreille p.8–13 ; N4-S18 Jourdren apnée décembre
      2025 p.9–14 ; contrôlés 2026-10-12
    - 'NIDCD/NIH — How Do We Hear : https://www.nidcd.nih.gov/health/how-do-we-hear et Balance Disorders
      : https://www.nidcd.nih.gov/health/balance-disorders ; anatomie et fonctions, consultés 2026-10-12'
    - 'DAN — Inner-Ear Barotrauma : https://dan.org/health-medicine/health-resources/diseases-conditions/inner-ear-barotrauma-iebt/
      ; Hypoxia in Breath-Hold Diving : https://dan.org/alert-diver/article/hypoxia-in-breath-hold-diving/
      ; consultés 2026-10-12'
    - Schéma auditif original docs/diagrams/n4/chaine-auditive.svg ; exercice de PpO2 fictif sans diagnostic
      de syncope ni seuil universel
    - 'Revue individuelle : docs/reviews/n4/LOT_17_PREVENTION.md'
    fact_check: pass
  fr:
    question: Quelle fonction distingue l’appareil vestibulaire, comprenant notamment le vestibule et
      les canaux semi-circulaires, de la cochlée ?
    choices:
    - text: Détecter position et mouvements de la tête pour l’équilibre
      correct: true
    - text: Transformer les vibrations sonores en signaux auditifs
      correct: false
    - text: Égaliser la pression de la caisse du tympan avec le pharynx
      correct: false
    explanation: L’appareil vestibulaire fournit des informations sur la position et les mouvements de
      la tête, utilisées pour l’équilibre et la stabilisation du regard. La cochlée assure l’audition.
      L’égalisation de la pression de l’oreille moyenne dépend de la trompe d’Eustache, pas du vestibule.
