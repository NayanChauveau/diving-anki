      1987, abstract et conditions eau 35 °C : https://pubmed.ncbi.nlm.nih.gov/2951741/ et PDF éditeur
      https://www.ebm-journal.org/journals/experimental-biology-and-medicine/articles/10.3181/00379727-184-42497/pdf
      ; recoupé 2026-10-12'
    - 'DAN — Physiology of Compressed-Gas Diving (2016), Blood Volume Distribution et hypercapnie ; Your
      Lungs and Diving (2017) : https://dan.org/alert-diver/article/your-lungs-and-diving/ ; MFT actuel
      rôle facilitateur du CO2 ; vérifié 2026-10-12'
    - 'Revue individuelle : docs/reviews/n4/LOT_19_PREVENTION.md'
    fact_check: pass
  fr:
    question: Pourquoi la production d’urine peut-elle augmenter lors d’une immersion jusqu’au cou, même
      dans une eau thermiquement confortable ?
    choices:
    - text: La centralisation du sang favorise une régulation rénale éliminant davantage d’eau
      correct: true
    - text: La centralisation du sang favorise une régulation rénale retenant davantage d’eau
      correct: false
    explanation: Le sang est redistribué vers le thorax ; les récepteurs et régulations hormonales du
      volume circulant peuvent favoriser la diurèse, c’est-à-dire la production d’urine. Cela a été observé
      aussi en eau thermoneutre. Le froid peut accentuer la centralisation par vasoconstriction périphérique.
      Une augmentation de l’urine n’est donc pas une production de chaleur ni la preuve d’un excès d’eau
      total chez le plongeur.
- id: n4-prevention-co2-narcose-001
  type: mcq
  deck: Prévention des accidents
