    - 'Revue individuelle : docs/reviews/n4/LOT_18_PREVENTION.md'
    fact_check: pass
  fr:
    question: Deux apnéistes s’entraînent à faible profondeur dans une eau claire. Quelle organisation
      assure une surveillance individuelle pendant l’apnée et après le retour en surface ?
    choices:
    - text: Un apnéiste évolue ; l’autre le suit depuis la surface et reste en surveillance après l’émersion
      correct: true
    - text: Un apnéiste évolue ; l’autre le suit depuis la surface et cesse la surveillance dès la première
        inspiration
      correct: false
    - text: Les deux évoluent ensemble en apnée ; ils se surveillent mutuellement puis chacun récupère
        en surface
      correct: false
    explanation: 'Le partenaire de sécurité est disponible pour observer et assister l’autre, plutôt que
      de mener sa propre apnée. Il continue à surveiller au retour en surface : l’oxygène nouvellement
      inspiré n’atteint pas immédiatement le cerveau, et une perte de conscience peut survenir après les
      premières inspirations. Il reste proche pour observer la ventilation, les gestes et les réponses,
      et intervenir si nécessaire.'
