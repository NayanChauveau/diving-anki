      de syncope ni seuil universel
    - 'Revue individuelle : docs/reviews/n4/LOT_17_PREVENTION.md'
    fact_check: pass
  fr:
    question: Dans un modèle de gaz alvéolaire pendant une apnée, la fraction d’O2 vaut 10 % à 10 m (pression
      absolue 2 bar). À l’arrivée en surface, elle ne vaut plus que 8 %, après consommation d’O2. La surface
      est à 1 bar. Quelle pression partielle d’O2 ce modèle donne-t-il alors ?
    choices:
    - text: 0,08 bar
      correct: true
    - text: 0,10 bar
      correct: false
    - text: 0,16 bar
      correct: false
    explanation: 'En surface : 0,08 × 1 = 0,08 bar, contre 0,10 × 2 = 0,20 bar au départ de ces dix derniers
      mètres. La remontée réduit la pression ambiante alors que l’organisme continue à consommer l’O2.
      0,10 bar conserve la fraction initiale ; 0,16 bar conserve la pression de 2 bar malgré l’arrivée
      en surface.'
- id: n4-prevention-apnee-lmc-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.26 ; N4-S18 Jourdren apnée décembre 2025 p.11–15 ; N4-S14 froid, thermorégulation
