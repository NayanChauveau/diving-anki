    - 'FFESSM Centre — Cécile Pétré, Apnée : la syncope, stage initial initiateur 25/11/2023, PDF publié
      mars 2024, PCM/conscience conservée : https://centreffessm.fr/wp-content/uploads/2024/03/CentreFFESSM_Apnee_SI_IE_20231125_Syncope.pdf
      ; consulté 2026-10-12'
    - 'DAN — Hypoxia in Breath-Hold Diving (01/05/2016), surveillance individuelle et au moins 30 s après
      surface : https://dan.org/alert-diver/article/hypoxia-in-breath-hold-diving/ ; DAN World — Freediving
      Safety Awareness (2022), préparation/intervalle de récupération : https://world.dan.org/alert-diver/article/freediving-safety-awareness/
      ; consultés 2026-10-12'
    - 'Thermorégulation : N4-S17 Melèse janvier 2024 p.17, vasomotricité ; concepts médicaux recoupés,
      aucun délai d’apnée maximal ni série intensive de préparation prescrits'
    - 'Revue individuelle : docs/reviews/n4/LOT_18_PREVENTION.md'
    fact_check: pass
  fr:
    question: Dans les incidents d’apnée, comment nomme-t-on une perte de coordination avec mouvements
      saccadés, alors que la conscience est conservée ?
    choices:
    - text: Une perte de contrôle moteur, ou « samba »
      correct: true
    - text: Une syncope hypoxique
      correct: false
    explanation: La perte de contrôle moteur, ou PCM, peut comporter des mouvements involontaires et une
      difficulté à coordonner les gestes sans perte de conscience. Une syncope comporte une perte de conscience.
      Des mouvements saccadés ne suffisent donc pas, à eux seuls, à définir une syncope. Dans les deux
      cas, le partenaire intervient pour protéger les voies aériennes et empêcher une nouvelle immersion.
