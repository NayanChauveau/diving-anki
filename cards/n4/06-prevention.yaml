  fr:
    question: Pourquoi une forte résistance du détendeur à l’inspiration peut-elle favoriser un œdème
      pulmonaire d’immersion (OPI) ?
    choices:
    - text: Elle accroît la dépression inspiratoire et peut favoriser le passage de liquide des capillaires
        vers les alvéoles
      correct: true
    - text: Elle accroît la surpression inspiratoire et peut favoriser la rupture des alvéoles avec passage
        de gaz dans le sang
      correct: false
    - text: Elle accroît l’aspiration inspiratoire et peut favoriser le passage d’eau extérieure par la
        soupape d’expiration
      correct: false
    explanation: 'Inspirer contre une forte résistance exige une dépression plus importante dans les voies
      respiratoires. Cela peut favoriser une fuite de liquide des capillaires pulmonaires vers les alvéoles
      : c’est un facteur d’OPI. Ce liquide provient du sang, pas de l’eau extérieure. Une rupture alvéolaire
      avec passage de gaz relève d’un autre mécanisme. L’entretien du détendeur et la limitation d’efforts
      ventilatoires importants contribuent à la prévention.'
