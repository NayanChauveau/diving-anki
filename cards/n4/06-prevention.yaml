  fr:
    question: Quelles interfaces séparent directement la cavité aérienne de l’oreille moyenne des liquides
      de l’oreille interne et peuvent être lésées par une contrainte excessive de pression ?
    choices:
    - text: Les fenêtres ovale et ronde
      correct: true
    - text: Le tympan et la fenêtre ovale
      correct: false
    - text: Le tympan et la fenêtre ronde
      correct: false
    explanation: Les fenêtres ovale et ronde sont à la limite moyenne/interne. L’étrier transmet les vibrations
      à la fenêtre ovale ; la fenêtre ronde permet un déplacement complémentaire des liquides. Un défaut
      d’équilibrage ou une manœuvre forcée peut transmettre une contrainte et léser ces structures. Le
      tympan sépare externe et moyenne ; la trompe relie la moyenne au nasopharynx.
- id: n4-prevention-apnee-hyperventilation-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.26 ; N4-S15 Jourdren oreille p.8–13 ; N4-S18 Jourdren apnée décembre
      2025 p.9–14 ; contrôlés 2026-10-12
    - 'NIDCD/NIH — How Do We Hear : https://www.nidcd.nih.gov/health/how-do-we-hear et Balance Disorders
      : https://www.nidcd.nih.gov/health/balance-disorders ; anatomie et fonctions, consultés 2026-10-12'
    - 'DAN — Inner-Ear Barotrauma : https://dan.org/health-medicine/health-resources/diseases-conditions/inner-ear-barotrauma-iebt/
      ; Hypoxia in Breath-Hold Diving : https://dan.org/alert-diver/article/hypoxia-in-breath-hold-diving/
      ; consultés 2026-10-12'
    - Schéma auditif original docs/diagrams/n4/chaine-auditive.svg ; exercice de PpO2 fictif sans diagnostic
      de syncope ni seuil universel
    - 'Revue individuelle : docs/reviews/n4/LOT_17_PREVENTION.md'
    fact_check: pass
  fr:
    question: Pourquoi hyperventiler avant une apnée peut-il retarder l’envie de respirer sans donner
      une marge équivalente contre l’hypoxie ?
    choices:
    - text: Le CO2 initial diminue beaucoup, alors que le stock d’O2 n’augmente que peu
      correct: true
    - text: Le stock d’O2 augmente beaucoup, alors que le CO2 initial diminue peu
      correct: false
    explanation: L’hyperventilation élimine du CO2 et retarde la stimulation ventilatoire liée à son accumulation.
      À l’air, l’hémoglobine est déjà fortement oxygénée avant cette préparation ; les réserves d’O2 n’augmentent
      pas dans les mêmes proportions. L’oxygène peut donc manquer avant une forte envie de respirer.
- id: n4-prevention-apnee-remontee-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N4
  status: reviewed
  review:
