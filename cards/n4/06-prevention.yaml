      Lungs and Diving (2017) : https://dan.org/alert-diver/article/your-lungs-and-diving/ ; MFT actuel
      rôle facilitateur du CO2 ; vérifié 2026-10-12'
    - 'Revue individuelle : docs/reviews/n4/LOT_19_PREVENTION.md'
    fact_check: pass
  fr:
    question: Pour un plongeur à l’air sous une même pression ambiante, comment une rétention de CO2 peut-elle
      modifier les effets narcotiques ?
    choices:
    - text: Elle peut renforcer les effets narcotiques
      correct: true
    - text: Elle peut atténuer les effets narcotiques
      correct: false
    explanation: L’hypercapnie, c’est-à-dire l’augmentation du CO2 dans le sang, peut potentialiser les
      effets narcotiques. Réduire les efforts et les facteurs de ventilation inefficace participe donc
      à la prévention, en plus du choix de profondeur. Le rôle facilitateur du CO2 ne se réduit pas à
      un manque d’O2 ni à une modification de la fraction d’azote dans le bloc.
- id: n4-prevention-opi-resistance-001
  type: mcq
  deck: Prévention des accidents
  levels:
