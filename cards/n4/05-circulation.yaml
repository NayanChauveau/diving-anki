    - 'Revue individuelle : docs/reviews/n4/LOT_15_CIRCULATION.md'
    fact_check: pass
  fr:
    question: Lors d’une immersion jusqu’au cou, quel changement contribue à augmenter le remplissage
      cardiaque par rapport à la station debout hors de l’eau ?
    choices:
    - text: La redistribution d’une partie du sang périphérique vers le thorax
      correct: true
    - text: L’augmentation de la fréquence cardiaque sans redistribution de sang
      correct: false
    - text: La dilatation des veines périphériques qui accroît leur stockage de sang
      correct: false
    explanation: L’immersion réduit l’accumulation de sang dans les parties périphériques et favorise
      une redistribution vers le thorax, appelée centralisation sanguine ou blood shift. Le retour veineux
      et le remplissage cardiaque augmentent. Une variation de fréquence ne décrit pas ce transfert de
      volume ; davantage de stockage veineux périphérique aurait l’effet opposé sur la centralisation.
