  fr:
    question: 'Sur ce schéma des cavités cardiaques, où se situe le passage potentiel d’un foramen ovale
      perméable ?


      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-label="Quatre cavités
      cardiaques schématiques : oreillettes au-dessus, ventricules au-dessous ; A entre les oreillettes,
      B entre les ventricules, C entre oreillette et ventricule gauches" style="width:100%;max-width:600px;height:auto;background:#fff"><g
      fill="#e7f3f7" stroke="#397b94" stroke-width="3"><rect x="95" y="25" width="190" height="95" rx="12"/><rect
      x="315" y="25" width="190" height="95" rx="12"/><rect x="95" y="160" width="190" height="95" rx="12"/><rect
      x="315" y="160" width="190" height="95" rx="12"/></g><g font-family="sans-serif" font-size="22"
      text-anchor="middle" fill="#18394a"><text x="185" y="78">OD</text><text x="410" y="78">OG</text><text
      x="185" y="217">VD</text><text x="410" y="217">VG</text><text x="300" y="78">A</text><text x="300"
      y="217">B</text><text x="410" y="148">C</text></g></svg>'
    choices:
    - text: Au repère A
      correct: true
    - text: Au repère B
      correct: false
    - text: Au repère C
      correct: false
    explanation: 'Le foramen ovale perméable, ou FOP, se situe entre les deux oreillettes : OD, oreillette
      droite, et OG, oreillette gauche. Il ne relie pas les ventricules VD et VG. Le passage OG–VG est
      celui de la valve mitrale, pas un FOP.'
- id: n4-circulation-fop-passage-001
  type: mcq
  deck: Anatomie et physiologie
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - 'N4-S01 — MFT GP-N4 mai 2026 p.25 : FOP et shunts pulmonaires ; N4-S17 Melèse janvier 2024 p.25
      ; contrôlés 2026-10-12'
    - 'DAN — Patent Foramen Ovale, mécanisme pression OD>OG et note shunts intrapulmonaires : https://dan.org/health-medicine/health-resources/diseases-conditions/patent-foramen-ovale-pfo/
      ; contrôlé 2026-10-12'
    - 'SPUMS/UKDMC — Joint position statement on atrial shunts and diving, update 2025 : https://pmc.ncbi.nlm.nih.gov/articles/PMC12043516/
      ; résumé primaire indexé (texte complet web bloqué), distinction shunts atriaux/pulmonaires ; aucun
      conseil de traitement ou délai individuel déduit'
    - Schéma conceptuel original docs/diagrams/n4/shunt-pulmonaire.svg ; pas représentation d’un shunt
      par défaut chez tous les plongeurs
    - 'Revue individuelle : docs/reviews/n4/LOT_16_CIRCULATION.md'
    fact_check: pass
  fr:
    question: Un plongeur a des bulles veineuses arrivant à l’oreillette droite. Un FOP permet momentanément
      un passage alors que la pression de cette oreillette dépasse celle de la gauche. Quel trajet peut
      alors contourner le filtre capillaire pulmonaire ?
    choices:
    - text: Oreillette droite → oreillette gauche → ventricule gauche → circulation artérielle générale
      correct: true
    - text: Oreillette droite → ventricule droit → artère pulmonaire → capillaires pulmonaires
      correct: false
    explanation: 'Le gradient droite–gauche peut permettre à des bulles de franchir le FOP entre les oreillettes,
      puis de rejoindre la circulation artérielle par le ventricule gauche. Le trajet normal par le ventricule
      droit conduit aux capillaires pulmonaires. Un FOP ne signifie pas un shunt permanent ni un accident
      certain : le passage dépend des conditions de pression, des bulles présentes et de leur trajet.'
