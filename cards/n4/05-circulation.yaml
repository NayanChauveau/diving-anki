    question: Chez un plongeur sans communication intracardiaque, quel mécanisme peut permettre à des
      bulles veineuses de rejoindre intactes la circulation artérielle ?
    choices:
    - text: Le passage par une voie intrapulmonaire contournant le réseau capillaire
      correct: true
    - text: La diffusion des bulles à travers la membrane alvéolo-capillaire
      correct: false
    explanation: 'Une voie intrapulmonaire qui contourne le réseau capillaire peut laisser passer des
      bulles vers les veines pulmonaires, puis le cœur gauche et les artères générales. Elle ne nécessite
      pas un passage entre les oreillettes comme le FOP. La diffusion normale concerne des molécules de
      gaz dissous, pas des bulles intactes traversant la membrane.


