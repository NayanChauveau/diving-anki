      et https://www.nhlbi.nih.gov/health/heart/blood-flow ; relecture 2026-10-12'
    - 'OpenStax Anatomy and Physiology 2e 22.5 Transport of Gases : https://openstax.org/books/anatomy-and-physiology-2e/pages/22-5-transport-of-gases
      ; CO2 sous bicarbonates, carbamino et dissous ; vérifié 2026-10-12'
    - 'DAN — Simon Mitchell, Physiology of Compressed-Gas Diving (2016), Blood Volume Distribution, Gas
      Transport : https://dan.org/alert-diver/article/the-physiology-of-compressed-gas-diving/ ; DAN Patent
      Foramen Ovale, rubrique mécanisme : https://dan.org/health-medicine/health-resources/diseases-conditions/patent-foramen-ovale-pfo/
      ; contrôlés 2026-10-12'
    - Schéma FOP original docs/diagrams/n4/fop-localisation.svg ; aucun seuil de risque ni prescription
      médicale individuelle
    - 'Revue individuelle : docs/reviews/n4/LOT_15_CIRCULATION.md'
    fact_check: pass
  fr:
    question: Dans les conditions physiologiques usuelles, quelle forme représente la plus grande part
      du transport sanguin du CO2 vers les poumons ?
    choices:
    - text: Les ions bicarbonate
      correct: true
    - text: Le CO2 lié à l’hémoglobine
      correct: false
    - text: Le CO2 moléculaire dissous
      correct: false
    explanation: Une grande partie du CO2 est convertie en bicarbonates. Une autre part est transportée
      liée à des protéines, notamment l’hémoglobine, et une part reste dissoute. Dans les poumons, ces
      équilibres permettent de reformer le CO2 moléculaire éliminé vers les alvéoles. L’acide carbonique
      est un intermédiaire de la conversion en bicarbonates, pas le nom de la forme majoritaire finale.
- id: n4-circulation-diffusion-perfusion-001
  type: mcq
  deck: Anatomie et physiologie
  levels:
  - N4
  status: reviewed
  review:
