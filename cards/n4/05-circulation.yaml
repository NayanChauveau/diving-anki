cards:
- id: n4-circulation-circuits-001
  type: mcq
  deck: Anatomie et physiologie
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - 'N4-S01 — MFT GP-N4 mai 2026 p.25 ; N4-S17 — Melèse, appareil circulatoire janvier 2024 p.7–15 ;
      N4-S59 CODEP92 appareil circulatoire : cycle et débit ; contrôlés 2026-10-12'
    - 'NHLBI — How Blood Flows through the Heart, 25/06/2025 : https://www.nhlbi.nih.gov/health/heart/blood-flow
      ; contrôlé 2026-10-12'
    - Schéma fonctionnel original docs/diagrams/n4/circulation.svg ; exercice de débit à données imposées
    - 'Revue individuelle : docs/reviews/n4/LOT_14_CIRCULATION.md'
    fact_check: pass
  fr:
    question: 'Sur ce schéma fonctionnel, quels côtés du cœur correspondent à A et B ?


      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" role="img" aria-label="Circuit fonctionnel
      : A envoie le sang aux poumons, B reçoit le sang des poumons et l’envoie aux organes ; retour des
      organes vers A" style="width:100%;max-width:600px;height:auto;background:#fff"><defs><marker id="n4circ"
      markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#397b94"/></marker></defs><g
      fill="#e7f3f7" stroke="#397b94" stroke-width="2"><rect x="235" y="15" width="130" height="50" rx="8"/><rect
      x="65" y="105" width="130" height="55" rx="8"/><rect x="405" y="105" width="130" height="55" rx="8"/><rect
      x="235" y="215" width="130" height="50" rx="8"/></g><g fill="none" stroke="#397b94" stroke-width="3"
      marker-end="url(#n4circ)"><path d="M130 105 V40 H225"/><path d="M375 40 H470 V95"/><path d="M470
      170 V240 H375"/><path d="M225 240 H130 V170"/></g><g fill="#18394a" text-anchor="middle" font-family="sans-serif"
      font-size="20"><text x="300" y="47">Poumons</text><text x="130" y="140">Cœur A</text><text x="470"
      y="140">Cœur B</text><text x="300" y="248">Organes</text></g></svg>'
    choices:
    - text: A est le cœur droit ; B le cœur gauche
      correct: true
    - text: A est le cœur gauche ; B le cœur droit
      correct: false
    explanation: 'Le cœur droit reçoit le sang des organes et l’envoie vers les poumons. Le cœur gauche
      reçoit le sang des poumons et le propulse vers les organes. La position sur ce dessin fonctionnel
      n’est pas une vue anatomique de face : ce sont les trajets qui permettent d’identifier les côtés.'
- id: n4-circulation-artere-veine-001
  type: mcq
  deck: Anatomie et physiologie
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - 'N4-S01 — MFT GP-N4 mai 2026 p.25 ; N4-S17 — Melèse, appareil circulatoire janvier 2024 p.7–15 ;
      N4-S59 CODEP92 appareil circulatoire : cycle et débit ; contrôlés 2026-10-12'
    - 'NHLBI — How Blood Flows through the Heart, 25/06/2025 : https://www.nhlbi.nih.gov/health/heart/blood-flow
      ; contrôlé 2026-10-12'
    - Schéma fonctionnel original docs/diagrams/n4/circulation.svg ; exercice de débit à données imposées
    - 'Revue individuelle : docs/reviews/n4/LOT_14_CIRCULATION.md'
    fact_check: pass
  fr:
    question: L’artère pulmonaire transporte normalement un sang moins oxygéné que les veines pulmonaires.
      Pourquoi porte-t-elle quand même le nom d’artère ?
    choices:
    - text: Parce qu’elle conduit le sang du cœur vers les poumons
      correct: true
    - text: Parce que sa dénomination dépend du gaz majoritaire dans son sang
      correct: false
    - text: Parce qu’elle ramène le sang des poumons vers le cœur
      correct: false
    explanation: Une artère s’éloigne du cœur, une veine y revient. Le nom ne décrit pas la teneur en
      O2. L’artère pulmonaire part du ventricule droit vers les poumons ; les veines pulmonaires ramènent
      le sang oxygéné vers l’oreillette gauche.
- id: n4-circulation-valves-001
  type: mcq
  deck: Anatomie et physiologie
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - 'N4-S01 — MFT GP-N4 mai 2026 p.25 ; N4-S17 — Melèse, appareil circulatoire janvier 2024 p.7–15 ;
      N4-S59 CODEP92 appareil circulatoire : cycle et débit ; contrôlés 2026-10-12'
    - 'NHLBI — How Blood Flows through the Heart, 25/06/2025 : https://www.nhlbi.nih.gov/health/heart/blood-flow
      ; contrôlé 2026-10-12'
    - Schéma fonctionnel original docs/diagrams/n4/circulation.svg ; exercice de débit à données imposées
    - 'Revue individuelle : docs/reviews/n4/LOT_14_CIRCULATION.md'
    fact_check: pass
  fr:
    question: Pendant l’éjection du ventricule droit, quelle valve empêche normalement le reflux vers
      l’oreillette droite ?
    choices:
    - text: La valve tricuspide
      correct: true
    - text: La valve pulmonaire
      correct: false
    - text: La valve mitrale
      correct: false
    explanation: 'La tricuspide sépare oreillette et ventricule droits : elle se ferme lors de l’éjection
      ventriculaire. La valve pulmonaire s’ouvre alors vers l’artère pulmonaire ; sa fermeture empêche
      le reflux depuis cette artère après l’éjection. La mitrale sépare les cavités gauches.'
- id: n4-circulation-systole-diastole-001
  type: mcq
  deck: Anatomie et physiologie
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - 'N4-S01 — MFT GP-N4 mai 2026 p.25 ; N4-S17 — Melèse, appareil circulatoire janvier 2024 p.7–15 ;
      N4-S59 CODEP92 appareil circulatoire : cycle et débit ; contrôlés 2026-10-12'
    - 'NHLBI — How Blood Flows through the Heart, 25/06/2025 : https://www.nhlbi.nih.gov/health/heart/blood-flow
      ; contrôlé 2026-10-12'
    - Schéma fonctionnel original docs/diagrams/n4/circulation.svg ; exercice de débit à données imposées
    - 'Revue individuelle : docs/reviews/n4/LOT_14_CIRCULATION.md'
    fact_check: pass
  fr:
    question: Comment nomme-t-on la phase où le muscle des ventricules se relâche et où leur remplissage
      peut se produire ?
    choices:
    - text: La diastole ventriculaire
      correct: true
    - text: La systole ventriculaire
      correct: false
    explanation: La diastole comprend le relâchement puis le remplissage des ventricules. La systole ventriculaire
      comprend leur contraction puis l’éjection vers les artères. Les valves s’ouvrent ou se ferment selon
      les gradients de pression ; toute la diastole ne correspond donc pas à un remplissage ininterrompu.
- id: n4-circulation-debit-cardiaque-001
  type: mcq
  deck: Anatomie et physiologie
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - 'N4-S01 — MFT GP-N4 mai 2026 p.25 ; N4-S17 — Melèse, appareil circulatoire janvier 2024 p.7–15 ;
      N4-S59 CODEP92 appareil circulatoire : cycle et débit ; contrôlés 2026-10-12'
    - 'NHLBI — How Blood Flows through the Heart, 25/06/2025 : https://www.nhlbi.nih.gov/health/heart/blood-flow
      ; contrôlé 2026-10-12'
    - Schéma fonctionnel original docs/diagrams/n4/circulation.svg ; exercice de débit à données imposées
    - 'Revue individuelle : docs/reviews/n4/LOT_14_CIRCULATION.md'
    - 'Article — Cardiac structure and function in humans: a new cardiovascular physiology laboratory,
      2009, table 1, formule débit=VES×fréquence : https://pmc.ncbi.nlm.nih.gov/articles/PMC3747785/ ;
      recoupement 2026-10-12'
    fact_check: pass
  fr:
    question: Dans un exercice, chaque ventricule éjecte 75 mL par battement à une fréquence de 81 battements/min.
      Quel débit cardiaque obtient-on, arrondi au dixième de L/min ?
    choices:
    - text: 6,1 L/min
      correct: true
    - text: 12,2 L/min
      correct: false
    - text: 60,8 L/min
      correct: false
    explanation: 'Le débit d’un ventricule vaut volume d’éjection × fréquence : 75 × 81 = 6 075 mL/min,
      soit 6,075 L/min, arrondis à 6,1. Les deux circulations sont en série : additionner les débits des
      ventricules donnerait à tort 12,2 L/min. 60,8 L/min convertit les mL en L avec un facteur 100 au
      lieu de 1 000.'
- id: n4-circulation-hemoglobine-001
  type: mcq
  deck: Anatomie et physiologie
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.25 ; N4-S17 Melèse, janvier 2024 p.14–25, et N4-S59 appareil circulatoire
      ; contrôlés 2026-10-12
    - 'NHLBI — Breathing Benefits (27/06/2025) et Heart Blood Flow (25/06/2025) : https://www.nhlbi.nih.gov/health/lungs/breathing-benefits
      et https://www.nhlbi.nih.gov/health/heart/blood-flow ; relecture 2026-10-12'
    - 'OpenStax Anatomy and Physiology 2e 22.5 Transport of Gases : https://openstax.org/books/anatomy-and-physiology-2e/pages/22-5-transport-of-gases
      ; CO2 sous bicarbonates, carbamino et dissous ; vérifié 2026-10-12'
    - 'DAN — Simon Mitchell, Physiology of Compressed-Gas Diving (2016), Blood Volume Distribution, Gas
      Transport : https://dan.org/alert-diver/article/the-physiology-of-compressed-gas-diving/ ; DAN Patent
      Foramen Ovale, rubrique mécanisme : https://dan.org/health-medicine/health-resources/diseases-conditions/patent-foramen-ovale-pfo/
      ; contrôlés 2026-10-12'
    - Schéma FOP original docs/diagrams/n4/fop-localisation.svg ; aucun seuil de risque ni prescription
      médicale individuelle
    - 'Revue individuelle : docs/reviews/n4/LOT_15_CIRCULATION.md'
    fact_check: pass
  fr:
    question: Chez un adulte sain respirant de l’air à la pression atmosphérique, sous quelle forme la
      majeure partie de l’O2 sanguin est-elle transportée ?
    choices:
    - text: Liée à l’hémoglobine des globules rouges
      correct: true
    - text: Dissoute dans le plasma sanguin
      correct: false
    - text: Transformée en bicarbonates dans le plasma
      correct: false
    explanation: L’hémoglobine transporte la majeure partie de l’oxygène dans ces conditions ; une petite
      fraction est dissoute. Le gaz doit passer sous forme dissoute pour diffuser, mais cela ne signifie
      pas que tout le stock d’O2 circule ainsi. Les bicarbonates représentent surtout une forme de transport
      du CO2.
- id: n4-circulation-co2-transport-001
  type: mcq
  deck: Anatomie et physiologie
  levels:
  - N4
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 mai 2026 p.25 ; N4-S17 Melèse, janvier 2024 p.14–25, et N4-S59 appareil circulatoire
      ; contrôlés 2026-10-12
