    - 'DAN — Simon Mitchell, Physiology of Compressed-Gas Diving (2016), Blood Volume Distribution, Gas
      Transport : https://dan.org/alert-diver/article/the-physiology-of-compressed-gas-diving/ ; DAN Patent
      Foramen Ovale, rubrique mécanisme : https://dan.org/health-medicine/health-resources/diseases-conditions/patent-foramen-ovale-pfo/
      ; contrôlés 2026-10-12'
    - Schéma FOP original docs/diagrams/n4/fop-localisation.svg ; aucun seuil de risque ni prescription
      médicale individuelle
    - 'Revue individuelle : docs/reviews/n4/LOT_15_CIRCULATION.md'
    fact_check: pass
  fr:
    question: On étudie les échanges d’un gaz entre sang et tissu. L’expérience A modifie le gradient
      de pression partielle, à débit sanguin constant. L’expérience B modifie le débit sanguin traversant
      le tissu. Quelles notions sont visées, respectivement ?
    choices:
    - text: Diffusion, puis perfusion
      correct: true
    - text: Perfusion, puis diffusion
      correct: false
    - text: Ventilation, puis perfusion
      correct: false
    explanation: La diffusion est le passage du gaz selon son gradient de pression partielle à travers
      une interface. La perfusion est l’apport sanguin au tissu. La ventilation renouvelle l’air pulmonaire
      ; changer un gradient entre sang et tissu ne signifie pas qu’on change cette ventilation. Diffusion
      et perfusion interviennent ensemble dans le transport des gaz.
- id: n4-circulation-bloodshift-001
  type: mcq
  deck: Anatomie et physiologie
