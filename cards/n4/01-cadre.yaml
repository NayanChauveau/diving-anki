    question: À la FFESSM, quel ensemble réunit uniquement des commissions classées comme culturelles
      ?
    choices:
    - text: Archéologie, environnement et biologie, photo-vidéo, plongée souterraine
      correct: true
    - text: Archéologie, environnement et biologie, photo-vidéo, apnée
      correct: false
    - text: Archéologie, environnement et biologie, photo-vidéo, technique
