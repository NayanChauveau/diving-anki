cards:
- id: n4-cadre-certification-exercice-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - 'N4-S01 — MFT GP-N4 FFESSM, mai 2026, p.3 et 8 ; consulté le 2026-10-12 : âge d’accès à l’examen
      et condition fédérale d’encadrement'
    - 'Revue individuelle : docs/reviews/n4/LOT_01_CADRE.md'
    fact_check: pass
  fr:
    question: Dans le cursus GP-N4 FFESSM, quels sont les âges minimaux pour commencer l’examen, puis
      exercer la fonction de guide de palanquée ?
    choices:
    - text: 17 ans pour l’examen ; 18 ans pour guider
      correct: true
    - text: 18 ans pour l’examen ; 18 ans pour guider
      correct: false
    - text: 17 ans pour l’examen ; 17 ans pour guider
      correct: false
    explanation: Le candidat peut commencer l’examen dès 17 ans, avec une autorisation éclairée du responsable
      légal s’il est mineur. Le brevet atteste ses compétences, mais la FFESSM conditionne l’exercice
      de l’encadrement à 18 ans. Réussir l’examen à 17 ans permet donc d’obtenir la certification avant
      de pouvoir guider.
- id: n4-cadre-admission-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - 'N4-S01 — MFT GP-N4 FFESSM, mai 2026, p.8 ; consulté le 2026-10-12 : accès à l’examen, attestations
      A1 à A4 et dispense'
    - 'Revue individuelle : docs/reviews/n4/LOT_01_CADRE.md'
    fact_check: pass
  fr:
    question: Pour une première présentation à l’ensemble de l’examen GP-N4 FFESSM, quel dossier satisfait
      les exigences de brevet de plongeur, de secourisme et d’aptitudes attestées, les autres conditions
      étant remplies ?
    choices:
    - text: N3 FFESSM, RIFAP et attestations A1 à A4 valides
      correct: true
    - text: PA40 FFESSM, RIFAP et attestations A1 à A4 valides
      correct: false
    - text: N3 FFESSM, PSC1 et attestations A1 à A4 valides
      correct: false
    explanation: L’examen exige le N3 FFESSM ou un diplôme admis en équivalence, ainsi que la carte RIFA
      Plongée (RIFAP). Le PA40 seul ne remplace pas le N3 et le PSC1 seul ne remplace pas cette qualification
      de secours en plongée. Les attestations A1 à A4 couvrent la conduite de palanquée, l’intervention
      à 40 m, la maîtrise de remontée gilet et les nages ; leur validité est de neuf mois. Elles sont
      attestées par un encadrant habilité d’au moins niveau E3, licencié pour l’année en cours.
- id: n4-cadre-exploration-enseignement-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - 'N4-S01 — MFT GP-N4 FFESSM, mai 2026, p.3 ; consulté le 2026-10-12 : fonction E2 après initiateur'
    - 'Code du sport — annexes III-15b (depuis 2026-01-17) et III-16a (depuis 2012-04-18), vérifiées le
      2026-10-12 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000053377107 ; https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000025705128'
    - 'Revue individuelle : docs/reviews/n4/LOT_01_CADRE.md'
    - 'Code du sport — annexe III-16b (depuis 2012-04-18), vérifiée le 2026-10-12 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000025705126'
    fact_check: pass
  fr:
    question: En établissement en France, à l’air en milieu naturel, quelle activité un GP-N4 majeur peut-il
      encadrer sans qualification d’enseignant, avec un DP et des plongeurs remplissant les conditions
      de participation ?
    choices:
    - text: Une exploration avec des PE40 à 30 m
      correct: true
    - text: Un apprentissage de la remontée gilet avec des PE20 à 15 m
      correct: false
    - text: Un baptême de plongée avec un débutant à 6 m
      correct: false
    explanation: Le GP-N4 peut conduire des explorations jusqu’à 40 m avec les aptitudes adaptées, dans
      les limites fixées par le DP. En milieu naturel, l’apprentissage technique à 15 m exige au minimum
      un E2 et le baptême un E1. Le GP-N4 seul ne possède pas ces qualifications d’enseignant ; avec le
      diplôme d’initiateur FFESSM, il devient E2.
- id: n4-cadre-e2-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 FFESSM, mai 2026, p.3 ; consulté le 2026-10-12
    - 'Code du sport — annexes III-15b et III-16a, vérifiées le 2026-10-12 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000053377107
      ; https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000025705128'
    - 'Revue individuelle : docs/reviews/n4/LOT_01_CADRE.md'
    fact_check: pass
  fr:
    question: En établissement en France, à l’air en milieu naturel, jusqu’à quelle profondeur un GP-N4
      majeur titulaire de l’initiateur FFESSM peut-il encadrer seul une palanquée en formation technique,
      avec un DP et des élèves aux aptitudes adaptées ?
    choices:
    - text: 20 m
      correct: true
    - text: 40 m
      correct: false
    - text: 6 m
      correct: false
    explanation: Le GP-N4 titulaire de l’initiateur FFESSM est E2 et peut enseigner jusqu’à 20 m. L’enseignement
      entre 20 et 40 m exige au minimum un E3. La limite de 40 m du guide en exploration ne s’étend donc
      pas à l’enseignement ; 6 m correspond au domaine de l’E1.
