cards:
- id: n4-cadre-certification-exercice-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - 'N4-S01 — MFT GP-N4 FFESSM, mai 2026, p.3 et 8 ; consulté le 2026-10-12 : âge d’accès à l’examen
      et condition fédérale d’encadrement'
    - 'Revue individuelle : docs/reviews/n4/LOT_01_CADRE.md'
    fact_check: pass
  fr:
    question: Dans le cursus GP-N4 FFESSM, quels sont les âges minimaux pour commencer l’examen, puis
      exercer la fonction de guide de palanquée ?
    choices:
    - text: 17 ans pour l’examen ; 18 ans pour guider
      correct: true
    - text: 18 ans pour l’examen ; 18 ans pour guider
      correct: false
    - text: 17 ans pour l’examen ; 17 ans pour guider
      correct: false
    explanation: Le candidat peut commencer l’examen dès 17 ans, avec une autorisation éclairée du responsable
      légal s’il est mineur. Le brevet atteste ses compétences, mais la FFESSM conditionne l’exercice
      de l’encadrement à 18 ans. Réussir l’examen à 17 ans permet donc d’obtenir la certification avant
      de pouvoir guider.
- id: n4-cadre-admission-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - 'N4-S01 — MFT GP-N4 FFESSM, mai 2026, p.8 ; consulté le 2026-10-12 : accès à l’examen, attestations
      A1 à A4 et dispense'
    - 'Revue individuelle : docs/reviews/n4/LOT_01_CADRE.md'
    fact_check: pass
  fr:
    question: Pour une première présentation à l’ensemble de l’examen GP-N4 FFESSM, quel dossier satisfait
      les exigences de brevet de plongeur, de secourisme et d’aptitudes attestées, les autres conditions
      étant remplies ?
    choices:
    - text: N3 FFESSM, RIFAP et attestations A1 à A4 valides
      correct: true
    - text: PA40 FFESSM, RIFAP et attestations A1 à A4 valides
      correct: false
    - text: N3 FFESSM, PSC1 et attestations A1 à A4 valides
      correct: false
    explanation: L’examen exige le N3 FFESSM ou un diplôme admis en équivalence, ainsi que la carte RIFA
      Plongée (RIFAP). Le PA40 seul ne remplace pas le N3 et le PSC1 seul ne remplace pas cette qualification
      de secours en plongée. Les attestations A1 à A4 couvrent la conduite de palanquée, l’intervention
      à 40 m, la maîtrise de remontée gilet et les nages ; leur validité est de neuf mois. Elles sont
      attestées par un encadrant habilité d’au moins niveau E3, licencié pour l’année en cours.
- id: n4-cadre-exploration-enseignement-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - 'N4-S01 — MFT GP-N4 FFESSM, mai 2026, p.3 ; consulté le 2026-10-12 : fonction E2 après initiateur'
    - 'Code du sport — annexes III-15b (depuis 2026-01-17) et III-16a (depuis 2012-04-18), vérifiées le
      2026-10-12 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000053377107 ; https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000025705128'
    - 'Revue individuelle : docs/reviews/n4/LOT_01_CADRE.md'
    - 'Code du sport — annexe III-16b (depuis 2012-04-18), vérifiée le 2026-10-12 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000025705126'
    fact_check: pass
  fr:
    question: En établissement en France, à l’air en milieu naturel, quelle activité un GP-N4 majeur peut-il
      encadrer sans qualification d’enseignant, avec un DP et des plongeurs remplissant les conditions
      de participation ?
    choices:
    - text: Une exploration avec des PE40 à 30 m
      correct: true
    - text: Un apprentissage de la remontée gilet avec des PE20 à 15 m
      correct: false
    - text: Un baptême de plongée avec un débutant à 6 m
      correct: false
    explanation: Le GP-N4 peut conduire des explorations jusqu’à 40 m avec les aptitudes adaptées, dans
      les limites fixées par le DP. En milieu naturel, l’apprentissage technique à 15 m exige au minimum
      un E2 et le baptême un E1. Le GP-N4 seul ne possède pas ces qualifications d’enseignant ; avec le
      diplôme d’initiateur FFESSM, il devient E2.
- id: n4-cadre-e2-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 FFESSM, mai 2026, p.3 ; consulté le 2026-10-12
    - 'Code du sport — annexes III-15b et III-16a, vérifiées le 2026-10-12 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000053377107
      ; https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000025705128'
    - 'Revue individuelle : docs/reviews/n4/LOT_01_CADRE.md'
    fact_check: pass
  fr:
    question: En établissement en France, à l’air en milieu naturel, jusqu’à quelle profondeur un GP-N4
      majeur titulaire de l’initiateur FFESSM peut-il encadrer seul une palanquée en formation technique,
      avec un DP et des élèves aux aptitudes adaptées ?
    choices:
    - text: 20 m
      correct: true
    - text: 40 m
      correct: false
    - text: 6 m
      correct: false
    explanation: Le GP-N4 titulaire de l’initiateur FFESSM est E2 et peut enseigner jusqu’à 20 m. L’enseignement
      entre 20 et 40 m exige au minimum un E3. La limite de 40 m du guide en exploration ne s’étend donc
      pas à l’enseignement ; 6 m correspond au domaine de l’E1.
- id: n4-cadre-artificiel-bapteme-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - 'Code du sport A322-98 (depuis 2012-04-18) et annexe III-16a ; vérifiés le 2026-10-12 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000025705107
      ; https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000025705128'
    - 'Revue individuelle : docs/reviews/n4/LOT_02_CADRE.md'
    fact_check: pass
  fr:
    question: En établissement en France, quel projet permet à un GP-N4 majeur sans qualification d’enseignant
      de réaliser un baptême à l’air à 5 m, avec l’autorisation du DP ?
    choices:
    - text: Un baptême en piscine dont la profondeur maximale est de 6 m
      correct: true
    - text: Un baptême en fosse de 20 m, limité à sa zone de 5 m
      correct: false
    - text: Un baptême en mer sur un fond dont la profondeur est de 6 m
      correct: false
    explanation: 'L’exception concerne les piscines et fosses dont la profondeur maximale ne dépasse pas
      6 m : le DP, au minimum E1, peut y autoriser un GP à effectuer des baptêmes. Une fosse de 20 m relève
      des règles du milieu naturel, même pour un baptême restant à 5 m. En milieu naturel, le baptême
      exige au minimum un enseignant E1.'
- id: n4-cadre-acces-dp-n5-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - MFT N5 FFESSM, mai 2026, p.3, vérifié le 2026-10-12 ; sources/n4/ffessm-n5-mai-2026.pdf ; https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/8cf7d863-c58a-4ce1-ad2d-116bdbde6a1f
    - 'Revue individuelle : docs/reviews/n4/LOT_02_CADRE.md'
    fact_check: pass
  fr:
    question: Pour obtenir le N5 FFESSM, un GP-N4 majeur doit notamment justifier d’une expérience et
      faire valider ses compétences de directeur de plongée. Quel couple satisfait ces deux exigences,
      les autres conditions étant remplies ?
    choices:
    - text: 15 plongées en situation de guide ; compétences acquises en situation réelle et validées par
        un E3 minimum
      correct: true
    - text: 15 plongées en autonomie ; compétences acquises en situation réelle et validées par un E3
        minimum
      correct: false
    - text: 15 plongées en situation de guide ; compétences acquises en situation réelle et validées par
        un E2 minimum
      correct: false
    explanation: Les quinze plongées doivent avoir été effectuées en situation de guide, pas simplement
      comme plongeur autonome. La qualification N5 est obtenue par évaluation continue de compétences
      acquises en situation réelle, avec validation par un encadrant habilité au minimum E3. Le GP-N4
      ne devient donc pas directeur de plongée par sa seule expérience de guidage.
- id: n4-cadre-parcours-moniteur-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - MFT MF1 FFESSM, juillet 2026, p.4 et 6, vérifié le 2026-10-12 ; sources/n4/ffessm-mf1-juillet-2026.pdf
      ; https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/273c29e5-04c9-4a39-8f0a-d682255dccd8
    - 'Revue individuelle : docs/reviews/n4/LOT_02_CADRE.md'
    fact_check: pass
  fr:
    question: Un GP-N4 FFESSM majeur souhaite préparer le MF1 par la filière classique. Il possède une
      licence valide et le RIFAP, mais ni l’initiateur ni le N5. Quel accès au stage initial MF1 lui est
      ouvert, les autres conditions étant remplies ?
    choices:
    - text: Il peut accéder au stage initial avec son GP-N4
      correct: true
    - text: Il doit d’abord obtenir l’initiateur FFESSM
      correct: false
    - text: Il doit d’abord obtenir le directeur de plongée N5
      correct: false
    explanation: 'L’initiateur et le N5 ne sont pas des prérequis du stage initial de la filière classique
      MF1 : le GP-N4 permet d’y accéder. Le parcours comprend ensuite un stage pédagogique en situation,
      un stage final et un examen. L’initiateur et le N5 peuvent ouvrir des allègements de formation ;
      ils ne sont pas obligatoires pour commencer ce parcours.'
- id: n4-cadre-commissions-comite-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - 'Statuts FFESSM 2023, art.27 et 30, p.21–22 du PDF, vérifiés le 2026-10-12 ; version liée par la
      commission juridique : https://ffessm.fr/uploads/media/docs/0001/11/d4671cf07cd93f6cd35b659cac5440424bc81367.pdf
      ; https://juridique.ffessm.fr/textes-federaux-ffessm'
    - 'Revue individuelle : docs/reviews/n4/LOT_02_CADRE.md'
    fact_check: pass
  fr:
    question: La Commission technique nationale de la FFESSM propose une modification du cursus GP-N4.
      Quelle instance détient le pouvoir d’approuver sa proposition pour la rendre exécutoire ?
    choices:
    - text: Le Comité directeur national
      correct: true
    - text: La Commission technique nationale
      correct: false
    - text: Le Conseil des commissions
      correct: false
    explanation: Les commissions étudient les questions de leur domaine et proposent des évolutions. Leurs
      propositions sont soumises au Comité directeur national, qui peut les rendre exécutoires. Le Conseil
      des commissions sert à réfléchir aux sujets transversaux et à formuler des propositions ; il ne
      remplace pas cette approbation.
- id: n4-cadre-echelons-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - N4-S01 — MFT GP-N4 FFESSM, mai 2026, p.9, règles d’organisation de l’examen, vérifié le 2026-10-12
    - 'Revue individuelle : docs/reviews/n4/LOT_02_CADRE.md'
    fact_check: pass
  fr:
    question: Un club affilié FFESSM situé en France métropolitaine veut organiser un examen GP-N4. À
      quelle instance doit-il demander l’autorisation d’organisation dans le cadre habituel ?
    choices:
    - text: À sa Commission technique régionale (CTR)
      correct: true
    - text: À sa Commission technique départementale (CTD)
      correct: false
    - text: À la Commission technique nationale (CTN)
      correct: false
    explanation: L’organisation de l’examen relève de la CTR, qui peut la déléguer à un comité départemental,
      un club ou une structure commerciale agréée. Le club adresse donc sa demande à sa CTR d’appartenance,
      au moins deux mois avant le début prévu. La CTN intervient dans les cas particuliers prévus pour
      des structures ou territoires non rattachés à une CTR.
- id: n4-cadre-commission-activite-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - 'CNEBS FFESSM — Plongeur PB1, page et rubrique des formations, consultées le 2026-10-12 : https://biologie.ffessm.fr/plongeur-pb1
      ; https://biologie.ffessm.fr/'
    - 'MFT GP-N4 mai 2026 p.4 et 27 : accueil et connaissance des commissions'
    - 'Revue individuelle : docs/reviews/n4/LOT_03_CADRE.md'
    fact_check: pass
  fr:
    question: Un plongeur encadré demande à son guide vers quelle commission FFESSM se tourner pour préparer
      le brevet PB1. Quelle commission porte ce cursus ?
    choices:
    - text: Environnement et biologie subaquatiques
      correct: true
    - text: Photo et vidéo sous-marines
      correct: false
    - text: Technique
      correct: false
    explanation: PB1 signifie Plongeur biologiste niveau 1. Ce cursus apprend la plongée d’observation
      et l’organisation générale de la vie subaquatique ; il est porté par la commission Environnement
      et biologie subaquatiques. La commission Technique porte les brevets de plongeur et d’encadrant
      en scaphandre ; la commission Photo et vidéo porte les formations à l’image sous-marine.
- id: n4-cadre-assistance-assurance-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - 'FFESSM — fiche pratique Individuelle Accident et Assistance 2026/2027, p.1, consultée le 2026-10-12
      : https://ffessm.fr/uploads/media/docs/0001/15/43959744e30030bd37e200cc1fe2599beeeb6a22.pdf'
    - 'Lafont — Déclarer un sinistre, rubrique assistance et rapatriement, consultée le 2026-10-12 : https://ffessm.lafont-assurances.com/declarer-un-sinistre/'
    - 'Revue individuelle : docs/reviews/n4/LOT_03_CADRE.md'
    fact_check: pass
  fr:
    question: Après un accident de plongée à l’étranger, un licencié ayant souscrit le contrat fédéral
      Individuelle Accident & Assistance demande l’organisation de son rapatriement médical, dans les
      conditions prévues au contrat. Quel volet correspond à cette prestation ?
    choices:
    - text: L’assistance à la personne
      correct: true
    - text: La responsabilité civile envers les tiers
      correct: false
    - text: Le capital versé pour invalidité permanente
      correct: false
    explanation: L’assistance organise notamment la prise en charge et, lorsque la situation le justifie
      et que le contrat le prévoit, le rapatriement médical. Une indemnité d’invalidité est une somme
      versée au titre de dommages corporels ; elle ne désigne pas l’organisation du transport. La responsabilité
      civile vise les dommages causés à autrui. Pour le contrat fédéral, le courtier indique AXA Assistance
      comme interlocuteur du rapatriement.
- id: n4-cadre-obligation-moyens-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - 'Code du sport A322-74, consulté le 2026-10-12 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000025393871'
    - 'FFESSM CTR Est — annale officielle GP-N4 cadre réglementaire juillet 2020, corrigé p.2 question
      2 obligation de moyens ; PDF lu le 2026-10-12 : https://technique.ffessmest.fr/uploads/file_manager/nDLkoKrC7u552KcpJm2OOt_vLKUmUbWgxXYOPf-4e0E/Annales%20examens%20GPN4/Cadre%20r%C3%A8glementaire/13.%20Cadre%20reglementaire%20GPN4%20juillet%202020.pdf'
    - 'Associations.gouv.fr — obligation de sécurité selon autonomie du pratiquant, consulté le 2026-10-12
      : https://associations.gouv.fr/la-responsabilite-des-associations-en-tant-que-personnes-morales'
    - 'Revue individuelle : docs/reviews/n4/LOT_03_CADRE.md'
    fact_check: pass
  fr:
    question: Pour la sécurité d’une exploration encadrée en immersion, sur quoi porte l’obligation de
      moyens du guide de palanquée ?
    choices:
    - text: Sur la mise en œuvre des mesures de sécurité adaptées aux plongeurs et aux circonstances
      correct: true
    - text: Sur la garantie d’une immersion sans accident pour les plongeurs encadrés
      correct: false
    explanation: Le guide doit mettre en œuvre les mesures de sécurité adaptées aux aptitudes du groupe
      et aux circonstances. Cette obligation de moyens porte sur sa conduite et ses précautions ; une
      obligation de résultat porterait sur l’obtention d’un résultat promis. La survenue d’un accident
      ne prouve donc pas, à elle seule, quel manquement a été commis.
- id: n4-cadre-causalite-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - 'Code civil art.1240, version depuis 2016-10-01, vérifié le 2026-10-12 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000032041571'
    - 'MFT GP-N4 mai 2026 p.27 : responsabilité civile et pénale'
    - 'Revue individuelle : docs/reviews/n4/LOT_03_CADRE.md'
    fact_check: pass
  fr:
    question: Après une plongée, une victime demande réparation au guide sur le fondement de sa faute
      personnelle, au titre de l’article 1240 du Code civil. Un dommage et une faute sont établis. Quel
      élément doit encore être établi pour compléter les conditions de cette responsabilité ?
    choices:
    - text: Un lien de causalité entre la faute et le dommage
      correct: true
    - text: Une intention du guide de provoquer le dommage
      correct: false
    - text: Une condamnation pénale préalable du guide
      correct: false
    explanation: La responsabilité pour faute personnelle suppose une faute, un dommage et un lien de
      causalité entre eux. Une faute sans rapport avec le dommage ne suffit pas à justifier cette réparation.
      L’intention de nuire et une condamnation pénale préalable ne sont pas requises par l’article 1240.
- id: n4-cadre-mise-danger-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - 'Code pénal art.223-1, version depuis 2011-05-19, page officielle consolidée consultée le 2026-10-12
      : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000024042637/2026-04-03?isSuggest=true'
    - 'Cour de cassation — Bulletin criminel janvier 2024, obligation particulière imposée par des dispositions
      françaises : https://www.courdecassation.fr/publications/bulletin-des-arrets-de-la-chambre-criminelle/numero-1-janvier-2024/mise-en-danger-de-la-personne'
    - 'Revue individuelle : docs/reviews/n4/LOT_03_CADRE.md'
    fact_check: pass
  fr:
    question: En droit français, quelle situation peut relever du délit de mise en danger d’autrui, même
      si personne n’a été blessé ?
    choices:
    - text: Une violation manifestement délibérée d’une obligation légale ou réglementaire précise, exposant
        directement à un risque immédiat de mort ou de blessure très grave
      correct: true
    - text: Une erreur non intentionnelle dans l’application d’une consigne interne, exposant à un risque
        immédiat de mort ou de blessure très grave
      correct: false
    - text: Une violation manifestement délibérée d’une obligation légale ou réglementaire précise, créant
        un risque hypothétique de blessure à terme
      correct: false
    explanation: Ce délit suppose une obligation particulière de prudence ou de sécurité imposée par la
      loi ou le règlement, une violation manifestement délibérée et une exposition directe à un risque
      immédiat de mort ou de blessures pouvant entraîner une mutilation ou une infirmité permanente. Le
      dommage n’a pas besoin de se produire. Une erreur involontaire ou un risque seulement hypothétique
      ne suffit pas à caractériser ce délit.
- id: n4-cadre-honorabilite-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - 'Code du sport L212-9, version depuis 2024-03-10, vérifié le 2026-10-12 : https://www.legifrance.gouv.fr/codes/id/LEGISCTA000006167039'
    - 'Ministère des Sports — contrôle d’honorabilité, consulté le 2026-10-12 : https://www.sports.gouv.fr/controle-d-honorabilite-64'
    - 'FFESSM — périmètre occasionnel et majeur, consulté le 2026-10-12 : https://ffessm.fr/lutter-contre-les-violences/les-violences-sexuelles'
    - 'Revue individuelle : docs/reviews/n4/LOT_04_CADRE.md'
    fact_check: pass
  fr:
    question: Dans un club FFESSM, un GP-N4 guide bénévolement et occasionnellement des palanquées composées
      d’adultes. Quel régime de contrôle d’honorabilité s’applique à sa fonction ?
    choices:
    - text: Contrôle applicable même à ce guidage bénévole et occasionnel
      correct: true
    - text: Dispense de contrôle pour un guidage bénévole limité aux adultes
      correct: false
    - text: Dispense de contrôle pour un guidage occasionnel limité aux adultes
      correct: false
    explanation: L’encadrement sportif relève de l’obligation d’honorabilité même lorsqu’il est bénévole,
      occasionnel et exercé auprès de majeurs. Le contrôle n’est donc réservé ni aux professionnels ni
      aux personnes encadrant des enfants. Le club et la fédération recueillent les données nécessaires
      à la vérification par les services de l’État ; la détention du brevet et de la licence ne remplace
      pas ce contrôle.
- id: n4-cadre-signalement-001
  type: mcq
  deck: Réglementation
  levels:
  - N4
  tags:
  - chapitre-n4::01
  status: reviewed
  review:
    sources:
    - 'Ministère des Sports — Signaler une violence, consulté le 2026-10-12 : https://www.sports.gouv.fr/signaler-une-violence-501'
    - 'FFESSM — Effectuer un signalement, victime/témoin direct et indirect, consulté le 2026-10-12 :
      https://ffessm.fr/lutter-contre-les-violences/effectuer-un-signalement'
    - 'Revue individuelle : docs/reviews/n4/LOT_04_CADRE.md'
    fact_check: pass
  fr:
    question: Un adulte rapporte à son guide des violences subies dans le cadre du club. Il n’y a pas
      de danger immédiat. À quel moment un signalement à Signal-Sports peut-il être transmis ?
    choices:
    - text: Dès le témoignage, sans attendre une plainte ou une procédure interne
      correct: true
    - text: Après le dépôt d’une plainte, sans attendre une procédure interne
      correct: false
    - text: Après la procédure disciplinaire du club, sans attendre une plainte
      correct: false
    explanation: Une victime ou un témoin peut transmettre les faits à la cellule ministérielle Signal-Sports,
      à signal-sports@sports.gouv.fr. Ce signalement n’est pas subordonné au dépôt d’une plainte ni à
      une procédure disciplinaire du club. La voie fédérale existe également, à stopviolence@ffessm.fr.
      Le guide rapporte les faits reçus ; il ne mène pas lui-même une enquête ni une confrontation.
