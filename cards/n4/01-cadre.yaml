  fr:
    question: Après une perte momentanée de palanquée résolue sans blessure, le guide veut contribuer
      au REX FFESSM. Quelle condition de recevabilité correspond à cette démarche ?
    choices:
    - text: Un quasi-accident peut être rapporté volontairement sans blessure
      correct: true
    - text: Un accident corporel doit avoir été déclaré à l’assureur
      correct: false
    - text: Une infraction aux règles doit avoir été constatée par le club
      correct: false
    explanation: Le retour d’expérience (REX) recueille des accidents, incidents, quasi-accidents et bonnes
      pratiques. Il cherche les facteurs utiles à la prévention, sans exiger une blessure, une déclaration
      d’assurance ou une infraction constatée. La démarche est volontaire et anonyme ; le contributeur
      peut laisser ses coordonnées pour des précisions. Elle sert à apprendre de l’événement après sa
      gestion immédiate.
