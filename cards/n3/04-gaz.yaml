    - 'Reprise N4 du 2026-10-12, lot 84 (reprises) : docs/reviews/n4/REPRISES_DETAILLEES.md ; 2026-10-12
      : MFT GP-N4 mai2026 conduite, physique et désaturation ; modèle de gaz parfait des exercices, calculs
      refaits par volume à1bar et capacité interne, pressions absolues5 et6,5bar. ; recto, choix et corrigé
      relus ; identité conservée'
    fact_check: pass
  fr:
    question: 'Bloc de 15 L, débit respiratoire de référence 18 L/min ramené à 1 bar, profondeur 40 m.
      De combien baisse la pression du bloc par minute ? Modèle : gaz parfait à température constante,
      1 bar en surface et +1 bar par 10 m ; seul le gaz respiré est compté.'
    choices:
    - text: 6 bar/min
      correct: true
    - text: 1,2 bar/min
      correct: false
    - text: 4,8 bar/min
      correct: false
    explanation: Pamb = 5 bar. Le gaz prélevé représente 18 × 5 = 90 L/min à 1 bar ; 90 / 15 = 6 bar/min.
      1,2 oublie la profondeur ; 4,8 utilise la pression relative de 4 bar.
