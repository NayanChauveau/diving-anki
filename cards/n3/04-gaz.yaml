  fr:
    question: 'Deux plongeurs respirent sur un seul stock, avec des débits de référence de 30 et 40 L/min
      à 1 bar. Quel volume total ramené à 1 bar consomment-ils pendant le retour suivant ?


      | Phase | Durée |

      | --- | --- |

      | Attente à 50 m | 1 min |

      | Trajet 50 → 6 m | 4,4 min |

      | Arrêt à 6 m | 3 min |

      | Trajet 6 → 3 m | 0,5 min |

      | Arrêt à 3 m | 5 min |

      | Trajet 3 m → surface | 0,5 min |


      Chaque trajet se fait à vitesse constante. Modèle : gaz parfait à température constante, 1 bar en
      surface et +1 bar par 10 m ; seul le gaz respiré est compté.'
    choices:
    - text: 2 472,4 L
      correct: true
    - text: 2 052,4 L
      correct: false
    - text: 1 412,8 L
      correct: false
    explanation: 'L’attente coûte 420 L, le trajet 50 → 6 m 1 170,4 L et les deux arrêts 336 + 455 = 791
      L. Les trajets 6 → 3 m et 3 m → surface coûtent 50,75 et 40,25 L. Total : 2 472,4 L. 2 052,4 L omet
      l’attente ; 1 412,8 L ne compte que le débit de 40 L/min. Chaque trajet linéaire utilise sa pression
      moyenne.'
