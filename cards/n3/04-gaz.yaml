  fr:
    question: 'Deux profils fictifs durent 6 min hors transitions. A : 2 min à 40 m puis 4 min à 3 m.
      B : 4 min à 40 m puis 2 min à 3 m. Débit de référence 20 L/min à 1 bar. Quels gaz à 1 bar demandent
      A puis B ? Modèle : gaz parfait à température constante, 1 bar en surface et +1 bar par 10 m ; seul
      le gaz respiré est compté.'
    choices:
    - text: 304 L puis 452 L
      correct: true
    - text: 452 L puis 304 L
      correct: false
    - text: 600 L puis 600 L
      correct: false
    explanation: A = 20 × (2 × 5 + 4 × 1,3) = 304 L ; B = 20 × (4 × 5 + 2 × 1,3) = 452 L. La même durée
      totale n’implique pas le même gaz ; la répartition en profondeur intervient.
