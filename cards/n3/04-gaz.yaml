    fact_check: pass
  fr:
    question: 'Un retour partagé exige 1 100 L à 1 bar. A a 12 L à 110 bar ; B, 15 L à 110 bar. L’exercice
      garde 20 bar dans le bloc donneur à la fin. Quel bloc peut financer à lui seul ce retour en conservant
      cette pression finale ? Modèle : gaz parfait à température constante, 1 bar en surface et +1 bar
      par 10 m ; seul le gaz respiré est compté.'
    choices:
    - text: B seulement
      correct: true
    - text: A et B
      correct: false
    - text: A seulement
      correct: false
    explanation: 'A : 12 × (110 − 20) = 1 080 L, insuffisant ; B : 15 × 90 = 1 350 L, suffisant. La même
      pression initiale ne représente pas le même stock de gaz.'
