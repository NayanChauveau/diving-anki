  fr:
    question: 'Bloc de 12 L, débit de référence 22 L/min ramené à 1 bar, profondeur 55 m. Quelle baisse
      théorique de pression en bar/min ? Modèle : gaz parfait à température constante, 1 bar en surface
      et +1 bar par 10 m ; seul le gaz respiré est compté.'
    choices:
    - text: 11,92 environ
      correct: true
    - text: 10,08 environ
      correct: false
    - text: 1,83 environ
      correct: false
    explanation: À 55 m, Pamb = 6,5 bar. 22 × 6,5 / 12 = 11,9167 bar/min. La pression relative 5,5 donnerait
      10,0833 ; le calcul à la surface donnerait 1,8333.
