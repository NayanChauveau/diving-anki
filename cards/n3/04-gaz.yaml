    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Revue N3 du 2026-10-10, lot 07 : MFT N3 décembre 2025, p.8,13 ; résolutions indépendantes du modèle
