    - 'Reprise N4 du 2026-10-12, lot 85 (reprises) : docs/reviews/n4/REPRISES_DETAILLEES.md ; 2026-10-12
      : MFT N3 et GP-N4 planification du gaz, charge collective et assistance ; modèle explicite des exercices
      ; tous les résultats et chaque leurre recalculés indépendamment. ; recto, choix et corrigé relus
      ; identité conservée'
    fact_check: pass
  fr:
    question: 'Deux plongeurs respirent sur un même stock, avec des débits de référence 30 et 40 L/min
      à 1 bar. Ils remontent à vitesse constante de 50 à 6 m en 4,4 min, sans arrêt. Quel volume à 1 bar
      utilisent-ils pour ce seul trajet ? Modèle : gaz parfait à température constante, 1 bar en surface
      et +1 bar par 10 m ; seul le gaz respiré est compté.'
    choices:
    - text: 1 170,4 L
      correct: true
    - text: 1 848 L
      correct: false
    - text: 862,4 L
      correct: false
    explanation: 'Débit cumulé : 30 + 40 = 70 L/min. Les pressions absolues passent de 6 à 1,6 bar ; leur
      moyenne vaut 3,8 bar sur ce trajet linéaire. Il faut 70 × 3,8 × 4,4 = 1 170,4 L. 1 848 L applique
      6 bar à tout le trajet ; 862,4 L utilise les pressions relatives, 5 et 0,6 bar.'
