      : MFT GP-N4 mai2026 conduite, physique et désaturation ; modèle de gaz parfait des exercices, calculs
      refaits par volume à1bar et capacité interne, pressions absolues5 et6,5bar. ; recto, choix et corrigé
      relus ; identité conservée'
    fact_check: pass
  fr:
    question: 'À 40 m, A avec 12 L et B avec 15 L ont tous deux une baisse de 6 bar/min. Quels sont leurs
      débits respiratoires de référence ramenés à 1 bar ? Modèle : gaz parfait à température constante,
      1 bar en surface et +1 bar par 10 m ; seul le gaz respiré est compté.'
    choices:
    - text: 'A : 14,4 L/min ; B : 18 L/min'
      correct: true
    - text: 'A : 18 L/min ; B : 14,4 L/min'
      correct: false
    - text: 'A : 18 L/min ; B : 18 L/min'
      correct: false
    explanation: 'À 5 bar absolus : A = 6 × 12 / 5 = 14,4 L/min ; B = 6 × 15 / 5 = 18 L/min. Inverser
      les résultats attribue la plus forte consommation au plus petit bloc. Donner 18 L/min aux deux applique
      le volume de 15 L aux deux blocs : des baisses égales en bar/min ne représentent pas des volumes
      égaux.'
