    fact_check: pass
  fr:
    question: 'À 40 m, la pression d’un bloc de 12 L baisse de 9 bar/min. Quel débit de référence ramené
      à 1 bar correspond à cette mesure ? Modèle : gaz parfait à température constante, 1 bar en surface
      et +1 bar par 10 m ; seul le gaz respiré est compté.'
    choices:
    - text: 21,6 L/min
      correct: true
    - text: 108 L/min
      correct: false
    - text: 27 L/min
      correct: false
    explanation: 9 × 12 = 108 L/min à 1 bar sont prélevés dans le bloc pour respirer à 40 m. Le débit
      de référence vaut 108 / 5 = 21,6 L/min. 108 L/min oublie de diviser par la pression ambiante ; 27
      L/min divise par les 4 bar relatifs au lieu des 5 bar absolus. Le calcul suppose que seul le gaz
      respiré est prélevé.
