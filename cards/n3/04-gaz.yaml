    fact_check: pass
  fr:
    question: 'Deux consommateurs sur un même stock ont ensemble un débit de référence 70 L/min à 1 bar.
      Deux arrêts sont imposés : 3 min à 6 m puis 5 min à 3 m. Sans compter les trajets, quel gaz à 1
      bar ces arrêts demandent-ils ? Modèle : gaz parfait à température constante, 1 bar en surface et
      +1 bar par 10 m ; seul le gaz respiré est compté.'
    choices:
    - text: 791 L
      correct: true
    - text: 560 L
      correct: false
    - text: 896 L
      correct: false
    explanation: 70 × (3 × 1,6 + 5 × 1,3) = 791 L. 560 utilise la pression de surface ; 896 applique la
      pression du premier arrêt aux huit minutes.
