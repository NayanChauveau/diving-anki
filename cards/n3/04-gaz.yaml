  fr:
    question: 'Un retour à deux exige 2 472,4 L ramenés à 1 bar. Le bloc donneur a un volume de 15 L ;
      l’exercice impose 20 bar encore présents à la fin. Quelle pression de départ minimale arrondie au
      bar supérieur donne ce budget ? Modèle : gaz parfait à température constante, 1 bar en surface et
      +1 bar par 10 m ; seul le gaz respiré est compté.'
    choices:
    - text: 185 bar
      correct: true
    - text: 165 bar
      correct: false
    - text: 227 bar
      correct: false
    explanation: 2 472,4 / 15 + 20 = 184,8267 bar, soit 185 bar au supérieur. 165 bar oublie les 20 bar
      finaux ; 227 bar utilise un bloc de 12 L puis arrondit au supérieur. La pression finale de 20 bar
      est une donnée de l’exercice.
