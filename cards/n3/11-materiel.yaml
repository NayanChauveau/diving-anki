cards:
- id: n3-materiel-blocs-flottabilite-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::11
  status: reviewed
  source_id: N3-11-04
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8,11 ; principe d’Archimède et calcul original aux masses/volumes
      imposés
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: 'En eau de masse volumique 1 kg/L, deux blocs fermés ont ces données à l’instant considéré
      : A, masse 18 kg et volume extérieur 16 L ; B, masse 20 kg et volume extérieur 19 L. Lequel a le
      poids apparent vers le bas le plus grand ?'
    choices:
    - text: 'A : équivalent de 2 kg, contre 1 kg pour B'
      correct: true
    - text: 'B : équivalent de 4 kg, contre 2 kg pour A'
      correct: false
    - text: 'B : équivalent de 20 kg, contre 18 kg pour A'
      correct: false
    explanation: 'Poussée d’Archimède : A déplace 16 kg d’eau, B 19 kg. Poids apparent exprimé en équivalent
      de masse : A = 18 − 16 = 2 kg ; B = 20 − 19 = 1 kg. Masse totale et volume extérieur interviennent
      ensemble, pas le matériau seul.'
- id: n3-materiel-partage-profondeur-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::11
  status: reviewed
  source_id: N3-11-01
  review:
    sources:
    - N3-S01 — MFT N3 décembre 2025 p.8,13
    - SCUBAPRO — Manuel détendeurs RevQ juillet 2025, p.5 et7, utilisation simultanée à deux ; https://johnsonoutdoors.widen.net/content/674le5usuw/original/SP_45101180_RevQ_Reg_manual_202507_FRA.pdf?download=true&u=trjrhb
      ; vérifié 2026-10-06
    - 'Revue : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Un ensemble SCUBAPRO conforme à la configuration de sa notice RevQ est marqué EN250A. Pour
      préparer un partage simultané à deux à 45 m, quel point de cette notice doit être pris en compte,
      même si chacun possède un embout distinct ?
    choices:
    - text: La notice limite l’utilisation simultanée à deux à 30 m ; cette configuration ne couvre pas
        le projet
      correct: true
    - text: La présence d’un octopus étend l’utilisation simultanée à deux jusqu’à 50 m
      correct: false
    - text: Le marquage EN250A étend l’utilisation simultanée à deux jusqu’à 60 m
      correct: false
    explanation: Les aptitudes du plongeur et le minimum réglementaire d’embout distinct ne suffisent
      pas à établir les limites du matériel. Cette notice limite le partage simultané à deux à 30 m, avec
      limites de température associées. On prépare le projet avec une configuration dont les possibilités
      sont documentées pour l’usage prévu.
