cards:
- id: n3-materiel-blocs-flottabilite-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::11
  status: reviewed
  source_id: N3-11-04
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8,11 ; principe d’Archimède et calcul original aux masses/volumes
      imposés
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Relecture 2026-10-11, lot 20 : Archimède, calculs 18−16 et 20−19 résolus séparément ; SCUBAPRO
      notice détendeurs RevQ 07/2025 p. 5 et 16, version référencée sur https://scubapro.johnsonoutdoors.com/us/manuals
      (consultée 2026-10-11).'
    fact_check: pass
  fr:
    question: 'En eau de masse volumique 1 kg/L, deux blocs fermés ont ces données à l’instant considéré
      : A, masse 18 kg et volume extérieur 16 L ; B, masse 20 kg et volume extérieur 19 L. Lequel a le
      poids apparent vers le bas le plus grand ?'
    choices:
    - text: 'A : équivalent de 2 kg, contre 1 kg pour B'
      correct: true
    - text: 'B : équivalent de 4 kg, contre 2 kg pour A'
      correct: false
    - text: 'B : équivalent de 20 kg, contre 18 kg pour A'
      correct: false
    explanation: 'Poussée d’Archimède : A déplace 16 kg d’eau, B 19 kg. Poids apparent exprimé en équivalent
      de masse : A = 18 − 16 = 2 kg ; B = 20 − 19 = 1 kg. Masse totale et volume extérieur interviennent
      ensemble, pas le matériau seul. Le choix 4 kg / 2 kg utilise à tort le volume extérieur de A pour
      les deux blocs ; 20 kg / 18 kg ignore la poussée de l’eau.'
- id: n3-materiel-partage-profondeur-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::11
  status: reviewed
  source_id: N3-11-01
  review:
    sources:
    - N3-S01 — MFT N3 décembre 2025 p.8,13
    - SCUBAPRO — Manuel détendeurs RevQ juillet 2025, p.5 et7, utilisation simultanée à deux ; https://johnsonoutdoors.widen.net/content/674le5usuw/original/SP_45101180_RevQ_Reg_manual_202507_FRA.pdf?download=true&u=trjrhb
      ; vérifié 2026-10-06
    - 'Revue : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Relecture 2026-10-11, lot 20 : Archimède, calculs 18−16 et 20−19 résolus séparément ; SCUBAPRO
      notice détendeurs RevQ 07/2025 p. 5 et 16, version référencée sur https://scubapro.johnsonoutdoors.com/us/manuals
      (consultée 2026-10-11).'
    fact_check: pass
  fr:
    question: Un ensemble SCUBAPRO conforme à sa notice RevQ est marqué EN250A. En eau à 12 °C, quelle
      profondeur maximale cette notice fixe-t-elle pour une utilisation simultanée par deux plongeurs
      ?
    choices:
    - text: 30 m
      correct: true
    - text: 50 m
      correct: false
    - text: 60 m
      correct: false
    explanation: 'La notice fixe 30 m au maximum pour une utilisation simultanée à deux. Les 50 m sont
      la profondeur de certification indiquée pour le détendeur, sans étendre à cette profondeur l’usage
      simultané à deux ; 60 m est une limite d’aptitude PA60, pas celle du matériel. Le marquage EN250A
      ajoute une limite de température de 4 °C pour cet usage : les 12 °C du recto la respectent.'
