      conservées.'
    fact_check: pass
  fr:
    question: Pour filmer un animal qui reste dans une cavité, quelle conduite respecte sa tranquillité
      ?
    choices:
    - text: Attendre à distance en laissant libre son issue
      correct: true
    - text: Tapoter doucement la roche en laissant libre son issue
      correct: false
    explanation: La discrétion concerne aussi les nuisances sonores. Tapoter pour faire sortir l’animal
      provoque volontairement une réaction, même sans le toucher et sans bloquer sa sortie. Attendre à
      distance permet l’observation en respectant son refuge.
