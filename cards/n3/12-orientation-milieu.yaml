cards:
- id: n3-orientation-retour-deux-branches-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-12-01
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,12–14 ; géométrie et scénarios originaux à données
      explicites
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: 'Sans courant, une palanquée contourne un obstacle : 40 m au cap 090°, puis 30 m au cap
      000°. Elle revient exactement par les mêmes deux segments en sens inverse. Quels caps suit-elle,
      dans l’ordre du retour ?'
    choices:
    - text: 180° puis 270°
      correct: true
    - text: 270° puis 180°
      correct: false
    - text: 180° puis 090°
      correct: false
    explanation: 'Le dernier segment se refait d’abord : inverse de 000° = 180°. Puis inverse de 090°
      = 270°. Inverser les caps sans inverser l’ordre des segments ne retrace pas le contour de l’obstacle.'
- id: n3-orientation-courant-trajectoire-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-12-02
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,12–14 ; géométrie et scénarios originaux à données
      explicites
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: 'Dans un exercice vu du dessus, un plongeur suit un cap 000° avec 20 m de déplacement vers
      le nord par rapport à l’eau. Le courant le déplace de 10 m vers l’est par rapport au fond. Où se
      trouve-t-il par rapport au départ ?


      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" role="img" aria-label="Vue du dessus
      : déplacement dans l’eau vers le nord et courant vers l’est" style="max-width:340px;width:100%;background:#fff"><g
      fill="none" stroke="#243b53" stroke-width="3"><path d="M65 185 L65 55 M65 55 L59 67 M65 55 L71 67"/><path
      d="M130 150 L250 150 M250 150 L238 144 M250 150 L238 156"/></g><g fill="#243b53" font-family="sans-serif"
      font-size="16"><text x="55" y="32">N</text><text x="275" y="157">E</text><text x="85" y="82">20
      m dans l’eau</text><text x="140" y="190">Courant : 10 m</text><text x="25" y="215">Départ</text></g><circle
      cx="65" cy="185" r="5" fill="#243b53"/></svg>'
    choices:
    - text: 20 m au nord et 10 m à l’est
      correct: true
    - text: 20 m au nord et 10 m à l’ouest
      correct: false
    - text: 10 m au nord et 20 m à l’est
      correct: false
    explanation: Le déplacement réel au fond est la somme du déplacement dans l’eau et de l’entraînement
      par le courant. Le compas indique l’orientation suivie, sans annuler la dérive.
- id: n3-orientation-reperes-compas-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-12-03
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,12–14 ; géométrie et scénarios originaux à données
      explicites
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Le retour prévu suit une paroi au cap 270°. La visibilité baisse ; un équipier suit une
      autre paroi au cap 090° en pensant avoir retrouvé la bonne. Quel contrôle met en évidence cette
      erreur de route ?
    choices:
    - text: Comparer le cap suivi aux 270° prévus et aux repères mémorisés
      correct: true
    - text: Comparer seulement la profondeur actuelle à celle du départ
      correct: false
    - text: Comparer seulement l’orientation de la lumière à celle observée à l’aller
      correct: false
    explanation: La même profondeur ou une durée comparable ne prouvent pas le bon trajet. Le cap opposé
      aux 270° attendus révèle une incohérence à confronter aux repères naturels, avant de poursuivre.
- id: n3-orientation-relief-sortie-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-12-04
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,12–14 ; géométrie et scénarios originaux à données
      explicites
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: 'Un relevé fourni décrit deux reliefs : A remonte de 20 m jusqu’à la côte ; B culmine à
      8 m puis redescend à 20 m de tous côtés. En cherchant la sortie du bord, quel relief peut conduire
      vers la côte ?'
    choices:
    - text: A
      correct: true
    - text: B
      correct: false
    - text: Les deux, puisqu’ils deviennent moins profonds
      correct: false
    explanation: A se prolonge jusqu’à la côte ; B est une roche isolée sous l’eau. Remonter le long d’un
      relief moins profond ne démontre pas qu’il mène à une sortie. Le profil du terrain complète profondeur
      et cap.
- id: n3-orientation-perte-limite-gaz-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-12-05
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,12–14 ; géométrie et scénarios originaux à données
      explicites
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Une palanquée perd ses repères. Le gaz permet encore le retour de repli convenu, mais pas
      une recherche de 10 min suivie de ce même retour. Quel choix respecte le budget préparé ?
    choices:
    - text: Utiliser maintenant le repli convenu en gardant la cohésion
      correct: true
    - text: Chercher 10 min puis reprendre exactement le même repli
      correct: false
    - text: Répartir les plongeurs sur plusieurs axes pour raccourcir la recherche
      correct: false
    explanation: Une recherche consomme aussi le budget de retour. Le repli est déclenché avant de devenir
      lui-même impossible ; la séparation ajoute un risque et ne crée pas du gaz disponible.
- id: n3-orientation-trafic-surface-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-12-06
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,12–14 ; géométrie et scénarios originaux à données
      explicites
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Le plan de récupération prévoyait une remontée au mouillage ; une dérive impose des paliers
      en pleine eau près d’un passage de bateaux. Quelle adaptation signale la palanquée au pilote et
      aux usagers avant l’émersion ?
    choices:
    - text: Déployer le parachute de signalisation selon la procédure maîtrisée
      correct: true
    - text: Attendre l’émersion pour faire le signe OK au bateau
      correct: false
    - text: Remonter séparément pour que le pilote repère plus facilement un plongeur
      correct: false
    explanation: Le parachute signale la présence de la palanquée et son arrêt en pleine eau. La remontée
      finale reste contrôlée, avec observation des dangers de surface et récupération préparée. Une distance
      d’éloignement locale doit être vérifiée pour le secteur.
- id: n3-milieu-sediments-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-12-07
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,12–14 ; géométrie et scénarios originaux à données
      explicites
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Un passage sur fond meuble est bas et la palanquée commence à soulever des sédiments. Quel
      ajustement réduit ce trouble sans prendre appui sur le fond ?
    choices:
    - text: Augmenter la distance au fond si le passage le permet, avec assiette et palmage adaptés
      correct: true
    - text: Dégonfler davantage pour avancer au plus près du sédiment
      correct: false
    - text: Accélérer le palmage pour traverser avant que le nuage ne s’étende
      correct: false
    explanation: La stabilisation, l’assiette et la direction du palmage limitent contact et remise en
      suspension. Se rapprocher du fond ou accélérer un palmage dirigé vers le sédiment augmente le trouble
      et diminue la visibilité.
- id: n3-milieu-eclairage-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-12-08
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,12–14 ; géométrie et scénarios originaux à données
      explicites
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Pour observer une faune fixée à courte distance, quelle pratique d’éclairage limite le dérangement
      tout en permettant l’observation ?
    choices:
    - text: Employer la lumière nécessaire et éviter une exposition forte et prolongée
      correct: true
    - text: Maintenir un éclairage maximal continu pour habituer les organismes
      correct: false
    - text: Maintenir le faisceau au même point jusqu’à ce que l’animal cesse de bouger
      correct: false
    explanation: Le MFT demande de limiter éclairage et nuisances et de rester discret. La lumière est
      adaptée à l’observation, sans poursuivre ou stimuler volontairement les organismes.
- id: n3-milieu-posidonie-nature-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-12-09
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.14–15
    - DORIS — Posidonia oceanica, fiche 265, mise à jour 21/07/2026, description ; https://doris.ffessm.fr/ref/specie/265
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: En Méditerranée, qu’est-ce qui distingue biologiquement la posidonie d’une algue ?
    choices:
    - text: C’est une plante à fleurs avec racines, rhizomes et feuilles
      correct: true
    - text: C’est une algue dont les crampons sont appelés racines
      correct: false
    - text: C’est une colonie animale dont les polypes ressemblent à des feuilles
      correct: false
    explanation: Posidonia oceanica est une plante marine à fleurs, endémique de Méditerranée. Ses herbiers
      forment un habitat ; l’aspect végétal d’un organisme ne suffit pas à dire qu’il s’agit d’une algue.
- id: n3-milieu-posidonie-mouillage-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-12-10
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.12,14
    - DORIS — Posidonia oceanica, fiche 265, biologie et menaces, mise à jour 21/07/2026 ; https://doris.ffessm.fr/ref/specie/265
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - OFB — Les herbiers de posidonies, pratiques de mouillage ; https://ofb.gouv.fr/les-herbiers-de-posidonies
      ; vérifié 2026-10-06
    fact_check: pass
  fr:
    question: Pourquoi le choix d’un mouillage hors d’un herbier de posidonie protège-t-il cet habitat
      méditerranéen ?
    choices:
    - text: L’ancre et la chaîne peuvent arracher et fragmenter l’herbier à croissance lente
      correct: true
    - text: L’ancre crée seulement un nuage temporaire sans modifier les rhizomes
      correct: false
    - text: L’herbier repousse rapidement à partir des fragments dispersés par la chaîne
      correct: false
    explanation: La posidonie forme des herbiers sensibles, dont la restauration est lente. Ancre et chaîne
      peuvent endommager les plantes et la structure du fond. On recherche les possibilités de mouillage
      autorisées et les dispositifs prévus pour le site.
- id: n3-milieu-anemone-contact-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-12-11
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.14–15
    - DORIS — Anemonia viridis, fiche 111, mise à jour 24/08/2025, alimentation/cnidocytes ; https://doris.ffessm.fr/ref/specie/111
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Sur un site méditerranéen, une anémone verte (Anemonia viridis) porte des tentacules souples.
      Quel risque justifie d’éviter leur contact ?
    choices:
    - text: Leurs cellules urticantes peuvent se déclencher au contact
      correct: true
    - text: Des pointes rigides sur les tentacules provoquent une perforation mécanique
      correct: false
    - text: Une morsure des tentacules, déclenchée quand on s’approche sans les toucher
      correct: false
    explanation: Les tentacules possèdent des cnidocytes, cellules urticantes servant notamment à capturer
      les proies. Une apparence souple et une fixation au fond ne rendent pas le contact sans risque ;
      on observe sans toucher.
- id: n3-organisation-regles-locales-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-12-12
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,12–14 ; géométrie et scénarios originaux à données
      explicites
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Une carte nautique montre un site adapté au profil ; le secteur appartient aussi à une aire
      protégée. Quel complément faut-il vérifier avant de choisir le mouillage ?
    choices:
    - text: Les règles d’accès et de mouillage en vigueur dans cette zone
      correct: true
    - text: Les règles de mouillage des plaisanciers, à l’exclusion de celles de l’aire protégée
      correct: false
    - text: Les restrictions d’immersion seules, puisqu’un bateau de plongée est dispensé des règles de
        mouillage
      correct: false
    explanation: 'La carte ne donne pas à elle seule toutes les règles de la zone. On consulte les textes/avis
      en vigueur et les informations de l’autorité gestionnaire : accès, mouillage et restrictions d’activité.
      Leur contenu dépend du secteur.'
- id: n3-orientation-tour-horizon-trois-metres-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-PDF-11
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.4,9,11,14 ; PDF local, vérifié le 2026-10-07
    - 'Revue PDF du 2026-10-07 : docs/reviews/n3/COMPLEMENTS_PDF_2026-10-07.md'
    fact_check: pass
  fr:
    question: La palanquée termine sa remontée, sans palier obligatoire restant. Pour contrôler les dangers
      de surface avant l’émersion, à quelle profondeur effectue-t-elle l’arrêt et le tour d’horizon de
      sécurité enseignés ?
    choices:
    - text: À 3 m
      correct: true
    - text: À 6 m
      correct: false
    - text: À 1 m
      correct: false
    explanation: L’arrêt et le tour d’horizon se font à 3 m avant la remontée finale contrôlée. Ils servent
      à observer les dangers de surface ; le parachute signale la palanquée mais ne dispense pas de cette
      observation.
- id: n3-milieu-nourrissage-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-PDF-12
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.4,9,11,14 ; PDF local, vérifié le 2026-10-07
    - 'Revue PDF du 2026-10-07 : docs/reviews/n3/COMPLEMENTS_PDF_2026-10-07.md'
    fact_check: pass
  fr:
    question: Lors d’une plongée d’observation, quelle règle s’applique au nourrissage des poissons par
      les plongeurs ?
    choices:
    - text: S’en abstenir, même avec un aliment consommé naturellement par l’espèce
      correct: true
    - text: Le permettre si l’aliment appartient au régime naturel de l’espèce
      correct: false
    - text: Le permettre si aucun contact physique n’est imposé aux poissons
      correct: false
    explanation: Le comportement responsable inclut le refus du nourrissage. L’observation se fait sans
      attirer les animaux avec de la nourriture ; la nature de l’aliment ou l’absence de contact ne rendent
      pas ce nourrissage conforme.
- id: n3-milieu-discretion-sonore-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-PDF-13
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.4,9,11,14 ; PDF local, vérifié le 2026-10-07
    - 'Revue PDF du 2026-10-07 : docs/reviews/n3/COMPLEMENTS_PDF_2026-10-07.md'
    fact_check: pass
  fr:
    question: Pour filmer un animal qui reste dans une cavité, quel choix respecte sa tranquillité tout
      en permettant l’observation ?
    choices:
    - text: Attendre à distance, sans tapoter la roche ni bloquer sa sortie
      correct: true
    - text: Tapoter doucement la roche, sans toucher directement l’animal
      correct: false
    - text: Fermer son issue avec la main, sans toucher directement l’animal
      correct: false
    explanation: Rester discret implique de limiter aussi les nuisances sonores et de laisser l’animal
      libre de ses déplacements. L’absence de contact direct ne suffit pas si le plongeur provoque une
      réaction ou bloque un refuge.
- id: n3-milieu-sar-tete-noire-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-PDF-14
  review:
    sources:
    - 'FFESSM DORIS — Diplodus vulgaris, clé d’identification et espèces ressemblantes : https://doris.ffessm.fr/Especes/Diplodus-vulgaris-Sar-a-tete-noire-161
      ; consulté le 2026-10-07'
    - 'Revue PDF du 2026-10-07 : docs/reviews/n3/COMPLEMENTS_PDF_2026-10-07.md'
    fact_check: pass
  fr:
    question: 'En Méditerranée, un poisson argenté au corps ovale présente deux larges barres noires :
      l’une sur la nuque, l’autre à la base de la queue. Parmi ces sars, lequel correspond à ces caractères
      ?'
    choices:
    - text: Le sar à tête noire (Diplodus vulgaris)
      correct: true
    - text: Le sar commun (Diplodus sargus)
      correct: false
    - text: Le sar tambour (Diplodus cervinus)
      correct: false
    explanation: Le sar à tête noire porte deux barres caractéristiques, sur la nuque et à la base de
      la queue. Le sar commun a une tache caudale sans la barre de nuque ; le sar tambour porte cinq à
      six larges bandes transversales brunes. La disposition des marques distingue ces poissons proches.
- id: n3-milieu-girelle-male-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-PDF-15
  review:
    sources:
    - 'FFESSM DORIS — Coris julis, clé et espèces ressemblantes : https://doris.ffessm.fr/Especes/Coris-julis-Girelle-commune-651
      ; consulté le 2026-10-07'
    - 'Revue PDF du 2026-10-07 : docs/reviews/n3/COMPLEMENTS_PDF_2026-10-07.md'
    fact_check: pass
  fr:
    question: En Méditerranée, un poisson élancé a le dos vert et une bande orange longitudinale en zigzag,
      avec une large tache noire sur le flanc. Quelle identification correspond à cette livrée ?
    choices:
    - text: Un mâle de girelle commune (Coris julis)
      correct: true
    - text: Une femelle de girelle commune (Coris julis)
      correct: false
    - text: Une femelle de girelle-paon (Thalassoma pavo)
      correct: false
    explanation: Chez la girelle commune, le mâle porte cette livrée ; la femelle a le dos brun et une
      bande blanche longitudinale. La girelle-paon possède d’autres marques, notamment des bandes verticales
      chez la femelle.
- id: n3-milieu-spirographe-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-PDF-16
  review:
    sources:
    - 'FFESSM DORIS — Sabella spallanzanii, description et classification : https://doris.ffessm.fr/Especes/Sabella-spallanzanii-Spirographe-403
      ; consulté le 2026-10-07'
    - 'Revue PDF du 2026-10-07 : docs/reviews/n3/COMPLEMENTS_PDF_2026-10-07.md'
    fact_check: pass
  fr:
    question: Un animal fixé sort d’un long tube souple un panache spiralé qu’il rétracte rapidement à
      l’approche d’un plongeur. De quel groupe fait partie le spirographe ainsi observé ?
    choices:
    - text: Des vers annélides
      correct: true
    - text: Des cnidaires, comme les anémones
      correct: false
    - text: Des mollusques, comme les bivalves
      correct: false
    explanation: Le spirographe (Sabella spallanzanii) est un ver annélide tubicole. Son panache sert
      à la respiration et à la collecte de particules ; il ne s’agit pas des tentacules d’une anémone.
