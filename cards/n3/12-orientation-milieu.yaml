cards:
- id: n3-orientation-retour-deux-branches-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-12-01
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,12–14 ; géométrie et scénarios originaux à données
      explicites
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: 'Sans courant, une palanquée contourne un obstacle : 40 m au cap 090°, puis 30 m au cap
      000°. Elle revient exactement par les mêmes deux segments en sens inverse. Quels caps suit-elle,
      dans l’ordre du retour ?'
    choices:
    - text: 180° puis 270°
      correct: true
    - text: 270° puis 180°
      correct: false
    - text: 180° puis 090°
      correct: false
    explanation: 'Le dernier segment se refait d’abord : inverse de 000° = 180°. Puis inverse de 090°
      = 270°. Inverser les caps sans inverser l’ordre des segments ne retrace pas le contour de l’obstacle.'
- id: n3-orientation-courant-trajectoire-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-12-02
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,12–14 ; géométrie et scénarios originaux à données
      explicites
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Revue N3 par petits lots du 2026-10-11, lot 21 : docs/reviews/n3/REVUE_ITERATIVE_2026-10-10.md
      ; identité et objectif conservés'
    - 'Relecture 2026-10-11 lot 21 : MFT N3 décembre 2025, p. 8–9 et 14 (orientation, repli, stabilisation,
      impact) ; calculs indépendants cap inverse 270°, arctan(10/20)=26,565°, budget 150/60=2,5 min ;
      signalisation palanquée / bateau distinguée.'
    fact_check: pass
  fr:
    question: 'Dans un exercice vu du dessus, un plongeur se déplace de 20 m vers le nord par rapport
      à l’eau ; le courant le déplace de 10 m vers l’est par rapport au fond. Quel est le cap de sa trajectoire
      résultante au fond, arrondi au degré et mesuré depuis le nord dans le sens horaire ?


      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 230" role="img" aria-label="Deux composantes
      : vingt mètres vers le nord puis dix mètres vers l’est" style="max-width:340px;width:100%;background:#fff"><g
      fill="none" stroke="#243b53" stroke-width="3"><path d="M65 185 L65 55 M65 55 L59 67 M65 55 L71 67"/><path
      d="M65 55 L130 55 M130 55 L118 49 M130 55 L118 61"/></g><g fill="#243b53" font-family="sans-serif"
      font-size="16"><text x="55" y="32">N</text><text x="150" y="62">E</text><text x="85" y="125">20
      m dans l’eau</text><text x="100" y="32">Courant : 10 m</text><text x="25" y="215">Départ</text></g><circle
      cx="65" cy="185" r="5" fill="#243b53"/></svg>'
    choices:
    - text: 027°
      correct: true
    - text: 063°
      correct: false
    - text: 333°
      correct: false
    explanation: Le déplacement au fond combine 20 m vers le nord et 10 m vers l’est. L’angle à l’est
      du nord vaut arctan(10 / 20) = 26,6°, soit 027°. Les 063° inversent les deux composantes ; 333°
      place la dérive vers l’ouest. Le cap suivi dans l’eau reste 000°, mais le courant déplace la trajectoire
      au fond.
- id: n3-orientation-relief-sortie-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-12-04
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,12–14 ; géométrie et scénarios originaux à données
      explicites
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Revue pédagogique du 2026-10-09 : docs/reviews/QUALITE_GLOBALE_2026-10-09.md ; objectif et identité
      conservés'
    fact_check: pass
  fr:
    question: Pour retrouver une sortie du bord, une palanquée suit un relief qui monte de 20 à 8 m. Un
      relevé indique qu’il redescend ensuite à 20 m de tous côtés. Que permet de conclure ce relief ?
    choices:
    - text: Il s’agit d’un relief isolé ; sa remontée ne donne pas à elle seule la direction de la côte
      correct: true
    - text: Son sommet indique la direction de la côte ; il suffit de continuer dans le sens de la montée
      correct: false
    - text: Sa pente indique la direction du mouillage ; il suffit de la suivre en sens inverse
      correct: false
    explanation: 'Un relief qui redescend de tous côtés forme une élévation isolée sous l’eau. Remonter
      sa pente ne démontre pas qu’elle mène à la côte : il faut confronter le relief aux repères et au
      cap du retour.'
- id: n3-organisation-regles-locales-001
  type: mcq
  deck: Matériel et préparation
