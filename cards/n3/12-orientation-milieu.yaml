      111 (Anemonia viridis), 161 (Diplodus vulgaris), https://doris.ffessm.fr/ref/specie/265, /111, /161
      ; OFB https://ofb.gouv.fr/les-herbiers-de-posidonies. Chaque choix relu, références préexistantes
      conservées.'
    fact_check: pass
  fr:
    question: Quel motif de marques caractérise le sar à tête noire, Diplodus vulgaris, en Méditerranée
      ?
    choices:
    - text: Deux larges barres noires, sur la nuque et à la base de la queue
      correct: true
    - text: Une large barre noire sur la nuque, sans marque à la base de la queue
      correct: false
    - text: Cinq à six larges bandes transversales brunes réparties sur le corps
      correct: false
    explanation: 'Le sar à tête noire porte deux barres caractéristiques, sur la nuque et à la base de
      la queue. Son nom ne décrit que la première : la marque caudale compte aussi pour l’identification.
      Les cinq à six bandes brunes caractérisent le sar tambour, Diplodus cervinus ; le sar commun, Diplodus
      sargus, porte une tache caudale sans la barre de nuque.'
- id: n3-milieu-girelle-male-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-PDF-15
  review:
    sources:
    - 'FFESSM DORIS — Coris julis, clé et espèces ressemblantes : https://doris.ffessm.fr/Especes/Coris-julis-Girelle-commune-651
      ; consulté le 2026-10-07'
    - 'Revue PDF du 2026-10-07 : docs/reviews/n3/COMPLEMENTS_PDF_2026-10-07.md'
    - 'Vérifié 2026-10-11 lot 23 : DORIS Coris julis fiche 651, description et patron initial (femelles
      et jeunes mâles) ; Sabella spallanzanii fiche 403, description / panache respiratoire et alimentaire
      ; https://doris.ffessm.fr/ref/specie/651 et /403. Relecture individuelle documentée.'
    - 'DORIS Thalassoma pavo fiche 744, livrée initiale : 4 à 6 bandes bleu ciel ; https://doris.ffessm.fr/ref/specie/744
      ; consulté 2026-10-11.'
    fact_check: pass
  fr:
    question: En Méditerranée, un poisson élancé a le dos vert et une bande orange longitudinale en zigzag,
      avec une large tache noire sur le flanc. Quelle identification correspond à cette livrée ?
    choices:
    - text: Un mâle de girelle commune (Coris julis)
      correct: true
    - text: Une femelle de girelle commune (Coris julis)
      correct: false
    - text: Une femelle de girelle-paon (Thalassoma pavo)
      correct: false
    explanation: Cette livrée est celle d’un mâle adulte de girelle commune. La livrée initiale, au dos
      brun et à bande blanche longitudinale, concerne les femelles et aussi certains jeunes mâles. La
      girelle-paon femelle présente notamment quatre à six bandes verticales bleu ciel, différentes de
      la bande orange en zigzag.
- id: n3-milieu-spirographe-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-PDF-16
  review:
    sources:
    - 'FFESSM DORIS — Sabella spallanzanii, description et classification : https://doris.ffessm.fr/Especes/Sabella-spallanzanii-Spirographe-403
      ; consulté le 2026-10-07'
    - 'Revue PDF du 2026-10-07 : docs/reviews/n3/COMPLEMENTS_PDF_2026-10-07.md'
    - 'Vérifié 2026-10-11 lot 23 : DORIS Coris julis fiche 651, description et patron initial (femelles
      et jeunes mâles) ; Sabella spallanzanii fiche 403, description / panache respiratoire et alimentaire
      ; https://doris.ffessm.fr/ref/specie/651 et /403. Relecture individuelle documentée.'
    fact_check: pass
  fr:
    question: Un animal fixé sort d’un long tube souple un panache spiralé qu’il rétracte rapidement à
      l’approche d’un plongeur. De quel groupe fait partie le spirographe ainsi observé ?
    choices:
    - text: Des vers annélides
      correct: true
    - text: Des cnidaires, comme les anémones
      correct: false
    - text: Des mollusques, comme les bivalves
      correct: false
    explanation: Le spirographe (Sabella spallanzanii) est un ver annélide tubicole. Son panache sert
      à la respiration et à la collecte de particules ; il ne s’agit pas des tentacules d’une anémone.
