    - 'Revue N3 par petits lots du 2026-10-11, lot 22 : docs/reviews/n3/REVUE_ITERATIVE_2026-10-10.md
      ; identité et objectif conservés'
    - 'Vérifié 2026-10-11 lot 22 : MFT N3 décembre 2025 p. 9 et 14 ; DORIS fiches 265 (Posidonia oceanica),
      111 (Anemonia viridis), 161 (Diplodus vulgaris), https://doris.ffessm.fr/ref/specie/265, /111, /161
      ; OFB https://ofb.gouv.fr/les-herbiers-de-posidonies. Chaque choix relu, références préexistantes
      conservées.'
    - 'Recoupement lot 26 le 2026-10-11 : objectif précisé mouillage/bouées ; n2-documents-zones-reglementees-001
      couvre distinctement l’autorisation d’immersion. https://portcros-parcnational.fr/fr/le-parc-national-de-port-cros/la-reglementation/reglementation-en-mer/plongee-sous-marine
      (usage des bouées / règlement annuel).'
    fact_check: pass
  fr:
    question: Une carte nautique montre un site dans une aire marine protégée. Pour savoir où mouiller
      le bateau et à quelles conditions utiliser les bouées du secteur, quel texte consulter en complément
      ?
    choices:
    - text: Le règlement local de cette aire protégée
      correct: true
    - text: Les dispositions générales du Code du sport sur les aptitudes des plongeurs
      correct: false
    explanation: Le règlement local peut définir les zones de mouillage et les conditions d’utilisation
      des bouées. Consulter les textes et avis en vigueur et les informations du gestionnaire. Les dispositions
      générales du Code du sport sur les aptitudes des plongeurs ne donnent pas ces conditions nautiques
      locales.
- id: n3-orientation-tour-horizon-trois-metres-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-PDF-11
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.4,9,11,14 ; PDF local, vérifié le 2026-10-07
    - 'Revue PDF du 2026-10-07 : docs/reviews/n3/COMPLEMENTS_PDF_2026-10-07.md'
    - 'Vérification 2026-10-11 lot 22 : DORIS Anemonia viridis fiche 111, alimentation/cnidocytes ; MFT
      N3 décembre 2025 p. 9 (3 m) et p. 14 (refus du nourrissage). Carte conservée après relecture du
      recto, de chaque choix et du corrigé.'
    fact_check: pass
  fr:
    question: La palanquée termine sa remontée, sans palier obligatoire restant. Pour contrôler les dangers
      de surface avant l’émersion, à quelle profondeur effectue-t-elle l’arrêt et le tour d’horizon de
      sécurité enseignés ?
    choices:
    - text: À 3 m
      correct: true
    - text: À 6 m
      correct: false
    - text: À 1 m
      correct: false
    explanation: L’arrêt et le tour d’horizon se font à 3 m avant la remontée finale contrôlée. Ils servent
      à observer les dangers de surface ; le parachute signale la palanquée mais ne dispense pas de cette
      observation.
- id: n3-milieu-nourrissage-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::12
  status: reviewed
  source_id: N3-PDF-12
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.4,9,11,14 ; PDF local, vérifié le 2026-10-07
    - 'Revue PDF du 2026-10-07 : docs/reviews/n3/COMPLEMENTS_PDF_2026-10-07.md'
    - 'Vérification 2026-10-11 lot 22 : DORIS Anemonia viridis fiche 111, alimentation/cnidocytes ; MFT
      N3 décembre 2025 p. 9 (3 m) et p. 14 (refus du nourrissage). Carte conservée après relecture du
      recto, de chaque choix et du corrigé.'
    fact_check: pass
  fr:
    question: Lors d’une plongée d’observation, quelle règle s’applique au nourrissage des poissons par
      les plongeurs ?
    choices:
    - text: S’en abstenir, même avec un aliment consommé naturellement par l’espèce
      correct: true
    - text: Le permettre si l’aliment appartient au régime naturel de l’espèce
      correct: false
    - text: Le permettre si aucun contact physique n’est imposé aux poissons
      correct: false
    explanation: Le comportement responsable inclut le refus du nourrissage. L’observation se fait sans
      attirer les animaux avec de la nourriture ; la nature de l’aliment ou l’absence de contact ne rendent
      pas ce nourrissage conforme.
