      ; identité et objectif conservés'
    - 'Vérifié 2026-10-11 lot 22 : MFT N3 décembre 2025 p. 9 et 14 ; DORIS fiches 265 (Posidonia oceanica),
      111 (Anemonia viridis), 161 (Diplodus vulgaris), https://doris.ffessm.fr/ref/specie/265, /111, /161
