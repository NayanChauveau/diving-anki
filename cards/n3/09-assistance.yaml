    - N3-S04 — RIFAP FFESSM, mai 2026, p.10–20
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Dans une palanquée de trois, A assiste B en difficulté. C est disponible et dispose de gaz.
      Quel rôle de C conserve la cohésion sans gêner l’assistance ?
    choices:
    - text: Rester avec eux, surveiller et communiquer les paramètres utiles du retour
      correct: true
    - text: Partir seul vers la surface pour prévenir sans rester en contact
      correct: false
    - text: Rester à proximité mais poursuivre son propre profil de décompression indépendamment
      correct: false
    explanation: 'Le troisième reste intégré au retour et apporte une observation ou une aide utile :
      gaz, profondeur, désaturation, orientation, selon le cas. S’éloigner sans nécessité ajoute une séparation
      à l’incident.'
- id: n3-assistance-gaz-palier-insuffisant-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N3
  tags:
  - chapitre-n3::09
  status: reviewed
  source_id: N3-09-06
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.9–10,13
    - N3-S04 — RIFAP FFESSM, mai 2026, p.10–20
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8,13,15 ; calculs originaux, modèle de gaz idéal et phases
      imposées ; corrigés indépendants dans docs/reviews/n3/CALCULS_N3.csv
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: 'Dans un exercice de budget avant immersion, le retour partagé obligatoire demande 1 000
      L à 1 bar ; le stock utilisable prévu est 800 L. Quelle modification résout cette incompatibilité
      de plan ? Modèle : gaz parfait à température constante, 1 bar en surface et +1 bar par 10 m ; seul
      le gaz respiré est compté.'
    choices:
    - text: Revoir avant départ le profil ou le stock utilisable pour couvrir tout le retour
      correct: true
    - text: Conserver le profil en réduisant arbitrairement les paliers à 80 %
      correct: false
    - text: Conserver le profil en supposant un débit réel inférieur au débit imposé
      correct: false
    explanation: 'Le manque de 200 L est une incompatibilité du plan : on adapte profil, stock et organisation
      avant immersion. On ne raccourcit pas un palier obligatoire pour équilibrer un budget, ni ne remplace
      une donnée par une consommation espérée.'
- id: n3-assistance-surface-001
  type: mcq
