- id: n3-assistance-sans-signe-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N3
  tags:
  - chapitre-n3::09
  status: reviewed
  source_id: N3-09-01
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.9–10,13
    - N3-S04 — RIFAP FFESSM, mai 2026, p.10–20
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Revue N3 par petits lots du 2026-10-10, lot 15 : docs/reviews/n3/REVUE_ITERATIVE_2026-10-10.md
      ; identité et objectif conservés'
    - 'MFT N3 décembre 2025, p.9–10,13 : manifestations observables, prise en charge, gilets et vitesse
      ; RIFAP mai 2026 p.10–14, protection/ventilation/flottabilité/remorquage, relus localement le 2026-10-10
      ; revue N3 lot 15'
    fact_check: pass
  fr:
    question: À 35 m, un équipier devient agité, ventile fortement et répond mal aux échanges, sans faire
      de signe conventionnel. Quelle conduite est adaptée ?
    choices:
    - text: Intervenir sur la base des manifestations observables sans attendre une demande volontaire
      correct: true
    - text: Confirmer d’abord une demande par un signe conventionnel avant de prendre en charge l’équipier
      correct: false
    explanation: 'Les manifestations observables peuvent suffire à identifier une difficulté : ventilation
      anormale, agitation, perte de vigilance. L’équipier peut ne plus être capable de demander de l’aide.
      On intervient rapidement, calmement et sans brutalité ; l’absence de signe volontaire ne justifie
      pas d’attendre.'
- id: n3-assistance-cooperation-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N3
  tags:
  - chapitre-n3::09
  status: reviewed
  source_id: N3-09-02
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.9–10,13
    - N3-S04 — RIFAP FFESSM, mai 2026, p.10–20
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Revue pédagogique du 2026-10-09 : docs/reviews/QUALITE_GLOBALE_2026-10-09.md ; objectif et identité
      conservés'
    - 'Revue N3 par petits lots du 2026-10-10, lot 15 : docs/reviews/n3/REVUE_ITERATIVE_2026-10-10.md
      ; identité et objectif conservés'
    - 'MFT N3 décembre 2025, p.9–10,13 : manifestations observables, prise en charge, gilets et vitesse
      ; RIFAP mai 2026 p.10–14, protection/ventilation/flottabilité/remorquage, relus localement le 2026-10-10
      ; revue N3 lot 15'
    fact_check: pass
  fr:
    question: Un équipier ne répond plus aux échanges mais continue à respirer sur son détendeur. Sur
      quoi faut-il se baser pour savoir s’il peut participer volontairement à sa remontée assistée ?
    choices:
    - text: Sa capacité à comprendre et exécuter une consigne, vérifiée par sa réaction
      correct: true
    - text: La présence de bulles respiratoires, qui atteste à elle seule une coopération possible
      correct: false
    - text: La disponibilité du gaz au détendeur, qui atteste à elle seule une coopération possible
      correct: false
    explanation: Respirer ou recevoir du gaz ne prouve pas la capacité à comprendre et agir. La coopération
      se juge par les réactions de l’équipier. S’il ne réagit plus, on ne compte pas sur ses gestes pour
      gérer sa flottabilité ou protéger sa ventilation ; la prise en charge doit assurer sa sécurité et
      sa sortie.
- id: n3-assistance-stock-donneur-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N3
  tags:
  - chapitre-n3::09
  status: reviewed
  source_id: N3-09-03
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.9–10,13
    - N3-S04 — RIFAP FFESSM, mai 2026, p.10–20
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Le bloc d’un équipier est inutilisable pour tout le retour ; il passe sur la source de secours
      de son binôme. Quelle information devient déterminante pour le gaz du retour partagé ?
    choices:
    - text: La pression et le volume du bloc qui alimente maintenant les deux plongeurs
      correct: true
    - text: La moyenne des pressions des deux blocs, y compris celui devenu inutilisable
      correct: false
    - text: La seule pression du bloc du receveur avant l’incident
      correct: false
    explanation: Le retour partagé est alimenté par le stock réellement accessible du donneur. Le débit
      cumulé et toutes les phases de retour sont pris en compte ; la pression d’un bloc inutilisable n’augmente
      pas le gaz disponible.
- id: n3-assistance-flottabilite-double-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N3
  tags:
  - chapitre-n3::09
  status: reviewed
  source_id: N3-09-04
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.9–10,13
    - N3-S04 — RIFAP FFESSM, mai 2026, p.10–20
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Revue N3 par petits lots du 2026-10-10, lot 15 : docs/reviews/n3/REVUE_ITERATIVE_2026-10-10.md
      ; identité et objectif conservés'
    - 'MFT N3 décembre 2025, p.9–10,13 : manifestations observables, prise en charge, gilets et vitesse
      ; RIFAP mai 2026 p.10–14, protection/ventilation/flottabilité/remorquage, relus localement le 2026-10-10
      ; revue N3 lot 15'
    - 'SCUBAPRO BCS Manual, sections 8–9, p.16–18, inflateur, purges et soupape de surpression, consulté
      2026-10-10 : https://johnsonoutdoors.widen.net/content/dpvkr30pah/pdf/SP_BC_Manual_FR.pdf ; fonction
      physique, aucune périodicité d’entretien reprise'
    fact_check: pass
  fr:
    question: Pendant une remontée assistée, le sauveteur doit surveiller la flottabilité des deux gilets.
      Les gilets ne sont pas pleins. Que devient le gaz déjà présent dans ces gilets lorsque la pression
      ambiante baisse ?
    choices:
    - text: Il se dilate ; le contrôle de la remontée nécessite des purges adaptées
      correct: true
    - text: Son volume est maintenu automatiquement par la compensation des détendeurs
      correct: false
    - text: Son volume est maintenu automatiquement par les soupapes de surpression
      correct: false
    explanation: Le gaz des deux gilets se dilate lorsque la pression ambiante baisse. La compensation
      d’un détendeur concerne son fonctionnement, pas le volume du gilet. Une soupape de surpression limite
      une pression excessive ; elle ne garantit pas le volume nécessaire pour maîtriser la flottabilité.
      Il faut contrôler les purges et la vitesse des deux plongeurs.
- id: n3-assistance-troisieme-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N3
  tags:
  - chapitre-n3::09
  status: reviewed
  source_id: N3-09-05
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.9–10,13
    - N3-S04 — RIFAP FFESSM, mai 2026, p.10–20
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Dans une palanquée de trois, A assiste B en difficulté. C est disponible et dispose de gaz.
      Quel rôle C doit-il adopter pendant ce retour assisté ?
    choices:
    - text: Rester avec eux, surveiller et communiquer les paramètres utiles du retour
      correct: true
    - text: Partir seul vers la surface pour prévenir sans rester en contact
      correct: false
    - text: Rester à proximité mais poursuivre son propre profil de décompression indépendamment
      correct: false
    explanation: 'Le troisième reste intégré au retour et apporte une observation ou une aide utile :
      gaz, profondeur, désaturation, orientation, selon le cas. S’éloigner sans nécessité ajoute une séparation
      à l’incident.'
- id: n3-assistance-gaz-palier-insuffisant-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N3
  tags:
  - chapitre-n3::09
  status: reviewed
  source_id: N3-09-06
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.9–10,13
    - N3-S04 — RIFAP FFESSM, mai 2026, p.10–20
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8,13,15 ; calculs originaux, modèle de gaz idéal et phases
      imposées ; corrigés indépendants dans docs/reviews/n3/CALCULS_N3.csv
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Revue N3 par petits lots du 2026-10-10, lot 15 : docs/reviews/n3/REVUE_ITERATIVE_2026-10-10.md
      ; identité et objectif conservés'
    - 'MFT N3 décembre 2025, p.9–10,13 : manifestations observables, prise en charge, gilets et vitesse
      ; RIFAP mai 2026 p.10–14, protection/ventilation/flottabilité/remorquage, relus localement le 2026-10-10
      ; revue N3 lot 15'
    fact_check: pass
  fr:
    question: 'Avant immersion, un exercice prévoit un retour partagé de 1 000 L à 1 bar, mais seulement
      800 L utilisables. Le profil et les arrêts calculés restent identiques. Parmi ces stocks de remplacement,
      lequel finance le retour en conservant les 20 bar finaux imposés par l’exercice ? Modèle : gaz parfait
      à température constante ; seul le gaz respiré est compté.'
    choices:
    - text: Bloc de 15 L à 100 bar
      correct: true
    - text: Bloc de 12 L à 100 bar
      correct: false
    - text: Bloc de 15 L à 80 bar
      correct: false
    explanation: Après les 20 bar finaux, les stocks utilisables valent respectivement 15 × 80 = 1 200
      L, 12 × 80 = 960 L et 15 × 60 = 900 L. Seul le premier couvre les 1 000 L. Le plan est révisé avant
      immersion ; réduire arbitrairement les arrêts obligatoires ne constitue pas une correction du budget.
- id: n3-assistance-surface-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N3
  tags:
  - chapitre-n3::09
  status: reviewed
  source_id: N3-09-08
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.9–10,13
    - N3-S04 — RIFAP FFESSM, mai 2026, p.10–20
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Revue pédagogique du 2026-10-09 : docs/reviews/QUALITE_GLOBALE_2026-10-09.md ; objectif et identité
      conservés'
    fact_check: pass
  fr:
    question: À la surface, avant tractage d’un plongeur incapable de se maintenir seul, quels deux objectifs
      doivent être assurés ensemble ?
    choices:
    - text: Assurer une flottabilité positive et maintenir les voies aériennes hors de l’eau
      correct: true
    - text: Assurer une flottabilité positive et laisser la position du visage dépendre du gilet
      correct: false
    - text: Maintenir les voies aériennes hors de l’eau et dégonfler complètement le gilet pour le tractage
      correct: false
    explanation: On assure une flottabilité positive et on maintient activement les voies aériennes hors
      de l’eau. Un gilet de plongée gonflé ne garantit pas à lui seul la position du visage. Le dégonfler
      complètement retire cette aide à la flottabilité ; le tractage doit conserver la protection de la
      ventilation et la sécurité du plongeur.
