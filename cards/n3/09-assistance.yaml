  status: reviewed
  source_id: N3-09-03
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.9–10,13
    - N3-S04 — RIFAP FFESSM, mai 2026, p.10–20
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Un équipier passe sur la source de secours de son binôme. Quelle information devient déterminante
      pour le gaz du retour partagé ?
    choices:
    - text: La pression et le volume du bloc qui alimente maintenant les deux plongeurs
      correct: true
    - text: La moyenne des pressions des deux blocs, y compris celui devenu inutilisable
      correct: false
    - text: La seule pression du bloc du receveur avant l’incident
      correct: false
    explanation: Le retour partagé est alimenté par le stock réellement accessible du donneur. Le débit
      cumulé et toutes les phases de retour sont pris en compte ; la pression d’un bloc inutilisable n’augmente
      pas le gaz disponible.
- id: n3-assistance-flottabilite-double-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N3
  tags:
  - chapitre-n3::09
  status: reviewed
  source_id: N3-09-04
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.9–10,13
    - N3-S04 — RIFAP FFESSM, mai 2026, p.10–20
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Pendant une remontée assistée à deux gilets, quel phénomène doit être surveillé dans les
      équipements des deux plongeurs ?
    choices:
    - text: La dilatation du gaz, qui peut accélérer la remontée si elle n’est pas contrôlée
      correct: true
    - text: La compression du gaz, qui augmente la flottabilité à la remontée
      correct: false
    - text: La baisse de pression, qui garde constant le volume des deux gilets
      correct: false
    explanation: La baisse de pression ambiante fait augmenter le volume du gaz dans les deux gilets.
      L’assistance exige un contrôle continu de flottabilité et de vitesse, en tenant compte des deux
      équipements, sans attendre l’alarme de l’ordinateur.
- id: n3-assistance-troisieme-001
  type: mcq
  deck: Prévention des accidents
