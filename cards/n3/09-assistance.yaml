cards:
- id: n3-assistance-sans-signe-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N3
  tags:
  - chapitre-n3::09
  status: reviewed
  source_id: N3-09-01
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.9–10,13
    - N3-S04 — RIFAP FFESSM, mai 2026, p.10–20
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: À 35 m, un équipier devient agité, ventile fortement et répond mal aux échanges, sans faire
      de signe conventionnel. Quel indice justifie l’intervention ?
    choices:
    - text: L’ensemble des comportements anormaux, même sans demande volontaire
      correct: true
    - text: Le seul signe conventionnel de demande d’aide, indispensable pour intervenir
      correct: false
    - text: Le manomètre seul, car un gaz disponible écarte un besoin d’assistance
      correct: false
    explanation: La perte de vigilance et la ventilation anormale sont des manifestations observables
      de difficulté. L’intervention n’attend pas un signe volontaire que l’équipier peut ne plus être
      capable de faire ; elle reste calme et adaptée.
- id: n3-assistance-cooperation-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N3
  tags:
  - chapitre-n3::09
  status: reviewed
  source_id: N3-09-02
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.9–10,13
    - N3-S04 — RIFAP FFESSM, mai 2026, p.10–20
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Revue pédagogique du 2026-10-09 : docs/reviews/QUALITE_GLOBALE_2026-10-09.md ; objectif et identité
      conservés'
    fact_check: pass
  fr:
    question: En immersion, quelle différence essentielle distingue un équipier conscient coopératif d’un
      équipier qui ne réagit plus ?
    choices:
    - text: Le premier peut participer aux gestes ; le second nécessite une prise en charge de sa sécurité
      correct: true
    - text: Le premier nécessite la prise en charge de ses gestes ; le second peut suivre les consignes
        tactiles
      correct: false
    - text: Les deux peuvent suivre les mêmes consignes dès que leur détendeur fournit du gaz
      correct: false
    explanation: La vigilance et la capacité à agir déterminent l’aide nécessaire. Un équipier non réactif
      ne peut pas compter sur ses propres gestes ou communications ; sa prise en charge requiert une assistance
      immédiate adaptée et une sortie sécurisée.
- id: n3-assistance-stock-donneur-001
  type: mcq
  deck: Prévention des accidents
  levels:
