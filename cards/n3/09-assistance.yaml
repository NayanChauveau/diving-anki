    - 'Revue pédagogique du 2026-10-09 : docs/reviews/QUALITE_GLOBALE_2026-10-09.md ; objectif et identité
      conservés'
    fact_check: pass
  fr:
    question: À la surface, avant tractage d’un plongeur incapable de se maintenir seul, quels deux objectifs
      doivent être assurés ensemble ?
    choices:
    - text: Assurer la flottabilité et maintenir les voies aériennes hors de l’eau
      correct: true
    - text: Assurer la flottabilité et laisser la position du visage dépendre du gilet
      correct: false
    - text: Maintenir les voies aériennes hors de l’eau et dégonfler le gilet pour faciliter le tractage
      correct: false
    explanation: La mise en sécurité vise à empêcher une nouvelle submersion et à conserver les voies
      aériennes dégagées. Le matériel est adapté à la récupération ; tractage et hissage se travaillent
      en formation pratique.
