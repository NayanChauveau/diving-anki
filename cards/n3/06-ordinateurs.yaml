    fact_check: pass
  fr:
    question: Sur un Peregrine, TTS vaut 12 min et @+5 vaut 18 min. À hypothèses de remontée inchangées,
      que prédit @+5 ?
    choices:
    - text: Une TTS de 18 min si l’on reste 5 min de plus à la profondeur actuelle
      correct: true
    - text: Une arrivée en surface dans 18 min, comprenant déjà les 5 min au fond
      correct: false
    - text: Une autonomie gaz de 18 min avant épuisement du bloc
      correct: false
    explanation: '@+5 est la TTS prévue après cinq minutes de plus au niveau actuel. Le retour à partir
      de maintenant prendrait donc ces cinq minutes supplémentaires, puis la nouvelle TTS. Ce n’est pas
      une autonomie gaz ni une promesse indépendante du profil.'
