      p.11–16,25,33–39 ; affichages originaux limités aux champs documentés
    - Shearwater Peregrine, notice française Doc.16001-SI-RevB du 06/07/2020 (fichier officiel nommé 2021),
      p.28,32–33
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Revue N3 par petits lots du 2026-10-10, lot 12 : docs/reviews/n3/REVUE_ITERATIVE_2026-10-10.md
      ; identité et objectif conservés'
    - 'Peregrine Doc.16001-SI-RevB, p.11–12,16,26,30,33–34,38 relues ; PDF toujours proposé par le support
      officiel le 2026-10-10 ; notes V89 du 2025-09-22 consultées pour les changements pertinents : https://shearwater.com/pages/peregrine-support
      ; MFT N3 décembre 2025 p.8–9,13 ; revue N3 lot 12'
    fact_check: pass
  fr:
    question: Pour une plongée avec décompression uniquement à l’air, un Peregrine en mode Nitrox 3 gaz
      a de l’air actif et un mélange à 50 % d’oxygène activé, mais non emporté. Quel effet ce gaz absent
      peut-il avoir sur le temps de retour prévu ?
    choices:
    - text: Le sous-estimer en prévoyant le passage au 50 % pendant la décompression
      correct: true
    - text: Le sous-estimer en calculant la respiration au fond comme si le 50 % était déjà actif
      correct: false
    - text: Ne pas le modifier, car seul le gaz actif entre dans la prévision de remontée
      correct: false
    explanation: Le gaz actif décrit celui respiré actuellement ; les gaz activés sont ceux que l’appareil
      suppose disponibles pour le retour. Le Peregrine peut prévoir un passage au 50 % en décompression
      et afficher un retour plus court que celui réalisable à l’air. Il ne transforme pas automatiquement
      le gaz actif au fond ; les gaz absents doivent être désactivés.
- id: n3-ordinateur-profondimetre-001
  type: mcq
