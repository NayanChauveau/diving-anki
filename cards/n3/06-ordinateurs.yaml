      officiel le 2026-10-10 ; notes V89 du 2025-09-22 consultées pour les changements pertinents : https://shearwater.com/pages/peregrine-support
      ; MFT N3 décembre 2025 p.8–9,13 ; revue N3 lot 12'
    fact_check: pass
  fr:
    question: Un Peregrine simulé affiche DECO STOP 6 m / 2 min et TTS 9 min. Que représentent les 9 min
      ?
    choices:
    - text: Le temps estimé restant pour atteindre la surface, trajets et arrêts compris
      correct: true
    - text: Le temps estimé restant pour effectuer tous les arrêts, trajets exclus
      correct: false
    - text: Le temps écoulé depuis le début de l’immersion, arrêts compris
      correct: false
    explanation: 'TTS signifie Time To Surface : l’estimation de la durée de retour en surface, avec les
      trajets et les arrêts, aux hypothèses de l’appareil. Les 2 min ne concernent que l’arrêt affiché
      à 6 m. La somme des seuls arrêts omet les trajets ; le temps écoulé est un autre affichage.'
- id: n3-ordinateur-paliers-communs-001
  type: mcq
  deck: Désaturation
  levels:
  - N3
  tags:
  - chapitre-n3::06
  status: reviewed
  source_id: N3-06-04
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.9,13,15
    - Shearwater Peregrine, notice française Doc.16001-SI-RevB du 06/07/2020 (fichier officiel nommé 2021),
      p.11–16,25,33–39 ; affichages originaux limités aux champs documentés
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: 'À 6 m, deux équipiers à l’air ont un arrêt obligatoire au même niveau : A affiche encore
      2 min, B 5 min. Gaz disponible pour respecter les deux, aucun autre problème. Quel critère autorise
      ensuite leur remontée ensemble ?'
    choices:
    - text: L’achèvement de l’arrêt de chacun et la compatibilité des indications suivantes
      correct: true
    - text: L’achèvement des 2 min de A, qui a le temps le plus court
      correct: false
    - text: L’achèvement de 3,5 min, moyenne des deux obligations
      correct: false
    explanation: L’arrêt de B demeure obligatoire après que celui de A est terminé. La palanquée respecte
      les obligations de chacun, puis contrôle les éventuels niveaux suivants. Une moyenne de durées n’est
      une procédure d’aucun des deux appareils.
- id: n3-ordinateur-gf-cohabitation-001
  type: mcq
  deck: Désaturation
  levels:
  - N3
  tags:
  - chapitre-n3::06
  status: reviewed
  source_id: N3-06-05
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.9,13,15
    - Shearwater Peregrine, notice française Doc.16001-SI-RevB du 06/07/2020 (fichier officiel nommé 2021),
      p.11–16,25,33–39 ; affichages originaux limités aux champs documentés
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Deux équipiers ont des réglages GF différents sur des ordinateurs qui ont chacun suivi leur
      propre historique de plongées. Quelle information détermine leurs arrêts communs pendant la remontée
      ?
    choices:
    - text: Les obligations concrètes affichées par les deux ordinateurs
      correct: true
    - text: Le seul appareil dont GF haut est le plus petit
      correct: false
    - text: Le seul appareil dont GF bas est le plus petit
      correct: false
    explanation: 'Les GF (Gradient Factors, facteurs de gradient) ne suffisent pas à désigner un appareil
      toujours plus contraignant : l’historique de charge, le modèle et le profil interviennent aussi.
      Le seul GF haut ou le seul GF bas ne résume pas ces contraintes. La palanquée respecte les profondeurs
      et durées imposées par chacun, avec un budget de gaz compatible.'
- id: n3-ordinateur-planificateur-residuel-001
  type: mcq
  deck: Désaturation
  levels:
  - N3
  tags:
  - chapitre-n3::06
  status: reviewed
  source_id: N3-06-06
  review:
