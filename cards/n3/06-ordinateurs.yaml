- id: n3-ordinateur-arret-ceil-001
  type: mcq
  deck: Désaturation
  levels:
  - N3
  tags:
  - chapitre-n3::06
  status: reviewed
  source_id: N3-06-01
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.9,13,15
    - Shearwater Peregrine, notice française Doc.16001-SI-RevB du 06/07/2020 (fichier officiel nommé 2021),
      p.11–16,25,33–39 ; affichages originaux limités aux champs documentés
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Revue N3 par petits lots du 2026-10-10, lot 12 : docs/reviews/n3/REVUE_ITERATIVE_2026-10-10.md
      ; identité et objectif conservés'
    - 'Peregrine Doc.16001-SI-RevB, p.11–12,16,26,30,33–34,38 relues ; PDF toujours proposé par le support
      officiel le 2026-10-10 ; notes V89 du 2025-09-22 consultées pour les changements pertinents : https://shearwater.com/pages/peregrine-support
      ; MFT N3 décembre 2025 p.8–9,13 ; revue N3 lot 12'
    fact_check: pass
  fr:
    question: Un affichage Peregrine simulé indique profondeur actuelle 8 m, DECO STOP 6 m / 2 min et
      CEIL 4,7 m. Quel couple donne la profondeur du palier demandé et le plafond calculé à ne pas franchir
      vers la surface ?
    choices:
    - text: 'Palier : 6 m ; plafond : 4,7 m'
      correct: true
    - text: 'Palier : 4,7 m ; plafond : 6 m'
      correct: false
    - text: 'Palier : 8 m ; plafond : 6 m'
      correct: false
    explanation: 'DECO STOP indique un palier à 6 m pendant 2 min. CEIL indique un plafond calculé de
      4,7 m : ne pas remonter moins profond que cette valeur. Inverser ces deux valeurs confond palier
      arrondi et plafond non arrondi ; 8 m est la profondeur actuelle, pas un palier demandé.'
- id: n3-ordinateur-tts-arret-001
  type: mcq
  deck: Désaturation
