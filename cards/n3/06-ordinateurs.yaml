      officiel le 2026-10-10 ; notes V89 du 2025-09-22 consultées pour les changements pertinents : https://shearwater.com/pages/peregrine-support
      ; MFT N3 décembre 2025 p.8–9,13 ; revue N3 lot 12'
    fact_check: pass
  fr:
    question: Après une plongée du matin suivie en mode Air, un Peregrine passe en mode Profondimètre,
      puis revient en mode Air. Que devient sa charge calculée de gaz inerte ?
    choices:
    - text: Elle est réinitialisée lors des changements depuis ou vers le mode Profondimètre
      correct: true
    - text: Elle est conservée en pause pendant le mode Profondimètre, puis reprise au retour en Air
      correct: false
    - text: Elle est reconstituée automatiquement à partir du carnet au retour en mode Air
      correct: false
    explanation: 'Le Peregrine ne suit pas les compartiments en mode Profondimètre : il fournit profondeur
      et durée. Passer depuis ou vers ce mode réinitialise la charge calculée. Revenir en mode Air ne
      restaure pas le suivi de la plongée du matin à partir du carnet ; l’azote résiduel du plongeur ne
      disparaît pas lors du changement de mode.'
- id: n3-ordinateur-panne-briefing-001
  type: mcq
