  fr:
    question: Un affichage Peregrine simulé indique profondeur 8 m, DECO STOP 6 m / 2 min et CEIL 4,7
      m. À quelle profondeur vise-t-on l’arrêt demandé par DECO STOP ?
    choices:
    - text: 6 m
      correct: true
    - text: 4,7 m
      correct: false
    - text: 2 m
      correct: false
    explanation: DECO STOP demande l’arrêt à 6 m pour 2 min. CEIL est le plafond calculé non arrondi à
      un multiple de 3 m ; ce n’est pas la profondeur du palier affiché. La profondeur actuelle est 8
      m.
