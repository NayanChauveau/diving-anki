    - 'Revue N3 par petits lots du 2026-10-10, lot 12 : docs/reviews/n3/REVUE_ITERATIVE_2026-10-10.md
      ; identité et objectif conservés'
    - 'Peregrine Doc.16001-SI-RevB, p.11–12,16,26,30,33–34,38 relues ; PDF toujours proposé par le support
      officiel le 2026-10-10 ; notes V89 du 2025-09-22 consultées pour les changements pertinents : https://shearwater.com/pages/peregrine-support
      ; MFT N3 décembre 2025 p.8–9,13 ; revue N3 lot 12'
    fact_check: pass
  fr:
    question: Un Peregrine ayant suivi la plongée du matin est consulté après l’intervalle de surface.
      Son planificateur de décompression, en mode Nitrox 3 gaz avec seul l’air activé, prépare la plongée
      de l’après-midi. Quelle charge de départ utilise-t-il ?
    choices:
    - text: La charge résiduelle actuelle, avec désaturation pour l’intervalle saisi
      correct: true
    - text: La charge calculée à la sortie du matin, sans désaturation pendant l’intervalle
      correct: false
    - text: Une charge nulle utilisée pour chaque nouvelle simulation du planificateur
      correct: false
    explanation: Le planificateur utilise la saturation résiduelle des compartiments et tient compte de
      l’intervalle de surface indiqué. Il ne fige pas la charge à la sortie de l’eau et ne suppose pas
      systématiquement un plongeur désaturé. Il faut conserver le suivi personnel des immersions.
- id: n3-ordinateur-gaz-absent-001
  type: mcq
  deck: Désaturation
