  fr:
    question: Avant une plongée uniquement à l’air, un Peregrine en mode Nitrox 3 gaz a de l’air actif
      et du 50 % activé, mais aucun bloc à 50 % ne sera emporté. Quel réglage fausse le retour calculé
      ?
    choices:
    - text: Le 50 % activé, car l’appareil prévoit son utilisation pour la décompression
      correct: true
    - text: L’air actif, car le mode 3 gaz n’accepte pas un mélange à 21 %
      correct: false
    - text: Le 50 % activé, car il remplace automatiquement l’air dès la descente
      correct: false
    explanation: 'Les gaz activés participent à la prévision de décompression ; les gaz non disponibles
      doivent être désactivés avant le départ. Un gaz actif reste celui sélectionné : l’appareil ne le
      remplace pas automatiquement à la descente.'
