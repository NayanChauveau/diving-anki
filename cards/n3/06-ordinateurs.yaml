    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Au briefing d’une plongée avec paliers possibles, quel dispositif de secours permet de conserver
      un suivi personnel si l’ordinateur principal tombe en panne ?
    choices:
    - text: Un ordinateur de secours personnel ayant suivi les mêmes immersions, avec conduite de panne
        convenue
      correct: true
    - text: Un ordinateur resté sur le bateau, réglé à la même paire GF
      correct: false
    - text: Le seul ordinateur de l’équipier, même si les profils antérieurs diffèrent
      correct: false
    explanation: Le suivi personnel continu est essentiel. Un appareil resté à sec n’a pas suivi la plongée
      ; celui d’un équipier peut avoir une charge différente. La procédure de panne et le retour sont
      préparés avant immersion selon les moyens réellement disponibles.
