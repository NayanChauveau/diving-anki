  fr:
    question: Deux équipiers ont des réglages GF différents sur des ordinateurs qui ont chacun suivi leurs
      plongées. Quelle information détermine leurs arrêts communs pendant la remontée ?
    choices:
    - text: Les obligations concrètes affichées par les deux ordinateurs
      correct: true
    - text: Le seul appareil dont GF haut est le plus petit
      correct: false
    - text: Le seul appareil dont GF bas est le plus petit
      correct: false
    explanation: 'Les réglages ne suffisent pas à désigner un appareil toujours plus contraignant : charge
      passée, modèle et profil interviennent. On respecte les profondeurs et durées imposées par chacun,
      avec un plan de gaz commun compatible.'
