  fr:
    question: Un Peregrine est utilisé en mode Profondimètre pendant une plongée. Que manque-t-il dans
      ce mode pour gérer la désaturation ?
    choices:
    - text: Le calcul actif de décompression et le suivi des compartiments
      correct: true
    - text: La mesure de profondeur et de durée de l’immersion
      correct: false
    - text: La possibilité de mesurer une profondeur supérieure à 40 m
      correct: false
    explanation: Le mode Profondimètre fournit profondeur et temps, sans calculer la décompression. Le
      passage vers ce mode ou son abandon réinitialise les compartiments sur ce modèle ; le suivi des
      successives doit être préparé en conséquence.
- id: n3-ordinateur-panne-briefing-001
  type: mcq
  deck: Désaturation
  levels:
