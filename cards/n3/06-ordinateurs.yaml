    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Un Peregrine simulé affiche DECO STOP 6 m / 2 min et TTS 9 min. Que représentent les 9 min
      ?
    choices:
    - text: L’estimation du retour en surface avec trajets et arrêts, aux hypothèses de l’appareil
      correct: true
    - text: Le temps de l’arrêt actuel à 6 m, sans les trajets
      correct: false
    - text: Le temps de fond encore disponible avant décompression obligatoire
      correct: false
    explanation: TTS correspond à la durée de remontée estimée, avec trajets et arrêts prévus. Les 2 min
      concernent l’arrêt affiché ; les 9 min ne sont ni ce seul arrêt ni une réserve de temps au fond.
- id: n3-ordinateur-paliers-communs-001
  type: mcq
  deck: Désaturation
  levels:
