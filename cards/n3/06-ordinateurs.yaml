    fact_check: pass
  fr:
    question: Un Peregrine ayant suivi la plongée du matin est consulté après l’intervalle de surface.
      Son planificateur de décompression, en mode Nitrox 3 gaz avec seul l’air activé, prépare la plongée
      de l’après-midi. Quelle charge prend-il en compte ?
    choices:
    - text: La charge résiduelle calculée par cet ordinateur
      correct: true
    - text: Une charge nulle dès que l’écran principal affiche la surface
      correct: false
    - text: Une majoration MN90 déduite automatiquement du carnet de plongée
      correct: false
    explanation: Le planificateur utilise la charge actuelle des compartiments. Il faut conserver le même
      suivi personnel et contrôler gaz, réglages et intervalle ; un ordinateur n’ayant pas suivi la première
      plongée ne possède pas la même charge.
