    - Shearwater Peregrine, notice française Doc.16001-SI-RevB du 06/07/2020 (fichier officiel nommé 2021),
      p.11–16,25,33–39 ; affichages originaux limités aux champs documentés
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Revue pédagogique du 2026-10-09 : docs/reviews/QUALITE_GLOBALE_2026-10-09.md ; objectif et identité
      conservés'
    - 'Revue N3 par petits lots du 2026-10-10, lot 12 : docs/reviews/n3/REVUE_ITERATIVE_2026-10-10.md
      ; identité et objectif conservés'
    - 'Peregrine Doc.16001-SI-RevB, p.11–12,16,26,30,33–34,38 relues ; PDF toujours proposé par le support
      officiel le 2026-10-10 ; notes V89 du 2025-09-22 consultées pour les changements pertinents : https://shearwater.com/pages/peregrine-support
      ; MFT N3 décembre 2025 p.8–9,13 ; revue N3 lot 12'
    fact_check: pass
  fr:
    question: Un plongeur a fait une plongée le matin et prépare une seconde immersion avec paliers possibles.
      Quelle configuration de secours conserverait son suivi personnel si son ordinateur principal tombait
      en panne pendant cette seconde plongée ?
    choices:
    - text: Un ordinateur personnel de secours porté pendant les deux immersions
      correct: true
    - text: Un ordinateur de secours resté au bateau, avec les mêmes réglages que le principal
      correct: false
    - text: L’ordinateur d’un équipier qui n’a suivi que l’immersion de l’après-midi
      correct: false
    explanation: Le secours personnel doit avoir suivi les mêmes immersions pour disposer de sa propre
      charge résiduelle calculée. Les réglages seuls ne reconstruisent pas un profil manquant. L’appareil
      de l’équipier n’a pas suivi la plongée du matin ; sa charge peut différer. La procédure de panne
      et le retour se préparent avant l’immersion.
- id: n3-ordinateur-tts-variation-001
  type: mcq
  deck: Désaturation
  levels:
  - N3
  tags:
  - chapitre-n3::06
  status: reviewed
  source_id: N3-06-11
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.9,13,15
    - Shearwater Peregrine, notice française Doc.16001-SI-RevB du 06/07/2020 (fichier officiel nommé 2021),
      p.11–16,25,33–39 ; affichages originaux limités aux champs documentés
    - Shearwater Peregrine, notice française Doc.16001-SI-RevB du 06/07/2020 (fichier officiel nommé 2021),
      p.16
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Revue N3 par petits lots du 2026-10-10, lot 13 : docs/reviews/n3/REVUE_ITERATIVE_2026-10-10.md
      ; identité et objectif conservés'
    - Peregrine Doc.16001-SI-RevB p.16, @+5 et DTR ; notes V89, distinction @+5/Δ+5 ; vérification 2026-10-10,
      revue N3 lot 13
    fact_check: pass
  fr:
    question: Sur un Peregrine, TTS vaut 12 min et @+5 vaut 18 min. Si le plongeur reste encore 5 min
      à la profondeur actuelle puis commence sa remontée, quel délai total à partir de maintenant est
      estimé avant la surface, à hypothèses de remontée inchangées ?
    choices:
    - text: 23 min
      correct: true
    - text: 18 min
      correct: false
    - text: 35 min
      correct: false
    explanation: TTS est le temps estimé jusqu’à la surface en partant maintenant ; @+5 est la nouvelle
      TTS prévue après cinq minutes de plus au niveau actuel. Le délai vaut donc 5 + 18 = 23 min. 18 min
      suppose que @+5 inclut déjà l’attente au fond ; 35 min ajoute à tort l’ancienne TTS de 12 min à
      la nouvelle, comme si @+5 était un supplément.
