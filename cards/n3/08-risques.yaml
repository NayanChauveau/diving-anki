  fr:
    question: À l’air, quel mécanisme relie directement la profondeur à l’augmentation du travail ventilatoire,
      distinct de la narcose ?
    choices:
    - text: L’augmentation de densité du gaz et des résistances à son écoulement
      correct: true
    - text: La hausse de pression partielle d’azote agissant seule sur les muscles respiratoires
      correct: false
    - text: La baisse de fraction d’oxygène de l’air quand la profondeur augmente
      correct: false
    explanation: Le gaz devient plus dense sous pression, ce qui augmente les résistances ventilatoires.
      La hausse de pression partielle des gaz concerne d’autres effets, notamment la narcose ; la fraction
      d’oxygène de l’air ne diminue pas avec la profondeur.
- id: n3-risques-po2-60-001
  type: mcq
