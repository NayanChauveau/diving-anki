    fact_check: pass
  fr:
    question: Au fond, le courant augmente, un équipier commence à frissonner et sa consommation dépasse
      la prévision. Quelle adaptation du plan tient compte de ces trois changements ?
    choices:
    - text: Déclencher le retour collectif plus tôt et réévaluer les besoins avec le débit observé
      correct: true
    - text: Conserver la durée prévue en réduisant seulement la vitesse de palmage
      correct: false
    - text: Conserver le seuil de retour initial sans modifier le budget tant qu’il n’est pas atteint
      correct: false
    explanation: Froid, effort et débit accru réduisent la marge de retour. La palanquée reste ensemble,
      réévalue le gaz nécessaire et abrège l’exploration. Réduire seulement le palmage ne traite ni le
      froid ni le nouveau budget ; conserver un seuil établi avec une consommation démentie ne finance
      pas nécessairement le retour.
