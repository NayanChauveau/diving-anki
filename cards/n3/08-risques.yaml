    fact_check: pass
  fr:
    question: À bord, après une sortie sécurisée, un plongeur conscient garde une gêne respiratoire faisant
      suspecter un OPI. Quelle prise en charge immédiate est adaptée ?
    choices:
    - text: Position de confort respiratoire, oxygène, alerte médicale et surveillance
      correct: true
    - text: Position allongée avec jambes surélevées imposée, oxygène et alerte médicale
      correct: false
    - text: Position assise, eau à boire malgré la gêne respiratoire, oxygène et alerte médicale
      correct: false
    explanation: La gêne respiratoire motive oxygène et alerte, sans attendre un diagnostic sur le bateau.
      La position doit faciliter la respiration ; on surveille conscience et ventilation et suit les consignes
      médicales. Une réimmersion n’est pas un traitement.
