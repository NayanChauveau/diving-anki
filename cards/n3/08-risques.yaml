      : Peregrine Doc16001-SI-RevB p.16,26,38 relues dans cette passe, distinction @+5/Δ+5 des notes V89
      déjà contrôlée ; MFT GP-N4 désaturation ; DAN Mitchell mécanique ventilatoire et gaz parfait. ;
      recto, choix et corrigé relus ; identité conservée'
    fact_check: pass
  fr:
    question: À température constante, de quel facteur la masse volumique de l’air est-elle multipliée
      entre 20 et 60 m ? Assimiler l’air à un gaz parfait de composition constante.
    choices:
    - text: 7/3, soit environ 2,33
      correct: true
    - text: 60/20, soit 3
      correct: false
    - text: '1 : la composition de l’air reste identique'
      correct: false
    explanation: 'À température et composition constantes, la masse volumique est proportionnelle à la
      pression absolue : 3 bar à 20 m et 7 bar à 60 m, donc un rapport de 7/3. Le gaz plus dense augmente
      les résistances à son écoulement et le travail ventilatoire ; sa composition ne change pas.'
