  fr:
    question: Quel événement caractérise le risque aigu de toxicité de l’oxygène sur le système nerveux
      central lors d’une exposition hyperbare ?
    choices:
    - text: Une crise convulsive exposant à la noyade en immersion
      correct: true
    - text: Une euphorie et un ralentissement du raisonnement, sans crise convulsive
      correct: false
    explanation: 'La toxicité neurologique de l’oxygène hyperbare peut provoquer une crise convulsive
      et une perte de contrôle exposant à la noyade. L’euphorie et le ralentissement du raisonnement évoquent
      plutôt la narcose à l’azote. Le risque toxique dépend de la pression partielle d’oxygène (PO₂),
      de la durée et des conditions d’exposition : il n’existe pas de seuil garantissant l’absence de
      crise.'