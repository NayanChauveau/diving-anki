    fact_check: pass
  fr:
    question: Quel mécanisme décrit l’œdème pulmonaire d’immersion (OPI) ?
    choices:
    - text: Du liquide provenant de la circulation s’accumule dans le tissu pulmonaire et les alvéoles
      correct: true
    - text: Du gaz piégé se dilate à la remontée et endommage les parois alvéolaires
      correct: false
    - text: De l’eau extérieure inhalée dans les voies aériennes atteint les alvéoles
      correct: false
    explanation: L’OPI est une accumulation de liquide dans les poumons en lien avec les contraintes circulatoires
      et respiratoires de l’immersion. Il peut survenir sans inhalation d’eau et ne se confond pas avec
      une noyade, une surpression pulmonaire ou un ADD.
- id: n3-risques-opi-signes-001
  type: mcq
  deck: Prévention des accidents
