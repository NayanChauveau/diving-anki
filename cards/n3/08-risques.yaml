    fact_check: pass
  fr:
    question: Quel tableau doit notamment faire évoquer un OPI, sans attendre la présence de crachats
      rosés ?
    choices:
    - text: Gêne respiratoire brutale disproportionnée à l’effort, avec toux en immersion
      correct: true
    - text: Douleur d’oreille à la descente, avec vertige après équilibrage
      correct: false
    - text: Fourmillements isolés d’une jambe deux heures après la sortie
      correct: false
    explanation: L’OPI peut donner dyspnée et toux, parfois expectoration mousseuse ou sanglante, mais
      celle-ci n’est pas indispensable. Ces signes ne suffisent pas à prouver le diagnostic ; leur gravité
      commande l’assistance et l’évaluation médicale.
