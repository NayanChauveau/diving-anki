    - DAN — Can You Recognize IPE?, 2022, consulté 2026-10-06 ; https://dan.org/safety-prevention/diver-safety/divers-blog/can-you-recognize-ipe/
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: 'Modèle sec : air à 21 % d’O₂, 1 bar en surface, +1 bar par 10 m. À 60 m, quelle pression
      partielle d’oxygène obtient-on, sans correction de vapeur d’eau ?'
    choices:
    - text: 1,47 bar
      correct: true
    - text: 1,26 bar
      correct: false
    - text: 0,21 bar
      correct: false
    explanation: Pression absolue = 7 bar ; PO₂ = 0,21 × 7 = 1,47 bar. 1,26 utilise seulement 6 bar relatifs.
      La pression partielle se calcule avec la pression absolue et la fraction du gaz.
