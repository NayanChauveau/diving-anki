      : DAN Can You Recognize IPE? 22/12/2022, https://dan.org/safety-prevention/diver-safety/divers-blog/can-you-recognize-ipe/
      consulté ; RIFAP mai2026 p.28–32 ; PSE juillet2026 05PR08 p.167 (position consciente) ; MFT GP-N4
      physiologie/accidents ; Dalton et calcul sec0,21×7. ; recto, choix et corrigé relus ; identité conservée'
    fact_check: pass
  fr:
    question: 'Modèle sec : air à 21 % d’O₂. À 60 m, quelle pression partielle d’oxygène obtient-on, sans
      correction de vapeur d’eau ?'
    choices:
    - text: 1,47 bar
      correct: true
    - text: 1,26 bar
      correct: false
    - text: 0,21 bar
      correct: false
    explanation: Pression absolue = 7 bar ; PO₂ = 0,21 × 7 = 1,47 bar. 1,26 utilise seulement 6 bar relatifs.
      La pression partielle se calcule avec la pression absolue et la fraction du gaz.
