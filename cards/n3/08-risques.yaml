    fact_check: pass
  fr:
    question: Quel tableau respiratoire est le plus évocateur d’un œdème pulmonaire d’immersion (OPI),
      même sans crachats rosés ?
    choices:
    - text: Gêne respiratoire brutale disproportionnée à l’effort, avec toux persistante
      correct: true
    - text: Ventilation accélérée à l’effort, redevenant normale au repos sans toux
      correct: false
    - text: Difficulté inspiratoire cessant immédiatement après remplacement d’un deuxième étage défectueux
      correct: false
    explanation: Le tableau classique associe une gêne respiratoire brutale et une toux, parfois des crachats
      mousseux ou sanglants. L’absence de ces crachats n’empêche pas la suspicion. Les autres observations
      évoquent d’abord la réponse à l’effort et une résistance liée au matériel ; elles ne décrivent pas
      ce tableau persistant. Ces signes imposent assistance et évaluation médicale ; ils ne suffisent
      pas à prouver un OPI.
