    fact_check: pass
  fr:
    question: À bord, après une sortie sécurisée, un plongeur conscient garde une gêne respiratoire faisant
      suspecter un OPI. Quelle prise en charge immédiate est adaptée ?
    choices:
    - text: Position de confort respiratoire, oxygène, alerte médicale et surveillance
      correct: true
    - text: Position allongée avec jambes surélevées, oxygène, alerte médicale et surveillance
      correct: false
    - text: Position latérale de sécurité, oxygène, alerte médicale et surveillance
      correct: false
    explanation: On laisse le plongeur conscient s’installer dans la position qui facilite sa respiration,
      souvent assise ou demi-assise. On administre l’oxygène, alerte les secours et surveille conscience
      et ventilation. Surélever les jambes n’est pas la position adaptée à cette gêne ; la position latérale
      de sécurité répond à une perte de connaissance avec respiration normale, pas à ce cas.
