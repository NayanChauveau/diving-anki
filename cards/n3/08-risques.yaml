  fr:
    question: Après l’arrêt de l’effort en immersion, un plongeur reste anormalement gêné pour respirer
      et tousse ; son gaz semble disponible. Quelle conduite adopter face à ces signes persistants ?
    choices:
    - text: Assister le plongeur et terminer l’immersion par un retour contrôlé en surface
      correct: true
    - text: Rester au niveau actuel pour récupérer, puis reprendre dès que la gêne diminue
      correct: false
    - text: Remonter de quelques mètres pour traiter une narcose, puis reprendre l’exploration
      correct: false
    explanation: Une toux ou une gêne respiratoire persistante peut signaler un OPI (œdème pulmonaire
      d’immersion) ou une autre atteinte respiratoire. La disponibilité du gaz ne l’exclut pas. Il faut
      interrompre l’immersion et assister le retour ; en surface, oxygène, alerte et surveillance. Attendre
      une récupération au fond ou attribuer ces signes à une narcose retarde cette prise en charge.
