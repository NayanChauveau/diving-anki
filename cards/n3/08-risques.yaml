  fr:
    question: Après l’arrêt de l’effort, un plongeur reste anormalement gêné pour respirer et tousse ;
      son gaz semble disponible. Quelle conclusion guide l’action ?
    choices:
    - text: Une difficulté respiratoire persistante impose assistance et fin de plongée, sans diagnostic
        certain
      correct: true
    - text: L’arrêt de l’effort écarte l’essoufflement et prouve une surpression pulmonaire
      correct: false
    - text: Le gaz disponible écarte un accident et permet d’attendre la récupération au fond
      correct: false
    explanation: Un OPI ou d’autres causes peuvent provoquer ces signes. L’absence de diagnostic certain
      ne retarde pas l’assistance, la sortie sécurisée et l’alerte/oxygène en surface. On ne force pas
      une attribution à un simple essoufflement.
