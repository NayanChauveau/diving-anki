  fr:
    question: Après une première plongée, quelle différence décrit la prise en compte de l’azote résiduel
      par les MN90 et par un ordinateur personnel qui a suivi toutes les plongées ?
    choices:
    - text: Les MN90 utilisent GPS/majoration ; l’ordinateur poursuit le calcul de ses compartiments
      correct: true
    - text: Les MN90 utilisent GPS/majoration ; l’ordinateur repart de zéro à chaque immersion
      correct: false
    - text: Les deux ajoutent obligatoirement la même majoration tabulaire au temps réel
      correct: false
    explanation: 'GPS est le groupe de plongée successive des MN90. Il sert à obtenir une majoration après
      l’intervalle de surface. Un ordinateur suit sa propre charge calculée, y compris pendant l’intervalle
      : les successives ne sont pas ignorées et la méthode n’est pas la même que la majoration tabulaire.'
