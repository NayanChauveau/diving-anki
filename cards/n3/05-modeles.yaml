    fact_check: pass
  fr:
    question: Dans une illustration mathématique, Pamb = 1,6 bar et M = 2,4 bar. Avec GF = 85 %, quelle
      limite obtient-on par Pamb + GF × (M − Pamb) ?
    choices:
    - text: 2,28 bar
      correct: true
    - text: 2,04 bar
      correct: false
    - text: 0,68 bar
      correct: false
    explanation: 'Un GF (Gradient Factor, facteur de gradient) s’applique à l’écart entre la M-value et
      la pression ambiante. Ici cet écart vaut 0,8 bar ; 85 % représente 0,68 bar, à ajouter à 1,6 bar
      : limite 2,28 bar. 2,04 bar multiplie directement M par 0,85 ; 0,68 bar oublie d’ajouter la pression
      ambiante.'
