  fr:
    question: Que représente une M-value à une pression ambiante donnée dans un modèle de décompression
      à gaz dissous ?
    choices:
    - text: La pression de gaz inerte maximale admise dans un compartiment par le modèle
      correct: true
    - text: La pression de gaz inerte d’équilibre avec le mélange inspiré par le plongeur
      correct: false
    - text: La pression ambiante minimale commune à tous les compartiments du modèle
      correct: false
    explanation: La M-value est une limite de pression de gaz inerte propre au compartiment, qui varie
      avec la pression ambiante. Elle se distingue de la pression d’équilibre liée au gaz inspiré et du
      plafond de remontée exprimé en pression ambiante. La charge calculée est comparée à cette limite.
- id: n3-modeles-droite-limite-001
  type: mcq
  deck: Désaturation
