  fr:
    question: Dans le Suunto Zoop Novo, quel élément le RGBM ajoute-t-il à la modélisation de la désaturation
      par rapport à un modèle classique de gaz dissous ?
    choices:
    - text: La prise en compte calculée du gaz libre, sous forme de bulles
      correct: true
    - text: Le suivi de la toxicité de l’oxygène, à partir de sa pression partielle
      correct: false
    - text: Le seul ajustement du gradient de gaz dissous, sans modélisation de bulles
      correct: false
    explanation: Le RGBM (Reduced Gradient Bubble Model) du Zoop Novo prédit à la fois le gaz dissous
      et le gaz libre. Le suivi de la toxicité de l’oxygène est une autre fonction de l’ordinateur. Ajuster
      seulement des limites de gaz dissous ne décrit pas l’ajout propre à ce modèle de bulles.
