    fact_check: pass
  fr:
    question: 'Deux plongées sont prévues dans la journée : la première atteint 20 m, la seconde 35 m.
      Quelle caractéristique en fait une succession de plongées à profil inversé ?'
    choices:
    - text: La seconde plongée atteint une profondeur maximale supérieure à la première
      correct: true
    - text: La seconde commence avant l’élimination complète de l’azote résiduel
      correct: false
    - text: La seconde impose plus de temps de palier que la première
      correct: false
    explanation: 'L’ordre des profondeurs maximales est inversé : la plongée la plus profonde vient après
      la moins profonde. C’est distinct du seul caractère successif et de la durée des paliers. Le MFT
      classe les profils inversés parmi les comportements à risques à éviter ; leur évaluation ne se réduit
      pas à lire la durée affichée.'
