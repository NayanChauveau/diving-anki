  fr:
    question: Un compartiment fictif contient initialement 3 bar de gaz inerte. Son nouvel équilibre reste
      à 1 bar. Après deux périodes, quelle pression contient-il ?
    choices:
    - text: 1,5 bar
      correct: true
    - text: 0,75 bar
      correct: false
    - text: 2 bar
      correct: false
    explanation: 'L’écart initial vaut 3 − 1 = 2 bar. Après deux périodes, il en reste un quart, soit
      0,5 bar : pression finale 1 + 0,5 = 1,5 bar. 0,75 bar divise toute la pression initiale par quatre
      ; 2 bar ne compte qu’une période.'
