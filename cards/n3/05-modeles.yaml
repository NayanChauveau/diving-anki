  fr:
    question: Un compartiment fictif contient initialement 3 bar de gaz inerte. Son nouvel équilibre reste
      à 1 bar. Après deux périodes, quelle pression contient-il ?
    choices:
    - text: 1,5 bar
      correct: true
    - text: 0,75 bar
      correct: false
    - text: 2 bar
      correct: false
    explanation: Écart initial = 2 bar ; après deux périodes il reste un quart, soit 0,5 bar. Pression
      = 1 + 0,5 = 1,5 bar. Diviser toute la pression initiale par quatre donnerait 0,75 bar et oublierait
      l’équilibre à 1 bar.
