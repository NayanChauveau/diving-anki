    - 'Revue PDF du 2026-10-07 : docs/reviews/n3/COMPLEMENTS_PDF_2026-10-07.md'
    - 'Revue N3 par petits lots du 2026-10-10, lot 11 : docs/reviews/n3/REVUE_ITERATIVE_2026-10-10.md
      ; identité et objectif conservés'
    - 'Revue N3 du 2026-10-10 : Peregrine Doc.16001-SI-RevB p.25 relu ; Suunto Zoop Novo, Suunto RGBM
      (passage officiel indexé) ; MFT N3 p.9,15 ; étude 2013 PMID23771833 et revue 2021 PMID33975403 relues
      : https://pubmed.ncbi.nlm.nih.gov/23771833/ ; https://pubmed.ncbi.nlm.nih.gov/33975403/'
    fact_check: pass
  fr:
    question: Quelle succession de deux plongées dans la même journée constitue un profil inversé, en
      comparant leurs profondeurs maximales ?
    choices:
    - text: 'Première plongée : 20 m ; seconde : 35 m'
      correct: true
    - text: 'Première plongée : 35 m ; seconde : 20 m'
      correct: false
    - text: 'Première plongée : 35 m ; seconde : 35 m'
      correct: false
    explanation: 'Un profil inversé place la plongée la plus profonde après la moins profonde : ici 20
      m puis 35 m. 35 m puis 20 m suit l’ordre opposé ; deux maxima de 35 m ne créent pas d’inversion.
      Le MFT demande d’éviter les profils inversés ; l’ordre des profondeurs est distinct de l’intervalle
      de surface et des durées de palier.'
- id: n3-modeles-acclimatation-001
  type: mcq
  deck: Désaturation
  levels:
  - N3
  tags:
  - chapitre-n3::05
  status: reviewed
  source_id: N3-PDF-18
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.4,9,11,14 ; PDF local, vérifié le 2026-10-07
    - 'Influence of repeated daily diving on decompression stress, 2013 : https://pubmed.ncbi.nlm.nih.gov/23771833/'
    - 'Acclimatization to diving: a systematic review, 2021 : https://pubmed.ncbi.nlm.nih.gov/33975403/
      ; vérifiés le 2026-10-07'
    - 'Revue PDF du 2026-10-07 : docs/reviews/n3/COMPLEMENTS_PDF_2026-10-07.md'
