      ; vérifié 2026-10-06
    fact_check: pass
  fr:
    question: À pression de gaz inspiré constante, que signifie la période d’un compartiment dans un modèle
      exponentiel ?
    choices:
    - text: Le temps nécessaire pour réduire de moitié son écart à l’équilibre
      correct: true
    - text: Le temps nécessaire pour éliminer la moitié de tout son gaz inerte
      correct: false
    - text: Le temps nécessaire pour atteindre complètement l’équilibre
      correct: false
    explanation: La période, ou demi-temps, porte sur l’écart entre la pression du compartiment et sa
      pression d’équilibre. Après chaque période, la moitié de l’écart restant est comblée, en charge
      comme en décharge.
