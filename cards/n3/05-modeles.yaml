  fr:
    question: Que représente une M-value à une pression ambiante donnée dans un modèle de décompression
      à gaz dissous ?
    choices:
    - text: La pression de gaz inerte limite admise par le modèle dans un compartiment
      correct: true
    - text: La pression de gaz inerte mesurée dans le sang du plongeur
      correct: false
    - text: La pression ambiante minimale commune à tous les compartiments
      correct: false
    explanation: La M-value est une limite de pression de gaz inerte propre au compartiment et dépendante
      de la pression ambiante. La charge calculée est comparée à cette limite ; elle ne fournit pas une
      garantie individuelle d’absence d’accident.
