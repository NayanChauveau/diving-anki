  fr:
    question: Dans une illustration mathématique, Pamb = 1,6 bar et M = 2,4 bar. Avec GF = 85 %, quelle
      limite obtient-on par Pamb + GF × (M − Pamb) ?
    choices:
    - text: 2,28 bar
      correct: true
    - text: 2,04 bar
      correct: false
    - text: 0,68 bar
      correct: false
    explanation: Écart M − Pamb = 0,8 bar ; 85 % de l’écart = 0,68 bar. La limite est donc 1,6 + 0,68
      = 2,28 bar. Multiplier directement M par 0,85 ne représente pas cette interpolation.
