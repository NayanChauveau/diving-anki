  fr:
    question: Dans l’implémentation Bühlmann GF du Peregrine, quels rôles ont GF bas et GF haut ?
    choices:
    - text: GF bas intervient dans le premier arrêt ; GF haut fixe la limite à l’arrivée en surface
      correct: true
    - text: GF bas fixe la limite à la surface ; GF haut intervient dans le premier arrêt
      correct: false
    - text: Les deux GF fixent seulement la profondeur du premier arrêt
      correct: false
    explanation: Le GF bas (Gradient Factor bas, facteur de gradient bas) participe à la profondeur du
      premier arrêt ; le GF haut détermine la sursaturation admise à la surface. Les facteurs utilisés
      évoluent entre ces contraintes pendant la remontée. Inverser bas et haut échange leurs rôles ; attribuer
      les deux au premier arrêt omet la limite à la surface.
