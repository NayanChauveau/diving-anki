    fact_check: pass
  fr:
    question: À un instant donné, l’équilibre avec le gaz inspiré vaut 2 bar de gaz inerte. Les compartiments
      A, B, C contiennent respectivement 1,5, 2 et 2,5 bar. Quel classement est correct ?
    choices:
    - text: A sous-saturé ; B saturé ; C sursaturé
      correct: true
    - text: A sursaturé ; B saturé ; C sous-saturé
      correct: false
    - text: A saturé ; B sous-saturé ; C sursaturé
      correct: false
    explanation: Sous ces conditions, A tend à se charger, B est à l’équilibre et C tend à se décharger.
      La sursaturation exprime un état relatif à l’équilibre, pas à elle seule la présence d’un accident.
