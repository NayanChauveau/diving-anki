      Decompression Stress, paragraphes demi-temps et sursaturation, publication originale 2017, republication
      2024-11-30 ; relus le 2026-10-10 : https://shearwater.com/blogs/community/flexible-control-of-decompression-stress'
    fact_check: pass
  fr:
    question: À un instant donné, la pression d’équilibre avec le gaz inspiré vaut 2 bar de gaz inerte.
      Les compartiments A, B et C contiennent respectivement 1,5, 2 et 2,5 bar. Quel est le sens des échanges
      pour chacun ?
    choices:
    - text: A se charge ; B est à l’équilibre ; C se décharge
      correct: true
    - text: A se décharge ; B est à l’équilibre ; C se charge
      correct: false
    - text: A est à l’équilibre ; B se charge ; C se décharge
      correct: false
    explanation: 'Les échanges tendent à réduire l’écart à la pression d’équilibre : A reçoit du gaz,
      B n’a pas d’échange net et C perd du gaz. La pression de gaz inspiré sert ici à déterminer le sens
      de l’échange ; la pression ambiante sert à d’autres comparaisons, notamment les limites de remontée.'
