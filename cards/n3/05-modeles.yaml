  fr:
    question: Comment lire l’expression « Bühlmann ZHL-16C + GF » ?
    choices:
    - text: Bühlmann désigne la famille, ZHL-16C le modèle/jeu de paramètres et GF son ajustement de limites
      correct: true
    - text: Bühlmann désigne la famille, ZHL-16C le réglage GF et GF le nombre de compartiments
      correct: false
    - text: Bühlmann désigne la famille, ZHL-16C les paramètres et GF la correction de vitesse
      correct: false
    explanation: ZHL-16C utilise des compartiments et des coefficients du modèle de Bühlmann. Les gradient
      factors ajustent les limites de sursaturation de ce calcul. Les trois termes ne sont pas synonymes
      et aucun ne mesure une probabilité individuelle d’ADD.
