  fr:
    question: Quel ajout la documentation du Suunto Zoop Novo attribue-t-elle à son RGBM par rapport à
      un modèle classique ne suivant que le gaz dissous ?
    choices:
    - text: Une prise en compte calculée du gaz libre, en plus du gaz dissous
      correct: true
    - text: Une mesure directe des bulles par un capteur de l’ordinateur
      correct: false
    - text: Un effacement de la charge résiduelle entre deux plongées
      correct: false
    explanation: Le Suunto RGBM prédit gaz dissous et gaz libre. L’ordinateur ne mesure pas des bulles
      dans le plongeur ; il calcule un modèle. Cette description vaut pour l’implémentation Suunto documentée,
      sans rendre identiques tous les algorithmes portant le nom RGBM.
