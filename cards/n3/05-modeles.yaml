  fr:
    question: Dans un modèle de désaturation à compartiments, à quoi correspond un compartiment ?
    choices:
    - text: Un tissu fictif défini par une période d’échange et des paramètres du modèle
      correct: true
    - text: Un organe réel défini par son emplacement anatomique dans le corps
      correct: false
    - text: Une tranche de profondeur définie par ses limites de pression ambiante
      correct: false
    explanation: Un compartiment est une représentation mathématique, avec une vitesse d’échange et des
      limites propres. Il n’est ni un organe identifié ni une tranche de profondeur. Plusieurs compartiments
      sont calculés simultanément pour représenter des échanges plus ou moins rapides.
