  fr:
    question: Un compartiment fictif passe vers un équilibre maintenu à 4 bar de gaz inerte, depuis 2
      bar. Quelle pression de gaz inerte a-t-il après une période ?
    choices:
    - text: 3 bar
      correct: true
    - text: 2 bar
      correct: false
    - text: 4 bar
      correct: false
    explanation: Écart initial = 4 − 2 = 2 bar ; après une période, il reste 1 bar d’écart. Pression =
      4 − 1 = 3 bar. Il s’agit de pressions de gaz inerte dans un modèle, pas d’une profondeur ni d’un
      temps de palier réel.
