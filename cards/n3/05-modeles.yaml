  fr:
    question: Dans un modèle de désaturation à compartiments, que représente un compartiment ?
    choices:
    - text: Une entité mathématique d’échange de gaz caractérisée par ses paramètres
      correct: true
    - text: Un organe identifié dont l’ordinateur mesure directement la charge en azote
      correct: false
    - text: Une zone anatomique dont tous les tissus ont la même vitesse d’échange
      correct: false
    explanation: Les compartiments représentent des vitesses d’échange et des limites du modèle. Ils ne
      correspondent pas un pour un à des organes et leur charge est calculée, non mesurée dans le corps
      du plongeur.
