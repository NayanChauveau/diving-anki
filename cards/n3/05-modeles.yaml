  fr:
    question: Deux compartiments commencent à 1 bar et tendent vers 3 bar de gaz inerte. Leurs périodes
      sont 5 min et 20 min. Après 5 min dans ces conditions constantes, lequel a comblé la plus grande
      fraction de son écart initial ?
    choices:
    - text: Celui de période 5 min
      correct: true
    - text: Celui de période 20 min
      correct: false
    - text: Les deux, car leur équilibre est le même
      correct: false
    explanation: Le compartiment de période 5 min a comblé la moitié de son écart. Le compartiment de
      20 min n’a parcouru qu’un quart de sa période et a comblé une fraction plus faible. La vitesse d’échange
      et la pression d’équilibre sont deux paramètres différents.
