      conservés'
    fact_check: pass
  fr:
    question: Dans un exemple abstrait, le compartiment A exige une pression ambiante d’au moins 1,6 bar
      ; B exige au moins 1,9 bar. Lequel fixe le plafond de remontée le plus profond ?
    choices:
    - text: 'B : la pression ambiante doit rester au moins à 1,9 bar'
      correct: true
    - text: 'A : la pression ambiante doit rester au moins à 1,6 bar'
      correct: false
    - text: 'Leur moyenne : la pression ambiante doit rester au moins à 1,75 bar'
      correct: false
    explanation: 'Les deux contraintes doivent être respectées : la pression ambiante reste au moins à
      1,9 bar. Le compartiment limitant est celui qui impose la contrainte la plus restrictive, pas nécessairement
      celui qui a la plus forte pression absolue de gaz inerte.'
- id: n3-modeles-droite-limite-001
  type: mcq
  deck: Désaturation
  levels:
  - N3
  tags:
  - chapitre-n3::05
  status: reviewed
  source_id: N3-05-09
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.15
    - N3-S12 — Erik Baker, Understanding M-values, p.1–3 ; modèle abstrait, aucune décompression opérationnelle
      déduite
    - Shearwater Peregrine, notice française Doc.16001-SI-RevB du 06/07/2020 (fichier officiel nommé 2021),
      p.25 ; https://cdn.shopify.com/s/files/1/0838/3732/1530/files/Peregrine_Manual-metric_French_2021.pdf?v=1710186732
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - Shearwater — Neal Pollock, Flexible Control of Decompression Stress, publié initialement 2017, republication
      30/11/2024, compartiments/demi-temps ; https://shearwater.com/blogs/community/flexible-control-of-decompression-stress
      ; vérifié 2026-10-06
    fact_check: pass
  fr:
    question: Dans un modèle fictif, la droite limite est M = 1 + 0,8 × Pamb, avec les deux pressions
      en bar absolus. À Pamb = 2 bar, un compartiment contient 2,8 bar de gaz inerte. Où se situe-t-il
      par rapport à cette limite ?
    choices:
    - text: 'Au-dessus : M vaut 2,6 bar'
      correct: true
    - text: 'En dessous : M vaut 3,24 bar'
      correct: false
    - text: 'Sur la limite : M vaut 2,8 bar'
      correct: false
    explanation: Avec la pression ambiante de 2 bar, M = 1 + 0,8 × 2 = 2,6 bar. La charge de 2,8 bar est
      donc au-dessus de 0,2 bar. 3,24 bar utilise à tort la charge de 2,8 comme pression ambiante ; annoncer
      M = 2,8 confond la charge actuelle avec la limite du modèle.
- id: n3-modeles-profil-inverse-001
  type: mcq
  deck: Désaturation
  levels:
  - N3
  tags:
  - chapitre-n3::05
  status: reviewed
  source_id: N3-PDF-17
  review:
