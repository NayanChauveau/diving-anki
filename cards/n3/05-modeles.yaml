      ; vérifié 2026-10-06
    fact_check: pass
  fr:
    question: Dans un modèle fictif, la droite limite est M = 1 + 0,8 × Pamb, avec les deux pressions
      en bar absolus. À Pamb = 2 bar, un compartiment contient 2,8 bar de gaz inerte. Où se situe-t-il
      par rapport à cette limite ?
    choices:
    - text: 'Au-dessus : M vaut 2,6 bar'
      correct: true
    - text: 'En dessous : M vaut 3,6 bar'
      correct: false
    - text: 'Sur la limite : M vaut 2,8 bar'
      correct: false
    explanation: M = 1 + 0,8 × 2 = 2,6 bar. La charge 2,8 bar dépasse cette limite de 0,2 bar. L’équation
      et les valeurs sont fictives pour apprendre à lire la relation, sans calculer une remontée réelle.
