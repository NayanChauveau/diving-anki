    - Shearwater — Neal Pollock, Flexible Control of Decompression Stress, publié initialement 2017, republication
      30/11/2024, compartiments/demi-temps ; https://shearwater.com/blogs/community/flexible-control-of-decompression-stress
      ; vérifié 2026-10-06
    fact_check: pass
  fr:
    question: Un compartiment fictif passe vers un équilibre maintenu à 4 bar de gaz inerte, depuis 2
      bar. Quelle pression de gaz inerte a-t-il après une période ?
    choices:
    - text: 3 bar
      correct: true
    - text: 2 bar
      correct: false
    - text: 4 bar
      correct: false
    explanation: 'L’écart initial vaut 4 − 2 = 2 bar. Après une période, la moitié de cet écart est comblée
      : la pression passe à 2 + 1 = 3 bar. 2 bar revient à diviser la pression d’équilibre par deux sans
      tenir compte du départ ; 4 bar suppose à tort que l’équilibre est complètement atteint en une période.'
