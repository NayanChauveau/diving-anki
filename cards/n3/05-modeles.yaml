      (passage officiel indexé) ; MFT N3 p.9,15 ; étude 2013 PMID23771833 et revue 2021 PMID33975403 relues
      : https://pubmed.ncbi.nlm.nih.gov/23771833/ ; https://pubmed.ncbi.nlm.nih.gov/33975403/'
    fact_check: pass
  fr:
    question: Que désigne l’acclimatation à la désaturation étudiée lors d’expositions répétées à la plongée
      ?
    choices:
    - text: Une adaptation physiologique de la réponse à la décompression
      correct: true
    - text: Une adaptation automatique des périodes du modèle aux plongées répétées
      correct: false
    - text: Une habituation psychologique aux effets de la narcose en profondeur
      correct: false
    explanation: L’acclimatation concerne une modification de la réponse physiologique aux expositions
      répétées. Certaines études observent une diminution des bulles après des plongées répétées, avec
      des résultats variables selon les protocoles. Ce n’est ni un changement automatique des périodes
      de l’ordinateur ni une habituation à la narcose. Cette réponse ne constitue pas une méthode pour
      raccourcir la décompression.
