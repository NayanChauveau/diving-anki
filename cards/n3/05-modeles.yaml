      : https://pubmed.ncbi.nlm.nih.gov/23771833/ ; https://pubmed.ncbi.nlm.nih.gov/33975403/'
    fact_check: pass
  fr:
    question: Dans l’expression « Bühlmann ZHL-16C + GF », que désignent ZHL-16C et GF ?
    choices:
    - text: 'ZHL-16C : paramètres du modèle ; GF : ajustement des limites'
      correct: true
    - text: 'ZHL-16C : paramètres du modèle ; GF : ajustement des périodes'
      correct: false
    - text: 'ZHL-16C : réglage des limites ; GF : paramètres du modèle'
      correct: false
    explanation: Bühlmann désigne la famille de modèles. ZHL-16C définit notamment les périodes et coefficients
      des 16 compartiments. Les GF, ou Gradient Factors (facteurs de gradient), ajustent les limites de
      sursaturation admises ; ils ne changent pas les périodes d’échange ni le nombre de compartiments.
