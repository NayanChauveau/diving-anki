  fr:
    question: Dans un exemple abstrait, le compartiment A exige une pression ambiante d’au moins 1,6 bar
      ; B exige au moins 1,9 bar. Lequel fixe le plafond de remontée le plus profond ?
    choices:
    - text: 'B : la pression ambiante doit rester au moins à 1,9 bar'
      correct: true
    - text: 'A : la pression ambiante doit rester au moins à 1,6 bar'
      correct: false
    - text: 'Leur moyenne : la pression ambiante doit rester au moins à 1,75 bar'
      correct: false
    explanation: 'Les deux contraintes doivent être respectées : la pression ambiante reste au moins à
      1,9 bar. Le compartiment limitant est celui qui impose la contrainte la plus restrictive, pas nécessairement
      celui qui a la plus forte pression absolue de gaz inerte.'
