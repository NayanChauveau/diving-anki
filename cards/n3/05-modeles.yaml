  fr:
    question: Que désigne l’acclimatation à la désaturation étudiée lors d’expositions répétées à la plongée
      ?
    choices:
    - text: Une adaptation physiologique possible de la réponse à la décompression
      correct: true
    - text: Une élimination plus rapide de tout l’azote grâce à un changement de demi-périodes de l’ordinateur
      correct: false
    - text: Une habituation aux sensations de narcose, sans modification physiologique
      correct: false
    explanation: 'L’acclimatation concerne la réponse physiologique aux expositions répétées, notamment
      la production de bulles observée après plongée. Les résultats varient selon les protocoles et les
      individus : ce phénomène ne permet ni de supposer une protection acquise contre l’ADD ni de raccourcir
      les procédures de décompression.'
