  status: reviewed
  source_id: N3-02-02
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,12–14 ; cas originaux aux données locales imposées
    - 'Météo-France — dangers météorologiques vent : https://vigi.meteofrance.fr/fr/dangers-meteorologiques-vent
      ; consulté 2026-10-06'
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Un vent d’ouest est prévu. Le site A a sa mise à l’eau ouverte à l’ouest ; le site B est
      protégé à l’ouest par un relief continu. Houle, courant, profondeur et accès sont par ailleurs équivalents
      et favorables. Quel site est le moins exposé à ce vent ?
    choices:
    - text: B
      correct: true
    - text: A
      correct: false
    - text: Les deux, car un vent d’ouest se dirige vers l’ouest
      correct: false
    explanation: Un vent d’ouest vient de l’ouest et souffle vers l’est. Le relief placé à l’ouest de
      B le protège dans les conditions fournies ; A est directement exposé. Le bulletin de houle se vérifie
      séparément.
- id: n3-organisation-vent-houle-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::02
  status: reviewed
  source_id: N3-02-03
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,12–14 ; cas originaux aux données locales imposées
    - Météo-France — Guide marine 2022, mer du vent et houle ; https://meteofrance.fr/sites/meteofrance.fr/files/files/editorial/guide-MARINE-2022.pdf
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Le vent local tombe, mais un bulletin annonce encore une houle d’ouest. Pourquoi la mise
      à l’eau exposée à l’ouest peut-elle rester difficile ?
    choices:
    - text: La houle peut provenir d’une zone de vent éloignée et persister sans vent local
      correct: true
    - text: La direction de houle indique le sens du vent local prévu au même instant
      correct: false
    - text: La houle restante dépend uniquement du coefficient de marée local
      correct: false
    explanation: La mer du vent se forme sous l’action du vent local ; la houle peut avoir été produite
      ailleurs et se propager. Une accalmie de vent ne démontre pas que les vagues à la mise à l’eau ont
      disparu.
