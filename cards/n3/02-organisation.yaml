  fr:
    question: Quatre N3 et un pilote non plongeur disposent d’un bateau. Le plan prévoit deux palanquées
      de deux, mais le pilote a besoin d’une seconde personne à bord pour récupérer les plongeurs. Quelle
      rotation assure cette organisation ?
    choices:
    - text: Alterner les palanquées pour garder des plongeurs disponibles à bord
      correct: true
    - text: Décaler les mises à l’eau de quelques minutes puis faire plonger les quatre N3
      correct: false
    - text: Faire plonger les deux palanquées ensemble et compter sur la première sortie pour aider le
        pilote
      correct: false
    explanation: La disponibilité d’une aide à la récupération est une contrainte donnée. Une rotation
      alternée garde les deux autres N3 en surface. Ce n’est pas un effectif de surveillance national
      fixé pour toutes les sorties.
- id: n3-organisation-equipements-distincts-001
  type: mcq
  deck: Matériel et préparation
  levels:
