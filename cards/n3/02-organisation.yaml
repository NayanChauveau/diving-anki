  fr:
    question: Le vent local tombe, mais le bulletin annonce encore une houle d’ouest. Quelle origine distingue
      cette houle de la mer du vent sur le site ?
    choices:
    - text: Des vagues formées sous un vent éloigné puis propagées jusqu’au site
      correct: true
    - text: Des vagues formées directement par le vent local au même instant
      correct: false
    - text: Des vagues formées directement par un courant de marée sur un relief sous-marin
      correct: false
    explanation: 'La houle se propage depuis sa zone de formation : elle peut persister sans vent local.
      La mer du vent est engendrée par le vent local ; les vagues ou remous liés au courant relèvent d’un
      autre phénomène. Une accalmie du vent ne démontre pas que les vagues à la mise à l’eau ont disparu.'
