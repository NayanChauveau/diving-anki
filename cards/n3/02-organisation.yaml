      du site, récupération et alerte ; résolution indépendante de chaque calcul et compatibilité des
      hypothèses. ; recto, choix et corrigé relus ; identité conservée'
    fact_check: pass
  fr:
    question: 'Pour la récupération, l’organisation doit comparer une prévision de hauteur significative
      des vagues à la limite retenue pour le bateau. À l’heure prévue de retour, le bulletin donne : mer
      totale 1,0 m, houle 0,8 m, mer du vent 0,6 m. Quelle hauteur de ce bulletin faut-il prendre en compte
      ?'
    choices:
    - text: 1,0 m
      correct: true
    - text: 0,8 m
      correct: false
    - text: 0,6 m
      correct: false
    explanation: La mer totale prend en compte les systèmes de vagues présents, houle et mer du vent.
      Ne retenir que la houle ou que la mer du vent omet une composante de l’état de mer attendu à la
      récupération. Les hauteurs significatives ne s’additionnent pas simplement ; on utilise ici la valeur
      de mer totale fournie par le bulletin.
