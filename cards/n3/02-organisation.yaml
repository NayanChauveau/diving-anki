    fact_check: pass
  fr:
    question: 'Exercice simplifié de repli du bord : A est inaccessible. Le trajet B demande 6 min à 20
      m ; C, 8 min à 10 m. Un stock de 350 L ramenés à 1 bar est alloué au seul trajet choisi, les autres
      besoins étant déjà financés. Débit de référence 20 L/min à 1 bar, ventilation identique ; transitions
      négligées, gaz parfait à température constante, 1 bar en surface et +1 bar par 10 m. Quel trajet
      respecte ce stock ?'
    choices:
    - text: C seulement
      correct: true
    - text: B seulement
      correct: false
    - text: B et C
      correct: false
    explanation: B demande 20 × 3 × 6 = 360 L à 1 bar, soit 10 L de plus que le stock. C demande 20 ×
      2 × 8 = 320 L, laissant 30 L. Le trajet le plus court n’est donc pas forcément celui qui consomme
      le moins. Compter les trajets comme s’ils se déroulaient tous à 1 bar rendrait à tort les deux compatibles.
