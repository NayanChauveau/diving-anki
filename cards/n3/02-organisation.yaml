    fact_check: pass
  fr:
    question: Une sortie sans DP est préparée depuis un bateau. Quelle coordination entre pilote et plongeurs
      prépare le mieux la récupération d’une palanquée remontant loin du mouillage ?
    choices:
    - text: Convenir du secteur de sortie, de la signalisation et de la conduite en cas de sortie décalée
      correct: true
    - text: Convenir de l’heure de fin d’immersion et rechercher la palanquée uniquement autour du mouillage
      correct: false
    - text: Convenir de la profondeur maximale et attendre que la palanquée rejoigne le bateau à la nage
      correct: false
    explanation: La préparation inclut l’immersion et le retour en surface. Le pilote et les plongeurs
      conviennent de la récupération, des signaux et du repli ; les seuls paramètres sous-marins ne suffisent
      pas.
- id: n3-organisation-vent-site-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
