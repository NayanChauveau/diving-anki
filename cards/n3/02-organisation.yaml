  fr:
    question: Dans un exercice de retour du bord, le courant rend l’accès A inaccessible. Le repli B demande
      6 min, C 10 min ; même profondeur et mêmes conditions. Le budget disponible après la marge de retour
      permet encore 8 min de déplacement. Quel repli est compatible avec ce budget ?
    choices:
    - text: B seulement
      correct: true
    - text: C seulement
      correct: false
    - text: B et C
      correct: false
    explanation: Six minutes respectent le budget imposé de huit minutes ; dix minutes le dépassent. Le
      repli est choisi avec les contraintes réelles du trajet, de la récupération et du gaz, puis communiqué
      à toute la palanquée.
