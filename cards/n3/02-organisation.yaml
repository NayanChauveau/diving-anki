  fr:
    question: Avant une plongée depuis un bateau, quel ensemble couvre les informations de coordination
      à convenir entre pilote et palanquée pour sa récupération, y compris une sortie éloignée du mouillage
      ?
    choices:
    - text: Secteur de sortie, signalisation en surface et conduite en cas de sortie décalée
      correct: true
    - text: Profondeur maximale, signalisation en surface et conduite en cas de sortie décalée
      correct: false
    - text: Secteur de sortie, pression de demi-tour et conduite en cas de sortie décalée
      correct: false
    explanation: La coordination de récupération associe un secteur attendu, des signaux reconnaissables
      en surface et une conduite convenue si la sortie est décalée. La profondeur maximale et la pression
      de demi-tour sont utiles à la plongée, mais ne remplacent ni le secteur où chercher ni la signalisation
      à observer.
