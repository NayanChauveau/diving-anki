  fr:
    question: Pour une sortie du bord, un proche doit déclencher une alerte si le groupe n’est pas rentré.
      Quelle information rend le dispositif utilisable ?
    choices:
    - text: Le site précis, les participants et l’heure convenue de déclenchement de l’alerte
      correct: true
    - text: La profondeur maximale, les marques des blocs et le niveau moyen du groupe
      correct: false
    - text: La durée maximale au fond, les réglages GF et la pression de départ
      correct: false
    explanation: Le proche doit savoir qui chercher, où et à partir de quand alerter, avec les coordonnées
      de contact et les modalités de retour. Une simple durée de fond ne donne pas l’heure de retour à
      terre.
