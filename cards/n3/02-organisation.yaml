    fact_check: pass
  fr:
    question: Une fenêtre locale de courant permet les opérations de 10 h 20 à 10 h 55. Le plan prévoit
      18 min de plongée avant remontée, une DTR de 7 min puis 5 min pour récupérer toute la palanquée
      à bord. Quel est le dernier horaire de mise à l’eau permettant de tout terminer dans cette fenêtre
      ?
    choices:
    - text: 10 h 25
      correct: true
    - text: 10 h 30
      correct: false
    - text: 10 h 37
      correct: false
    explanation: 'La durée totale de remontée (DTR) inclut le trajet et les arrêts jusqu’à la surface.
      Il faut compter 18 + 7 + 5 = 30 min jusqu’à la fin de récupération : 10 h 55 − 30 min = 10 h 25.
      10 h 30 omet la récupération ; 10 h 37 omet remontée et récupération. La fenêtre est une donnée
      locale de l’exercice, pas une conséquence de la seule heure de pleine mer.'
