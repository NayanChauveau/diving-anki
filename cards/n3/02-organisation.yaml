  fr:
    question: Un contact à terre possède le site et la liste des participants. Le plan fixe la mise à
      l’eau à 10 h 20, 20 min de plongée avant remontée, une DTR de 10 min puis 15 min entre la sortie
      de l’eau et le point de contact à terre. Il doit alerter 5 min après l’heure prévue de contact si
      le groupe manque. Quelle heure lui communiquer pour cette alerte ?
    choices:
    - text: 11 h 10
      correct: true
    - text: 10 h 55
      correct: false
    - text: 11 h 00
      correct: false
    explanation: Le contact est attendu à 10 h 20 + 20 + 10 + 15 = 11 h 05 ; la marge convenue de 5 min
      fixe l’alerte à 11 h 10. 10 h 55 omet le trajet à terre ; 11 h 00 omet la durée totale de remontée
      (DTR). Le contact doit connaître l’heure de retour à terre et le seuil d’alerte, pas seulement la
      durée au fond.
