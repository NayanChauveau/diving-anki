  fr:
    question: 'Un vent d’ouest est prévu. Deux anses sont bordées de reliefs continus sur leurs côtés
      fermés : l’anse A s’ouvre vers l’ouest, l’anse B vers l’est. Houle, courant, profondeur et accès
      sont par ailleurs équivalents et favorables. Quelle mise à l’eau est la moins exposée à ce vent
      ?'
    choices:
    - text: Le site B
      correct: true
    - text: Le site A
      correct: false
    - text: Les deux sites sont également exposés
      correct: false
    explanation: Un vent d’ouest vient de l’ouest et souffle vers l’est. Le relief situé à l’ouest de
      B le protège dans les conditions fournies, tandis que A est directement exposé. La direction nomme
      l’origine du vent, pas sa destination. La houle doit être vérifiée séparément.
