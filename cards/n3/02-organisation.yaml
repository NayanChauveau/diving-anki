  fr:
    question: Le fond d’un site est abrité, mais les vagues devraient se renforcer pendant l’immersion.
      Quel état de mer faut-il confronter à la limite de récupération du bateau pour décider du départ
      ?
    choices:
    - text: L’état de mer prévu à l’heure et au lieu de récupération
      correct: true
    - text: L’état de mer observé à l’heure de la mise à l’eau
      correct: false
    - text: L’état de mer au mouillage au début de la descente
      correct: false
    explanation: L’évaluation porte sur toute la sortie, jusqu’à la récupération. Une exploration abritée
      au fond ne résout pas un retour à bord devenu dangereux. Le profil doit être modifié pour un retour
      réalisable ou la sortie reportée.
