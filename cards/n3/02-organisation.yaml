  fr:
    question: Un bateau de plaisance est conforme pour sa navigation, mais aucun contrôle du matériel
      de secours propre à la plongée n’a été fait. Quelle conclusion est correcte avant la sortie du club
      ?
    choices:
    - text: La conformité nautique ne dispense pas du matériel de sécurité et d’assistance de plongée
      correct: true
    - text: La conformité nautique couvre les secours de plongée jusqu’à 40 m sans DP
      correct: false
    - text: Le matériel de plongée n’est obligatoire que si le bateau est à plus de 6 milles d’un abri
      correct: false
    explanation: Les obligations nautiques du bateau et celles de l’activité de plongée se cumulent. Il
      faut vérifier séparément le matériel adapté à l’activité, dont l’oxygène et les moyens d’alerte,
      ainsi que les équipements individuels.
