  fr:
    question: Une fiche locale donne un courant inférieur à 0,5 nœud de 10 h 20 à 10 h 50. Le plan impose
      que toute l’immersion dure 25 min et se déroule dans cette fenêtre. Parmi ces horaires de départ,
      lequel convient ?
    choices:
    - text: 10 h 25
      correct: true
    - text: 10 h 15
      correct: false
    - text: 10 h 30
      correct: false
    explanation: À 10 h 25, le retour est à 10 h 50, dans la fenêtre fournie. À 10 h 15 le début précède
      la fenêtre ; à 10 h 30, la fin la dépasse. L’heure de pleine mer seule ne permet pas de déduire
      cette fenêtre de courant.
