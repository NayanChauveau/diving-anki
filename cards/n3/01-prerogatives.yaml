    question: Dans un club en France, un titulaire du N3 envisage d’être directeur de plongée pour des
      explorations à l’air en milieu naturel. Parmi ces qualifications supplémentaires, laquelle permet
      cette fonction dans le cadre autorisé ?
    choices:
    - text: Plongeur de niveau 5 (P5)
      correct: true
    - text: Guide de palanquée niveau 4 (GP-N4)
      correct: false
    - text: Plongeur encadré à 60 m (PE60)
      correct: false
    explanation: Le P5 est la qualification de directeur de plongée en exploration. Le N3 seul ne l’attribue
      pas ; le GP-N4 conduit une palanquée et le PE60 est une aptitude à évoluer encadré. Organiser une
      sortie de N3 sans DP ne revient donc pas à détenir la qualification de DP pour d’autres palanquées.
