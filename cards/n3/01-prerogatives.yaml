    question: En formation technique à l’air en établissement, quel niveau minimal d’enseignant encadre
      la palanquée entre 40 et 60 m ?
    choices:
    - text: E4
      correct: true
    - text: E3
      correct: false
    - text: E2
      correct: false
    explanation: Dans l’espace 40–60 m, la formation technique se déroule sous la responsabilité d’un
      E4. Les compétences N3 sont normalement enseignées et validées dans l’espace 0–40 m avec un E3 minimum
      ; cela n’autorise pas cet E3 à enseigner au-delà de 40 m. E2 ne couvre pas non plus cet espace profond.
