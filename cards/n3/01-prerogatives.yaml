  fr:
    question: En formation technique à l’air en établissement, quel niveau minimal d’enseignant encadre
      la palanquée entre 40 et 60 m ?
    choices:
    - text: E4
      correct: true
    - text: E3
      correct: false
    - text: Guide de palanquée N4 sans qualification d’enseignant
      correct: false
    explanation: Dans cet espace, la formation technique se déroule sous la responsabilité d’un E4. Le
      MFT prévoit l’enseignement et la validation ordinaires des compétences N3 dans 0–40 m avec E3 minimum,
      et une accoutumance progressive à la profondeur.
