      auprès de l’exploitant pour une sortie de titulaires majeurs de brevets PA60 sans DP ?
    choices:
    - text: Information sur le site ; accord sur l’organisation de sécurité et de secours
      correct: true
    - text: Information sur le site ; accord sur les seules aptitudes des plongeurs
      correct: false
    - text: Information sur les aptitudes ; accord sur les paramètres prévus
      correct: false
    explanation: L’exploitant décide d’autoriser la sortie sans directeur de plongée (DP), est informé
