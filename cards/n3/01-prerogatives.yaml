  fr:
    question: Quelle distinction décrit la responsabilité civile et la responsabilité pénale après un
      incident de plongée ?
    choices:
    - text: La civile vise la réparation d’un dommage ; la pénale sanctionne une infraction
      correct: true
    - text: La civile concerne les dommages matériels ; la pénale concerne les dommages corporels
      correct: false
    - text: La civile concerne les fautes non intentionnelles ; la pénale concerne les fautes intentionnelles
      correct: false
    explanation: La responsabilité civile vise la réparation d’un dommage ; la responsabilité pénale concerne
      une infraction, qui peut être intentionnelle ou non. La distinction ne dépend pas de la nature matérielle
      ou corporelle du dommage. Un même événement peut engager les deux ; une assurance civile n’efface
      pas une éventuelle responsabilité pénale.
