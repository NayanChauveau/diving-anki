  fr:
    question: Dans un club FFESSM, un N3 de 17 ans souhaite plonger à l’air en autonomie jusqu’à 40 m
      avec deux majeurs. Quelle condition spécifique au mineur complète la décision favorable du DP ?
    choices:
    - text: Autorisation éclairée du responsable légal et information des équipiers
      correct: true
    - text: Autorisation éclairée du responsable légal et présence d’un E3 dans la palanquée
      correct: false
    - text: Information des équipiers et signature de l’autorisation par le mineur
      correct: false
    explanation: Le responsable légal autorise cette pratique en connaissance de cause ; les membres de
      la palanquée sont informés de la présence du mineur. Un E3 dans la palanquée n’est pas la condition
      d’une plongée autonome. Les autres limites collectives et consignes du DP restent applicables.
