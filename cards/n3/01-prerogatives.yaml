    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.3
    - N3-S04 — RIFAP FFESSM, mai 2026, p.7
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: À quel moment le RIFAP est-il obligatoirement acquis pour un candidat au N3 FFESSM ?
    choices:
    - text: Au moment de la délivrance du N3
      correct: true
    - text: Dès l’entrée dans toute formation PA40
      correct: false
    - text: Avant toute première plongée encadrée au-delà de 40 m
      correct: false
    explanation: Le RIFAP signifie Réactions et interventions face aux accidents subaquatiques, spécialité
      plongée. Il est exigé au moment de la certification N3 ; il peut donc être acquis pendant le parcours.
      Il n’est pas une condition générale de délivrance des qualifications isolées PA40 et PE60.
