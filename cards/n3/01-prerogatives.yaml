  fr:
    question: Pour un candidat au N3 FFESSM qui ne possède pas encore le RIFAP, quelle échéance impose
      d’en être titulaire ?
    choices:
    - text: La délivrance du brevet N3
      correct: true
    - text: L’entrée en formation N3
      correct: false
    - text: Le premier atelier de formation PA40
      correct: false
    explanation: Le RIFAP, Réactions et interventions face aux accidents subaquatiques, spécialité plongée,
      doit être acquis au moment de la certification N3. Il peut être préparé pendant le parcours ; le
      début de la formation N3 ou d’un atelier PA40 n’impose pas de l’avoir déjà obtenu.
