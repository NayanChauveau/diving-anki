  fr:
    question: Un plongeur obtient le N3 FFESSM à 17 ans. Que change son dix-huitième anniversaire pour
      ses prérogatives d’autonomie ?
    choices:
    - text: Il ouvre l’exercice de l’autonomie au-delà de 40 m, avec DP
      correct: true
    - text: Il ouvre pour la première fois toute plongée en autonomie
      correct: false
    - text: Il ouvre l’autonomie jusqu’à 60 m sans DP
      correct: false
    explanation: Le brevet peut être délivré dès 17 ans. À cet âge, l’autonomie jusqu’à 40 m est possible
      sur décision du DP, avec les conditions applicables au mineur. Au-delà de 40 m, l’autonomie ne s’exerce
      qu’à partir de 18 ans ; sans DP, la limite demeure 40 m.
