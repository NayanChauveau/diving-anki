  fr:
    question: Trois N3 majeurs organisent leur exploration sans DP, dans les conditions autorisées par
      leur club. Lequel devient automatiquement DP des autres palanquées du club ?
    choices:
    - text: 'Aucun : organiser cette sortie ne confère pas la qualification de DP'
      correct: true
    - text: Le plongeur qui a signé la fiche de sécurité
      correct: false
    - text: Le plongeur qui possède le plus d’expérience à 40 m
      correct: false
    explanation: L’organisation sans DP relève d’un cadre particulier. Choisir un site ou coordonner la
      sortie ne confère pas les qualifications nécessaires pour exercer la direction de plongée d’autres
      pratiquants. Les plongeurs restent coresponsables de leur organisation.
- id: n3-responsabilites-civile-penale-001
  type: mcq
  deck: Réglementation
  levels:
  - N3
  tags:
  - chapitre-n3::01
  status: reviewed
  source_id: N3-01-12
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.12,15
    - 'Code civil art.1240 https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000032041571 ; Code
      pénal art.121-1 https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006417201 ; Ministère
      de l’Économie, 30/07/2025, différence civile/pénale : https://www.economie.gouv.fr/entreprises/gerer-son-entreprise-au-quotidien/dirigeant-dans-quels-cas-votre-responsabilite-civile
      ; vérifié 2026-10-06'
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Quelle distinction décrit la responsabilité civile et la responsabilité pénale après un
      incident de plongée ?
    choices:
    - text: La civile vise la réparation d’un dommage ; la pénale sanctionne une infraction
      correct: true
    - text: La civile concerne les incidents sans blessé ; la pénale tous ceux avec blessé
      correct: false
    - text: La civile concerne l’exploitant ; la pénale uniquement le DP
      correct: false
    explanation: Un même événement peut engager les deux responsabilités, selon les faits et les conditions
      juridiques. Le rôle ou la présence de blessures ne suffit pas à les distinguer. Une assurance de
      responsabilité civile ne supprime pas une éventuelle responsabilité pénale.
