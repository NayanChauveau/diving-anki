  fr:
    question: Un établissement autorise trois titulaires majeurs de brevets justifiant PA60 à plonger
      sans DP jusqu’à 40 m. Quelle démarche préalable reste exigée auprès de l’exploitant ?
    choices:
    - text: L’informer du site et lui faire entériner l’organisation de sécurité et de secours
      correct: true
    - text: Lui transmettre seulement les paramètres réalisés après la sortie
      correct: false
    - text: Lui demander de désigner l’un des trois N3 comme DP de la sortie
      correct: false
    explanation: A322-99 exige une décision de l’exploitant, son information sur le choix du site avant
      la plongée et son accord sur l’organisation destinée à assurer sécurité et déclenchement des secours.
      La fiche de sécurité est également prévue dans la formation N3 à l’organisation sans DP.
