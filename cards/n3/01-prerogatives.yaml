  fr:
    question: Avec DP, à l’air en établissement, un N3 majeur et un PA40 majeur veulent explorer ensemble
      à 50 m en autonomie. Quelle profondeur maximale autorise leur composition, avant toute consigne
      plus restrictive du DP ?
    choices:
    - text: 40 m
      correct: true
    - text: 50 m
      correct: false
    - text: 60 m
      correct: false
    explanation: 'La palanquée respecte l’aptitude la plus restrictive : PA40 limite les deux équipiers
      à 40 m. La présence du N3 ne remplace ni l’aptitude PA60 manquante ni un encadrement qualifié.'
