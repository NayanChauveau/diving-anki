  fr:
    question: En établissement en France, avec DP, à l’air et à 55 m, quelle plage complète d’effectifs
      et quelles aptitudes sont autorisées pour une palanquée d’exploration autonome ?
    choices:
    - text: Deux ou trois majeurs justifiant tous PA60
      correct: true
    - text: Deux ou trois majeurs, dont au moins un PA60 et les autres PA40
      correct: false
    - text: Deux à quatre majeurs justifiant tous PA60
      correct: false
    explanation: L’effectif autonome maximal est trois ; chacun doit avoir les aptitudes nécessaires à
      la profondeur. Un PA60 ne peut pas faire bénéficier un PA40 de sa propre aptitude. Le N3 n’autorise
      pas une plongée solo en établissement.
