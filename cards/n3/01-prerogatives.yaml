  fr:
    question: En établissement en France, à l’air, quelles profondeurs maximales d’autonomie correspondent
      à un N3 majeur, avec puis sans directeur de plongée (DP), toutes les autres conditions remplies
      ?
    choices:
    - text: 60 m avec DP ; 40 m sans DP
      correct: true
    - text: 60 m avec DP ; 60 m sans DP
      correct: false
    - text: 40 m avec DP ; 20 m sans DP
      correct: false
    explanation: Avec DP, le N3 justifie PA60. Sans DP, A322-99 limite l’évolution à 40 m sur décision
      de l’exploitant, informé du site et ayant entériné l’organisation de sécurité et de secours. Trois
      N3 ne peuvent donc pas choisir 50 m sans DP.
