  fr:
    question: Pour la délivrance du N3 FFESSM dans un club affilié, quelle organisation associe l’encadrant
      délivrant le brevet et le responsable du club ?
    choices:
    - text: Un encadrant habilité d’au moins niveau E3, sous la responsabilité du président du club
      correct: true
    - text: Un encadrant habilité d’au moins niveau E2, sous la responsabilité du président du club
      correct: false
    - text: Un encadrant habilité d’au moins niveau E3, sous la seule responsabilité du DP de la dernière
        plongée
      correct: false
    explanation: Le brevet est délivré dans le club par un encadrant habilité au minimum E3, sous la responsabilité
      du président. Dans une structure commerciale agréée, cette responsabilité revient à son responsable.
      L’encadrement d’une plongée et la responsabilité de délivrance ne sont pas le même rôle.
