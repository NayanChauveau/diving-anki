  fr:
    question: En France, la carte FFESSM N3/CMAS 3 étoiles donne-t-elle à elle seule la fonction de guide
      de palanquée en exploration ?
    choices:
    - text: 'Non : le N3 n’acquiert pas par ces étoiles la qualification française de guide'
      correct: true
    - text: 'Oui : elle autorise l’encadrement à 40 m si un DP est présent'
      correct: false
    - text: 'Oui : elle autorise l’encadrement à 60 m après dix plongées à cette profondeur'
      correct: false
    explanation: La correspondance CMAS ne transforme pas le N3 en guide de palanquée en France. La fonction
      de guide requiert la qualification correspondante ; l’autonomie concerne sa propre palanquée, sans
      rôle d’encadrement attribué par le N3.
