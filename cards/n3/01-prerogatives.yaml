  fr:
    question: Pour entrer en formation N3 FFESSM, quel prérequis de certification est admis, en plus des
      conditions d’âge, licence et CACI ?
    choices:
    - text: N2, PA40 ou certification dont les aptitudes sont jugées équivalentes
      correct: true
    - text: PE40 seul, dès lors que 20 plongées en milieu naturel sont attestées
      correct: false
    - text: PE60 seul, dès lors que cinq plongées entre 35 et 40 m sont attestées
      correct: false
    explanation: L’accès N3 repose sur le N2, le PA40 ou des aptitudes jugées équivalentes. Les plongées
      attestées associées au PE40 concernent l’accès PE60. Le CACI est le certificat d’absence de contre-indication
      à la plongée.
