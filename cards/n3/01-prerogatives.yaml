  fr:
    question: Un adulte possède les qualifications PA40 et PE60, sans brevet N3. Avec un DP, que permettent
      ces deux qualifications à l’air ?
    choices:
    - text: Autonomie jusqu’à 40 m ; plongée encadrée jusqu’à 60 m
      correct: true
    - text: Autonomie jusqu’à 60 m ; plongée encadrée jusqu’à 60 m
      correct: false
    - text: Autonomie jusqu’à 40 m ; encadrement d’autres plongeurs jusqu’à 60 m
      correct: false
    explanation: PA40 atteste l’autonomie jusqu’à 40 m ; PE60 permet l’évolution encadrée jusqu’à 60 m,
      avec E4 dans la zone 40–60 m. Leur détention ne constitue pas à elle seule le brevet N3, qui exige
      les compétences complémentaires et le RIFAP.
