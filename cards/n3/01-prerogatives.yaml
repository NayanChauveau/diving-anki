    fact_check: pass
  fr:
    question: À elle seule, quelle combinaison de fonctions la certification N3 FFESSM avec carte CMAS
      trois étoiles attribue-t-elle en France, en exploration avec DP ?
    choices:
    - text: Autonomie jusqu’à 60 m ; aucune fonction de guide attribuée
      correct: true
    - text: Autonomie jusqu’à 60 m ; fonction de guide jusqu’à 40 m
      correct: false
    - text: Autonomie jusqu’à 60 m ; fonction de guide jusqu’à 60 m
      correct: false
    explanation: Le guide de palanquée doit détenir la qualification de guide correspondante, par exemple
      GP-N4, ou une qualification reconnue équivalente. La carte CMAS trois étoiles délivrée avec le N3
      français atteste ce brevet, sans lui attribuer la fonction de guide en France. PA40 et PE60 décrivent
      des aptitudes d’évolution, pas une qualification d’encadrement.
