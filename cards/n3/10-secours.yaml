  fr:
    question: Un plongeur adulte se brûle l’avant-bras contre une pièce chaude du moteur. La brûlure vient
      de se produire ; il reste conscient, sans autre détresse. Quelle action immédiate limite l’aggravation
      locale ?
    choices:
    - text: Arroser à l’eau courante tempérée et à faible pression
      correct: true
    - text: Appliquer de la glace directement sur la peau brûlée
      correct: false
    explanation: L’arrosage débute immédiatement, pendant au moins 10 minutes, idéalement 20. Retirer
      vêtements et bijoux proches s’ils n’adhèrent pas à la peau ; apprécier la gravité et demander les
      secours selon la brûlure. Refroidir la zone brûlée tout en protégeant le reste du corps du froid.
