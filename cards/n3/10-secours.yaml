  fr:
    question: Un sauveteur formé ventile une victime au BAVU, voies aériennes libérées. Quel signe permet
      d’évaluer l’efficacité de chaque insufflation ?
    choices:
    - text: Le début de soulèvement du thorax de la victime
      correct: true
    - text: Le remplissage du ballon-réserve d’oxygène
      correct: false
    - text: La compression de tout le volume du ballon à la main
      correct: false
    explanation: Le BAVU est un ballon autoremplisseur à valve unidirectionnelle. Une insufflation progressive
      dure environ une seconde et cesse dès le début du soulèvement du thorax. L’efficacité dépend des
      voies aériennes et de l’étanchéité du masque. Le remplissage du réservoir indique une disponibilité
      d’oxygène, pas son arrivée dans les poumons ; vider tout le ballon n’est pas le critère de ventilation.
