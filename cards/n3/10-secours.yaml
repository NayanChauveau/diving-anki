      et gestes ; passages PSC15/47 et PSE272/273 relus localement. ; recto, choix et corrigé relus ;
      identité conservée'
    fact_check: pass
  fr:
    question: Après récupération, une victime ne répond pas. Voies aériennes libérées, elle produit seulement
      des inspirations lentes, bruyantes et inefficaces. Quelle conduite adopter ?
    choices:
    - text: Commencer la réanimation cardio-pulmonaire, faire alerter et utiliser le défibrillateur dès
        qu’il est disponible
      correct: true
    - text: La placer sur le côté, administrer l’oxygène et surveiller la respiration en attendant les
        secours
      correct: false
    - text: Assurer seulement une ventilation au ballon avec oxygène, sans compressions thoraciques en
        attendant les secours
      correct: false
    explanation: Ces gasps, ou respiration agonique, ne sont pas une respiration normale. Avec l’absence
      de réponse, ils font considérer un arrêt cardiaque. La réanimation cardio-pulmonaire associe compressions
      et ventilations ; le défibrillateur est mis en œuvre dès que possible. La position sur le côté ou
      la seule ventilation ne remplace pas cette réanimation.
