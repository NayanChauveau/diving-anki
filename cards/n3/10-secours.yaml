    - 'RIFAP mai 2026 p.22,24–29 ; PSC juillet 2026 p.26–27,36–37,47 ; PSE juillet 2026 p.113–115,117,138,148,248,272–274
      ; passages relus localement le 2026-10-10. Publication DGSCGC du 2026-07-18 contrôlée : https://www.securite-civile.interieur.gouv.fr/documentation/secourisme-et-associations/secourisme-references-techniques-nationales.html
      ; revue N3 lot 16'
    - 'Reprise N4 du 2026-10-12, lot 93 (reprises) : docs/reviews/n4/REPRISES_DETAILLEES.md ; 2026-10-12
      : MFT N3/GP-N4 assistance ; RIFAP mai2026 p.10–14,22–32 relu ; SCUBAPRO BCS Manual §8–9 purges et
      flottabilité, principe du gilet différent du gilet de sauvetage ; gaz parfait, stocks refaits. ;
      recto, choix et corrigé relus ; identité conservée'
    fact_check: pass
  fr:
    question: Un accident est pris en charge sur le bateau alors que d’autres palanquées sont encore immergées.
      Trois équipiers compétents sont disponibles. Quelle répartition initiale couvre les priorités de
      secours et le retour des autres plongeurs ?
    choices:
    - text: Bilan et gestes sur la victime ; alerte ; suivi et récupération des autres palanquées
      correct: true
    - text: Bilan et gestes sur la victime ; alerte ; recueil détaillé de son profil de plongée
      correct: false
    - text: Bilan et gestes sur la victime ; recueil détaillé de son profil ; récupération des autres
        palanquées
      correct: false
    explanation: Il faut prendre en charge la victime, faire déclencher les secours et maintenir le suivi
      des palanquées encore sous l’eau. Le profil détaillé est transmis aux secours mais ne remplace pas
      l’alerte ni la récupération. Les tâches sont réparties selon les compétences et les moyens disponibles
      ; les informations circulent entre les intervenants.
- id: n3-secours-bilan-diagnostic-001
  type: mcq
  deck: Prévention des accidents
