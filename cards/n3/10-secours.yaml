      ; identité et objectif conservés'
    - 'Vérification 2026-10-11 : RIFAP FFESSM mai 2026, p. 7, 28–32 ; PSE DGSCGC juillet 2026, p. 110–113
      ; Service-Public https://www.service-public.gouv.fr/particuliers/vosdroits/F33954 (15/18/196). Calculs
      résolus séparément dans la revue du lot 17.'
    - 'Reprise N4 du 2026-10-12, lot 95 (reprises) : docs/reviews/n4/REPRISES_DETAILLEES.md ; 2026-10-12
      : PSE juillet2026 p.110–113,143–148 (fiches internes juin2018), passages110/143 relus ; RIFAP mai2026
      oxygène15L/min ; calculs gaz parfait/stock et comburant contrôlés. ; recto, choix et corrigé relus
      ; identité conservée'
    fact_check: pass
  fr:
    question: Une réserve utilisable d’O₂ représente 900 L à 1 bar. Une victime doit recevoir 15 L/min
      ; le scénario estime 75 min avant relais, avec 10 min de marge supplémentaires. Quel déficit nominal
      faut-il anticiper ?
    choices:
    - text: 375 L
      correct: true
    - text: 225 L
      correct: false
    - text: 150 L
      correct: false
    explanation: Durée budgétée = 75 + 10 = 85 min ; besoin = 85 × 15 = 1 275 L, soit un déficit de 375
      L. Les 225 L omettent les dix minutes de marge ; 150 L représente seulement cette marge, sans le
      déficit des 75 premières minutes. Prévoir un complément ou un relais et communiquer l’autonomie
      aux secours, sans diminuer le débit prescrit pour prolonger le stock.
- id: n3-secours-oxygene-deux-victimes-001
