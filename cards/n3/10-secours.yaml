  fr:
    question: Après un contact avec des filaments de méduse, une victime présente une douleur locale sans
      signe de détresse. Avant leur retrait avec une main protégée, quel liquide utilise-t-on pour le
      premier rinçage de la zone ?
    choices:
    - text: De l’eau de mer
      correct: true
    - text: De l’eau douce froide
      correct: false
    - text: De l’alcool à désinfecter
      correct: false
    explanation: 'Le premier rinçage se fait à l’eau de mer : l’eau douce peut déclencher les cellules
      urticantes encore présentes. Retirer les filaments en protégeant la main, sans frotter la peau.
      Surveiller la victime et demander un avis médical selon les signes et leur évolution.'