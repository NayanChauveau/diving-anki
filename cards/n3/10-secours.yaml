  fr:
    question: Avant de poser un masque à haute concentration sur une victime d’accident de plongée qui
      respire efficacement, comment prépare-t-on son ballon-réserve après raccordement et ouverture de
      l’oxygène ?
    choices:
    - text: Remplir le ballon d’oxygène avant la pose, en obturant la valve du masque avec les doigts
      correct: true
    - text: Poser le masque avec le ballon vide, puis laisser la première expiration le remplir
      correct: false
    explanation: Le ballon-réserve accumule l’oxygène pour l’inspiration. Le remplir avant la pose du
      masque ; la valve antiretour empêche l’air expiré d’y revenir. L’expiration de la victime ne remplit
      donc pas ce réservoir. Pour une victime d’accident de plongée, le débit initial est de 15 L/min.
