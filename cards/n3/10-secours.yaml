    - DGSCGC — Références techniques nationales PSE, juillet 2026, p.110–111 ; calcul indépendant
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Reprise N4 du 2026-10-12, lot 95 (reprises) : docs/reviews/n4/REPRISES_DETAILLEES.md ; 2026-10-12
      : PSE juillet2026 p.110–113,143–148 (fiches internes juin2018), passages110/143 relus ; RIFAP mai2026
      oxygène15L/min ; calculs gaz parfait/stock et comburant contrôlés. ; recto, choix et corrigé relus
      ; identité conservée'
    fact_check: pass
  fr:
    question: 'Exercice nominal : bouteille d’O₂ de 5 L à 200 bar, résiduel imposé de 20 bar, débit constant
      de 15 L/min. Gaz idéal à température constante, volume ramené à 1 bar. Quelle autonomie théorique
      utilisable reste-t-il ?'
    choices:
    - text: 60 min
      correct: true
    - text: 66,7 min
      correct: false
    - text: 12 min
      correct: false
    explanation: 'Stock utilisable : 5 × (200 − 20) = 900 L à 1 bar. À 15 L/min, l’autonomie vaut 900
      / 15 = 60 min. 66,7 min utilise tout le stock jusqu’à zéro ; 12 min oublie de multiplier la baisse
      de pression utilisable par les 5 L du contenant.'
- id: n3-secours-oxygene-delai-001
  type: mcq
  deck: Prévention des accidents
  levels:
