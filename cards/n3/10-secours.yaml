      et gestes ; passages PSC15/47 et PSE272/273 relus localement. ; recto, choix et corrigé relus ;
      identité conservée'
    fact_check: pass
  fr:
    question: Un plongeur conscient chute sur le pont et présente une douleur importante de nuque. Il
      respire normalement et le site est sûr. Quelle conduite initiale limite l’aggravation ?
    choices:
    - text: Lui demander de ne pas bouger, alerter et surveiller en suivant les consignes
      correct: true
    - text: Lui mettre un collier rigide puis le déplacer en comptant sur le collier pour protéger le
        rachis
      correct: false
    - text: Le relever en lui maintenant la tête pour l’installer systématiquement assis
      correct: false
    explanation: 'Une atteinte du rachis est possible : on limite les mouvements, protège la victime,
      alerte et surveille. Un collier ne rend pas un déplacement improvisé sûr et n’est pas posé systématiquement.
      La position assise n’est pas imposée à une victime qui respire normalement. Une détresse vitale
      ou un danger immédiat modifierait les priorités.'
- id: n3-secours-inhalation-insufflation-001
  type: mcq
  deck: Prévention des accidents
  levels:
