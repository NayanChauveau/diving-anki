    - DGSCGC — Références techniques nationales PSE, juillet 2026, 05FT01 p.113–115 ; 05FT11 p.143 ; 05FT13
      p.148
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Reprise N4 du 2026-10-12, lot 95 (reprises) : docs/reviews/n4/REPRISES_DETAILLEES.md ; 2026-10-12
      : PSE juillet2026 p.110–113,143–148 (fiches internes juin2018), passages110/143 relus ; RIFAP mai2026
      oxygène15L/min ; calculs gaz parfait/stock et comburant contrôlés. ; recto, choix et corrigé relus
      ; identité conservée'
    fact_check: pass
  fr:
    question: Une victime d’accident de plongée est consciente et respire spontanément de façon efficace.
      Un sauveteur formé dispose du matériel d’oxygène. Quel dispositif convient pour l’apport d’oxygène
      initial ?
    choices:
    - text: Masque à haute concentration pour inhalation
      correct: true
    - text: Insufflateur manuel actionné à chaque inspiration normale
      correct: false
    - text: Insufflateur manuel avec réservoir utilisé sans compression comme masque d’inhalation
      correct: false
    explanation: Le masque à haute concentration est destiné à enrichir l’air respiré spontanément. Le
      BAVU (ballon auto-remplisseur à valve unidirectionnelle) sert à la ventilation artificielle. Le
      comprimer à chaque inspiration normale n’est pas nécessaire ici ; l’utiliser passivement avec son
      réservoir comme moyen d’inhalation augmente la résistance inspiratoire et n’est pas adapté.
- id: n3-secours-oxygene-autonomie-001
  type: mcq
  deck: Prévention des accidents
  levels:
