      identité conservée'
    fact_check: pass
  fr:
    question: Après une noyade, une victime hors de l’eau ne répond pas et ne respire pas normalement.
      Quelle place ont les compressions abdominales destinées à évacuer l’eau dans la prise en charge
      ?
    choices:
    - text: 'Ne pas les pratiquer : commencer la réanimation sans chercher à vider les poumons'
      correct: true
    - text: Les pratiquer avant la réanimation pour permettre ensuite les insufflations
      correct: false
    explanation: Chercher à la faire sortir par des compressions abdominales retarde la réanimation et
      favorise régurgitation et inhalation de liquide gastrique. On met en œuvre la réanimation adaptée
      à la victime ; les manœuvres de désobstruction ne servent pas à vider les poumons après une noyade.
- id: n3-secours-hemorragie-001
  type: mcq
  deck: Prévention des accidents
