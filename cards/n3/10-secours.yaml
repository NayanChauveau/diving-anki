  fr:
    question: Avant de poser un masque à haute concentration sur une victime d’accident de plongée qui
      respire efficacement, comment prépare-t-on son ballon-réserve après raccordement et ouverture de
      l’oxygène ?
    choices:
    - text: Le remplir d’oxygène en obturant la valve du masque avec les doigts
      correct: true
    - text: 'Le laisser vide : il se remplit grâce à la première expiration de la victime'
      correct: false
    - text: 'Le comprimer pour le vider : il doit recevoir surtout l’air expiré'
      correct: false
    explanation: Le ballon-réserve accumule l’oxygène avant l’inspiration. On le remplit avant la pose
      du masque ; la valve antiretour empêche l’air expiré d’y revenir. Dans ce contexte de plongée, le
      débit initial est de 15 L/min.
