  fr:
    question: Une plaie de la jambe saigne abondamment malgré une compression directe correctement maintenue.
      Un sauveteur formé dispose d’un garrot ; l’alerte est en cours. Quelle utilisation du garrot est
      indiquée ?
    choices:
    - text: En amont de la plaie, hors articulation, serré jusqu’à l’arrêt du saignement et laissé en
        place
      correct: true
    - text: En aval de la plaie, vers le pied, serré jusqu’à l’arrêt du saignement et laissé en place
      correct: false
    - text: En amont de la plaie, hors articulation, serré puis desserré périodiquement jusqu’au relais
      correct: false
    explanation: 'Une hémorragie d’un membre avec compression inefficace ou impossible indique le garrot.
      Il se place entre la plaie et la racine du membre, jamais sur une articulation ; son serrage arrête
      le saignement. Placé vers le pied, il n’interrompt pas l’arrivée du sang à la plaie. Ne pas le desserrer
      : noter l’heure de pose et la transmettre aux secours.'
