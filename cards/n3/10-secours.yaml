    - 'Revue pédagogique du 2026-10-09 : docs/reviews/QUALITE_GLOBALE_2026-10-09.md ; objectif et identité
      conservés'
    fact_check: pass
  fr:
    question: Une victime ne répond pas, mais respire normalement après libération des voies aériennes.
      L’événement est identifié comme non traumatique. Quelle branche de secours s’applique ?
    choices:
    - text: Position latérale de sécurité, alerte et surveillance continue de la respiration
      correct: true
    - text: Réanimation cardio-respiratoire, alerte et défibrillateur dès que disponible
      correct: false
    - text: Maintien sur le dos sans geste sur les voies aériennes, alerte et surveillance
      correct: false
    explanation: La position latérale de sécurité facilite la liberté des voies aériennes et l’écoulement
      des liquides. On alerte et surveille en continu. Si la respiration devient absente ou anormale,
      la conduite d’arrêt cardiaque s’applique. Le contexte traumatique se traite selon une autre branche.
- id: n3-secours-noyade-ventilation-initiale-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N3
  tags:
  - chapitre-n3::10
  status: reviewed
  source_id: N3-PDF-01
  review:
    sources:
    - N3-S04 — RIFAP FFESSM, mai 2026, p.25–28
    - N3-S13 — Références techniques nationales PSE, juillet 2026, p.113–115,143–145,273–274,305–308 ;
      vérifiées le 2026-10-07
    - 'Revue PDF du 2026-10-07 : docs/reviews/n3/COMPLEMENTS_PDF_2026-10-07.md'
    fact_check: pass
  fr:
    question: Une victime de noyade vient d’être sortie de l’eau. Elle ne répond pas et ne respire pas
      normalement. Un sauveteur formé peut pratiquer les insufflations et un équipier alerte. Quelle particularité
      intervient au début de la réanimation ?
    choices:
    - text: Des insufflations initiales précèdent les compressions thoraciques
      correct: true
    - text: Les compressions précèdent les premières insufflations, comme dans toute situation
      correct: false
    - text: L’oxygène par masque d’inhalation précède la ventilation artificielle
      correct: false
    explanation: 'La noyade provoque un manque d’oxygène : la ventilation initiale est prioritaire avant
      les compressions. Elle s’intègre à la réanimation, avec alerte et oxygène dès que possible. Un masque
      d’inhalation seul ne ventile pas une victime qui ne respire pas.'
