  fr:
    question: Pendant la réanimation d’un adulte en arrêt cardiaque, les sauveteurs formés réalisent compressions
      et insufflations. Hors analyse du défibrillateur et après les éventuelles insufflations initiales,
      quelle alternance utilisent-ils ?
    choices:
    - text: 30 compressions puis 2 insufflations
      correct: true
    - text: 15 compressions puis 2 insufflations
      correct: false
    - text: 30 compressions puis 5 insufflations
      correct: false
    explanation: Chez l’adulte, les cycles associent 30 compressions à 2 insufflations. L’alternance 15/2
      concerne l’enfant et le nourrisson dans les référentiels cités ; elle ne remplace pas 30/2 chez
      l’adulte.
