    fact_check: pass
  fr:
    question: 'Exercice nominal : deux victimes reçoivent chacune 15 L/min d’O₂ pendant 40 min. La bouteille
      commence à 200 bar et doit conserver 20 bar finaux. À température constante et avec le modèle du
      gaz idéal, quelle capacité minimale choisir, arrondie au litre supérieur ?'
    choices:
    - text: 7 L
      correct: true
    - text: 6 L
      correct: false
    - text: 4 L
      correct: false
    explanation: 'Besoin = 2 × 15 × 40 = 1 200 L. La pression utilisable vaut 200 − 20 = 180 bar : capacité
      minimale = 1 200 / 180 = 6,67 L, arrondie à 7 L. Les 6 L utilisent les 200 bar sans garder la réserve
      ; 4 L correspond à un calcul pour une seule victime, arrondi au litre supérieur.'
