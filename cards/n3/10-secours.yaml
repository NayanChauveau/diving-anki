  fr:
    question: À quelle fréquence réalise-t-on les compressions thoraciques pendant la réanimation d’un
      adulte ?
    choices:
    - text: 100 à 120 compressions par minute
      correct: true
    - text: 80 à 100 compressions par minute
      correct: false
    - text: 120 à 140 compressions par minute
      correct: false
    explanation: Les compressions sont réalisées entre 100 et 120 par minute, avec relâchement permettant
      au thorax de reprendre sa forme. Il faut limiter les interruptions et maintenir la qualité des gestes.
