  fr:
    question: Un sauveteur formé ventile une victime au BAVU, voies aériennes libérées. Quel signe montre
      qu’une insufflation apporte effectivement du gaz aux poumons ?
    choices:
    - text: Le début de soulèvement du thorax, sans fuite au masque
      correct: true
    - text: L’écrasement complet du ballon, même si le thorax ne bouge pas
      correct: false
    - text: Le bruit du flux d’oxygène, même si l’air fuit autour du masque
      correct: false
    explanation: Une insufflation progressive dure environ une seconde et cesse dès le début du soulèvement
      du thorax. L’efficacité dépend des voies aériennes et de l’étanchéité du masque, pas du seul mouvement
      du ballon ni du débit d’oxygène.
