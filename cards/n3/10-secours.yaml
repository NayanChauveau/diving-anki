      et gestes ; passages PSC15/47 et PSE272/273 relus localement. ; recto, choix et corrigé relus ;
      identité conservée'
    fact_check: pass
  fr:
    question: À la sortie de l’eau, hors suspicion de traumatisme, quelles observations orientent d’abord
      les gestes immédiats, notamment le choix entre mise sur le côté et réanimation ?
    choices:
    - text: La réaction de la victime et la présence d’une respiration normale
      correct: true
    - text: La réaction de la victime et la présence d’un pouls au poignet
      correct: false
    - text: La réaction de la victime et la saturation mesurée par un oxymètre
      correct: false
    explanation: Il faut évaluer la réaction puis la respiration normale, après libération des voies aériennes
      si nécessaire. Une victime qui ne répond pas et ne respire pas normalement relève de la réanimation
      ; si elle respire normalement, sa protection diffère. Ni la recherche d’un pouls au poignet ni la
      mesure de saturation ne remplace ce contrôle ou ne doit retarder les gestes.
