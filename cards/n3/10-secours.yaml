  fr:
    question: Sur un adulte en arrêt cardiaque, quelle profondeur de compression thoracique recherche-t-on
      ?
    choices:
    - text: Environ 5 cm, sans dépasser 6 cm
      correct: true
    - text: Environ 3 cm, sans dépasser 4 cm
      correct: false
    - text: Environ 7 cm, sans dépasser 8 cm
      correct: false
    explanation: Le sternum est comprimé verticalement d’environ 5 cm, sans dépasser 6 cm. Le thorax doit
      reprendre sa forme entre les compressions ; les mains restent au contact sans maintenir une pression
      qui empêche ce relâchement.
