  fr:
    question: Sur le pont, un éclat de verre est resté profondément fiché dans l’avant-bras d’un plongeur.
      Il n’y a pas d’hémorragie abondante. Quelle conduite concernant cet objet accompagne l’alerte et
      la protection de la victime ?
    choices:
    - text: Le laisser en place en attendant la prise en charge des secours
      correct: true
    - text: Le retirer avant de protéger la plaie, pour réduire le risque d’infection
      correct: false
    - text: Le mobiliser légèrement pour vérifier s’il bloque un mouvement du bras
      correct: false
    explanation: 'Un corps étranger pénétrant ne doit pas être retiré : son extraction peut aggraver la
      plaie et provoquer un saignement. La présence de cet objet fait traiter la plaie comme grave, même
      sans hémorragie abondante.'
