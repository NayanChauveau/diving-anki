  fr:
    question: Une plaie de la jambe saigne abondamment. Malgré une compression directe correctement maintenue,
      l’hémorragie continue. Un sauveteur formé dispose d’un garrot ; l’alerte est en cours. Quelle adaptation
      locale est indiquée ?
    choices:
    - text: Poser le garrot en amont de la plaie, hors articulation, jusqu’à l’arrêt du saignement
      correct: true
    - text: Placer le garrot en aval de la plaie, vers le pied, jusqu’à l’arrêt du saignement
      correct: false
    - text: Passer à un pansement peu serré pour éviter de bloquer la circulation
      correct: false
    explanation: Une hémorragie d’un membre avec compression inefficace ou impossible indique le garrot.
      Il se place entre la plaie et la racine du membre, jamais sur une articulation ; son serrage doit
      arrêter le saignement. Noter l’heure de pose et la transmettre aux secours.
