      collective et communication ; calcul du gaz sur trajet linéaire refait par pression moyenne et différence
      des durées. ; recto, choix et corrigé relus ; identité conservée'
    fact_check: pass
  fr:
    question: 'Dans un exercice, une remontée à vitesse constante de 40 à 20 m devait durer 2 min ; elle
      dure finalement 4 min, à vitesse constante sur ce même trajet. Débit individuel de référence : 20
      L/min à 1 bar. Quel volume supplémentaire ramené à 1 bar ce ralentissement consomme-t-il ? Température
      constante ; aucune autre phase n’est comptée.'
    choices:
    - text: 160 L
      correct: true
    - text: 80 L
      correct: false
    - text: 200 L
      correct: false
    explanation: 'La pression moyenne du trajet linéaire vaut (5 + 3) / 2 = 4 bar. Le volume passe de
      20 × 4 × 2 = 160 L à 20 × 4 × 4 = 320 L : le supplément est de 160 L. 80 L utilise une pression
      moyenne erronée de 2 bar ; 200 L applique la pression maximale de 5 bar à tout le trajet.'
