  status: reviewed
  source_id: N3-03-11
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,11–13 ; scénarios originaux à contraintes explicites
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Revue pédagogique du 2026-10-09 : docs/reviews/QUALITE_GLOBALE_2026-10-09.md ; objectif et identité
      conservés'
    fact_check: pass
  fr:
    question: Pendant la remontée, l’ordinateur d’un équipier ajoute un arrêt obligatoire plus profond.
      Quelle information doit-il faire comprendre aux autres pour adapter ensemble le retour ?
    choices:
    - text: La profondeur et la durée de l’arrêt, puis leur évolution
      correct: true
    - text: La durée écoulée et la profondeur maximale atteinte
      correct: false
    - text: Le réglage GF et le modèle de l’ordinateur utilisé
      correct: false
    explanation: Un réglage ou un temps total ne dit pas où attendre ni combien de temps. La palanquée
      confronte les obligations concrètes de chacun, maintient sa cohésion et vérifie le gaz disponible
      pour le retour modifié.
- id: n3-planification-sortie-modifiee-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::03
  status: reviewed
  source_id: N3-03-12
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,11–13 ; scénarios originaux à contraintes explicites
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8,13,15 ; calculs originaux, modèle de gaz idéal et phases
      imposées ; corrigés indépendants dans docs/reviews/n3/CALCULS_N3.csv
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: 'Un changement de sortie ajoute 2 min à 20 m et un arrêt fourni de 4 min à 3 m. Débit de
      référence 20 L/min à 1 bar. Quel gaz supplémentaire à 1 bar doit être budgété, hors autres transitions
      ? Modèle : gaz parfait à température constante, 1 bar en surface et +1 bar par 10 m ; seul le gaz
      respiré est compté.'
    choices:
    - text: 224 L
      correct: true
    - text: 120 L
      correct: false
    - text: 360 L
      correct: false
    explanation: 20 × (2 × 3 + 4 × 1,3) = 224 L. Les deux contraintes s’ajoutent. On compare ce coût au
      stock réellement disponible en conservant les autres besoins de retour et la marge finale.
