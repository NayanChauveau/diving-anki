    fact_check: pass
  fr:
    question: Un N3 revient après plusieurs années sans plonger et propose 55 m avec DP. Quelle observation
      renseigne le mieux sur son aisance actuelle pour adapter progressivement sa reprise ?
    choices:
    - text: Sa maîtrise observée lors d’une plongée de reprise à faible profondeur
      correct: true
    - text: Sa maîtrise attestée lors des épreuves de son brevet avant l’interruption
      correct: false
    - text: Sa maîtrise rapportée lors de sa plongée la plus profonde avant l’interruption
      correct: false
    explanation: 'Une plongée de reprise permet d’observer les compétences actuelles : stabilisation,
      ventilation, communication et utilisation du matériel. La certification et l’expérience profonde
      antérieures attestent des acquis passés ; elles ne décrivent pas à elles seules l’aisance après
      plusieurs années d’arrêt. La progression tient compte de l’équipier et des conditions du jour.'
