    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Reprise N4 du 2026-10-12, lot 83 (reprises) : docs/reviews/n4/REPRISES_DETAILLEES.md ; 2026-10-12
      : MFT GP-N4 mai2026 conduite/désaturation ; MFT N3 décembre2025 p.8–13 planification progressive,
      collective et communication ; calcul du gaz sur trajet linéaire refait par pression moyenne et différence
      des durées. ; recto, choix et corrigé relus ; identité conservée'
    fact_check: pass
  fr:
    question: Au briefing, A propose une limite de DTR de 12 min, B de 8 min. Les deux budgets de gaz
      ont été vérifiés pour leurs profils respectifs et le retour collectif. Quelle limite commune de
      DTR respecte ces deux contraintes ?
    choices:
    - text: 8 min au plus
      correct: true
    - text: 10 min, moyenne des deux limites
      correct: false
    - text: 12 min, en suivant l’ordinateur de A
      correct: false
    explanation: 'La limite commune ne dépasse pas la contrainte la plus restrictive : ici 8 min. Le chiffre
      dépend des gaz, des profils et des appareils ; il ne devient pas une DTR universelle. La palanquée
      respecte aussi les profondeurs et durées de paliers de chacun.'
