      des durées. ; recto, choix et corrigé relus ; identité conservée'
    fact_check: pass
  fr:
    question: Pendant la remontée, l’ordinateur d’un équipier ajoute un arrêt obligatoire plus profond.
      Quelle information doit-il faire comprendre aux autres pour adapter ensemble le retour ?
    choices:
    - text: La profondeur et la durée de l’arrêt, puis leur évolution
      correct: true
    - text: La durée écoulée et la profondeur maximale atteinte
      correct: false
    - text: Le réglage GF et le modèle de l’ordinateur utilisé
      correct: false
    explanation: La profondeur et la durée disent où attendre et combien de temps. Le réglage GF (Gradient
      Factors, paramètres de conservatisme) et le modèle ne donnent pas ces obligations pour le profil
      réalisé ; les paramètres passés non plus. La palanquée compare les paliers de chacun, maintient
      sa cohésion et vérifie le gaz pour le retour modifié.
