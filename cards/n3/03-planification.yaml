      et GP-N4 conduite/désaturation ; calculs refaits sans utiliser les corrigés. ; recto, choix et corrigé
      relus ; identité conservée'
    fact_check: pass
  fr:
    question: Dans un exercice, la consommation prévue pour le trajet de retour correspond à 70 bar du
      bloc limitant. On veut conserver 20 bar à l’arrivée et ajouter 10 bar de marge avant de déclencher
      le retour. À quelle pression faut-il commencer ce retour ?
    choices:
    - text: 100 bar
      correct: true
    - text: 90 bar
      correct: false
    - text: 80 bar
      correct: false
    explanation: Il faut disposer de 70 + 20 + 10 = 100 bar au départ du retour. 90 bar oublie la marge
      de déclenchement ; 80 bar oublie les 20 bar à conserver à l’arrivée. Les 70 bar représentent une
      consommation sur le trajet, pas la pression à l’arrivée.
