      des durées. ; recto, choix et corrigé relus ; identité conservée'
    fact_check: pass
  fr:
    question: Après avoir quitté 45 m, un équipier propose de redescendre chercher une ancre à 40 m. Ce
      détour n’était pas prévu. À ventilation inchangée, quelle conséquence a cette exposition ajoutée
      sur le budget de gaz et le calcul de désaturation ?
    choices:
    - text: Du gaz supplémentaire est consommé et la désaturation doit être recalculée
      correct: true
    - text: Du gaz supplémentaire est consommé mais le calcul de désaturation reste inchangé
      correct: false
    - text: Le budget de gaz reste inchangé mais la désaturation doit être recalculée
      correct: false
    explanation: Le détour ajoute une durée de respiration et une nouvelle exposition en profondeur. Il
      consomme du gaz et doit être intégré au calcul de désaturation. Rester sous le maximum déjà atteint
      ne rend pas le détour neutre ; le plan initial ne suffit plus à le justifier.
