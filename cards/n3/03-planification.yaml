    fact_check: pass
  fr:
    question: Un changement de sortie ajoute 2 min à 20 m et un arrêt supplémentaire prévu de 4 min à
      3 m. Débit de référence 20 L/min à 1 bar. Quel gaz supplémentaire à 1 bar doit être budgété, hors
      autres transitions ? Température constante ; seul le gaz respiré est compté.
    choices:
    - text: 224 L
      correct: true
    - text: 120 L
      correct: false
    - text: 360 L
      correct: false
    explanation: Le trajet à 20 m coûte 20 × 3 × 2 = 120 L ; l’arrêt à 3 m coûte 20 × 1,3 × 4 = 104 L,
      soit 224 L supplémentaires à 1 bar. 120 L omet l’arrêt ; 360 L applique la pression de 20 m aux
      six minutes. Ce supplément s’ajoute aux autres besoins de retour et à la marge finale.