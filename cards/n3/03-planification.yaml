      et GP-N4 conduite/désaturation ; calculs refaits sans utiliser les corrigés. ; recto, choix et corrigé
      relus ; identité conservée'
    fact_check: pass
  fr:
    question: Un budget fictif laisse 400 L à 1 bar pour poursuivre à 40 m, avec un débit de référence
      de 20 L/min à 1 bar. Un arrêt supplémentaire de 3 min à 6 m doit être financé sur ces 400 L. Quel
      temps de fond reste-t-il, arrondi au dixième de minute ? Température constante ; seul le gaz respiré
      est compté.
    choices:
    - text: 3,0 min
      correct: true
    - text: 4,0 min
      correct: false
    - text: 1,0 min
      correct: false
    explanation: 'L’arrêt coûte 20 × 1,6 × 3 = 96 L. Il reste 304 L pour le fond, consommés à 20 × 5 =
      100 L/min : 3,04 min, soit 3,0 min après arrondi. 4,0 min omet l’arrêt ; 1,0 min soustrait trois
      minutes de palier à quatre minutes de fond malgré les pressions différentes.'
- id: n3-planification-arret-obligatoire-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
