- id: n3-planification-limite-effective-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  - N4
  tags:
  - chapitre-n3::03
  status: reviewed
  source_id: N3-03-01
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,11–13 ; scénarios originaux à contraintes explicites
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Reprise N4 du 2026-10-12, lot 05_GUIDAGE : MFT GP-N4 mai 2026 p.16–18 ; règles déjà vérifiées dans
      N2/N3, pertinence de guidage confirmée ; recto, choix et corrigé relus ; identité conservée'
    - 'Reprise N4 du 2026-10-12, lot 82 (reprises) : docs/reviews/n4/REPRISES_DETAILLEES.md ; 2026-10-12
      : Code du sport A322-78 relu, secours distincts de l’armement nautique ; MFT N3 décembre2025 planification
      et GP-N4 conduite/désaturation ; calculs refaits sans utiliser les corrigés. ; recto, choix et corrigé
      relus ; identité conservée'
    fact_check: pass
  fr:
    question: Deux N3 majeurs plongent avec DP. Le DP fixe 45 m ; le site choisi se termine à 38 m ; leur
      budget de gaz a été calculé pour 38 m. Quelle profondeur maximale est cohérente avec cette préparation
      ?
    choices:
    - text: 38 m
      correct: true
    - text: 45 m
      correct: false
    - text: 60 m
      correct: false
    explanation: La limite du brevet et la consigne du DP sont des plafonds, pas des profondeurs à atteindre.
      Le site et le budget retenus limitent ici le projet à 38 m. Changer de profondeur impose une nouvelle
      préparation.
