  status: reviewed
  source_id: N3-03-05
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,11–13 ; scénarios originaux à contraintes explicites
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Revue pédagogique du 2026-10-09 : docs/reviews/QUALITE_GLOBALE_2026-10-09.md ; objectif et identité
      conservés'
    - 'Revue N3 par petits lots du 2026-10-10, lot 05 : docs/reviews/n3/REVUE_ITERATIVE_2026-10-10.md
      ; identité et objectif conservés'
    - 'MFT N3 FFESSM décembre 2025, p.4,8–9,11,13 : planification collective, consignes, gaz, désaturation
      et progression ; relecture du 2026-10-10'
    fact_check: pass
  fr:
    question: Avant immersion, le planificateur prévoit 3 min à 6 m puis 6 min à 3 m pour la décompression.
      Le club ajoute habituellement un arrêt de sécurité de 3 min à 5 m, même aux plongées sans décompression
      obligatoire. Quel arrêt est ajouté en dehors des obligations de décompression calculées pour ce
      profil ?
    choices:
    - text: L’arrêt de 3 min à 5 m
      correct: true
    - text: L’arrêt de 3 min à 6 m
      correct: false
    - text: L’arrêt de 6 min à 3 m
      correct: false
    explanation: 'L’arrêt de sécurité ajouté à 5 m est distinct des obligations calculées. Les arrêts
      à 6 m et à 3 m sont imposés par le planificateur pour ce profil : ni leur profondeur ni leur durée
      ne les rendent facultatifs. La planification doit financer les obligations de décompression et les
      arrêts de sécurité retenus pour la plongée.'
- id: n3-planification-dtr-collective-001
  type: mcq
  deck: Matériel et préparation
  levels:
