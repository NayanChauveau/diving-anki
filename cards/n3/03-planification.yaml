    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,11–13 ; scénarios originaux à contraintes explicites
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    - 'Revue pédagogique du 2026-10-09 : docs/reviews/QUALITE_GLOBALE_2026-10-09.md ; objectif et identité
      conservés'
    fact_check: pass
  fr:
    question: En fin de plongée, après avoir quitté 45 m, un équipier propose de redescendre chercher
      une ancre à 40 m. Le plan de retour n’a prévu ni ce détour ni une nouvelle exposition profonde.
      Quelle vérification manque avant toute décision ?
    choices:
    - text: Le gaz et la désaturation du profil modifié pour toute la palanquée
      correct: true
    - text: La conformité de 40 m aux aptitudes du plongeur le plus expérimenté
      correct: false
    - text: La position de 40 m par rapport à la profondeur maximale déjà atteinte
      correct: false
    explanation: Une profondeur inférieure au maximum déjà atteint ne rend pas le détour neutre. Une exposition
      profonde ajoutée modifie gaz, durée et calculs de désaturation. Le plan initial ne constitue plus
      une justification suffisante pour redescendre.
- id: n3-planification-reprise-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
  - chapitre-n3::03
  status: reviewed
  source_id: N3-03-09
  review:
    sources:
    - N3-S01 — MFT N3 FFESSM, décembre 2025, p.8–9,11–13 ; scénarios originaux à contraintes explicites
    - 'Revue N3 du 2026-10-06 : docs/reviews/n3/COUVERTURE_N3.md'
    fact_check: pass
  fr:
    question: Un N3 revient après plusieurs années sans plonger et propose d’emblée 55 m avec DP. Quel
      élément du briefing doit influer sur le choix du profil malgré la validité du brevet ?
    choices:
    - text: Son expérience récente et son aisance actuelle dans une reprise progressive
      correct: true
    - text: Son nombre total de plongées anciennes, qui fixe seul la profondeur du jour
      correct: false
    - text: La date de son brevet, qui fixe une profondeur maximale annuelle
      correct: false
    explanation: Le diplôme atteste des compétences acquises ; l’aisance actuelle et l’expérience récente
      déterminent une adaptation raisonnable au jour de la reprise. Le MFT demande une accoutumance progressive
      et un choix collectif tenant compte des équipiers.
- id: n3-planification-communication-palier-001
  type: mcq
  deck: Matériel et préparation
  levels:
  - N3
  tags:
