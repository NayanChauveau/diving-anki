    - S1 p.28 ; coordination des paliers dans la palanquée.
    - 'Revue du 2026-10-06 : docs/reviews/13-ordinateurs.md'
    - 'Relecture globale du 2026-10-06 : docs/reviews/REVUE_FINALE_N2.md'
    fact_check: pass
  fr:
    front: Votre ordinateur n’indique plus de palier obligatoire, mais celui de votre équipier en impose
      encore un. Comment organiser la fin de plongée, avec du gaz suffisant ?
    back: '**Rester ensemble et terminer aussi les obligations de l’équipier, en suivant les mises à jour
      des deux appareils.** Respecter les plafonds, les profondeurs de palier et les durées de chacun.
      Un temps annoncé au départ ne devient pas un compte à rebours fixé une fois pour toutes ; il peut
      évoluer selon le profil réellement suivi.'
- id: n2-ordinateurs-differences-001
  type: basic
  deck: Désaturation
  levels:
