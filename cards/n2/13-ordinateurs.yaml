  fr:
    question: Avec votre masque et votre correction visuelle, vous devez lire rapidement profondeur, durée
      et alarmes. Quels critères d’affichage comptent directement pour choisir l’ordinateur ?
    choices:
    - text: Taille des caractères, contraste et éclairage de l’écran
      correct: true
    - text: Diagonale de l’écran, nombre de fonctions et mémoire du journal
      correct: false
    - text: Résolution de l’écran, nombre de modes et durée de la batterie
      correct: false
    explanation: La taille des caractères, le contraste et l’éclairage influencent directement la lecture.
      Diagonale ou résolution seules ne garantissent pas qu’un nombre soit lisible ; le nombre de fonctions
      et la mémoire ne le garantissent pas davantage. Tester avec masque et correction dans un éclairage
      représentatif.
