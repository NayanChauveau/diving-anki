  fr:
    question: A a plongé séparément de B le matin. Avant l’immersion de l’après-midi, A met au poignet
      l’ordinateur de B, encore en suivi de désaturation. Quel historique cet appareil utilise-t-il pour
      le calcul ?
    choices:
    - text: Les immersions que l’appareil a suivies avec B
      correct: true
    - text: Les immersions effectuées par A, qui porte maintenant l’appareil
      correct: false
    - text: Un état de surface neuf lors du changement d’utilisateur
      correct: false
    explanation: L’appareil continue le calcul des immersions qu’il a enregistrées avec B. Il ne reconnaît
      ni le changement de porteur ni le profil antérieur de A et ne remet pas automatiquement sa charge
      à zéro. Conserver son propre suivi pendant la série.
