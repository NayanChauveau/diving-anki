  fr:
    question: Sur un appareil offrant un réglage de salinité, à quoi sert ce réglage dans l’affichage
      de profondeur ?
    choices:
    - text: Convertir pression mesurée en profondeur selon la densité de l’eau
      correct: true
    - text: Appliquer un décalage fixe de profondeur quelle que soit la pression
      correct: false
    - text: Corriger l’altitude de référence avant de convertir la pression
      correct: false
    explanation: '**À convertir la pression mesurée en profondeur en fonction de la densité de l’eau.**
      À pression identique, une densité plus élevée correspond à une profondeur moindre ; tous les modèles
      n’offrent pas ce réglage.'
