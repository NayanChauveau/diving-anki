  fr:
    question: Vous utilisez un nouveau modèle d’ordinateur. Son écran peut demander un arrêt de sécurité
      ou un arrêt obligatoire après une anomalie. Quelle distinction faut-il savoir lire dans son manuel
      pour appliquer la conduite adaptée ?
    choices:
    - text: Le symbole et le message correspondant à l’arrêt dans ce modèle
      correct: true
    - text: La profondeur à laquelle cet arrêt est affiché
      correct: false
    - text: Le nombre de minutes affiché pour cet arrêt
      correct: false
    explanation: 'Le manuel associe symboles et messages au statut de l’arrêt et à sa conduite à tenir.
      La profondeur ou la durée seules ne distinguent pas confort et obligation : un arrêt peu profond
      peut être rendu obligatoire après une anomalie. Maîtriser ces indications avant immersion.'
