  fr:
    question: Sur un Suunto Zoop Novo, une alarme sonore s’accompagne du message SLOW. Que signale-t-elle
      et quelle action attend-elle ?
    choices:
    - text: 'Remontée au-delà de 10 m/min : ralentir'
      correct: true
    - text: 'Remontée au-delà de 15 m/min : ralentir'
      correct: false
    - text: 'Remontée au-delà de 6 m/min : ralentir'
      correct: false
    explanation: '**La vitesse dépasse 10 m/min.** Ralentir la remontée conformément au manuel ; une vitesse
      permise par une table ne neutralise pas cette alarme.'
