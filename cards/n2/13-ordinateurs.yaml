    - 'Revue du 2026-10-06 : docs/reviews/13-ordinateurs.md'
    fact_check: pass
  fr:
    front: Un Suunto Zoop Novo reste plus de 3 min au-dessus de son plafond de décompression et affiche
      ER. Quelle information de décompression devient indisponible et pour quelle durée annoncée par le
      manuel ?
    back: '**Le calcul de décompression est verrouillé pendant les 48 h suivant la sortie de l’eau.**
      L’appareil conserve des informations telles que profondeur et durée, mais n’affiche plus les données
      de décompression calculées. Ce comportement est propre à ce modèle.'
