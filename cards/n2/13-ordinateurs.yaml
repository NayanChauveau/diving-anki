  fr:
    question: À profondeur constante, un ordinateur sans sonde affiche 12 min de NDL ; le manomètre et
      la consommation observée indiquent 4 min avant le seuil de retour convenu. Que représentent respectivement
      ces deux durées ?
    choices:
    - text: 12 min avant palier estimé ; 4 min avant déclenchement du retour lié au gaz
      correct: true
    - text: 12 min avant déclenchement du retour lié au gaz ; 4 min avant palier estimé
      correct: false
    - text: 12 min de trajet jusqu’à la surface ; 4 min avant déclenchement du retour lié au gaz
      correct: false
    explanation: NDL est le temps estimé encore possible à cette profondeur sans décompression obligatoire.
      Les quatre minutes relèvent du gaz et du seuil convenu pour conserver le budget de retour. Le seuil
      de gaz peut commander la fin d’exploration avant d’atteindre la limite sans palier.
