    - 'Suunto — Zoop Novo User Guide, fonctions et contrôles, consulté le 2026-10-06 : https://us.suunto.com/pages/suunto-zoop-novo-user-guide'
    - 'Revue du 2026-10-06 : docs/reviews/13-ordinateurs.md'
    fact_check: pass
  fr:
    front: Si l’on envisage une formation nitrox plus tard, quel point vérifier dans les fonctions de
      l’ordinateur ?
    back: '**La présence d’un mode nitrox et les mélanges qu’il accepte.** Ce mode permet de renseigner
      la fraction d’oxygène ; son réglage doit correspondre au gaz analysé et aux limites apprises dans
      cette formation.'
- id: n2-ordinateurs-gf-principe-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::13
  - ordinateurs
  status: reviewed
  source_id: P637
