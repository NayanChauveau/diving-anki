    - 'FFESSM — MFT N2 mai 2026, p.12–13 et 19–20 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Revue complémentaire du 2026-10-06 : docs/reviews/COUVERTURE_FINALE_N2.md'
    fact_check: pass
  fr:
    front: Pour une planification PA20 FFESSM à l’air avec un ordinateur réglable par gradient factors,
      quelle relation et quelle plage de valeurs sont indiquées pour GF bas et GF haut ?
    back: '**GF bas = GF haut, avec une valeur entre 85 et 90 %.** Exemples : 85/85 ou 90/90. Ce repère
      fédéral concerne la plongée à l’air ; certains ordinateurs utilisent d’autres réglages de conservatisme
      plutôt que des GF.'
- id: n2-ordinateurs-plafond-lecture-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::13
  - ordinateurs
  status: reviewed
  source_id: P644
  review:
    sources:
    - 'Suunto — Zoop Novo User Guide, Decompression dives, définition CEILING et actualisation, consulté
      le 2026-10-06 : https://www.suunto.com/Support/Product-support/suunto_zoop_novo/suunto_zoop_novo/features/decompression-dives/'
    - 'Relecture globale du 2026-10-06 : docs/reviews/REVUE_FINALE_N2.md'
    fact_check: pass
  fr:
    front: Pendant une décompression, un Suunto Zoop Novo affiche CEILING 6 m. Le plongeur est à 7 m.
      Rejoindre 5 m respecterait-il ce plafond ?
    back: '**Non.** CEILING 6 m indique la profondeur la plus faible autorisée à cet instant : ne pas
      passer au-dessus de 6 m. À 7 m, le plongeur est sous le plafond ; à 5 m, il le franchirait. Le plafond
      évolue : suivre l’appareil plutôt que conserver cette valeur jusqu’à la fin.'
- id: n2-ordinateurs-plafonds-differents-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::13
  - ordinateurs
  status: reviewed
  source_id: P645
  review:
    sources:
    - 'Suunto — Zoop Novo User Guide, Decompression dives, définition CEILING et actualisation, consulté
      le 2026-10-06 : https://www.suunto.com/Support/Product-support/suunto_zoop_novo/suunto_zoop_novo/features/decompression-dives/'
    - 'FFESSM — MFT N2, mai 2026, p.12–13 et 17 : gestion collective des différents moyens de désaturation.
      https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Relecture globale du 2026-10-06 : docs/reviews/REVUE_FINALE_N2.md'
    fact_check: pass
  fr:
    front: Deux équipiers utilisent des ordinateurs avec un plafond de décompression à ne pas franchir.
      A indique 6 m, B indique 3 m. Ils sont ensemble à 7 m, avec du gaz suffisant. Peuvent-ils rejoindre
      ensemble 3 m à cet instant ?
    back: '**Non : ils franchiraient le plafond de A.** Le groupe doit rester à 6 m ou plus profond tant
      que A impose ce plafond, puis suivre l’évolution des deux appareils. Un plafond à 3 m chez B ne
      signifie pas que son temps de palier à 3 m sera crédité intégralement en restant à 6 m ; contrôler
      ses indications.'
