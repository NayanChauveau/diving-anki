  fr:
    question: Pourquoi vérifier le gaz sélectionné sur l’ordinateur avant de plonger, même si la profondeur
      affichée paraît correcte ?
    choices:
    - text: Le gaz réglé influe sur désaturation et exposition à l’oxygène
      correct: true
    - text: Le gaz réglé influe uniquement sur l’exposition à l’oxygène
      correct: false
    - text: Le gaz réglé influe uniquement sur les calculs de désaturation
      correct: false
    explanation: '**La fraction d’oxygène sélectionnée intervient dans les calculs de décompression et
      d’exposition à l’oxygène.** Une profondeur juste ne prouve pas que le mélange paramétré correspond
      au gaz réellement respiré.'
