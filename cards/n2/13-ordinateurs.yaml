cards:
- id: n2-ordinateurs-profil-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::13
  - ordinateurs
  status: reviewed
  source_id: P415
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.27–29.
    - 'Suunto — Zoop Novo User Guide, fonctions et contrôles, consulté le 2026-10-06 : https://us.suunto.com/pages/suunto-zoop-novo-user-guide'
    - 'Revue du 2026-10-06 : docs/reviews/13-ordinateurs.md'
    fact_check: pass
  fr:
    front: Pourquoi un ordinateur peut-il donner une décompression différente d’une table pour une plongée
      qui remonte progressivement le long d’un tombant ?
    back: '**Il intègre les profondeurs successivement mesurées et leur durée**, au lieu d’attribuer toute
      l’exploration à la profondeur maximale comme un profil carré. Le résultat dépend aussi de son modèle
      et de l’historique enregistré.'
- id: n2-ordinateurs-affichages-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::13
  - ordinateurs
  status: reviewed
  source_id: P418
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.27–29.
    - 'Suunto — Zoop Novo User Guide, fonctions et contrôles, consulté le 2026-10-06 : https://us.suunto.com/pages/suunto-zoop-novo-user-guide'
    - 'Revue du 2026-10-06 : docs/reviews/13-ordinateurs.md'
    fact_check: pass
  fr:
    front: Un écran affiche temps de plongée 24 min et temps restant sans palier 6 min à la profondeur
      actuelle. Que représentent ces deux valeurs ?
    back: '**24 min sont déjà écoulées ; 6 min sont une estimation du temps encore disponible à cette
      profondeur avant décompression obligatoire.** Le second nombre évolue avec la profondeur, le profil
      et les réglages ; ce n’est pas le temps nécessaire pour revenir au bateau.'
