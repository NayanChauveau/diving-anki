    - 'Suunto — Zoop Novo User Guide, fonctions et contrôles, consulté le 2026-10-06 : https://us.suunto.com/pages/suunto-zoop-novo-user-guide'
    - 'Revue du 2026-10-06 : docs/reviews/13-ordinateurs.md'
    fact_check: pass
  fr:
    front: Entre deux plongées rapprochées, pourquoi remplacer son ordinateur par celui d’un équipier
      peut-il fausser la décompression affichée ?
    back: '**Il suivrait l’historique et la charge calculée de l’autre plongeur.** Conserver le même appareil
      pour la série et ne pas échanger un ordinateur encore en cours de calcul de désaturation.'
- id: n2-ordinateurs-controle-001
  type: basic
  deck: Désaturation
  levels:
