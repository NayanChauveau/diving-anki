  fr:
    question: Pendant une décompression, un Suunto Zoop Novo affiche CEILING 6 m. Le plongeur est à 7 m.
      Rejoindre 5 m respecterait-il ce plafond ?
    choices:
    - text: 'Non : à 5 m il serait au-dessus du plafond de 6 m'
      correct: true
    - text: 'Oui : 5 m est plus proche de la surface que le plafond'
      correct: false
    - text: 'Oui : le plafond fixe une durée et non une profondeur limite'
      correct: false
    explanation: '**Non.** CEILING 6 m indique la profondeur la plus faible autorisée à cet instant : ne
      pas passer au-dessus de 6 m. À 7 m, le plongeur est sous le plafond ; à 5 m, il le franchirait. Le
      plafond évolue : suivre l’appareil plutôt que conserver cette valeur jusqu’à la fin.'
