  fr:
    question: Un ordinateur personnel a suivi toutes les plongées et mesure profondeur et durée, sans
      capteur relié au bloc. Laquelle de ces informations échappe à son suivi de désaturation ?
    choices:
    - text: La pression actuelle du gaz dans le bloc
      correct: true
    - text: La charge de gaz inerte estimée par ses compartiments
      correct: false
    - text: Le temps sans palier estimé à la profondeur actuelle
      correct: false
    explanation: La pression du bloc demande un capteur compatible, souvent une sonde au premier étage.
      Le profil mesuré permet d’estimer la charge de désaturation et le temps sans palier, mais pas de
      connaître directement la pression de gaz restante. L’autonomie respiratoire exige aussi une estimation
      de consommation.
