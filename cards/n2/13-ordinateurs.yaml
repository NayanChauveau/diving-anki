  fr:
    question: Deux équipiers utilisent des ordinateurs avec un plafond de décompression à ne pas franchir.
      A indique 6 m, B indique 3 m. Ils sont ensemble à 7 m, avec du gaz suffisant. Peuvent-ils rejoindre
      ensemble 3 m à cet instant ?
    choices:
    - text: 'Non : A impose encore de rester à 6 m ou plus profond'
      correct: true
    - text: 'Oui : les deux plafonds peuvent être moyennés à 4,5 m'
      correct: false
    - text: 'Oui : B autorise 3 m, donc la palanquée peut y aller ensemble'
      correct: false
    explanation: '**Non : ils franchiraient le plafond de A.** Le groupe doit rester à 6 m ou plus profond
      tant que A impose ce plafond, puis suivre l’évolution des deux appareils. Un plafond à 3 m chez B
      ne signifie pas que son temps de palier à 3 m sera crédité intégralement en restant à 6 m ; contrôler
      ses indications.'
