    fact_check: pass
  fr:
    front: Un ordinateur annonce 12 min sans palier, mais la réserve de gaz convenue sera atteinte dans
      4 min à la consommation actuelle. Quelle contrainte commande la décision de fin d’exploration ?
    back: '**La contrainte de gaz impose d’anticiper la sortie.** Le temps sans palier concerne la décompression,
      pas l’autonomie respiratoire ; les 12 min n’autorisent pas à consommer la réserve nécessaire à la
      remontée.'
- id: n2-ordinateurs-sonde-001
  type: basic
  deck: Désaturation
  levels:
