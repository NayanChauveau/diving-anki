    - Complément identifié par comparaison au MFT N2 actuel, absent du cours S1.
    - 'Suunto — Nautic, Gradient Factors, définition du gradient et réglages : https://origin-www.suunto.com/en-ph/Support/Product-support/suunto_nautic/suunto_nautic/algorithm-settings/gradient-factors/'
    - 'FFESSM — MFT N2 mai 2026, p.12–13 et 19–20 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Revue complémentaire du 2026-10-06 : docs/reviews/COUVERTURE_FINALE_N2.md'
    - 'Relecture globale du 2026-10-06 : docs/reviews/REVUE_FINALE_N2.md'
    fact_check: pass
  fr:
    front: Dans un modèle Bühlmann à gradient factors, que représente le pourcentage d’un GF par rapport
      à la pression ambiante et à la limite du modèle ?
    back: '**Une fraction du gradient de sursaturation autorisé par le modèle.** 0 % correspond à la pression
      ambiante et 100 % à la limite originale du modèle, appelée M-value. Ce pourcentage ne mesure pas
      une probabilité personnelle d’accident. GF signifie Gradient Factor, ou facteur de gradient.'
