  fr:
    question: Votre ordinateur n’indique plus de palier, celui de votre équipier en impose encore. Le
      gaz permet de respecter les deux. Quelle conduite règle la fin de plongée de la palanquée ?
    choices:
    - text: Rester ensemble et suivre les obligations actualisées des deux appareils
      correct: true
    - text: Rester ensemble et appliquer jusqu’au bout les durées relevées au départ du fond
      correct: false
    - text: Terminer chacun les obligations de son appareil et se retrouver en surface
      correct: false
    explanation: Les appareils actualisent profondeur de plafond, arrêts et durées pendant la remontée.
      La palanquée reste ensemble et confronte les deux indications ; le plan relevé au fond n’est pas
      un compte à rebours fixe. Une absence de palier chez l’un n’autorise pas à se séparer.
