    fact_check: pass
  fr:
    front: Pourquoi tester la lecture de l’écran avec son masque et sa correction visuelle avant de choisir
      un ordinateur ?
    back: '**Il faut pouvoir distinguer rapidement profondeur, plafond, durée et alarmes dans les conditions
      de plongée.** Taille des caractères, contraste et éclairage comptent plus que la seule quantité
      de fonctions.'
- id: n2-ordinateurs-modes-001
  type: basic
  deck: Désaturation
  levels:
