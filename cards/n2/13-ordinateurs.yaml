  fr:
    question: Deux équipiers sont restés côte à côte pendant l’exploration mais ont des paliers différents.
      Quel ensemble de données permet de rechercher une explication dans leurs calculs ?
    choices:
    - text: Modèles, réglages, gaz sélectionnés et historiques personnels
      correct: true
    - text: Modèles, réglages, volumes des blocs et pressions de départ
      correct: false
    - text: Profondeurs maximales, durées de l’exploration et pressions restantes
      correct: false
    explanation: Les modèles, réglages, gaz sélectionnés et immersions antérieures peuvent différer. Même
      un profil actuel proche ne garantit pas une charge calculée identique ; de petites différences de
      profondeur enregistrée comptent aussi. Les volumes et pressions des blocs relèvent du budget respiratoire,
      pas directement du calcul de désaturation.
