    fact_check: pass
  fr:
    front: Pendant l’exploration, la durée totale de remontée affichée augmente. Quelle conséquence pour
      la décision de rester au fond ?
    back: '**Il faut prévoir davantage de temps et de gaz pour sortir.** Prévenir et réévaluer la fin
      de plongée avec la palanquée ; le gaz nécessaire dépend des profondeurs de remontée et des paliers,
      pas seulement du temps d’exploration.'
- id: n2-ordinateurs-ndl-air-001
  type: basic
  deck: Désaturation
  levels:
