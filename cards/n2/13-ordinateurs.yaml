  fr:
    question: Pourquoi un ordinateur peut-il donner une décompression différente d’une table pour une
      plongée qui remonte progressivement le long d’un tombant ?
    choices:
    - text: Il intègre les profondeurs successives et le temps à chacune
      correct: true
    - text: Il applique toute la durée à la profondeur maximale
      correct: false
    - text: Il applique toute la durée à la dernière profondeur mesurée
      correct: false
    explanation: '**Il intègre les profondeurs successivement mesurées et leur durée**, au lieu d’attribuer
      toute l’exploration à la profondeur maximale comme un profil carré. Le résultat dépend aussi de
      son modèle et de l’historique enregistré.'
