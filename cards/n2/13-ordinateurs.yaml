  fr:
    question: Un ordinateur annonce 12 min sans palier, mais la réserve de gaz convenue sera atteinte dans
      4 min à la consommation actuelle. Quelle contrainte commande la décision de fin d’exploration ?
    choices:
    - text: La contrainte de gaz impose d’anticiper la fin d’exploration
      correct: true
    - text: Le temps sans palier permet de poursuivre jusqu’aux 12 min annoncées
      correct: false
    - text: Il faut attendre que le temps sans palier égale le temps avant réserve
      correct: false
    explanation: '**La contrainte de gaz impose d’anticiper la sortie.** Le temps sans palier concerne la
      décompression, pas l’autonomie respiratoire ; les 12 min n’autorisent pas à consommer la réserve nécessaire
      à la remontée.'
