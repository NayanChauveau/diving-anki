  fr:
    question: Votre ordinateur n’indique plus de palier obligatoire, mais celui de votre équipier en impose
      encore un. Comment organiser la fin de plongée, avec du gaz suffisant ?
    choices:
    - text: Terminer ensemble les obligations des deux appareils
      correct: true
    - text: Remonter ensemble dès que le premier appareil libère son plongeur
      correct: false
    - text: Suivre ensemble celui qui a indiqué le moins de paliers au fond
      correct: false
    explanation: '**Rester ensemble et terminer aussi les obligations de l’équipier, en suivant les mises
      à jour des deux appareils.** Respecter les plafonds, les profondeurs de palier et les durées de chacun.
      Un temps annoncé au départ ne devient pas un compte à rebours fixé une fois pour toutes ; il peut
      évoluer selon le profil réellement suivi.'
