    - 'Suunto — Zoop Novo User Guide, fonctions et contrôles, consulté le 2026-10-06 : https://us.suunto.com/pages/suunto-zoop-novo-user-guide'
    - 'Revue du 2026-10-06 : docs/reviews/13-ordinateurs.md'
    fact_check: pass
  fr:
    front: Pourquoi vérifier le gaz sélectionné sur l’ordinateur avant de plonger, même si la profondeur
      affichée paraît correcte ?
    back: '**La fraction d’oxygène sélectionnée intervient dans les calculs de décompression et d’exposition
      à l’oxygène.** Une profondeur juste ne prouve pas que le mélange paramétré correspond au gaz réellement
      respiré.'
- id: n2-ordinateurs-salinite-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::13
  - ordinateurs
  status: reviewed
  source_id: P424
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.27–29.
    - 'Shearwater — Petrel 2 Support, conversion pression/profondeur et salinité : https://shearwater.com/en-eu/pages/petrel-2-support'
    - 'Revue du 2026-10-06 : docs/reviews/13-ordinateurs.md'
    fact_check: pass
  fr:
    front: Sur un appareil offrant un réglage de salinité, à quoi sert ce réglage dans l’affichage de
      profondeur ?
    back: '**À convertir la pression mesurée en profondeur en fonction de la densité de l’eau.** À pression
      identique, une densité plus élevée correspond à une profondeur moindre ; tous les modèles n’offrent
      pas ce réglage.'
- id: n2-ordinateurs-historique-001
  type: basic
  deck: Désaturation
  levels:
