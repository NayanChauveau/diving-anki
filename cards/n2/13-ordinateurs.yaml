      ordinateurs indiquent 6 m pour A et 3 m pour B. Quelle est la profondeur la plus faible qu’ils puissent
      rejoindre ensemble à cet instant en respectant les deux plafonds ?
    choices:
    - text: 6 m
      correct: true
    - text: 4,5 m
      correct: false
    - text: 3 m
      correct: false
