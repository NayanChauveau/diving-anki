    question: Avant immersion, quel ensemble de contrôles couvre le fonctionnement et les paramètres utilisés
      par l’ordinateur pour la plongée prévue ?
    choices:
    - text: Écran, énergie, mode, gaz, réglages personnels ou d’altitude et historique
      correct: true
    - text: Écran, énergie, journal, profondeur maximale passée et heure locale
      correct: false
    - text: Écran, énergie, pression du bloc, journal et intervalle conseillé par un équipier
      correct: false
    explanation: '**Vérifier l’écran, l’énergie disponible, le mode, le gaz et les réglages personnels ou
      d’altitude.** Vérifier aussi l’absence d’erreur et la cohérence de l’historique ; savoir retrouver
      profondeur, durée et obligations de remontée.'
