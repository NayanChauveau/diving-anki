  fr:
    question: Un ordinateur s’allume, dispose d’énergie et mesure la profondeur. Quel ensemble de données
      faut-il encore vérifier pour que ses calculs correspondent à la plongée prévue et au plongeur ?
    choices:
    - text: Mode actif, mélange sélectionné, réglages et suivi des immersions personnelles
      correct: true
    - text: Mode actif, pression du bloc, réglages et nombre de plongées mémorisées
      correct: false
    - text: Mélange sélectionné, pression du bloc, heure locale et modèle du détendeur
      correct: false
    explanation: Le calcul dépend du mode, du gaz et des réglages actifs, avec un historique personnel
      cohérent. Le nombre d’entrées au journal ne garantit pas le bon suivi résiduel ; pression du bloc
      et modèle du détendeur n’établissent pas la charge de désaturation. Vérifier aussi absence d’erreur
      et lisibilité des indications.
