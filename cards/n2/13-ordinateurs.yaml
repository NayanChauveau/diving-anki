  fr:
    question: À profondeur constante, la durée totale de remontée (DTR) augmente de 3 min pendant l’exploration.
      Pour calculer le gaz consommé par le profil de retour actualisé, à quelle pression faut-il compter
      chacune de ses phases ?
    choices:
    - text: À la pression ambiante de la profondeur de chaque phase
      correct: true
    - text: À la pression ambiante de la profondeur d’exploration pour toutes les phases
      correct: false
    - text: À la pression atmosphérique de surface pour toutes les phases
      correct: false
    explanation: 'Le gaz nécessaire dépend du temps et de la pression à chaque phase : trajets, remontée
      et arrêts. Une hausse de DTR ne signifie pas trois minutes de plus au fond ni trois minutes à 1
      bar. Reprendre les phases actualisées avec la palanquée ; cela peut commander une fin d’exploration
      plus précoce.'
