      correct: true
    - text: La probabilité personnelle d’un accident en pourcentage
      correct: false
    - text: Une fraction de la M-value mesurée depuis zéro pression
      correct: false
    explanation: '**Une fraction du gradient de sursaturation autorisé par le modèle.** 0 % correspond
      à la pression ambiante et 100 % à la limite originale du modèle, appelée M-value. Ce pourcentage
      ne mesure pas une probabilité personnelle d’accident. GF signifie Gradient Factor, ou facteur de
      gradient.'
