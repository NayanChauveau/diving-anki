    - 'Suunto — Zoop Novo User Guide, Alarms, alerts and notifications : https://us.suunto.com/pages/suunto-zoop-novo-user-guide'
    fact_check: pass
  fr:
    front: Sur un Suunto Zoop Novo, une alarme sonore s’accompagne du message SLOW. Que signale-t-elle
      et quelle action attend-elle ?
    back: '**La vitesse dépasse 10 m/min.** Ralentir la remontée conformément au manuel ; une vitesse
      permise par une table ne neutralise pas cette alarme.'
- id: n2-ordinateurs-gaz-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::13
  - ordinateurs
  status: reviewed
  source_id: P423
