  fr:
    question: Pendant l’exploration, la durée totale de remontée affichée augmente. Quelle conséquence pour
      la décision de rester au fond ?
    choices:
    - text: Prévoir davantage de temps et de gaz pour sortir
      correct: true
    - text: Prolonger le fond car le temps sans palier augmente aussi
      correct: false
    - text: Conserver le budget de gaz si la profondeur maximale ne change pas
      correct: false
    explanation: '**Il faut prévoir davantage de temps et de gaz pour sortir.** Prévenir et réévaluer la
      fin de plongée avec la palanquée ; le gaz nécessaire dépend des profondeurs de remontée et des paliers,
      pas seulement du temps d’exploration.'
