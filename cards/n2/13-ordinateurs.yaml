    question: Deux plongeurs restent côte à côte pendant une plongée mais leurs ordinateurs annoncent des
      paliers différents. Quelles différences peuvent l’expliquer ?
    choices:
    - text: Le profil actuel peut être voisin malgré des modèles, réglages ou historiques différents
      correct: true
    - text: Un profil actuel voisin suffit à imposer des paliers identiques, quel que soit l’historique
      correct: false
    - text: Un profil actuel voisin suffit à imposer des paliers identiques, quels que soient les réglages
      correct: false
    explanation: '**Le modèle, les réglages et les plongées précédentes peuvent différer.** De petites différences
      de profondeur enregistrée comptent aussi. Un même profil actuel ne garantit pas une même charge calculée.'
