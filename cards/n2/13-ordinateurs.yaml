    fact_check: pass
  fr:
    question: Un écran affiche temps de plongée 24 min et temps restant sans palier 6 min à la profondeur
      actuelle. Que représentent ces deux valeurs ?
    choices:
    - text: 24 min écoulées ; 6 min estimées avant palier à cette profondeur
      correct: true
    - text: 24 min écoulées ; 6 min de remontée jusqu’à la surface
      correct: false
    - text: 24 min d’autonomie gaz ; 6 min estimées avant palier
      correct: false
    explanation: '**24 min sont déjà écoulées ; 6 min sont une estimation du temps encore disponible à cette
      profondeur avant décompression obligatoire.** Le second nombre évolue avec la profondeur, le profil
      et les réglages ; ce n’est pas le temps nécessaire pour revenir au bateau.'
