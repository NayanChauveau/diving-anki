    fact_check: pass
  fr:
    front: Deux plongeurs restent côte à côte pendant une plongée mais leurs ordinateurs annoncent des
      paliers différents. Quelles différences peuvent l’expliquer ?
    back: '**Le modèle, les réglages et les plongées précédentes peuvent différer.** De petites différences
      de profondeur enregistrée comptent aussi. Un même profil actuel ne garantit pas une même charge
      calculée.'
- id: n2-ordinateurs-dtr-augmente-001
  type: basic
  deck: Désaturation
  levels:
