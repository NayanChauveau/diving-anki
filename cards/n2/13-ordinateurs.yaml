    question: Vous empruntez pour la première fois un modèle d’ordinateur différent. Quelles informations
      de son manuel devez-vous maîtriser pour gérer la remontée ?
    choices:
    - text: Interpréter temps sans palier, plafond, paliers, limites de vitesse et alarmes du modèle
      correct: true
    - text: Interpréter profondeur et durée, puis appliquer les vitesses et alarmes du modèle précédent
      correct: false
    - text: Interpréter profondeur et durée, puis appliquer les procédures et vitesses des tables MN90
      correct: false
    explanation: '**Reconnaître le temps sans palier, les obligations de décompression et le plafond, puis
      les alarmes et leur conduite à tenir.** Connaître aussi les limites de vitesse et les conséquences
      d’une erreur ; un symbole familier ne garantit pas une fonction identique.'
