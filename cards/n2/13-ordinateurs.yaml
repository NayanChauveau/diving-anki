    - 'Revue du 2026-10-06 : docs/reviews/13-ordinateurs.md'
    fact_check: pass
  fr:
    front: Pourquoi un ordinateur sans liaison de pression avec le bloc ne peut-il pas connaître directement
      le gaz encore disponible ?
    back: '**Il ne mesure pas la pression du bloc.** La gestion intégrée de l’air nécessite un capteur
      compatible, souvent une sonde ; une estimation d’autonomie dépend en plus de la consommation et
      des hypothèses du système.'
- id: n2-ordinateurs-verrouillage-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
