  fr:
    question: Pourquoi un ordinateur sans liaison de pression avec le bloc ne peut-il pas connaître directement
      le gaz encore disponible ?
    choices:
    - text: Il ne mesure pas la pression restante du bloc
      correct: true
    - text: Il déduit la pression restante de la profondeur mesurée
      correct: false
    - text: Il déduit la pression restante du temps sans palier
      correct: false
    explanation: '**Il ne mesure pas la pression du bloc.** La gestion intégrée de l’air nécessite un capteur
      compatible, souvent une sonde ; une estimation d’autonomie dépend en plus de la consommation et des
      hypothèses du système.'
