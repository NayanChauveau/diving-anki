  fr:
    front: Vous empruntez pour la première fois un modèle d’ordinateur différent. Quelles informations
      de son manuel devez-vous maîtriser pour gérer la remontée ?
    back: '**Reconnaître le temps sans palier, les obligations de décompression et le plafond, puis les
      alarmes et leur conduite à tenir.** Connaître aussi les limites de vitesse et les conséquences d’une
      erreur ; un symbole familier ne garantit pas une fonction identique.'
