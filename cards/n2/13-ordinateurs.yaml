  fr:
    question: Entre deux plongées rapprochées, pourquoi remplacer son ordinateur par celui d’un équipier
      peut-il fausser la décompression affichée ?
    choices:
    - text: Il utilise l’historique et la charge calculée de l’équipier
      correct: true
    - text: Le changement remet automatiquement la charge calculée à zéro
      correct: false
    - text: La même profondeur maximale assure la même charge calculée
      correct: false
    explanation: '**Il suivrait l’historique et la charge calculée de l’autre plongeur.** Conserver le même
      appareil pour la série et ne pas échanger un ordinateur encore en cours de calcul de désaturation.'
