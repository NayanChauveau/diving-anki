    - 'Revue du 2026-10-06 : docs/reviews/13-ordinateurs.md'
    fact_check: pass
  fr:
    front: Avant de s’immerger avec son ordinateur, quels contrôles évitent de découvrir un mauvais réglage
      ou un affichage inutilisable sous l’eau ?
    back: '**Vérifier l’écran, l’énergie disponible, le mode, le gaz et les réglages personnels ou d’altitude.**
      Vérifier aussi l’absence d’erreur et la cohérence de l’historique ; savoir retrouver profondeur,
      durée et obligations de remontée.'
- id: n2-ordinateurs-collectif-001
  type: basic
  deck: Désaturation
  levels:
