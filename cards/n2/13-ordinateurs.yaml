  fr:
    question: Un Suunto Zoop Novo reste plus de 3 min au-dessus de son plafond de décompression et affiche
      ER. Quelle information de décompression devient indisponible et pour quelle durée annoncée par le
      manuel ?
    choices:
    - text: Calcul de décompression indisponible pendant 48 h après sortie
      correct: true
    - text: Profondeur et durée indisponibles pendant 48 h après sortie
      correct: false
    - text: Calcul de décompression indisponible pendant 24 h après sortie
      correct: false
    explanation: '**Le calcul de décompression est verrouillé pendant les 48 h suivant la sortie de l’eau.**
      L’appareil conserve des informations telles que profondeur et durée, mais n’affiche plus les données
      de décompression calculées. Ce comportement est propre à ce modèle.'
- id: n2-ordinateurs-manuel-001
  type: mcq
  anki_model: basic
  deck: Désaturation
