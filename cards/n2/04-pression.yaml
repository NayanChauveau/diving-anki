  fr:
    question: Au même endroit et à la même altitude, comment évolue généralement la pression atmosphérique
      lorsque le système dépressionnaire laisse place à un anticyclone ?
    choices:
    - text: Elle augmente
      correct: true
    - text: Elle diminue
      correct: false
    - text: Elle reste identique
      correct: false
    explanation: 'Une dépression correspond à des basses pressions et un anticyclone à des hautes pressions.
      L’altitude constante ne rend pas la pression atmosphérique constante : la situation météorologique
      compte aussi. La valeur de 1 bar utilisée dans les exercices reste une approximation.'
- id: n2-pression-hydrostatique-001
  type: mcq
  anki_model: basic
