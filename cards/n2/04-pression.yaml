cards:
- id: n2-pression-force-surface-001
  type: mcq
  anki_model: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::04
  - pressions
  status: reviewed
  source_id: P096
  review:
    sources:
    - 'Conversion QCM et revue des choix du 2026-10-06 : docs/reviews/QCM_GLOBALE.md'
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.9–10.
    - S3 — CPDA, Notions de physique 2024, p.2–3 (imprimées 4–5).
    - 'Vérification et revue du 2026-10-06 : docs/reviews/04-pression.md'
    - 'NIST — Guide to the SI, Appendix B.9, unités de pression : https://www.nist.gov/pml/special-publication-811/nist-guide-si-appendix-b-conversion-factors/nist-guide-si-appendix-b9'
    - 'Revue approfondie N2 du 2026-10-09 : docs/reviews/PHYSIQUE_N2_2026-10-09.md ; NIST B.9 et NOAA/NWS
      Pressure ; modèle hydrostatique explicite ; résolution algébrique propre ; chaque distracteur analysé
      dans le CSV'
    fact_check: pass
  fr:
    question: Une force perpendiculaire F est répartie uniformément sur une surface S. Quelle relation
      donne la pression moyenne P ?
    choices:
    - text: P = F / S
      correct: true
    - text: P = F × S
      correct: false
    - text: P = S / F
      correct: false
    explanation: '**P = F / S**, avec F en newtons (N), S en mètres carrés (m²) et P en pascals (Pa).
      Une pression mesure une force par unité de surface : 1 Pa = 1 N/m².'
- id: n2-pression-variation-force-surface-001
  type: mcq
  anki_model: basic
  deck: Physique
  levels:
