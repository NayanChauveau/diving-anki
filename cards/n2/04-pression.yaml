      dans le CSV'
    fact_check: pass
  fr:
    question: À 6 m de profondeur, quelle est la pression absolue ambiante ? Prendre 1 bar de pression
      atmosphérique et une augmentation hydrostatique de 1 bar tous les 10 m.
    explanation: '**1,6 bar absolu.** L’eau ajoute 6/10 = 0,6 bar à la pression atmosphérique : P absolue
      = 1 + 0,6 = 1,6 bar. À la surface, elle vaut déjà 1 bar ; elle augmente à la descente et diminue
      à la remontée.'
    choices:
    - text: 1,6 bar absolu
      correct: true
    - text: 0,6 bar absolu
      correct: false
    - text: 2,6 bars absolus
      correct: false
- id: n2-pression-meme-profondeur-001
  type: mcq
  deck: Physique
