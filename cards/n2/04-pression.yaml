    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.9–10.
    - S3 — CPDA, Notions de physique 2024, p.2–3 (imprimées 4–5).
    - 'Vérification et revue du 2026-10-06 : docs/reviews/04-pression.md'
    - 'Revue approfondie N2 du 2026-10-09 : docs/reviews/PHYSIQUE_N2_2026-10-09.md ; NIST B.9 et NOAA/NWS
      Pressure ; modèle hydrostatique explicite ; résolution algébrique propre ; chaque distracteur analysé
      dans le CSV'
    fact_check: pass
  fr:
    question: On remplace une caisse par une autre deux fois plus lourde, dont la surface d’appui sur
      le sol est trois fois plus grande. Par quel facteur la pression moyenne sur le sol est-elle multipliée
      ?
    explanation: 'Par **2/3**. Avec P = F/S, le nouveau rapport vaut 2F/(3S) = (2/3)P : la pression diminue
      malgré la force plus grande. À force constante, agrandir la surface d’appui diminue la pression
      ; à surface constante, augmenter la force l’augmente.'
    choices:
    - text: × 2/3
      correct: true
    - text: × 3/2
      correct: false
    - text: × 6
      correct: false
