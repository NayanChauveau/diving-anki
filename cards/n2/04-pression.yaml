    - 'N3-S01 — MFT N3 FFESSM, décembre 2025, p.8, 13, 15 ; pertinence N3 revue le 2026-10-06 : docs/reviews/n3/00-reprises-n2.md'
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.9–10.
    - S3 — CPDA, Notions de physique 2024, p.2–3 (imprimées 4–5).
    - 'Vérification et revue du 2026-10-06 : docs/reviews/04-pression.md'
    - 'NOAA — How does pressure change with ocean depth? : https://oceanservice.noaa.gov/facts/pressure.html'
    fact_check: pass
  fr:
    question: À 6 m de profondeur, quelle est la pression absolue ambiante ? Prendre 1 bar de pression atmosphérique
      et une augmentation hydrostatique de 1 bar tous les 10 m.
    explanation: '**1,6 bar absolu.** L’eau ajoute 6/10 = 0,6 bar à la pression atmosphérique : P absolue
      = 1 + 0,6 = 1,6 bar. À la surface, elle vaut déjà 1 bar ; elle augmente à la descente et diminue à
      la remontée.'
    choices:
    - text: 1,6 bar absolu
      correct: true
    - text: 0,6 bar absolu
      correct: false
    - text: 2,6 bars absolus
      correct: false
- id: n2-pression-meme-profondeur-001
  type: mcq
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::04
  - pressions
  status: reviewed
  source_id: P111
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.9–10.
    - S3 — CPDA, Notions de physique 2024, p.2–3 (imprimées 4–5).
    - 'Vérification et revue du 2026-10-06 : docs/reviews/04-pression.md'
    - 'NOAA — How does pressure change with ocean depth? : https://oceanservice.noaa.gov/facts/pressure.html'
    fact_check: pass
  fr:
    question: 'Deux plongeurs sont à 10 m sous la même surface : l’un au-dessus d’un fond de 12 m, l’autre
      au-dessus d’un fond de 40 m. Dans la même eau au repos, de densité uniforme, comment leurs pressions
      ambiantes se comparent-elles ?'
    choices:
    - text: Elles sont égales
      correct: true
    - text: Elle est plus élevée au-dessus du fond de 40 m
      correct: false
    - text: Elle est plus élevée au-dessus du fond de 12 m
      correct: false
    explanation: La pression dépend de la profondeur sous la surface et de la densité de l’eau, pas de
      la quantité d’eau restante sous le plongeur. Les deux plongeurs ont la même hauteur d’eau au-dessus
      d’eux.
