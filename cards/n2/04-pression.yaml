    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.9–10.
    - S3 — CPDA, Notions de physique 2024, p.2–3 (imprimées 4–5).
    - 'Vérification et revue du 2026-10-06 : docs/reviews/04-pression.md'
    - 'NIST — Guide to the SI, Appendix B.9, unités de pression : https://www.nist.gov/pml/special-publication-811/nist-guide-si-appendix-b-conversion-factors/nist-guide-si-appendix-b9'
    fact_check: pass
  fr:
    question: Sur des instruments de plongée ou de météo, que mesurent les graduations bar, psi, hPa et
      mmHg ?
    choices:
    - text: Des pressions dans différentes unités
      correct: true
    - text: Des masses volumiques dans différentes unités
      correct: false
    - text: Des forces dans différentes unités
      correct: false
    explanation: '**La pression**, exprimée dans différentes unités. Le bar est usuel en plongée ; psi signifie
      livre-force par pouce carré. Le pascal (Pa), l’hectopascal (hPa) et le millimètre de mercure (mmHg)
      sont aussi des unités de pression. Une même pression porte des valeurs numériques différentes selon
      l’unité.'
- id: n2-pression-masse-force-001
  type: mcq
  deck: Physique
  levels:
  - N2
