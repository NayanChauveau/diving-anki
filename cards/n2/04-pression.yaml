    - 'N3-S01 — MFT N3 FFESSM, décembre 2025, p.8, 13, 15 ; pertinence N3 revue le 2026-10-06 : docs/reviews/n3/00-reprises-n2.md'
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.9–10.
    - S3 — CPDA, Notions de physique 2024, p.2–3 (imprimées 4–5).
    - 'Vérification et revue du 2026-10-06 : docs/reviews/04-pression.md'
    - 'NOAA — How does pressure change with ocean depth? : https://oceanservice.noaa.gov/facts/pressure.html'
    fact_check: pass
  fr:
    question: Dans une eau au repos, que représente la pression hydrostatique ajoutée à la pression atmosphérique
      ?
    choices:
    - text: La pression due au poids de l’eau au-dessus
      correct: true
    - text: La pression totale de l’eau et de l’atmosphère
      correct: false
    - text: La différence entre pression du bloc et pression ambiante
      correct: false
    explanation: '**La pression due au poids de l’eau située au-dessus du point considéré.** Elle augmente
      avec la profondeur. Dans le modèle simplifié de plongée, elle augmente de 1 bar par 10 m. Cette contribution
      est la pression relative à la surface : elle vaut zéro à la surface, alors que la pression absolue
      y reste égale à la pression atmosphérique.'
