    - S3 — CPDA, Notions de physique 2024, p.2–3 (imprimées 4–5).
    - 'Vérification et revue du 2026-10-06 : docs/reviews/04-pression.md'
    - 'NOAA/NWS — Pressure, poids de l’air, altitude et météo : https://www.weather.gov/source/zhu/ZHU_Training_Page/winds/pressure_winds/Pressure.htm'
    fact_check: pass
  fr:
    question: À conditions météorologiques comparables, la pression atmosphérique réelle à la surface
      d’un lac de montagne est-elle plus faible, égale ou plus forte qu’au niveau de la mer ?
    choices:
    - text: Plus faible
      correct: true
    - text: Plus forte
      correct: false
    - text: Égale
      correct: false
    explanation: La colonne d’air située au-dessus du lac pèse moins à altitude élevée. La valeur simplifiée
      de 1 bar au niveau de la mer ne s’applique donc pas systématiquement à un lac d’altitude.
