  fr:
    question: À quelle profondeur la pression absolue vaut-elle 1,5 bar ? Prendre 1 bar à la surface et
      une augmentation de 1 bar tous les 10 m.
    explanation: '**5 m.** Retirer d’abord la pression atmosphérique : 1,5 − 1 = 0,5 bar dû à l’eau. La
      profondeur vaut ensuite 0,5 × 10 = 5 m. Vérification : 1 + 5/10 = 1,5 bar.'
    choices:
    - text: 5 m
      correct: true
    - text: 15 m
      correct: false
    - text: 0,5 m
      correct: false
