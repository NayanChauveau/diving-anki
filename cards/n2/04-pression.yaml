    fact_check: pass
  fr:
    question: Sous l’eau, un capteur indique 3 bars de pression absolue. Un élève propose d’y ajouter 1
      bar atmosphérique. Quelle pression ambiante faut-il finalement retenir ?
    choices:
    - text: '3 bars : la pression atmosphérique est déjà incluse'
      correct: true
    - text: '4 bars : il faut ajouter la pression atmosphérique'
      correct: false
    - text: '2 bars : il faut retirer la pression atmosphérique'
      correct: false
    explanation: '**Il compte deux fois la pression atmosphérique.** La pression absolue inclut déjà celle
      de l’air et celle due à l’eau : la pression ambiante vaut donc 3 bars. Avec une pression atmosphérique
      de 1 bar, la pression relative à la surface serait de 2 bars.'
- id: n2-pression-boyle-pressions-001
  type: mcq
  deck: Physique
  levels:
  - N2
  - N3
  tags:
  - chapitre::04
  - pressions
  status: reviewed
  source_id: P128
  review:
    sources:
    - 'N3-S01 — MFT N3 FFESSM, décembre 2025, p.8, 13, 15 ; pertinence N3 revue le 2026-10-06 : docs/reviews/n3/00-reprises-n2.md'
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.9–10.
    - S3 — CPDA, Notions de physique 2024, p.2–3 (imprimées 4–5).
    - 'Vérification et revue du 2026-10-06 : docs/reviews/04-pression.md'
    - 'NOAA — Outta Gas, pressions absolues dans Boyle : https://oceanexplorer.noaa.gov/explorations/07philippines/background/edu/media/outtagas.pdf'
    - 'NASA — Equation of State, Boyle et conditions du modèle : https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/equation-of-state/'
    fact_check: pass
  fr:
    question: Pour appliquer P₁V₁ = P₂V₂ à un gaz passant de 10 à 20 m, quelles pressions utiliser ? La
      température et la quantité de gaz restent constantes ; prendre 1 bar à la surface et +1 bar par
      10 m.
    choices:
    - text: P₁ = 2 bars ; P₂ = 3 bars
      correct: true
    - text: P₁ = 1 bar ; P₂ = 2 bars
      correct: false
    - text: P₁ = 3 bars ; P₂ = 4 bars
      correct: false
    explanation: 'La loi de Boyle-Mariotte utilise les pressions absolues : 1 + 10/10 = 2 bars et 1 +
      20/10 = 3 bars. Les valeurs 1 et 2 bars sont les seules contributions de l’eau ; les employer donnerait
      un rapport de compression erroné.'
- id: n2-pression-rapports-001
  type: mcq
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::04
  - pressions
  status: reviewed
  source_id: P129
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.9–10.
    - S3 — CPDA, Notions de physique 2024, p.2–3 (imprimées 4–5).
    - 'Vérification et revue du 2026-10-06 : docs/reviews/04-pression.md'
    - 'NOAA — How does pressure change with ocean depth? : https://oceanservice.noaa.gov/facts/pressure.html'
    fact_check: pass
  fr:
    question: Dans le modèle de 1 bar à la surface et +1 bar par 10 m, par quels facteurs la pression
      absolue est-elle multipliée lors des descentes 0 → 10 m, puis 10 → 20 m ?
    choices:
    - text: ×2, puis ×1,5
      correct: true
    - text: ×2, puis ×2
      correct: false
    - text: ×1,5, puis ×2
      correct: false
    - text: ×2, puis ×3
      correct: false
    explanation: 'Les pressions passent de 1 à 2 bars, puis de 2 à 3 bars : les rapports sont 2/1 = 2
      et 3/2 = 1,5. Chaque trajet ajoute le même 1 bar, mais la hausse proportionnelle est plus grande
      près de la surface. C’est le rapport qui diffère, pas l’augmentation en bars.'
