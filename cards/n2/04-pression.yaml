  fr:
    question: À quelle profondeur la pression absolue vaut-elle 1,5 bar ? Prendre 1 bar à la surface et
      une augmentation de 1 bar tous les 10 m.
    explanation: '**5 m.** Retirer d’abord la pression atmosphérique : 1,5 − 1 = 0,5 bar dû à l’eau. La
      profondeur vaut ensuite 0,5 × 10 = 5 m. Vérification : 1 + 5/10 = 1,5 bar.'
    choices:
    - text: 5 m
      correct: true
    - text: 15 m
      correct: false
    - text: 0,5 m
      correct: false
- id: n2-pression-profondeur-relative-001
  type: mcq
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::04
  - pressions
  status: reviewed
  source_id: P126
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.9–10.
    - S3 — CPDA, Notions de physique 2024, p.2–3 (imprimées 4–5).
    - 'Vérification et revue du 2026-10-06 : docs/reviews/04-pression.md'
    - 'NOAA — How does pressure change with ocean depth? : https://oceanservice.noaa.gov/facts/pressure.html'
    fact_check: pass
  fr:
    question: Un capteur mesure 2 bars de pression relative à la surface, c’est-à-dire 2 bars ajoutés
      par l’eau. Quelle profondeur cela représente-t-il dans le modèle de 1 bar tous les 10 m ?
    choices:
    - text: 20 m
      correct: true
    - text: 10 m
      correct: false
    - text: 30 m
      correct: false
    explanation: 'La mesure est déjà relative à la surface : profondeur = 2 × 10 = 20 m. Il ne faut pas
      retirer 1 bar atmosphérique à cette valeur. Avec 1 bar à la surface, la pression absolue serait
      de 3 bars.'
- id: n2-pression-double-atmosphere-001
  type: mcq
