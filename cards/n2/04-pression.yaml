    question: À 3 m, quelle pression est ajoutée par l’eau seule ? Utiliser le modèle de 1 bar tous les
      10 m.
    explanation: '**0,3 bar de pression hydrostatique.** Le calcul est 3/10 = 0,3 bar. On n’ajoute pas la
      pression atmosphérique ici, puisque la question porte sur la contribution de l’eau seule.'
    choices:
    - text: 0,3 bar
      correct: true
    - text: 1,3 bar
      correct: false
    - text: 3 bars
      correct: false
