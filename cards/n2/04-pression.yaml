    fact_check: pass
  fr:
    question: Dans une atmosphère en équilibre, quelle grandeur détermine sa pression totale à la surface
      de la Terre ?
    choices:
    - text: Le poids de la colonne d’air au-dessus du point considéré
      correct: true
    - text: La pression liée au déplacement horizontal de l’air
      correct: false
    - text: La pression partielle de la vapeur d’eau présente dans l’air
      correct: false
    explanation: 'La colonne d’air pèse sur la surface : son poids par unité de surface explique la pression
      atmosphérique en équilibre. Le vent correspond à un mouvement et la vapeur d’eau n’est qu’un constituant
      de l’air. Dans les exercices au niveau de la mer, 1 bar est une valeur simplifiée, pas une mesure
      constante.'
