      Pressure ; modèle hydrostatique explicite ; résolution algébrique propre ; chaque distracteur analysé
      dans le CSV'
    fact_check: pass
  fr:
    question: Sur des instruments de plongée ou de météo, que mesurent les graduations bar, psi, hPa et
      mmHg ?
    choices:
    - text: Des pressions dans différentes unités
      correct: true
    - text: Des masses volumiques dans différentes unités
      correct: false
    - text: Des forces dans différentes unités
      correct: false
    explanation: '**La pression**, exprimée dans différentes unités. Le bar est usuel en plongée ; psi
      signifie livre-force par pouce carré. Le pascal (Pa), l’hectopascal (hPa) et le millimètre de mercure
      (mmHg) sont aussi des unités de pression. Une même pression porte des valeurs numériques différentes
      selon l’unité.'
