    - 'Vérification et revue du 2026-10-06 : docs/reviews/04-pression.md'
    - 'NOAA — How does pressure change with ocean depth? : https://oceanservice.noaa.gov/facts/pressure.html'
    - 'Revue pédagogique du 2026-10-09 : docs/reviews/QUALITE_GLOBALE_2026-10-09.md ; objectif et identité
      conservés'
    - 'Revue approfondie N2 du 2026-10-09 : docs/reviews/PHYSIQUE_N2_2026-10-09.md ; NIST B.9 et NOAA/NWS
      Pressure ; modèle hydrostatique explicite ; résolution algébrique propre ; chaque distracteur analysé
      dans le CSV'
    fact_check: pass
  fr:
    question: Dans une eau au repos, que représente la pression hydrostatique ajoutée à la pression atmosphérique
      ?
    choices:
    - text: La pression due au poids de l’eau au-dessus
      correct: true
    - text: La pression totale de l’eau et de l’atmosphère
      correct: false
    - text: La pression atmosphérique transmise par la surface
      correct: false
    explanation: '**La pression due au poids de l’eau située au-dessus du point considéré.** Elle augmente
      avec la profondeur. Dans le modèle simplifié de plongée, elle augmente de 1 bar par 10 m. Cette
      contribution est la pression relative à la surface : elle vaut zéro à la surface, alors que la pression
      absolue y reste égale à la pression atmosphérique.'
