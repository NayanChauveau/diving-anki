    - 'Vérification et revue du 2026-10-06 : docs/reviews/04-pression.md'
    - 'NIST — Guide to the SI, Appendix B.9, unités de pression : https://www.nist.gov/pml/special-publication-811/nist-guide-si-appendix-b-conversion-factors/nist-guide-si-appendix-b9'
    - 'Revue approfondie N2 du 2026-10-09 : docs/reviews/PHYSIQUE_N2_2026-10-09.md ; NIST B.9 et NOAA/NWS
      Pressure ; modèle hydrostatique explicite ; résolution algébrique propre ; chaque distracteur analysé
      dans le CSV'
    fact_check: pass
  fr:
    question: Dans la phrase « une masse de 1 kg exerce son poids sur une surface de 1 cm² », quelles
      sont respectivement les unités SI de la masse, du poids et de la pression ?
    choices:
    - text: kg ; N ; Pa
      correct: true
    - text: kg ; kg ; Pa
      correct: false
    - text: N ; kg ; Pa
      correct: false
    - text: kg ; Pa ; N
      correct: false
    explanation: 'Le kilogramme mesure une masse, le newton une force (dont le poids) et le pascal une
      pression. Le raccourci « 1 kg/cm² = 1 bar » mélange masse et force : même 1 kgf/cm² vaut environ
      0,981 bar, pas exactement 1 bar.'
