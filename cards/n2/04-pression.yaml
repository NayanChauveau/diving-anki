    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.9–10.
    - S3 — CPDA, Notions de physique 2024, p.2–3 (imprimées 4–5).
    - 'Vérification et revue du 2026-10-06 : docs/reviews/04-pression.md'
    - 'NOAA/NWS — Pressure, poids de l’air, altitude et météo : https://www.weather.gov/source/zhu/ZHU_Training_Page/winds/pressure_winds/Pressure.htm'
    fact_check: pass
  fr:
    question: Au même endroit et à la même altitude, le passage d’un système dépressionnaire à un système
      anticyclonique fait-il varier la pression atmosphérique ? Dans quel sens ?
    choices:
    - text: Oui, elle augmente
      correct: true
    - text: Oui, elle diminue
      correct: false
    - text: Non, elle reste constante à altitude identique
      correct: false
    explanation: '**Oui, elle augmente** : une dépression correspond à des basses pressions, un anticyclone
      à des hautes pressions. La pression atmosphérique réelle varie avec la météo ; 1 bar est une simplification
      de calcul, pas une valeur constamment mesurée.'
- id: n2-pression-hydrostatique-001
  type: mcq
  anki_model: basic
  deck: Physique
  levels:
  - N2
  - N3
  tags:
