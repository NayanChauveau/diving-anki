- id: n2-pression-force-surface-001
  type: mcq
  anki_model: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::04
  - pressions
  status: reviewed
  source_id: P096
  review:
    sources:
    - 'Conversion QCM et revue des choix du 2026-10-06 : docs/reviews/QCM_GLOBALE.md'
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.9–10.
    - S3 — CPDA, Notions de physique 2024, p.2–3 (imprimées 4–5).
    - 'Vérification et revue du 2026-10-06 : docs/reviews/04-pression.md'
    - 'NIST — Guide to the SI, Appendix B.9, unités de pression : https://www.nist.gov/pml/special-publication-811/nist-guide-si-appendix-b-conversion-factors/nist-guide-si-appendix-b9'
    fact_check: pass
  fr:
    question: Une force perpendiculaire F est répartie uniformément sur une surface S. Quelle relation donne
      la pression moyenne P ?
    choices:
    - text: P = F / S
      correct: true
    - text: P = F × S
      correct: false
    - text: P = S / F
      correct: false
    explanation: '**P = F / S**, avec F en newtons (N), S en mètres carrés (m²) et P en pascals (Pa). Une
      pression mesure une force par unité de surface : 1 Pa = 1 N/m².'
- id: n2-pression-variation-force-surface-001
  type: mcq
  anki_model: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::04
  - pressions
  status: reviewed
  source_id: P097
  review:
    sources:
    - 'Revue finale des formats, clarté et distracteurs du 2026-10-06 : docs/reviews/QCM_REVUE_FINALE.md'
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.9–10.
    - S3 — CPDA, Notions de physique 2024, p.2–3 (imprimées 4–5).
    - 'Vérification et revue du 2026-10-06 : docs/reviews/04-pression.md'
    fact_check: pass
  fr:
    question: On remplace une caisse par une autre deux fois plus lourde, dont la surface d’appui sur le
      sol est trois fois plus grande. Par quel facteur la pression moyenne sur le sol est-elle multipliée
      ?
    explanation: 'Par **2/3**. Avec P = F/S, le nouveau rapport vaut 2F/(3S) = (2/3)P : la pression diminue
      malgré la force plus grande. À force constante, agrandir la surface d’appui diminue la pression ;
      à surface constante, augmenter la force l’augmente.'
    choices:
    - text: × 2/3
      correct: true
    - text: × 3/2
      correct: false
    - text: × 6
      correct: false
