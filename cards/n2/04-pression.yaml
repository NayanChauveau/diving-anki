      Pressure ; modèle hydrostatique explicite ; résolution algébrique propre ; chaque distracteur analysé
      dans le CSV'
    fact_check: pass
  fr:
    question: 'Deux plongeurs sont à 10 m sous la même surface : l’un au-dessus d’un fond de 12 m, l’autre
      au-dessus d’un fond de 40 m. Dans la même eau au repos, de densité uniforme, comment leurs pressions
      ambiantes se comparent-elles ?'
    choices:
    - text: Elles sont égales
      correct: true
    - text: Elle est plus élevée au-dessus du fond de 40 m
      correct: false
    - text: Elle est plus élevée au-dessus du fond de 12 m
      correct: false
    explanation: La pression dépend de la profondeur sous la surface et de la densité de l’eau, pas de
      la quantité d’eau restante sous le plongeur. Les deux plongeurs ont la même hauteur d’eau au-dessus
      d’eux.
