    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.9–10.
    - S3 — CPDA, Notions de physique 2024, p.2–3 (imprimées 4–5).
    - 'Vérification et revue du 2026-10-06 : docs/reviews/04-pression.md'
    - 'NOAA/NWS — Pressure, poids de l’air, altitude et météo : https://www.weather.gov/source/zhu/ZHU_Training_Page/winds/pressure_winds/Pressure.htm'
    fact_check: pass
  fr:
    question: Pourquoi subit-on une pression atmosphérique à la surface, même lorsqu’il n’y a pas de vent
      ?
    choices:
    - text: Le poids de la colonne d’air située au-dessus
      correct: true
    - text: La vitesse de déplacement des masses d’air
      correct: false
    - text: La vapeur d’eau présente dans l’air uniquement
      correct: false
    explanation: '**Le poids de la colonne d’air au-dessus de nous exerce une pression.** Elle existe même
      dans l’air immobile ; le vent n’en est pas la cause. Dans les exercices de plongée au niveau de la
      mer, on prend souvent 1 bar comme valeur simplifiée.'
- id: n2-pression-altitude-001
  type: mcq
  deck: Physique
  levels:
  - N2
  - N3
  tags:
  - chapitre::04
  - pressions
  status: reviewed
  source_id: P105
