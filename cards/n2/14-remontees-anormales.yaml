    question: Pendant une plongée normale à l’air avec ordinateur, quel arrêt interrompu à 3 m relève
      de la procédure fédérale de palier de décompression manqué ?
    choices:
    - text: L’arrêt de décompression indiqué après dépassement du temps sans palier
      correct: true
    - text: L’arrêt de confort ajouté à un profil resté dans le temps sans palier
      correct: false
    - text: L’arrêt de stabilisation choisi pour déployer le parachute avant la sortie
      correct: false
    explanation: Le dépassement du temps sans palier peut entraîner une obligation de décompression. Un
      arrêt ajouté pour le confort ou une manipulation ne possède pas ce statut. La profondeur de 3 m
      ne suffit pas à définir l’obligation ; identifier l’indication exacte et le manuel, notamment après
      anomalie.
