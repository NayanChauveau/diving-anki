      fédérales de 2024 demandent-elles de ne pas dépasser vers la surface, dans la mesure du possible
      ?
    choices:
    - text: 6 m
      correct: true
    - text: 3 m
      correct: false
    - text: 9 m
      correct: false
    explanation: '**Ne pas remonter au-dessus de 6 m lors de ces remontées répétées.** Préparer les exercices
      avec l’encadrant pour limiter les variations de pression près de la surface ; ce repère n’autorise
      pas un nombre illimité de répétitions.'
