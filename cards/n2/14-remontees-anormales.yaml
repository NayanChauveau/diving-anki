    fact_check: pass
  fr:
    question: En plongée à l’air avec ordinateur, quels critères définissent la remontée trop rapide dans
      les préconisations fédérales de 2024 ?
    choices:
    - text: Plus de 15 m/min entre 30 m et la surface, sur au moins 10 m
      correct: true
    - text: Plus de 10 m/min entre 30 m et la surface, sur au moins 10 m
      correct: false
    - text: Plus de 15 m/min entre 30 m et la surface, sur au moins 3 m
      correct: false
    explanation: '**Plus de 15 m/min entre la zone de 30 m et la surface, sur une distance d’au moins
      10 m.** C’est le critère de cette procédure de rattrapage ; une alarme de l’ordinateur peut apparaître
      à une vitesse plus faible.'
