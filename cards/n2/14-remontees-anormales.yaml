    - 'Revue du 2026-10-06 : docs/reviews/14-remontees-anormales.md'
    fact_check: pass
  fr:
    front: Après une remontée trop rapide répondant aux critères fédéraux de 2024, à l’air avec ordinateur,
      quel rattrapage prévoit le texte si le plongeur n’a aucun signe d’accident et que la réimmersion
      est réalisable avec assistance et gaz suffisants pour rejoindre la mi-profondeur en moins de 3 min
      ?
    back: '**Rejoindre au moins la mi-profondeur et y rester 5 min**, puis réaliser au minimum 1 min à
      6 m et 5 min à 3 m, en plus des obligations du moyen de désaturation. Une victime présentant des
      signes d’accident relève des secours, sans réimmersion thérapeutique.'
