      ; RIFAP mai 2026 p.29,32 ; vérifié 2026-10-06
    fact_check: pass
  fr:
    question: Après une remontée trop rapide répondant aux critères fédéraux de 2024, à l’air avec ordinateur,
      quel rattrapage prévoit le texte si le plongeur n’a aucun signe d’accident et que la réimmersion
      est réalisable avec assistance et gaz suffisants pour rejoindre la mi-profondeur en moins de 3 min
      ?
    explanation: '**Rejoindre au moins la mi-profondeur et y rester 5 min**, puis réaliser au minimum
      1 min à 6 m et 5 min à 3 m, en plus des obligations du moyen de désaturation. Une victime présentant
      des signes d’accident relève des secours, sans réimmersion thérapeutique.'
    choices:
    - text: Au moins mi-profondeur 5 min, puis au moins 1 min à 6 m et 5 min à 3 m
      correct: true
    - text: Mi-profondeur 12 min, puis les paliers recalculés par une table
      correct: false
    - text: Au moins mi-profondeur 5 min, puis au moins 5 min à 6 m et 1 min à 3 m
      correct: false
