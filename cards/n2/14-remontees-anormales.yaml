      ; RIFAP mai 2026 p.29,32 ; vérifié 2026-10-06
    fact_check: pass
  fr:
    question: En mer, jusqu’à 3 min de palier obligatoire ont été manquées à l’air avec ordinateur. Sans
      signe d’accident et sans réimmersion possible, quel suivi associe le texte de 2024 et l’avis médical
      demandé par le RIFAP 2026 ?
    choices:
    - text: Avis médical via le CROSS, observation 3 h et pas de nouvelle plongée pendant 24 h
      correct: true
    - text: Observation 3 h et pas de nouvelle plongée pendant 24 h ; avis médical seulement si un signe
        apparaît
      correct: false
    - text: Avis médical via le CROSS, observation 1 h et pas de nouvelle plongée pendant 12 h
      correct: false
    explanation: 'Le texte fédéral de 2024 prévoit 3 h d’observation et aucune nouvelle plongée pendant
      24 h lorsque la durée de palier manquée ne dépasse pas 3 min et qu’aucun signe d’accident n’est
      présent. Le RIFAP de mai 2026 demande aussi un avis médical pour tout incident de plongée : en mer,
      appeler le CROSS pour joindre le médecin du SCMM (SAMU de coordination médicale maritime). L’absence
      de symptôme ne dispense donc pas de cet appel ; poursuivre la surveillance et suivre les consignes
      médicales. Au-delà de 3 min manquées ou en présence de signes, déclencher les secours directement.'
