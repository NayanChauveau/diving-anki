    fact_check: pass
  fr:
    front: Quel profil appelle-t-on « multi-yoyos » lors d’exercices de remontée assistée ?
    back: '**Plusieurs cycles de remontée puis redescente au cours de la plongée.** La répétition multiplie
      les variations de pression et doit être prise en compte dans l’organisation et la décompression.'
