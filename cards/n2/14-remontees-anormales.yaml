  fr:
    question: Après 2 min de palier obligatoire manquées, un plongeur présente faiblesse et fourmillements.
      Gaz et équipier permettraient une réimmersion rapide. Quelle branche de prise en charge s’applique
      ?
    choices:
    - text: Secours, oxygène adapté et surveillance en surface
      correct: true
    - text: Reprise du palier en moins de 3 min et ajout de 3 min à 3 m
      correct: false
    - text: Rattrapage de 5 min à mi-profondeur, puis arrêts à 6 et 3 m
      correct: false
    explanation: Des signes d’accident imposent les secours en surface, avec oxygène adapté au bilan et
      surveillance. La possibilité technique de redescendre et une courte durée de palier manquée ne rendent
      pas applicable la branche prévue pour un plongeur sans signe. Ne pas réimmerger une victime pour
      finir ses paliers.
