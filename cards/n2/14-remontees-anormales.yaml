    question: Pour des exercices comportant plusieurs remontées, quelle limite de proximité de la surface
      les préconisations fédérales de 2024 demandent-elles de respecter dans la mesure du possible ?
    choices:
    - text: Rester à 6 m ou plus profond autant que possible
      correct: true
    - text: Rester à 3 m ou plus profond autant que possible
      correct: false
    - text: Remonter en surface à chaque exercice autant que possible
      correct: false
    explanation: '**Ne pas remonter au-dessus de 6 m lors de ces remontées répétées.** Préparer les exercices
      avec l’encadrant pour limiter les variations de pression près de la surface ; ce repère n’autorise
      pas un nombre illimité de répétitions.'
