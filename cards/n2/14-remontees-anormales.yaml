  fr:
    front: Un palier obligatoire est interrompu lors d’une plongée à l’air avec ordinateur. Le plongeur
      est sans signe d’accident ; le gaz et l’assistance permettent de regagner le palier en moins de
      3 min. Quelle reprise prévoit la recommandation fédérale de 2024 ?
    back: '**Redescendre dans ce délai, poursuivre le palier et ajouter 3 min à 3 m.** Continuer à respecter
      les autres obligations ; le texte ne demande pas de refaire systématiquement tous les paliers depuis
      le début.'
