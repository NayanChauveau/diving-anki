  fr:
    question: Pendant une même immersion d’exercices, la palanquée suit 20 m → 6 m → 20 m → 6 m → 20 m
      avant sa sortie finale. Comment classe-t-on ces variations de profondeur ?
    choices:
    - text: Un profil multi-yoyos
      correct: true
    - text: Une série de plongées successives
      correct: false
    - text: Une série de plongées consécutives
      correct: false
    explanation: 'Les cycles de remontée puis redescente ont lieu dans la même immersion : c’est un profil
      multi-yoyos. Successives et consécutives classent des plongées distinctes séparées par un intervalle
      en surface. Les répétitions se préparent avec l’encadrant, en limitant les variations proches de
      la surface.'
