    - 'Revue pédagogique du 2026-10-09 : docs/reviews/QUALITE_GLOBALE_2026-10-09.md ; objectif et identité
      conservés'
    fact_check: pass
  fr:
    question: Une plongée à l’air est conduite à l’ordinateur. Quel rapport existe entre les rattrapages
      fédéraux de 2024 et les anciennes procédures MN90 ?
    choices:
    - text: Les rattrapages de 2024 sont distincts des anciennes procédures MN90
      correct: true
    - text: Les rattrapages de 2024 reprennent les procédures MN90 avec de nouveaux intitulés
      correct: false
    - text: Les rattrapages restent ceux des MN90 ; le texte de 2024 modifie seulement l’alerte
      correct: false
    explanation: La recommandation fédérale de 2024 vise les plongées à l’air conduites à l’ordinateur
      et prévoit ses propres rattrapages. Les anciennes procédures de tables MN90 ne s’y substituent pas.
