    fact_check: pass
  fr:
    front: Après un palier obligatoire manqué, le plongeur présente une faiblesse ou des fourmillements.
      Faut-il le réimmerger pour finir ses paliers ?
    back: '**Non : déclencher les secours et la prise en charge en surface**, dont oxygène adapté à son
      état et surveillance. Les signes d’accident excluent une réimmersion de rattrapage ; le temps de
      palier manqué ne justifie pas d’attendre.'
