    fact_check: pass
  fr:
    question: Pourquoi distinguer les anciennes procédures MN90 et les préconisations fédérales de remontée
      anormale à l’air avec ordinateur adoptées en 2024 ?
    choices:
    - text: Les rattrapages à l’ordinateur du texte 2024 diffèrent des anciennes recettes MN90
      correct: true
    - text: Les rattrapages du texte 2024 reprennent les recettes MN90 en changeant seulement leur nom
      correct: false
    - text: Le texte 2024 change l’alerte, mais laisse les rattrapages MN90 comme procédure à l’ordinateur
      correct: false
    explanation: '**Elles ne donnent pas les mêmes rattrapages.** La recommandation fédérale de 2024 vise
      les plongées à l’air conduites à l’ordinateur ; une recette ancienne de table ne la remplace pas.'
