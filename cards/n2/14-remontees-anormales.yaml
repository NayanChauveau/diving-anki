  fr:
    front: Après une remontée trop rapide répondant aux critères fédéraux de 2024, à l’air avec ordinateur,
      que prévoit le texte lorsque la réimmersion est impossible ?
    back: '**Oxygène en surface et évacuation organisée avec les secours.** L’absence de symptôme immédiat
      n’autorise pas à remplacer ce rattrapage impossible par une simple attente.'
