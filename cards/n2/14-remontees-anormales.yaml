    - 'Revue du 2026-10-06 : docs/reviews/14-remontees-anormales.md'
    fact_check: pass
  fr:
    front: En plongée à l’air avec ordinateur, quels critères définissent la remontée trop rapide dans
      les préconisations fédérales de 2024 ?
    back: '**Plus de 15 m/min entre la zone de 30 m et la surface, sur une distance d’au moins 10 m.**
      C’est le critère de cette procédure de rattrapage ; une alarme de l’ordinateur peut apparaître à
      une vitesse plus faible.'
- id: n2-remontees-anormales-rattrapage-001
  type: basic
  deck: Désaturation
  levels:
