  fr:
    question: Après une remontée trop rapide répondant aux critères fédéraux de 2024, à l’air avec ordinateur,
      le plongeur est sans signe d’accident. Le gaz et l’assistance permettent la réimmersion dans le
      délai requis. Quelle séquence minimale de rattrapage s’applique, en conservant toute obligation
      de l’ordinateur plus importante ?
    explanation: Rejoindre au moins la mi-profondeur en moins de 3 min et y rester 5 min, puis faire au
      minimum 1 min à 6 m et 5 min à 3 m. Conserver les obligations plus importantes de l’ordinateur.
      Les 12 min à mi-profondeur appartiennent à l’ancienne procédure MN90 ; des signes d’accident imposent
      les secours en surface, sans réimmersion thérapeutique.
    choices:
    - text: 5 min au moins à mi-profondeur ou plus profond, puis 1 min à 6 m et 5 min à 3 m
      correct: true
    - text: 12 min à mi-profondeur, puis paliers recalculés avec les tables MN90
      correct: false
    - text: 5 min au moins à mi-profondeur ou plus profond, puis 5 min à 6 m et 1 min à 3 m
      correct: false
