    fact_check: pass
  fr:
    front: En plongée à l’air avec ordinateur, un maximum de 3 min de palier obligatoire n’a pas été fait.
      Sans signe d’accident et avec réimmersion impossible, quel suivi prévoit la recommandation fédérale
      de 2024 ?
    back: '**Observation pendant 3 h et aucune nouvelle plongée pendant 24 h.** Au moindre signe évoquant
      un accident, déclencher les secours ; au-delà de 3 min de palier manqué, les déclencher directement.
      Ces 3 min mesurent la durée de palier non réalisée, pas le temps écoulé depuis la sortie de l’eau.'
