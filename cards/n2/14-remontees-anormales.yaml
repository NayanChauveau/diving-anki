  fr:
    front: Pourquoi un palier de décompression obligatoire manqué et un simple palier de confort interrompu
      ne déclenchent-ils pas automatiquement la même procédure ?
    back: '**La procédure fédérale d’interruption vise un palier obligatoire de décompression.** Un arrêt
      recommandé peut avoir une autre fonction ; identifier l’indication exacte et le manuel, notamment
      les arrêts rendus obligatoires par certains ordinateurs après une anomalie.'
