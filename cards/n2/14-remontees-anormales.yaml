- id: n2-remontees-anormales-references-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::14
  - remontees-anormales
  status: reviewed
  source_id: P454
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.26–27.
    - 'FFESSM — Préconisations en plongée à l’air avec ordinateur, newsletter novembre 2024 p.1–2, consulté
      le 2026-10-06 : https://ffessm.fr/uploads/media/docs/0001/12/1e862af90f137e0c9bf98859c31092e14b8a3c5e.pdf'
    - 'FFESSM Corse — Remontées anormales, décision CDN du 13 octobre 2024 : https://www.ffessm-corse.com/remontees-anormales'
    - 'FFESSM CMPN — CAT accident de plongée bouteille ou recycleur, consulté le 2026-10-06 : https://medical.ffessm.fr/cat-accident-de-plongee-bouteille-ou-recycleur'
    - 'FFESSM CMPN — PEC accident, consulté le 2026-10-06 : https://medical.ffessm.fr/pec-d-un-accident-de-plongee-bouteille-ou-recycleur'
    - 'Revue du 2026-10-06 : docs/reviews/14-remontees-anormales.md'
    fact_check: pass
  fr:
    front: Pourquoi distinguer les anciennes procédures MN90 et les préconisations fédérales de remontée
      anormale à l’air avec ordinateur adoptées en 2024 ?
    back: '**Elles ne donnent pas les mêmes rattrapages.** La recommandation fédérale de 2024 vise les
      plongées à l’air conduites à l’ordinateur ; une recette ancienne de table ne la remplace pas.'
