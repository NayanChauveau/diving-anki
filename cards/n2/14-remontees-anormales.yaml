  fr:
    question: Après une remontée trop rapide répondant aux critères fédéraux de 2024, à l’air avec ordinateur,
      la réimmersion est impossible. Quel dispositif prévu par ce texte faut-il engager avec l’avis médical
      ?
    choices:
    - text: Oxygène en surface et évacuation coordonnée avec les secours
      correct: true
    - text: Oxygène en surface, observation de 3 h et arrêt des plongées pendant 24 h
      correct: false
    - text: Oxygène en surface pendant 30 min, puis surveillance par les équipiers
      correct: false
    explanation: 'Pour cette remontée trop rapide avec réimmersion impossible, le texte prévoit oxygène
      et évacuation. La branche observation de 3 h et absence de nouvelle plongée pendant 24 h concerne
      un autre incident : jusqu’à 3 min de palier manquées, sans signe d’accident et sans réimmersion
      possible. Ne pas échanger ces deux branches.'
