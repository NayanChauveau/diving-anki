  fr:
    question: Après une remontée trop rapide répondant aux critères fédéraux de 2024, à l’air avec ordinateur,
      que prévoit le texte lorsque la réimmersion est impossible ?
    choices:
    - text: Oxygène en surface et évacuation coordonnée avec les secours
      correct: true
    - text: Observation seule pendant 3 h, sans autre mesure si aucun signe
      correct: false
    - text: Nouvelle tentative de réimmersion après 5 min de repos
      correct: false
    explanation: '**Oxygène en surface et évacuation organisée avec les secours.** L’absence de symptôme
      immédiat n’autorise pas à remplacer ce rattrapage impossible par une simple attente.'
