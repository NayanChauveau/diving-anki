    question: Quel profil appelle-t-on « multi-yoyos » lors d’exercices de remontée assistée ?
    choices:
    - text: Des cycles répétés de remontée puis redescente
      correct: true
    - text: Des plongées successives séparées d’un court intervalle en surface
      correct: false
    - text: Une remontée continue interrompue par plusieurs paliers
      correct: false
    explanation: '**Plusieurs cycles de remontée puis redescente au cours de la plongée.** La répétition
      multiplie les variations de pression et doit être prise en compte dans l’organisation et la décompression.'
