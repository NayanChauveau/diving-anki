  fr:
    question: Pourquoi un palier de décompression obligatoire manqué et un simple palier de confort interrompu
      ne déclenchent-ils pas automatiquement la même procédure ?
    choices:
    - text: La procédure vise une obligation de décompression, pas un simple arrêt facultatif
      correct: true
    - text: La procédure vise toute interruption d’un arrêt prévu, même sans obligation de décompression
      correct: false
    - text: La procédure vise seulement les arrêts profonds, car les arrêts à 3 m relèvent du confort
      correct: false
    explanation: '**La procédure fédérale d’interruption vise un palier obligatoire de décompression.**
      Un arrêt recommandé peut avoir une autre fonction ; identifier l’indication exacte et le manuel, notamment
      les arrêts rendus obligatoires par certains ordinateurs après une anomalie.'
