  review:
    sources:
    - 'Revue finale des formats, clarté et distracteurs du 2026-10-06 : docs/reviews/QCM_REVUE_FINALE.md'
    - 'Conversion QCM et revue des choix du 2026-10-06 : docs/reviews/QCM_GLOBALE.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs 2025 Rev Q, p.6–9 et 20 : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/18-lecture-pannes.md'
    - 'Revue approfondie N2 du 2026-10-09 : docs/reviews/MATERIEL_PREPARATION_N2_2026-10-09.md ; contrôle
      factuel : SCUBAPRO RevQ juillet 2025, p.6–10 (principes), 13–18 (usage/soins), 20 (dépannage) ;
      références de la carte ; choix relus individuellement'
    fact_check: pass
  fr:
    question: De l’eau arrive à l’inspiration dans un second étage. Quel ensemble de défauts peut expliquer
      cette entrée d’eau dans sa chambre ?
    choices:
    - text: Embout, membrane ou soupape d’expiration défectueux
      correct: true
    - text: Joint du raccord au bloc ou siège haute pression défectueux
      correct: false
    - text: Joint du manomètre ou raccord de son flexible défectueux
      correct: false
    explanation: 'L’embout, la membrane et la soupape d’expiration bordent la chambre du second étage
      : un défaut peut y laisser pénétrer l’eau. Un défaut des raccords haute pression se manifeste ailleurs
      dans le circuit. Ce symptôme ne désigne pas une seule pièce ; le matériel doit être contrôlé.'
- id: n2-lecture-pannes-chambre-humide-001
  type: mcq
