  - lecture-pannes
  status: reviewed
  source_id: P573
  review:
    sources:
    - 'Revue finale des formats, clarté et distracteurs du 2026-10-06 : docs/reviews/QCM_REVUE_FINALE.md'
    - 'Conversion QCM et revue des choix du 2026-10-06 : docs/reviews/QCM_GLOBALE.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs 2025 Rev Q, p.6–9 et 20 : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/18-lecture-pannes.md'
    fact_check: pass
  fr:
    question: De l’eau entre dans la bouche à l’inspiration sur un second étage. Quelle interprétation est
      justifiée avant contrôle du matériel ?
    choices:
    - text: Plusieurs défauts d’étanchéité du second étage sont possibles, pas seulement la purge
      correct: true
    - text: L’arrivée d’eau suffit à désigner la purge comme unique pièce défectueuse
      correct: false
    - text: L’arrivée d’eau suffit à désigner la compensation du premier étage comme défectueuse
      correct: false
    explanation: '**Un embout endommagé, la soupape d’expiration ou la membrane peuvent laisser entrer de
      l’eau.** Le manuel cite aussi une saleté ou un mauvais fonctionnement de la soupape. Faire vérifier
      le matériel ; ce symptôme ne permet pas de choisir une seule réparation.'
