    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - S1 p.31 et tableau p.34, conception avec chambre humide ouverte.
    - 'SCUBAPRO — Manuel détendeurs 2025 Rev Q, p.6–9 et 20 : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/18-lecture-pannes.md'
    fact_check: pass
  fr:
    question: Dans un modèle de premier étage à piston dont la chambre humide est ouverte à l’eau, des bulles
      d’air sortent durablement par ses orifices. Que suggère ce passage de gaz ?
    choices:
    - text: Une fuite de gaz vers la chambre humide est possible et doit être contrôlée
      correct: true
    - text: La chambre humide évacue normalement une partie du gaz respiratoire à chaque inspiration
      correct: false
    - text: Le passage de bulles durables est une purge normale de la chambre humide après immersion
      correct: false
    explanation: '**Une perte d’étanchéité entre le circuit de gaz et la chambre humide.** Un joint peut
      être en cause ; le modèle et l’observation doivent être contrôlés par un technicien. Une chambre humide
      laisse entrer l’eau, mais n’est pas un échappement normal de l’air respiratoire.'
