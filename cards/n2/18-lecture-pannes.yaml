  fr:
    question: De l’eau arrive à l’inspiration dans un second étage. Quel ensemble de défauts peut expliquer
      cette entrée d’eau dans sa chambre ?
    choices:
    - text: Embout, membrane ou soupape d’expiration défectueux
      correct: true
    - text: Joint du raccord au bloc ou siège haute pression défectueux
      correct: false
    - text: Joint du manomètre ou raccord de son flexible défectueux
      correct: false
    explanation: 'L’embout, la membrane et la soupape d’expiration bordent la chambre du second étage
      : un défaut peut y laisser pénétrer l’eau. Un défaut des raccords haute pression se manifeste ailleurs
      dans le circuit. Ce symptôme ne désigne pas une seule pièce ; le matériel doit être contrôlé.'
