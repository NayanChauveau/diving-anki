    - 'Revue du 2026-10-06 : docs/reviews/18-lecture-pannes.md'
    fact_check: pass
  fr:
    question: Un flexible présente une fissure ou un renflement visible. Pourquoi ne faut-il pas l’utiliser
      jusqu’à l’apparition d’une fuite importante ?
    choices:
    - text: Il peut se rompre ou perdre rapidement le gaz
      correct: true
    - text: Le flexible fissuré ne risque qu’une hausse de pression intermédiaire
      correct: false
    - text: L’absence de fuite actuelle confirme sa tenue mécanique
      correct: false
    explanation: '**Il peut perdre rapidement le gaz ou se rompre.** Retirer le matériel du service et faire
      remplacer le flexible par une pièce compatible ; ruban ou serrage ne rétablissent pas sa tenue sous
      pression.'
