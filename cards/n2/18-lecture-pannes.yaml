    - 'Conversion QCM et revue des choix du 2026-10-06 : docs/reviews/QCM_GLOBALE.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - S1 p.31 et tableau p.34, conception avec chambre humide ouverte.
    - 'SCUBAPRO — Manuel détendeurs 2025 Rev Q, p.6–9 et 20 : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/18-lecture-pannes.md'
    - 'Revue approfondie N2 du 2026-10-09 : docs/reviews/MATERIEL_PREPARATION_N2_2026-10-09.md ; contrôle
      factuel : SCUBAPRO RevQ juillet 2025, p.6–10 (principes), 13–18 (usage/soins), 20 (dépannage) ;
      références de la carte ; choix relus individuellement'
    fact_check: pass
  fr:
    question: Sur un premier étage à piston avec chambre humide ouverte à l’eau, des bulles sortent durablement
      des orifices de cette chambre. Entre quelles zones une perte d’étanchéité est-elle alors suspectée
      ?
    choices:
    - text: Le circuit de gaz et la chambre humide
      correct: true
    - text: La chambre humide et l’eau environnante
      correct: false
    - text: Le flexible haute pression et le manomètre
      correct: false
    explanation: La chambre humide communique normalement avec l’eau pour transmettre la pression ambiante.
      Elle ne sert pas à évacuer le gaz respiratoire. Des bulles durables à cet endroit suggèrent une
      fuite depuis le circuit de gaz ; un contrôle du modèle par un technicien est nécessaire.
