    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs 2025 Rev Q, p.6–9 et 20 : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/18-lecture-pannes.md'
    fact_check: pass
  fr:
    front: Un flexible présente une fissure ou un renflement visible. Pourquoi ne faut-il pas l’utiliser
      jusqu’à l’apparition d’une fuite importante ?
    back: '**Il peut perdre rapidement le gaz ou se rompre.** Retirer le matériel du service et faire
      remplacer le flexible par une pièce compatible ; ruban ou serrage ne rétablissent pas sa tenue sous
      pression.'
