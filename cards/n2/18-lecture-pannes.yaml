      factuel : SCUBAPRO RevQ juillet 2025, p.6–10 (principes), 13–18 (usage/soins), 20 (dépannage) ;
      références de la carte ; choix relus individuellement'
    fact_check: pass
  fr:
    question: Un flexible de détendeur présente un renflement sans fuite visible. Pourquoi son étanchéité
      actuelle ne permet-elle pas de le garder en service ?
    choices:
    - text: Elle ne prouve pas l’intégrité de sa structure résistante
      correct: true
    - text: Elle prouve sa résistance mais pas le réglage de moyenne pression
      correct: false
    - text: Elle prouve sa résistance mais pas l’étanchéité du second étage
      correct: false
    explanation: Un flexible peut rester étanche tout en présentant une détérioration mécanique. La notice
      SCUBAPRO demande son remplacement avant utilisation lorsqu’il présente notamment un gonflement,
      une fissure ou une coupure. L’absence de fuite ne démontre pas sa tenue sous pression.
