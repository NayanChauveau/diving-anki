    question: Avant une plongée profonde, un médicament provoque somnolence ou ralentissement. Que doit
      prendre en compte l’avis médical sur la compatibilité avec la plongée ?
    choices:
    - text: Le traitement, la maladie traitée et les contraintes de la plongée prévue
      correct: true
    - text: Le traitement et ses effets en surface, indépendamment de la maladie traitée
      correct: false
    - text: La maladie traitée et son évolution, indépendamment des effets du traitement
      correct: false
    explanation: L’évaluation porte sur le médicament, la maladie qui motive sa prise et les conditions
      de plongée. Une somnolence ou un ralentissement peut s’ajouter aux difficultés de la profondeur.
      Demander un avis médical avant de plonger ; un essai à faible profondeur ou un changement d’horaire
      ne valide pas cette compatibilité.
