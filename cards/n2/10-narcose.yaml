    - 'BSAC — Safe diving guide, Gas, consulté le 2026-10-06 : https://www.bsac.com/safety/safe-diving-guide/gas/'
    - 'FFESSM CMPN — Je prends des médicaments, consulté le 2026-10-06 : https://medical.ffessm.fr/je-prends-des-medicaments'
    - 'Revue du 2026-10-06 : docs/reviews/10-narcose.md'
    fact_check: pass
  fr:
    front: Un médicament qui provoque somnolence ou ralentissement peut-il être considéré sans conséquence
      pour une plongée profonde ?
    back: '**Ses effets et sa compatibilité avec la plongée doivent être évalués médicalement.** La somnolence
      et le ralentissement peuvent altérer le jugement déjà sollicité en profondeur. Demander un avis
      au médecin de plongée avant de plonger avec ce traitement.'
