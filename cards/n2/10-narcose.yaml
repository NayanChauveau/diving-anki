    fact_check: pass
  fr:
    front: Un mélange idéal contient 21 % d’oxygène. Quelle est sa pression partielle d’oxygène à une
      pression totale de 3 bars absolus ?
    back: '**0,63 bar.** PpO₂ = 0,21 × 3 = 0,63 bar. Il faut employer 21 % fourni, sans l’arrondir à 20
      %.'
