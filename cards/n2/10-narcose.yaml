    fact_check: pass
  fr:
    question: Après plusieurs plongées à 30 m sans narcose ressentie, quelle valeur donner à cette expérience
      pour la prochaine plongée ?
    choices:
    - text: Elle décrit des plongées passées sans garantir les mêmes performances dans d’autres conditions
      correct: true
    - text: Elle fixe une profondeur personnelle de 30 m jusqu’à laquelle les performances restent préservées
      correct: false
    - text: Elle valide une acclimatation à 30 m permettant de conserver les performances dans d’autres
        conditions
      correct: false
    explanation: L’absence d’effet ressenti ne prouve pas l’absence d’altération, ni une immunité future.
      Les circonstances, l’état du jour et la sensibilité individuelle comptent. La familiarité avec les
      tâches peut améliorer leur exécution sans supprimer l’effet narcotique des gaz.
