    fact_check: pass
  fr:
    front: En profondeur, un équipier répond inhabituellement lentement aux signes et répète une manipulation
      inutile. Pourquoi faut-il intervenir plutôt que l’attendre passivement ?
    back: '**Son jugement ou sa coordination peuvent être altérés, notamment par la narcose.** Prévenir,
      rester au contact et organiser une remontée contrôlée vers moins profond. D’autres causes restent
      possibles ; ne pas lui laisser seul la gestion de la situation.'
