  fr:
    question: Un plongeur n’a jamais ressenti de narcose à 30 m. Peut-il considérer cette profondeur comme
      un seuil garanti sans effet pour ses prochaines plongées ?
    choices:
    - text: 'Non : sensibilité et circonstances varient'
      correct: true
    - text: 'Oui : une première plongée sans effet établit un seuil personnel'
      correct: false
    - text: 'Oui : l’entraînement supprime la narcose à cette profondeur'
      correct: false
    explanation: '**Non.** Les effets et leur perception varient entre personnes et selon les circonstances.
      La profondeur augmente le risque, mais aucun chiffre unique ne sépare pour tous les plongeurs absence
      et présence de narcose.'
