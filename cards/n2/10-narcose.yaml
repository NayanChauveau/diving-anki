      1 bar à la surface et +1 bar par 10 m.
    explanation: '**4 bars.** Pression totale = 5 bars absolus ; PpN₂ = 0,80 × 5 = 4 bars.'
    choices:
    - text: 4 bars
      correct: true
    - text: 3,2 bars
      correct: false
    - text: 5 bars
      correct: false
