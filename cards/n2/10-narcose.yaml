    - text: Réviser aussi la profondeur et les tâches, en tenant compte des capacités du jour
      correct: true
    - text: Les intégrer au budget de gaz, en conservant la profondeur et les tâches validées lors d’une
        plongée reposée
      correct: false
    - text: Les intégrer à l’intervalle de surface, en conservant la profondeur et les tâches validées
        lors d’une plongée reposée
      correct: false
    explanation: L’état du jour peut réduire les capacités de vigilance, de coordination et de gestion
      de l’effort. Il faut en tenir compte dans le choix de profondeur et des tâches, pas seulement dans
      le budget de gaz ou l’intervalle de surface. Une plongée bien vécue au même profil dans d’autres
      conditions ne garantit pas les mêmes capacités aujourd’hui.
