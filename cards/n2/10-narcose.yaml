  fr:
    question: Pourquoi une confusion ou une faiblesse persistante après la sortie de l’eau ne doit-elle
      pas être simplement attribuée à une narcose vécue au fond ?
    choices:
    - text: La narcose diminue normalement quand la pression baisse ; des signes persistants exigent une
        évaluation
      correct: true
    - text: La narcose disparaît seulement après élimination du gaz dissous ; attendre cette désaturation
        suffit
      correct: false
    - text: La narcose ressentie au fond explique les signes en surface ; les paliers respectés excluent
        une autre urgence
      correct: false
    explanation: '**Les effets de narcose diminuent normalement avec la réduction de pression.** Des signes
      persistants en surface peuvent relever d’un accident de plongée ou d’une autre urgence : déclencher
      une évaluation urgente.'
