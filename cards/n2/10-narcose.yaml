    - 'DAN — Back to Basics, narcose, consulté le 2026-10-06 : https://dan.org/alert-diver/article/back-to-basics/'
    - 'BSAC — Safe diving guide, Gas, consulté le 2026-10-06 : https://www.bsac.com/safety/safe-diving-guide/gas/'
    - 'Revue du 2026-10-06 : docs/reviews/10-narcose.md'
    fact_check: pass
  fr:
    front: Pourquoi la narcose à l’air s’accentue-t-elle généralement avec la profondeur ?
    back: '**L’augmentation de la pression partielle des gaz narcotiques, notamment l’azote, perturbe
      le fonctionnement du système nerveux.** Attention, jugement et coordination peuvent être altérés
      pendant l’immersion ; ce mécanisme diffère d’un accident de désaturation.'
