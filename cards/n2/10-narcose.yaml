    fact_check: pass
  fr:
    front: Un plongeur n’a jamais ressenti de narcose à 30 m. Peut-il considérer cette profondeur comme
      un seuil garanti sans effet pour ses prochaines plongées ?
    back: '**Non.** Les effets et leur perception varient entre personnes et selon les circonstances.
      La profondeur augmente le risque, mais aucun chiffre unique ne sépare pour tous les plongeurs absence
      et présence de narcose.'
- id: n2-narcose-capacites-001
  type: basic
  deck: Prévention des accidents
  levels:
