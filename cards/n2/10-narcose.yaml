    fact_check: pass
  fr:
    front: Pourquoi une confusion ou une faiblesse persistante après la sortie de l’eau ne doit-elle pas
      être simplement attribuée à une narcose vécue au fond ?
    back: '**Les effets de narcose diminuent normalement avec la réduction de pression.** Des signes persistants
      en surface peuvent relever d’un accident de plongée ou d’une autre urgence : déclencher une évaluation
      urgente.'
