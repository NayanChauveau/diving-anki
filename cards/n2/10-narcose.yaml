  fr:
    question: Un plongeur prend un médicament provoquant somnolence ou ralentissement. Quelle démarche permet
      d’évaluer sa compatibilité avec une plongée profonde ?
    choices:
    - text: Un avis médical tenant compte du traitement et de la plongée prévue
      correct: true
    - text: Un essai à faible profondeur qui suffit à valider la plongée profonde
      correct: false
    - text: Un changement d’horaire de prise qui suffit à valider la plongée profonde
      correct: false
    explanation: '**Ses effets et sa compatibilité avec la plongée doivent être évalués médicalement.**
      La somnolence et le ralentissement peuvent altérer le jugement déjà sollicité en profondeur. Demander
      un avis au médecin de plongée avant de plonger avec ce traitement.'
