  fr:
    question: Une confusion ou une faiblesse persiste après la sortie d’une plongée où une narcose était
      suspectée. Quelle interprétation doit guider l’alerte ?
    choices:
    - text: Une urgence différente reste possible et nécessite une évaluation immédiate
      correct: true
    - text: Une narcose se prolonge jusqu’à élimination de l’azote dissous et nécessite cette attente
      correct: false
    - text: Une narcose vécue au fond explique les signes en surface si les paliers ont été respectés
      correct: false
    explanation: 'Les effets de la narcose diminuent généralement lorsque la pression baisse. Des signes
      persistants en surface ne doivent pas lui être attribués sans évaluation : un accident de plongée
      ou une autre urgence reste possible, même si les paliers ont été respectés. Déclencher les secours.'