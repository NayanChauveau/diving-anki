    fact_check: pass
  fr:
    front: Lorsqu’une narcose est suspectée en immersion, quel changement de profondeur aide généralement
      à réduire ses effets ?
    back: '**Remonter vers une profondeur moindre, avec l’équipier et de façon contrôlée.** La pression
      partielle des gaz diminue. Ne pas poursuivre la descente ni viser un nombre de mètres censé garantir
      la disparition ; terminer la plongée si la situation compromet sa maîtrise.'
- id: n2-narcose-equipier-001
  type: basic
  deck: Prévention des accidents
  levels:
  - N2
  tags:
