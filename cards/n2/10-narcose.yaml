    fact_check: pass
  fr:
    front: À composition d’air inchangée, pourquoi la pression partielle d’azote augmente-t-elle à la
      descente ?
    back: '**La fraction d’azote reste la même, mais la pression totale augmente.** Leur produit augmente
      donc : un pourcentage constant ne signifie pas une pression partielle constante.'
- id: n2-narcose-effets-001
  type: basic
  deck: Prévention des accidents
  levels:
  - N2
  tags:
  - chapitre::10
  - narcose
  status: reviewed
  source_id: P308
  review:
    sources:
