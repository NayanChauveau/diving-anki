cards:
- id: n2-narcose-air-001
  type: basic
  deck: Prévention des accidents
  levels:
  - N2
  tags:
  - chapitre::10
  - narcose
  status: reviewed
  source_id: P299
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.18–19.
    - https://www.noaa.gov/jetstream/atmosphere
    - 'Revue du 2026-10-06 : docs/reviews/10-narcose.md'
    fact_check: pass
  fr:
    front: Pourquoi le modèle « air = 80 % d’azote et 20 % d’oxygène » n’est-il pas sa composition exacte
      ?
    back: '**C’est un arrondi de calcul.** L’air sec contient environ 78 % d’azote, 21 % d’oxygène et
      environ 1 % d’autres gaz, surtout l’argon. Pour les exercices, employer les fractions annoncées
      dans l’énoncé.'
- id: n2-narcose-dalton-001
  type: basic
  deck: Prévention des accidents
  levels:
  - N2
  tags:
  - chapitre::10
  - narcose
  status: reviewed
  source_id: P302
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.18–19.
    - 'UCalgary — The Pressure of a Mixture of Gases: Dalton’s Law, consulté le 2026-10-06 : https://chem-textbook.ucalgary.ca/chapter-9-main/the-pressure-of-a-mixture-of-gases-daltons-law/'
    - 'Revue du 2026-10-06 : docs/reviews/10-narcose.md'
    fact_check: pass
  fr:
    front: Dans un mélange gazeux idéal, comment calcule-t-on la pression partielle d’un gaz ?
    back: '**Fraction du gaz × pression absolue totale.** Par exemple, 20 % vaut 0,20, pas 20. La somme
      des pressions partielles de tous les composants égale la pression totale.'
- id: n2-narcose-oxygene-trente-001
  type: basic
  deck: Prévention des accidents
  levels:
  - N2
  tags:
  - chapitre::10
  - narcose
  - exercice::calcul
  status: reviewed
  source_id: P304
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.18–19.
    - 'DAN — Back to Basics, narcose, consulté le 2026-10-06 : https://dan.org/alert-diver/article/back-to-basics/'
    - 'BSAC — Safe diving guide, Gas, consulté le 2026-10-06 : https://www.bsac.com/safety/safe-diving-guide/gas/'
    - 'Revue du 2026-10-06 : docs/reviews/10-narcose.md'
    fact_check: pass
  fr:
    front: Dans le modèle d’air à 20 % d’oxygène, quelle est la pression partielle d’O₂ à 30 m ? Prendre
      1 bar à la surface et +1 bar par 10 m.
    back: '**0,8 bar.** Pression totale = 4 bars absolus ; PpO₂ = 0,20 × 4 = 0,8 bar. Cette pression partielle
      est distincte de la pression totale respirée.'
