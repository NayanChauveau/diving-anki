  fr:
    question: Pourquoi fatigue, anxiété et manque de pratique récente doivent-ils inciter à choisir une
      plongée moins exigeante ?
    choices:
    - text: L’état du jour peut réduire les capacités de gestion en profondeur
      correct: true
    - text: L’expérience antérieure compense automatiquement la fatigue
      correct: false
    - text: Le manque de pratique réduit la sensibilité aux gaz narcotiques
      correct: false
    explanation: '**Ils réduisent les capacités de gestion et peuvent accentuer les difficultés liées à
      la profondeur.** Ils peuvent s’ajouter à la narcose et aux contraintes respiratoires ; l’expérience
      passée ne supprime pas l’état du jour.'
