  fr:
    question: Un mélange idéal contient 21 % d’oxygène. Quelle est sa pression partielle d’oxygène à une
      pression totale de 3 bars absolus ?
    explanation: '**0,63 bar.** PpO₂ = 0,21 × 3 = 0,63 bar. Il faut employer 21 % fourni, sans l’arrondir
      à 20 %.'
    choices:
    - text: 0,63 bar
      correct: true
    - text: 0,60 bar
      correct: false
    - text: 0,42 bar
      correct: false
