    - 'Revue du 2026-10-06 : docs/reviews/10-narcose.md'
    fact_check: pass
  fr:
    question: Dans un mélange gazeux idéal, comment calcule-t-on la pression partielle d’un gaz ?
    choices:
    - text: Fraction du gaz × pression absolue totale
      correct: true
    - text: Fraction du gaz × pression hydrostatique seule
      correct: false
    - text: Pression absolue totale divisée par la fraction du gaz
      correct: false
    explanation: '**Fraction du gaz × pression absolue totale.** Par exemple, 20 % vaut 0,20, pas 20. La
      somme des pressions partielles de tous les composants égale la pression totale.'
