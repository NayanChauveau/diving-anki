      ; identité et objectif conservés'
    fact_check: pass
  fr:
    question: Un plongeur descend à l’air sans changer de mélange. Comment évoluent la fraction d’azote
      et sa pression partielle ?
    choices:
    - text: La fraction reste constante et la pression partielle augmente
      correct: true
    - text: La fraction augmente et la pression partielle reste constante
      correct: false
    - text: La fraction reste constante et la pression partielle reste constante
      correct: false
    explanation: La fraction décrit la proportion d’azote dans le mélange ; elle ne change pas avec la
      compression de l’air. La pression partielle est cette fraction multipliée par la pression absolue
      totale, qui augmente à la descente.
