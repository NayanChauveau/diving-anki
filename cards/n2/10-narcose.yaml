    fact_check: pass
  fr:
    front: Pourquoi une euphorie inhabituelle en profondeur peut-elle être aussi inquiétante qu’une angoisse
      ?
    back: '**La narcose peut donner une impression trompeuse d’aisance tout en altérant le jugement, l’attention
      et la mémoire.** Le plaisir ressenti ne démontre pas que les décisions et gestes restent fiables.'
