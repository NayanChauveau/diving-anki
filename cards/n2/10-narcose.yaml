  fr:
    question: Pourquoi la narcose à l’air s’accentue-t-elle généralement avec la profondeur ?
    choices:
    - text: L’effet des gaz narcotiques est lié à leur pression partielle accrue
      correct: true
    - text: L’effet dépend de leur fraction dans l’air, qui augmente à la descente
      correct: false
    - text: L’effet dépend surtout du gaz dissous accumulé, même après retour à 1 bar
      correct: false
    explanation: '**L’augmentation de la pression partielle des gaz narcotiques, notamment l’azote, perturbe
      le fonctionnement du système nerveux.** Attention, jugement et coordination peuvent être altérés pendant
      l’immersion ; ce mécanisme diffère d’un accident de désaturation.'
