    question: En profondeur, un équipier répond lentement et répète une manipulation inutile ; une narcose
      est suspectée. Quelle intervention réduit l’exposition narcotique tout en l’aidant à garder la maîtrise
      de la plongée ?
    choices:
    - text: Prendre l’initiative d’une remontée assistée et contrôlée vers moins profond
      correct: true
    - text: Le stabiliser au même niveau et prendre en charge les manipulations pour alléger ses tâches
      correct: false
    - text: Le stabiliser au même niveau et réduire ses efforts pour faciliter sa ventilation
      correct: false
    explanation: Un comportement inhabituel peut traduire une altération du jugement ou de la coordination,
      notamment par la narcose. L’équipier valide prend l’initiative, reste au contact et organise une
      remontée contrôlée vers moins profond. D’autres causes sont possibles ; le plongeur atteint ne doit
      pas gérer seul la situation.
