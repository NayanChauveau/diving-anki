  fr:
    question: Lorsqu’une narcose est suspectée en immersion, quel changement de profondeur aide généralement
      à réduire ses effets ?
    choices:
    - text: Remonter ensemble vers moins profond de façon contrôlée
      correct: true
    - text: Rester à la même profondeur jusqu’à accoutumance
      correct: false
    - text: Descendre ensemble jusqu’à stabilisation des sensations
      correct: false
    explanation: '**Remonter vers une profondeur moindre, avec l’équipier et de façon contrôlée.** La pression
      partielle des gaz diminue. Ne pas poursuivre la descente ni viser un nombre de mètres censé garantir
      la disparition ; terminer la plongée si la situation compromet sa maîtrise.'
