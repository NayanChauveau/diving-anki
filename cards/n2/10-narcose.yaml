  fr:
    question: Pourquoi une euphorie inhabituelle en profondeur peut-elle être aussi inquiétante qu’une angoisse
      ?
    choices:
    - text: L’euphorie peut coexister avec une altération du jugement et de l’attention
      correct: true
    - text: L’euphorie améliore le jugement alors que l’angoisse le dégrade
      correct: false
    - text: L’euphorie épargne la mémoire alors que l’angoisse la dégrade
      correct: false
    explanation: '**La narcose peut donner une impression trompeuse d’aisance tout en altérant le jugement,
      l’attention et la mémoire.** Le plaisir ressenti ne démontre pas que les décisions et gestes restent
      fiables.'
