    - 'Revue du 2026-10-06 : docs/reviews/10-narcose.md'
    fact_check: pass
  fr:
    front: Pourquoi fatigue, anxiété et manque de pratique récente doivent-ils inciter à choisir une plongée
      moins exigeante ?
    back: '**Ils réduisent les capacités de gestion et peuvent accentuer les difficultés liées à la profondeur.**
      Ils peuvent s’ajouter à la narcose et aux contraintes respiratoires ; l’expérience passée ne supprime
      pas l’état du jour.'
- id: n2-narcose-medicaments-001
  type: basic
  deck: Prévention des accidents
  levels:
