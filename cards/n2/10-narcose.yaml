      conservés'
    - 'Vérifié le 2026-10-09 — DAN — Back to Basics, Dalton’s Law et effets de pression partielle : https://dan.org/alert-diver/article/back-to-basics/'
    - 'Vérifié le 2026-10-09 — BSAC — Safe diving guide, Nitrogen : https://www.bsac.com/safety/safe-diving-guide/gas/'
    - 'Vérifié le 2026-10-09 — FFESSM CMPN — Je prends des médicaments, page du 2021-03-07 : https://medical.ffessm.fr/je-prends-des-medicaments'
    - 'Revue approfondie des QCM N2 du 2026-10-09 : docs/reviews/PREVENTION_ACCIDENTS_N2_2026-10-09.md
      ; identité et objectif conservés'
    fact_check: pass
  fr:
    question: Quelle composition de l’air sec, arrondie au pour cent le plus proche pour chaque composant,
      est correcte ?
    choices:
    - text: L’air sec est proche de 78 % N₂, 21 % O₂ et 1 % d’autres gaz
      correct: true
    - text: L’air sec est proche de 80 % N₂ et 20 % O₂ sans autres gaz
      correct: false
    - text: L’air sec est proche de 75 % N₂, 24 % O₂ et 1 % d’autres gaz
      correct: false
    explanation: 'L’air sec contient environ 78 % d’azote, 21 % d’oxygène et 1 % d’autres gaz, surtout
      l’argon. Le modèle 80 % / 20 % est un arrondi utilisé dans certains exercices : employer les fractions
      annoncées dans l’énoncé.'
