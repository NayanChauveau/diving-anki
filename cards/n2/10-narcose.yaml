  fr:
    question: En profondeur, un équipier répond lentement aux signes et répète une manipulation inutile.
      Quelle conduite adopter face à cette altération inhabituelle ?
    choices:
    - text: Assister l’équipier et organiser une remontée vers moins profond
      correct: true
    - text: Attendre qu’il termine la manipulation avant de réagir
      correct: false
    - text: Laisser l’équipier remonter seul pour simplifier ses tâches
      correct: false
    explanation: '**Son jugement ou sa coordination peuvent être altérés, notamment par la narcose.** Prévenir,
      rester au contact et organiser une remontée contrôlée vers moins profond. D’autres causes restent
      possibles ; ne pas lui laisser seul la gestion de la situation.'
