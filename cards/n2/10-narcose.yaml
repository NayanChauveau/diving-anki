    fact_check: pass
  fr:
    question: Quel mécanisme distingue la narcose à l’air d’un accident de désaturation ?
    choices:
    - text: L’action des gaz narcotiques sous pression partielle élevée sur le système nerveux
      correct: true
    - text: L’action de bulles issues du gaz dissous sur le système nerveux pendant la décompression
      correct: false
    - text: L’action de gaz pulmonaire passé dans les artères sur le système nerveux à la remontée
      correct: false
    explanation: La narcose correspond à l’effet des gaz narcotiques sous pression élevée sur le système
      nerveux. Elle altère notamment attention, jugement et coordination. Les bulles provenant du gaz
      dissous relèvent de la désaturation ; du gaz passant des poumons vers les artères peut provoquer
      une embolie gazeuse artérielle.
