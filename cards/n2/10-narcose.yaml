    question: Quel effet d’une remontée contrôlée vers moins profond explique généralement la diminution
      d’une narcose à l’air ?
    choices:
    - text: La réduction de la pression partielle des gaz narcotiques respirés
      correct: true
    - text: L’élimination complète de l’azote dissous pendant les premiers mètres
      correct: false
    explanation: La pression absolue baisse et, à composition inchangée, les pressions partielles baissent
      avec elle. Les effets narcotiques diminuent généralement sans attendre l’élimination complète du
      gaz dissous. Remonter avec l’équipier de façon contrôlée ; si la maîtrise de la plongée est compromise,
      y mettre fin.
