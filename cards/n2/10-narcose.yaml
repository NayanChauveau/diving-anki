  fr:
    question: Dans le modèle d’air à 20 % d’oxygène, quelle est la pression partielle d’O₂ à 30 m ? Prendre
      1 bar à la surface et +1 bar par 10 m.
    explanation: '**0,8 bar.** Pression totale = 4 bars absolus ; PpO₂ = 0,20 × 4 = 0,8 bar. Cette pression
      partielle est distincte de la pression totale respirée.'
    choices:
    - text: 0,8 bar
      correct: true
    - text: 0,6 bar
      correct: false
    - text: 4 bars
      correct: false
