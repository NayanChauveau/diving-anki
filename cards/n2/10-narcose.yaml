  fr:
    question: À composition d’air inchangée, pourquoi la pression partielle d’azote augmente-t-elle à la
      descente ?
    choices:
    - text: La pression totale augmente alors que la fraction reste constante
      correct: true
    - text: La fraction d’azote augmente alors que la pression totale reste constante
      correct: false
    - text: La pression partielle suit la profondeur sans la pression atmosphérique
      correct: false
    explanation: '**La fraction d’azote reste la même, mais la pression totale augmente.** Leur produit
      augmente donc : un pourcentage constant ne signifie pas une pression partielle constante.'
