      juillet 2026 p. 294–297 ; MFT N3 décembre 2025 p. 11 ; DAN Know the Risks (https://world.dan.org/alert-diver/article/know-the-risks/)
      et Distraction, Discomfort, and Disorientation (https://dan.org/safety-prevention/diver-safety/divers-blog/distraction-discomfort-and-disorientation/),
      consultés le 11 octobre 2026 ; loi de Dalton, recalcul 0,21×3=0,63 bar.
    fact_check: pass
  fr:
    question: Dans un mélange gazeux idéal, comment calcule-t-on la pression partielle d’un gaz ?
    choices:
    - text: Fraction du gaz × pression absolue totale
      correct: true
    - text: Fraction du gaz × pression hydrostatique seule
      correct: false
    - text: Pression absolue totale divisée par la fraction du gaz
      correct: false
    explanation: '**Fraction du gaz × pression absolue totale.** Par exemple, 20 % vaut 0,20, pas 20.
      La somme des pressions partielles de tous les composants égale la pression totale.'
