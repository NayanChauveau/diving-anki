  fr:
    front: Dans le modèle d’air à 80 % d’azote, quelle est la pression partielle d’azote à 40 m ? Prendre
      1 bar à la surface et +1 bar par 10 m.
    back: '**4 bars.** Pression totale = 5 bars absolus ; PpN₂ = 0,80 × 5 = 4 bars.'
- id: n2-narcose-partielle-vingt-001
  type: basic
  deck: Prévention des accidents
