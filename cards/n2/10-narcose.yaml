  fr:
    question: En profondeur, un plongeur se sent euphorique et très sûr de ses décisions. Quel lien entre
      ce ressenti et ses performances est correct ?
    choices:
    - text: Le sentiment d’aisance peut coexister avec une attention et un jugement dégradés
      correct: true
    - text: Le sentiment d’aisance indique un jugement préservé malgré une coordination dégradée
      correct: false
    - text: Le sentiment d’aisance indique une attention préservée malgré une mémoire dégradée
      correct: false
    explanation: La narcose peut procurer une impression agréable ou une confiance excessive sans préserver
      les performances. Attention, jugement, mémoire et coordination peuvent être altérés. La façon dont
      le plongeur se sent ne suffit pas à juger la fiabilité de ses décisions.
