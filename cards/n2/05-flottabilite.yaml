  fr:
    question: Un caisson étanche de masse 1,5 kg et de volume extérieur 3 L est entièrement immergé en
      eau douce. Quelle masse de lest faut-il ajouter pour rendre l’ensemble neutre ? Prendre 1 kg par
      litre d’eau et négliger le volume du lest ajouté.
    explanation: '**1,5 kg de lest.** Le caisson déplace 3 kg d’eau ; la masse totale doit donc atteindre
      3 kg. Il manque 3 − 1,5 = 1,5 kg. Le volume du lest est négligé uniquement dans ce modèle de calcul.'
    choices:
    - text: 1,5 kg
      correct: true
    - text: 3 kg
      correct: false
    - text: 4,5 kg
      correct: false
