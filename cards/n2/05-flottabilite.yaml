    - S3 — CPDA, Notions de physique 2024, p.4–6 (imprimées 6–8).
    - 'OpenStax, University Physics 1, 14.4 — Archimedes’ Principle and Buoyancy : https://openstax.org/books/university-physics-volume-1/pages/14-4-archimedes-principle-and-buoyancy'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    fact_check: pass
  fr:
    front: Un objet de 8 kg et de volume extérieur 5 L est entièrement immergé en eau douce. Quel volume
      supplémentaire doit déplacer un flotteur fixé à l’objet pour rendre l’ensemble neutre ? Prendre
      1 kg par litre d’eau ; négliger la masse du flotteur et du gaz qu’il contient.
    back: '**3 L supplémentaires à la profondeur considérée.** L’ensemble doit déplacer 8 L d’eau pour
      équilibrer 8 kg. L’objet en déplace déjà 5 L : il manque 8 − 5 = 3 L. Avec g = 10 N/kg, ces 3 L
      procurent les 30 N de poussée manquants.'
- id: n2-flottabilite-lest-caisson-001
  type: basic
  deck: Physique
  levels:
