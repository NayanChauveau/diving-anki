    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    fact_check: pass
  fr:
    front: Un objet a une masse de 3 kg et un volume extérieur de 3 L. Quel est son poids apparent ? Objet
      entièrement immergé en eau douce ; prendre 1 kg par litre d’eau et g = 10 N/kg. Le poids apparent
      est défini par poids réel moins poussée d’Archimède.
    back: '**0 N : flottabilité neutre.** Son poids vaut 3 × 10 = 30 N et la poussée vaut aussi 30 N.
      Les deux forces se compensent ; elles ne disparaissent pas.'
- id: n2-flottabilite-volume-portance-001
  type: basic
  deck: Physique
  levels:
