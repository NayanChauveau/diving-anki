cards:
- id: n2-flottabilite-poids-reel-apparent-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::05
  - flottabilite
  status: reviewed
  source_id: P133
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.8–9.
    - S3 — CPDA, Notions de physique 2024, p.4–6 (imprimées 6–8).
    - 'OpenStax, University Physics 1, 14.4 — Archimedes’ Principle and Buoyancy : https://openstax.org/books/university-physics-volume-1/pages/14-4-archimedes-principle-and-buoyancy'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    fact_check: pass
  fr:
    front: Un bloc fermé paraît moins lourd lorsqu’on le tient immobile sous l’eau. Sa masse et son poids
      réel ont-ils diminué ?
    back: '**Non.** Sa masse reste la même, ainsi que son poids réel à gravité identique. L’eau exerce
      une poussée vers le haut qui compense une partie du poids : la force nécessaire pour soutenir le
      bloc, son poids apparent, est plus faible.'
- id: n2-flottabilite-archimede-001
  type: mcq
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::05
  - flottabilite
  status: reviewed
  source_id: P134
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.8–9.
    - S3 — CPDA, Notions de physique 2024, p.4–6 (imprimées 6–8).
    - 'OpenStax, University Physics 1, 14.4 — Archimedes’ Principle and Buoyancy : https://openstax.org/books/university-physics-volume-1/pages/14-4-archimedes-principle-and-buoyancy'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    fact_check: pass
  fr:
    question: Un objet entièrement immergé dans une eau au repos déplace 4 L d’eau. De quoi dépend la
      valeur de la poussée d’Archimède qu’il reçoit ?
    choices:
    - text: Du poids des 4 L d’eau déplacée
      correct: true
    - text: Du poids de l’objet immergé
      correct: false
    - text: Du poids de l’eau située au-dessus de l’objet
      correct: false
    explanation: La poussée est verticale, dirigée vers le haut et égale au poids du fluide déplacé. Pour
      un objet entièrement immergé, on utilise son volume extérieur, pas seulement celui du matériau dont
      il est fait.
- id: n2-flottabilite-relation-poids-apparent-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::05
  - flottabilite
  status: reviewed
  source_id: P136
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.8–9.
    - S3 — CPDA, Notions de physique 2024, p.4–6 (imprimées 6–8).
    - 'OpenStax, University Physics 1, 14.4 — Archimedes’ Principle and Buoyancy : https://openstax.org/books/university-physics-volume-1/pages/14-4-archimedes-principle-and-buoyancy'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    fact_check: pass
  fr:
    front: En prenant le sens vers le bas comme positif, quelle relation donne le poids apparent d’un
      objet immergé à partir de son poids réel et de la poussée d’Archimède ?
    back: '**Poids apparent = poids réel − poussée d’Archimède.** Les trois termes sont des forces, exprimées
      en newtons (N). Le poids vaut m × g ; la poussée vaut masse de l’eau déplacée × g. Le kilogramme
      (kg) exprime une masse, pas une force. Ici, g est l’intensité de la pesanteur, exprimée en N/kg.'
- id: n2-flottabilite-signe-001
  type: mcq
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::05
  - flottabilite
  status: reviewed
  source_id: P138
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.8–9.
    - S3 — CPDA, Notions de physique 2024, p.4–6 (imprimées 6–8).
    - 'OpenStax, University Physics 1, 14.4 — Archimedes’ Principle and Buoyancy : https://openstax.org/books/university-physics-volume-1/pages/14-4-archimedes-principle-and-buoyancy'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    fact_check: pass
  fr:
    question: Un objet entièrement immergé est initialement immobile et libre de bouger. Son poids apparent,
      défini par poids réel moins poussée d’Archimède, vaut −10 N. Quelle est sa tendance initiale dans
      une eau au repos ?
    choices:
    - text: 'Il commence à remonter : sa flottabilité est positive'
      correct: true
    - text: 'Il commence à couler : sa flottabilité est négative'
      correct: false
    - text: 'Il reste à cette profondeur : sa flottabilité est neutre'
      correct: false
    explanation: Le signe négatif signifie que la poussée vers le haut dépasse le poids. Un poids apparent
      positif donne une tendance à couler ; nul, un équilibre entre les deux forces. Le signe du poids
      apparent est donc opposé à celui de la flottabilité.
- id: n2-flottabilite-calcul-cinq-kg-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::05
  - flottabilite
  - exercice::calcul
  status: reviewed
  source_id: P142
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.8–9.
    - S3 — CPDA, Notions de physique 2024, p.4–6 (imprimées 6–8).
    - 'OpenStax, University Physics 1, 14.4 — Archimedes’ Principle and Buoyancy : https://openstax.org/books/university-physics-volume-1/pages/14-4-archimedes-principle-and-buoyancy'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    fact_check: pass
  fr:
    front: Un objet a une masse de 5 kg et un volume extérieur de 3 L. Quel est son poids apparent ? Objet
      entièrement immergé en eau douce ; prendre 1 kg par litre d’eau et g = 10 N/kg. Le poids apparent
      est défini par poids réel moins poussée d’Archimède.
    back: '**+20 N**, soit une tendance à couler. Poids réel : 5 × 10 = 50 N. Poussée : 3 × 10 = 30 N.
      Poids apparent : 50 − 30 = 20 N.'
