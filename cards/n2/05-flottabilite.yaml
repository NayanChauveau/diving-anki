  fr:
    question: Un objet de 8 kg et de volume extérieur 5 L est entièrement immergé en eau douce. Quel volume
      supplémentaire doit déplacer un flotteur fixé à l’objet pour rendre l’ensemble neutre ? Prendre
      1 kg par litre d’eau ; négliger la masse du flotteur et du gaz qu’il contient.
    explanation: '**3 L supplémentaires à la profondeur considérée.** L’ensemble doit déplacer 8 L d’eau
      pour équilibrer 8 kg. L’objet en déplace déjà 5 L : il manque 8 − 5 = 3 L. Avec g = 10 N/kg, ces
      3 L procurent les 30 N de poussée manquants.'
    choices:
    - text: 3 L supplémentaires
      correct: true
    - text: 5 L supplémentaires
      correct: false
    - text: 8 L supplémentaires
      correct: false
