      B apporte 8 − 4 = 4 kg. Le gain de flottabilité est donc de 1 kg, à compenser par 1 kg de lest dans
      ce modèle. Les 2 kg comptent seulement le volume supplémentaire ; les 3 kg additionnent à tort les
      variations de volume et de masse. L’épaisseur seule ne permet pas ce calcul : les propriétés réelles
      et le lestage de la configuration doivent être vérifiés.'
