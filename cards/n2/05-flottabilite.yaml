  fr:
    question: En plongée en scaphandre à circuit ouvert, que devient la flottabilité pendant une inspiration
      normale, sans action sur le gilet ?
    choices:
    - text: Elle augmente avec le volume des poumons
      correct: true
    - text: Elle diminue avec le volume des poumons
      correct: false
    - text: Elle reste identique tant que le gilet ne change pas de volume
      correct: false
    explanation: L’inspiration augmente le volume du thorax et le volume d’eau déplacée. L’expiration
