    - S3 — CPDA, Notions de physique 2024, p.4–6 (imprimées 6–8).
    - 'OpenStax, University Physics 1, 14.4 — Archimedes’ Principle and Buoyancy : https://openstax.org/books/university-physics-volume-1/pages/14-4-archimedes-principle-and-buoyancy'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    fact_check: pass
  fr:
    front: Un caisson étanche de masse 1,5 kg et de volume extérieur 3 L est entièrement immergé en eau
      douce. Quelle masse de lest faut-il ajouter pour rendre l’ensemble neutre ? Prendre 1 kg par litre
      d’eau et négliger le volume du lest ajouté.
    back: '**1,5 kg de lest.** Le caisson déplace 3 kg d’eau ; la masse totale doit donc atteindre 3 kg.
      Il manque 3 − 1,5 = 1,5 kg. Le volume du lest est négligé uniquement dans ce modèle de calcul.'
- id: n2-flottabilite-volume-double-001
  type: mcq
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::05
  - flottabilite
  status: reviewed
  source_id: P147
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.8–9.
    - S3 — CPDA, Notions de physique 2024, p.4–6 (imprimées 6–8).
    - 'OpenStax, University Physics 1, 14.4 — Archimedes’ Principle and Buoyancy : https://openstax.org/books/university-physics-volume-1/pages/14-4-archimedes-principle-and-buoyancy'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    fact_check: pass
  fr:
    question: Un objet entièrement immergé conserve la même masse, mais son volume extérieur double. Dans
      la même eau, que devient sa poussée d’Archimède ?
    choices:
    - text: Elle double
      correct: true
    - text: Elle reste identique
      correct: false
    - text: Elle est divisée par deux
      correct: false
    explanation: 'Le volume d’eau déplacée double, donc son poids et la poussée doublent aussi. Cela ne
      suffit pas à conclure que l’objet remontera : il faut comparer cette nouvelle poussée à son poids.
      À volume fixe, ajouter de la masse augmente au contraire la tendance à couler.'
- id: n2-flottabilite-neoprene-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::05
  - flottabilite
  status: reviewed
  source_id: P151
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.8–9.
    - S3 — CPDA, Notions de physique 2024, p.4–6 (imprimées 6–8).
    - 'DAN — Mistake #4: Lack of Buoyancy Control : https://dan.org/health-medicine/health-resource/smart-guides/7-mistakes-divers-make-and-how-to-avoid-them/4-lack-of-buoyancy-control/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    fact_check: pass
  fr:
    front: À la descente, pourquoi une combinaison humide en néoprène perd-elle de sa flottabilité ?
    back: '**Le gaz contenu dans les cellules du néoprène se comprime.** La combinaison occupe moins de
      volume et déplace moins d’eau : sa poussée d’Archimède diminue. À la remontée, le néoprène reprend
      du volume et sa flottabilité augmente.'
- id: n2-flottabilite-gilet-001
  type: mcq
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::05
  - flottabilite
  status: reviewed
  source_id: P154
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.8–9.
    - S3 — CPDA, Notions de physique 2024, p.4–6 (imprimées 6–8).
    - 'DAN — Mistake #4: Lack of Buoyancy Control : https://dan.org/health-medicine/health-resource/smart-guides/7-mistakes-divers-make-and-how-to-avoid-them/4-lack-of-buoyancy-control/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    fact_check: pass
  fr:
    question: À profondeur constante, on transfère de l’air du bloc vers le gilet, sans rejet de gaz.
      Pourquoi cela augmente-t-il la flottabilité de l’ensemble plongeur-équipement ?
    choices:
    - text: Son volume extérieur augmente, alors que sa masse totale reste pratiquement constante
      correct: true
    - text: Son volume extérieur reste constant, alors que sa masse totale diminue
      correct: false
    - text: Son volume extérieur et sa masse totale augmentent, car le gilet reçoit de l’air
      correct: false
    explanation: 'L’air quitte le bloc mais reste dans le gilet : ce transfert ne retire pas de masse
      à l’ensemble. Le gilet gonflé déplace davantage d’eau, donc reçoit davantage de poussée. Ce volume
      aide notamment à compenser la perte de flottabilité du néoprène en profondeur.'
- id: n2-flottabilite-poumon-ballast-001
  type: mcq
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::05
  - flottabilite
  status: reviewed
  source_id: P155
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.8–9.
    - S3 — CPDA, Notions de physique 2024, p.4–6 (imprimées 6–8).
    - 'DAN — Weight Up!, lestage et changement de milieu/configuration : https://dan.org/alert-diver/article/weight-up/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    fact_check: pass
  fr:
    question: En plongée en scaphandre à circuit ouvert, que devient la flottabilité pendant une inspiration
      normale, sans action sur le gilet ?
    choices:
    - text: Elle augmente avec le volume des poumons
      correct: true
    - text: Elle diminue avec le volume des poumons
      correct: false
    - text: Elle reste identique tant que le gilet ne change pas de volume
      correct: false
    explanation: L’inspiration augmente le volume du thorax et le volume d’eau déplacée. L’expiration
      produit l’effet inverse. Le poumon-ballast permet des ajustements fins tout en continuant à respirer
      ; l’effet sur la profondeur n’est pas instantané.
- id: n2-flottabilite-respiration-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::05
  - flottabilite
  status: reviewed
  source_id: P157
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.8–9.
    - S3 — CPDA, Notions de physique 2024, p.4–6 (imprimées 6–8).
    - 'DAN — Lung Expansion Injuries : https://dan.org/alert-diver/article/lung-expansion-injuries/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    - 'DAN World — Decompression Illness, prévention AGE, respiration normale à la remontée, recroisé
      le 2026-10-06 : https://world.dan.org/health-medicine/health-resources/diseases-conditions/decompression-illness-what-is-it-and-what-is-the-treatment/'
    fact_check: pass
  fr:
    front: Un plongeur en scaphandre bloque sa respiration après avoir inspiré pour rester à une profondeur
      donnée. Pourquoi ce blocage n’est-il pas une bonne manière d’utiliser le poumon-ballast ?
    back: '**Le poumon-ballast s’utilise en continuant à respirer.** Si le plongeur remonte en retenant
      l’air, la baisse de pression fait se dilater le gaz pulmonaire et expose à une surpression pulmonaire.
      La stabilisation doit permettre une respiration normale, sans apnée.'
- id: n2-flottabilite-bloc-consomme-001
  type: mcq
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::05
  - flottabilite
  status: reviewed
  source_id: P158
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.8–9.
    - S3 — CPDA, Notions de physique 2024, p.4–6 (imprimées 6–8).
    - 'DAN — Weight Up!, lestage et changement de milieu/configuration : https://dan.org/alert-diver/article/weight-up/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    fact_check: pass
  fr:
    question: Entre le début et la fin d’une plongée à circuit ouvert, le même bloc rigide contient moins
      d’air. À profondeur identique, quel changement explique qu’il soit moins lourd dans l’eau ?
    choices:
    - text: Sa masse diminue, tandis que son volume extérieur reste pratiquement constant
      correct: true
    - text: Sa masse reste constante, tandis que son volume extérieur augmente
      correct: false
    - text: Sa masse et son volume extérieur diminuent dans la même proportion
      correct: false
    explanation: 'L’air consommé a quitté l’équipement : la masse du bloc chargé diminue. Son volume extérieur
      et la poussée qu’il reçoit changent très peu. Le volume nominal du bloc, par exemple 12 L, est son
      volume intérieur ; il ne donne pas directement son volume extérieur déplacé.'
- id: n2-flottabilite-combinaison-lest-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::05
  - flottabilite
  status: reviewed
  source_id: P162
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.8–9.
    - S3 — CPDA, Notions de physique 2024, p.4–6 (imprimées 6–8).
    - 'DAN — Weight Up!, lestage et changement de milieu/configuration : https://dan.org/alert-diver/article/weight-up/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    fact_check: pass
  fr:
    front: Un plongeur remplace sa combinaison humide par une autre, plus épaisse. Peut-il déterminer
      exactement son nouveau lestage à partir de la seule différence d’épaisseur ?
    back: '**Non : il doit réévaluer son lestage avec cette configuration.** Davantage de néoprène apporte
      généralement davantage de flottabilité, mais le volume, le matériau, l’état de la combinaison et
      le reste de l’équipement comptent aussi. Il n’existe pas de correction universelle en kilogrammes
      par millimètre d’épaisseur.'
- id: n2-flottabilite-eau-douce-mer-001
  type: mcq
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::05
  - flottabilite
  status: reviewed
  source_id: P163
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.8–9.
    - S3 — CPDA, Notions de physique 2024, p.4–6 (imprimées 6–8).
    - 'DAN — Weight Up!, lestage et changement de milieu/configuration : https://dan.org/alert-diver/article/weight-up/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    fact_check: pass
  fr:
    question: Un plongeur correctement lesté en eau douce garde le même équipement pour plonger en mer,
      dans une eau plus dense. Dans quel sens le besoin de lest évolue-t-il généralement ?
    choices:
    - text: Il augmente
      correct: true
    - text: Il diminue
      correct: false
    - text: Il reste identique
      correct: false
    explanation: À volume immergé identique, l’eau plus dense exerce une poussée plus forte. Il faut généralement
      davantage de lest pour retrouver l’équilibre ; la quantité se vérifie avec la configuration utilisée,
      sans correction fixe de 2 ou 3 kg.
- id: n2-flottabilite-carnet-lestage-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::05
  - flottabilite
  status: reviewed
  source_id: P166
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.8–9.
    - S3 — CPDA, Notions de physique 2024, p.4–6 (imprimées 6–8).
    - 'DAN — Weight Up!, lestage et changement de milieu/configuration : https://dan.org/alert-diver/article/weight-up/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    fact_check: pass
  fr:
    front: Pour pouvoir réutiliser un réglage de lestage noté dans son carnet, quelles informations faut-il
      conserver en plus des kilogrammes de lest ?
    back: '**Le type d’eau, la combinaison, le bloc et les accessoires, ainsi que les conditions du contrôle.**
      Noter notamment la pression restante du bloc et si la stabilisation était confortable en fin de
      plongée. Un caisson ou un phare peut modifier l’équilibre ; une quantité de lest isolée de sa configuration
      est difficile à réutiliser.'
- id: n2-flottabilite-parachute-traction-001
  type: basic
  deck: Physique
