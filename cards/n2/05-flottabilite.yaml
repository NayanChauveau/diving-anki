      distracteur analysé dans le CSV'
    fact_check: pass
  fr:
    question: À profondeur constante, on transfère de l’air du bloc vers le gilet, sans rejet de gaz.
      Pourquoi cela augmente-t-il la flottabilité de l’ensemble plongeur-équipement ?
    choices:
    - text: Son volume extérieur augmente, alors que sa masse totale reste pratiquement constante
      correct: true
    - text: Son volume extérieur reste constant, alors que sa masse totale diminue
      correct: false
    - text: Son volume extérieur et sa masse totale augmentent, car le gilet reçoit de l’air
      correct: false
    explanation: 'L’air quitte le bloc mais reste dans le gilet : ce transfert ne retire pas de masse
      à l’ensemble. Le gilet gonflé déplace davantage d’eau, donc reçoit davantage de poussée. Ce volume
      aide notamment à compenser la perte de flottabilité du néoprène en profondeur.'
