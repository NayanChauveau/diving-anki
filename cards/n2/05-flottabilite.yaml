  fr:
    front: Un plongeur était correctement stabilisé en début de plongée. En fin de plongée, il doit palmer
      pour rester immergé à faible profondeur, avec un gilet entièrement purgé, une combinaison humide
      et une respiration normale. Pourquoi un lestage vérifié seulement avec le bloc plein peut-il expliquer
      cette difficulté ?
    back: '**Le bloc a perdu la masse du gaz consommé : le lestage peut être insuffisant en fin de plongée.**
      Son volume extérieur a très peu changé, donc la poussée reçue reste presque identique. Le lestage
      doit permettre de tenir la faible profondeur avec le bloc moins chargé, pas seulement de s’immerger
      au départ.'
