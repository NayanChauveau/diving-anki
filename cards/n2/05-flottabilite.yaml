  fr:
    question: À la descente, pourquoi une combinaison humide en néoprène perd-elle de sa flottabilité
      ?
    choices:
    - text: Le volume diminue alors que la masse change très peu
      correct: true
    - text: Le volume reste constant alors que la masse augmente
      correct: false
    - text: Le volume reste constant alors que la masse diminue
      correct: false
    explanation: '**Le gaz contenu dans les cellules du néoprène se comprime.** La combinaison occupe
      moins de volume et déplace moins d’eau : sa poussée d’Archimède diminue. À la remontée, le néoprène
      reprend du volume et sa flottabilité augmente.'
