  fr:
    front: Pourquoi porter trop de lest peut-il augmenter l’effort et la consommation d’air, même lorsque
      le plongeur compense avec son gilet ?
    back: '**Le poids supplémentaire impose davantage de gaz dans le gilet pour rester neutre.** L’équilibre
      et la position peuvent devenir moins favorables, avec plus de résistance à l’avancement. Le plongeur
      fournit alors davantage d’effort et peut consommer plus d’air.'
