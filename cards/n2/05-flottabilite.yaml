  fr:
    front: Un objet rigide de masse 6 kg est entièrement immergé dans de l’eau de masse volumique 1 kg/L.
      Quel volume extérieur doit-il avoir pour être de flottabilité neutre ?
    back: '**6 L.** À l’équilibre, la masse d’eau déplacée doit égaler la masse de l’objet : 6 kg. Avec
      1 kg/L, cela correspond à 6 L. En prenant g = 10 N/kg, poids et poussée valent chacun 60 N.'
