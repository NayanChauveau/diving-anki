  fr:
    front: Un caisson de 1,5 kg et 3 L reçoit un lest dont le volume extérieur est de 0,1 L. Quelle masse
      doit avoir ce lest pour rendre l’ensemble neutre, entièrement immergé dans de l’eau à 1 kg/L ?
    back: '**1,6 kg.** L’ensemble déplace 3 + 0,1 = 3,1 L d’eau, soit 3,1 kg. Sa masse totale doit donc
      être de 3,1 kg : masse du lest = 3,1 − 1,5 = 1,6 kg. Le lest ajouté reçoit lui aussi une poussée
      ; son volume compte cette fois.'
