  review:
    sources:
    - 'Revue finale des formats, clarté et distracteurs du 2026-10-06 : docs/reviews/QCM_REVUE_FINALE.md'
    - 'Conversion QCM et revue des choix du 2026-10-06 : docs/reviews/QCM_GLOBALE.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.8–9.
    - S3 — CPDA, Notions de physique 2024, p.4–6 (imprimées 6–8).
    - 'OpenStax, University Physics 1, 14.4 — Archimedes’ Principle and Buoyancy : https://openstax.org/books/university-physics-volume-1/pages/14-4-archimedes-principle-and-buoyancy'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    - 'Revue pédagogique du 2026-10-09 : docs/reviews/QUALITE_GLOBALE_2026-10-09.md ; objectif et identité
      conservés'
    - 'Revue approfondie N2 du 2026-10-09 : docs/reviews/PHYSIQUE_N2_2026-10-09.md ; Archimède : OpenStax
      University Physics 1 §14.4 ; DAN Weight Up et Buoyancy Control ; hypothèses de la carte ; chaque
      distracteur analysé dans le CSV'
    fact_check: pass
  fr:
    question: Un bloc fermé paraît moins lourd lorsqu’on le tient immobile sous l’eau. Quelle proposition
      décrit correctement sa masse, son poids réel et son poids apparent ?
    choices:
    - text: Masse et poids réel inchangés ; poids apparent réduit par la poussée
      correct: true
    - text: Masse inchangée ; poids réel et poids apparent réduits
      correct: false
    - text: Masse et poids réel réduits ; poussée d’Archimède inchangée
      correct: false
    explanation: 'À gravité identique, la masse du bloc et son poids réel restent les mêmes. La poussée
      de l’eau compense une partie de ce poids : la force nécessaire pour soutenir le bloc, son poids
      apparent, diminue.'
