  fr:
    front: Un objet de 4 kg et 4 L est entièrement immergé dans une eau salée de masse volumique 1,025
      kg/L. Quel est son poids apparent ? Prendre g = 10 N/kg et poids apparent = poids réel − poussée
      d’Archimède.
    back: '**−1 N**, soit une tendance à remonter. L’objet déplace 4 × 1,025 = 4,1 kg d’eau. Son poids
      vaut 40 N, la poussée 41 N : 40 − 41 = −1 N. Dans une eau à 1 kg/L, ce même objet serait neutre.'
