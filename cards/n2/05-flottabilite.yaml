    fact_check: pass
  fr:
    front: Un objet a une masse de 2 kg et un volume extérieur de 3 L. Quel est son poids apparent ? Objet
      entièrement immergé en eau douce ; prendre 1 kg par litre d’eau et g = 10 N/kg. Le poids apparent
      est défini par poids réel moins poussée d’Archimède.
    back: '**−10 N**, soit une tendance à remonter. Poids réel : 2 × 10 = 20 N. Poussée : 3 × 10 = 30
      N. Poids apparent : 20 − 30 = −10 N.'
- id: n2-flottabilite-calcul-neutre-001
  type: basic
