    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/05-flottabilite.md'
    fact_check: pass
  fr:
    front: Pourquoi ne faut-il pas accrocher le dévidoir à soi pendant le lancement d’un parachute de
      palier ?
    back: '**Un fil bloqué peut transmettre la traction du parachute au plongeur et l’entraîner vers la
      surface.** Le gaz ajouté rend le parachute flottant ; cette poussée vers le haut doit pouvoir être
      dissociée du plongeur. Le dévidoir reste décroché du plongeur pendant le lancement.'
