  fr:
    front: Un plongeur stabilisé perd accidentellement une poche de plombs. Pourquoi risque-t-il de partir
      vers la surface ?
    back: '**Il perd du poids sans perdre autant de poussée d’Archimède.** Le plomb est beaucoup plus
      dense que l’eau : sa perte rend l’ensemble plus flottant. Si une remontée commence, l’expansion
      du gaz du gilet et du néoprène peut encore accentuer cette tendance.'
