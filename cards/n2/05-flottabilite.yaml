  fr:
    question: 'Un plongeur est neutre avec la combinaison A. À la même profondeur, deux combinaisons entièrement
      immergées ont ces données fictives : A, masse 3 kg et volume extérieur 6 L ; B, masse 4 kg et volume
      extérieur 8 L. En remplaçant A par B, quelle variation de lest rend l’ensemble à nouveau neutre
      ? Eau à 1 kg/L, autres éléments inchangés ; négliger le volume du lest.'
    choices:
    - text: Ajouter 1 kg de lest
      correct: true
    - text: Ajouter 2 kg de lest
      correct: false
    - text: Ajouter 3 kg de lest
      correct: false
