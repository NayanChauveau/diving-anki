  fr:
    question: Le directeur de plongée vous autorise une exploration conforme à vos aptitudes, mais vous
      vous sentez inhabituellement fatigué et gêné pour respirer. Quelle décision vous appartient encore
      ?
    choices:
    - text: Signaler son état et renoncer à l’immersion
      correct: true
    - text: S’immerger puisque le DP a validé les aptitudes
      correct: false
    - text: Attendre les premiers paliers pour signaler la gêne
      correct: false
    explanation: '**Signaler votre état et renoncer à l’immersion.** L’autorisation et le brevet ne remplacent
      pas l’évaluation de son état du jour ; une gêne respiratoire mérite d’être expliquée avant de plonger.'
