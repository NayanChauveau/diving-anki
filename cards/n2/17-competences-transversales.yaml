  fr:
    question: La palanquée doit revenir en sens inverse le long du même tombant. À l’aller elle suivait
      le cap 090°. La visibilité baisse ; un équipier reconnaît une paroi semblable et propose de la longer
      au cap 090°. Quel contrôle du retour est pertinent ?
    choices:
    - text: Rechercher le cap 270° et confronter la paroi aux repères mémorisés
      correct: true
    - text: Rechercher le cap 090° et confronter la paroi à la profondeur de l’aller
      correct: false
    - text: Rechercher le cap 000° et confronter la paroi à la lumière venant de surface
      correct: false
    explanation: 'Le retour en sens inverse demande le cap opposé : 090° + 180° = 270°. Une paroi ressemblante
      et une profondeur identique ne prouvent pas qu’on a retrouvé le bon tombant. Confronter le compas
      et les repères naturels ; 090° conserve le sens de l’aller, et 000° n’est pas son cap inverse.'
