    question: Une palanquée traverse un fond meuble et commence à soulever des sédiments. L’espace au-dessus
      est libre. Quelle combinaison d’assiette et de palmage limite la remise en suspension ?
    choices:
    - text: Corps horizontal, palmes éloignées du fond, propulsion dirigée loin des sédiments
      correct: true
    - text: Tête relevée, palmes plus basses que le corps, battements dirigés vers les sédiments
      correct: false
    - text: Corps horizontal, palmes au ras du fond, battements plus rapides et plus courts
      correct: false
    explanation: L’assiette horizontale, une distance suffisante au fond et une propulsion dirigée loin
      du sédiment limitent sa remise en suspension. Une tête relevée avec des palmes basses dirige le
      palmage vers le fond ; des battements plus courts mais rapides au ras du fond peuvent également
      soulever les sédiments.
