  fr:
    question: Le directeur de plongée autorise un profil conforme à vos aptitudes. Qui doit encore apprécier
      votre état du jour et peut décider de ne pas s’immerger ?
    choices:
    - text: Vous-même, même si le profil est autorisé par le DP
      correct: true
    - text: Le DP seul, puisqu’il a déjà autorisé le profil
      correct: false
    - text: L’équipier le plus expérimenté, puisqu’il assure la cohésion
      correct: false
    explanation: Le directeur de plongée (DP) fixe le cadre de la plongée, mais son autorisation ne remplace
      pas votre appréciation de votre fatigue, de votre respiration et de votre aisance du jour. Vous
      pouvez signaler une difficulté et renoncer à l’immersion ; la palanquée adapte alors son organisation.
