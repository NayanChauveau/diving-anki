  fr:
    question: 'Exercice d’orientation : trajet rectiligne à cap 70°, sans dérive ni obstacle. Quel cap réciproque
      permet de revenir sur la même ligne ?'
    choices:
    - text: 250°
      correct: true
    - text: 110°
      correct: false
    - text: 290°
      correct: false
    explanation: '**250° : 70 + 180.** Le retour inverse la direction sur la même ligne ; sous courant,
      ce cap géométrique ne compense pas à lui seul la dérive.'
