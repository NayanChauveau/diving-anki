    fact_check: pass
  fr:
    question: Au palier, un équipier montre le nombre « 6 » sans préciser l’unité. Quelle convention de
      communication aurait permis de distinguer son obligation de décompression ?
    choices:
    - text: Des signes distinguant profondeur de palier et durée restante
      correct: true
    - text: Des signes distinguant pression du bloc et réserve de gaz
      correct: false
    - text: Des signes distinguant profondeur maximale et temps de fond
      correct: false
    explanation: Le code partagé doit permettre de comprendre si le nombre annonce une profondeur de palier
      en mètres ou une durée restante en minutes. Pression de bloc, profondeur maximale et temps de fond
      sont d’autres informations utiles, mais ne lèvent pas cette ambiguïté de décompression. La convention
      se prépare au briefing.
