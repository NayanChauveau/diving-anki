  fr:
    question: En planification PA20 FFESSM à l’air, faut-il programmer des paliers profonds supplémentaires
      ?
    choices:
    - text: 'Non : planifier sans paliers profonds supplémentaires à l’air'
      correct: true
    - text: 'Oui : ajouter des arrêts profonds quel que soit le profil'
      correct: false
    - text: 'Oui : remplacer les paliers peu profonds par des arrêts profonds'
      correct: false
    explanation: '**Non : le MFT demande une planification sans paliers profonds à l’air.** Les distinguer
      des paliers de décompression nécessaires et des arrêts prévus par une procédure de rattrapage après
      incident.'
