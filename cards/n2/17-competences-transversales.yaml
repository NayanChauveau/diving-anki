  fr:
    question: 'Exercice d’orientation : aller rectiligne à cap 300°, sans dérive ni obstacle. Quel cap
      réciproque correspond au retour ?'
    choices:
    - text: 120°
      correct: true
    - text: 180°
      correct: false
    - text: 240°
      correct: false
    explanation: '**120° : 300 + 180 = 480, puis 480 − 360 = 120.** On exprime la direction dans l’intervalle
      0° à moins de 360°.'
