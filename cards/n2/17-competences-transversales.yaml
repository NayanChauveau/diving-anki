  fr:
    question: En planification fédérale à l’air, quel type d’arrêt ne doit pas être ajouté au profil de
      décompression prévu ?
    choices:
    - text: Un palier profond supplémentaire choisi pour rendre le profil plus conservateur
      correct: true
    - text: Un palier obligatoire peu profond indiqué par l’ordinateur ou les tables
      correct: false
    - text: Un arrêt prévu par une procédure de rattrapage après un incident
      correct: false
    explanation: La planification FFESSM à l’air se fait sans paliers profonds supplémentaires. Cette
      règle ne supprime ni les paliers de décompression obligatoires ni les arrêts d’une procédure de
      rattrapage applicable à un incident. Le contexte de l’arrêt est donc déterminant.
