  fr:
    question: Pourquoi choisir plusieurs repères fixes alignés plutôt que suivre seulement une impression
      de direction sous l’eau ?
    choices:
    - text: Leur alignement aide à suivre une ligne et à détecter une dérive par rapport au fond
      correct: true
    - text: Leur alignement indique le cap magnétique sans avoir besoin d’un instrument
      correct: false
    - text: Leur alignement garantit le même trajet au retour, même si le courant change
      correct: false
    explanation: '**Leur alignement aide à suivre une ligne par rapport au fond et à repérer une dérive.**
      À mesure qu’un repère est atteint, en choisir un plus éloigné pour conserver l’alignement. Compléter
      ces repères par la profondeur et le compas.'
