  fr:
    question: 'Exercice de recherche après perte de repères : une palanquée dispose de 550 L de gaz utilisable,
      dont 400 L nécessaires au repli convenu. La recherche reste à 20 m, avec 1 bar en surface, 1 bar
      ajouté tous les 10 m et un débit respiratoire de 20 L/min ramené à la surface. Quelle durée maximale
      de recherche ce budget nominal laisse-t-il ?'
    choices:
    - text: 2,5 min
      correct: true
    - text: 3,75 min
      correct: false
    - text: 9,17 min
      correct: false
    explanation: 'La recherche dispose de 550 − 400 = 150 L. À 20 m, la pression absolue vaut 3 bar et
      la consommation 20 × 3 = 60 L/min : 150 / 60 = 2,5 min. Les 3,75 min utilisent la pression relative
      de 2 bar ; 9,17 min consomme aussi le gaz réservé au repli. La perte de repères ne rend pas disponible
      le gaz nécessaire au retour.'
