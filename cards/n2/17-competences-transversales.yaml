cards:
- id: n2-competences-transversales-communication-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::17
  - competences-transversales
  status: reviewed
  source_id: P555
  review:
    sources:
    - S2 — Flyer N2 FFESSM 2021, p.1–2 ; compétences, complétées par MFT mai 2026.
    - 'FFESSM — MFT N2 version mai 2026, p.5–6, 12–13 et 15–18 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'BSAC — Safe diving guide, Going diving, sections checks et separation, consulté le 2026-10-06 :
      https://www.bsac.com/safety/safe-diving-guide/going-diving/'
    - 'Revue du 2026-10-06 : docs/reviews/17-competences-transversales.md'
    fact_check: pass
  fr:
    front: Deux équipiers utilisent des ordinateurs différents. Pourquoi convenir avant immersion de la
      façon de communiquer profondeur et durée des paliers ?
    back: '**Pour distinguer sans ambiguïté des mètres, des minutes et une obligation encore active.**
      Choisir un code partagé et vérifier sa compréhension ; montrer un nombre avec les doigts sans préciser
      ce qu’il mesure peut conduire à une mauvaise décision.'
- id: n2-competences-transversales-retour-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::17
  - competences-transversales
  status: reviewed
  source_id: P561
  review:
    sources:
    - S2 — Flyer N2 FFESSM 2021, p.1–2 ; compétences, complétées par MFT mai 2026.
    - 'FFESSM — MFT N2 version mai 2026, p.5–6, 12–13 et 15–18 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'DAN — Current Dives : https://dan.org/alert-diver/article/current-dives/'
    - 'Revue du 2026-10-06 : docs/reviews/17-competences-transversales.md'
    fact_check: pass
  fr:
    front: Pourquoi faut-il prévoir le parcours de retour et une solution de sortie alternative avant
      de descendre, plutôt qu’attendre le seuil de réserve pour décider ?
    back: '**Le retour consomme du temps et du gaz et peut être gêné par le courant ou la visibilité.**
      Repérer sortie, trajet et alternatives avec la palanquée ; la pression de fin de plongée doit encore
      permettre d’achever la remontée et les obligations prévues.'
- id: n2-competences-transversales-reperes-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::17
  - competences-transversales
  status: reviewed
  source_id: P562
  review:
    sources:
    - S2 — Flyer N2 FFESSM 2021, p.1–2 ; compétences, complétées par MFT mai 2026.
    - 'FFESSM — MFT N2 version mai 2026, p.5–6, 12–13 et 15–18 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Suunto — SK-8 Dive Compass User Guide, orientation : https://us.suunto.com/pages/suunto-sk-8-dive-compass-user-guide'
    - 'Revue du 2026-10-06 : docs/reviews/17-competences-transversales.md'
    - 'Suunto SK-8, guide multilingue, p.11–13 en français, aides à la navigation : https://cdn.shopify.com/s/files/1/0850/4878/7229/files/SUUNTO_SK-SERIES_UG_MULTI.pdf?v=1714977581'
    fact_check: pass
  fr:
    front: Pourquoi choisir plusieurs repères fixes alignés plutôt que suivre seulement une impression
      de direction sous l’eau ?
    back: '**Leur alignement aide à suivre une ligne par rapport au fond et à repérer une dérive.** À
      mesure qu’un repère est atteint, en choisir un plus éloigné pour conserver l’alignement. Compléter
      ces repères par la profondeur et le compas.'
- id: n2-competences-transversales-cap-retour-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::17
  - competences-transversales
  - exercice::calcul
  status: reviewed
  source_id: P563
  review:
    sources:
    - S2 — Flyer N2 FFESSM 2021, p.1–2 ; compétences, complétées par MFT mai 2026.
    - 'Suunto — SK-8 Dive Compass User Guide, orientation : https://us.suunto.com/pages/suunto-sk-8-dive-compass-user-guide'
    - 'Revue du 2026-10-06 : docs/reviews/17-competences-transversales.md'
    fact_check: pass
  fr:
    front: 'Exercice d’orientation : trajet rectiligne à cap 70°, sans dérive ni obstacle. Quel cap réciproque
      permet de revenir sur la même ligne ?'
    back: '**250° : 70 + 180.** Le retour inverse la direction sur la même ligne ; sous courant, ce cap
      géométrique ne compense pas à lui seul la dérive.'
- id: n2-competences-transversales-cap-retour-ouest-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::17
  - competences-transversales
  - exercice::calcul
  status: reviewed
  source_id: P563
  review:
    sources:
    - S2 — Flyer N2 FFESSM 2021, p.1–2 ; compétences, complétées par MFT mai 2026.
    - 'Suunto — SK-8 Dive Compass User Guide, orientation : https://us.suunto.com/pages/suunto-sk-8-dive-compass-user-guide'
    - 'Revue du 2026-10-06 : docs/reviews/17-competences-transversales.md'
    fact_check: pass
  fr:
    front: 'Exercice d’orientation : aller rectiligne à cap 300°, sans dérive ni obstacle. Quel cap réciproque
      correspond au retour ?'
    back: '**120° : 300 + 180 = 480, puis 480 − 360 = 120.** On exprime la direction dans l’intervalle
      0° à moins de 360°.'
