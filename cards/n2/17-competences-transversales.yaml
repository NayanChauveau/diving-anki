  fr:
    question: Quels paramètres faut-il définir au briefing pour que des équipiers séparés appliquent une
      procédure cohérente jusqu’aux retrouvailles et à l’alerte ?
    choices:
    - text: Durée de recherche, modalités de remontée et lieu de rendez-vous
      correct: true
    - text: Profondeur maximale, durée au fond et pression de départ
      correct: false
    - text: Cap d’exploration, distance parcourue et vitesse de palmage
      correct: false
    explanation: La procédure doit borner la recherche et organiser une remontée adaptée, un rendez-vous
      et une alerte cohérents. Elle tient compte du site et des obligations de décompression de chacun.
      Les paramètres du profil et de l’orientation sont utiles au briefing, mais ne définissent pas à
      eux seuls cette conduite en cas de séparation.
