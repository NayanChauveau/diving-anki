  fr:
    question: Pourquoi faut-il prévoir le parcours de retour et une solution de sortie alternative avant
      de descendre, plutôt qu’attendre le seuil de réserve pour décider ?
    choices:
    - text: Le retour et les imprévus nécessitent encore temps et gaz
      correct: true
    - text: La réserve doit financer uniquement les paliers à 3 m
      correct: false
    - text: Le parcours de retour se décide après l’épuisement du temps sans palier
      correct: false
    explanation: '**Le retour consomme du temps et du gaz et peut être gêné par le courant ou la visibilité.**
      Repérer sortie, trajet et alternatives avec la palanquée ; la pression de fin de plongée doit encore
      permettre d’achever la remontée et les obligations prévues.'
