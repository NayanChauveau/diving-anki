  fr:
    question: Une sortie de repli est plus proche à vol d’oiseau que la sortie prévue, mais impose un
      trajet différent sous l’eau. Que faut-il recalculer pour vérifier que ce repli tient dans le budget
      de gaz ?
    choices:
    - text: Le gaz du trajet de repli, de la remontée et des paliers requis
      correct: true
    - text: Le gaz du trajet horizontal, en conservant les seuls arrêts facultatifs
      correct: false
    - text: Le gaz correspondant à la différence de distance mesurée à vol d’oiseau
      correct: false
    explanation: 'La distance apparente ne suffit pas : trajet réel, profondeur, courant, remontée et
      paliers déterminent le gaz nécessaire. On vérifie que le budget couvre ce retour complet avec les
      marges retenues. Les paliers obligatoires ne disparaissent pas parce que la sortie est plus proche.'
