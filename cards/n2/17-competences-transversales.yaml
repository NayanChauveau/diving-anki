  fr:
    question: Pourquoi convenir d’une procédure de perte de palanquée avant immersion plutôt que prolonger
      chacun une recherche improvisée ?
    choices:
    - text: Limiter la recherche et organiser un rendez-vous et une alerte cohérents
      correct: true
    - text: Prolonger la recherche jusqu’à la réserve avant de remonter
      correct: false
    - text: Prévoir que chacun termine seul la plongée selon son ordinateur
      correct: false
    explanation: '**Pour limiter la recherche et organiser une remontée, un rendez-vous et une alerte cohérents.**
      Le briefing précise la conduite adaptée au site et aux obligations de décompression ; s’enfoncer ou
      poursuivre seul l’exploration augmente la difficulté à se retrouver.'
