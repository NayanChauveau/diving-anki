    fact_check: pass
  fr:
    question: Lors d’un déplacement sous l’eau, quelle information fournit le maintien de deux repères
      fixes dans le même alignement ?
    choices:
    - text: Le maintien d’une ligne de déplacement par rapport au fond
      correct: true
    - text: Le maintien d’un cap magnétique mesuré par rapport au nord
      correct: false
    - text: Le maintien d’une vitesse de déplacement par rapport à l’eau
      correct: false
    explanation: L’alignement de repères fixes donne une ligne par rapport au fond et aide à détecter
      un déplacement latéral. Il ne mesure ni le cap magnétique ni la vitesse dans l’eau. Renouveler les
      repères au fil du trajet et les confronter au compas et à la profondeur.
