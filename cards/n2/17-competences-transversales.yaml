    fact_check: pass
  fr:
    question: Deux équipiers utilisent des ordinateurs différents. Pourquoi convenir avant immersion de
      la façon de communiquer profondeur et durée des paliers ?
    choices:
    - text: Un même nombre doit être compris comme profondeur, durée ou obligation selon le code convenu
      correct: true
    - text: Un même nombre se comprend selon le signe personnel de chacun, sans convention commune
      correct: false
    - text: Un même nombre de minutes peut être fixé au fond puis conservé même si les appareils le modifient
      correct: false
    explanation: '**Pour distinguer sans ambiguïté des mètres, des minutes et une obligation encore active.**
      Choisir un code partagé et vérifier sa compréhension ; montrer un nombre avec les doigts sans préciser
      ce qu’il mesure peut conduire à une mauvaise décision.'
