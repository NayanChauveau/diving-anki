    question: 'Un exercice fixe deux limites de départ du retour : au plus tard 18 min après immersion,
      ou dès qu’un équipier atteint 120 bar. À 14 min, l’un affiche 118 bar et l’autre 145 bar. Aucun
      incident. Quand commencer le retour ?'
    choices:
    - text: Maintenant, puisque la limite de gaz d’un équipier est atteinte
      correct: true
    - text: À 18 min, puisque la limite de temps n’est pas encore atteinte
      correct: false
    - text: Quand les deux équipiers atteignent 120 bar, puisque le retour est commun
      correct: false
    explanation: Le premier critère atteint déclenche le retour collectif. Ici, 118 bar est déjà inférieur
      au seuil de 120 bar chez un équipier. Attendre 18 min dépasserait sa limite de gaz ; attendre que
      l’autre atteigne aussi 120 bar retarderait encore le retour. Les seuils sont convenus pour la palanquée,
      pas appliqués séparément à deux retours indépendants.
