- id: n2-documents-cmas-role-001
  type: mcq
  anki_model: basic
  deck: Réglementation
  levels:
  - N2
  tags:
  - chapitre::03
  - documents-environnement
  - angle::comprehension
  status: reviewed
  source_id: P080
  review:
    sources:
    - 'Revue finale des formats, clarté et distracteurs du 2026-10-06 : docs/reviews/QCM_REVUE_FINALE.md'
    - 'Conversion QCM et revue des choix du 2026-10-06 : docs/reviews/QCM_GLOBALE.md'
