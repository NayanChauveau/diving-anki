      De qui doit provenir l’autorisation spécifique d’accès pour cette activité, en complément des conditions
      du Code du sport ?
    choices:
    - text: Du Parc national, après engagement à respecter son règlement de plongée
      correct: true
    - text: Du préfet maritime, après validation de la fiche de sécurité de la sortie
      correct: false
    - text: De la FFESSM, après validation des aptitudes inscrites sur la fiche de sécurité
      correct: false
    explanation: L’autorisation spécifique de plongée est délivrée par le directeur du Parc national après
      engagement à respecter le règlement de plongée. Elle s’obtient via CaPeL, le carnet de plongée en
      ligne du Parc. Le respect des aptitudes et des autres conditions du Code du sport ne dispense pas
      de cette autorisation locale. Le préfet maritime peut réglementer les activités en mer, mais ce
      n’est pas lui qui délivre cette autorisation du Parc ; la FFESSM ne la délivre pas non plus.
