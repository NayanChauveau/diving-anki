  fr:
    question: Avant une plongée sur un site côtier français, dans quels textes vérifier les distances
      d’approche et limitations de vitesse imposées aux navires autour des plongeurs signalés ?
    choices:
    - text: Les arrêtés maritimes applicables au secteur de plongée
      correct: true
    - text: Le règlement international pour prévenir les abordages en mer
      correct: false
    - text: La division 240 sur la sécurité des navires de plaisance
      correct: false
    explanation: Les règles maritimes applicables au site, notamment les arrêtés de la préfecture maritime,
      précisent les distances, la signalisation et les limitations de vitesse. Une distance retenue sur
      un secteur ne se transpose pas automatiquement à toute la côte. Le règlement international pour
      prévenir les abordages en mer (RIPAM) encadre les règles de navigation et les signaux ; la division
      240 traite la sécurité des navires de plaisance. Ils ne remplacent pas la consultation des arrêtés
      locaux pour les distances d’approche des plongeurs.
