      ; objectif, ID et modèle conservés'
    fact_check: pass
  fr:
    question: Un plongeur présente une licence FFESSM de pratique valide. Quel élément est établi par
      cette licence, indépendamment de ses autres justificatifs ?
    choices:
    - text: Son affiliation fédérale pour la période couverte
      correct: true
    - text: Ses aptitudes d’exploration pour la période couverte
      correct: false
    - text: Son absence de contre-indication pour la période couverte
      correct: false
    explanation: La licence établit l’affiliation à la FFESSM. Le brevet ou la certification atteste les
      aptitudes ; le certificat d’absence de contre-indication (CACI) concerne l’examen médical. La licence
      ne remplace ni l’un ni l’autre.
