      (personnel / palanquée), CMPN certificat médical et pratique (moins d’un an, tout médecin compétent),
      FFESSM licence / assurances saison 2026–2027, Port-Cros réglementation plongée / CaPeL, Longitude181
      Charte, Code du patrimoine L532-3 et DRASSM ; sources primaires consultées 2026-10-11. Voir références
      exactes préexistantes et journal du lot.
    - 'Reprise N4 du 2026-10-12, lot 42 (reprises) : docs/reviews/n4/REPRISES_DETAILLEES.md ; 2026-10-12
      : A322-80 texte officiel indexé ; CMPN tableau CACI 1 page (https://medical.ffessm.fr/uploads/media/default/0001/12/4263e575d7051cabbe61b8bac9718a428700aead.pdf),
      documents de visite juin2026 ; FFESSM pratiquer (https://plongee.ffessm.fr/categories/pratiquer),
      assurances 24 août2026 (https://ffessm.fr/gerer/assurance) ; CaPeL officiel (https://capel.portcros-parcnational.fr/la-plongee-au-sein-du-pnpc/)
      texte complet. Le règlement médical PDF retrouvé porte février2018 malgré une date de référencement
      récente : tableau actuel privilégié. ; recto, choix et corrigé relus ; identité conservée'
    fact_check: pass
  fr:
    question: Pour un adulte pratiquant la plongée FFESSM à l’air, hors cas médical particulier, quelle
      ancienneté maximale du CACI et quelle exigence de médecin s’appliquent ?
    choices:
    - text: Moins d’un an ; médecin fédéral non obligatoire
      correct: true
    - text: Moins d’un an ; médecin fédéral obligatoire
      correct: false
    - text: Moins de deux ans ; médecin fédéral non obligatoire
      correct: false
    explanation: Le certificat d’absence de contre-indication (CACI) doit dater de moins d’un an au jour
      de la pratique. Dans ce cas général, un médecin autorisé à exercer, avec les compétences nécessaires
      à cet examen, peut le délivrer. Un médecin fédéral peut le faire, mais cette qualification n’est
      pas obligatoire.
