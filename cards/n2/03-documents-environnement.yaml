  fr:
    question: Une structure prépare une plongée dans le cœur marin d’un parc national. Quelle règle permet
      de déterminer les restrictions et autorisations propres à ce site ?
    choices:
    - text: La réglementation du cœur marin concerné pour la plongée
      correct: true
    - text: La réglementation de la pêche sous-marine dans ce secteur
      correct: false
    - text: La réglementation générale des aptitudes PE et PA du Code du sport
      correct: false
    explanation: Le règlement et les arrêtés applicables au site précisent si la plongée est autorisée
      et à quelles conditions. Une interdiction de pêche n’établit pas à elle seule le régime de la plongée
      d’observation ; les aptitudes PE/PA ne donnent pas non plus un droit d’accès au site. Les cœurs
      marins de Port-Cros et Porquerolles, par exemple, ont un dispositif d’autorisation de plongée.
