  fr:
    question: Une certification de plongée porte une référence CMAS. À quoi renvoie cette référence ?
    choices:
    - text: À des standards internationaux de formation
      correct: true
    - text: À des prérogatives légales de profondeur uniformes entre pays
      correct: false
    - text: À des équivalences automatiques entre tous les cursus fédéraux
      correct: false
    explanation: La CMAS, Confédération mondiale des activités subaquatiques, définit des standards internationaux
      de formation pour les plongeurs et les moniteurs. Les certifications CMAS se réfèrent à ces standards.
