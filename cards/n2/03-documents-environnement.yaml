    - 'Ministère chargé de la mer — règles de sécurité des loisirs nautiques, mise à jour 19 juin 2026,
      réglementation locale et pavillons : https://www.mer.gouv.fr/regles-de-securite-pour-les-loisirs-nautiques-en-mer
      ; vérifié le 2026-10-05'
    - 'Revue : docs/reviews/03-documents-environnement.md'
    - 'Parc national de Port-Cros — autorisation de plongée dans les cœurs marins, vérifié le 2026-10-05
      : https://portcros-parcnational.fr/fr/le-parc-national-de-port-cros/la-reglementation/reglementation-en-mer/plongee-sous-marine'
    - 'Revue intégrale de clarté et d’unicité du 2026-10-06 : docs/reviews/CLARTE_GLOBALE.md'
    fact_check: pass
  fr:
    question: Pour savoir si une plongée est autorisée dans une zone marine protégée, quelle réglementation
      faut-il vérifier ?
    choices:
    - text: Les règles de plongée propres à cette zone protégée
      correct: true
    - text: Les seules prérogatives de profondeur du Code du sport
      correct: false
    - text: Les seules conditions générales du brevet détenu
      correct: false
    explanation: 'La réglementation propre au site : arrêtés, règlement de la zone et éventuelles conditions
      d’autorisation. Selon la zone, la plongée peut être autorisée, limitée, soumise à autorisation ou
      interdite. Par exemple, les cœurs marins du Parc national de Port-Cros exigent une autorisation de
      plongée.'
