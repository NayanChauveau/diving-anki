  fr:
    question: Quelle répartition des risques distingue la responsabilité civile (RC) de la licence FFESSM
      et une assurance individuelle accident ?
    choices:
    - text: 'RC : dommages causés à autrui ; individuelle accident : propres blessures'
      correct: true
    - text: 'RC : propres blessures ; individuelle accident : dommages causés à autrui'
      correct: false
    - text: 'RC et individuelle accident : mêmes blessures personnelles, seuls les plafonds diffèrent'
      correct: false
    explanation: La RC concerne les dommages causés à autrui. L’assurance individuelle accident concerne
      les dommages corporels du plongeur lui-même selon les garanties souscrites, notamment en l’absence
      de tiers responsable. La couverture de ses propres blessures doit donc être vérifiée dans les garanties
      de son assurance individuelle.
