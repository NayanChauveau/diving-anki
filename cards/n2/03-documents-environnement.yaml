    question: Un bloc de plongée a une inspection visuelle récente, mais sa requalification est arrivée
      à échéance. Quel contrôle permet de renouveler cette échéance réglementaire ?
    choices:
    - text: Une requalification périodique réussie sous la responsabilité d’un organisme habilité
      correct: true
    - text: Une nouvelle inspection visuelle réussie par un technicien d’inspection visuelle
      correct: false
    - text: Un essai d’étanchéité réussi pendant un gonflage à la pression de service
      correct: false
    explanation: L’inspection visuelle et la requalification sont deux contrôles distincts. Une inspection
      récente ou l’absence de fuite ne renouvelle pas l’échéance de requalification. Un bloc soumis à
      cette obligation doit disposer d’une attestation valide et du marquage correspondant pour être utilisé.
