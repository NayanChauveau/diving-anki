  fr:
    question: Que signifie la référence CMAS sur une certification de plongeur, lorsqu’on prépare un séjour
      à l’étranger ?
    choices:
    - text: La formation se réfère à des standards internationaux de certification
      correct: true
    - text: La certification confère une profondeur légale identique dans tous les pays
      correct: false
    - text: La certification se substitue aux qualifications propres à chaque organisme
      correct: false
    explanation: La Confédération mondiale des activités subaquatiques (CMAS) définit des standards de
      formation. Une reconnaissance internationale facilite la présentation de compétences ; elle ne crée
      ni loi commune de profondeur ni substitution de tous les cursus. Les conditions de pratique restent
      celles du pays et de la structure d’accueil.
