      formation auxquels se réfère la certification. Cette correspondance aide à présenter ses compétences
      à une structure étrangère. L’autorisation de pratiquer dépend des règles du pays et de la structure
      ; les garanties d’assistance dépendent du contrat souscrit. La mention CMAS du brevet n’atteste
      pas ces deux éléments.