cards:
- id: n2-documents-caci-validite-medecin-001
  type: mcq
  deck: Réglementation
  levels:
  - N2
  tags:
  - chapitre::03
  - documents-environnement
  - angle::comparaison
  status: reviewed
  source_id: P061
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.5–7 (support pédagogique)
    - 'FFESSM CMPN — certificat médical et pratique, modalités 2026, sections contraintes particulières
      et recevabilité : https://medical.ffessm.fr/certificat-medical-et-pratique-de-l-activite ; vérifié
      le 2026-10-05'
    - 'FFESSM CMPN — plongée avec bouteille, CACI de moins d’un an : https://medical.ffessm.fr/je-veux-pratiquer-la-plongee-avec-bouteille-recycleur
      ; vérifié le 2026-10-05'
    - 'Revue : docs/reviews/03-documents-environnement.md'
    - 'Revue intégrale de clarté et d’unicité du 2026-10-06 : docs/reviews/CLARTE_GLOBALE.md'
    fact_check: pass
  fr:
    question: Pour un adulte pratiquant la plongée N2 FFESSM à l’air, hors cas médical particulier, quelle
      ancienneté maximale du CACI et quelle exigence de médecin s’appliquent ?
    choices:
    - text: Moins d’un an ; médecin fédéral non obligatoire
      correct: true
    - text: Moins d’un an ; médecin fédéral obligatoire
      correct: false
    - text: Moins de deux ans ; médecin fédéral non obligatoire
      correct: false
    - text: Moins de trois ans ; médecin fédéral obligatoire
      correct: false
    explanation: Le certificat d’absence de contre-indication (CACI) doit dater de moins d’un an au jour
      de la pratique. Dans ce cas général, un médecin autorisé à exercer, avec les compétences nécessaires
      à cet examen, peut le délivrer. Un médecin fédéral peut le faire, mais cette qualification n’est
      pas obligatoire.
- id: n2-documents-licence-affiliation-001
  type: mcq
  deck: Réglementation
  levels:
  - N2
