    - 'Conversion QCM et revue des choix du 2026-10-06 : docs/reviews/QCM_GLOBALE.md'
    - 'N3-S01 — MFT N3 FFESSM, décembre 2025, p.12, 14, 15 ; pertinence N3 revue le 2026-10-06 : docs/reviews/n3/00-reprises-n2.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.5–7 (support pédagogique)
    - 'FFESSM / Longitude 181 — Charte internationale du plongeur responsable, pendant la plongée : https://ffessm.fr/uploads/media/docs/0001/02/9f371fe9f28ac78676b403b3a3f7fadac26b709b.pdf
      ; vérifié le 2026-10-05'
    - 'Revue : docs/reviews/03-documents-environnement.md'
    fact_check: pass
  fr:
    question: Lors d’une plongée d’observation, quelle conduite adopter envers les organismes et les objets
      naturels, même s’ils semblent sans valeur ?
    choices:
    - text: Les laisser à leur place, sans prélèvement ni déplacement
      correct: true
    - text: Prélever seulement les éléments morts ou détachés
      correct: false
    - text: Déplacer seulement les organismes gênant le parcours
      correct: false
    explanation: Les laisser en place, sans prélèvement ni déplacement. Leur présence participe au milieu
      observé ; privilégier les images comme souvenir. C’est le principe de la Charte du plongeur responsable
      pour la plongée d’observation.
- id: n2-documents-decouverte-archeologique-001
  type: mcq
  deck: Réglementation
  levels:
  - N2
  - N3
  tags:
  - chapitre::03
  - documents-environnement
  - angle::comparaison
  status: reviewed
  source_id: P071
  review:
    sources:
    - 'N3-S01 — MFT N3 FFESSM, décembre 2025, p.12, 14, 15 ; pertinence N3 revue le 2026-10-06 : docs/reviews/n3/00-reprises-n2.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.5–7 (support pédagogique)
    - 'Ministère de la Culture — découverte de bien culturel maritime, laisser en place et déclaration
      sous 48 h : https://www.culture.gouv.fr/catalogue-des-demarches-et-subventions/declaration-renouvellement/decouverte-de-bien-culturel-maritime
      ; vérifié le 2026-10-05'
    - 'Revue : docs/reviews/03-documents-environnement.md'
    - 'Revue intégrale de clarté et d’unicité du 2026-10-06 : docs/reviews/CLARTE_GLOBALE.md'
    fact_check: pass
  fr:
    question: En mer en France, un plongeur découvre un objet présentant un intérêt archéologique. Que
      doit-il en faire, et dans quel délai doit-il déclarer la découverte ?
    choices:
    - text: Le laisser intact à sa place ; déclarer dans les 48 heures
      correct: true
    - text: Le laisser intact à sa place ; déclarer dans les sept jours
      correct: false
    - text: Le remonter pour l’identifier ; déclarer dans les 48 heures
      correct: false
    - text: Le déplacer pour le protéger du courant ; déclarer dans les sept jours
      correct: false
    explanation: Le bien doit rester en place et intact. La découverte doit être déclarée dans les 48
      heures au DRASSM, le Département des recherches archéologiques subaquatiques et sous-marines. La
      localisation et le contexte de découverte sont essentiels à sa connaissance et à sa conservation.
- id: n2-documents-peche-scaphandre-001
  type: mcq
  deck: Réglementation
  levels:
