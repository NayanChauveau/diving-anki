  fr:
    question: Lors d’une plongée en mer en France, un objet d’intérêt archéologique est découvert fortuitement.
      Au retour au premier port, quelle démarche respecter ?
    choices:
    - text: Le laisser intact sur place et déclarer la découverte dans les 48 heures
      correct: true
    - text: Le laisser intact sur place et déclarer la découverte dans les sept jours
      correct: false
    - text: Le ramener au port et déclarer la découverte dans les 48 heures
      correct: false
    explanation: Un bien culturel maritime doit être laissé en place sans atteinte. La déclaration se
      fait dans les 48 heures de la découverte ou de l’arrivée au premier port, auprès de l’autorité administrative
      ; le DRASSM est l’interlocuteur spécialisé. Photographier et noter la localisation préserve les
      renseignements utiles sans extraire l’objet.
