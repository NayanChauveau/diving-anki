  fr:
    question: Avant une plongée sur un site côtier français, dans quels textes vérifier les distances d’approche
      et limitations de vitesse imposées aux navires autour des plongeurs signalés ?
    choices:
    - text: La réglementation maritime du site, notamment les arrêtés de la préfecture maritime
      correct: true
    - text: Une distance nationale unique de 100 m applicable à tous les sites
      correct: false
    - text: Le règlement FFESSM des bateaux supports, identique sur toutes les façades
      correct: false
    explanation: Dans la réglementation maritime applicable au site, notamment les arrêtés de la préfecture
      maritime. Vérifier le périmètre concerné, la signalisation et les conditions d’approche et de vitesse
      prévues par le texte.
