  fr:
    question: En pêche sous-marine de loisir en mer en France, quelles règles s’appliquent à l’usage d’un
      scaphandre et à la présence d’un scaphandre avec un fusil sous-marin sur le même bateau ?
    choices:
    - text: Usage pour pêcher interdit ; présence des deux à bord interdite sauf dérogation préfectorale
      correct: true
    - text: Usage pour pêcher interdit ; présence des deux à bord autorisée si les utilisateurs sont différents
      correct: false
    - text: Usage pour pêcher autorisé hors réserve ; présence des deux à bord interdite sauf dérogation
        préfectorale
      correct: false
    explanation: L’interdiction concerne l’usage d’un équipement permettant de respirer sous l’eau sans
      revenir à la surface. Elle porte aussi sur sa présence à bord avec un engin de pêche sous-marine,
      sauf dérogation accordée par le préfet. Séparer les pratiquants ou ne pas utiliser le matériel en
      même temps ne supprime pas cette seconde règle.
