  tags:
  - chapitre::03
  - documents-environnement
  - angle::comparaison
  status: reviewed
  source_id: P063
  review:
    sources:
    - 'N3-S01 — MFT N3 FFESSM, décembre 2025, p.12, 14, 15 ; pertinence N3 revue le 2026-10-06 : docs/reviews/n3/00-reprises-n2.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.5–7 (support pédagogique)
    - 'FFESSM — prendre sa licence, affiliation et assurances : https://ffessm.fr/pratiquer/prendre-sa-licence-une-facon-d-etre-un-engagement
      ; vérifié le 2026-10-05'
    - 'Revue : docs/reviews/03-documents-environnement.md'
    - 'Revue intégrale de clarté et d’unicité du 2026-10-06 : docs/reviews/CLARTE_GLOBALE.md'
    fact_check: pass
  fr:
    question: Que prouve la licence FFESSM de pratique d’un plongeur pour sa période de validité, par
      opposition à son brevet et à son CACI ?
    choices:
    - text: Son affiliation fédérale pour la période de validité
      correct: true
    - text: Ses aptitudes d’exploration correspondant au niveau N2
      correct: false
    - text: Son absence de contre-indication médicale pour la plongée
      correct: false
    - text: La validation par le DP des paramètres de sa prochaine plongée
      correct: false
    explanation: La licence matérialise l’affiliation à la fédération et ouvre l’accès aux activités fédérales
      selon leurs conditions. Le brevet atteste des aptitudes ; le CACI relève de l’examen médical ; le
      DP fixe le cadre de la plongée.
- id: n2-documents-assurance-rc-aia-001
  type: mcq
  deck: Réglementation
  levels:
  - N2
  - N3
  tags:
  - chapitre::03
  - documents-environnement
  - angle::comparaison
  status: reviewed
  source_id: P064
  review:
    sources:
    - 'N3-S01 — MFT N3 FFESSM, décembre 2025, p.12, 14, 15 ; pertinence N3 revue le 2026-10-06 : docs/reviews/n3/00-reprises-n2.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.5–7 (support pédagogique)
    - 'FFESSM — prendre sa licence, affiliation et assurances : https://ffessm.fr/pratiquer/prendre-sa-licence-une-facon-d-etre-un-engagement
      ; vérifié le 2026-10-05'
    - 'Revue : docs/reviews/03-documents-environnement.md'
    - 'Revue intégrale de clarté et d’unicité du 2026-10-06 : docs/reviews/CLARTE_GLOBALE.md'
    fact_check: pass
  fr:
    question: Quelle répartition des risques distingue la responsabilité civile (RC) de la licence FFESSM
      et une assurance individuelle accident ?
    choices:
    - text: 'RC : dommages causés à autrui ; individuelle accident : propres blessures selon le contrat'
      correct: true
    - text: 'RC : propres blessures ; individuelle accident : dommages causés à autrui'
      correct: false
    - text: 'RC et individuelle accident : mêmes blessures personnelles, seuls les plafonds diffèrent'
      correct: false
    explanation: La RC concerne les dommages causés à autrui. L’assurance individuelle accident concerne
      les dommages corporels du plongeur lui-même selon les garanties souscrites, notamment en l’absence
      de tiers responsable. La couverture de ses propres blessures doit donc être vérifiée dans les garanties
      de son assurance individuelle.
