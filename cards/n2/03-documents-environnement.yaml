  fr:
    question: Lors d’une plongée d’observation, que recommande la Charte du plongeur responsable pour
      une coquille vide reposant sur le fond ?
    choices:
    - text: La laisser en place et la photographier sans la déplacer
      correct: true
    - text: La prélever comme souvenir après avoir vérifié qu’elle est vide
      correct: false
    - text: La déplacer pour la photographie puis la déposer ailleurs sur le fond
      correct: false
    explanation: La Charte demande de ne rien prélever, sauf des images, et de limiter le contact avec
      le milieu. Le caractère vide ou apparemment sans valeur ne justifie pas un prélèvement. Observer
      et photographier sans déplacer conserve l’élément dans son contexte.
