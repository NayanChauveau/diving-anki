  fr:
    question: Une inspection visuelle à jour suffit-elle à remplacer la requalification d’un bloc de plongée
      arrivée à échéance ?
    choices:
    - text: 'Non : l’inspection ne reporte pas la requalification exigible'
      correct: true
    - text: 'Oui : elle reporte l’échéance jusqu’à l’inspection suivante'
      correct: false
    - text: 'Oui : elle remplace la requalification si le bloc reste étanche'
      correct: false
    explanation: Non. L’inspection visuelle et la requalification sont deux contrôles distincts du suivi
      de la bouteille. Une inspection visuelle récente ne reporte pas, à elle seule, l’échéance de requalification
      applicable au bloc.
