    fact_check: pass
  fr:
    question: En milieu naturel, quel équipement respiratoire supplémentaire est requis pour un plongeur
      autonome ou encadré au-delà de 20 m ?
    choices:
    - text: Un dispositif permettant d’alimenter un équipier en gaz sans partager le même embout
      correct: true
    - text: Un seul embout à utiliser alternativement à deux
      correct: false
    - text: Un tuba suffisamment long pour atteindre la surface
      correct: false
    - text: La bouteille d’oxygène médical du bateau dans son gilet
      correct: false
    explanation: L’équipier doit pouvoir recevoir du gaz avec un embout distinct, par exemple un deuxième
      étage de secours. Cette exigence ne signifie pas que chaque plongeur N2 doit avoir les deux sorties
      indépendantes et deux détendeurs complets imposés à l’encadrant.
