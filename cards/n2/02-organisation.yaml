  fr:
    question: Pour une plongée organisée en France, quelle proposition réunit les exigences de préparation
      et de diffusion du plan de secours ?
    choices:
    - text: Un document écrit adapté au site, actualisé, connu du DP, des encadrants et des autonomes
      correct: true
    - text: Un document écrit adapté au site, actualisé, connu seulement du DP
      correct: false
    - text: Un document écrit standard, sans adaptation au site, connu de tous les plongeurs
      correct: false
    - text: Un document écrit adapté au site, sans actualisation nécessaire, connu des encadrants
      correct: false
    explanation: Le plan est écrit, adapté au lieu et à la plongée, régulièrement actualisé, et porté
      à la connaissance du DP, des encadrants et des autonomes. Il précise comment alerter les secours,
      leurs coordonnées et les procédures d’urgence en surface.
