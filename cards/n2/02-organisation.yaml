  fr:
    question: En France, quels paramètres doivent caractériser la plongée effectuée en commun par les
      membres d’une palanquée ?
    choices:
    - text: Durée, profondeur et trajet communs
      correct: true
    - text: Durée et trajet communs, profondeur choisie séparément
      correct: false
    - text: Profondeur et trajet communs, durée choisie séparément
      correct: false
    - text: Durée et profondeur communes, trajet choisi séparément
      correct: false
    explanation: Une palanquée effectue une plongée commune, avec les mêmes caractéristiques de durée,
      de profondeur et de trajet. Les plongeurs peuvent avoir des brevets ou des mélanges différents ;
      le groupe respecte alors les contraintes les plus restrictives.
