      2025 p. 9–10, 12 (pertinence).
    - 'Reprise N4 du 2026-10-12, lot 06_GUIDAGE : MFT GP-N4 mai 2026 p.17–18 ; A322-73/74 actuels déjà
      contrôlés ; recto, choix et corrigé relus ; identité conservée'
