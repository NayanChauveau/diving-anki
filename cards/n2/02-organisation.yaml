  fr:
    question: En France, quelle paire fait partie du matériel de secours à tenir disponible pour une plongée
      en établissement ?
    choices:
    - text: Eau douce potable et couverture isothermique
      correct: true
    - text: Eau douce potable et couverture chauffante électrique
      correct: false
    - text: Sérum physiologique et couverture isothermique
      correct: false
    explanation: Le matériel prévu comprend de l’eau douce potable et une couverture isothermique sur
      le lieu de mise à l’eau ou d’immersion. Une couverture chauffante ne remplace pas l’équipement nommé
      ; du sérum physiologique ne remplace pas l’eau potable destinée à être disponible. Les autres éléments
      de secours restent également requis.
