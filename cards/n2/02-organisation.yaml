  fr:
    question: Quelles exigences s’appliquent au plan de secours d’une plongée organisée en établissement
      en France ?
    choices:
    - text: Un document écrit adapté au site, actualisé, connu du DP, des encadrants et des autonomes
      correct: true
    - text: Un document écrit adapté au site, actualisé, connu seulement du DP
      correct: false
    - text: Un document écrit standard, sans adaptation au site, connu de tous les plongeurs
      correct: false
    - text: Un document écrit adapté au site, sans actualisation nécessaire, connu des encadrants
      correct: false
    explanation: Ce document écrit est adapté au lieu et à la plongée, régulièrement actualisé et connu
      du DP, des encadrants et des plongeurs autonomes. Il organise la réponse à l’accident ; une liste
      de numéros seule ne décrit pas tout le plan.
