  fr:
    question: En exploration encadrée en France, quelle mission relève de la fonction de guide de palanquée
      ?
    choices:
    - text: Conduire l’immersion et l’adapter aux aptitudes des plongeurs et aux circonstances
      correct: true
    - text: Fixer les paramètres du site et organiser le déclenchement des secours
      correct: false
    - text: Valider les compétences enseignées et certifier le brevet à l’issue de la formation
      correct: false
    explanation: Le guide est responsable du déroulement de l’immersion et adapte sa conduite au groupe
      et aux circonstances, dans le cadre fixé par le directeur de plongée (DP). Le DP organise l’activité,
      fixe les paramètres et veille à la sécurité. L’évaluation et la certification relèvent des fonctions
      d’enseignement et des conditions de délivrance du brevet, pas de la seule fonction de guide.
