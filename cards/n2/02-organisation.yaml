    - 'Revue factuelle et pédagogique : docs/reviews/02-organisation.md'
    fact_check: pass
  fr:
    question: Quelle exigence doit guider la capacité de l’ensemble d’oxygénothérapie disponible sur le
      site ?
    choices:
    - text: Permettre une prise en charge adaptée jusqu’à l’arrivée des secours médicaux
      correct: true
    - text: Pouvoir fonctionner exactement cinq minutes dans tous les cas
      correct: false
    - text: Contenir de l’air comprimé plutôt que de l’oxygène médical
      correct: false
    - text: Être choisi uniquement selon le nombre de brevets N2 présents
      correct: false
    explanation: La capacité doit tenir compte de la situation et de l’attente des secours, sans durée
      fixe universelle. L’équipement comporte les accessoires de distribution et de raccordement ; un
      ballon auto-remplisseur avec réserve d’oxygène et masques adaptés ainsi qu’un masque à haute concentration
      doivent aussi être disponibles. Cette carte ne prescrit pas de débit ni de technique d’administration.
