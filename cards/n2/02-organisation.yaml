  fr:
    question: Pour une plongée organisée en France, dans quel ensemble de situations un moyen de rappel
      des plongeurs depuis la surface est-il obligatoire ?
    choices:
    - text: Une plongée en milieu naturel au départ d’une embarcation
      correct: true
    - text: Une plongée en mer avec paliers, mais pas les autres plongées depuis une embarcation
      correct: false
    - text: Une plongée autonome depuis une embarcation, mais pas une plongée encadrée
      correct: false
    - text: Une plongée en mer depuis une embarcation, mais pas en lac depuis une embarcation
      correct: false
    explanation: Un moyen de rappel doit être disponible pour une plongée en milieu naturel au départ
      d’une embarcation. Le signal et le dispositif utilisés doivent être connus des plongeurs.
