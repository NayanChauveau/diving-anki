  fr:
    question: En milieu naturel, un plongeur PA20 peut-il se contenter de regarder l’ordinateur de son
      équipier pour contrôler sa plongée et sa remontée ?
    choices:
    - text: 'Non : il doit disposer de ses propres équipements de contrôle'
      correct: true
    - text: 'Oui : à condition d’avoir exactement le même brevet'
      correct: false
    - text: 'Oui : si l’équipier reste toujours devant lui'
      correct: false
    - text: 'Oui : dès que la profondeur reste inférieure à 20 m'
      correct: false
    explanation: Chaque plongeur autonome et chaque plongeur encadré au-delà de 20 m doit pouvoir contrôler
      ses caractéristiques personnelles de plongée et de remontée. Un ordinateur personnel est une solution
      courante ; le texte exige la fonction de contrôle, pas une marque ni un modèle particulier. La pression
      du bloc doit aussi être indiquée par un manomètre ou un système équivalent. La présence d’un guide
      ne dispense pas non plus un plongeur encadré au-delà de 20 m de cet équipement personnel.
