  fr:
    question: Pour une plongée N2 organisée en France par un établissement, quelle fonction est chargée
      de fixer les paramètres prévus, notamment la profondeur et la durée ?
    choices:
    - text: Le directeur de plongée (DP)
      correct: true
    - text: Le guide de palanquée, au seul titre de guide
      correct: false
    - text: Les plongeurs autonomes, indépendamment du DP
      correct: false
    - text: L’encadrant le plus qualifié présent, indépendamment de sa fonction
      correct: false
    explanation: Le directeur de plongée fixe les caractéristiques de la plongée. Le guide ou les équipiers
      autonomes organisent le déroulement de leur plongée à l’intérieur de ce cadre.
