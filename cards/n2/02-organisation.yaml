  fr:
    question: En milieu naturel, un plongeur PA20 peut-il se contenter de regarder l’ordinateur de son
      équipier pour contrôler sa plongée et sa remontée ?
    choices:
    - text: 'Non : chacun doit disposer de ses équipements de contrôle personnels'
      correct: true
    - text: 'Oui : un ordinateur commun suffit avec la même profondeur et la même durée'
      correct: false
    - text: 'Oui : un ordinateur commun suffit si les plongées précédentes ont été identiques'
      correct: false
    - text: 'Oui : un ordinateur commun suffit si les deux plongeurs restent sans palier obligatoire'
      correct: false
    explanation: Chaque plongeur autonome et chaque plongeur encadré au-delà de 20 m doit disposer de
      ses équipements personnels pour contrôler sa plongée et sa remontée. Un ordinateur personnel est
      une solution courante. Le bloc doit aussi avoir un manomètre ou un système équivalent pour indiquer
      sa pression. L’ordinateur du guide ou de l’équipier ne remplace pas le contrôle personnel requis.
