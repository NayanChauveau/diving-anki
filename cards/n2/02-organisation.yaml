  fr:
    question: En milieu naturel en France, quelle est la configuration respiratoire minimale exigée pour
      la personne qui encadre la palanquée ?
    choices:
    - text: Deux sorties indépendantes, chacune équipée d’un détendeur complet
      correct: true
    - text: Deux sorties indépendantes, avec un seul détendeur complet monté
      correct: false
    - text: Une sortie équipée d’un premier étage et de deux deuxièmes étages
      correct: false
    - text: Une sortie équipée d’un premier étage et de trois deuxièmes étages
      correct: false
    explanation: Un détendeur complet comporte un premier étage et un deuxième étage. L’encadrant en possède
      deux, chacun alimenté par une sortie indépendante. Deux deuxièmes étages raccordés au même premier
      étage ne forment qu’un seul ensemble avec un seul premier étage.
