  fr:
    question: En France, un bateau support organise une plongée en mer et dispose d’un téléphone avec
      du réseau. Quelle exigence de communication reste applicable ?
    choices:
    - text: Une radio VHF doit être disponible à bord
      correct: true
    - text: Le téléphone dispense de VHF tant que le réseau est disponible
      correct: false
    - text: La VHF n’est exigée que si le bateau s’éloigne de la côte
      correct: false
    - text: La VHF n’est exigée que si des paliers sont prévus
      correct: false
    explanation: Une radio VHF est nécessaire pour une plongée en mer au départ d’une embarcation support.
      La présence d’un téléphone avec du réseau ne remplace pas cette exigence.
