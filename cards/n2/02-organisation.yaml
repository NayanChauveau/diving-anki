  fr:
    question: En France, une plongée se déroule en mer depuis un bateau support. Quel moyen de communication
      avec les secours est nécessaire ?
    choices:
    - text: Une VHF ; le téléphone ne la remplace pas dans ce contexte
      correct: true
    - text: Un téléphone portable remplace la VHF dès que le réseau est disponible
      correct: false
    - text: Une VHF est nécessaire seulement lorsque le bateau navigue au large
      correct: false
    - text: Une VHF est nécessaire seulement si la plongée prévoit des paliers obligatoires
      correct: false
    explanation: 'Un moyen permettant de prévenir les secours doit être disponible. Pour une plongée en
      mer au départ d’une embarcation support, une VHF est nécessaire : la présence d’un téléphone ne
      supprime pas cette obligation.'
