  fr:
    question: En milieu naturel, à quelle échelle le parachute de palier est-il obligatoire ?
    choices:
    - text: Chaque palanquée doit en disposer
      correct: true
    - text: Il suffit d’un seul parachute sur le bateau pour toutes les palanquées
      correct: false
    - text: Il est obligatoire uniquement si un palier de décompression est prévu
      correct: false
    - text: Le texte impose un parachute à chaque plongeur sans exception
      correct: false
    explanation: L’obligation porte sur chaque palanquée. Le terme « parachute de palier » ne limite pas
      cette obligation aux plongées prévoyant des paliers. Cette carte n’enseigne pas la technique de
      déploiement.
