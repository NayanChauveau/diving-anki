    - 'Revue factuelle et pédagogique : docs/reviews/02-organisation.md'
    fact_check: pass
  fr:
    question: En milieu naturel, une plongée se déroule depuis une embarcation. Quel dispositif doit permettre
      de joindre les plongeurs immergés pour les faire revenir ?
    choices:
    - text: Un moyen de rappel depuis la surface
      correct: true
    - text: Seulement un téléphone laissé sur le bateau
      correct: false
    - text: Seulement la fiche de sécurité du DP
      correct: false
    - text: Un message envoyé après la sortie de l’eau
      correct: false
    explanation: Un moyen permettant de rappeler les plongeurs en immersion doit être disponible dans
      ce contexte. Le signal et le dispositif utilisés doivent être connus des plongeurs ; cette carte
      ne fixe pas un signal universel.
- id: n2-organisation-tables-assistance-001
  type: mcq
  deck: Réglementation::Organisation
  levels:
