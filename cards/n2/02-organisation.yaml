  - organisation
  - angle::rappel
  status: reviewed
  source_id: P028
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.4–5 (support pédagogique)
    - 'Code du sport — A322-73, vérifié le 2026-10-05 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000052464714'
    - 'Revue factuelle et pédagogique : docs/reviews/02-organisation.md'
    fact_check: pass
  fr:
    question: Qu’est-ce qui définit une palanquée en plongée ?
    choices:
    - text: Des plongeurs effectuant ensemble une plongée de mêmes durée, profondeur et trajet
      correct: true
    - text: Des plongeurs possédant exactement le même brevet
      correct: false
    - text: Tous les plongeurs présents sur le même bateau
      correct: false
    - text: Des plongeurs utilisant obligatoirement le même mélange
      correct: false
    explanation: Une palanquée effectue une plongée commune. Des brevets ou des mélanges différents n’empêchent
      pas de former une palanquée ; leurs contraintes doivent toutefois être respectées.
- id: n2-organisation-melanges-contraintes-001
  type: mcq
  deck: Réglementation::Organisation
  levels:
  - N2
  tags:
  - chapitre::02
  - organisation
  - angle::application
  status: reviewed
  source_id: P030
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.4–5 (support pédagogique)
    - 'Code du sport — A322-73, vérifié le 2026-10-05 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000052464714'
    - 'Revue factuelle et pédagogique : docs/reviews/02-organisation.md'
    fact_check: pass
  fr:
    question: En France, deux plongeurs d’une même palanquée respirent des mélanges différents. Comment
      choisir les limites de leur plongée ?
    choices:
    - text: Respecter les contraintes de chaque mélange et les aptitudes les plus restrictives
      correct: true
    - text: Retenir les limites du mélange permettant d’aller le plus profond
      correct: false
    - text: Faire la moyenne des profondeurs autorisées
      correct: false
    - text: Appliquer uniquement les limites du plongeur le plus expérimenté
      correct: false
    explanation: Le groupe ne peut dépasser les conditions accessibles au mélange le plus contraignant
      ou aux aptitudes les plus restrictives. Le mélange d’un équipier ne donne pas aux autres ses possibilités
      ; aucune formation aux mélanges n’est déduite du N2.
- id: n2-organisation-dp-parametres-001
  type: mcq
  deck: Réglementation::Organisation
