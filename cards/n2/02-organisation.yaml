  fr:
    question: En exploration PE40 en milieu naturel, quel est le rôle du guide de palanquée pendant l’immersion
      ?
    choices:
    - text: Adapter la conduite de la plongée aux circonstances et aux aptitudes, dans le cadre du DP
      correct: true
    - text: Appliquer le profil prévu sans l’adapter une fois l’immersion commencée
      correct: false
    - text: Adapter le profil aux circonstances en s’affranchissant des limites fixées par le DP
      correct: false
    - text: Assurer l’orientation en laissant chaque plongeur gérer individuellement profondeur et durée
      correct: false
    explanation: Le guide est responsable du déroulement de la plongée encadrée. Il adapte la conduite
      du groupe dans le cadre fixé par le DP. La présence du guide ne dispense pas chaque plongeur de
      surveiller son matériel et de signaler une difficulté.
- id: n2-organisation-autonomie-collective-001
  type: mcq
  deck: Réglementation::Organisation
