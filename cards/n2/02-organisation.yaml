  fr:
    question: En milieu naturel, quel équipement répond à l’exigence de retour et de maintien en surface
      pour un plongeur en circuit ouvert ?
    choices:
    - text: Un système individuel gonflable au gaz comprimé permettant de regagner et tenir la surface
      correct: true
    - text: Un système individuel gonflable uniquement à la bouche permettant de tenir la surface
      correct: false
    - text: Un système gonflable au gaz comprimé porté seulement par le guide
      correct: false
    - text: Un parachute commun à la palanquée tient lieu de système gonflable individuel
      correct: false
    explanation: Chaque plongeur en circuit ouvert doit disposer d’un système gonflable au gaz comprimé
      pour regagner la surface et s’y maintenir. Le gilet de stabilisation en est l’exemple habituel.
