  fr:
    question: En exploration PE40 en milieu naturel, quel est le rôle du guide de palanquée pendant l’immersion
      ?
    choices:
    - text: Conduire la plongée en l’adaptant aux circonstances et aux aptitudes des plongeurs
      correct: true
    - text: Fixer seul toutes les règles de l’établissement à la place du DP
      correct: false
    - text: Garantir l’absence de tout accident quelles que soient les circonstances
      correct: false
    - text: Prendre en charge uniquement l’orientation, sans tenir compte des plongeurs
      correct: false
    explanation: Le guide est responsable du déroulement de la plongée encadrée. Il adapte la conduite
      du groupe dans le cadre fixé par le DP. La présence du guide ne dispense pas chaque plongeur de
      surveiller son matériel et de signaler une difficulté.
- id: n2-organisation-autonomie-collective-001
  type: mcq
  deck: Réglementation::Organisation
  levels:
  - N2
  tags:
  - chapitre::02
  - organisation
  - angle::application
  status: reviewed
  source_id: P039
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.4–5 (support pédagogique)
    - 'FFESSM — MFT N2, mai 2026, p.3 et compétences PA20 p.5, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Revue factuelle et pédagogique : docs/reviews/02-organisation.md'
    fact_check: pass
  fr:
    question: En exploration PA20, un équipier signale une difficulté. L’absence de guide permet-elle
      aux autres de poursuivre sans en tenir compte ?
    choices:
    - text: 'Non : les équipiers doivent prendre en compte la difficulté et assurer leur sécurité collective'
      correct: true
    - text: 'Oui : chacun n’est responsable que de sa propre plongée'
      correct: false
    - text: 'Oui : si l’équipier possède aussi le N2'
      correct: false
    - text: 'Oui : tant que personne n’a dépassé 20 m'
      correct: false
    explanation: L’autonomie s’exerce en palanquée, pas comme des plongées individuelles juxtaposées.
      Le PA20 apprend notamment à planifier avec ses équipiers et à intervenir auprès d’un plongeur en
      difficulté. Cette carte ne remplace pas l’apprentissage pratique de l’assistance.
- id: n2-organisation-plan-secours-001
  type: mcq
  deck: Réglementation::Organisation
  levels:
  - N2
  tags:
