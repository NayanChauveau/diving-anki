  fr:
    question: En milieu naturel en France, quelle est l’exigence minimale de fourniture de gaz à un équipier
      pour chaque plongeur autonome, et pour chaque plongeur encadré à plus de 20 m ?
    choices:
    - text: Un dispositif fournissant du gaz à un équipier par un embout distinct
      correct: true
    - text: Deux détendeurs complets sur deux sorties indépendantes pour chaque plongeur
      correct: false
    - text: Un embout unique que les deux plongeurs utilisent alternativement
      correct: false
    - text: Un équipement de gaz uniquement chez le guide, quand la palanquée est encadrée
      correct: false
    explanation: Chaque plongeur concerné doit pouvoir fournir du gaz à un équipier sans partager le même
      embout, par exemple avec un deuxième étage de secours. Deux sorties indépendantes et deux détendeurs
      complets constituent l’exigence propre à l’encadrant, pas le minimum imposé à chaque plongeur N2.
