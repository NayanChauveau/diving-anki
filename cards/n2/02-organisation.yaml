    - 'Code du sport — A322-73, vérifié le 2026-10-05 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000052464714'
    - 'Revue factuelle et pédagogique : docs/reviews/02-organisation.md'
    fact_check: pass
  fr:
    question: En France, deux plongeurs d’une même palanquée respirent des mélanges différents. Comment
      choisir les limites de leur plongée ?
    choices:
    - text: Les limites des aptitudes les plus restrictives et du mélange le plus contraignant
      correct: true
    - text: Les limites des aptitudes les plus restrictives, le mélange étant traité individuellement
      correct: false
    - text: Les limites du mélange le plus contraignant, les aptitudes étant traitées individuellement
      correct: false
    - text: Les limites choisies par l’encadrant, même si un mélange est plus restrictif
      correct: false
    explanation: La palanquée respecte à la fois les aptitudes les plus restrictives et les contraintes
      du mélange le plus limitant. Les possibilités d’un équipier ne s’étendent pas aux autres membres
      du groupe.
- id: n2-organisation-dp-parametres-001
  type: mcq
  deck: Réglementation::Organisation
