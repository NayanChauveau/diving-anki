    question: Quel document réglementaire doit être disponible, en plus du plan de secours, pour transmettre
      les renseignements relatifs à une victime de plongée ?
    choices:
    - text: La fiche d’évacuation
      correct: true
    - text: La fiche de sécurité de la palanquée
      correct: false
    - text: Le carnet de plongée de la victime
      correct: false
    - text: Le plan de secours du site
      correct: false
    explanation: La fiche d’évacuation accompagne la transmission aux secours des informations utiles
      à la prise en charge de la victime. Un modèle réglementaire est prévu pour cette transmission.
