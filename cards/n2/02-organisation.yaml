  fr:
    question: Dans la formation PA20 FFESSM, quelle responsabilité collective s’ajoute à la maîtrise de
      sa propre plongée ?
    choices:
    - text: Planifier en commun et être capable d’intervenir auprès d’un équipier en difficulté
      correct: true
    - text: Planifier en commun, l’assistance restant une compétence propre au guide
      correct: false
    - text: Surveiller son matériel, le contrôle du matériel des équipiers relevant seulement du DP
      correct: false
    - text: Maîtriser sa remontée, l’assistance étant exigée seulement pour l’aptitude PE40
      correct: false
    explanation: Les équipiers PA20 planifient ensemble leur plongée et participent à leur sécurité collective.
      Leur formation comprend notamment l’intervention auprès d’un équipier en difficulté.
