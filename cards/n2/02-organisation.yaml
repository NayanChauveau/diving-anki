    fact_check: pass
  fr:
    question: Une fiche indique les membres d’une palanquée, leurs aptitudes et fonctions, puis les paramètres
      prévus et réellement réalisés. De quel document s’agit-il ?
    choices:
    - text: La fiche de sécurité établie par le directeur de plongée
      correct: true
    - text: La licence individuelle du plongeur
      correct: false
    - text: Le certificat médical de chaque participant
      correct: false
    - text: La fiche d’évacuation d’une victime uniquement
      correct: false
    explanation: La fiche de sécurité décrit les participants et la plongée prévue puis réalisée. Elle
      est conservée un an par l’établissement. Elle ne se confond pas avec la fiche d’évacuation destinée
      à transmettre les informations concernant une victime.
