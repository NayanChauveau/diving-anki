    - 'Code du sport — A322-72, vérifié le 2026-10-05 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000025393876'
    - 'Revue factuelle et pédagogique : docs/reviews/02-organisation.md'
    fact_check: pass
  fr:
    question: Dans une plongée N2 organisée en établissement en France, qui fixe les caractéristiques
      de la plongée ?
    choices:
    - text: Le directeur de plongée (DP)
      correct: true
    - text: Le plongeur ayant le plus grand nombre de plongées
      correct: false
    - text: Chaque plongeur séparément après l’immersion
      correct: false
    - text: Le propriétaire du bateau, quelle que soit sa qualification
      correct: false
    explanation: Le DP fixe le cadre de la plongée, notamment les paramètres prévus. Le briefing et les
      décisions de la palanquée doivent respecter ce cadre ; une aptitude est une limite de capacité,
      pas une permission de choisir librement tous les paramètres.
- id: n2-organisation-dp-secours-001
  type: mcq
  deck: Réglementation::Organisation
