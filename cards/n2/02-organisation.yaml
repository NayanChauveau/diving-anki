  fr:
    question: Pour une plongée organisée à l’air, comment la bouteille d’air de secours doit-elle être
      équipée ?
    choices:
    - text: Une bouteille d’air de secours équipée de son détendeur
      correct: true
    - text: Une bouteille d’air de secours sans détendeur, avec transfert prévu depuis un autre bloc
      correct: false
    - text: Une bouteille d’oxygène médical suffit à remplacer le bloc d’air de secours
      correct: false
    - text: Un bloc personnel supplémentaire non équipé suffit comme bloc de secours
      correct: false
    explanation: La bouteille d’air de secours doit être équipée de son détendeur. Pour une plongée avec
      d’autres mélanges, le matériel de secours en gaz doit être adapté à la plongée et prévu par le plan
      de secours ; le stock d’oxygène médical a une autre fonction.
