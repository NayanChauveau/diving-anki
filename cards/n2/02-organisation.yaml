  fr:
    question: Quelle exigence doit guider la capacité de l’ensemble d’oxygénothérapie disponible sur le
      site ?
    choices:
    - text: Le besoin de prise en charge adaptée jusqu’à l’arrivée des secours médicaux
      correct: true
    - text: Le besoin de prise en charge pendant le retour au point de départ seulement
      correct: false
    - text: Le besoin de prise en charge jusqu’au premier appel aux secours seulement
      correct: false
    - text: Une autonomie fixe, identique quel que soit le délai d’arrivée des secours
      correct: false
    explanation: La réserve d’oxygène doit permettre une prise en charge adaptée jusqu’à l’arrivée des
      secours médicaux. Sa capacité dépend donc notamment du délai attendu. L’ensemble comprend les accessoires
      de distribution et de raccordement ; un ballon auto-remplisseur avec réserve d’oxygène et masques
      adaptés, ainsi qu’un masque à haute concentration, doivent aussi être disponibles.
