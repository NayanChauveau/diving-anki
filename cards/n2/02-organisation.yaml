    - 'Revue factuelle et pédagogique : docs/reviews/02-organisation.md'
    fact_check: pass
  fr:
    question: Qui est responsable de l’organisation de la sécurité et du déclenchement des secours sur
      le site d’une plongée organisée en établissement ?
    choices:
    - text: Le directeur de plongée
      correct: true
    - text: Le guide de palanquée, même lorsqu’un DP distinct organise le site
      correct: false
    - text: Le responsable du bateau, même lorsqu’un DP distinct organise la plongée
      correct: false
    - text: L’encadrant le plus qualifié du site, même s’il n’est pas le DP
      correct: false
    explanation: Le DP est responsable techniquement de l’organisation, des dispositions de sécurité et
      du déclenchement des secours. Cela n’efface pas les responsabilités du guide pendant la plongée
      ni la vigilance de chaque plongeur.
- id: n2-organisation-fiche-securite-001
  type: mcq
