  fr:
    question: Dans une palanquée autonome PA20 sans guide conduisant la plongée, quelle compétence d’assistance
      chacun doit-il avoir acquise ?
    choices:
    - text: Intervenir et porter assistance à un équipier en difficulté
      correct: true
    - text: Intervenir en relais d’un guide qui conduit la palanquée
      correct: false
    - text: Signaler au guide la difficulté et suivre sa conduite de la palanquée
      correct: false
    explanation: Les équipiers PA20 organisent leur plongée en commun et sont formés à intervenir et porter
      assistance à un équipier en difficulté. En PE40 encadré, l’intervention en relais s’inscrit dans
      une palanquée conduite par un guide. L’autonomie implique la participation de chacun à la sécurité
      collective.
