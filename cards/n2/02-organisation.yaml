  fr:
    question: Quels éléments doivent notamment être disponibles sur le lieu de mise à l’eau parmi le matériel
      de secours ?
    choices:
    - text: De l’eau douce potable et une couverture isothermique
      correct: true
    - text: De l’eau douce potable, la couverture isothermique étant facultative
      correct: false
    - text: Une couverture isothermique, l’eau potable étant facultative
      correct: false
    - text: De l’eau potable et une couverture isothermique seulement si des paliers sont prévus
      correct: false
    explanation: L’eau douce potable et la couverture isothermique doivent être disponibles sur le lieu
      de mise à l’eau ou d’immersion, parmi le matériel de secours.
