    - 'Revue factuelle et pédagogique : docs/reviews/02-organisation.md'
    fact_check: pass
  fr:
    question: En France, quelles informations doivent notamment figurer sur la fiche de sécurité établie
      par le DP ?
    choices:
    - text: Identités, aptitudes, fonctions et paramètres prévus puis réalisés
      correct: true
    - text: Identités, aptitudes, fonctions et paramètres prévus seulement
      correct: false
    - text: Identités, aptitudes, fonctions et paramètres réalisés seulement
      correct: false
    explanation: La fiche permet de retrouver les membres de la palanquée et de comparer les paramètres
      prévus aux paramètres réellement réalisés. Les deux séries de paramètres sont nécessaires ; noter
      uniquement la prévision ou uniquement la réalisation ne suffit pas. La fiche est conservée un an
      par l’établissement.
