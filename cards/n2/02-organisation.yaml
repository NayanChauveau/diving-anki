  fr:
    question: Pour une plongée organisée à l’air en France, quelle configuration répond à l’exigence de
      bouteille de secours disponible sur le site ?
    choices:
    - text: Un bloc d’air de secours avec son détendeur monté
      correct: true
    - text: Un bloc d’air de secours sans détendeur, avec transfert prévu depuis un bloc personnel
      correct: false
    - text: Un bloc d’oxygène médical en remplacement du bloc d’air de secours
      correct: false
    - text: Un bloc d’air personnel supplémentaire sans détendeur monté
      correct: false
    explanation: La bouteille d’air de secours doit être équipée de son détendeur. Pour une plongée avec
      d’autres mélanges, le matériel de secours en gaz doit être adapté à la plongée et prévu par le plan
      de secours ; le stock d’oxygène médical a une autre fonction.
