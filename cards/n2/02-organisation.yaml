  fr:
    question: En France, le DP limite une exploration PE40 à 30 m. Pendant l’immersion, les circonstances
      justifient de rester à 20 m. Quelle décision relève du guide ?
    choices:
    - text: Réduire la profondeur à 20 m en adaptant la conduite au groupe
      correct: true
    - text: Maintenir l’objectif de 30 m en laissant au DP toute adaptation du profil
      correct: false
    - text: Porter l’objectif à 40 m si les aptitudes PE40 du groupe le permettent
      correct: false
    explanation: Le guide est responsable du déroulement de la plongée et adapte sa conduite aux circonstances
      et aux aptitudes. Il peut retenir moins profond que la limite fixée ; celle-ci n’est pas une profondeur
      à atteindre. Il ne peut pas dépasser le cadre du DP en invoquant la limite générale de PE40.
