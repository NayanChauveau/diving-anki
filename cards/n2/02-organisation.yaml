  fr:
    question: Pour une plongée avec DP organisée en France par un établissement, quelle fonction est chargée
      de fixer les paramètres prévus, notamment la profondeur et la durée ?
    choices:
    - text: Le directeur de plongée
      correct: true
    - text: Le guide de palanquée
      correct: false
    - text: Les équipiers autonomes
      correct: false
    - text: L’encadrant le plus qualifié présent
      correct: false
    explanation: Le directeur de plongée fixe les caractéristiques de la plongée. Le guide ou les équipiers
      autonomes organisent le déroulement de leur plongée à l’intérieur de ce cadre.
