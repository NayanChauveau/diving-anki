  fr:
    question: En milieu naturel en France, quelle exigence minimale s’applique au système permettant à
      chaque plongeur en circuit ouvert de regagner la surface et de s’y maintenir ?
    choices:
    - text: Un système individuel gonflable au gaz comprimé
      correct: true
    - text: Un système individuel gonflable uniquement à la bouche
      correct: false
    - text: Un système au gaz comprimé porté seulement par le guide
      correct: false
    - text: Un parachute gonflable commun à la palanquée
      correct: false
    explanation: Chaque plongeur en circuit ouvert doit disposer d’un système gonflable au gaz comprimé
      pour regagner la surface et s’y maintenir. Le gilet de stabilisation en est l’exemple habituel.
