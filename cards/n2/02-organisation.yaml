  fr:
    question: En milieu naturel en France, le jeu de tables collectif doit être disponible sur le lieu
      de mise à l’eau ou d’immersion dès que la profondeur prévue dépasse quel seuil ?
    choices:
    - text: 6 m
      correct: true
    - text: 10 m
      correct: false
    - text: 20 m
      correct: false
    - text: 40 m
      correct: false
    explanation: 'Au-delà de 6 m, un jeu de tables doit être disponible sur le lieu de mise à l’eau ou
      d’immersion : par exemple à bord du bateau support, ou au point de départ pour une plongée du bord.
      C’est du matériel collectif d’assistance mis à disposition par l’organisation, pas un jeu à emporter
      sous l’eau par chaque plongeur. L’équipement personnel servant à contrôler sa plongée et sa remontée
      relève d’une obligation distincte.'
