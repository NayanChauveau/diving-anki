    fact_check: pass
  fr:
    question: En France, une plongée se déroule en mer depuis un bateau support. Quel moyen de communication
      avec les secours est nécessaire ?
    choices:
    - text: Une radio VHF
      correct: true
    - text: Un téléphone portable suffit toujours à remplacer la VHF
      correct: false
    - text: Une tablette de notation immergeable
      correct: false
    - text: Un parachute de palier comme seul moyen d’alerte
      correct: false
    explanation: 'Un moyen permettant de prévenir les secours doit être disponible. Pour une plongée en
      mer au départ d’une embarcation support, une VHF est nécessaire : la présence d’un téléphone ne
      supprime pas cette obligation.'
- id: n2-organisation-eau-couverture-001
  type: mcq
  deck: Réglementation::Organisation
  levels:
