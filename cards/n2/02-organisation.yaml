    question: En France, quelle liste complète de fonctions doit connaître le plan de secours d’une plongée
      en établissement ?
    choices:
    - text: Le DP, les personnes encadrant les palanquées et les plongeurs autonomes
      correct: true
    - text: Le DP, les personnes encadrant les palanquées et les responsables légaux des mineurs
      correct: false
    - text: Le DP, les plongeurs autonomes et les responsables légaux des mineurs
      correct: false
    explanation: 'Le plan écrit, adapté au site et régulièrement actualisé, est porté à la connaissance
      du directeur de plongée, des encadrants et des autonomes. L’autorisation éclairée du responsable
      légal d’un mineur est une autre condition : elle ne remplace pas l’information des acteurs de cette
      liste.'
