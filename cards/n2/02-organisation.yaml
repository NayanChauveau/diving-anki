  fr:
    question: Dans une plongée avec DP organisée en France par un établissement, quelle fonction porte
      la responsabilité technique de l’organisation de la sécurité et du déclenchement des secours ?
    choices:
    - text: Le directeur de plongée
      correct: true
    - text: Le guide de palanquée
      correct: false
    - text: Le chef de bord
      correct: false
    - text: L’encadrant le plus qualifié présent
      correct: false
    explanation: Le DP est responsable de l’organisation de la sécurité et du déclenchement des secours
      sur le site. Le guide conduit la palanquée pendant l’immersion ; chaque plongeur reste attentif
      à sa propre situation et à ses équipiers.
