  fr:
    question: Qu’est-ce qui définit une palanquée en plongée ?
    choices:
    - text: La même durée, la même profondeur et le même trajet, avec des mélanges éventuellement différents
      correct: true
    - text: La même durée et le même trajet, avec des profondeurs individuelles différentes
      correct: false
    - text: La même profondeur et le même trajet, avec des durées individuelles différentes
      correct: false
    - text: La même durée et la même profondeur, avec des trajets individuels différents
      correct: false
    explanation: Une palanquée effectue une plongée commune. Des brevets ou des mélanges différents n’empêchent
      pas de former une palanquée ; leurs contraintes doivent toutefois être respectées.
- id: n2-organisation-melanges-contraintes-001
  type: mcq
  deck: Réglementation::Organisation
