  fr:
    question: En France, dans quel contexte un moyen de rappel des plongeurs immergés depuis la surface
      est-il exigé ?
    choices:
    - text: Pour une plongée en milieu naturel au départ d’une embarcation
      correct: true
    - text: Seulement pour une plongée en mer au départ d’une embarcation
      correct: false
    - text: Seulement pour une plongée avec paliers au départ d’une embarcation
      correct: false
    - text: Seulement pour une plongée autonome au départ d’une embarcation
      correct: false
    explanation: Un moyen de rappel doit être disponible pour une plongée en milieu naturel au départ
      d’une embarcation. Le signal et le dispositif utilisés doivent être connus des plongeurs.
