  fr:
    question: En France, une palanquée regroupe des plongeurs aux aptitudes différentes utilisant des
      mélanges différents. Quelles contraintes fixent les limites de tout le groupe ?
    choices:
    - text: Les aptitudes les plus restrictives et le mélange le plus contraignant
      correct: true
    - text: Les aptitudes les plus restrictives ; chaque mélange limite seulement son utilisateur
      correct: false
    - text: Le mélange le plus contraignant ; chaque aptitude limite seulement son titulaire
      correct: false
    - text: Les aptitudes et le mélange du plongeur qui conduit le groupe
      correct: false
    explanation: La palanquée respecte à la fois les aptitudes les plus restrictives et les contraintes
      du mélange le plus limitant. Les possibilités d’un équipier ne s’étendent pas aux autres membres
      du groupe.
