    - 'Code du sport — A322-78, vérifié le 2026-10-05 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000025393863'
    - 'Revue factuelle et pédagogique : docs/reviews/02-organisation.md'
    fact_check: pass
  fr:
    question: À quoi sert le plan de secours disponible sur le lieu de mise à l’eau ou d’immersion ?
    choices:
    - text: À préciser l’alerte, les coordonnées des secours et les procédures d’urgence en surface
      correct: true
    - text: À remplacer le briefing de toutes les palanquées
      correct: false
    - text: À enregistrer uniquement les profondeurs maximales des plongeurs
      correct: false
    - text: À autoriser une plongée sans matériel de secours
      correct: false
    explanation: Ce document écrit est adapté au lieu et à la plongée, régulièrement actualisé et connu
      du DP, des encadrants et des plongeurs autonomes. Il organise la réponse à l’accident ; une liste
      de numéros seule ne décrit pas tout le plan.
