    - 'Revue factuelle et pédagogique : docs/reviews/02-organisation.md'
    fact_check: pass
  fr:
    question: En milieu naturel, à partir de quelle condition de profondeur un jeu de tables de décompression
      doit-il être disponible comme matériel d’assistance ?
    choices:
    - text: Lorsque la plongée dépasse 6 m
      correct: true
    - text: Seulement au-delà de 20 m
      correct: false
    - text: Uniquement si personne ne possède d’ordinateur
      correct: false
    - text: Uniquement lorsqu’un palier obligatoire est prévu
      correct: false
    explanation: 'Le jeu de tables est requis au-delà de 6 m en milieu naturel. Une tablette de notation
      immergeable figure également dans le matériel d’assistance. Il s’agit du matériel disponible pour
      l’organisation : chaque plongeur n’est pas tenu de porter personnellement ce jeu de tables.'
- id: n2-organisation-gilet-surface-001
  type: mcq
  deck: Réglementation::Organisation
