    question: En milieu naturel en France, lors d’une plongée en établissement, deux autonomes suivent
      le même profil. Quelle répartition répond à l’obligation de contrôler les caractéristiques personnelles
      de leur plongée et de leur remontée ?
    choices:
    - text: Chacun porte ses équipements de contrôle, même si leurs profils sont identiques
      correct: true
    - text: Un équipier porte les équipements communs, si leurs plongées précédentes sont identiques
      correct: false
    - text: Un équipier porte les équipements communs, si tous deux restent sans palier obligatoire
      correct: false
    explanation: Chaque autonome doit disposer de ses équipements de contrôle personnels ; le même profil
      ne dispense pas l’autre de cette obligation. Un ordinateur personnel est une solution courante.
      La règle s’applique aussi à chaque plongeur encadré au-delà de 20 m. Le contrôle de pression de
      la bouteille par manomètre ou système équivalent est une exigence distincte.
