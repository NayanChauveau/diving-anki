  fr:
    question: Pendant une exploration PE40 en milieu naturel, comment le guide doit-il conduire la palanquée
      dans le cadre fixé par le DP ?
    choices:
    - text: Adapter la conduite aux circonstances et aux aptitudes, dans les limites fixées par le DP
      correct: true
    - text: Adapter la conduite aux circonstances, dans les limites PE40 même au-delà de celles du DP
      correct: false
    - text: Respecter les paramètres du DP, en lui laissant seul l’adaptation aux aptitudes des équipiers
      correct: false
    explanation: Le guide est responsable du déroulement de la plongée encadrée. Il adapte la conduite
      du groupe dans le cadre fixé par le DP. La présence du guide ne dispense pas chaque plongeur de
      surveiller son matériel et de signaler une difficulté.
