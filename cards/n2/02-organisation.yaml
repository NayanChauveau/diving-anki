  fr:
    question: Dans une plongée organisée en France par un établissement, quelle fonction porte la responsabilité
      technique de l’organisation de la sécurité et du déclenchement des secours ?
    choices:
    - text: Le directeur de plongée (DP)
      correct: true
    - text: Le guide de palanquée, au seul titre de guide
      correct: false
    - text: Le chef de bord, au seul titre de responsable du bateau
      correct: false
    - text: L’encadrant le plus qualifié, indépendamment de sa fonction
      correct: false
    explanation: Le DP est responsable de l’organisation de la sécurité et du déclenchement des secours
      sur le site. Le guide conduit la palanquée pendant l’immersion ; chaque plongeur reste attentif
      à sa propre situation et à ses équipiers.
