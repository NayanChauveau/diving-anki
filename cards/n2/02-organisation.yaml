  fr:
    question: Lors d’une sortie en établissement avec DP, quels paramètres la fiche de sécurité doit-elle
      retracer en plus des noms, aptitudes et fonctions dans la palanquée ?
    choices:
    - text: Les paramètres prévus avant immersion et ceux réellement réalisés
      correct: true
    - text: Les paramètres prévus avant immersion et ceux des plongées précédentes
      correct: false
    - text: Les paramètres réellement réalisés et ceux des plongées précédentes
      correct: false
    explanation: Le DP établit une fiche de sécurité retraçant notamment profondeur et durée prévues puis
      réalisées, ainsi que les membres et leurs fonctions. L’établissement la conserve un an. Les plongées
      précédentes peuvent être utiles à la planification et au suivi individuel, mais ne remplacent ni
      la prévision ni la réalisation de cette sortie.
