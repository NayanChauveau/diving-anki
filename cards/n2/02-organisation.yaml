  fr:
    question: Pour une plongée organisée en France, jusqu’à quel moment la réserve d’oxygène médical doit-elle
      permettre une prise en charge adaptée de la victime ?
    choices:
    - text: Jusqu’à l’arrivée des secours médicaux
      correct: true
    - text: Jusqu’au retour du bateau au port
      correct: false
    - text: Jusqu’au début du transport vers le centre de soins
      correct: false
    explanation: La quantité d’oxygène disponible doit permettre une prise en charge adaptée jusqu’à l’arrivée
      des secours médicaux. Elle dépend notamment du délai attendu. L’ensemble d’oxygénothérapie et ses
      accessoires doivent être disponibles sur le lieu de mise à l’eau ou d’immersion.
