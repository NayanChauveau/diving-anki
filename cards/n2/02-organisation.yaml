    fact_check: pass
  fr:
    question: En milieu naturel, quelle fonction doit remplir le système gonflable d’un plongeur en circuit
      ouvert ?
    choices:
    - text: Lui permettre de regagner la surface et de s’y maintenir
      correct: true
    - text: Remplacer toute réserve de gaz respirable
      correct: false
    - text: Permettre de respirer directement le gaz du gilet
      correct: false
    - text: Empêcher mécaniquement toute variation de profondeur
      correct: false
    explanation: Le système doit être gonflable au moyen de gaz comprimé ; le gilet de stabilisation en
      est l’exemple habituel. C’est un équipement individuel obligatoire dans ce contexte, pas une autorisation
      de remonter sans contrôle.
