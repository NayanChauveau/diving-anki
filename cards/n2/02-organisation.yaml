  fr:
    question: Sur la fiche de sécurité établie par le DP, quels paramètres de plongée faut-il inscrire
      en plus des noms, aptitudes et rôles des plongeurs ?
    choices:
    - text: Les paramètres prévus et ceux réellement réalisés
      correct: true
    - text: Les paramètres prévus uniquement
      correct: false
    - text: Les paramètres réellement réalisés uniquement
      correct: false
    explanation: La fiche rassemble les noms et prénoms, les aptitudes et les rôles dans chaque palanquée,
      ainsi que les paramètres prévus puis réalisés, notamment la profondeur et la durée. L’établissement
      la conserve un an.
