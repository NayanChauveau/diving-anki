  fr:
    question: Pour une plongée organisée à l’air, comment la bouteille d’air de secours doit-elle être
      équipée ?
    choices:
    - text: Avec un détendeur permettant de l’utiliser
      correct: true
    - text: Sans détendeur, puisqu’elle reste en surface
      correct: false
    - text: Avec seulement un bouchon de protection
      correct: false
    - text: Avec uniquement une étiquette indiquant sa pression
      correct: false
    explanation: La bouteille d’air de secours doit être équipée de son détendeur. Pour une plongée avec
      d’autres mélanges, le matériel de secours en gaz doit être adapté à la plongée et prévu par le plan
      de secours ; le stock d’oxygène médical a une autre fonction.
- id: n2-organisation-rappel-bateau-001
  type: mcq
  deck: Réglementation::Organisation
