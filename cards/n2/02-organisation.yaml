    - 'Code du sport — A322-78 I, obligation de fiches d’évacuation, vérifié le 2026-10-05 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000025393863'
    fact_check: pass
  fr:
    question: En cas d’accident de plongée, à quoi sert la fiche d’évacuation ?
    choices:
    - text: À transmettre aux secours les informations sur la victime, la plongée et la prise en charge
      correct: true
    - text: À prouver que la victime n’a forcément commis aucune erreur
      correct: false
    - text: À remplacer l’appel aux secours
      correct: false
    - text: À délivrer une nouvelle aptitude au plongeur après l’accident
      correct: false
    explanation: La fiche d’évacuation sert à transmettre les informations utiles à la prise en charge
      d’une victime. Un modèle réglementaire est prévu pour cette transmission. Elle ne remplace pas l’alerte
      aux secours et ne constitue pas, à elle seule, un diagnostic.
