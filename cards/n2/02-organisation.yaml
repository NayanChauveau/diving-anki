  fr:
    question: En France, dans quelle situation la VHF est-elle exigée pour la plongée en établissement,
      en plus de l’exigence générale de moyen d’alerte ?
    choices:
    - text: En mer, au départ d’une embarcation support de plongée
      correct: true
    - text: En milieu naturel, au départ de toute embarcation support de plongée
      correct: false
    - text: En mer, pour toute mise à l’eau même depuis le rivage
      correct: false
    explanation: La VHF est nécessaire en mer au départ d’une embarcation support. Le texte exige plus
      généralement un moyen de communication permettant de prévenir les secours. Le champ VHF ne doit
      pas être confondu avec celui du rappel depuis une embarcation en milieu naturel ; un téléphone ne
      remplace pas la VHF dans son champ obligatoire.
