  fr:
    question: En milieu naturel, quel équipement respiratoire est spécifiquement requis pour la personne
      qui encadre la palanquée ?
    choices:
    - text: Deux sorties indépendantes et deux détendeurs complets
      correct: true
    - text: Deux embouts reliés au même premier étage suffisent toujours
      correct: false
    - text: Deux manomètres sur un seul détendeur complet
      correct: false
    - text: Un seul détendeur complet, si tous les plongeurs possèdent un deuxième étage de secours
      correct: false
    explanation: Deux détendeurs complets impliquent chacun un premier et un deuxième étage, avec des
      sorties indépendantes. Cela se distingue de deux deuxièmes étages branchés sur un même premier étage.
      L’encadrant doit aussi disposer du système gonflable et des équipements de contrôle de la palanquée.
