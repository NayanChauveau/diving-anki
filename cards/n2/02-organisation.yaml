  fr:
    question: En milieu naturel en France, pour une plongée en établissement, quelle configuration représente
      le minimum imposé à un autonome pour alimenter un équipier, en complément de son détendeur principal
      ?
    choices:
    - text: Un deuxième étage de secours raccordé au premier étage personnel
      correct: true
    - text: Un détendeur complet supplémentaire raccordé à une autre sortie du bloc
      correct: false
    - text: Un détendeur complet supplémentaire raccordé à un deuxième bloc
      correct: false
    explanation: L’exigence pour l’autonome est de fournir du gaz à un équipier sans partage d’embout.
      Un deuxième étage de secours sur le même premier étage peut y répondre. Deux détendeurs complets
      sur sorties indépendantes sont exigés pour l’encadrant ; un second bloc n’est pas le minimum imposé
      à chaque autonome. L’exigence sans partage concerne aussi chaque plongeur encadré au-delà de 20
      m.
