    - 'Revue factuelle et pédagogique : docs/reviews/02-organisation.md'
    fact_check: pass
  fr:
    question: Quels éléments doivent notamment être disponibles sur le lieu de mise à l’eau parmi le matériel
      de secours ?
    choices:
    - text: De l’eau douce potable et une couverture isothermique
      correct: true
    - text: De l’eau de mer et une serviette uniquement
      correct: false
    - text: Une boisson alcoolisée et une couverture ordinaire uniquement
      correct: false
    - text: Une couverture isothermique, mais aucune eau potable
      correct: false
    explanation: L’eau potable et la couverture isothermique font partie du matériel de secours prévu.
      Leur disponibilité ne signifie pas qu’il faut faire boire systématiquement toute victime ; cette
      carte porte sur l’équipement, pas sur une conduite médicale.
- id: n2-organisation-oxygene-capacite-001
  type: mcq
  deck: Réglementation::Organisation
  levels:
