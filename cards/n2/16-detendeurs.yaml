    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    question: Comment le bouton de purge d’un second étage provoque-t-il un débit sans inspiration ?
    choices:
    - text: Il commande mécaniquement l’ouverture du clapet via la membrane
      correct: true
    - text: Il augmente le réglage de moyenne pression du premier étage
      correct: false
    - text: Il ouvre le clapet d’expiration pour aspirer le gaz du flexible
      correct: false
    explanation: '**Il agit mécaniquement sur la membrane et la commande du clapet.** Le passage s’ouvre
      et le gaz chasse notamment l’eau ; une purge n’est pas une augmentation de la pression de service
      du bloc.'
- id: n2-detendeurs-eau-second-etage-001
  type: mcq
  anki_model: basic
