  fr:
    question: Des bulles sortent au raccord bloc–premier étage après montage. Pourquoi faut-il contrôler
      l’étanchéité et le montage plutôt que serrer toujours plus fort ?
    choices:
    - text: Un joint ou un assemblage incorrect peut rester fuyard malgré le serrage
      correct: true
    - text: Un serrage supplémentaire corrige une hausse de MP en réduisant le passage HP
      correct: false
    - text: Un raccord qui fuit devient étanche dès que le second étage est mis en bouche
      correct: false
    explanation: '**Un joint endommagé ou un raccord incorrect peut être en cause.** Un serrage excessif
      peut détériorer les pièces sans supprimer la fuite. Résoudre le défaut avant immersion ; une fuite
      persistante nécessite un contrôle qualifié.'
