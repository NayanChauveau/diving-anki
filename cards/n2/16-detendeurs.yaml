      factuel : SCUBAPRO RevQ juillet 2025, p.6–10 (principes), 13–18 (usage/soins), 20 (dépannage) ;
      références de la carte ; choix relus individuellement'
    fact_check: pass
  fr:
    question: Quelle association décrit correctement le rôle des mécanismes à piston et à membrane dans
      un détendeur à deux étages ?
    choices:
    - text: Piston et membrane peuvent commander l’admission de gaz au premier étage
      correct: true
    - text: Le piston commande le premier étage ; la membrane sert au second étage seulement
      correct: false
    - text: Le piston règle la pression respirée ; la membrane règle la pression intermédiaire
      correct: false
    explanation: Un premier étage peut transmettre l’équilibre des forces au clapet par une pièce rigide
      mobile, le piston, ou par une membrane déformable. Ces deux architectures réalisent la détente vers
      la pression intermédiaire. Une membrane peut aussi commander un second étage ; cela ne la réserve
      pas à cet étage.
