cards:
- id: n2-detendeurs-pressions-001
  type: mcq
  anki_model: basic
  deck: Matériel et préparation
  levels:
  - N2
  - N3
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P508
  review:
    sources:
    - 'Revue finale des formats, clarté et distracteurs du 2026-10-06 : docs/reviews/QCM_REVUE_FINALE.md'
    - 'N3-S01 — MFT N3 FFESSM, décembre 2025, p.8, 12, 15 ; pertinence N3 revue le 2026-10-06 : docs/reviews/n3/00-reprises-n2.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    - 'Schéma original intégré : docs/diagrams/circuit-detendeur.svg ; P585 fusionné avec P508.'
    - 'Relecture globale du 2026-10-06 : docs/reviews/REVUE_FINALE_N2.md'
    - 'Revue approfondie N2 du 2026-10-09 : docs/reviews/MATERIEL_PREPARATION_N2_2026-10-09.md ; contrôle
      factuel : SCUBAPRO RevQ juillet 2025, p.6–10 (principes), 13–18 (usage/soins), 20 (dépannage) ;
      références de la carte ; choix relus individuellement'
    fact_check: pass
  fr:
    question: 'Sur ce schéma conceptuel d’un détendeur à deux étages, quelle réduction de pression réalise
      A, puis B ?


      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-label="Bloc vers étage
      A, flexible vers étage B, puis bouche" style="width:100%;max-width:640px;height:auto"><rect width="640"
      height="180" fill="#ffffff"/><defs><marker id="fleche" markerWidth="8" markerHeight="8" refX="7"
      refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2878a0"/></marker></defs><g fill="#eaf5fa"
      stroke="#2878a0" stroke-width="2"><rect x="10" y="55" width="110" height="70" rx="8"/><rect x="190"
      y="55" width="110" height="70" rx="8"/><rect x="370" y="55" width="110" height="70" rx="8"/><rect
      x="545" y="55" width="85" height="70" rx="8"/></g><g stroke="#2878a0" stroke-width="3" marker-end="url(#fleche)"><path
      d="M120 90 H180"/><path d="M300 90 H360"/><path d="M480 90 H535"/></g><g fill="#16394a" text-anchor="middle"
      font-family="sans-serif" font-size="18"><text x="65" y="96">Bloc</text><text x="245" y="96">Étage
      A</text><text x="425" y="96">Étage B</text><text x="588" y="96">Bouche</text><text x="335" y="152">Flexible</text></g></svg>'
    explanation: '**A, le premier étage : haute pression du bloc → pression intermédiaire (MP). B, le
      second étage : MP → pression proche de l’ambiante à la bouche.** Le flexible entre A et B transporte
      le gaz à la pression intermédiaire ; la pression respirée suit la profondeur du plongeur.'
    choices:
    - text: A réduit HP vers MP ; B réduit MP vers la pression ambiante
      correct: true
    - text: A réduit HP vers la pression ambiante ; B commande le débit sans nouvelle réduction
      correct: false
    - text: A réduit HP vers MP ; B réduit MP vers une pression fixe de 1 bar
      correct: false
- id: n2-detendeurs-relative-absolue-001
  type: mcq
  anki_model: basic
  deck: Matériel et préparation
