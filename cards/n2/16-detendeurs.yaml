    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    question: Quelle différence mécanique entre une fixation DIN et une fixation par étrier du premier étage
      ?
    choices:
    - text: 'DIN : vissage dans le robinet ; étrier : serrage autour du robinet'
      correct: true
    - text: 'DIN : serrage autour du robinet ; étrier : vissage dans le robinet'
      correct: false
    - text: 'DIN et étrier : vissage dans le robinet avec filetage différent'
      correct: false
    explanation: '**La DIN se visse dans la sortie filetée du robinet ; l’étrier serre le premier étage
      autour du robinet.** Vérifier la compatibilité de la connexion et sa pression admissible avant montage.'
- id: n2-detendeurs-membrane-piston-001
  type: mcq
  anki_model: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P515
  review:
    sources:
    - 'Revue finale des formats, clarté et distracteurs du 2026-10-06 : docs/reviews/QCM_REVUE_FINALE.md'
    - 'Conversion QCM et revue des choix du 2026-10-06 : docs/reviews/QCM_GLOBALE.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    question: Dans un premier étage, quelle distinction entre un mécanisme à piston et un mécanisme à membrane
      ?
    choices:
    - text: 'Piston : pièce mobile rigide ; membrane : pièce déformable transmettant une force'
      correct: true
    - text: 'Piston : pièce déformable transmettant une force ; membrane : pièce mobile rigide'
      correct: false
    - text: 'Piston : mécanisme de premier étage ; membrane : mécanisme réservé au second étage'
      correct: false
    explanation: '**Le piston transmet l’équilibre des forces par une pièce mobile rigide ; la membrane
      se déforme et transmet son mouvement au mécanisme du clapet.** Cette distinction ne suffit pas à déterminer
      compensation, performances en eau froide ou entretien.'
