cards:
- id: n2-detendeurs-pressions-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P508
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    - 'Schéma original intégré : docs/diagrams/circuit-detendeur.svg ; P585 fusionné avec P508.'
    fact_check: pass
  fr:
    front: 'Sur ce schéma conceptuel d’un détendeur à deux étages, quelle réduction de pression réalise
      A, puis B ?


      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-label="Bloc haute
      pression vers étage A, flexible moyenne pression vers étage B, puis bouche à pression ambiante"
      style="width:100%;max-width:640px;height:auto"><rect width="640" height="180" fill="#ffffff"/><defs><marker
      id="fleche" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4
      L0,8" fill="#2878a0"/></marker></defs><g fill="#eaf5fa" stroke="#2878a0" stroke-width="2"><rect
      x="10" y="55" width="110" height="70" rx="8"/><rect x="190" y="55" width="110" height="70" rx="8"/><rect
      x="370" y="55" width="110" height="70" rx="8"/><rect x="545" y="55" width="85" height="70" rx="8"/></g><g
      stroke="#2878a0" stroke-width="3" marker-end="url(#fleche)"><path d="M120 90 H180"/><path d="M300
      90 H360"/><path d="M480 90 H535"/></g><g fill="#16394a" text-anchor="middle" font-family="sans-serif"
      font-size="18"><text x="65" y="96">Bloc</text><text x="245" y="96">Étage A</text><text x="425" y="96">Étage
      B</text><text x="588" y="96">Bouche</text><text x="150" y="43">HP</text><text x="335" y="43">MP</text><text
      x="510" y="43">PA</text><text x="335" y="152">Flexible</text></g></svg>'
    back: '**Haute pression à l’entrée du premier étage ; pression intermédiaire dans le flexible vers
      le second ; pression proche de l’ambiante à la bouche.** Le premier étage réduit HP vers MP, le
      second MP vers pression respirable à la profondeur actuelle.'
- id: n2-detendeurs-relative-absolue-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P512
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: Une pression intermédiaire est annoncée « 9,5 bar au-dessus de l’ambiante ». Pourquoi sa valeur
      absolue augmente-t-elle avec la profondeur ?
    back: '**Elle additionne la pression ambiante et ces 9,5 bar relatifs.** Le premier étage suit l’ambiante
      ; 9,5 bar décrit l’écart entre les deux, pas une pression absolue constante à toute profondeur.'
- id: n2-detendeurs-fixations-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P514
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: Quelle différence mécanique entre une fixation DIN et une fixation par étrier du premier étage
      ?
    back: '**La DIN se visse dans la sortie filetée du robinet ; l’étrier serre le premier étage autour
      du robinet.** Vérifier la compatibilité de la connexion et sa pression admissible avant montage.'
- id: n2-detendeurs-membrane-piston-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P515
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: Dans un premier étage, quelle distinction entre un mécanisme à piston et un mécanisme à membrane
      ?
    back: '**Le piston transmet l’équilibre des forces par une pièce mobile rigide ; la membrane se déforme
      et transmet son mouvement au mécanisme du clapet.** Cette distinction ne suffit pas à déterminer
      compensation, performances en eau froide ou entretien.'
- id: n2-detendeurs-cycle-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P519
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: Dans un modèle conceptuel de premier étage à membrane, comment la consommation d’air déclenche-t-elle
      puis arrête-t-elle l’arrivée de gaz depuis le bloc ?
    back: '**La baisse de pression intermédiaire modifie l’équilibre des forces et provoque l’ouverture
      du passage HP → MP.** L’arrivée de gaz rétablit la pression intermédiaire ; le mécanisme retrouve
      l’équilibre et ferme le passage. La disposition précise des pièces dépend du modèle.'
- id: n2-detendeurs-inspiration-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P521
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: Comment l’inspiration commande-t-elle l’arrivée de gaz dans un second étage classique à membrane
      et levier ?
    back: '**La pression intérieure baisse légèrement par rapport à l’eau ambiante.** La membrane se déforme,
      agit sur le levier et ouvre le clapet ; le gaz venant du flexible entre alors à la demande.'
- id: n2-detendeurs-purge-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P523
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: Comment le bouton de purge d’un second étage provoque-t-il un débit sans inspiration ?
    back: '**Il agit mécaniquement sur la membrane et la commande du clapet.** Le passage s’ouvre et le
      gaz chasse notamment l’eau ; une purge n’est pas une augmentation de la pression de service du bloc.'
- id: n2-detendeurs-eau-second-etage-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P524
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: Un second étage a été immergé hors de la bouche. Que faut-il faire avant d’inspirer à nouveau
      dedans ?
    back: '**Évacuer l’eau, par expiration ou purge selon la technique apprise, puis reprendre la respiration
      avec précaution.** La chambre du second étage peut contenir de l’eau ; ce n’est pas le même cas
      qu’une entrée d’eau dans le circuit du premier étage.'
- id: n2-detendeurs-rincage-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P525
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: Pour rincer un détendeur SCUBAPRO démonté du bloc, quelle protection de l’entrée du premier
      étage faut-il vérifier ?
    back: '**Un bouchon de protection correctement fermé sur l’entrée haute pression.** Le manuel demande
      d’empêcher l’eau d’entrer dans le circuit ; le détendeur ne doit pas être rincé comme un objet dont
      toutes les ouvertures peuvent prendre l’eau.'
- id: n2-detendeurs-compensation-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P526
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: Quel intérêt a la compensation d’un premier étage lorsque la pression du bloc diminue ?
    back: '**Réduire l’influence des variations de haute pression sur la pression intermédiaire et le
      fonctionnement.** Elle favorise une fourniture plus régulière ; piston/membrane et compensé/non
      compensé sont deux distinctions différentes.'
- id: n2-detendeurs-eau-froide-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P532
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: Pourquoi ne suffit-il pas de choisir « un premier étage à membrane » pour une plongée en eau
      froide ?
    back: '**Il faut vérifier la certification et les conditions d’utilisation de l’ensemble premier/second
      étage.** La résistance au froid dépend du modèle et de la configuration ; le nom du mécanisme ne
      prouve pas l’adaptation à la température prévue.'
- id: n2-detendeurs-soins-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P537
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: Pourquoi sécher et ranger son détendeur loin de la chaleur, du soleil direct et des contraintes
      sur les flexibles ?
    back: '**Cela limite le vieillissement et les détériorations des pièces et des tuyaux.** Éviter chocs,
      écrasement et courbures forcées ; le rinçage seul ne protège pas d’un stockage inadapté.'
- id: n2-detendeurs-revision-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P539
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: Comment déterminer l’échéance d’entretien d’un détendeur plutôt que d’appliquer une fréquence
      unique à tous les modèles ?
    back: '**Suivre la notice constructeur et tenir compte de l’intensité d’usage et des anomalies.**
      Par exemple, le manuel SCUBAPRO 2025 demande une révision agréée tous les 2 ans, avec un suivi plus
      rapproché pour un usage fréquent ; un défaut impose un contrôle sans attendre cette échéance.'
- id: n2-detendeurs-debit-continu-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P540
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: Un détendeur se met en débit continu hors de la bouche. Pourquoi ce constat ne permet-il pas
      de diagnostiquer à lui seul un givrage ?
    back: '**L’effet Venturi ou un défaut de mécanisme peuvent aussi provoquer un débit continu.** Les
      circonstances, notamment la température et la persistance, orientent le contrôle ; le gaz se perd
      quelle que soit la cause.'
- id: n2-detendeurs-fuite-montage-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P541
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: Des bulles sortent au raccord bloc–premier étage après montage. Pourquoi faut-il contrôler
      l’étanchéité et le montage plutôt que serrer toujours plus fort ?
    back: '**Un joint endommagé ou un raccord incorrect peut être en cause.** Un serrage excessif peut
      détériorer les pièces sans supprimer la fuite. Résoudre le défaut avant immersion ; une fuite persistante
      nécessite un contrôle qualifié.'
- id: n2-detendeurs-inspiration-difficile-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P542
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: Avant de plonger, respirer sur le détendeur demande un effort inhabituel. Que faut-il contrôler
      avant de décider de s’immerger ?
    back: '**La pression disponible, l’ouverture du bloc et le bon fonctionnement du système.** Si la
      difficulté persiste, arrêter la préparation et faire contrôler le matériel ; le symptôme ne désigne
      pas à lui seul une pièce à remplacer.'
- id: n2-detendeurs-incident-immersion-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P543
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: En immersion, un débit continu persistant fait chuter rapidement la pression du bloc. Quelle
      priorité pour la palanquée ?
    back: '**Assurer une source de gaz respirable et organiser immédiatement une sortie contrôlée avec
      l’équipier.** Signaler l’incident et appliquer l’assistance apprise ; ne pas prolonger l’exploration
      pour chercher la panne sous l’eau.'
- id: n2-detendeurs-diagnostic-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P544
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: Dans un tableau de dépannage, que signifie « cause probable » face à un symptôme tel qu’une
      fuite ou l’absence d’air ?
    back: '**Une hypothèse à contrôler, pas un diagnostic certain.** Plusieurs défauts peuvent produire
      le même symptôme ; les réparations internes relèvent d’un technicien qualifié.'
- id: n2-detendeurs-bouche-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  - exercice::calcul
  status: reviewed
  source_id: P545
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: À 20 m dans le modèle 1 bar en surface et +1 bar/10 m, un détendeur a une MP de 9,5 bar au-dessus
      de l’ambiante. Délivre-t-il 12,5 bar absolus dans la bouche ?
    back: '**Non : 12,5 bar est la pression intermédiaire du flexible.** Le second étage fournit du gaz
      proche des 3 bar ambiants à cette profondeur ; les deux réductions de pression ont des rôles distincts.'
- id: n2-detendeurs-mp-vingt-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  - exercice::calcul
  status: reviewed
  source_id: P627
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    front: 'Modèle fictif : premier étage réglé à 9 bar au-dessus de l’ambiante, à 20 m. Prendre 1 bar
      en surface et +1 bar/10 m. Quelle est sa MP absolue ?'
    back: '**12 bar absolus : 3 + 9.** 3 bar est l’ambiante ; 9 bar est la surpression intermédiaire par
      rapport à elle.'
