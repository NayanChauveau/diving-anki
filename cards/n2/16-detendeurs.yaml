    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    question: Un second étage a été immergé hors de la bouche. Que faut-il faire avant d’inspirer à nouveau
      dedans ?
    choices:
    - text: Expirer ou purger pour chasser l’eau, puis reprendre la respiration avec précaution
      correct: true
    - text: Inspirer pour chasser l’eau, puis reprendre la respiration avec précaution
      correct: false
    - text: Reprendre la respiration, l’eau s’évacue spontanément par le flexible moyenne pression
      correct: false
    explanation: '**Évacuer l’eau, par expiration ou purge selon la technique apprise, puis reprendre la
      respiration avec précaution.** La chambre du second étage peut contenir de l’eau ; ce n’est pas le
      même cas qu’une entrée d’eau dans le circuit du premier étage.'
