  fr:
    question: Un détendeur se met en débit continu hors de la bouche. Pourquoi ce constat ne permet-il pas
      de diagnostiquer à lui seul un givrage ?
    choices:
    - text: Venturi ou défaut mécanique peuvent aussi provoquer un débit continu
      correct: true
    - text: La température de l’eau suffit à distinguer Venturi, défaut mécanique et givrage
      correct: false
    - text: La position hors de la bouche exclut l’effet Venturi comme cause du débit continu
      correct: false
    explanation: '**L’effet Venturi ou un défaut de mécanisme peuvent aussi provoquer un débit continu.**
      Les circonstances, notamment la température et la persistance, orientent le contrôle ; le gaz se perd
      quelle que soit la cause.'
