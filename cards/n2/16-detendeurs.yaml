      agréée est indiquée, avec un suivi plus rapproché en usage fréquent ?
    choices:
    - text: Tous les 2 ans
      correct: true
    - text: Tous les ans
      correct: false
    - text: Tous les 5 ans
      correct: false
    explanation: '**Suivre la notice constructeur et tenir compte de l’intensité d’usage et des anomalies.**
      Par exemple, le manuel SCUBAPRO 2025 demande une révision agréée tous les 2 ans, avec un suivi plus
      rapproché pour un usage fréquent ; un défaut impose un contrôle sans attendre cette échéance.'
- id: n2-detendeurs-debit-continu-001
  type: mcq
  anki_model: basic
  deck: Matériel et préparation
  levels:
  - N2
  - N3
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
