    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    question: Comment l’inspiration commande-t-elle l’arrivée de gaz dans un second étage classique à membrane
      et levier ?
    choices:
    - text: Une légère dépression interne agit sur membrane, levier et clapet
      correct: true
    - text: Une légère surpression interne agit sur membrane, levier et clapet
      correct: false
    - text: La chute de haute pression du bloc agit directement sur le levier
      correct: false
    explanation: '**La pression intérieure baisse légèrement par rapport à l’eau ambiante.** La membrane
      se déforme, agit sur le levier et ouvre le clapet ; le gaz venant du flexible entre alors à la demande.'
- id: n2-detendeurs-purge-001
  type: mcq
  anki_model: basic
  deck: Matériel et préparation
  levels:
  - N2
