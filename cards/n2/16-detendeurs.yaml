    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    question: Le manuel SCUBAPRO prévoit le rinçage d’un détendeur démonté du bloc, avec un second étage
      R195 ou G260 doté d’un dispositif anti-marquage. Quelle configuration demande-t-il ?
    choices:
    - text: Entrée haute pression bouchonnée ; dispositif anti-marquage non engagé
      correct: true
    - text: Entrée haute pression bouchonnée ; dispositif anti-marquage engagé
      correct: false
    - text: Entrée haute pression ouverte ; dispositif anti-marquage non engagé
      correct: false
    explanation: Pour le rinçage, fermer l’entrée haute pression du premier étage avec son bouchon et vérifier
      que le dispositif anti-marquage du R195 ou G260 n’est pas engagé. Les réglages de stockage de ce dispositif
      sont différents de ceux du rinçage.
- id: n2-detendeurs-compensation-001
  type: mcq
  anki_model: basic
  deck: Matériel et préparation
  levels:
  - N2
  - N3
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P526
  review:
    sources:
