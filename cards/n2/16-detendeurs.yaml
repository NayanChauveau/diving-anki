  fr:
    question: Avant de plonger, respirer sur le détendeur demande un effort inhabituel. Que faut-il contrôler
      avant de décider de s’immerger ?
    choices:
    - text: Vérifier gaz, ouverture et fonctionnement ; renoncer si le défaut persiste
      correct: true
    - text: S’immerger pour vérifier si la pression ambiante corrige le défaut
      correct: false
    - text: Valider le détendeur si son débit à la purge paraît suffisant
      correct: false
    explanation: '**Contrôler la pression disponible, l’ouverture du bloc et le fonctionnement en respirant
      sur le détendeur.** Un débit insuffisant ou une résistance anormale gênent la ventilation. Si la difficulté
      persiste, renoncer à l’immersion et faire contrôler le matériel ; le symptôme ne désigne pas à lui
      seul une pièce défectueuse.'
