      factuel : SCUBAPRO RevQ juillet 2025, p.6–10 (principes), 13–18 (usage/soins), 20 (dépannage) ;
      références de la carte ; choix relus individuellement'
    fact_check: pass
  fr:
    question: Après avoir remis en bouche un second étage rempli d’eau, une expiration ou une purge permet
      de le vider. Par quel passage l’eau est-elle principalement chassée ?
    choices:
    - text: Par la soupape d’expiration vers l’eau environnante
      correct: true
    - text: Par le flexible de moyenne pression vers le premier étage
      correct: false
    - text: Par le clapet d’admission vers le flexible de moyenne pression
      correct: false
    explanation: L’expiration ou le gaz fourni par la purge chasse l’eau de la chambre du second étage
      vers l’extérieur, par la soupape d’expiration. Le flexible de moyenne pression et le clapet d’admission
      amènent le gaz ; ils ne servent pas de retour d’eau au bloc. Reprendre ensuite la respiration avec
      précaution.
