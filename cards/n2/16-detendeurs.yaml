      priorité pour la palanquée ?
    choices:
    - text: Assurer du gaz respirable et organiser une sortie contrôlée
      correct: true
    - text: Continuer en alternant respiration et fermeture du robinet
      correct: false
    - text: Isoler la palanquée puis identifier la panne avant de remonter
      correct: false
    explanation: '**Assurer une source de gaz respirable et organiser immédiatement une sortie contrôlée
      avec l’équipier.** Signaler l’incident et appliquer l’assistance apprise ; ne pas prolonger l’exploration
      pour chercher la panne sous l’eau.'
