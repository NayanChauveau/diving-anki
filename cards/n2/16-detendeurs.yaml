  fr:
    question: Pour déterminer si un détendeur est adapté à une plongée en eau froide, quel élément faut-il
      vérifier au-delà du type piston ou membrane ?
    choices:
    - text: La certification et les conditions d’usage de l’ensemble premier/second étage
      correct: true
    - text: La seule présence d’une membrane dans le premier étage
      correct: false
    - text: La seule présence d’une connexion DIN sur le premier étage
      correct: false
    explanation: '**Il faut vérifier la certification et les conditions d’utilisation de l’ensemble premier/second
      étage.** La résistance au froid dépend du modèle et de la configuration ; le nom du mécanisme ne prouve
      pas l’adaptation à la température prévue.'
