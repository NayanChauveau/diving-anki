      pour vérifier son adaptation à une plongée en eau froide ?
    choices:
    - text: Les conditions d’usage de l’ensemble premier et second étage
      correct: true
    - text: Les conditions d’usage du premier étage pris séparément
      correct: false
    - text: Les conditions d’usage du second étage pris séparément
      correct: false
