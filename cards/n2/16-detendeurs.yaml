    - 'Conversion QCM et revue des choix du 2026-10-06 : docs/reviews/QCM_GLOBALE.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    question: Dans un modèle conceptuel de premier étage à membrane, comment la consommation d’air déclenche-t-elle
      puis arrête-t-elle l’arrivée de gaz depuis le bloc ?
    choices:
    - text: La baisse de MP ouvre le passage HP → MP ; le rétablissement de MP le ferme
      correct: true
    - text: La hausse de MP ouvre le passage HP → MP ; la baisse de MP le ferme
      correct: false
    - text: La baisse de MP ouvre le passage HP → MP ; seule une baisse de HP le ferme
      correct: false
    explanation: '**La baisse de pression intermédiaire modifie l’équilibre des forces et provoque l’ouverture
      du passage HP → MP.** L’arrivée de gaz rétablit la pression intermédiaire ; le mécanisme retrouve
      l’équilibre et ferme le passage. La disposition précise des pièces dépend du modèle.'
- id: n2-detendeurs-inspiration-001
  type: mcq
  anki_model: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::16
  - detendeurs
  status: reviewed
  source_id: P521
