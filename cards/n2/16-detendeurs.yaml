    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    - 'Revue pédagogique du 2026-10-09 : docs/reviews/QUALITE_GLOBALE_2026-10-09.md ; objectif et identité
      conservés'
    - 'Revue approfondie N2 du 2026-10-09 : docs/reviews/MATERIEL_PREPARATION_N2_2026-10-09.md ; contrôle
      factuel : SCUBAPRO RevQ juillet 2025, p.6–10 (principes), 13–18 (usage/soins), 20 (dépannage) ;
      références de la carte ; choix relus individuellement'
    fact_check: pass
  fr:
    question: Un premier étage maintient sa pression intermédiaire à 9,5 bar au-dessus de l’ambiante.
      Quelle expression donne cette pression intermédiaire en valeur absolue ?
    choices:
    - text: Pression ambiante + 9,5 bar de surpression
      correct: true
    - text: 9,5 bar absolus, indépendamment de la profondeur
      correct: false
    - text: Pression du bloc − 9,5 bar de surpression
      correct: false
    explanation: '**Elle additionne la pression ambiante et ces 9,5 bar relatifs.** Le premier étage suit
      l’ambiante ; 9,5 bar décrit l’écart entre les deux, pas une pression absolue constante à toute profondeur.'
