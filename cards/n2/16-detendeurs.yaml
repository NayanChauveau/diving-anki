    - 'N3-S01 — MFT N3 FFESSM, décembre 2025, p.8, 12, 15 ; pertinence N3 revue le 2026-10-06 : docs/reviews/n3/00-reprises-n2.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.30–34 ; tableau p.34 inspecté visuellement.
    - 'SCUBAPRO — Manuel détendeurs, 2025 Rev Q (juillet), p.6–9, 13–17 et 20 ; consulté le 2026-10-06
      : https://johnsonoutdoors.widen.net/s/hlkmf7vhpb/sp_45101180_revq_reg_manual_202507_fra'
    - 'Revue du 2026-10-06 : docs/reviews/16-detendeurs.md'
    fact_check: pass
  fr:
    question: Quel intérêt a la compensation d’un premier étage lorsque la pression du bloc diminue ?
    choices:
    - text: Limiter l’effet de la haute pression sur la pression intermédiaire
      correct: true
    - text: Maintenir une pression absolue identique à toutes les profondeurs
      correct: false
    - text: Limiter les variations de pression ambiante au second étage
      correct: false
    explanation: '**Réduire l’influence des variations de haute pression sur la pression intermédiaire et
      le fonctionnement.** Elle favorise une fourniture plus régulière ; piston/membrane et compensé/non
      compensé sont deux distinctions différentes.'
- id: n2-detendeurs-eau-froide-001
  type: mcq
  anki_model: basic
