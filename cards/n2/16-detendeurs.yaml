    question: Pourquoi sécher et ranger son détendeur loin de la chaleur, du soleil direct et des contraintes
      sur les flexibles ?
    choices:
    - text: Limiter le vieillissement des élastomères et les contraintes sur les tuyaux
      correct: true
    - text: Empêcher le gaz enfermé de modifier durablement le réglage de MP
      correct: false
    - text: Empêcher le sel résiduel de se dissoudre pendant le stockage
      correct: false
    explanation: '**Cela limite le vieillissement et les détériorations des pièces et des tuyaux.** Éviter
      chocs, écrasement et courbures forcées ; le rinçage seul ne protège pas d’un stockage inadapté.'
