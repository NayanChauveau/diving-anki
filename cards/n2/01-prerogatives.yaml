  fr:
    question: Pour explorer ensemble jusqu’à 20 m en autonomie en France, quelles aptitudes chaque membre
      de la palanquée doit-il au minimum justifier ?
    choices:
    - text: PA20
      correct: true
    - text: PE20
      correct: false
    - text: PE40
      correct: false
    - text: PA12
      correct: false
    explanation: Chaque équipier doit avoir les aptitudes d’autonomie jusqu’à 20 m. PE20 et PE40 sont
      des aptitudes de plongée encadrée ; PA12 limite l’autonomie à 12 m.
