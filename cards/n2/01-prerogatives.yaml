    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: Dans le cursus FFESSM, une exploration PE40 d’un plongeur de moins de 16 ans peut-elle
      prévoir des paliers obligatoires ?
    choices:
    - text: 'Non : elle doit rester sans palier obligatoire selon le moyen de désaturation utilisé'
      correct: true
    - text: 'Oui : si chaque palier reste inférieur à trois minutes'
      correct: false
    - text: 'Oui : si le guide réalise les paliers à sa place'
      correct: false
    - text: 'Oui : si elle ne comporte qu’un palier à 3 m'
      correct: false
    explanation: La restriction vise les paliers obligatoires du moyen utilisé. La planification doit
      tenir compte de cette limite avant l’immersion ; elle ne signifie pas que la plongée est sans
      risque.
- id: n2-prerogatives-pe40-moins-seize-nombre-001
  type: mcq
  deck: Réglementation::Prérogatives
