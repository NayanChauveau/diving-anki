  fr:
    question: Pour accéder à la formation N2 FFESSM, quelle paire de documents fait partie des conditions
      communes d’accès ?
    choices:
    - text: Une licence FFESSM valide et un CACI conforme aux règles fédérales
      correct: true
    - text: Une licence valide et un carnet de plongée, sans CACI
      correct: false
    - text: Un CACI conforme et un carnet de plongée, sans licence
      correct: false
    - text: Une licence valide et une carte N1, sans CACI
      correct: false
    explanation: 'Ces deux conditions ne suffisent pas à elles seules : il faut aussi satisfaire aux
      prérequis de niveau, d’expérience et d’âge. Licence et certificat médical ont des fonctions
      différentes.'
