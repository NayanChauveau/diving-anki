  fr:
    question: En France, un établissement organise une exploration PA20. Quelle présence est requise pour
      l’organisation de cette plongée autonome ?
    choices:
    - text: Un DP au lieu de mise à l’eau ou d’immersion, sans guide conduisant la palanquée
      correct: true
    - text: Un guide conduisant la palanquée sous l’eau, sans DP au lieu de mise à l’eau ou d’immersion
      correct: false
    - text: Un DP joignable à distance, sans guide conduisant la palanquée
      correct: false
    explanation: Le directeur de plongée (DP) est présent sur le lieu de mise à l’eau ou d’immersion et
      fixe le cadre. L’autonomie concerne la conduite de la palanquée sans guide ; elle ne supprime pas
      le DP pour cette exploration PA20 en établissement. Le guide et le DP exercent des fonctions différentes.
