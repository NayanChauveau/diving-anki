  fr:
    question: Un PE40 FFESSM de 15 ans a atteint 32 m à sa première plongée de la journée. Quel plafond
      s’applique à sa seconde plongée, si toutes les autres conditions sont réunies ?
    choices:
    - text: 20 m
      correct: true
    - text: 25 m
      correct: false
    - text: 30 m
      correct: false
    - text: 40 m
      correct: false
    explanation: 'La première plongée a dépassé 30 m : la seconde est limitée à 20 m. Il faut aussi
      respecter au moins trois heures entre les deux plongées et rester sans palier obligatoire.'
