    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: Quel intervalle minimal faut-il respecter entre les deux plongées
      d’un PE40 de moins de 16 ans ?
    choices:
    - text: Trois heures
      correct: true
    - text: Une heure
      correct: false
    - text: Deux heures
      correct: false
    - text: Quatre heures
      correct: false
    explanation: Les deux plongées doivent être séparées d’au moins trois heures, même si leurs autres
      paramètres respectent les limites applicables.
- id: n2-prerogatives-pe40-moins-seize-seconde-001
  type: mcq
