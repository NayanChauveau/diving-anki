  fr:
    question: Un plongeur FFESSM titulaire de PE40 obtient ensuite PA20. Que permet cette seconde qualification
      pour la délivrance du N2 ?
    choices:
    - text: La réunion des deux qualifications permet la délivrance du N2
      correct: true
    - text: La réunion des deux qualifications permet l’entrée dans une formation N2 à reprendre intégralement
      correct: false
    - text: La réunion des deux qualifications permet la délivrance du N2 après obtention complémentaire
        de PA40
      correct: false
    explanation: 'PE40 et PA20 peuvent être obtenus séparément. L’acquisition de la seconde qualification
      entraîne la délivrance du brevet et de la carte N2 : leurs compétences réunies constituent le N2.
      PA40 correspond à une autonomie plus profonde et n’est pas un prérequis du N2.'
