    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: En France, quelle condition de compétences s’applique aux équipiers d’une palanquée PA20 ?
    choices:
    - text: Ils disposent au minimum des compétences PA20
      correct: true
    - text: Un PE20 peut remplacer un PA20 si le groupe reste à 20 m
      correct: false
    - text: Un PE40 peut remplacer un PA20 du seul fait de sa limite à 40 m
      correct: false
    - text: Seul un des plongeurs doit disposer des compétences PA20
      correct: false
    explanation: Une aptitude encadrée ne prouve pas les compétences d’autonomie. Les équipiers doivent
      notamment pouvoir participer à la gestion collective de la plongée.
- id: n2-prerogatives-autonome-trente-001
  type: mcq
  deck: Réglementation::Prérogatives
  levels:
  - N2
  tags:
