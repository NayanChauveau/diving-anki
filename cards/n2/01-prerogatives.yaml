  fr:
    question: Un plongeur FFESSM de 15 ans vient d’obtenir son N2. À partir de quel âge pourra-t-il exercer
      l’autonomie PA20 en France, si les autres conditions sont remplies ?
    choices:
    - text: 16 ans
      correct: true
    - text: 15 ans
      correct: false
    - text: 17 ans
      correct: false
    - text: 18 ans
      correct: false
    explanation: À 15 ans, son N2 atteste ses compétences PA20 et PE40, mais il doit encore plonger encadré.
      Il peut exercer PE40 sous les conditions applicables aux moins de 16 ans ; l’autonomie PA20 attend
      16 ans et les autres conditions requises. Ni un équipier majeur ni l’autorisation parentale n’abaissent
      ce seuil.
