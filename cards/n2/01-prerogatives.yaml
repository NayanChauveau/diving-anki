  review:
    fact_check: pass
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.3–4 (source pédagogique)
    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Code du sport — A322-73, version depuis le 31 octobre 2025 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000052464714'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: En France, à quel âge peut-on au plus tôt exercer l’autonomie PA20 sur décision du DP
      ?
    choices:
    - text: 16 ans
      correct: true
    - text: 14 ans
      correct: false
    - text: 15 ans
      correct: false
    - text: 18 ans
      correct: false
    explanation: L’âge d’exercice de l’autonomie doit être distingué de l’âge de certification. Pour
      un mineur dans le cadre fédéral, les conditions d’autorisation du responsable légal et d’information
      de la palanquée s’ajoutent.
- id: n2-prerogatives-quinze-ans-n2-001
  type: mcq
  deck: Réglementation::Prérogatives
  levels:
  - N2
  tags:
  - chapitre::01
  - prerogatives
  - angle::comparaison
  status: reviewed
  source_id: P016
  review:
    fact_check: pass
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.3–4 (source pédagogique)
    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Code du sport — A322-73 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000052464714'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: Un plongeur FFESSM de 15 ans vient d’obtenir son N2. Quelle conclusion est correcte
      concernant une exploration PA20 en France ?
    choices:
    - text: Il doit attendre 16 ans pour exercer l’autonomie
      correct: true
    - text: Il peut être autonome dès la délivrance de son N2
      correct: false
    - text: Il peut être autonome dès maintenant avec un équipier majeur
      correct: false
    - text: Il peut être autonome dès maintenant avec une autorisation parentale
      correct: false
    explanation: La certification valide des compétences ; l’exercice des prérogatives dépend aussi
      de l’âge. Ni un équipier majeur ni l’autorisation parentale n’abaissent le seuil d’autonomie.
- id: n2-prerogatives-mineur-autorisation-001
  type: mcq
  deck: Réglementation::Prérogatives
  levels:
  - N2
  tags:
  - chapitre::01
  - prerogatives
  - angle::rappel
  status: reviewed
  source_id: P017
  review:
    fact_check: pass
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.3–4 (source pédagogique)
    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: Pour exercer PA20 à 16 ans dans le cadre du MFT FFESSM, quelle autorisation du responsable
      légal est demandée ?
    choices:
    - text: Une autorisation éclairée pour cette pratique en autonomie
      correct: true
    - text: Une autorisation portant uniquement sur le passage du N2
      correct: false
    - text: Une autorisation pour plonger sans aucun DP
      correct: false
    - text: Une autorisation permettant de dépasser 20 m sans guide
      correct: false
    explanation: L’accord porte sur la pratique en autonomie du mineur. Il ne remplace pas la décision
      du DP et n’élargit pas les aptitudes du plongeur.
