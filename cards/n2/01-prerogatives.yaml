  fr:
    question: En France, un PA20 et un plongeur ayant seulement PA12 plongent ensemble en autonomie. Le
      DP autorise cette palanquée. Quelle profondeur maximale leurs aptitudes permettent-elles pour le
      groupe ?
    choices:
    - text: 12 m, même si le PA20 assume l’assistance
      correct: true
    - text: 20 m, si le PA20 assume l’assistance
      correct: false
    - text: 20 m, si le DP donne son accord explicite
      correct: false
    explanation: La palanquée reste dans la zone du plongeur aux aptitudes les plus restrictives. Le DP
      peut encore fixer une limite plus basse.
