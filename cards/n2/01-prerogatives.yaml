  fr:
    question: Dans le cursus FFESSM, quel est l’âge minimal pour entrer en formation
      et obtenir la qualification PE40 ?
    choices:
    - text: 14 ans
      correct: true
    - text: 12 ans
      correct: false
    - text: 15 ans
      correct: false
    - text: 16 ans
      correct: false
    explanation: Il s’agit du seuil fédéral pour la qualification PE40. Avant 16 ans, son exercice
      est assorti de restrictions spécifiques de plongée.
- id: n2-prerogatives-age-certification-001
  type: mcq
  deck: Réglementation::Prérogatives
  levels:
