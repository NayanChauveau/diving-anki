    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: Selon le MFT N2 FFESSM de mai 2026, quel est l’âge minimal pour entrer en formation
      et obtenir la qualification PE40 ?
    choices:
    - text: 14 ans
      correct: true
    - text: 12 ans
      correct: false
    - text: 15 ans
      correct: false
    - text: 16 ans
      correct: false
    explanation: Il s’agit du seuil fédéral pour la qualification PE40. Avant 16 ans, son exercice
      est assorti de restrictions spécifiques de plongée.
- id: n2-prerogatives-age-certification-001
  type: mcq
  deck: Réglementation::Prérogatives
  levels:
