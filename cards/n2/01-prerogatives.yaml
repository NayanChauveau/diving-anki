    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Code du sport — A322-73 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000052464714'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: Un plongeur FFESSM de 15 ans vient d’obtenir son N2. Quelle conclusion est correcte
      concernant une exploration PA20 en France ?
    choices:
    - text: Il doit attendre 16 ans pour exercer l’autonomie
      correct: true
    - text: Il peut être autonome dès la délivrance de son N2
      correct: false
    - text: Il peut être autonome dès maintenant avec un équipier majeur
      correct: false
    - text: Il peut être autonome dès maintenant avec une autorisation parentale
      correct: false
    explanation: 'À 15 ans, son N2 atteste ses compétences PA20 et PE40, mais il doit encore
      plonger encadré. Il peut exercer PE40 sous les conditions applicables aux moins de 16 ans ;
      l’autonomie PA20 attend 16 ans et les autres conditions requises. Ni un équipier majeur
      ni l’autorisation parentale n’abaissent ce seuil.'
