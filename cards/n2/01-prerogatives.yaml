  fr:
    question: Pour un PE40 FFESSM âgé de moins de 16 ans, une plongée d’exploration peut-elle être planifiée
      avec des paliers de décompression obligatoires ?
    choices:
    - text: 'Non : la plongée doit être prévue sans palier de décompression obligatoire'
      correct: true
    - text: 'Oui : des paliers obligatoires sont possibles avec une autorisation parentale spécifique'
      correct: false
    - text: 'Oui : un seul palier obligatoire à 3 m est admis'
      correct: false
    - text: 'Oui : les paliers obligatoires sont admis si leur durée totale ne dépasse pas trois minutes'
      correct: false
    explanation: L’ordinateur de plongée ou les tables servent à déterminer si la profondeur et la durée
      prévues imposent des paliers de décompression. Pour un PE40 de moins de 16 ans, il faut prévoir
      une plongée pour laquelle cet outil n’impose aucun palier obligatoire. Si des paliers obligatoires
      apparaissent malgré cette planification, cette restriction n’autorise pas à les ignorer.
