  fr:
    question: Pour une exploration PA20 organisée en France par un établissement, quelle organisation
      respecte le cadre de l’autonomie ?
    choices:
    - text: Pas de guide dans la palanquée ; un DP présent sur le site fixe le cadre
      correct: true
    - text: Pas de guide ni de DP sur le site si tous les équipiers ont le N2
      correct: false
    - text: Un guide conduit la palanquée ; les équipiers fixent seuls le cadre
      correct: false
    - text: Pas de guide ; le DP peut rester absent du site s’il est joignable
      correct: false
    explanation: DP signifie directeur de plongée. L’autonomie signifie que les équipiers plongent ensemble
      sans guide qui conduit leur palanquée. Le DP reste présent sur le lieu de mise à l’eau ou d’immersion
      ; il organise l’activité et autorise la plongée dans le cadre qu’il fixe.
