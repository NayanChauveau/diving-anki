  fr:
    question: Quelle plage d’effectifs est autorisée pour une palanquée d’exploration autonome PA20 en
      France, en comptant tous ses membres ?
    choices:
    - text: De deux à trois plongeurs
      correct: true
    - text: De un à deux plongeurs
      correct: false
    - text: De trois à quatre plongeurs
      correct: false
    - text: De deux à quatre plongeurs
      correct: false
    explanation: 'Le plongeur autonome est accompagné d’un ou deux équipiers : la palanquée compte donc
      deux ou trois plongeurs au total.'
