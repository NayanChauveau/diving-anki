  fr:
    question: En France, le DP autorise une palanquée autonome comprenant un PA20 et un PA12. Il n’ajoute
      pas de limite de profondeur plus basse. Quelle règle fixe la profondeur maximale du groupe ?
    choices:
    - text: 12 m, d’après les aptitudes les plus restrictives de la palanquée
      correct: true
    - text: 20 m, d’après les aptitudes du plongeur qui assure l’assistance
      correct: false
    - text: 20 m, d’après les aptitudes du plongeur le plus qualifié
      correct: false
    explanation: Les aptitudes PA12 limitent le groupe à 12 m. La capacité du PA20 à assister son équipier
      ne lui transfère pas ses prérogatives. Le DP peut imposer une limite plus basse, mais son accord
      ne dépasse pas celle des aptitudes du groupe.
