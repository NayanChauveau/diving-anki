  fr:
    question: En France, un plongeur PA20 et un plongeur seulement PA12 forment une palanquée autonome
      autorisée par le DP. Quel est leur plafond lié aux aptitudes ?
    choices:
    - text: 12 m pour toute la palanquée
      correct: true
    - text: 20 m pour toute la palanquée
      correct: false
    - text: 12 m pour l’un et 20 m pour l’autre au même moment
      correct: false
    - text: 16 m, moyenne des deux plafonds
      correct: false
    explanation: La palanquée reste dans la zone du plongeur aux aptitudes les plus restrictives.
      Le DP peut encore fixer une limite plus basse.
