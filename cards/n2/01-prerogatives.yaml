  fr:
    question: Un plongeur FFESSM obtient PA20 après avoir déjà obtenu PE40. Quel brevet peut alors lui
      être délivré ?
    choices:
    - text: Le N2, grâce à la réunion de PE40 et PA20
      correct: true
    - text: Le N2 seulement après une formation N2 supplémentaire complète
      correct: false
    - text: Le N2 seulement après l’obtention de PA40
      correct: false
    - text: 'Aucun brevet N2 : PE40 et PA20 restent deux qualifications séparées'
      correct: false
    explanation: Les deux qualifications peuvent être acquises séparément. L’obtention de la seconde complète
      les compétences nécessaires au brevet N2, selon les règles fédérales de délivrance.
