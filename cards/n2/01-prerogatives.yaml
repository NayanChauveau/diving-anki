    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: Dans le cursus FFESSM, quel est l’âge minimal pour obtenir
      la qualification PA20 ou le brevet N2, indépendamment de l’âge autorisant l’autonomie ?
    choices:
    - text: 15 ans
      correct: true
    - text: 14 ans
      correct: false
    - text: 16 ans
      correct: false
    - text: 18 ans
      correct: false
    explanation: 'Dès 15 ans, la qualification PA20 peut attester les compétences acquises pour
      l’autonomie à 20 m, mais leur exercice en exploration n’est autorisé qu’à partir de 16 ans,
      sous les autres conditions requises. À 15 ans, obtenir PA20 sert donc à valider cette formation
      en avance ; cela n’autorise pas encore à plonger sans guide. Le N2 comprend aussi PE40 :
      son titulaire de 15 ans peut plonger encadré jusqu’à 40 m, sur décision du DP et dans les
      limites particulières applicables aux moins de 16 ans. PA20 seul ne confère pas PE40.'
- id: n2-prerogatives-quinze-ans-n2-001
  type: mcq
  deck: Réglementation::Prérogatives
  levels:
  - N2
  tags:
