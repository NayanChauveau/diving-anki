  fr:
    front: Une palanquée PA20 FFESSM autorisée accueille un plongeur de 16 ans. Qui doit être informé
      de la présence d’un mineur ?
    back: Les membres de la palanquée. L’information des équipiers sur la présence du mineur est une
      condition du MFT FFESSM, en plus de l’autorisation éclairée du responsable légal et de la décision
      du DP.
- id: n2-prerogatives-pe40-moins-seize-paliers-001
  type: mcq
  deck: Réglementation::Prérogatives
  levels:
  - N2
  tags:
  - chapitre::01
