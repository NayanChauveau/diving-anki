  fr:
    question: Quel brevet ou certification doit-on avoir au minimum pour commencer une formation N2 FFESSM
      ?
    choices:
    - text: Le N1 FFESSM ou une certification aux aptitudes jugées équivalentes
      correct: true
    - text: Le N1 FFESSM exclusivement, sans équivalence acceptée
      correct: false
    - text: Une qualification PE40 est exigée avant toute entrée en formation N2
      correct: false
    - text: Une qualification PA20 est exigée avant toute entrée en formation N2
      correct: false
    explanation: Il faut le N1 FFESSM ou une certification dont les aptitudes sont jugées équivalentes.
      PE40 et PA20 peuvent se préparer dans le cursus N2 ; les posséder avant l’entrée en formation n’est
      pas exigé.
