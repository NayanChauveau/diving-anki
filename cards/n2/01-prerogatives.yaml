  fr:
    question: Dans le cursus FFESSM, combien de plongées par jour au maximum peut effectuer un PE40 âgé
      de moins de 16 ans ?
    choices:
    - text: Deux plongées
      correct: true
    - text: Une plongée
      correct: false
    - text: Trois plongées
      correct: false
    - text: Quatre plongées
      correct: false
    explanation: Deux plongées au maximum par jour, séparées d’au moins trois heures. Si la première dépasse
      30 m, la seconde est limitée à 20 m. Elles doivent être prévues sans palier de décompression obligatoire
      indiqué par l’ordinateur ou les tables utilisés.
