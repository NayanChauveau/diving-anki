  fr:
    question: À l’étranger, une structure reconnaît la carte N2/CMAS d’un plongeur. Comment déterminer
      dans quelles conditions il pourra y plonger ?
    choices:
    - text: Appliquer les conditions locales et celles de la structure d’accueil
      correct: true
    - text: Appliquer les prérogatives françaises du N2 dans toute structure qui reconnaît la carte
      correct: false
    - text: Appliquer les prérogatives CMAS comme règles communes à tous les pays
      correct: false
    explanation: La reconnaissance d’une formation et l’autorisation d’une plongée précise sont deux questions
      différentes. Il faut se renseigner auprès de la structure et respecter le cadre local.
