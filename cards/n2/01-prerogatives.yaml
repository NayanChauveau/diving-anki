  fr:
    question: Un PE40 FFESSM de 15 ans a atteint 32 m lors de sa première plongée du jour. Quelle profondeur
      maximale s’applique à sa seconde plongée si les autres conditions sont réunies ?
    choices:
    - text: 20 m
      correct: true
    - text: 30 m
      correct: false
    - text: 40 m
      correct: false
    explanation: Après une première plongée au-delà de 30 m, la seconde est limitée à 20 m. La valeur
      de 30 m est le seuil de déclenchement de la restriction, pas la limite de la seconde plongée ; 40
      m est la limite PE40 générale. Respecter aussi trois heures d’intervalle et une planification sans
      palier obligatoire.
