    question: Dans le cursus FFESSM, quelle durée minimale doit séparer les deux plongées de la journée
      d’un PE40 âgé de moins de 16 ans ?
    choices:
    - text: Trois heures
      correct: true
    - text: Une heure
      correct: false
    - text: Deux heures
      correct: false
    - text: Quatre heures
      correct: false
    explanation: Les deux plongées doivent être séparées d’au moins trois heures, même si leurs autres
      paramètres respectent les limites applicables.
