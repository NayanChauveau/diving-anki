  fr:
    question: Quelle contrainte de désaturation doit respecter la planification d’une exploration PE40
      FFESSM pour un plongeur de moins de 16 ans ?
    choices:
    - text: Aucun palier de décompression obligatoire prévu par l’ordinateur ou les tables
      correct: true
    - text: Un palier de décompression à 3 m au plus, prévu par l’ordinateur ou les tables
      correct: false
    - text: Trois minutes de décompression au plus, prévues par l’ordinateur ou les tables
      correct: false
    explanation: La profondeur et la durée doivent être choisies de sorte que l’ordinateur ou les tables
      n’imposent aucun palier de décompression obligatoire. Un arrêt de sécurité facultatif est une autre
      notion. Si des paliers obligatoires apparaissent malgré la planification, cette restriction ne permet
      pas de les ignorer.
