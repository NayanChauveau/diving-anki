cards:
- id: n2-prerogatives-n2-aptitudes-001
  type: mcq
  deck: Réglementation::Prérogatives
  levels:
  - N2
  tags:
  - chapitre::01
  - prerogatives
  - angle::rappel
  status: reviewed
  source_id: P001
  review:
    fact_check: pass
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.3–4 (source pédagogique)
    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: Dans le cursus FFESSM, quelles aptitudes associe le brevet Niveau 2 ?
    choices:
    - text: PA20 et PE40
      correct: true
    - text: PE20 et PA40
      correct: false
    - text: PA20 et PA40
      correct: false
    - text: PE40 et PA40
      correct: false
    explanation: Le N2 combine une capacité d’exploration autonome dans la zone 0–20 m et une capacité
      d’exploration encadrée dans la zone 0–40 m. Les conditions de réalisation restent fixées par
      le directeur de plongée.
- id: n2-prerogatives-pe40-exploration-001
  type: mcq
  deck: Réglementation::Prérogatives
  levels:
  - N2
  tags:
  - chapitre::01
  - prerogatives
  - angle::rappel
  status: reviewed
  source_id: P002
  review:
    fact_check: pass
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.3–4 (source pédagogique)
    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: En exploration à l’air en France, que permet l’aptitude PE40, dans les conditions autorisées
      par le DP ?
    choices:
    - text: Évoluer jusqu’à 40 m avec un guide de palanquée
      correct: true
    - text: Évoluer jusqu’à 40 m avec un équipier PA20 seulement
      correct: false
    - text: Évoluer jusqu’à 20 m sans guide ni équipier
      correct: false
    - text: Évoluer jusqu’à 60 m avec un guide de palanquée
      correct: false
    explanation: Le guide conduit la plongée encadrée. La limite de 40 m est un plafond de prérogatives,
      pas une profondeur à atteindre à chaque sortie.
- id: n2-prerogatives-pa20-exploration-001
  type: mcq
  deck: Réglementation::Prérogatives
  levels:
  - N2
  tags:
  - chapitre::01
  - prerogatives
  - angle::rappel
  status: reviewed
  source_id: P003
  review:
    fact_check: pass
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.3–4 (source pédagogique)
    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: Que permet l’aptitude PA20 en exploration à l’air en France, lorsque les conditions
      d’autonomie sont réunies ?
    choices:
    - text: Plonger avec des équipiers autonomes dans la zone 0–20 m
      correct: true
    - text: Plonger seul dans la zone 0–20 m
      correct: false
    - text: Plonger avec des équipiers autonomes dans la zone 0–40 m
      correct: false
    - text: Plonger avec des équipiers autonomes dans la zone 0–60 m
      correct: false
    explanation: L’autonomie s’exerce en palanquée et sur décision du DP. Elle ne signifie ni plongée
      solo, ni autonomie jusqu’à la profondeur accessible avec un guide.
- id: n2-prerogatives-qualifications-separees-001
  type: mcq
  deck: Réglementation::Prérogatives
  levels:
  - N2
  tags:
  - chapitre::01
  - prerogatives
  - angle::rappel
  status: reviewed
  source_id: P004
  review:
    fact_check: pass
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.3–4 (source pédagogique)
    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: Un plongeur FFESSM possède déjà la qualification PE40. Que lui apporte l’acquisition
      de la qualification PA20 ?
    choices:
    - text: La réunion des deux qualifications permet la délivrance du N2
      correct: true
    - text: Elle remplace PE40 et ramène sa limite encadrée à 20 m
      correct: false
    - text: Elle permet la délivrance directe du N3
      correct: false
    - text: Elle porte sa limite autonome à 40 m
      correct: false
    explanation: Les deux qualifications peuvent être acquises séparément. L’obtention de la seconde
      complète les compétences nécessaires au brevet N2, selon les règles fédérales de délivrance.
- id: n2-prerogatives-pe20-pe40-001
  type: mcq
  deck: Réglementation::Prérogatives
  levels:
  - N2
  tags:
  - chapitre::01
  - prerogatives
  - angle::comparaison
  status: reviewed
  source_id: P005
  review:
    fact_check: pass
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.3–4 (source pédagogique)
    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: Quelle différence principale distingue les aptitudes PE20 et PE40 en exploration ?
    choices:
    - text: Le plafond de profondeur encadrée passe de 20 m à 40 m
      correct: true
    - text: PE40 supprime l’encadrement au-delà de 20 m
      correct: false
    - text: PE40 permet l’autonomie jusqu’à 40 m
      correct: false
    - text: PE20 permet de plonger seul jusqu’à 20 m
      correct: false
    explanation: Le préfixe PE désigne une aptitude à plonger encadré. Changer de zone de profondeur
      ne transforme pas cette aptitude en autonomie.
- id: n2-prerogatives-autonomie-dp-001
  type: mcq
  deck: Réglementation::Prérogatives
  levels:
  - N2
  tags:
  - chapitre::01
  - prerogatives
  - angle::comparaison
  status: reviewed
  source_id: P006
  review:
    fact_check: pass
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.3–4 (source pédagogique)
    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Code du sport — A322-73, version depuis le 31 octobre 2025 : https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000052464714'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: Pour une exploration PA20 organisée en France dans un établissement, que signifie «
      autonome » ?
    choices:
    - text: Sans guide dans la palanquée, dans le cadre fixé par un DP présent sur le site
      correct: true
    - text: Sans guide dans la palanquée et sans DP sur le site
      correct: false
    - text: Sans obligation de respecter le briefing du DP
      correct: false
    - text: Sans équipier dans la palanquée
      correct: false
    explanation: L’autonomie concerne l’évolution en immersion. Le DP organise la plongée et décide
      de l’autorisation d’autonomie ; les équipiers respectent ce cadre.
- id: n2-prerogatives-pa20-effectif-001
  type: mcq
  deck: Réglementation::Prérogatives
  levels:
  - N2
  tags:
