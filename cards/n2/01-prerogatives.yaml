  fr:
    question: Quelles aptitudes d’exploration le brevet N2 FFESSM atteste-t-il ?
    choices:
    - text: Autonomie jusqu’à 20 m (PA20) et plongée encadrée jusqu’à 40 m (PE40)
      correct: true
    - text: Plongée encadrée jusqu’à 20 m (PE20) et autonomie jusqu’à 40 m (PA40)
      correct: false
    - text: Autonomie jusqu’à 20 m (PA20) et autonomie jusqu’à 40 m (PA40)
      correct: false
    - text: Plongée encadrée jusqu’à 40 m (PE40) et autonomie jusqu’à 40 m (PA40)
      correct: false
    explanation: Le N2 atteste PA20 pour l’exploration autonome jusqu’à 20 m et PE40 pour l’exploration
      encadrée jusqu’à 40 m. Le directeur de plongée peut retenir des limites plus basses ; son accord
      ne permet pas d’exercer PA20 à 30 m. Les aptitudes plus profondes doivent être justifiées séparément.
