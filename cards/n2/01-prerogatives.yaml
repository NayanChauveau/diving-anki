    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: Dans le cadre PA20 décrit par le MFT N2 FFESSM, combien d’équipiers accompagnent un
      plongeur autonome ?
    choices:
    - text: Un ou deux équipiers
      correct: true
    - text: Aucun équipier
      correct: false
    - text: Trois ou quatre équipiers
      correct: false
    - text: Un seul équipier obligatoire
      correct: false
    explanation: La palanquée autonome comporte ainsi deux ou trois plongeurs au total. Ne pas confondre
      le nombre d’équipiers et l’effectif total.
- id: n2-prerogatives-pa20-equipiers-001
  type: mcq
  deck: Réglementation::Prérogatives
  levels:
  - N2
  tags:
  - chapitre::01
  - prerogatives
  - angle::rappel
  status: reviewed
  source_id: P008
  review:
    fact_check: pass
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.3–4 (source pédagogique)
    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: Quelle condition de compétences s’applique aux équipiers d’une palanquée PA20 selon
      le MFT N2 FFESSM ?
    choices:
    - text: Ils disposent au minimum des compétences PA20
      correct: true
    - text: Un PE20 peut remplacer un PA20 si le groupe reste à 20 m
      correct: false
    - text: Un PE40 peut remplacer un PA20 du seul fait de sa limite à 40 m
      correct: false
    - text: Seul un des plongeurs doit disposer des compétences PA20
      correct: false
    explanation: Une aptitude encadrée ne prouve pas les compétences d’autonomie. Les équipiers doivent
      notamment pouvoir participer à la gestion collective de la plongée.
- id: n2-prerogatives-decision-dp-001
  type: basic
  deck: Réglementation::Prérogatives
  levels:
  - N2
  tags:
  - chapitre::01
  - prerogatives
  - angle::comprehension
  status: reviewed
  source_id: P009
  review:
    fact_check: pass
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.3–4 (source pédagogique)
    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    front: Pourquoi un brevet N2 ne donne-t-il pas automatiquement le droit d’atteindre 40 m lors
      de toute sortie en France ?
    back: Les prérogatives définissent un plafond. Le DP autorise et fixe les caractéristiques de
      la plongée selon les aptitudes et les conditions du site ; il peut retenir une profondeur plus
      faible. Le plongeur respecte les consignes données.
- id: n2-prerogatives-autonome-trente-001
  type: mcq
  deck: Réglementation::Prérogatives
  levels:
  - N2
  tags:
  - chapitre::01
  - prerogatives
  - angle::scenario
  status: reviewed
  source_id: P010
  review:
    fact_check: pass
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.3–4 (source pédagogique)
    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: Un plongeur majeur ne justifie que des aptitudes de son N2. Il veut explorer à 30 m
      sans guide avec deux autres N2. Ces aptitudes suffisent-elles ?
    choices:
    - text: 'Non : son autonomie est limitée à 20 m'
      correct: true
    - text: 'Oui : le N2 autorise toute exploration jusqu’à 40 m'
      correct: false
    - text: 'Oui : trois N2 peuvent combiner leurs aptitudes'
      correct: false
    - text: 'Oui : l’autorisation du DP suffit à étendre l’aptitude PA20'
      correct: false
    explanation: PE40 permet l’exploration encadrée jusqu’à 40 m. L’accord du DP ne transforme pas
      une aptitude PA20 en PA40.
- id: n2-prerogatives-encadre-trentecinq-001
  type: mcq
  deck: Réglementation::Prérogatives
  levels:
  - N2
  tags:
  - chapitre::01
  - prerogatives
  - angle::scenario
  status: reviewed
  source_id: P011
  review:
    fact_check: pass
    sources:
    - S1 — Théorie N2 Stade de Vanves, édition 2024, p.3–4 (source pédagogique)
    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: Un N2 majeur est équipé pour une exploration à l’air à 35 m en France. Un guide qualifié
      l’encadre et le DP autorise cette plongée. Est-ce compatible avec ses aptitudes N2 ?
    choices:
    - text: 'Oui : 35 m se situe dans la zone PE40'
      correct: true
    - text: 'Non : un N2 ne peut jamais dépasser 20 m'
      correct: false
    - text: 'Non : PE40 exige d’atteindre exactement 40 m'
      correct: false
    - text: 'Oui : parce que le N2 possède une aptitude PA40'
      correct: false
    explanation: La profondeur proposée reste dans la zone encadrée du N2. Cette compatibilité ne
      dispense pas de respecter l’organisation, les conditions et les consignes de la plongée.
- id: n2-prerogatives-aptitude-restrictive-001
  type: mcq
  deck: Réglementation::Prérogatives
