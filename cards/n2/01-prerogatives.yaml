  fr:
    question: Dans le cursus FFESSM, quel est l’âge minimal de délivrance de PA20 ou du N2, une fois les
      compétences acquises ?
    choices:
    - text: 15 ans
      correct: true
    - text: 14 ans
      correct: false
    - text: 16 ans
      correct: false
    - text: 18 ans
      correct: false
    explanation: PA20 et N2 peuvent être délivrés dès 15 ans, mais l’autonomie ne s’exerce qu’à partir
      de 16 ans avec les autres conditions requises. À 15 ans, PA20 valide donc une formation acquise
      en avance. Le N2 comprend aussi PE40, qui permet la plongée encadrée jusqu’à 40 m sous les restrictions
      applicables aux moins de 16 ans. PA20 seul ne confère pas PE40.
