    - 'FFESSM — MFT N2, version mai 2026, p.3–4, vérifié le 2026-10-05 : https://api.ffessm.fr/V1/Commissions/ManuelFormationList/Download/d7c761c8-79ed-42f2-a675-90e4c6095a56'
    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: Selon le MFT N2 FFESSM de mai 2026, à quel âge peut-on au plus tôt entrer en formation
      et obtenir PA20 ou le N2 ?
    choices:
    - text: 15 ans
      correct: true
    - text: 14 ans
      correct: false
    - text: 16 ans
      correct: false
    - text: 18 ans
      correct: false
    explanation: 'La possibilité de certification à 15 ans ne permet pas encore l’exercice de l’autonomie
      : celui-ci commence à 16 ans, avec les autres conditions requises.'
- id: n2-prerogatives-age-autonomie-001
  type: mcq
  deck: Réglementation::Prérogatives
  levels:
  - N2
  tags:
  - chapitre::01
  - prerogatives
