  fr:
    question: À l’étranger, une structure reconnaît un N2/CMAS deux étoiles, mais limite ses sorties encadrées
      à 30 m. Quelle profondeur maximale s’applique à ces sorties pour ce plongeur ?
    choices:
    - text: 30 m, dans les conditions de la structure et du cadre local
      correct: true
    - text: 40 m, dans les conditions des prérogatives françaises PE40
      correct: false
    - text: 20 m, dans les conditions françaises d’autonomie PA20
      correct: false
    explanation: La reconnaissance de la formation ne transpose pas les prérogatives françaises à l’étranger.
      Sur les sorties encadrées décrites, la limite de la structure est 30 m, sous réserve du cadre local
      et de conditions éventuellement plus restrictives. Les 20 m concernent l’autonomie PA20 française,
      pas la sortie encadrée de ce cas.
