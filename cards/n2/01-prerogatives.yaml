  fr:
    question: Pour un plongeur FFESSM de 16 ans, que doit viser l’autorisation du responsable légal nécessaire
      à une exploration PA20 ?
    choices:
    - text: La pratique de la plongée en autonomie
      correct: true
    - text: L’inscription à la formation N2
      correct: false
    - text: La délivrance du brevet N2
      correct: false
    - text: La participation aux plongées encadrées
      correct: false
    explanation: 'Le responsable légal doit donner une autorisation éclairée pour la pratique en autonomie
      : il connaît et accepte cette forme de plongée. Le plongeur doit également avoir les aptitudes requises
      et l’accord du DP.'
