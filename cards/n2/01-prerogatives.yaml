    choices:
    - text: Le N1 FFESSM ou une certification aux aptitudes jugées équivalentes
      correct: true
    - text: Uniquement un baptême de plongée
      correct: false
    - text: Obligatoirement un N1 FFESSM, sans équivalence possible
      correct: false
    - text: Un brevet N3 préalable
      correct: false
    explanation: L’équivalence doit être appréciée au regard des aptitudes nécessaires. La possession
