  fr:
    question: Un N2 FFESSM prépare une sortie à l’étranger. Que doit-il faire de la reconnaissance
      internationale de sa certification ?
    choices:
    - text: Présenter sa certification et vérifier les règles de la destination et de la structure
      correct: true
    - text: Appliquer partout les prérogatives françaises sans autre vérification
      correct: false
    - text: Considérer que deux étoiles autorisent partout l’autonomie à 40 m
      correct: false
    - text: Ignorer les conditions locales dès qu’un club reconnaît sa carte
      correct: false
    explanation: La reconnaissance d’une formation et l’autorisation d’une plongée précise sont deux
      questions différentes. Il faut se renseigner auprès de la structure et respecter le cadre local.
