    question: Les justificatifs de niveau, d’expérience et d’âge d’un candidat à la formation N2 FFESSM
      ont déjà été vérifiés. Quelle paire complémentaire doit encore être vérifiée pour son admission
      ?
    choices:
    - text: Licence FFESSM valide + CACI conforme aux règles fédérales
      correct: true
    - text: Carte N1 + CACI conforme aux règles fédérales
      correct: false
    - text: Licence FFESSM valide + carnet de plongée
      correct: false
    - text: Carte N1 + carnet de plongée
      correct: false
    explanation: 'Le CACI est le **certificat d’absence de contre-indication** : il atteste l’absence
      de contre-indication médicale à la plongée. La licence valide justifie l’affiliation FFESSM. Le
      N1 ou une certification équivalente atteste le niveau préalable, déjà supposé acquis ici ; le carnet
      retrace l’expérience. Ni le brevet ni le carnet ne remplacent le CACI ou la licence.'
