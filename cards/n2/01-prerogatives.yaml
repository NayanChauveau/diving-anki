    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: En France, pour exercer PA20 à 16 ans, quelle autorisation du responsable
      légal est demandée ?
    choices:
    - text: Une autorisation éclairée pour cette pratique en autonomie
      correct: true
    - text: Une autorisation portant uniquement sur le passage du N2
      correct: false
    - text: Une autorisation pour plonger sans aucun DP
      correct: false
    - text: Une autorisation permettant de dépasser 20 m sans guide
      correct: false
    explanation: L’accord porte sur la pratique en autonomie du mineur. Il ne remplace pas la décision
      du DP et n’élargit pas les aptitudes du plongeur.
