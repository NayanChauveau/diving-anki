    - 'Revue factuelle et pédagogique du 2026-10-05 : docs/reviews/01-prerogatives.md'
  fr:
    question: Quel est le nombre maximal de plongées par jour pour un PE40
      âgé de moins de 16 ans ?
    choices:
    - text: Deux plongées
      correct: true
    - text: Une plongée
      correct: false
    - text: Trois plongées
      correct: false
    - text: Quatre plongées
      correct: false
    explanation: 'Deux plongées au maximum par jour, séparées d’au moins trois heures. Si la première
      a dépassé 30 m, la seconde est limitée à 20 m. Les plongées doivent aussi rester sans
      palier obligatoire selon le moyen de désaturation utilisé.'
- id: n2-prerogatives-pe40-moins-seize-intervalle-001
  type: mcq
  deck: Réglementation::Prérogatives
