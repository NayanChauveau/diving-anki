  fr:
    question: Quels signes peuvent annoncer un essoufflement en immersion avant une perte de contrôle ?
    choices:
    - text: Respiration haletante, manque d’air et récupération difficile
      correct: true
    - text: Douleur faciale et saignement nasal lors de la descente
      correct: false
    - text: Marbrures cutanées et douleur articulaire après la sortie
      correct: false
    explanation: '**Respiration rapide ou haletante, sensation de manquer d’air et difficulté à récupérer.**
      Une consommation qui augmente ou une agitation peuvent l’accompagner. Ces signes doivent être signalés
      tôt ; ils ne permettent pas d’exclure un problème de matériel ou une autre cause.'
