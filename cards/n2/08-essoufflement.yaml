  fr:
    question: Un plongeur peu entraîné accélère fortement son palmage pour suivre une palanquée. Pourquoi
      cela favorise-t-il l’essoufflement ?
    choices:
    - text: La production de CO₂ augmente et peut dépasser les capacités d’élimination
      correct: true
    - text: La fréquence respiratoire augmente et garantit alors l’élimination du CO₂
      correct: false
    - text: L’effort modifie surtout la quantité d’azote dissous, sans augmenter le CO₂ produit
      correct: false
    explanation: '**L’effort augmente la production de CO₂ et le besoin de ventilation.** Si la respiration
      ne suit pas, le CO₂ s’accumule. Une bonne forme, un rythme adapté et une préparation réaliste réduisent
      ce décalage.'
