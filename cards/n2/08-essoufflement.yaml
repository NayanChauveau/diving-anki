  fr:
    question: Plusieurs plongeurs présentent céphalées ou malaise après utilisation de blocs gonflés au
      même endroit. Quel élément empêche d’écarter une contamination au monoxyde de carbone ?
    choices:
    - text: Le monoxyde de carbone peut être présent sans odeur particulière du gaz
      correct: true
    - text: Le monoxyde de carbone nécessite une odeur huileuse perceptible dans le gaz
      correct: false
    - text: Le monoxyde de carbone nécessite une pression de gonflage anormalement élevée
      correct: false
    explanation: 'Le monoxyde de carbone (CO) est inodore : une absence d’odeur ne l’exclut pas. Une pression
      de gonflage normale ne renseigne pas sur la composition du gaz. Transmettre l’origine commune du
      gonflage aux secours et conserver les blocs pour analyse, sans conclure à une cause certaine.'
