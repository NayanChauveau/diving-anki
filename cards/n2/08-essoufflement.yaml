  fr:
    question: 'Dans un modèle simplifié, 150 mL de chaque inspiration ventilent les voies de passage sans
      atteindre les alvéoles. Deux respirations fournissent 7,5 L/min au total : 30 inspirations de 250
      mL ou 15 de 500 mL. Quels débits atteignent les alvéoles, respectivement ?'
    choices:
    - text: 3 L/min et 5,25 L/min
      correct: true
    - text: 7,5 L/min et 7,5 L/min
      correct: false
    - text: 5,25 L/min et 3 L/min
      correct: false
    explanation: 'Pour les petites inspirations : (250 − 150) × 30 = 3 000 mL/min, soit 3 L/min. Pour
      les grandes : (500 − 150) × 15 = 5 250 mL/min, soit 5,25 L/min. À débit total identique, de petites
      inspirations fréquentes renouvellent moins d’air dans les alvéoles, où le CO₂ est éliminé. Le volume
      des voies de passage constitue l’espace mort ; ce modèle explique pourquoi la fréquence seule ne
      garantit pas une ventilation efficace.'
