  fr:
    question: Plusieurs plongeurs dont les blocs ont été gonflés au même endroit présentent un malaise ou
      une gêne respiratoire. Quelle hypothèse supplémentaire faut-il transmettre aux secours ?
    choices:
    - text: Une contamination du gaz doit être envisagée, même sans odeur inhabituelle
      correct: true
    - text: Une contamination du gaz doit être envisagée seulement si son odeur est inhabituelle
      correct: false
    - text: Une contamination du gaz peut être écartée si la pression de gonflage était normale
      correct: false
    explanation: '**Une contamination du gaz respiré est possible.** Les symptômes peuvent être peu spécifiques
      ; l’origine commune du gonflage est un indice utile. Faire évaluer les victimes et préserver les blocs
      pour analyse, sans conclure à partir de la seule odeur.'
