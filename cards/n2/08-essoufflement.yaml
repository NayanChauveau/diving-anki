  fr:
    question: À effort et débit ventilé comparables, quel changement du gaz explique l’augmentation du
      travail respiratoire en profondeur ?
    choices:
    - text: Sa densité augmente et accroît la résistance à son écoulement
      correct: true
    - text: Sa fraction d’oxygène diminue et impose davantage de ventilation
      correct: false
    - text: Sa pression partielle d’oxygène diminue et impose davantage de ventilation
      correct: false
    explanation: 'En profondeur, le gaz est plus dense : son écoulement dans les voies aériennes et le
      matériel demande davantage de travail. Dans l’air de composition inchangée, la fraction d’oxygène
      reste constante et sa pression partielle augmente. Le débit en litres ambiants se distingue du débit
      ramené à la surface.'
