  fr:
    question: Après un palmage soutenu, quel tableau indique surtout une difficulté ventilatoire à signaler
      immédiatement ?
    choices:
    - text: Respiration haletante, sensation de manque d’air et récupération difficile à l’arrêt
      correct: true
    - text: Respiration régulière, euphorie inhabituelle et répétition d’une manipulation
      correct: false
    - text: Respiration régulière, vertige rotatoire et sensation d’oreille bouchée
      correct: false
    explanation: 'Une respiration haletante avec manque d’air et difficulté à récupérer annonce une difficulté
      ventilatoire. Une euphorie et des gestes répétitifs orientent plutôt vers une altération du jugement
      ; un vertige avec oreille bouchée évoque une atteinte auriculaire. Un essoufflement n’établit pas
      à lui seul sa cause : effort, matériel et autres problèmes doivent être considérés.'
