  fr:
    question: Dans un courant, le palmage nécessaire au trajet augmente fortement l’effort et la ventilation.
      Sur quel critère décider d’adapter le parcours avant l’épuisement ?
    choices:
    - text: L’effort devenu excessif et la difficulté à récupérer, même avec une pression de bloc élevée
      correct: true
    - text: L’atteinte de la pression de réserve prévue, si la profondeur reste inchangée
      correct: false
    - text: L’atteinte du temps de demi-tour prévu, si la pression du bloc reste élevée
      correct: false
    explanation: Les marges respiratoires peuvent devenir insuffisantes avant d’atteindre le seuil de
      gaz ou le temps de demi-tour. Un effort excessif conduit à adapter le trajet ou à terminer ensemble
      selon les possibilités du site. Disposer de gaz ne garantit pas de pouvoir le ventiler efficacement.
