  fr:
    front: En immersion, un plongeur présente un essoufflement pendant un palmage soutenu. Quelles premières
      actions engager avec la palanquée ?
    back: '**Arrêter l’effort, signaler immédiatement la difficulté et organiser la fin de plongée avec
      l’équipier ou le guide.** Conserver le détendeur, stabiliser la situation et faciliter une respiration
      efficace. La remontée se fait de façon contrôlée, avec assistance pour réduire l’effort.'
- id: n2-essoufflement-assistance-001
  type: basic
  deck: Prévention des accidents
  levels:
  - N2
  tags:
