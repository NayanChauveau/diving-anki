cards:
- id: n2-essoufflement-profondeur-001
  type: basic
  deck: Prévention des accidents
  levels:
  - N2
  tags:
  - chapitre::08
  - essoufflement
  status: reviewed
  source_id: P261
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.17.
    - 'BSAC — Safe diving guide, Gas, consulté le 2026-10-06 : https://www.bsac.com/safety/safe-diving-guide/gas/'
    - 'Revue du 2026-10-06 : docs/reviews/08-essoufflement.md'
    fact_check: pass
  fr:
    front: À ventilation comparable, pourquoi respirer devient-il plus exigeant lorsque la profondeur
      augmente ?
    back: '**Le gaz devient plus dense**, ce qui augmente les résistances à son écoulement et le travail
      respiratoire. L’immersion et le matériel peuvent aussi contribuer à cet effort.'
- id: n2-essoufflement-co2-001
  type: basic
  deck: Prévention des accidents
  levels:
  - N2
  tags:
  - chapitre::08
  - essoufflement
  status: reviewed
  source_id: P262
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.17.
    - 'BSAC — Safe diving guide, Gas, consulté le 2026-10-06 : https://www.bsac.com/safety/safe-diving-guide/gas/'
    - 'DAN — Factors Contributing to Decompression Stress : https://dan.org/health-medicine/health-resource/dive-medical-reference-books/decompression-sickness/contributing-factors/'
    - 'Revue du 2026-10-06 : docs/reviews/08-essoufflement.md'
    fact_check: pass
  fr:
    front: Pourquoi une respiration très rapide et superficielle peut-elle entretenir l’essoufflement
      au lieu de l’arrêter ?
    back: '**Elle peut ventiler insuffisamment les alvéoles tout en augmentant l’effort respiratoire.**
      Le dioxyde de carbone produit par l’effort est alors moins bien éliminé ; son accumulation stimule
      encore la respiration. La fréquence seule ne garantit pas une ventilation efficace.'
- id: n2-essoufflement-effort-001
  type: basic
  deck: Prévention des accidents
  levels:
  - N2
  tags:
  - chapitre::08
  - essoufflement
  status: reviewed
  source_id: P263
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.17.
    - 'BSAC — Safe diving guide, Gas, consulté le 2026-10-06 : https://www.bsac.com/safety/safe-diving-guide/gas/'
    - 'Revue du 2026-10-06 : docs/reviews/08-essoufflement.md'
    fact_check: pass
  fr:
    front: Un plongeur peu entraîné accélère fortement son palmage pour suivre une palanquée. Pourquoi
      cela favorise-t-il l’essoufflement ?
    back: '**L’effort augmente la production de CO₂ et le besoin de ventilation.** Si la respiration ne
      suit pas, le CO₂ s’accumule. Une bonne forme, un rythme adapté et une préparation réaliste réduisent
      ce décalage.'
- id: n2-essoufflement-materiel-001
  type: basic
  deck: Prévention des accidents
  levels:
  - N2
  tags:
  - chapitre::08
  - essoufflement
  status: reviewed
  source_id: P265
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.17.
    - 'BSAC — Safe diving guide, Gas, consulté le 2026-10-06 : https://www.bsac.com/safety/safe-diving-guide/gas/'
    - https://dan.org/alert-diver/article/tank-valves-and-out-of-air-emergencies/
    - 'Revue du 2026-10-06 : docs/reviews/08-essoufflement.md'
    fact_check: pass
  fr:
    front: Avant immersion, pourquoi faut-il contrôler que le bloc est ouvert et que le détendeur fournit
      bien du gaz en respirant dessus ?
    back: '**Un débit insuffisant ou une résistance anormale à l’inspiration peuvent gêner la ventilation.**
      Ce contrôle ne remplace pas l’entretien du détendeur ; un problème persistant doit être résolu avant
      de plonger.'
- id: n2-essoufflement-air-pollue-001
  type: basic
  deck: Prévention des accidents
  levels:
  - N2
  tags:
  - chapitre::08
  - essoufflement
  status: reviewed
  source_id: P267
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.17.
    - 'DAN — Breathing Gas Contamination, consulté le 2026-10-06 : https://dan.org/safety-prevention/diver-safety/psa/breathing-gas-contamination/'
    - 'Revue du 2026-10-06 : docs/reviews/08-essoufflement.md'
    fact_check: pass
  fr:
    front: Plusieurs plongeurs ayant fait gonfler leurs blocs au même endroit présentent un malaise ou
      une gêne respiratoire. Pourquoi faut-il envisager autre chose qu’un effort excessif ?
    back: '**Une contamination du gaz respiré est possible.** Les symptômes peuvent être peu spécifiques
      ; l’origine commune du gonflage est un indice utile. Faire évaluer les victimes et préserver les
      blocs pour analyse, sans conclure à partir de la seule odeur.'
- id: n2-essoufflement-signes-001
  type: basic
  deck: Prévention des accidents
  levels:
