    fact_check: pass
  fr:
    front: La palanquée rencontre un courant contre lequel elle doit palmer fortement pour maintenir le
      trajet. Que faut-il remettre en cause avant l’épuisement ?
    back: '**Le trajet et l’effort imposé par la plongée.** Adapter le parcours ou interrompre la plongée
      selon le briefing et les possibilités du site ; une lutte prolongée augmente besoins en air et risque
      d’essoufflement.'
