  fr:
    question: Pourquoi une respiration très rapide et superficielle peut-elle entretenir l’essoufflement
      au lieu de l’arrêter ?
    choices:
    - text: Le débit alvéolaire peut rester insuffisant malgré un débit ventilé élevé
      correct: true
    - text: La fréquence respiratoire suffit à mesurer l’élimination alvéolaire du CO₂
      correct: false
    - text: Le débit total ventilé et le débit utile aux alvéoles sont équivalents
      correct: false
    explanation: '**Elle peut ventiler insuffisamment les alvéoles tout en augmentant l’effort respiratoire.**
      Le dioxyde de carbone produit par l’effort est alors moins bien éliminé ; son accumulation stimule
      encore la respiration. La fréquence seule ne garantit pas une ventilation efficace.'
