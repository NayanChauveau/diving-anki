  fr:
    question: En immersion, un plongeur présente un essoufflement pendant un palmage soutenu. Quelles premières
      actions engager avec la palanquée ?
    choices:
    - text: Stopper l’effort, signaler et organiser une sortie assistée
      correct: true
    - text: Maintenir le palmage et ralentir volontairement sa respiration
      correct: false
    - text: S’écarter de la palanquée pour rejoindre directement la surface
      correct: false
    explanation: '**Arrêter l’effort, signaler immédiatement la difficulté et organiser la fin de plongée
      avec l’équipier ou le guide.** Conserver le détendeur, stabiliser la situation et faciliter une respiration
      efficace. La remontée se fait de façon contrôlée, avec assistance pour réduire l’effort.'
