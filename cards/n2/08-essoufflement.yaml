  fr:
    question: Lors d’une remontée assistée pour essoufflement, comment associer la réduction de l’effort
      et la gestion de la remontée ?
    choices:
    - text: Réduire l’effort en respectant vitesse et obligations de remontée
      correct: true
    - text: Remonter à la vitesse MN90 indépendamment de l’ordinateur
      correct: false
    - text: Viser la disparition de l’essoufflement avant de surveiller la vitesse
      correct: false
    explanation: '**L’assistance réduit l’effort, mais la remontée doit respecter la vitesse, la respiration
      libre et les obligations de désaturation.** Un gaz moins dense à moindre profondeur peut faciliter
      la ventilation ; cela ne justifie ni une fuite vers la surface ni une séparation. La palanquée organise
      ensemble la sortie et surveille le gaz disponible.'
