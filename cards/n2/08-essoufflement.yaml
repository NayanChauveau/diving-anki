  fr:
    question: À ventilation comparable, pourquoi respirer devient-il plus exigeant lorsque la profondeur
      augmente ?
    choices:
    - text: La densité du gaz augmente et accroît les résistances à la ventilation
      correct: true
    - text: Le débit ventilé est multiplié par la pression absolue, même à effort comparable
      correct: false
    - text: La densité du gaz diminue et réduit l’efficacité de chaque inspiration
      correct: false
    explanation: '**Le gaz devient plus dense**, ce qui augmente les résistances à son écoulement et le
      travail respiratoire. L’immersion et le matériel peuvent aussi contribuer à cet effort.'
