  fr:
    question: Une respiration haletante apparaît pendant un palmage soutenu, avec du gaz disponible et
      un détendeur fonctionnel. Quel enchaînement initial convient ?
    choices:
    - text: Signaler, stopper le palmage et se stabiliser avec l’équipier pour organiser la sortie
      correct: true
    - text: Signaler, poursuivre le palmage et se concentrer sur une expiration plus lente
      correct: false
    - text: Signaler, poursuivre le palmage et passer sur le détendeur de secours
      correct: false
    explanation: Réduire la demande ventilatoire commence par l’arrêt de l’effort. Signaler immédiatement,
      se stabiliser avec l’aide de l’équipier et organiser la fin de plongée. Un contrôle respiratoire
      ou un changement de détendeur ne compense pas le maintien de l’effort dans ce cas où la source de
      gaz est fonctionnelle.
