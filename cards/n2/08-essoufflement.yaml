  fr:
    question: Un plongeur essoufflé ressent une envie de retirer son détendeur et de remonter précipitamment.
      Pourquoi doit-il conserver une source de gaz et demander de l’aide ?
    choices:
    - text: Retrait et fuite peuvent associer inhalation d’eau et remontée incontrôlée
      correct: true
    - text: Le retrait du détendeur laisse expirer le CO₂ et dispense d’une assistance
      correct: false
    - text: La fuite vers moins profond permet d’ignorer les contraintes de vitesse et de paliers
      correct: false
    explanation: '**Cela peut entraîner une inhalation d’eau ou une remontée incontrôlée.** L’essoufflement
      et la panique peuvent altérer le jugement ; conserver une source de gaz et obtenir l’aide de l’équipier
      permettent de maîtriser la sortie.'
