    - 'BSAC — Safe diving guide, Gas, consulté le 2026-10-06 : https://www.bsac.com/safety/safe-diving-guide/gas/'
    - 'FFESSM CMPN — CAT accident de plongée bouteille ou recycleur, consulté le 2026-10-06 : https://medical.ffessm.fr/cat-accident-de-plongee-bouteille-ou-recycleur'
    - 'Revue du 2026-10-06 : docs/reviews/08-essoufflement.md'
    - 'Relecture globale du 2026-10-06 : docs/reviews/REVUE_FINALE_N2.md'
    fact_check: pass
  fr:
    front: Pourquoi une remontée assistée pour un plongeur essoufflé doit-elle rester contrôlée ?
    back: '**L’assistance réduit l’effort, mais la remontée doit respecter la vitesse, la respiration
      libre et les obligations de désaturation.** Un gaz moins dense à moindre profondeur peut faciliter
      la ventilation ; cela ne justifie ni une fuite vers la surface ni une séparation. La palanquée organise
      ensemble la sortie et surveille le gaz disponible.'
- id: n2-essoufflement-courant-001
  type: basic
  deck: Prévention des accidents
