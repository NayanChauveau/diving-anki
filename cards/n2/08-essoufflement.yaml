  fr:
    question: Pourquoi retirer son détendeur pendant un essoufflement ne facilite-t-il pas l’élimination
      du CO₂ en immersion ?
    choices:
    - text: Il supprime l’accès au gaz respirable sans corriger la ventilation alvéolaire
      correct: true
    - text: Il augmente la fraction d’oxygène disponible en diminuant la résistance du gaz
      correct: false
    - text: Il diminue la pression ambiante des alvéoles en supprimant la résistance du détendeur
      correct: false
    explanation: Éliminer le CO₂ demande une ventilation efficace avec une source de gaz respirable. Retirer
      le détendeur expose à l’inhalation d’eau et ne réduit ni la pression ambiante ni ne fournit davantage
      d’oxygène. Signaler la difficulté et demander l’aide de l’équipier permet d’organiser une sortie
      contrôlée.
