  fr:
    question: Pendant un palmage plus intense, le détendeur fonctionne mais la ventilation ne parvient
      plus à suivre l’effort. Pourquoi le CO₂ peut-il s’accumuler ?
    choices:
    - text: La production métabolique de CO₂ dépasse ce que la ventilation élimine
      correct: true
    - text: Le CO₂ est moins produit par les muscles, mais sa pression partielle augmente avec le palmage
        à profondeur égale
      correct: false
    - text: Le CO₂ est davantage produit par les muscles, mais la ventilation totale suffit à assurer
        son élimination
      correct: false
    explanation: Les muscles produisent davantage de CO₂ pendant l’effort. Si la ventilation ne l’élimine
      pas suffisamment, il s’accumule même si le détendeur fonctionne. La consommation d’un bloc d’air
      ne remplace pas son oxygène par l’azote des tissus ni par le CO₂ expiré.
