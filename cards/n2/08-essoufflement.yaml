    - 'BSAC — Safe diving guide, Gas, consulté le 2026-10-06 : https://www.bsac.com/safety/safe-diving-guide/gas/'
    - 'FFESSM CMPN — CAT accident de plongée bouteille ou recycleur, consulté le 2026-10-06 : https://medical.ffessm.fr/cat-accident-de-plongee-bouteille-ou-recycleur'
    - 'Revue du 2026-10-06 : docs/reviews/08-essoufflement.md'
    fact_check: pass
  fr:
    front: Quels signes peuvent annoncer un essoufflement en immersion avant une perte de contrôle ?
    back: '**Respiration rapide ou haletante, sensation de manquer d’air et difficulté à récupérer.**
      Une consommation qui augmente ou une agitation peuvent l’accompagner. Ces signes doivent être signalés
      tôt ; ils ne permettent pas d’exclure un problème de matériel ou une autre cause.'
