  fr:
    question: La palanquée rencontre un courant contre lequel elle doit palmer fortement pour maintenir
      le trajet. Que faut-il remettre en cause avant l’épuisement ?
    choices:
    - text: Adapter le trajet ou interrompre la plongée avec la palanquée
      correct: true
    - text: Conserver le trajet en utilisant le gaz jusqu’à la réserve habituelle
      correct: false
    - text: Accélérer le palmage pour réduire le temps passé dans le courant
      correct: false
    explanation: '**Le trajet et l’effort imposé par la plongée.** Adapter le parcours ou interrompre la
      plongée selon le briefing et les possibilités du site ; une lutte prolongée augmente besoins en air
      et risque d’essoufflement.'
