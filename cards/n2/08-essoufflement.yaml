  fr:
    question: Un plongeur essoufflé est assisté pendant une remontée avec un ordinateur. Quel principe
      permet de réduire son effort tout en gérant la désaturation ?
    choices:
    - text: L’assistant prend en charge l’effort et contrôle vitesse et paliers indiqués
      correct: true
    - text: L’assistant prend en charge l’effort et applique la vitesse des tables à la place de l’ordinateur
      correct: false
    - text: L’assistant prend en charge l’effort et transforme les paliers obligatoires en arrêt de sécurité
      correct: false
    explanation: L’assistance vise à réduire l’effort tout en gardant une remontée contrôlée, une respiration
      libre et le respect des obligations de désaturation. Les indications de l’ordinateur ne sont pas
      remplacées par une vitesse de tables ou par un palier de sécurité facultatif. La palanquée surveille
      aussi le gaz disponible.
