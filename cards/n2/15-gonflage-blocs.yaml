  fr:
    question: Pour transporter personnellement un bloc d’air gonflé en voiture, quelle précaution matérielle
      est essentielle ?
    choices:
    - text: Immobiliser le bloc et protéger sa robinetterie
      correct: true
    - text: Le coucher sur la banquette, sans fixation si le trajet est court
      correct: false
    - text: Le poser verticalement dans le coffre, sans fixation si le bloc est plein
      correct: false
    explanation: '**L’immobiliser pour éviter qu’il roule ou se projette, et protéger la robinetterie des
      chocs et de l’ouverture accidentelle.** Éviter la chaleur excessive et respecter les règles du transport
      concerné ; transport routier personnel et avion n’ont pas les mêmes conditions.'
