    - S1 — Théorie N2 Stade de Vanves 2024, p.29–30 ; tableau p.34 inspecté visuellement.
    - S1 p.29, compresseur et tampons.
    - 'Revue du 2026-10-06 : docs/reviews/15-gonflage-blocs.md'
    fact_check: pass
  fr:
    question: Quelle différence entre gonfler directement avec un compresseur et utiliser une batterie de
      bouteilles tampons ?
    choices:
    - text: 'Compresseur : production de gaz comprimé ; tampons : transfert de gaz stocké'
      correct: true
    - text: 'Compresseur : transfert de gaz stocké ; tampons : production de gaz comprimé'
      correct: false
    - text: Compresseur et tampons produisent le gaz comprimé pendant le remplissage
      correct: false
    explanation: '**En direct, le compresseur alimente le bloc ; avec les tampons, une réserve d’air déjà
      comprimé est transvasée.** Le transfert dépend de la différence de pression et des réglages de la
      station ; le tampon ne produit pas lui-même du gaz.'
