  fr:
    question: Sur un bi-bloc, quel élément faut-il examiner pour savoir si une fuite peut vider le gaz
      des deux bouteilles ?
    choices:
    - text: La communication de gaz entre leurs robinetteries
      correct: true
    - text: Le nombre de seconds étages montés sur l’ensemble
      correct: false
    - text: Le nombre de manomètres montés sur l’ensemble
      correct: false
    explanation: Une liaison entre les bouteilles peut permettre à une fuite de puiser dans les deux volumes.
      L’indépendance dépend de la robinetterie et de cette liaison, pas du nombre d’embouts ou de manomètres.
      La seule présence de deux bouteilles ne démontre pas deux réserves indépendantes.
