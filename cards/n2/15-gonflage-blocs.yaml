  fr:
    question: Une prise d’air de compresseur est proche d’un moteur thermique en marche. Quelle contamination
      du gaz respirable est particulièrement liée à l’aspiration de ses gaz d’échappement ?
    choices:
    - text: Du monoxyde de carbone issu de la combustion
      correct: true
    - text: Des aérosols d’huile issus de la lubrification du compresseur
      correct: false
    - text: De la vapeur d’eau issue de l’humidité atmosphérique
      correct: false
    explanation: Le monoxyde de carbone (CO) présent dans les gaz d’échappement peut être aspiré puis
      comprimé dans les blocs. La prise d’air doit être placée loin de ces rejets. L’huile du compresseur
      et l’humidité sont d’autres sources de contamination, à maîtriser par l’entretien et le traitement
      de l’air.
