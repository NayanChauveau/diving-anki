  fr:
    question: Pourquoi un bloc vide ne doit-il pas rester robinet ouvert dans l’eau ou au fond d’un bateau
      mouillé ?
    choices:
    - text: L’eau peut entrer et favoriser corrosion et contamination
      correct: true
    - text: L’ouverture maintient une surpression empêchant l’entrée d’eau
      correct: false
    - text: L’eau évacue les dépôts et protège le métal intérieur
      correct: false
    explanation: '**De l’eau peut entrer et favoriser corrosion et contamination.** Le protéger de l’eau
      ; s’il s’est entièrement vidé en plongée, la notice Roth recommande de laisser le détendeur monté
      jusqu’à sa mise à l’abri.'
