  fr:
    question: La date de requalification d’un bloc a dépassé l’échéance de son régime de suivi, mais il
      garde sa pression sans fuite. Peut-on le faire gonfler pour une dernière plongée ?
    choices:
    - text: 'Non : retirer du service jusqu’au contrôle et à la remise en service'
      correct: true
    - text: 'Oui : l’absence de fuite valide une dernière utilisation'
      correct: false
    - text: 'Oui : une inspection informelle reporte l’échéance'
      correct: false
    explanation: '**Non : le retirer du service jusqu’au contrôle requis et à une remise en service conforme.**
      L’absence de fuite ne démontre pas la tenue du métal ni la validité du suivi.'
