  fr:
    question: Un bloc porte PS 230 bar et PT 345 bar. Quelle valeur fixe sa pression maximale admissible
      en service ?
    choices:
    - text: 230 bar
      correct: true
    - text: 345 bar
      correct: false
    - text: 200 bar
      correct: false
    explanation: 'PS désigne la pression maximale admissible : ici 230 bar. PT 345 bar est la pression
      d’épreuve. La valeur courante de 200 bar sur d’autres blocs ne remplace pas le marquage de celui-ci.'
