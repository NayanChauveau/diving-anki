  fr:
    question: Un bloc porte PS 230 bar et PT 345 bar. Quelle proposition interprète correctement sa limite
      admissible de gonflage ?
    choices:
    - text: La limite est PS 230 bar ; PT désigne la pression d’épreuve
      correct: true
    - text: La limite est PT 345 bar ; PS désigne la pression de gonflage habituelle
      correct: false
    - text: La limite est PS 230 bar, portée à PT 345 bar si l’inspection annuelle est à jour
      correct: false
    explanation: '**PS 230 bar.** PS est la pression maximale admissible ; PT 345 bar est la pression d’épreuve,
      pas une pression de remplissage autorisée.'
