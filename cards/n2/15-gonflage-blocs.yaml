  fr:
    question: Des éclats de peinture et de la rouille apparaissent sous le culot d’un bloc. Pourquoi ne
      suffit-il pas de recouvrir la zone de peinture ?
    choices:
    - text: Contrôler le métal et la corrosion avant remise en état
      correct: true
    - text: Repeindre suffit si la pression du bloc ne baisse pas
      correct: false
    - text: Changer le culot suffit si la rouille reste extérieure
      correct: false
    explanation: '**Il faut faire vérifier l’état du métal et la corrosion**, avant de décider de l’entretien
      ou du maintien en service. La peinture protège l’extérieur mais peut masquer une dégradation ; elle
      ne restaure pas l’épaisseur perdue.'
