  fr:
    question: Pourquoi éviter de laisser un bloc gonflé dans un véhicule surchauffé et de le faire tomber
      ?
    choices:
    - text: La chaleur peut augmenter la pression ; un choc peut léser la bouteille ou son robinet
      correct: true
    - text: La chaleur peut augmenter la pression ; la tenue à l’épreuve garantit la résistance aux chocs
      correct: false
    - text: La chaleur ne change pas la pression si le robinet reste fermé ; les chocs restent dangereux
      correct: false
    explanation: '**La chaleur augmente la pression du gaz et un choc peut endommager bouteille ou robinetterie.**
      Protéger le bloc des températures excessives et des impacts ; sa résistance à la pression ne le rend
      pas insensible aux dégâts.'
