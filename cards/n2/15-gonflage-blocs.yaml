  fr:
    question: Un N2 souhaite utiliser seul la station de gonflage de son club. À quel titre doit-il être
      autorisé à la conduire, en plus de ses compétences de plongeur ?
    choices:
    - text: Comme utilisateur compétent de la station, reconnu par son exploitant
      correct: true
    - text: Comme plongeur autonome, autorisé par le directeur de plongée
      correct: false
    - text: Comme inspecteur des bouteilles, qualifié TIV par la fédération
      correct: false
    explanation: Le gonflage exige une compétence propre à la station et l’autorisation prévue par son
      exploitant. Le N2 atteste des compétences de plongée ; la qualification TIV (technicien en inspection
      visuelle) concerne l’inspection des bouteilles. Ni l’une ni l’autre ne vaut à elle seule autorisation
      de conduire cette station.
