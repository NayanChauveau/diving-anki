  fr:
    question: Pourquoi ne faut-il pas vider brutalement un bloc en ouvrant grand son robinet à l’air libre
      ?
    choices:
    - text: La détente rapide refroidit fortement le gaz et la robinetterie
      correct: true
    - text: La détente rapide chauffe la robinetterie jusqu’au risque de brûlure
      correct: false
    - text: La détente rapide stabilise la température du gaz restant
      correct: false
    explanation: '**La détente rapide refroidit fortement le gaz et la robinetterie**, avec risque de givrage
      et de condensation. Le jet et le bruit ajoutent des dangers ; une dépressurisation se fait dans les
      conditions adaptées par une personne compétente.'
