    fact_check: pass
  fr:
    question: Pour comparer la flottabilité de deux modèles de blocs acier et aluminium, quelles données
      faut-il prendre en compte à la pression considérée ?
    choices:
    - text: La masse totale et le volume extérieur de chaque bloc
      correct: true
    - text: La masse totale et la capacité intérieure de chaque bloc
      correct: false
    - text: Le matériau et la capacité intérieure de chaque bloc
      correct: false
    explanation: La poussée d’Archimède dépend du volume extérieur déplacé ; le poids dépend de la masse
      du bloc et du gaz contenu. La capacité intérieure ne donne pas le volume d’eau déplacé. Le matériau
      seul ne suffit donc pas à déduire le lestage nécessaire.
