  fr:
    question: Des traces de corrosion apparaissent sous le culot d’un bloc acier, sans fuite constatée.
      Que démontre cette absence de fuite au moment du contrôle ?
    choices:
    - text: L’étanchéité actuelle, sans établir l’épaisseur de métal restante
      correct: true
    - text: L’épaisseur de métal restante, sans établir l’état de la peinture
      correct: false
    - text: La validité de la requalification, sans établir l’état du culot
      correct: false
    explanation: La corrosion peut réduire l’épaisseur résistante tout en laissant la bouteille étanche.
      L’absence de fuite ne valide ni sa tenue mécanique ni la validité de son suivi. Faire évaluer l’état
      du métal avant remise en état ; la peinture ne remplace pas le métal perdu.
