    - S1 — Théorie N2 Stade de Vanves 2024, p.29–30 ; tableau p.34 inspecté visuellement.
    - 'Roth Mions — Notice FC244 révision 9 janvier 2020, p.1, consultée le 2026-10-06 : https://roth2.com/wp-content/uploads/2021/06/Notice_FR-2020-V9-2.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/15-gonflage-blocs.md'
    fact_check: pass
  fr:
    front: Pourquoi un bloc vide ne doit-il pas rester robinet ouvert dans l’eau ou au fond d’un bateau
      mouillé ?
    back: '**De l’eau peut entrer et favoriser corrosion et contamination.** Le protéger de l’eau ; s’il
      s’est entièrement vidé en plongée, la notice Roth recommande de laisser le détendeur monté jusqu’à
      sa mise à l’abri.'
- id: n2-gonflage-blocs-vidange-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::15
  - gonflage-blocs
  status: reviewed
  source_id: P496
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.29–30 ; tableau p.34 inspecté visuellement.
    - 'Roth Mions — Notice FC244 révision 9 janvier 2020, p.1, consultée le 2026-10-06 : https://roth2.com/wp-content/uploads/2021/06/Notice_FR-2020-V9-2.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/15-gonflage-blocs.md'
    fact_check: pass
  fr:
    front: Pourquoi ne faut-il pas vider brutalement un bloc en ouvrant grand son robinet à l’air libre
      ?
    back: '**La détente rapide refroidit fortement le gaz et la robinetterie**, avec risque de givrage
      et de condensation. Le jet et le bruit ajoutent des dangers ; une dépressurisation se fait dans
      les conditions adaptées par une personne compétente.'
- id: n2-gonflage-blocs-corrosion-001
  type: basic
  deck: Matériel et préparation
  levels:
