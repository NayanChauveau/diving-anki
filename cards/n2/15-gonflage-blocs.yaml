  fr:
    question: Le brevet N2 suffit-il à autoriser l’utilisation autonome d’une station de gonflage du club
      ?
    choices:
    - text: 'Non : compétence et autorisation propres à la station sont nécessaires'
      correct: true
    - text: 'Oui : l’autonomie de plongée vaut autorisation de gonflage'
      correct: false
    - text: 'Oui : si un autre N2 reste présent à la station'
      correct: false
    explanation: '**Non.** Le gonflage exige la compétence et l’autorisation prévues pour cette station,
      sous la responsabilité de son exploitant. Le brevet de plongeur ne vaut pas habilitation de gonflage.'
