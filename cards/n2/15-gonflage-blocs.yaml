    fact_check: pass
  fr:
    question: Deux bouteilles réunies en bi-bloc garantissent-elles automatiquement deux réserves indépendantes
      ?
    choices:
    - text: 'Non : leur robinetterie et leur liaison déterminent l’indépendance'
      correct: true
    - text: 'Oui : deux bouteilles physiques donnent deux réserves indépendantes'
      correct: false
    - text: 'Oui : deux manomètres suffisent à garantir l’indépendance'
      correct: false
    explanation: '**Non : cela dépend de leur robinetterie et de leur liaison éventuelle.** Deux bouteilles
      reliées peuvent partager le gaz ; deux volumes physiquement présents ne prouvent pas leur indépendance
      en cas de fuite.'
