  fr:
    question: Un bloc est équipé d’un culot en PVC. Quelle fonction de cet accessoire faut-il distinguer
      de l’arrimage nécessaire pour le transporter en voiture ?
    choices:
    - text: Maintenir le bloc debout lorsqu’il est posé sur sa base
      correct: true
    - text: Maintenir le bloc dans le véhicule lors d’un freinage
      correct: false
    - text: Protéger le robinet contre une ouverture accidentelle
      correct: false
    explanation: Le culot permet de poser le bloc verticalement. Il n’assure ni la fixation au véhicule
      ni la protection de la robinetterie. Pendant le transport, immobiliser le bloc et protéger son robinet
      pour réduire les risques de déplacement et d’impact.
