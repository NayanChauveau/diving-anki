  fr:
    question: Un bloc acier entièrement vidé a pris de l’eau par son robinet resté ouvert. Quel mécanisme
      peut dégrader durablement sa paroi intérieure ?
    choices:
    - text: La corrosion du métal au contact de l’humidité
      correct: true
    - text: La déformation élastique du métal lors de la détente
      correct: false
    - text: L’usure du métal par le seul écoulement de l’eau
      correct: false
    explanation: L’eau entrée dans le bloc favorise la corrosion interne, qui peut consommer du métal.
      Une déformation élastique est réversible et ne décrit pas cette dégradation ; le problème n’est
      pas un simple frottement de l’eau. La notice Roth demande de ne pas laisser un bloc vide robinet
      ouvert et de garder le détendeur monté jusqu’à la mise à l’abri si le bloc s’est entièrement vidé
      en plongée.
