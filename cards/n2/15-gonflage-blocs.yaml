  fr:
    question: L’échéance de requalification d’un bloc est dépassée. Quelle opération peut rétablir la
      validité de son suivi pour le remettre en service ?
    choices:
    - text: Une requalification conforme réalisée sous la responsabilité d’un organisme habilité
      correct: true
    - text: Une inspection visuelle annuelle enregistrée par un TIV du club
      correct: false
    - text: Un contrôle d’étanchéité après gonflage à la pression de service
      correct: false
    explanation: Quand la requalification est échue, une inspection annuelle ou un essai sans fuite ne
      la remplace pas. Le bloc doit être retiré du service jusqu’au contrôle requis et à une remise en
      service conforme. TIV signifie technicien en inspection visuelle ; sa fonction ne se confond pas
      avec la requalification.
