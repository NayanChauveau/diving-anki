  fr:
    question: Lors d’une vidange très rapide d’un bloc à l’air libre, quel effet thermique explique le
      risque de givrage de la robinetterie ?
    choices:
    - text: Le refroidissement associé à la détente du gaz
      correct: true
    - text: L’échauffement associé à la compression du gaz
      correct: false
    - text: Le refroidissement associé à l’augmentation de pression du gaz
      correct: false
    explanation: Le gaz se détend lors de la dépressurisation ; le refroidissement peut provoquer du givrage
      et favoriser la condensation. La compression lors du gonflage correspond à une autre phase, qui
      échauffe le gaz. La notice Roth demande de ne pas vider rapidement la bouteille.
