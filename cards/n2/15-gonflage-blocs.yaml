    - 'Revue du 2026-10-06 : docs/reviews/15-gonflage-blocs.md'
    fact_check: pass
  fr:
    front: La date de requalification d’un bloc a dépassé l’échéance de son régime de suivi, mais il garde
      sa pression sans fuite. Peut-on le faire gonfler pour une dernière plongée ?
    back: '**Non : le retirer du service jusqu’au contrôle requis et à une remise en service conforme.**
      L’absence de fuite ne démontre pas la tenue du métal ni la validité du suivi.'
