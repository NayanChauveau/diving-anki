  fr:
    question: En France, pour un bloc métallique de plongée suivi selon le cahier des charges donnant droit
      au régime de six ans, quelles échéances distinguer de la requalification ordinaire ?
    choices:
    - text: 6 ans au lieu de 2, avec inspections et traçabilité requises
      correct: true
    - text: 6 ans au lieu de 2, sans inspection entre requalifications
      correct: false
    - text: 2 ans au lieu de 6, avec une inspection tous les 2 ans
      correct: false
    explanation: '**Requalification maximale de 6 ans au lieu de 2 ans en régime ordinaire.** Le régime
      de 6 ans exige les inspections et la traçabilité du cahier des charges : inspection au moins annuelle,
      ou avant réutilisation si plus d’un an s’est écoulé. Une simple vérification informelle ne suffit
      pas.'
