  fr:
    question: Un bloc gonflé, robinet fermé, subit une forte chaleur puis un choc sur sa robinetterie.
      Quelle distinction décrit les deux risques ?
    choices:
    - text: La chaleur augmente la pression ; le choc peut endommager l’assemblage
      correct: true
    - text: La chaleur diminue la pression ; le choc peut endommager l’assemblage
      correct: false
    - text: La chaleur augmente la pression ; le choc ne concerne que l’étanchéité
      correct: false
    explanation: Dans un volume fermé, l’échauffement augmente la pression du gaz. Un choc peut endommager
      la bouteille ou la robinetterie, au-delà d’une simple fuite de joint. La tenue à une épreuve de
      pression ne démontre pas la résistance à un impact.
