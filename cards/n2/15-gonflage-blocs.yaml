    fact_check: pass
  fr:
    question: Pourquoi une station de gonflage aspire-t-elle l’air loin de sources de fumées ou d’échappement
      ?
    choices:
    - text: Les contaminants aspirés peuvent passer dans le gaz des blocs
      correct: true
    - text: La compression détruit les contaminants avant filtration
      correct: false
    - text: Les filtres garantissent la qualité malgré une prise d’air polluée
      correct: false
    explanation: '**Le compresseur comprime l’air aspiré pour remplir les blocs.** Des contaminants peuvent
      donc se retrouver dans le gaz respiré ; les filtres ne rendent pas acceptable une prise d’air polluée.'
- id: n2-gonflage-blocs-tampons-001
  type: mcq
