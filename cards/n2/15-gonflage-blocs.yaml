  fr:
    question: En France, quelles périodicités maximales de requalification distinguent le régime ordinaire
      d’un bloc métallique de plongée et le régime avec inspections et traçabilité conformes au cahier
      des charges TIV ?
    choices:
    - text: 'Régime ordinaire : 2 ans ; régime conforme au cahier des charges : 6 ans'
      correct: true
    - text: 'Régime ordinaire : 2 ans ; régime conforme au cahier des charges : 5 ans'
      correct: false
    - text: 'Régime ordinaire : 4 ans ; régime conforme au cahier des charges : 6 ans'
      correct: false
    explanation: La requalification est au plus tous les 2 ans en régime ordinaire, contre 6 ans dans
      le régime prévu par le cahier des charges. Ce dernier exige une inspection au moins annuelle, ou
      avant réutilisation si la précédente remonte à plus d’un an, ainsi que la traçabilité requise. TIV
      signifie technicien en inspection visuelle.
