    - 'Roth Mions — Notice FC244 révision 9 janvier 2020, p.1, consultée le 2026-10-06 : https://roth2.com/wp-content/uploads/2021/06/Notice_FR-2020-V9-2.pdf'
    - 'Arrêté du 20 novembre 2017, version en vigueur au 2026-10-06, articles 5, 15 et 18 : https://www.legifrance.gouv.fr/loda/id/JORFTEXT000036128632'
    - 'Revue du 2026-10-06 : docs/reviews/15-gonflage-blocs.md'
    fact_check: pass
  fr:
    front: Des éclats de peinture et de la rouille apparaissent sous le culot d’un bloc. Pourquoi ne suffit-il
      pas de recouvrir la zone de peinture ?
    back: '**Il faut faire vérifier l’état du métal et la corrosion**, avant de décider de l’entretien
      ou du maintien en service. La peinture protège l’extérieur mais peut masquer une dégradation ; elle
      ne restaure pas l’épaisseur perdue.'
- id: n2-gonflage-blocs-periodicites-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::15
  - gonflage-blocs
  status: reviewed
  source_id: P500
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.29–30 ; tableau p.34 inspecté visuellement.
    - 'Arrêté du 20 novembre 2017, version en vigueur au 2026-10-06, articles 5, 15 et 18 : https://www.legifrance.gouv.fr/loda/id/JORFTEXT000036128632'
    - 'FFESSM — Cahier des charges inspection des bouteilles métalliques, 4 décembre 2015 : https://tiv.ffessm.fr/Docs/CC-TIV-04-12-2015.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/15-gonflage-blocs.md'
    fact_check: pass
  fr:
    front: En France, pour un bloc métallique de plongée suivi selon le cahier des charges donnant droit
      au régime de six ans, quelles échéances distinguer de la requalification ordinaire ?
    back: '**Requalification maximale de 6 ans au lieu de 2 ans en régime ordinaire.** Le régime de 6
      ans exige les inspections et la traçabilité du cahier des charges : inspection au moins annuelle,
      ou avant réutilisation si plus d’un an s’est écoulé. Une simple vérification informelle ne suffit
      pas.'
- id: n2-gonflage-blocs-transport-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::15
  - gonflage-blocs
  status: reviewed
  source_id: P502
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.29–30 ; tableau p.34 inspecté visuellement.
    - 'Roth Mions — Notice FC244 révision 9 janvier 2020, p.1, consultée le 2026-10-06 : https://roth2.com/wp-content/uploads/2021/06/Notice_FR-2020-V9-2.pdf'
    - 'DAN Europe — Transport routier personnel de bouteilles : https://alertdiver.eu/fr_FR/articles/comment-transporter-une-bouteille-de-plongee-regles-a-respecter/'
    - 'Revue du 2026-10-06 : docs/reviews/15-gonflage-blocs.md'
    fact_check: pass
  fr:
    front: Pour transporter personnellement un bloc d’air gonflé en voiture, quelle précaution matérielle
      est essentielle ?
    back: '**L’immobiliser pour éviter qu’il roule ou se projette, et protéger la robinetterie des chocs
      et de l’ouverture accidentelle.** Éviter la chaleur excessive et respecter les règles du transport
      concerné ; transport routier personnel et avion n’ont pas les mêmes conditions.'
- id: n2-gonflage-blocs-date-depassee-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::15
  - gonflage-blocs
  status: reviewed
  source_id: P505
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.29–30 ; tableau p.34 inspecté visuellement.
    - 'Arrêté du 20 novembre 2017, version en vigueur au 2026-10-06, articles 5, 15 et 18 : https://www.legifrance.gouv.fr/loda/id/JORFTEXT000036128632'
