cards:
- id: n2-gonflage-blocs-compresseur-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::15
  - gonflage-blocs
  status: reviewed
  source_id: P474
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.29–30 ; tableau p.34 inspecté visuellement.
    - 'DAN — Breathing Gas Contamination, consulté le 2026-10-06 : https://dan.org/safety-prevention/diver-safety/psa/breathing-gas-contamination/'
    - 'Roth Mions — Notice FC244 révision 9 janvier 2020, p.1, consultée le 2026-10-06 : https://roth2.com/wp-content/uploads/2021/06/Notice_FR-2020-V9-2.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/15-gonflage-blocs.md'
    fact_check: pass
  fr:
    front: Pourquoi une station de gonflage aspire-t-elle l’air loin de sources de fumées ou d’échappement
      ?
    back: '**Le compresseur comprime l’air aspiré pour remplir les blocs.** Des contaminants peuvent donc
      se retrouver dans le gaz respiré ; les filtres ne rendent pas acceptable une prise d’air polluée.'
- id: n2-gonflage-blocs-tampons-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::15
  - gonflage-blocs
  status: reviewed
  source_id: P477
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.29–30 ; tableau p.34 inspecté visuellement.
    - S1 p.29, compresseur et tampons.
    - 'Revue du 2026-10-06 : docs/reviews/15-gonflage-blocs.md'
    fact_check: pass
  fr:
    front: Quelle différence entre gonfler directement avec un compresseur et utiliser une batterie de
      bouteilles tampons ?
    back: '**En direct, le compresseur alimente le bloc ; avec les tampons, une réserve d’air déjà comprimé
      est transvasée.** Le transfert dépend de la différence de pression et des réglages de la station
      ; le tampon ne produit pas lui-même du gaz.'
- id: n2-gonflage-blocs-pression-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::15
  - gonflage-blocs
  status: reviewed
  source_id: P479
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.29–30 ; tableau p.34 inspecté visuellement.
    - 'Roth Mions — Notice FC244 révision 9 janvier 2020, p.1, consultée le 2026-10-06 : https://roth2.com/wp-content/uploads/2021/06/Notice_FR-2020-V9-2.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/15-gonflage-blocs.md'
    fact_check: pass
  fr:
    front: Un bloc est marqué PS 230 bar et PT 345 bar. Quelle pression fixe sa limite admissible de gonflage
      ?
    back: '**PS 230 bar.** PS est la pression maximale admissible ; PT 345 bar est la pression d’épreuve,
      pas une pression de remplissage autorisée.'
- id: n2-gonflage-blocs-habilitation-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::15
  - gonflage-blocs
  status: reviewed
  source_id: P480
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.29–30 ; tableau p.34 inspecté visuellement.
    - 'Roth Mions — Notice FC244 révision 9 janvier 2020, p.1, consultée le 2026-10-06 : https://roth2.com/wp-content/uploads/2021/06/Notice_FR-2020-V9-2.pdf'
    - 'Arrêté du 20 novembre 2017, version en vigueur au 2026-10-06, articles 5, 15 et 18 : https://www.legifrance.gouv.fr/loda/id/JORFTEXT000036128632'
    - 'Revue du 2026-10-06 : docs/reviews/15-gonflage-blocs.md'
    fact_check: pass
  fr:
    front: Le brevet N2 suffit-il à autoriser l’utilisation autonome d’une station de gonflage du club
      ?
    back: '**Non.** Le gonflage exige la compétence et l’autorisation prévues pour cette station, sous
      la responsabilité de son exploitant. Le brevet de plongeur ne vaut pas habilitation de gonflage.'
- id: n2-gonflage-blocs-materiau-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::15
  - gonflage-blocs
  status: reviewed
  source_id: P483
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.29–30 ; tableau p.34 inspecté visuellement.
    - S1 p.30 ; calcul de flottabilité du chapitre 05.
    - 'Revue du 2026-10-06 : docs/reviews/15-gonflage-blocs.md'
    - 'Relecture globale du 2026-10-06 : docs/reviews/REVUE_FINALE_N2.md'
    fact_check: pass
  fr:
    front: Le seul mot « aluminium » suffit-il à conclure qu’un bloc sera plus léger et moins négatif
      qu’un bloc acier ?
    back: '**Non : il faut connaître sa masse, son volume extérieur et le gaz contenu.** Les épaisseurs
      et dimensions varient selon le modèle. Deux blocs de même capacité intérieure peuvent donc avoir
      des flottabilités différentes ; changer de bloc nécessite de vérifier le lestage, notamment avec
      la pression de fin de plongée.'
- id: n2-gonflage-blocs-bi-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::15
  - gonflage-blocs
  status: reviewed
  source_id: P484
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.29–30 ; tableau p.34 inspecté visuellement.
    - S1 p.30, mono/bi ; configuration conceptuelle.
    - 'Revue du 2026-10-06 : docs/reviews/15-gonflage-blocs.md'
    fact_check: pass
  fr:
    front: Deux bouteilles réunies en bi-bloc garantissent-elles automatiquement deux réserves indépendantes
      ?
    back: '**Non : cela dépend de leur robinetterie et de leur liaison éventuelle.** Deux bouteilles reliées
      peuvent partager le gaz ; deux volumes physiquement présents ne prouvent pas leur indépendance en
      cas de fuite.'
- id: n2-gonflage-blocs-chaleur-chocs-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
  - chapitre::15
  - gonflage-blocs
  status: reviewed
  source_id: P494
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.29–30 ; tableau p.34 inspecté visuellement.
    - 'Roth Mions — Notice FC244 révision 9 janvier 2020, p.1, consultée le 2026-10-06 : https://roth2.com/wp-content/uploads/2021/06/Notice_FR-2020-V9-2.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/15-gonflage-blocs.md'
    fact_check: pass
  fr:
    front: Pourquoi éviter de laisser un bloc gonflé dans un véhicule surchauffé et de le faire tomber
      ?
    back: '**La chaleur augmente la pression du gaz et un choc peut endommager bouteille ou robinetterie.**
      Protéger le bloc des températures excessives et des impacts ; sa résistance à la pression ne le
      rend pas insensible aux dégâts.'
- id: n2-gonflage-blocs-eau-001
  type: basic
  deck: Matériel et préparation
  levels:
  - N2
  tags:
