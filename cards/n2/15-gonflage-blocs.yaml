    fact_check: pass
  fr:
    question: Dans une station de gonflage, quelle fonction distingue les bouteilles tampons du compresseur
      ?
    choices:
    - text: Stocker du gaz déjà comprimé pour le transvaser aux blocs
      correct: true
    - text: Comprimer l’air aspiré pour alimenter les blocs
      correct: false
    explanation: Le compresseur comprime l’air aspiré ; les tampons stockent cet air pour un transfert
      ultérieur. Le gaz passe du tampon au bloc grâce à une différence de pression. Les bouteilles tampons
      ne réalisent pas elles-mêmes la compression.
