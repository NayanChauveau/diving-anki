  fr:
    question: Le seul mot « aluminium » suffit-il à conclure qu’un bloc sera plus léger et moins négatif
      qu’un bloc acier ?
    choices:
    - text: 'Non : comparer masse, volume extérieur et gaz contenu'
      correct: true
    - text: 'Oui : la nature du métal suffit à déterminer la flottabilité'
      correct: false
    - text: 'Oui : comparer seulement les capacités intérieures des blocs'
      correct: false
    explanation: '**Non : il faut connaître sa masse, son volume extérieur et le gaz contenu.** Les épaisseurs
      et dimensions varient selon le modèle. Deux blocs de même capacité intérieure peuvent donc avoir des
      flottabilités différentes ; changer de bloc nécessite de vérifier le lestage, notamment avec la pression
      de fin de plongée.'
