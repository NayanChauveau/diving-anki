cards:
- id: n2-vision-masque-refraction-001
  type: mcq
  deck: Physique
  levels:
  - N2
  - N3
  tags:
  - chapitre::19
  - complement-pdf::2026-10-11
  status: reviewed
  review:
    sources:
    - N2-S04 — Patrice Serresseque, Théorie N2, 01/07/2026, p. 12
    - 'OpenStax — University Physics Volume 3 §2.3, interface plane et approximation paraxiale : https://openstax.org/books/university-physics-volume-3/pages/2-3-images-formed-by-refraction
      ; DAN, A Clear Picture (2011), lame d’air du masque : https://dan.org/alert-diver/article/a-clear-picture/
      ; vérifiés le 2026-10-11.'
    - 'Rédaction le 2026-10-11 ; revue individuelle distincte : docs/reviews/RECOUPEMENT_N2_PDF_2026-10-11.md'
    - 'Critique distincte du lot C1 le 2026-10-11 : sens des échanges optiques, calcul inverse 3/(3/4),
      absorption, flottabilité et mécanismes ; leurres faibles retirés avant validation.'
    fact_check: pass
  fr:
    question: Avec un masque à vitre plane, un petit objet proche est observé presque dans l’axe, en eau
      claire. Quel effet de la réfraction modifie son apparence par rapport à la vision dans l’air ?
    choices:
    - text: Il paraît plus proche et plus grand
      correct: true
    - text: Il paraît plus éloigné et plus grand
      correct: false
    - text: Il paraît plus proche et plus petit
      correct: false
    explanation: 'Les rayons changent de direction en passant de l’eau à l’air du masque : l’image paraît
      rapprochée et sa taille angulaire augmente. La lame d’air permet aussi à l’œil de retrouver une
      mise au point normale. La turbidité et la distance influencent également la perception.'
- id: n2-vision-distance-reelle-001
  type: mcq
  deck: Physique
  levels:
  - N2
  - N3
  tags:
  - chapitre::19
  - complement-pdf::2026-10-11
  status: reviewed
  review:
    sources:
    - N2-S04 — Patrice Serresseque, Théorie N2, 01/07/2026, p. 12
    - 'OpenStax — University Physics Volume 3 §2.3, interface plane et approximation paraxiale : https://openstax.org/books/university-physics-volume-3/pages/2-3-images-formed-by-refraction
      ; DAN, A Clear Picture (2011), lame d’air du masque : https://dan.org/alert-diver/article/a-clear-picture/
      ; vérifiés le 2026-10-11.'
    - 'Rédaction le 2026-10-11 ; revue individuelle distincte : docs/reviews/RECOUPEMENT_N2_PDF_2026-10-11.md'
    - 'Critique distincte du lot C1 le 2026-10-11 : sens des échanges optiques, calcul inverse 3/(3/4),
      absorption, flottabilité et mécanismes ; leurres faibles retirés avant validation.'
    fact_check: pass
  fr:
    question: 'Exercice d’optique : devant une vitre plane, l’approximation près de l’axe donne une distance
      apparente égale aux 3/4 de la distance réelle à la vitre. Un repère paraît à 3 m. Quelle est sa
      distance réelle dans ce modèle ?'
    choices:
    - text: 4 m
      correct: true
    - text: 2,25 m
      correct: false
    - text: 3,75 m
      correct: false
    explanation: 'Distance réelle = 3 ÷ (3/4) = 4 m. Multiplier à nouveau par 3/4 donne 2,25 m et inverse
      le calcul demandé. Ajouter 25 % à 3 m donne 3,75 m : une diminution de 25 % ne s’annule pas par
      une augmentation de 25 %.'
- id: n2-vision-couleur-eclairage-001
  type: mcq
  deck: Physique
  levels:
  - N2
  - N3
  tags:
  - chapitre::19
  - complement-pdf::2026-10-11
  status: reviewed
  review:
    sources:
    - N2-S04 — Patrice Serresseque, Théorie N2, 01/07/2026, p. 12
    - 'NOAA Ocean Exploration — Why are so many deep-sea animals red in color?, mise à jour 18/12/2020
      : https://oceanexplorer.noaa.gov/ocean-fact/red-color/ ; NOAA Ocean Service, Why is the ocean blue?
      : https://oceanservice.noaa.gov/facts/oceanblue.html ; vérifiés le 2026-10-11.'
    - 'Rédaction le 2026-10-11 ; revue individuelle distincte : docs/reviews/RECOUPEMENT_N2_PDF_2026-10-11.md'
    - 'Critique distincte du lot C1 le 2026-10-11 : sens des échanges optiques, calcul inverse 3/(3/4),
      absorption, flottabilité et mécanismes ; leurres faibles retirés avant validation.'
    fact_check: pass
  fr:
    question: Un objet rouge paraît sombre en profondeur sous la lumière naturelle, puis retrouve son
      rouge lorsqu’une lampe blanche proche l’éclaire. Quelle propriété de l’eau explique cette différence
      ?
    choices:
    - text: Elle atténue plus rapidement la lumière rouge que la lumière bleue
      correct: true
    - text: Elle atténue plus rapidement la lumière bleue que la lumière rouge
      correct: false
    - text: Elle atténue toutes les couleurs dans la même proportion
      correct: false
    explanation: 'L’eau absorbe les différentes couleurs de façon inégale : le rouge est rapidement atténué.
      Sans lumière rouge à réfléchir, l’objet paraît sombre ; la lampe proche apporte à nouveau cette
      composante. La profondeur d’atténuation dépend des conditions de l’eau et du trajet de la lumière.'
- id: n2-noyade-flottabilite-surface-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N2
  - N3
  tags:
  - chapitre::19
  - complement-pdf::2026-10-11
  status: reviewed
  review:
    sources:
    - N2-S04 — Patrice Serresseque, Théorie N2, 01/07/2026, p. 13
    - 'DAN — Lessons in Gas Management, 01/04/2011 : https://dan.org/alert-diver/article/lessons-in-gas-management/
      ; DAN — Rescuing Divers and Swimmers : https://dan.org/health-medicine/travelers-medical-guide/key-first-aid-principles/rescuing-divers-and-swimmers/
      ; flottabilité positive et risque de noyade vérifiés le 2026-10-11.'
    - 'Rédaction le 2026-10-11 ; revue individuelle distincte : docs/reviews/RECOUPEMENT_N2_PDF_2026-10-11.md'
    - 'Critique distincte du lot C1 le 2026-10-11 : sens des échanges optiques, calcul inverse 3/(3/4),
      absorption, flottabilité et mécanismes ; leurres faibles retirés avant validation.'
    fact_check: pass
  fr:
    question: Après la sortie, un plongeur attend le bateau en surface. Il respire sur un détendeur fonctionnel
      mais doit palmer continuellement pour garder les voies aériennes hors de l’eau. Quelle action réduit
      directement cet effort de sustentation ?
    choices:
    - text: Gonfler suffisamment son gilet pour obtenir une flottabilité positive
      correct: true
    - text: Conserver la flottabilité neutre du palier et maintenir le palmage
      correct: false
    explanation: En surface, une flottabilité positive maintient le plongeur sans palmage permanent. Le
      gilet fournit cette sustentation avec une respiration normale ; conserver la flottabilité neutre
      impose de poursuivre l’effort. Le détendeur protège la respiration contre les vagues mais ne remplace
      pas la flottabilité.
- id: n2-milieu-grande-nacre-protection-001
  type: mcq
  deck: Réglementation
  levels:
  - N2
  - N3
  tags:
  - chapitre::19
  - complement-pdf::2026-10-11
  status: reviewed
  review:
    sources:
    - N2-S04 — Patrice Serresseque, Théorie N2, 01/07/2026, p. 31/35
    - 'Arrêté du 8 juillet 2025, art.1 II et art.3 (Pinna nobilis), en vigueur à partir du 01/10/2025
      ; version initiale publiée sur le site officiel DREAL : https://www.normandie.developpement-durable.gouv.fr/IMG/pdf/am8juillet2025-invertebresfaunemarine.pdf
      ; art.1 Légifrance : https://www.legifrance.gouv.fr/jorf/article_jo/JORFARTI000051862651 ; DORIS
      Pinna nobilis, mise à jour 25/06/2026 : https://doris.ffessm.fr/Especes/Pinna-nobilis-Grande-nacre-311
      ; sources croisées le 2026-10-11.'
    - 'Rédaction le 2026-10-11 ; revue individuelle distincte : docs/reviews/RECOUPEMENT_N2_PDF_2026-10-11.md'
    - 'Critique distincte du lot C2 le 2026-10-11 : chaque choix et corrigé relus ; consécutive 25+10=35,
      successives 25+10=35 ; différence des branches de profondeur ; * et seuils vérifiés ; grande nacre
      limitée au milieu naturel pour exclure les collections/élevages licites.'
    fact_check: pass
  fr:
    question: En Méditerranée française, hors dérogation particulière, quelle portée a la protection de
      la grande nacre (Pinna nobilis) concernant le transport d’un individu trouvé en milieu naturel ?
    choices:
    - text: Elle interdit son transport, qu’il soit vivant ou mort
      correct: true
    - text: Elle interdit son transport seulement s’il est vivant
      correct: false
    - text: Elle interdit son transport seulement s’il provient d’une aire marine protégée
      correct: false
    explanation: La grande nacre figure dans la liste nationale des invertébrés marins protégés. Le transport
      concerne les individus vivants comme morts ; la protection ne se limite pas aux aires marines protégées.
      Constater la mort de l’animal ne permet donc pas de rapporter cet individu comme souvenir.
- id: n2-milieu-rascasse-envenimation-001
  type: mcq
  deck: Prévention des accidents
  levels:
  - N2
  - N3
  tags:
  - chapitre::19
  - complement-pdf::2026-10-11
  status: reviewed
  review:
    sources:
    - N2-S04 — Patrice Serresseque, Théorie N2, 01/07/2026, p. 31
    - 'DORIS — Scorpaena porcus, 09/11/2020 : https://doris.ffessm.fr/Especes/Scorpaena-porcus-Rascasse-brune-741
      ; Subaqua / FFESSM, Envenimations par poissons osseux des mers tropicales et tempérées publié le
      25/02/2019, modifié le 18/09/2024 : https://subaqua.ffessm.fr/article/envenimations-par-poissons-osseux-des-mers-tropicales-et-temperees
      ; mécanisme croisé le 2026-10-11, aucune procédure de soins extraite de la fiche DORIS.'
    - 'Rédaction le 2026-10-11 ; revue individuelle distincte : docs/reviews/RECOUPEMENT_N2_PDF_2026-10-11.md'
    - 'Seconde critique C3 le 2026-10-11 : réponse unique épine/appareil venimeux ; cnidocytes et morsure
      réfutés. Divergence DORIS/Subaqua sur l’anatomie des épines résolue avec le Dr Maillaud ; ni épines
      pectorales venimeuses, ni épines creuses, ni soins par chaleur à 50 °C enseignés.'
    fact_check: pass
  fr:
    question: Un plongeur touche accidentellement une rascasse brune (Scorpaena porcus). Quel mécanisme
      explique le risque d’envenimation au contact de ce poisson ?
    choices:
    - text: La pénétration d’une épine associée à un appareil venimeux
      correct: true
    - text: Le déclenchement de cellules urticantes réparties sur sa peau
      correct: false
    - text: Une morsure injectant le venin par les dents
      correct: false
    explanation: 'Les rascasses possèdent des épines venimeuses : une pression contre une épine peut provoquer
      une piqûre avec injection de venin. Les cellules urticantes sont le mécanisme des cnidaires, comme
      les anémones et les méduses ; la rascasse n’injecte pas ce venin par une morsure. Son camouflage
      et son immobilité rendent un appui sur le fond risqué.'
