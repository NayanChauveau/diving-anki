  fr:
    question: Quel mécanisme relie une baisse trop rapide de pression à un accident de désaturation ?
    choices:
    - text: Une sursaturation excessive en gaz inerte favorise des bulles et des lésions
      correct: true
    - text: L’expansion de gaz bloqué dans les poumons provoque une rupture alvéolaire
      correct: false
    - text: La production de CO₂ dépasse son élimination par la ventilation
      correct: false
    explanation: L’azote dissous peut former des bulles lorsque la sursaturation devient excessive. Bulles,
      perturbations circulatoires et inflammation participent aux lésions. L’expansion d’un gaz pulmonaire
      piégé relève du barotraumatisme ; le défaut d’élimination du CO₂ relève de l’hypercapnie.
