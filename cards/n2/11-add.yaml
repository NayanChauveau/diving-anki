    - 'Revue du 2026-10-06 : docs/reviews/11-add.md'
    fact_check: pass
  fr:
    front: Pourquoi une diminution trop rapide de pression favorise-t-elle un accident de désaturation
      ?
    back: '**Elle peut créer une sursaturation excessive et favoriser des bulles de gaz inerte.** Celles-ci
      peuvent perturber les tissus et la circulation et provoquer des réactions inflammatoires. L’accident
      ne se résume pas à un seul vaisseau bouché.'
- id: n2-add-froid-effort-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::11
  - add
  status: reviewed
  source_id: P341
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.20–23.
    - 'DAN — Factors Contributing to Decompression Stress : https://dan.org/health-medicine/health-resource/dive-medical-reference-books/decompression-sickness/contributing-factors/'
    - 'Revue du 2026-10-06 : docs/reviews/11-add.md'
    fact_check: pass
  fr:
    front: Pourquoi la température et l’effort doivent-ils être pris en compte dans le risque de désaturation
      ?
    back: '**Ils modifient la circulation sanguine, donc la prise et l’élimination du gaz inerte.** L’effort
      au fond peut augmenter la prise d’azote ; un refroidissement pendant la remontée peut ralentir son
      élimination. Leur effet dépend du moment et de l’intensité.'
