  fr:
    question: À profondeur constante et mélange inchangé, pourquoi prolonger le séjour peut-il augmenter
      les obligations de désaturation ?
    choices:
    - text: La charge d’azote de tissus encore hors équilibre continue à augmenter
      correct: true
    - text: Le stock d’air respiré cumulé fixe la charge d’azote à éliminer
      correct: false
    - text: La pression partielle d’azote respiré augmente avec le temps passé
      correct: false
    explanation: À cette profondeur, la pression partielle respirée reste constante, mais les tissus encore
      hors équilibre continuent à se charger. La charge dépend du profil et des vitesses d’échange, pas
      directement du volume total consommé dans le bloc.
