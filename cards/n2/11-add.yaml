    fact_check: pass
  fr:
    front: Pourquoi éviter de porter seul des charges lourdes juste après une plongée ?
    back: '**Un effort intense sollicite la circulation et peut accroître le risque lié aux bulles pendant
      la désaturation.** Organiser l’aide pour sortir le matériel ; une activité légère n’équivaut pas
      à un effort lourd ou à une poussée en apnée.'
