  fr:
    question: Pourquoi la température et l’effort doivent-ils être pris en compte dans le risque de désaturation
      ?
    choices:
    - text: Ils modifient la circulation, avec un effet différent selon la phase de plongée
      correct: true
    - text: Ils influent sur le confort mais pas sur les échanges d’azote à profil identique
      correct: false
    - text: Ils facilitent autant l’élimination à la remontée que la prise d’azote au fond
      correct: false
    explanation: '**Ils modifient la circulation sanguine, donc la prise et l’élimination du gaz inerte.**
      L’effort au fond peut augmenter la prise d’azote ; un refroidissement pendant la remontée peut ralentir
      son élimination. Leur effet dépend du moment et de l’intensité.'
