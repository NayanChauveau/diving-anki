  fr:
    question: À température constante, quel effet a une augmentation de la pression partielle d’un gaz sur
      sa quantité dissoute à l’équilibre dans un liquide ?
    choices:
    - text: Elle augmente proportionnellement à la pression partielle
      correct: true
    - text: Elle augmente proportionnellement à la pression totale, quel que soit le mélange
      correct: false
    - text: Elle dépend du temps mais pas de la pression partielle à l’équilibre
      correct: false
    explanation: '**La quantité dissoute à l’équilibre augmente proportionnellement à cette pression partielle**,
      pour le même gaz et le même liquide. Dans l’organisme, atteindre ce nouvel équilibre demande du temps.'
