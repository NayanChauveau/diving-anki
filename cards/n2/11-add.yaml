      de désaturation ?
    choices:
    - text: Les signes peuvent apparaître après un délai en surface
      correct: true
    - text: Le retour à la pression atmosphérique exclut une origine de désaturation
      correct: false
    - text: Les signes doivent commencer au dernier palier pour évoquer un ADD
      correct: false
    explanation: '**Des signes peuvent apparaître plus tard, souvent dans les heures suivantes.** Un symptôme
      inhabituel doit être signalé en précisant la plongée récente ; douze heures n’est pas une limite après
      laquelle toute origine liée à la plongée est exclue.'
