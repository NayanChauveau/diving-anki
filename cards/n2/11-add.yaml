  fr:
    question: À la sortie d’une plongée, certains tissus contiennent plus d’azote qu’à l’équilibre de
      surface. Comment évolue cet azote supplémentaire après le retour à 1 bar ?
    choices:
    - text: Il est éliminé progressivement par les échanges avec le sang et les poumons
      correct: true
    - text: Il est éliminé dès que la pression respirée retrouve celle de la surface
      correct: false
    - text: Il reste stocké jusqu’à ce qu’une autre immersion relance les échanges
      correct: false
    explanation: Le retour en surface change la pression d’équilibre, mais pas instantanément la charge
      des tissus. L’azote supplémentaire continue à passer vers le sang puis les poumons. Cet azote résiduel
      intervient dans une plongée suivante ou un trajet en altitude.
