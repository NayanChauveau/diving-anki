  fr:
    question: Une douleur profonde inhabituelle à l’épaule apparaît après plongée et portage du bloc.
      Comment articuler cette explication par l’effort et la demande d’évaluation ?
    choices:
    - text: Signaler la douleur et la plongée récente sans attendre de confirmer une cause musculaire
      correct: true
    - text: Faire reposer l’épaule puis demander une évaluation si la douleur persiste
      correct: false
    - text: Tester les mouvements de l’épaule puis demander une évaluation si la douleur ne change pas
      correct: false
    explanation: Une douleur articulaire peut accompagner un ADD et le portage ne suffit pas à l’écarter.
      Signaler rapidement la douleur, son heure d’apparition et la plongée récente ; la réponse au repos
      ou au mouvement ne fournit pas un diagnostic fiable.
