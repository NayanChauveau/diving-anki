  fr:
    question: Pourquoi des bulles apparaissent-elles à l’ouverture d’une bouteille d’eau gazeuse ?
    choices:
    - text: La baisse de pression rend le liquide sursaturé
      correct: true
    - text: L’ouverture augmente la quantité de gaz dissous à l’équilibre
      correct: false
    - text: La baisse de pression augmente la solubilité du gaz
      correct: false
    explanation: '**La chute de pression rend le liquide sursaturé en gaz.** Une partie du gaz dissous quitte
      alors la solution sous forme de bulles. La pression plus élevée dans la bouteille fermée permettait
      de maintenir davantage de gaz dissous.'
