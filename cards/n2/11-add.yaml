  fr:
    question: Pour le même gaz et le même liquide, à température constante, la pression partielle du gaz
      est doublée. Que devient sa quantité dissoute une fois le nouvel équilibre atteint ?
    choices:
    - text: Elle est multipliée par 2
      correct: true
    - text: Elle reste identique
      correct: false
    - text: Elle est divisée par 2
      correct: false
    explanation: 'La loi de Henry relie la quantité dissoute à l’équilibre à la pression partielle du
      gaz : doubler cette pression double cette quantité, à température constante. Cela ne décrit pas
      le volume d’une poche gazeuse, régi par Boyle-Mariotte ; atteindre le nouvel équilibre demande du
      temps.'
