  fr:
    front: Pourquoi respecter à la fois les paliers et la vitesse de remontée prévue par son moyen de
      désaturation ?
    back: '**Les deux font partie du profil de décompression.** Effectuer les paliers ne compense pas
      automatiquement une remontée trop rapide entre les niveaux ; ordinateur ou tables supposent aussi
      des conditions de remontée.'
