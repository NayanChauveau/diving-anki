  fr:
    question: Pourquoi sortir de l’eau ne signifie-t-il pas que tout l’azote supplémentaire a été éliminé
      ?
    choices:
    - text: Le retour à 1 bar change l’équilibre visé, mais les tissus l’atteignent progressivement
      correct: true
    - text: Le retour à 1 bar change l’équilibre et les tissus l’atteignent immédiatement
      correct: false
    - text: Le retour à 1 bar n’affecte pas les échanges tant qu’une autre plongée ne commence pas
      correct: false
    explanation: '**L’élimination se poursuit après la plongée.** Certains tissus restent chargés au-delà
      de leur équilibre de surface ; ce gaz résiduel influence une plongée suivante et l’exposition à une
      altitude plus élevée.'
