  fr:
    question: Pourquoi tous les tissus ne se chargent-ils pas en azote à la même vitesse ?
    choices:
    - text: Circulation, diffusion et solubilité diffèrent selon les tissus
      correct: true
    - text: La pression ambiante est différente dans chaque organe
      correct: false
    - text: Tous les tissus se chargent à la même vitesse mais pas en même quantité
      correct: false
    explanation: '**Leur circulation sanguine et leurs propriétés de diffusion et de solubilité diffèrent.**
      Les modèles de décompression représentent ces vitesses par plusieurs compartiments ; un compartiment
      de calcul n’est pas un organe précis.'
