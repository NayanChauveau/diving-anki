  fr:
    question: Un plongeur a respecté les indications de son ordinateur. Pourquoi un accident de désaturation
      reste-t-il possible ?
    choices:
    - text: Il modélise la charge sans mesurer directement l’azote ou les bulles des tissus
      correct: true
    - text: Il mesure directement la charge des tissus mais peut manquer les symptômes tardifs
      correct: false
    - text: Il adapte automatiquement sa charge calculée à la fatigue et à la température corporelle
      correct: false
    explanation: '**L’ordinateur applique un modèle, sans mesurer directement l’azote ni les bulles dans
      ses tissus.** Le respect des indications réduit le risque sans garantir son absence ; l’état du plongeur
      et les conditions de plongée comptent aussi.'
