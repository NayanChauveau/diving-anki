      est suspecté ?
    back: '**Ils ont partagé une partie des conditions et du profil de plongée.** Rechercher et faire
      signaler tout symptôme inhabituel, même s’ils paraissent bien. L’état d’un équipier ne permet pas
      de prédire celui des autres.'
