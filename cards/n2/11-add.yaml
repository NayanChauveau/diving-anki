  fr:
    front: Pourquoi éviter d’enchaîner une séance d’apnée profonde après une plongée bouteille ?
    back: '**La charge résiduelle en gaz inerte peut se combiner aux variations de pression et aux contraintes
      de l’apnée.** Organiser les deux activités séparément plutôt qu’utiliser l’apnée comme prolongement
      de la plongée ; la faible durée d’une apnée ne garantit pas l’absence de risque.'
