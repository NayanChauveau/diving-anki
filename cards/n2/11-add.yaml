  fr:
    question: À durée et mélange respiré comparables, pourquoi une plongée plus profonde tend-elle à augmenter
      la charge en azote ?
    choices:
    - text: La pression partielle d’azote augmente, favorisant son entrée dans les tissus
      correct: true
    - text: La fraction d’azote dans l’air augmente, favorisant son entrée dans les tissus
      correct: false
    - text: À mélange identique, la pression partielle reste constante et seule la durée compte
      correct: false
    explanation: '**La pression partielle d’azote respiré augmente.** Elle crée un écart plus grand avec
      l’azote déjà dissous dans les tissus, favorisant son entrée dans l’organisme.'
