      vers le premier caisson trouvé ?
    back: '**Les secours coordonnent l’évaluation médicale, le transport et l’établissement adapté.**
      Il faut prendre en compte les autres urgences possibles et la disponibilité d’une prise en charge
      hyperbare, tout en maintenant oxygène et surveillance.'
