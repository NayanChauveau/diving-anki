      correct: true
    - text: Améliorer l’oxygénation et recomprimer les bulles par la pression du masque
      correct: false
    - text: Améliorer l’oxygénation et stimuler la ventilation pour évacuer le gaz inerte
      correct: false
    explanation: L’oxygène améliore l’oxygénation et favorise l’élimination du gaz inerte en modifiant
      les échanges gazeux. Ce n’est ni une recompression par le masque ni une stimulation ventilatoire
      destinée à chasser l’azote. Pour une victime qui respire, le repère fédéral est le masque à haute
      concentration à 15 L/min, avec alerte et poursuite jusqu’au relais des secours spécialisés.
