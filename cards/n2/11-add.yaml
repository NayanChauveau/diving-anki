  fr:
    question: Un Suunto Zoop Novo a suivi une plongée sans erreur et calcule sa désaturation. Quel lien
      entre son calcul et le plongeur explique qu’un ADD reste possible malgré le respect des indications
      ?
    choices:
    - text: Il applique des paramètres physiologiques du modèle au profil du plongeur
      correct: true
    - text: Il ajuste ses paramètres tissulaires à partir de la réponse physiologique mesurée
      correct: false
    - text: Il adapte sa charge calculée à partir de la fatigue et de l’hydratation évaluées
      correct: false
    explanation: L’appareil utilise le profil mesuré et des paramètres physiologiques de modèle, sans
      mesurer directement l’azote, les bulles ou l’état de chaque tissu. Les réglages personnels ne constituent
      pas une mesure automatique de fatigue ou d’hydratation. Le calcul réduit le risque sans représenter
      toute la réponse individuelle.
