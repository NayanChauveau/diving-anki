    explanation: L’apnée profonde impose de nouvelles variations de pression alors que l’élimination du
      gaz inerte se poursuit. Comprimer du gaz ne l’élimine pas et ne remet pas les tissus à leur état
      initial. Organiser les activités séparément ; la courte durée d’une apnée ne garantit pas l’absence
      de risque.
