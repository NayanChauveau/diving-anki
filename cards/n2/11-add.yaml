  fr:
    question: Un vertige persiste après la sortie de l’eau, avec baisse d’audition. Pourquoi ne faut-il
      pas conclure à un simple problème d’équilibrage ?
    choices:
    - text: Désaturation et barotraumatisme de l’oreille interne sont possibles
      correct: true
    - text: La baisse d’audition prouve une atteinte limitée à l’oreille moyenne
      correct: false
    - text: Le retour en surface exclut une atteinte vestibulaire de désaturation
      correct: false
    explanation: '**Une atteinte de l’oreille interne est possible**, notamment par désaturation ou barotraumatisme.
      Une évaluation urgente doit distinguer ces causes ; le seul symptôme ne permet pas de choisir un traitement.'
