cards:
- id: n2-add-henry-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::11
  - add
  status: reviewed
  source_id: P328
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.20–23.
    - 'DAN World — Decompression Illness : https://world.dan.org/health-medicine/health-resources/diseases-conditions/decompression-illness-what-is-it-and-what-is-the-treatment/'
    - 'DAN — Back to Basics, narcose, consulté le 2026-10-06 : https://dan.org/alert-diver/article/back-to-basics/'
    - 'Revue du 2026-10-06 : docs/reviews/11-add.md'
    fact_check: pass
  fr:
    front: À température constante, quel effet a une augmentation de la pression partielle d’un gaz sur
      sa quantité dissoute à l’équilibre dans un liquide ?
    back: '**La quantité dissoute à l’équilibre augmente proportionnellement à cette pression partielle**,
      pour le même gaz et le même liquide. Dans l’organisme, atteindre ce nouvel équilibre demande du
      temps.'
- id: n2-add-bouteille-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::11
  - add
  status: reviewed
  source_id: P330
  review:
