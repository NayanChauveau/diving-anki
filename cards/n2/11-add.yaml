  fr:
    question: Quel trajet décrit l’élimination du gaz inerte dissous dans les tissus lors d’une désaturation
      normale ?
    choices:
    - text: Tissus → transport dissous dans le sang → alvéoles → expiration
      correct: true
    - text: Tissus → formation de bulles veineuses → filtre pulmonaire → expiration
      correct: false
    - text: Tissus → transport dissous dans le sang → reins → urine
      correct: false
    explanation: Le gaz inerte peut passer des tissus au sang puis aux alvéoles par différences de pression
      partielle, sans formation préalable de bulles. Les poumons filtrent aussi des bulles veineuses,
      mais ce n’est pas une étape nécessaire de toute désaturation. L’excrétion urinaire des déchets azotés
      du métabolisme est un autre phénomène.
