  fr:
    question: Quel ensemble de propriétés intervient directement dans les échanges d’azote et contribue
      aux différences de vitesse de charge entre tissus ?
    choices:
    - text: Leur irrigation sanguine et leurs propriétés de diffusion et de solubilité
      correct: true
    - text: Leur taille anatomique et leur distance par rapport aux poumons
      correct: false
    - text: Leur consommation d’oxygène et leur production locale de CO₂
      correct: false
    explanation: La circulation sanguine apporte et emporte le gaz inerte ; diffusion et solubilité participent
      aux différences de vitesse de charge. La consommation d’oxygène concerne le métabolisme, pas la
      définition d’une vitesse d’échange d’azote. Les compartiments du modèle ne sont pas chacun un organe
      déterminé.
