  fr:
    question: Un plongeur va bien à sa sortie de l’eau, puis présente des signes inhabituels deux heures
      plus tard. Que permet de conclure ce délai sur une éventuelle origine liée à la désaturation ?
    choices:
    - text: Il reste compatible avec un accident de désaturation
      correct: true
    - text: Il indique une cause extérieure à la plongée, après la fin de la désaturation
      correct: false
    - text: Il oriente vers un barotraumatisme plutôt que vers un accident de désaturation
      correct: false
    explanation: Des signes d’ADD peuvent apparaître après un délai en surface. Le moment d’apparition
      ne suffit pas à choisir un diagnostic ; transmettre la plongée récente et la chronologie aux secours.
      Douze heures ne constituent pas une frontière excluant toute origine liée à la plongée.
