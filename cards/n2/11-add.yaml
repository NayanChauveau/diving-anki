  fr:
    question: Pourquoi l’effet de l’effort et du froid sur la désaturation dépend-il aussi du moment où
      ils surviennent ?
    choices:
    - text: Une perfusion accrue au fond peut augmenter la charge ; un refroidissement à la remontée peut
        ralentir son élimination
      correct: true
    - text: Une perfusion accrue au fond augmente la charge ; l’élimination est ensuite accélérée dans
        la même proportion
      correct: false
    - text: Une perfusion accrue au fond augmente la charge ; un refroidissement à la remontée accélère
        son élimination
      correct: false
    explanation: Les échanges dépendent notamment de la circulation sanguine. Un effort au fond peut augmenter
      l’entrée d’azote ; un refroidissement à la remontée peut réduire son élimination. L’effet n’est
      pas symétrique entre charge et décharge et dépend de l’intensité et du moment.
