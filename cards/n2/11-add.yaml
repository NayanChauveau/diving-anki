  fr:
    front: Pour un plongeur sans symptôme ayant fait plusieurs plongées sans palier dans la journée, quel
      intervalle minimal de surface est recommandé par DAN avant un vol en cabine pressurisée ?
    back: '**Au moins 18 heures.** Pour une seule plongée sans palier, le repère est 12 heures ; après
      des plongées nécessitant des paliers, un délai nettement supérieur à 18 heures est recommandé. La
      baisse de pression en cabine justifie ces intervalles, qui réduisent le risque sans le supprimer.
      Un trajet en altitude après la plongée expose également à une baisse de pression ; tenir compte
      de l’altitude prévue dans la planification.'
