    fact_check: pass
  fr:
    front: Un plongeur a respecté les indications de son ordinateur. Pourquoi un accident de désaturation
      reste-t-il possible ?
    back: '**L’ordinateur applique un modèle, sans mesurer directement l’azote ni les bulles dans ses
      tissus.** Le respect des indications réduit le risque sans garantir son absence ; l’état du plongeur
      et les conditions de plongée comptent aussi.'
