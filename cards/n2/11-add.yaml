  fr:
    front: Quelles conditions faut-il réunir avant de proposer de l’eau à une victime d’accident de plongée
      ?
    back: '**Elle doit être consciente, coopérative et pouvoir avaler sans risque.** Ne pas donner par
      la bouche en cas de trouble de conscience, gêne respiratoire, nausées ou vomissements. L’hydratation
      ne retarde ni l’alerte ni l’oxygène.'
