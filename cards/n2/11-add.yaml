  fr:
    front: En cas de suspicion d’accident de désaturation, pourquoi administrer de l’oxygène en surface
      ?
    back: '**Il améliore l’oxygénation et favorise l’élimination du gaz inerte.** Pour une victime qui
      respire, la conduite fédérale prévoit un masque à haute concentration alimenté à 15 L/min, poursuivi
      jusqu’au relais des secours spécialisés. L’oxygène accompagne l’alerte et l’évaluation médicale.'
- id: n2-add-position-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::11
  - add
  status: reviewed
  source_id: P360
