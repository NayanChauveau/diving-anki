  fr:
    question: Des marbrures en réseau et des démangeaisons inhabituelles apparaissent sur le tronc après
      une plongée. Quelle forme d’accident de plongée peut présenter ce tableau ?
    choices:
    - text: Un accident de désaturation cutané
      correct: true
    - text: Un barotraumatisme pulmonaire avec emphysème sous-cutané
      correct: false
    - text: Un œdème pulmonaire d’immersion avec mauvaise oxygénation
      correct: false
    explanation: Des marbrures appelées cutis marmorata peuvent accompagner un ADD cutané et doivent être
      évaluées rapidement. L’emphysème sous-cutané est de l’air passé dans les tissus, souvent associé
      à un gonflement et des crépitements au toucher ; ce n’est pas ce motif de marbrures. L’OPI donne
      surtout une gêne respiratoire et une toux. Ces signes seuls ne permettent pas un diagnostic certain.
