  fr:
    front: Pourquoi les remontées et redescendes répétées ne doivent-elles pas être considérées comme
      équivalentes à une plongée stable à la même profondeur maximale ?
    back: '**Elles multiplient les variations de pression pendant la charge et l’élimination des gaz.**
      La profondeur maximale et la durée seules ne décrivent pas le profil ; limiter les oscillations
      inutiles et planifier les exercices avec l’encadrant.'
