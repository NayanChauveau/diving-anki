  fr:
    front: Après une plongée, des démangeaisons s’accompagnent de marbrures inhabituelles sur le tronc.
      Pourquoi faut-il les signaler rapidement ?
    back: '**Ces manifestations cutanées peuvent correspondre à un accident de désaturation.** Elles justifient
      une évaluation et ne permettent pas de conclure à un problème bénin limité à la peau.'
