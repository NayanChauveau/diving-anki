    fact_check: pass
  fr:
    front: Par quel trajet l’azote dissous dans les tissus est-il éliminé pendant la désaturation ?
    back: '**Tissus → sang → poumons → air expiré.** Le gaz passe vers les alvéoles lorsque l’écart de
      pression le permet. Sa sortie n’exige pas qu’il forme d’abord de grosses bulles dans le sang.'
