    - 'Revue du 2026-10-06 : docs/reviews/11-add.md'
    fact_check: pass
  fr:
    front: Pourquoi sortir de l’eau ne signifie-t-il pas que tout l’azote supplémentaire a été éliminé
      ?
    back: '**L’élimination se poursuit après la plongée.** Certains tissus restent chargés au-delà de
      leur équilibre de surface ; ce gaz résiduel influence une plongée suivante et l’exposition à une
      altitude plus élevée.'
- id: n2-add-poumons-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::11
  - add
  status: reviewed
  source_id: P337
  review:
