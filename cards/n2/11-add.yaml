    question: Après une plongée, des démangeaisons s’accompagnent de marbrures inhabituelles sur le tronc.
      Pourquoi faut-il les signaler rapidement ?
    choices:
    - text: Un ADD cutané est possible et nécessite une évaluation
      correct: true
    - text: Une localisation cutanée exclut une atteinte liée à la désaturation
      correct: false
    - text: Des marbrures seules prouvent une allergie à la combinaison
      correct: false
    explanation: '**Ces manifestations cutanées peuvent correspondre à un accident de désaturation.** Elles
      justifient une évaluation et ne permettent pas de conclure à un problème bénin limité à la peau.'
