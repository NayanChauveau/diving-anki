  fr:
    question: À profondeur constante, pourquoi prolonger une plongée peut-il augmenter les obligations de
      désaturation ?
    choices:
    - text: Des tissus continuent à se charger avant leur nouvel équilibre
      correct: true
    - text: La charge est fixée dès que la profondeur ne change plus
      correct: false
    - text: La saturation dépend de la profondeur maximale uniquement
      correct: false
    explanation: '**Les tissus continuent à absorber de l’azote tant qu’ils n’ont pas atteint leur équilibre
      avec le gaz respiré.** Une durée plus longue peut donc accroître la charge, même sans descendre davantage.'
