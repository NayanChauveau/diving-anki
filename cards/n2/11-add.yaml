  fr:
    question: Un plongeur sans symptôme a fait plusieurs plongées sans palier dans la journée. Quel intervalle
      minimal de surface recommande DAN avant un vol dont la pression en cabine correspond à une altitude
      de 610 à 2 438 m ?
    choices:
    - text: Au moins 18 h
      correct: true
    - text: Au moins 12 h
      correct: false
    - text: Au moins 24 h
      correct: false
    explanation: '**Au moins 18 heures.** Le repère est 12 heures après une seule plongée sans palier. Ces
      délais visent les plongeurs sans symptôme et la plage de pression cabine annoncée ; un intervalle
      plus long réduit davantage le risque. La baisse de pression pendant un trajet en altitude doit aussi
      être prise en compte.'
