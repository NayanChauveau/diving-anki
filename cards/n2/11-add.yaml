  fr:
    front: Une douleur profonde inhabituelle à l’épaule apparaît après une plongée. Le plongeur la met
      sur le compte du portage du bloc. Quelle décision prendre ?
    back: '**Signaler et faire évaluer rapidement la douleur en indiquant la plongée récente.** Une douleur
      articulaire peut relever d’un accident de désaturation ; l’explication par un effort ne suffit pas
      à l’écarter.'
