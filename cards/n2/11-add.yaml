  fr:
    question: Par quel trajet l’azote dissous dans les tissus est-il éliminé pendant la désaturation ?
    choices:
    - text: Tissus → sang → poumons → air expiré
      correct: true
    - text: Tissus → sang → reins → urine
      correct: false
    - text: Tissus → bulles obligatoires → poumons → air expiré
      correct: false
    explanation: '**Tissus → sang → poumons → air expiré.** Le gaz passe vers les alvéoles lorsque l’écart
      de pression le permet. Sa sortie n’exige pas qu’il forme d’abord de grosses bulles dans le sang.'
