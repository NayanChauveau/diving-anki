  fr:
    front: Après une plongée, un équipier devient anormalement épuisé et se comporte différemment d’habitude.
      Pourquoi faut-il le signaler au responsable ?
    back: '**Une fatigue inhabituelle ou un changement de comportement peuvent accompagner un accident
      de plongée.** Comparer à son état habituel et transmettre l’heure d’apparition ; ne pas attendre
      une paralysie ou une douleur importante pour demander une évaluation.'
