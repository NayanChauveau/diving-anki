  fr:
    front: Pourquoi l’absence de symptôme immédiat au retour au bateau n’écarte-t-elle pas un accident
      de désaturation ?
    back: '**Des signes peuvent apparaître plus tard, souvent dans les heures suivantes.** Un symptôme
      inhabituel doit être signalé en précisant la plongée récente ; douze heures n’est pas une limite
      après laquelle toute origine liée à la plongée est exclue.'
