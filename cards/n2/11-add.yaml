  fr:
    question: Pourquoi une diminution trop rapide de pression favorise-t-elle un accident de désaturation
      ?
    choices:
    - text: Un excès de sursaturation peut favoriser des bulles et des lésions
      correct: true
    - text: La baisse de pression comprime le gaz dissous et les tissus qui le contiennent
      correct: false
    - text: Les bulles sont une étape nécessaire d’élimination que la remontée rapide rend plus efficace
      correct: false
    explanation: '**Elle peut créer une sursaturation excessive et favoriser des bulles de gaz inerte.**
      Celles-ci peuvent perturber les tissus et la circulation et provoquer des réactions inflammatoires.
      L’accident ne se résume pas à un seul vaisseau bouché.'
