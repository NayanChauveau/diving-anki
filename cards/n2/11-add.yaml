  fr:
    question: À durée et mélange respiré comparables, pourquoi une plongée plus profonde tend-elle à augmenter
      la charge en azote ?
    choices:
    - text: La pression partielle d’azote augmente, favorisant son entrée dans les tissus
      correct: true
    - text: La fraction d’azote dans l’air augmente, favorisant son entrée dans les tissus
      correct: false
    - text: Le gaz déjà présent est comprimé, ce qui augmente la quantité d’azote sans échange
      correct: false
    explanation: À composition identique, la pression absolue plus élevée augmente la pression partielle
      d’azote respiré. L’écart avec l’azote dissous dans les tissus favorise son entrée. La fraction d’azote
      reste identique ; une augmentation de quantité dissoute suppose des échanges, pas la compression
      d’une poche gazeuse.
