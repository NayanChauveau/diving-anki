  fr:
    front: Un vertige persiste après la sortie de l’eau, avec baisse d’audition. Pourquoi ne faut-il pas
      conclure à un simple problème d’équilibrage ?
    back: '**Une atteinte de l’oreille interne est possible**, notamment par désaturation ou barotraumatisme.
      Une évaluation urgente doit distinguer ces causes ; le seul symptôme ne permet pas de choisir un
      traitement.'
