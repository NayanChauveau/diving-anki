    - 'Revue du 2026-10-06 : docs/reviews/11-add.md'
    fact_check: pass
  fr:
    front: Une victime consciente et qui respire présente un malaise après plongée. Quelle position lui
      proposer, notamment si elle est gênée pour respirer ?
    back: '**La laisser choisir une position confortable.** En cas de gêne respiratoire, une position
      assise ou demi-assise facilite souvent la respiration. Ne pas imposer systématiquement jambes surélevées
      ; adapter l’installation à son état.'
