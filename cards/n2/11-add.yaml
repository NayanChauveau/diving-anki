  fr:
    question: Pourquoi des bulles apparaissent-elles à l’ouverture d’une bouteille d’eau gazeuse ?
    choices:
    - text: Du CO₂ auparavant dissous quitte le liquide devenu sursaturé
      correct: true
    - text: De la vapeur d’eau se forme dans le liquide sous l’effet de l’ouverture
      correct: false
    - text: De l’air extérieur pénètre dans le liquide et forme les bulles
      correct: false
    explanation: 'L’eau gazeuse contient du CO₂ dissous sous pression. À l’ouverture, la baisse de pression
      réduit la quantité qui peut rester dissoute à l’équilibre : du CO₂ sort de la solution. Ce dégazage
      se distingue de l’ébullition de l’eau et de l’entrée d’air extérieur.'
