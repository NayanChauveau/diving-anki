    - 'Revue du 2026-10-06 : docs/reviews/11-add.md'
    fact_check: pass
  fr:
    front: Pourquoi des bulles apparaissent-elles à l’ouverture d’une bouteille d’eau gazeuse ?
    back: '**La chute de pression rend le liquide sursaturé en gaz.** Une partie du gaz dissous quitte
      alors la solution sous forme de bulles. La pression plus élevée dans la bouteille fermée permettait
      de maintenir davantage de gaz dissous.'
- id: n2-add-profondeur-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::11
  - add
  status: reviewed
  source_id: P333
  review:
    sources:
