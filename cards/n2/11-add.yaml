  fr:
    question: Deux plongées ont la même durée et la même profondeur maximale, mais l’une comporte plusieurs
      remontées et redescendes. Quelle donnée supplémentaire décrit les échanges de gaz liés à ces oscillations
      ?
    choices:
    - text: L’ordre des profondeurs successives et le temps passé à chacune
      correct: true
    - text: La profondeur maximale, appliquée à chaque phase du trajet
      correct: false
    - text: Le nombre de cycles, appliqué indépendamment de leur profondeur
      correct: false
    explanation: Les échanges dépendent de la pression rencontrée et du temps à chaque phase. Un maximum
      et une durée totale, ou le nombre de cycles seul, ne décrivent pas les oscillations. Limiter les
      variations inutiles et organiser les exercices avec l’encadrant.
