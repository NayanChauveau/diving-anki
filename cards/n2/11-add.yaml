  fr:
    front: Quelles informations conserver pour les secours lorsqu’un symptôme apparaît après une plongée
      ?
    back: '**Les paramètres et l’historique des plongées, l’heure et l’évolution des signes, ainsi que
      les gestes déjà réalisés.** Transmettre aussi les données de l’ordinateur et les conditions de plongée
      ; les secours ont besoin de la chronologie, pas seulement de la profondeur maximale.'
