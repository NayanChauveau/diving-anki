    - 'DAN World — Decompression Illness : https://world.dan.org/health-medicine/health-resources/diseases-conditions/decompression-illness-what-is-it-and-what-is-the-treatment/'
    - 'DAN — Back to Basics, narcose, consulté le 2026-10-06 : https://dan.org/alert-diver/article/back-to-basics/'
    - 'Revue du 2026-10-06 : docs/reviews/11-add.md'
    fact_check: pass
  fr:
    front: Pourquoi tous les tissus ne se chargent-ils pas en azote à la même vitesse ?
    back: '**Leur circulation sanguine et leurs propriétés de diffusion et de solubilité diffèrent.**
      Les modèles de décompression représentent ces vitesses par plusieurs compartiments ; un compartiment
      de calcul n’est pas un organe précis.'
- id: n2-add-apres-sortie-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::11
  - add
  status: reviewed
  source_id: P336
