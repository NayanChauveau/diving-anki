    - 'DAN World — Decompression Illness : https://world.dan.org/health-medicine/health-resources/diseases-conditions/decompression-illness-what-is-it-and-what-is-the-treatment/'
    - 'DAN — Back to Basics, narcose, consulté le 2026-10-06 : https://dan.org/alert-diver/article/back-to-basics/'
    - 'Revue du 2026-10-06 : docs/reviews/11-add.md'
    fact_check: pass
  fr:
    front: À durée et mélange respiré comparables, pourquoi une plongée plus profonde tend-elle à augmenter
      la charge en azote ?
    back: '**La pression partielle d’azote respiré augmente.** Elle crée un écart plus grand avec l’azote
      déjà dissous dans les tissus, favorisant son entrée dans l’organisme.'
- id: n2-add-duree-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::11
  - add
  status: reviewed
  source_id: P334
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.20–23.
    - 'DAN World — Decompression Illness : https://world.dan.org/health-medicine/health-resources/diseases-conditions/decompression-illness-what-is-it-and-what-is-the-treatment/'
    - 'DAN — Back to Basics, narcose, consulté le 2026-10-06 : https://dan.org/alert-diver/article/back-to-basics/'
    - 'Revue du 2026-10-06 : docs/reviews/11-add.md'
    fact_check: pass
  fr:
    front: À profondeur constante, pourquoi prolonger une plongée peut-il augmenter les obligations de
      désaturation ?
    back: '**Les tissus continuent à absorber de l’azote tant qu’ils n’ont pas atteint leur équilibre
      avec le gaz respiré.** Une durée plus longue peut donc accroître la charge, même sans descendre
      davantage.'
- id: n2-add-tissus-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::11
  - add
  status: reviewed
  source_id: P335
  review:
