    - 'DAN — Sinus Barotrauma : https://dan.org/health-medicine/health-resources/diseases-conditions/sinus-barotrauma/'
    - 'Revue et vérification du 2026-10-06 : docs/reviews/07-barotraumatismes.md'
    fact_check: pass
  fr:
    question: Par quelle voie l’air des sinus paranasaux communique-t-il avec l’air des fosses nasales
      pour suivre les variations de pression ?
    choices:
    - text: Par de petits orifices reliant chaque sinus aux fosses nasales
      correct: true
    - text: Par les trompes d’Eustache reliant les sinus à l’oreille moyenne
      correct: false
    - text: Par un passage direct entre les sinus et le conduit auditif externe
      correct: false
    explanation: Ces ouvertures sont appelées ostia. Une muqueuse gonflée peut les obstruer et empêcher
      l’équilibrage. Les trompes d’Eustache relient l’oreille moyenne au nasopharynx, pas les sinus.
