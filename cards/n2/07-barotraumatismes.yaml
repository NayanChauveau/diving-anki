  fr:
    question: À la remontée, pourquoi du gaz avalé ou déjà présent dans le tube digestif peut-il provoquer
      une distension douloureuse ?
    choices:
    - text: Le gaz piégé tend à se dilater quand la pression baisse
      correct: true
    - text: Le gaz piégé tend à se comprimer quand la pression baisse
      correct: false
    - text: Le gaz piégé conserve son volume lorsque sa quantité reste constante
      correct: false
    explanation: '**La pression ambiante baisse et le gaz tend à augmenter de volume.** S’il ne s’évacue
      pas facilement, cette expansion peut distendre l’estomac ou l’intestin. Une douleur abdominale n’a
      toutefois pas une cause unique ; son intensité ou sa persistance doit être prise au sérieux.'
