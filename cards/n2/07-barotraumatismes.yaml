  fr:
    question: Quels conduits permettent aux sinus paranasaux d’échanger de l’air avec les fosses nasales
      ?
    choices:
    - text: Les ostia des sinus
      correct: true
    - text: Les trompes d’Eustache
      correct: false
    - text: Les choanes du nasopharynx
      correct: false
    explanation: Les ostia sont les petits orifices reliant les sinus aux fosses nasales. Les trompes
      d’Eustache relient l’oreille moyenne au nasopharynx ; les choanes relient l’arrière des fosses nasales
      au nasopharynx. Un passage nasal libre ne garantit donc pas des ostia libres.
