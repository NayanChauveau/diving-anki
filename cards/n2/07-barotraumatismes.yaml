  fr:
    question: Quel mécanisme peut provoquer une surpression pulmonaire chez un plongeur remontant après
      avoir respiré de l’air comprimé ?
    choices:
    - text: Du gaz piégé se dilate et peut léser les alvéoles pulmonaires
      correct: true
    - text: Des bulles se forment à partir de l’azote dissous dans les tissus
      correct: false
    - text: La pression extérieure comprime progressivement les poumons
      correct: false
    explanation: La pression ambiante baisse pendant la remontée. Si le gaz ne peut pas s’échapper, l’expansion
      peut léser les poumons et parfois faire passer du gaz dans la circulation artérielle. Ce mécanisme
      mécanique diffère de la formation de bulles à partir du gaz dissous lors d’un accident de désaturation.
- id: n2-barotraumatismes-faible-profondeur-001
