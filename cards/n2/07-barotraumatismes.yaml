  fr:
    question: Comment une obturation dentaire défectueuse peut-elle provoquer une douleur liée à la pression
      pendant une plongée ?
    choices:
    - text: Une poche de gaz mal ventilée crée un déséquilibre de pression dans la dent
      correct: true
    - text: Une poche de gaz piégée garde le même volume et reste équilibrée à toute profondeur
      correct: false
    - text: Une baisse de pression ambiante comprime la poche de gaz et l’obturation
      correct: false
    explanation: '**Elle peut laisser une poche de gaz se former ou communiquer insuffisamment avec l’extérieur.**
      La pression du gaz ne suit alors pas correctement la pression ambiante. Sa compression ou son expansion
      peut provoquer une douleur ; à la remontée, le gaz piégé peut endommager la dent ou l’obturation.'
