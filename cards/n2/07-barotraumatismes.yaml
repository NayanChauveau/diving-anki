  fr:
    question: Quel mécanisme peut provoquer une surpression pulmonaire chez un plongeur remontant après
      avoir respiré de l’air comprimé ?
    choices:
    - text: Du gaz piégé se dilate et peut léser les alvéoles pulmonaires
      correct: true
    - text: Des bulles se forment à partir de l’azote dissous dans les tissus
      correct: false
    - text: Du liquide passe de la circulation vers les alvéoles pulmonaires
      correct: false
    explanation: La pression ambiante baisse pendant la remontée. Si du gaz reste piégé, son expansion
      peut léser les alvéoles pulmonaires et faire passer du gaz dans les artères. La formation de bulles
      à partir de l’azote dissous relève de la désaturation ; l’accumulation de liquide dans les alvéoles
      caractérise un œdème pulmonaire. Ces deux mécanismes ne sont pas celui de la surpression pulmonaire.
