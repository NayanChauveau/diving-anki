  fr:
    question: Quels signes peuvent faire suspecter un barotraumatisme des sinus pendant ou après une plongée
      ?
    choices:
    - text: Douleur faciale au front ou aux pommettes, parfois sang au nez
      correct: true
    - text: Marbrures du tronc et démangeaisons apparues après la sortie
      correct: false
    - text: Douleur profonde de l’épaule avec faiblesse d’un bras
      correct: false
    explanation: '**Une douleur faciale aiguë, notamment au front ou sous les pommettes, et parfois du sang
      au nez.** La douleur peut apparaître à la descente ou à la remontée. Les sinus maxillaires peuvent
      aussi donner une douleur ressentie vers les dents supérieures ; ces signes nécessitent une évaluation,
      sans permettre à eux seuls un diagnostic certain.'
