  fr:
    question: Une douleur localisée aux sinus apparaît pendant la descente et ne s’efface pas spontanément.
      Quelle conduite adopter ?
    choices:
    - text: Arrêter la descente et terminer la plongée de façon contrôlée
      correct: true
    - text: Maintenir la profondeur et forcer plusieurs équilibrages
      correct: false
    - text: Descendre plus lentement en attendant que la douleur cesse
      correct: false
    explanation: Descendre davantage augmente le déséquilibre de pression et peut aggraver la lésion.
      Arrêter la descente et terminer la plongée en remontant de façon contrôlée avec son équipier ; ne
      pas forcer l’équilibrage.
