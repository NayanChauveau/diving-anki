  fr:
    question: Une suspicion de barotraumatisme pulmonaire concerne une victime consciente qui respire.
      Quel dispositif de prise en charge initiale en surface convient ?
    choices:
    - text: Alerte des secours et oxygène à pression ambiante avec surveillance
      correct: true
    - text: Alerte des secours et oxygène après réimmersion assistée à faible profondeur
      correct: false
    - text: Alerte des secours et air au masque en attendant l’accès au caisson
      correct: false
    explanation: L’oxygénothérapie normobare consiste à administrer de l’oxygène à la pression ambiante,
      avec le matériel adapté et selon la formation de secourisme. Elle commence en attendant les secours
      et peut précéder une décision de traitement hyperbare. Ne pas réimmerger la victime pour la recomprimer
      ; un masque alimenté en air ne fournit pas la même concentration d’oxygène.
