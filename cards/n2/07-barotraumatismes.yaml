      correct: false
    explanation: '**Ils peuvent enfermer de l’air entre le bouchon et le tympan, dans le conduit auditif
      externe.** Cet espace fermé ne suit pas correctement les variations de pression. Équilibrer par
      la trompe d’Eustache agit sur l’oreille moyenne, pas sur cette poche extérieure.'
