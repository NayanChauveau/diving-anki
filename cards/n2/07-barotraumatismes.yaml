  fr:
    question: Quel mécanisme explique une douleur barotraumatique des sinus à la remontée après une descente
      sans douleur ?
    choices:
    - text: Le gaz entré à la descente reste piégé et se dilate dans un sinus mal ventilé
      correct: true
    - text: Le gaz entré à la descente se comprime et crée une dépression dans un sinus mal ventilé
      correct: false
    - text: L’azote dissous forme des bulles dans le sinus indépendamment de ses orifices
      correct: false
    explanation: 'Un ostium peut laisser entrer l’air puis s’obstruer : à la remontée, le gaz piégé se
      dilate et produit une surpression relative. C’est un blocage inversé, distinct de la dépression
      de descente et des bulles de désaturation.'
