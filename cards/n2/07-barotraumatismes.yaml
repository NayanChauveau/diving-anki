  fr:
    question: Qu’est-ce qui provoque une lésion barotraumatique dans une cavité contenant du gaz ?
    choices:
    - text: Une différence de pression entre cavité gazeuse et environnement
      correct: true
    - text: Une pression ambiante élevée, même avec la cavité équilibrée
      correct: false
    - text: Une diminution de la quantité d’azote dissous dans les tissus
      correct: false
    explanation: '**Un déséquilibre de pression entre le gaz de la cavité et son environnement.** Si l’air
      ne peut pas entrer ou sortir suffisamment, la variation de pression déforme les tissus et peut les
      léser. À la descente, le gaz se comprime ; à la remontée, un gaz piégé cherche à se dilater.'
