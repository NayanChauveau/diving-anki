  fr:
    question: À la surface, un plongeur conscient qui respire présente des signes faisant suspecter un barotraumatisme
      pulmonaire. Quelles actions prioritaires faut-il engager ?
    choices:
    - text: Alerte immédiate et oxygène adapté, avec surveillance
      correct: true
    - text: Observation d’abord, puis alerte si les signes persistent
      correct: false
    - text: Réimmersion assistée d’abord, puis oxygène à la sortie
      correct: false
    explanation: '**Alerter immédiatement les secours et administrer de l’oxygène normobare**, avec le matériel
      adapté et selon la formation de secourisme. Prévenir le directeur de plongée s’il est présent, appliquer
      le plan de secours, surveiller la victime et transmettre les paramètres de plongée. Ne pas tenter
      une recompression en la réimmergeant.'
