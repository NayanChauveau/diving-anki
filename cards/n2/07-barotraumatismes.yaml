  fr:
    question: Une obturation défectueuse laisse une poche de gaz mal communiquer avec l’extérieur. Quel
      mécanisme peut produire une douleur dentaire à la remontée ?
    choices:
    - text: Le gaz piégé se dilate et exerce une pression sur la dent ou l’obturation
      correct: true
    - text: Le gaz piégé se comprime et met la dent ou l’obturation en dépression
      correct: false
    - text: L’azote dissous dans la dent forme des bulles à travers l’obturation
      correct: false
    explanation: Quand la pression ambiante baisse, le gaz retenu tend à se dilater. Cette expansion peut
      provoquer une douleur et endommager la dent ou l’obturation. La compression correspond à la descente
      ; une poche de gaz est distincte du gaz dissous dans les tissus.
