  fr:
    question: Lors d’une remontée en scaphandre depuis 3 m, quel facteur explique qu’une surpression pulmonaire
      reste possible si de l’air est piégé ?
    choices:
    - text: L’augmentation relative du volume du gaz est déjà importante près de la surface
      correct: true
    - text: Le temps passé à 3 m suffit à produire des bulles d’azote dans les alvéoles
      correct: false
    - text: La pression hydrostatique augmente surtout pendant les derniers mètres de remontée
      correct: false
    explanation: 'Le risque est mécanique : à la remontée, l’air piégé tend à se dilater. Il n’exige pas
      une longue exposition à l’azote. À température constante, un gaz libre passerait de 1,3 bar à 1
      bar et augmenterait de 30 % en volume ; dans un poumon, les contraintes des tissus peuvent provoquer
      une lésion. La respiration doit rester libre.'
