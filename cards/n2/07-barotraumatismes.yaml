  fr:
    question: Un plongeur enrhumé peut encore respirer par le nez. Que peut-on en déduire sur la communication
      de l’air vers les oreilles moyennes et les sinus ?
    choices:
    - text: Les fosses nasales peuvent rester ouvertes malgré des trompes ou des ostia obstrués
      correct: true
    - text: Les fosses nasales ouvertes garantissent une communication libre vers les oreilles et les
        sinus
      correct: false
    - text: Le passage d’air par le nez compense les cavités même si leurs petits conduits restent fermés
      correct: false
    explanation: '**Les passages utiles à l’équilibrage peuvent rester obstrués.** Le gonflement des muqueuses
      peut fermer les trompes d’Eustache ou les petits orifices des sinus, même si les fosses nasales
      laissent encore passer de l’air. Ne pas plonger congestionné ou si l’équilibrage est difficile.'
