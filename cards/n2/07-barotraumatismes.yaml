  fr:
    question: À la descente, une douleur des sinus persiste malgré l’arrêt et une légère remontée. Quelle
      suite donner à la plongée ?
    choices:
    - text: Terminer la plongée avec l’équipier en remontant de façon contrôlée
      correct: true
    - text: Attendre à cette profondeur puis reprendre la descente si la douleur s’atténue
      correct: false
    - text: Reprendre la descente après un équilibrage des oreilles devenu facile
      correct: false
    explanation: 'Une douleur persistante traduit une difficulté d’équilibrage des sinus : terminer la
      plongée. Son atténuation ne démontre pas que les conduits sont libres ; elle peut accompagner une
      lésion. L’équilibrage des oreilles passe par les trompes d’Eustache et ne valide pas celui des sinus.'
