  fr:
    question: Pourquoi des bouchons étanches dans les oreilles peuvent-ils provoquer un barotraumatisme
      malgré un bon équilibrage de l’oreille moyenne ?
    choices:
    - text: Ils isolent une poche de gaz dans le conduit auditif externe
      correct: true
    - text: Ils isolent une poche de gaz dans l’oreille moyenne
      correct: false
    - text: Ils empêchent l’oreille moyenne d’être alimentée par les trompes
      correct: false
    explanation: '**Ils peuvent enfermer de l’air entre le bouchon et le tympan, dans le conduit auditif
      externe.** Cet espace fermé ne suit pas correctement les variations de pression. Équilibrer par la
      trompe d’Eustache agit sur l’oreille moyenne, pas sur cette poche extérieure.'
