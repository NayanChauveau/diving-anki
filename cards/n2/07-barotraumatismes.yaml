  fr:
    question: À la descente, une douleur des sinus persiste malgré l’arrêt et une légère remontée. Quelle
      suite donner à la plongée ?
    choices:
    - text: Terminer la plongée avec l’équipier en remontant de façon contrôlée
      correct: true
    - text: Suspendre la descente et poursuivre l’exploration avec l’équipier à profondeur constante
      correct: false
    - text: Remonter avec l’équipier à une profondeur moins douloureuse et y poursuivre l’exploration
      correct: false
    explanation: Si la douleur des sinus persiste malgré l’arrêt et une légère remontée, terminer la plongée
      avec une remontée contrôlée. Réduire la profondeur ou rester à niveau ne démontre pas que les orifices
      des sinus sont libres. Une douleur qui s’atténue peut accompagner une lésion et une entrée de sang
      dans le sinus ; elle ne prouve pas un équilibrage rétabli.
