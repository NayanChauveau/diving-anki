  fr:
    question: Pourquoi une descente lente tête en haut facilite-t-elle généralement l’équilibrage des oreilles
      par rapport à une descente tête en bas ?
    choices:
    - text: L’air rejoint plus facilement l’oreille moyenne via les trompes
      correct: true
    - text: Le tympan subit moins de pression extérieure à profondeur égale
      correct: false
    - text: La tête en haut évite d’avoir à ouvrir les trompes d’Eustache
      correct: false
    explanation: '**Tête en haut, l’air se dirige plus facilement vers les trompes d’Eustache et l’oreille
      moyenne.** Une descente lente permet de l’apporter tôt et progressivement, avant la douleur. Cette
      position facilite l’équilibrage sans rendre acceptable une manœuvre forcée.'
