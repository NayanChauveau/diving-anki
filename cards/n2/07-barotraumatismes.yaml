  fr:
    question: À vitesse de descente identique, pourquoi l’équilibrage des oreilles est-il généralement
      plus facile tête en haut que tête en bas ?
    choices:
    - text: L’air progresse plus facilement vers les oreilles moyennes par les trompes d’Eustache
      correct: true
    - text: L’eau exerce moins de pression sur les tympans à une même profondeur des oreilles
      correct: false
    - text: Le volume d’air des oreilles moyennes se comprime moins à une même profondeur des oreilles
      correct: false
    explanation: La position tête en haut facilite le passage de l’air vers les trompes d’Eustache. Elle
      ne change pas la pression ambiante à profondeur égale ni la loi de compression du gaz. Descendre
      lentement et équilibrer tôt évite d’attendre la douleur.
