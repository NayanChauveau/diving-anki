  fr:
    question: Une douleur dentaire aiguë apparue à la remontée a cessé en surface. Que permet de conclure
      cette disparition de la douleur ?
    choices:
    - text: Une lésion de la dent ou de l’obturation reste possible
      correct: true
    - text: La poche de gaz est évacuée et l’obturation est intacte
      correct: false
    - text: La dent est saine ; seule sa sensibilité à la pression a changé
      correct: false
    explanation: '**Une obturation ou une dent peut être endommagée et la cause rester présente.** La
      baisse de pression a pu faire se dilater une poche de gaz piégée. Un contrôle dentaire recherche
      et traite le défaut ; la fin de la douleur n’atteste pas que la dent est saine.'
