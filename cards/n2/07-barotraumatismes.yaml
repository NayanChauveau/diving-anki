  fr:
    question: Un plongeur enrhumé respire encore par le nez. Pourquoi cela ne suffit-il pas à établir
      que ses oreilles moyennes et ses sinus pourront s’équilibrer ?
    choices:
    - text: Les trompes d’Eustache ou les ostia peuvent être obstrués malgré un passage nasal libre
      correct: true
    - text: Les trompes d’Eustache et les ostia forment un conduit commun, libéré dès que l’air traverse
        le nez
      correct: false
    explanation: 'Le gonflement des muqueuses peut fermer les trompes d’Eustache, qui alimentent les oreilles
      moyennes, ou les ostia, petites ouvertures entre les sinus et les fosses nasales, sans fermer complètement
      le nez. Ces voies sont distinctes : respirer par le nez ne prouve pas qu’elles soient libres. Ne
      pas plonger congestionné ou avec un équilibrage difficile.'
