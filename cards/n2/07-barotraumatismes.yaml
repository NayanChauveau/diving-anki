  fr:
    question: Juste après la sortie de l’eau, un plongeur devient confus et perd la force d’un bras. Il
      ne se plaint pas de douleur thoracique. Peut-on écarter une complication grave de surpression pulmonaire
      ?
    choices:
    - text: 'Non : une embolie gazeuse peut produire des signes neurologiques isolés'
      correct: true
    - text: 'Oui : une embolie d’origine pulmonaire impose une douleur thoracique'
      correct: false
    - text: 'Oui : une faiblesse isolée traduit seulement une fatigue musculaire'
      correct: false
    explanation: '**Non : une embolie gazeuse artérielle peut provoquer des signes neurologiques sans plainte
      thoracique.** Du gaz peut passer depuis les poumons lésés vers la circulation et atteindre le cerveau.
      Confusion, faiblesse, troubles de la sensibilité ou de la conscience imposent une alerte urgente,
      même si le diagnostic exact reste à établir.'
