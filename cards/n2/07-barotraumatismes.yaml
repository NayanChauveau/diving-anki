  fr:
    question: Comment les signes neurologiques peuvent-ils se présenter lors d’une embolie gazeuse artérielle
      d’origine pulmonaire après plongée ?
    choices:
    - text: Des signes neurologiques peuvent être présents sans plainte thoracique
      correct: true
    - text: Des signes neurologiques doivent être précédés d’une plainte thoracique
      correct: false
    - text: Des signes neurologiques doivent être associés à des crachats sanglants
      correct: false
    explanation: Du gaz issu d’une lésion pulmonaire peut passer dans les artères et atteindre le cerveau.
      Les manifestations neurologiques peuvent dominer sans douleur thoracique ni crachats sanglants.
      Confusion et faiblesse d’un bras juste après la plongée exigent une alerte immédiate.
