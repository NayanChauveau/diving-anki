  fr:
    question: Une douleur sous une obturation apparaît à la remontée puis cesse en surface. Quelle valeur
      a cette disparition pour juger l’état de la dent ?
    choices:
    - text: Elle peut suivre une variation de pression sans exclure un défaut ou une lésion
      correct: true
    - text: Elle confirme l’évacuation complète du gaz et l’intégrité de l’obturation
      correct: false
    - text: Elle permet d’attribuer la douleur aux sinus et d’écarter une cause dentaire
      correct: false
    explanation: La disparition de la douleur ne suffit ni à localiser la cause ni à prouver que la dent
      est intacte. Un gaz piégé peut avoir sollicité ou endommagé l’obturation. Un contrôle dentaire recherche
      le défaut ; une douleur des sinus maxillaires peut aussi être ressentie vers les dents supérieures.
