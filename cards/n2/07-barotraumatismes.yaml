  fr:
    question: Quelle association de signes oriente le plus vers une atteinte barotraumatique des sinus
      ?
    choices:
    - text: Douleur du front ou des pommettes liée aux changements de profondeur, mucus nasal sanglant
      correct: true
    - text: Douleur d’oreille liée aux changements de profondeur, audition diminuée et oreille bouchée
      correct: false
    - text: Douleur autour des yeux liée à la descente, marques rouges limitées au contour du masque
      correct: false
    explanation: La localisation faciale et le mucus nasal sanglant orientent vers les sinus. Une douleur
      d’oreille avec baisse d’audition évoque plutôt une atteinte auriculaire ; des marques dans la zone
      du masque orientent vers un placage. Les sinus maxillaires peuvent aussi donner une douleur ressentie
      vers les dents supérieures.
