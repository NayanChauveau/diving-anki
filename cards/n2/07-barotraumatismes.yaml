  fr:
    question: En surface, une victime d’accident de plongée est inconsciente et ne respire pas normalement.
      Les secours sont alertés. Quelle prise en charge mettre en œuvre en attendant leur relais ?
    choices:
    - text: Réanimation cardio-pulmonaire et utilisation d’un défibrillateur dès sa disponibilité
      correct: true
    - text: Position latérale de sécurité et oxygène au masque avec surveillance de la respiration
      correct: false
    - text: Ventilations seules au ballon à l’oxygène, poursuivies jusqu’à l’arrivée des secours
      correct: false
    explanation: 'Une respiration absente ou anormale chez une victime inconsciente impose la réanimation
      cardio-pulmonaire et le défibrillateur dès qu’il est disponible. Après un événement non traumatique,
      la position latérale de sécurité concerne une victime qui ne répond pas mais respire normalement.
      La réanimation associe compressions et ventilation selon la formation et le matériel : des ventilations
      seules jusqu’à l’arrivée des secours ne remplacent pas les compressions.'