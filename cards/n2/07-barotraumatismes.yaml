  fr:
    question: Pour comprendre le risque de surpression pulmonaire dès une faible profondeur, on modélise
      un gaz libre à quantité et température constantes. De 3 m à la surface, de combien son volume augmente-t-il
      ? Prendre 1 bar à la surface et +1 bar par 10 m.
    choices:
    - text: De 30 %
      correct: true
    - text: D’environ 23 %
      correct: false
    - text: De 130 %
      correct: false
    explanation: 'La pression absolue passe de 1,3 à 1 bar. Boyle-Mariotte donne V final = 1,3 × V initial,
      soit une augmentation de 30 %. Environ 23 % est la baisse relative de pression, pas l’augmentation
      de volume ; 130 % est le volume final rapporté au volume initial, pas son augmentation. Dans les
      poumons, un gaz piégé ne se dilate pas librement : les contraintes des tissus peuvent provoquer
      une lésion, même sur une faible remontée.'
