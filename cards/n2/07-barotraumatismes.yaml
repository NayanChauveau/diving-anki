  fr:
    question: Une surpression pulmonaire est-elle possible après une remontée de quelques mètres seulement
      en scaphandre, par exemple depuis le fond d’une piscine ?
    choices:
    - text: 'Oui : du gaz piégé peut se dilater fortement près de la surface'
      correct: true
    - text: 'Non : il faut au moins 2 bars de pression hydrostatique'
      correct: false
    - text: 'Non : la faible durée en piscine empêche ce mécanisme'
      correct: false
    explanation: '**Oui, si du gaz reste piégé dans les poumons.** Une faible profondeur ne protège pas
      : près de la surface, une petite remontée produit déjà une augmentation proportionnelle importante
      du volume du gaz. La respiration doit rester libre pendant la remontée.'
