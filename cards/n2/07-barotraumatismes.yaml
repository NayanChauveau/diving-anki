  fr:
    question: Une descente sans douleur exclut-elle un barotraumatisme des sinus pendant la remontée ?
    choices:
    - text: 'Non : un orifice peut s’obstruer et empêcher l’évacuation du gaz'
      correct: true
    - text: 'Oui : l’équilibrage à la descente suffit à maintenir les pressions égales à la remontée'
      correct: false
    - text: 'Oui : les trompes d’Eustache assurent l’évacuation du gaz des sinus à la remontée'
      correct: false
    explanation: '**Non.** L’air peut être entré à la descente puis rester piégé si un orifice s’obstrue.
      À la remontée, il se dilate et peut créer un blocage inversé douloureux. Une douleur ou un saignement
      après la plongée nécessite une évaluation médicale ; la disparition momentanée de la douleur ne prouve
      pas la guérison.'
