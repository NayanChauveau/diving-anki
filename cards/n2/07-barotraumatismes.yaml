  fr:
    question: Une victime d’accident de plongée est inconsciente et ne respire pas normalement. Quels
      gestes doivent être engagés en priorité ?
    choices:
    - text: Réanimation cardio-respiratoire et alerte des secours
      correct: true
    - text: Position latérale de sécurité, oxygène au masque et alerte
      correct: false
    - text: Oxygène au masque seul et alerte, avant de réévaluer la respiration
      correct: false
    explanation: Un masque à oxygène seul ne fait pas respirer une victime qui ne respire pas. La réanimation
      cardio-respiratoire et l’alerte sont prioritaires ; la ventilation assistée et l’oxygène s’intègrent
      aux gestes de secourisme avec le matériel approprié.
