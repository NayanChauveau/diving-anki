  fr:
    question: Après une suspicion d’accident pulmonaire ou neurologique de plongée, les symptômes diminuent
      sous oxygène. Peut-on annuler l’évaluation médicale urgente ?
    choices:
    - text: 'Non : poursuivre l’oxygène et maintenir l’évaluation urgente'
      correct: true
    - text: 'Oui : suspendre la prise en charge dès disparition des signes'
      correct: false
    - text: 'Oui : remplacer l’évaluation par une surveillance de la palanquée'
      correct: false
    explanation: '**Non.** Une amélioration ne permet pas d’exclure une lésion ou une récidive des troubles.
      Poursuivre l’oxygène jusqu’au relais des secours spécialisés et maintenir la prise en charge médicale
      urgente.'
