  fr:
    question: Quel déséquilibre définit le vertige alternobarique en plongée ?
    choices:
    - text: Une différence de pression entre les deux oreilles moyennes
      correct: true
    - text: Une différence de température entre les deux oreilles
      correct: false
    - text: Une différence de pression entre les sinus frontaux et maxillaires
      correct: false
    explanation: L’équilibrage asymétrique stimule différemment les organes de l’équilibre. Cela peut
      provoquer rotation, nausée et désorientation. Un vertige persistant après la plongée doit faire
      rechercher d’autres atteintes, notamment de l’oreille interne.
