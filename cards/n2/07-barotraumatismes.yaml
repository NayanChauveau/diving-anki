  fr:
    question: Des troubles pulmonaires ou neurologiques après plongée disparaissent sous oxygène, après
      l’alerte. Quelle conduite tenir jusqu’au relais des secours ?
    choices:
    - text: Continuer l’oxygène et signaler l’amélioration en maintenant la prise en charge urgente
      correct: true
    - text: Arrêter l’oxygène et signaler l’amélioration en maintenant la prise en charge urgente
      correct: false
    - text: Continuer l’oxygène et signaler l’amélioration en remplaçant l’urgence par un rendez-vous
      correct: false
    explanation: Une amélioration sous oxygène ne prouve pas que la lésion a disparu et les troubles peuvent
      récidiver. Maintenir l’oxygène et la prise en charge urgente jusqu’au relais des secours, en transmettant
      l’évolution des signes.
