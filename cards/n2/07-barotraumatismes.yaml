  fr:
    question: En surface, une victime d’accident de plongée est inconsciente et ne respire pas normalement.
      Les secours sont alertés. Quelle prise en charge commencer ?
    choices:
    - text: Réanimation cardio-pulmonaire et utilisation d’un défibrillateur dès sa disponibilité
      correct: true
    - text: Position latérale de sécurité et oxygène au masque avec surveillance de la respiration
      correct: false
    - text: Oxygène au masque à haute concentration et attente de la reprise de respiration
      correct: false
    explanation: Une respiration absente ou anormale impose la réanimation cardio-pulmonaire et le défibrillateur
      dès qu’il est disponible. La position latérale de sécurité concerne une victime inconsciente qui
      respire normalement. Un masque à oxygène ne crée pas de ventilation ; celle-ci s’intègre aux gestes
      de réanimation selon la formation et le matériel.
