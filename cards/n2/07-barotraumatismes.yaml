  fr:
    question: Après une plongée avec paliers respectés, une douleur thoracique et une difficulté respiratoire
      apparaissent, parfois avec du sang dans les crachats. Quelle interprétation justifie une alerte urgente
      ?
    choices:
    - text: Une lésion pulmonaire, notamment barotraumatique ou liée à un OPI, reste possible
      correct: true
    - text: Les paliers respectés excluent le barotraumatisme pulmonaire mais pas l’OPI
      correct: false
    - text: Les paliers respectés excluent l’OPI mais pas le barotraumatisme pulmonaire
      correct: false
    explanation: '**Ces signes peuvent accompagner une lésion pulmonaire grave.** Un barotraumatisme pulmonaire
      fait partie des causes possibles, ainsi qu’un œdème pulmonaire d’immersion ou d’autres urgences. Respecter
      les paliers ou avoir peu plongé ne suffit pas à les écarter : alerter les secours immédiatement.'
