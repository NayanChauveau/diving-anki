  fr:
    question: Lors de l’équilibrage, par quel conduit l’air atteint-il l’oreille moyenne depuis l’arrière
      du nez ?
    choices:
    - text: La trompe d’Eustache
      correct: true
    - text: Le conduit auditif externe
      correct: false
    - text: Les canaux semi-circulaires de l’oreille interne
      correct: false
    explanation: Elle relie l’oreille moyenne au nasopharynx, derrière le nez. Le tympan sépare cette
      cavité du conduit auditif externe ; les canaux de l’oreille interne participent à l’équilibre, pas
      à cet apport d’air.
