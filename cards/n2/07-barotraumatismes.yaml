  fr:
    question: Après une plongée avec paliers respectés, une douleur thoracique et une difficulté respiratoire
      apparaissent. Quel lien existe entre ces paliers et une éventuelle lésion pulmonaire ?
    choices:
    - text: Ils gèrent la désaturation, sans exclure un barotraumatisme ni un œdème pulmonaire d’immersion
      correct: true
    - text: Ils préviennent les lésions par expansion de gaz, sans exclure un œdème pulmonaire d’immersion
      correct: false
    - text: Ils préviennent l’œdème pulmonaire d’immersion, sans exclure les lésions par expansion de
        gaz
      correct: false
    explanation: Les paliers concernent l’élimination des gaz dissous. Ils n’empêchent ni l’expansion
      d’un gaz piégé dans les poumons ni un œdème pulmonaire d’immersion, accumulation de liquide dans
      les poumons. Douleur thoracique et gêne respiratoire justifient une alerte urgente, avec ou sans
      crachats sanglants.
