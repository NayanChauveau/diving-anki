  fr:
    question: À la descente, le masque se plaque douloureusement sur le visage malgré une sangle correctement
      réglée. Quel déséquilibre explique cet effet ventouse ?
    choices:
    - text: La pression dans le masque est devenue inférieure à la pression de l’eau
      correct: true
    - text: La pression dans le masque est devenue supérieure à la pression de l’eau
      correct: false
    - text: Les pressions sont égales, mais le gaz a augmenté de volume
      correct: false
    explanation: Sans apport d’air par le nez, la jupe se déforme sous la pression extérieure jusqu’à
      ne plus compenser. Les tissus du visage et les yeux peuvent subir la dépression relative ; le réglage
      de sangle ne rétablit pas la pression interne.
