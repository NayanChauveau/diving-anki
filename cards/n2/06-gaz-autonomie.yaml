  - gaz-autonomie
  status: reviewed
  source_id: P185
  review:
    sources:
    - 'Conversion QCM et revue des choix du 2026-10-06 : docs/reviews/QCM_GLOBALE.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'NASA — Equation of State, Boyle à température et masse constantes : https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/equation-of-state/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    question: Un bloc fermé de volume intérieur 12 L est descendu de la surface à 20 m, sans fuite et à
      température constante. Son volume intérieur devient-il 4 L comme celui d’un ballon souple ?
    choices:
    - text: 'Non : le volume reste pratiquement de 12 L'
      correct: true
    - text: 'Oui : le gaz et le bloc se compriment jusqu’à 4 L'
      correct: false
    - text: 'Non : le bloc garde 12 L mais le gaz n’en occupe plus que 4'
      correct: false
    explanation: '**Non : il reste pratiquement de 12 L.** La paroi rigide empêche une compression comparable
      à celle du ballon. Le gaz enfermé garde presque le même volume et la même pression interne absolue
      ; il ne se met pas à la pression de l’eau environnante.'
- id: n2-gaz-gilet-descente-001
  type: mcq
  anki_model: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  status: reviewed
  source_id: P186
  review:
    sources:
    - 'Conversion QCM et revue des choix du 2026-10-06 : docs/reviews/QCM_GLOBALE.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'DAN — Lack of Buoyancy Control : https://dan.org/health-medicine/health-resource/smart-guides/7-mistakes-divers-make-and-how-to-avoid-them/4-lack-of-buoyancy-control/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    question: Un plongeur stabilisé descend de quelques mètres et devient plus négatif sans avoir modifié
      le gaz de son gilet. Quel ajustement du gilet permet de retrouver la stabilisation, et pourquoi procéder
      progressivement ?
    choices:
    - text: Ajouter de petites quantités de gaz et contrôler l’effet
      correct: true
    - text: Ajouter en une fois le volume qui compensait à la surface
      correct: false
    - text: Purger par petites quantités pour rétablir la poussée
      correct: false
    explanation: '**Ajouter de petites quantités d’air, en contrôlant le résultat.** La pression accrue
      comprime le gaz du gilet et le néoprène, ce qui réduit la poussée. Des apports progressifs permettent
      de compenser sans gonfler excessivement et déclencher une remontée.'
