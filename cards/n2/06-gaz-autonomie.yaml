  fr:
    question: Un ballon contient 6 L d’air à la surface. Quel volume occupe cet air à 10 m ? Le ballon
      est souple et fermé ; la température est constante et la tension de sa paroi négligeable. Prendre
      1 bar à la surface et +1 bar tous les 10 m. Assimiler l’air à un gaz parfait.
    explanation: '**3 L.** À 10 m, la pression absolue vaut 2 bars : V₂ = 6 × 1/2 = 3 L.'
    choices:
    - text: 3 L
      correct: true
    - text: 6 L
      correct: false
