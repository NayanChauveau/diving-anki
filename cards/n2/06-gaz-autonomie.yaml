      débits de référence sont 30 et 40 L/min à 1 bar. Le stock alloué est de 600 L à 1 bar. Suffit-il pour
      cette phase seule ? Prendre 3 bars absolus, gaz parfait et température constante.
    explanation: '**Non : il faut 630 L, soit 30 L de plus.** Additionner les débits : 30 + 40 = 70 L/min
      de référence. À 20 m : 70 × 3 = 210 L/min ramenés à 1 bar. En 3 min : 210 × 3 = 630 L. Les deux équipiers
      puisent simultanément dans le même stock.'
