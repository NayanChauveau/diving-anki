      State ; BSAC So you think you use too much gas et Gas reserves ; modèle explicite de la carte ;
      chaque distracteur analysé dans le CSV'
    fact_check: pass
  fr:
    question: Un bloc rigide fermé de volume intérieur 12 L passe de la surface à 20 m. Sans fuite, à
      température constante, et en négligeant la déformation de ses parois, que deviennent le volume du
      gaz et sa pression intérieure absolue ?
    choices:
    - text: Volume inchangé ; pression intérieure inchangée
      correct: true
    - text: Volume inchangé ; pression intérieure égale à la pression ambiante
      correct: false
    - text: Volume divisé par trois ; pression intérieure égale à la pression ambiante
      correct: false
    explanation: 'La quantité, la température et le volume du gaz dans le bloc restent constants : sa
      pression intérieure absolue reste donc la même. La paroi supporte la différence avec l’extérieur.
      Dans un ballon souple, au contraire, le gaz se comprime et sa pression suit l’ambiante. Le volume
      intérieur reste ici 12 L.'
- id: n2-gaz-gilet-descente-001
  type: mcq
  anki_model: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  status: reviewed
  source_id: P186
  review:
    sources:
    - 'Conversion QCM et revue des choix du 2026-10-06 : docs/reviews/QCM_GLOBALE.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'DAN — Lack of Buoyancy Control : https://dan.org/health-medicine/health-resource/smart-guides/7-mistakes-divers-make-and-how-to-avoid-them/4-lack-of-buoyancy-control/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    - 'Revue pédagogique du 2026-10-09 : docs/reviews/QUALITE_GLOBALE_2026-10-09.md ; objectif et identité
      conservés'
    - 'Revue approfondie N2 du 2026-10-09 : docs/reviews/PHYSIQUE_N2_2026-10-09.md ; Boyle-Mariotte ;
      DAN Buoyancy Control ; quantité manquante calculée à la pression finale ; chaque distracteur analysé
      dans le CSV'
    fact_check: pass
  fr:
    question: Dans un modèle de gilet souple fermé, le gaz occupe 4 L à 20 m. Le plongeur descend à 30
      m sans ajout ni purge. Quel volume de gaz, mesuré à la pression ambiante à 30 m, faut-il alors ajouter
      pour retrouver 4 L dans le gilet ? Gaz parfait, température constante, paroi sans effet mécanique
      ; 1 bar en surface et +1 bar par 10 m.
    choices:
    - text: 1 L à la pression ambiante à 30 m
      correct: true
    - text: 4/3 L à la pression ambiante à 30 m
      correct: false
    - text: 4 L à la pression ambiante à 30 m
      correct: false
    explanation: 'Le gaz initial passe de 3 à 4 bar absolus : son volume devient 4 × 3/4 = 3 L. Il manque
      donc 4 − 3 = 1 L, mesuré à la pression ambiante à 30 m. Le résultat 4/3 L utilise à tort la pression
      initiale pour le déficit ; 4 L ajoute le volume total au lieu du volume manquant. En pratique, l’ajustement
      se fait par petits apports contrôlés.'
- id: n2-gaz-gilet-remontee-001
  type: mcq
  anki_model: basic
  deck: Physique
  levels:
  - N2
