  - exercice::calcul
  status: reviewed
  source_id: P179
  review:
    sources:
    - 'Revue finale des formats, clarté et distracteurs du 2026-10-06 : docs/reviews/QCM_REVUE_FINALE.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'NASA — Equation of State, Boyle à température et masse constantes : https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/equation-of-state/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    question: Un ballon contient 12 L d’air à la surface. Quel volume occupe cet air à 20 m ? Le ballon
      est souple et fermé ; la température est constante et la tension de sa paroi négligeable. Prendre
      1 bar à la surface et +1 bar tous les 10 m. Assimiler l’air à un gaz parfait.
    explanation: '**4 L.** La pression passe de 1 à 3 bars absolus : V₂ = 12 × 1/3 = 4 L. Le gaz occupe
      moins de place, mais sa quantité est inchangée.'
    choices:
    - text: 4 L
      correct: true
    - text: 6 L
      correct: false
    - text: 36 L
      correct: false
