  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'BSAC — So, you think you use too much gas?, section How much gas do you use?, débit × pression
      absolue × durée et somme des phases : https://www.bsac.com/news-and-blog/so-you-think-you-use-too-much-gas/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    front: Un bloc de volume intérieur 15 L affiche 180 bars au manomètre. Quel stock nominal ramené à
      1 bar donne l’approximation de cours volume intérieur × pression manométrique ?
    back: '**Environ 2 700 L à 1 bar.** 15 × 180 = 2 700. À pression identique, un bloc de plus grand
      volume intérieur contient davantage de gaz.'
- id: n2-gaz-duree-stock-donne-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  - exercice::calcul
  status: reviewed
  source_id: P197
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'BSAC — So, you think you use too much gas?, section How much gas do you use?, débit × pression
      absolue × durée et somme des phases : https://www.bsac.com/news-and-blog/so-you-think-you-use-too-much-gas/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    front: Une phase théorique se déroule uniquement à 10 m. On lui alloue 1 200 L d’air ramenés à 1 bar.
      Le débit respiratoire de référence est de 20 L/min à 1 bar et la ventilation reste identique à cette
      profondeur. Combien de minutes couvre ce stock pour cette seule phase ? Prendre 1 bar à la surface
      et +1 bar tous les 10 m.
    back: '**30 min.** À 10 m, la pression vaut 2 bars : consommation = 20 × 2 = 40 L/min ramenés à 1
      bar. Durée = 1 200/40 = 30 min. Seule la phase à 10 m est comptée.'
- id: n2-gaz-rapport-autonomie-001
  type: mcq
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  status: reviewed
  source_id: P200
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'BSAC — So, you think you use too much gas?, section How much gas do you use?, débit × pression
      absolue × durée et somme des phases : https://www.bsac.com/news-and-blog/so-you-think-you-use-too-much-gas/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    question: Un même stock d’air alimente un plongeur dont le volume ventilé par minute reste identique.
      Dans un modèle à profondeur constante, quelle fraction de la durée obtenue à la surface obtient-on
      à 40 m ? Prendre 1 bar à la surface et +1 bar tous les 10 m. Gaz parfait et température constante.
    choices:
    - text: Un cinquième
      correct: true
    - text: Un quart
      correct: false
    - text: La moitié
      correct: false
    explanation: 'À 40 m, la pression absolue vaut 5 bars. Pour une même ventilation, le prélèvement d’air
      ramené à 1 bar est cinq fois plus grand : la durée fournie par le même stock est divisée par cinq.'
- id: n2-gaz-duree-fond-planification-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  status: reviewed
  source_id: P201
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'BSAC — Safe diving guide, Gas reserves, variabilité et besoins des équipiers : https://www.bsac.com/safety/safe-diving-guide/gas/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    front: Un calcul divise tout le stock nominal du bloc par la consommation à la profondeur du fond.
      Pourquoi le résultat ne donne-t-il pas directement le temps disponible pour explorer ?
    back: '**Il ne réserve pas l’air nécessaire aux autres phases et aux imprévus.** Il faut compter la
      descente, le retour, la remontée et les éventuels paliers, puis prévoir une réserve adaptée. Le
      calcul doit aussi tenir compte des besoins des équipiers et des variations de consommation.'
