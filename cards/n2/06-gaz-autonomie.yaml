cards:
- id: n2-gaz-loi-boyle-001
  type: mcq
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  status: reviewed
  source_id: P175
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'NASA — Equation of State, Boyle à température et masse constantes : https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/equation-of-state/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    question: Une quantité fixe de gaz parfait reste à température constante. Si sa pression absolue est
      multipliée par 3, que devient son volume ?
    choices:
    - text: Il est divisé par 3
      correct: true
    - text: Il est multiplié par 3
      correct: false
    - text: Il est divisé par 2
      correct: false
    explanation: 'La loi de Boyle-Mariotte donne P₁ × V₁ = P₂ × V₂ : le produit pression absolue × volume
      reste constant. Les gaz sont compressibles ; l’eau est approximativement incompressible aux pressions
      usuelles de plongée.'
- id: n2-gaz-conditions-001
  type: mcq
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  status: reviewed
  source_id: P176
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'NASA — Equation of State, Boyle à température et masse constantes : https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/equation-of-state/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    question: Pour utiliser P₁V₁ = P₂V₂ entre deux états d’un même gaz parfait, quelles grandeurs doivent
      rester constantes ?
    choices:
    - text: La température et la quantité de gaz
      correct: true
    - text: La température et la pression
      correct: false
    - text: La quantité de gaz et le volume
      correct: false
    explanation: 'Les pressions utilisées sont absolues. Ajouter du gaz dans un gilet ou en purger change
      la quantité de gaz : on ne peut plus relier les deux états avec un même produit PV constant.'
- id: n2-gaz-ballon-surface-vingt-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  - exercice::calcul
  status: reviewed
  source_id: P179
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'NASA — Equation of State, Boyle à température et masse constantes : https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/equation-of-state/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    front: Un ballon contient 12 L d’air à la surface. Quel volume occupe cet air à 20 m ? Le ballon est
      souple et fermé ; la température est constante et la tension de sa paroi négligeable. Prendre 1
      bar à la surface et +1 bar tous les 10 m. Assimiler l’air à un gaz parfait.
    back: '**4 L.** La pression passe de 1 à 3 bars absolus : V₂ = 12 × 1/3 = 4 L. Le gaz occupe moins
      de place, mais sa quantité est inchangée.'
