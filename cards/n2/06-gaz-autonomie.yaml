    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'NASA — Equation of State, Boyle à température et masse constantes : https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/equation-of-state/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    question: Un ballon contient 2 L d’air à 20 m. Quel volume occuperait cet air à la surface ? Supposer
      une enveloppe assez extensible pour ne pas limiter l’expansion. Le ballon est souple et fermé ; la
      température est constante et la tension de sa paroi négligeable. Prendre 1 bar à la surface et +1
      bar tous les 10 m. Assimiler l’air à un gaz parfait.
    explanation: '**6 L.** La pression passe de 3 à 1 bar absolu : V₂ = 2 × 3/1 = 6 L.'
    choices:
    - text: 6 L
      correct: true
    - text: 4 L
      correct: false
    - text: 2/3 L
      correct: false
