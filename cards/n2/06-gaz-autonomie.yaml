  status: reviewed
  source_id: P193
  review:
    sources:
    - 'Revue finale des formats, clarté et distracteurs du 2026-10-06 : docs/reviews/QCM_REVUE_FINALE.md'
    - 'N3-S01 — MFT N3 FFESSM, décembre 2025, p.8, 13, 15 ; pertinence N3 revue le 2026-10-06 : docs/reviews/n3/00-reprises-n2.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'BSAC — So, you think you use too much gas?, section How much gas do you use?, débit × pression
      absolue × durée et somme des phases : https://www.bsac.com/news-and-blog/so-you-think-you-use-too-much-gas/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    question: À 20 m, un plongeur ventile 20 L d’air par minute mesurés à la pression ambiante. À quel débit
      d’air ramené à 1 bar cela correspond-il ? Prendre 1 bar à la surface et +1 bar tous les 10 m. Température
      supposée constante.
    explanation: '**60 L/min ramenés à 1 bar.** À 20 m : 3 bars absolus. Chaque litre respiré à cette profondeur
      équivaut à 3 L à 1 bar : 20 × 3 = 60 L/min.'
    choices:
    - text: 60 L/min à 1 bar
      correct: true
    - text: 40 L/min à 1 bar
      correct: false
    - text: 20/3 L/min à 1 bar
      correct: false
