    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'NASA — Equation of State, Boyle à température et masse constantes : https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/equation-of-state/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    front: Un ballon contient 2 L d’air à 20 m. Quel volume occuperait cet air à la surface ? Supposer
      une enveloppe assez extensible pour ne pas limiter l’expansion. Le ballon est souple et fermé ;
      la température est constante et la tension de sa paroi négligeable. Prendre 1 bar à la surface et
      +1 bar tous les 10 m. Assimiler l’air à un gaz parfait.
    back: '**6 L.** La pression passe de 3 à 1 bar absolu : V₂ = 2 × 3/1 = 6 L.'
- id: n2-gaz-ballon-entre-profondeurs-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  - exercice::calcul
  status: reviewed
  source_id: P183
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'NASA — Equation of State, Boyle à température et masse constantes : https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/equation-of-state/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    front: Un ballon contient 4 L d’air à 10 m. Quel sera son volume à 30 m ? Le ballon est souple et
      fermé ; la température est constante et la tension de sa paroi négligeable. Prendre 1 bar à la surface
      et +1 bar tous les 10 m. Assimiler l’air à un gaz parfait.
    back: '**2 L.** À 10 m : 2 bars absolus ; à 30 m : 4 bars absolus. V₂ = 4 × 2/4 = 2 L. C’est le rapport
      des pressions absolues qui compte, pas le rapport des profondeurs.'
- id: n2-gaz-expansion-comparaison-001
  type: mcq
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  - exercice::calcul
  status: reviewed
  source_id: P184
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'NASA — Equation of State, Boyle à température et masse constantes : https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/equation-of-state/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    question: Deux ballons souples fermés contiennent chacun 2 L à leur profondeur de départ. L’un remonte
      de 10 m à la surface ; l’autre de 20 m à 10 m. Quels volumes atteignent-ils, respectivement ? Température
      constante, parois sans effet mécanique et assez extensibles. Prendre 1 bar à la surface et +1 bar
      tous les 10 m. Assimiler l’air à un gaz parfait.
    choices:
    - text: 4 L et 3 L
      correct: true
    - text: 4 L et 4 L
      correct: false
    - text: 3 L et 4 L
      correct: false
    explanation: 'Premier ballon : 2 × 2/1 = 4 L. Second ballon : 2 × 3/2 = 3 L. Pour une même remontée
      de 10 m, l’expansion proportionnelle est plus forte près de la surface.'
- id: n2-gaz-bloc-rigide-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  status: reviewed
  source_id: P185
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'NASA — Equation of State, Boyle à température et masse constantes : https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/equation-of-state/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    front: Un bloc fermé de volume intérieur 12 L est descendu de la surface à 20 m, sans fuite et à température
      constante. Son volume intérieur devient-il 4 L comme celui d’un ballon souple ?
    back: '**Non : il reste pratiquement de 12 L.** La paroi rigide empêche une compression comparable
      à celle du ballon. Le gaz enfermé garde presque le même volume et la même pression interne absolue
      ; il ne se met pas à la pression de l’eau environnante.'
- id: n2-gaz-gilet-descente-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  status: reviewed
  source_id: P186
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'DAN — Lack of Buoyancy Control : https://dan.org/health-medicine/health-resource/smart-guides/7-mistakes-divers-make-and-how-to-avoid-them/4-lack-of-buoyancy-control/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    front: Un plongeur stabilisé descend de quelques mètres et devient plus négatif sans avoir modifié
      le gaz de son gilet. Quel ajustement du gilet permet de retrouver la stabilisation, et pourquoi
      procéder progressivement ?
    back: '**Ajouter de petites quantités d’air, en contrôlant le résultat.** La pression accrue comprime
      le gaz du gilet et le néoprène, ce qui réduit la poussée. Des apports progressifs permettent de
      compenser sans gonfler excessivement et déclencher une remontée.'
- id: n2-gaz-gilet-remontee-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  status: reviewed
  source_id: P187
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'DAN — Lack of Buoyancy Control : https://dan.org/health-medicine/health-resource/smart-guides/7-mistakes-divers-make-and-how-to-avoid-them/4-lack-of-buoyancy-control/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    front: Un plongeur commence une remontée avec du gaz dans son gilet. Pourquoi peut-il devoir purger
      plusieurs fois pendant cette remontée ?
    back: '**La baisse de pression fait se dilater le gaz restant.** Une purge ne supprime pas l’expansion
      qui se poursuit en remontant. Il faut ajuster progressivement le volume du gilet en surveillant
      la vitesse et la stabilisation.'
- id: n2-gaz-masque-descente-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  status: reviewed
  source_id: P188
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'DAN World — Preventing Mask Squeeze During Your Dives : https://world.dan.org/id/alert-diver/article/preventing-mask-squeeze/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    front: À la descente, comment remettre l’intérieur du masque à la pression ambiante pour éviter son
      placage sur le visage ?
    back: '**Souffler doucement de l’air par le nez dans le masque.** La pression de l’eau augmente à
      la descente ; cet apport compense la compression du gaz à l’intérieur. Expirer par la bouche dans
      le détendeur n’alimente pas le masque.'
- id: n2-gaz-oreille-descente-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  status: reviewed
  source_id: P189
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'DAN — Ears and Diving, Chapter 1: Key Information : https://dan.org/health-medicine/health-resource/dive-medical-reference-books/ears-diving/ears-equalization/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    front: Pourquoi faut-il équilibrer les oreilles régulièrement et sans forcer pendant la descente ?
    back: '**Pour faire entrer de l’air dans l’oreille moyenne et équilibrer la pression de part et d’autre
      du tympan.** La pression extérieure augmente avec la profondeur. On équilibre tôt, avant la douleur
      ; si l’équilibrage ne passe pas, on arrête de descendre plutôt que de forcer.'
- id: n2-gaz-detendeur-pression-001
  type: mcq
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  status: reviewed
  source_id: P190
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'DAN — Breathe In, Breathe Out, fonction du deuxième étage : https://dan.org/alert-diver/article/breathe-in-breathe-out/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    question: À 20 m, à quelle pression absolue le deuxième étage d’un détendeur délivre-t-il approximativement
      l’air respiré ? Prendre 1 bar à la surface et +1 bar tous les 10 m.
    choices:
    - text: 3 bars
      correct: true
    - text: 1 bar
      correct: false
    - text: 2 bars
      correct: false
    explanation: Le deuxième étage fournit l’air à une pression proche de celle de l’eau autour du plongeur.
      À 20 m, cette pression ambiante vaut 1 + 20/10 = 3 bars absolus.
- id: n2-gaz-debit-vingt-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  - exercice::calcul
  status: reviewed
  source_id: P193
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'BSAC — So, you think you use too much gas?, section How much gas do you use?, débit × pression
      absolue × durée et somme des phases : https://www.bsac.com/news-and-blog/so-you-think-you-use-too-much-gas/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    front: À 20 m, un plongeur ventile 20 L d’air par minute mesurés à la pression ambiante. À quel débit
      d’air ramené à 1 bar cela correspond-il ? Prendre 1 bar à la surface et +1 bar tous les 10 m. Température
      supposée constante.
    back: '**60 L/min ramenés à 1 bar.** À 20 m : 3 bars absolus. Chaque litre respiré à cette profondeur
      équivaut à 3 L à 1 bar : 20 × 3 = 60 L/min.'
- id: n2-gaz-debit-trente-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
