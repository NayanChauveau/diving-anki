    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'BSAC — So, you think you use too much gas?, section How much gas do you use?, débit × pression
      absolue × durée et somme des phases : https://www.bsac.com/news-and-blog/so-you-think-you-use-too-much-gas/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    front: À 30 m, un plongeur ventile 18 L/min mesurés à la pression ambiante. Quel est le débit correspondant
      ramené à 1 bar ? Prendre 1 bar à la surface et +1 bar tous les 10 m. Température supposée constante.
    back: '**72 L/min ramenés à 1 bar.** La pression absolue vaut 4 bars : 18 × 4 = 72 L/min.'
- id: n2-gaz-stock-nominal-001
  type: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  - exercice::calcul
  status: reviewed
  source_id: P195
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'BSAC — So, you think you use too much gas?, section How much gas do you use?, débit × pression
      absolue × durée et somme des phases : https://www.bsac.com/news-and-blog/so-you-think-you-use-too-much-gas/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    front: Un bloc de volume intérieur 12 L affiche 200 bars au manomètre. Quel stock nominal d’air ramené
      à 1 bar obtient-on avec l’approximation de cours volume intérieur × pression manométrique ?
    back: '**Environ 2 400 L à 1 bar.** 12 × 200 = 2 400. Les 12 L sont le volume intérieur du bloc ;
      2 400 L représentent un volume de gaz ramené à 1 bar. Le stock utilisable avant une réserve donnée
      se calcule avec la différence de pression, pas avec les 200 bars entiers.'
- id: n2-gaz-stock-quinze-001
  type: basic
  deck: Physique
  levels:
