    - 'Conversion QCM et revue des choix du 2026-10-06 : docs/reviews/QCM_GLOBALE.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'DAN — Lack of Buoyancy Control : https://dan.org/health-medicine/health-resource/smart-guides/7-mistakes-divers-make-and-how-to-avoid-them/4-lack-of-buoyancy-control/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    question: Un plongeur commence une remontée avec du gaz dans son gilet. Pourquoi peut-il devoir purger
      plusieurs fois pendant cette remontée ?
    choices:
    - text: Le gaz restant se dilate encore après une première purge
      correct: true
    - text: Une première purge remet le gaz à la pression de surface pour tout le trajet
      correct: false
    - text: Le gaz restant conserve son volume après la purge mais la poussée augmente
      correct: false
    explanation: '**La baisse de pression fait se dilater le gaz restant.** Une purge ne supprime pas l’expansion
      qui se poursuit en remontant. Il faut ajuster progressivement le volume du gilet en surveillant la
      vitesse et la stabilisation.'
- id: n2-gaz-masque-descente-001
  type: mcq
  anki_model: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  status: reviewed
  source_id: P188
  review:
    sources:
    - 'Conversion QCM et revue des choix du 2026-10-06 : docs/reviews/QCM_GLOBALE.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'DAN World — Preventing Mask Squeeze During Your Dives : https://world.dan.org/id/alert-diver/article/preventing-mask-squeeze/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    question: À la descente, comment remettre l’intérieur du masque à la pression ambiante pour éviter son
      placage sur le visage ?
    choices:
    - text: Expirer doucement par le nez dans le masque
      correct: true
    - text: Expirer plus fortement par la bouche dans le détendeur
      correct: false
    - text: Souffler nez pincé, sans envoyer d’air dans le masque
      correct: false
    explanation: '**Souffler doucement de l’air par le nez dans le masque.** La pression de l’eau augmente
      à la descente ; cet apport compense la compression du gaz à l’intérieur. Expirer par la bouche dans
      le détendeur n’alimente pas le masque.'
- id: n2-gaz-oreille-descente-001
  type: mcq
  anki_model: basic
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  status: reviewed
  source_id: P189
  review:
    sources:
    - 'Conversion QCM et revue des choix du 2026-10-06 : docs/reviews/QCM_GLOBALE.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'DAN — Ears and Diving, Chapter 1: Key Information : https://dan.org/health-medicine/health-resource/dive-medical-reference-books/ears-diving/ears-equalization/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    question: Pourquoi faut-il équilibrer les oreilles régulièrement et sans forcer pendant la descente
      ?
    choices:
    - text: Égaliser la pression des deux côtés du tympan
      correct: true
    - text: Augmenter la pression dans le conduit auditif externe
      correct: false
    - text: Maintenir l’oreille moyenne à la pression de surface
      correct: false
    explanation: '**Pour faire entrer de l’air dans l’oreille moyenne et équilibrer la pression de part
      et d’autre du tympan.** La pression extérieure augmente avec la profondeur. On équilibre tôt, avant
      la douleur ; si l’équilibrage ne passe pas, on arrête de descendre plutôt que de forcer.'
- id: n2-gaz-detendeur-pression-001
  type: mcq
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  status: reviewed
  source_id: P190
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'DAN — Breathe In, Breathe Out, fonction du deuxième étage : https://dan.org/alert-diver/article/breathe-in-breathe-out/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    question: À 20 m, à quelle pression absolue le deuxième étage d’un détendeur délivre-t-il approximativement
      l’air respiré ? Prendre 1 bar à la surface et +1 bar tous les 10 m.
    choices:
    - text: 3 bars
      correct: true
    - text: 1 bar
      correct: false
    - text: 2 bars
      correct: false
    explanation: Le deuxième étage fournit l’air à une pression proche de celle de l’eau autour du plongeur.
      À 20 m, cette pression ambiante vaut 1 + 20/10 = 3 bars absolus.
- id: n2-gaz-debit-vingt-001
  type: mcq
  anki_model: basic
  deck: Physique
  levels:
  - N2
  - N3
  tags:
  - chapitre::06
  - gaz-autonomie
