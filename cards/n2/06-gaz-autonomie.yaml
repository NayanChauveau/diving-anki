    fact_check: pass
  fr:
    question: Un ballon contient 4 L d’air à 10 m. Quel sera son volume à 30 m ? Le ballon est souple et
      fermé ; la température est constante et la tension de sa paroi négligeable. Prendre 1 bar à la surface
      et +1 bar tous les 10 m. Assimiler l’air à un gaz parfait.
    explanation: '**2 L.** À 10 m : 2 bars absolus ; à 30 m : 4 bars absolus. V₂ = 4 × 2/4 = 2 L. C’est
      le rapport des pressions absolues qui compte, pas le rapport des profondeurs.'
    choices:
    - text: 2 L
      correct: true
    - text: 4/3 L
      correct: false
    - text: 8 L
      correct: false
- id: n2-gaz-expansion-comparaison-001
  type: mcq
  deck: Physique
  levels:
  - N2
  tags:
  - chapitre::06
  - gaz-autonomie
  - exercice::calcul
  status: reviewed
  source_id: P184
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'NASA — Equation of State, Boyle à température et masse constantes : https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/equation-of-state/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    fact_check: pass
  fr:
    question: Deux ballons souples fermés contiennent chacun 2 L à leur profondeur de départ. L’un remonte
      de 10 m à la surface ; l’autre de 20 m à 10 m. Quels volumes atteignent-ils, respectivement ? Température
      constante, parois sans effet mécanique et assez extensibles. Prendre 1 bar à la surface et +1 bar
      tous les 10 m. Assimiler l’air à un gaz parfait.
    choices:
    - text: 4 L et 3 L
      correct: true
    - text: 4 L et 4 L
      correct: false
    - text: 3 L et 4 L
      correct: false
    explanation: 'Premier ballon : 2 × 2/1 = 4 L. Second ballon : 2 × 3/2 = 3 L. Pour une même remontée
      de 10 m, l’expansion proportionnelle est plus forte près de la surface.'
- id: n2-gaz-bloc-rigide-001
  type: mcq
  anki_model: basic
  deck: Physique
  levels:
  - N2
  tags:
