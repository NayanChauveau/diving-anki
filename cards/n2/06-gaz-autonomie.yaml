    question: À 30 m, un plongeur ventile 18 L/min mesurés à la pression ambiante. Quel est le débit correspondant
      ramené à 1 bar ? Prendre 1 bar à la surface et +1 bar tous les 10 m. Température supposée constante.
    explanation: '**72 L/min ramenés à 1 bar.** La pression absolue vaut 4 bars : 18 × 4 = 72 L/min.'
    choices:
    - text: 72 L/min à 1 bar
      correct: true
    - text: 54 L/min à 1 bar
      correct: false
    - text: 4,5 L/min à 1 bar
      correct: false
