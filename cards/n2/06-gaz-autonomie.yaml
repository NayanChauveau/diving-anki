  - gaz-autonomie
  status: reviewed
  source_id: P188
  review:
    sources:
    - 'Conversion QCM et revue des choix du 2026-10-06 : docs/reviews/QCM_GLOBALE.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'DAN World — Preventing Mask Squeeze During Your Dives : https://world.dan.org/id/alert-diver/article/preventing-mask-squeeze/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    - 'Revue approfondie N2 du 2026-10-09 : docs/reviews/PHYSIQUE_N2_2026-10-09.md ; DAN World Preventing
      Mask Squeeze ; voie nasale vs voie buccale ; chaque distracteur analysé dans le CSV'
    fact_check: pass
  fr:
    question: À la descente, quel geste ajoute effectivement de l’air dans le masque pour remettre sa
      pression intérieure à la pression ambiante ?
    choices:
    - text: Expirer doucement par le nez, sans le pincer
      correct: true
    - text: Expirer dans le détendeur, par la bouche
      correct: false
    - text: Effectuer une déglutition en pinçant le nez
      correct: false
    explanation: L’air expiré doucement par le nez entre dans le masque et compense la pression croissante
      de l’eau. L’air expiré par la bouche s’évacue par le second étage et n’entre pas dans le masque.
      La déglutition nez pincé concerne l’équilibrage des oreilles, pas l’apport de gaz au masque.
- id: n2-gaz-oreille-descente-001
  type: mcq
  anki_model: basic
  deck: Physique
  levels:
  - N2
  tags:
