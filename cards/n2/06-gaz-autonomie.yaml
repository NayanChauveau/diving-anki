  fr:
    front: Un ballon contient 10 L d’air à la surface. Quel volume occupe cet air à 40 m ? Le ballon est
      souple et fermé ; la température est constante et la tension de sa paroi négligeable. Prendre 1
      bar à la surface et +1 bar tous les 10 m. Assimiler l’air à un gaz parfait.
    back: '**2 L.** À 40 m, la pression absolue vaut 5 bars : V₂ = 10 × 1/5 = 2 L. Utiliser seulement
      les 4 bars hydrostatiques donnerait un résultat erroné.'
- id: n2-gaz-ballon-remontee-001
  type: basic
  deck: Physique
