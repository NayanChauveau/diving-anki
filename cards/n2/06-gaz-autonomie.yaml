    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'DAN — Ears and Diving, Chapter 1: Key Information : https://dan.org/health-medicine/health-resource/dive-medical-reference-books/ears-diving/ears-equalization/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    - 'Revue approfondie N2 du 2026-10-09 : docs/reviews/PHYSIQUE_N2_2026-10-09.md ; DAN Ears and Diving,
      Middle-Ear Equalization ; égalisation précoce et douce ; chaque distracteur analysé dans le CSV'
    fact_check: pass
  fr:
    question: Pourquoi faut-il équilibrer les oreilles régulièrement et sans forcer pendant la descente
      ?
    choices:
    - text: Égaliser la pression des deux côtés du tympan
      correct: true
    - text: Augmenter la pression dans le conduit auditif externe
      correct: false
    - text: Maintenir l’oreille moyenne à la pression de surface
      correct: false
    explanation: '**Pour faire entrer de l’air dans l’oreille moyenne et équilibrer la pression de part
      et d’autre du tympan.** La pression extérieure augmente avec la profondeur. On équilibre tôt, avant
      la douleur ; si l’équilibrage ne passe pas, on arrête de descendre plutôt que de forcer.'
