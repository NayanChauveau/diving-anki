- id: n2-gaz-loi-boyle-001
  type: mcq
  deck: Physique
  levels:
  - N2
  - N3
  tags:
  - chapitre::06
  - gaz-autonomie
  status: reviewed
  source_id: P175
  review:
    sources:
    - 'N3-S01 — MFT N3 FFESSM, décembre 2025, p.8, 13, 15 ; pertinence N3 revue le 2026-10-06 : docs/reviews/n3/00-reprises-n2.md'
    - S1 — Théorie N2 Stade de Vanves 2024, p.10–12.
    - 'NASA — Equation of State, Boyle à température et masse constantes : https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/equation-of-state/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    - 'Revue approfondie N2 du 2026-10-09 : docs/reviews/PHYSIQUE_N2_2026-10-09.md ; NASA Equation of
      State ; BSAC So you think you use too much gas et Gas reserves ; modèle explicite de la carte ;
      chaque distracteur analysé dans le CSV'
    fact_check: pass
  fr:
    question: Une quantité fixe de gaz parfait reste à température constante. Si sa pression absolue est
      multipliée par 3, que devient son volume ?
    choices:
    - text: Il est divisé par 3
      correct: true
    - text: Il est multiplié par 3
      correct: false
    - text: Il reste inchangé
      correct: false
    explanation: 'À quantité de gaz et température constantes, Boyle-Mariotte donne P₁V₁ = P₂V₂. La hausse
      de pression est compensée par une diminution de volume : V₂ = V₁/3. Conserver la quantité de gaz
      ne signifie pas conserver son volume.'
