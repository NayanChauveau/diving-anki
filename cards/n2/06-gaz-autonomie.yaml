    - 'DAN — Lack of Buoyancy Control : https://dan.org/health-medicine/health-resource/smart-guides/7-mistakes-divers-make-and-how-to-avoid-them/4-lack-of-buoyancy-control/'
    - 'Vérifié le 2026-10-06 ; revue : docs/reviews/06-gaz-autonomie.md'
    - 'Revue approfondie N2 du 2026-10-09 : docs/reviews/PHYSIQUE_N2_2026-10-09.md ; Boyle-Mariotte ;
      DAN Buoyancy Control ; évolution après purge ; chaque distracteur analysé dans le CSV'
    fact_check: pass
  fr:
    question: 'Après une purge à 10 m, le gilet contient 3 L de gaz. Quel volume ce gaz occupera-t-il
      à 5 m si le plongeur n’ajoute ni ne retire de gaz sur ce trajet ? Modèle de gilet souple : gaz parfait
      à température constante, paroi sans effet mécanique ; 1 bar en surface et +1 bar par 10 m.'
    choices:
    - text: 4 L
      correct: true
    - text: 3 L
      correct: false
    - text: 2,25 L
      correct: false
    explanation: 'Après la purge, le gaz restant se dilate encore : V₂ = 3 × 2/1,5 = 4 L. Garder 3 L reviendrait
      à supposer que la purge fige le volume ; 2,25 L inverse le rapport des pressions. Une purge n’annule
      pas l’expansion lors de la suite de la remontée, d’où les ajustements progressifs.'
- id: n2-gaz-masque-descente-001
  type: mcq
  anki_model: basic
  deck: Physique
  levels:
  - N2
  tags:
