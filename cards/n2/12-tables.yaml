    - 'FFESSM — Tables et mode d’emploi, juillet 2005, p.1–2, 4, 6–8, consultés et tableaux contrôlés
      visuellement le 2026-10-06 : https://ffessm-ctr-aura.fr/wp-content/uploads/2019/03/MN90.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    front: 'Exercice MN90 : départ de 30 m, un seul palier de 9 min à 3 m. Employer 15 m/min jusqu’au
      palier, puis 6 m/min à la surface, et arrondir la somme à la minute supérieure. Quelle DTR ?'
    back: '**12 min.** Trajet 30 → 3 m : 27/15 = 1,8 min ; palier : 9 min ; trajet 3 → 0 m : 3/6 = 0,5
      min. Total 11,3 min, arrondi à 12 min.'
- id: n2-tables-successive-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::12
