  fr:
    question: Dans les exercices MN90, à quelles catégories appartiennent deux plongées séparées par exactement
      15 min de surface, puis par exactement 12 h ?
    choices:
    - text: '15 min : successive ; 12 h : isolée'
      correct: true
    - text: '15 min : consécutive ; 12 h : successive'
      correct: false
    - text: '15 min : successive ; 12 h : successive'
      correct: false
    explanation: '**15 min : successive ; 12 h : isolée.** Une consécutive est séparée de moins de 15
      min ; une successive, de 15 min à moins de 12 h ; une isolée, d’au moins 12 h. L’intervalle va de
      la sortie de la première plongée au départ de la seconde ; cette classification n’atteste pas une
      élimination totale de l’azote.'
