  fr:
    question: À quoi sert le groupe de plongée successive, ou GPS, donné par une lettre à la sortie d’une
      plongée MN90 ?
    choices:
    - text: Tenir compte du gaz résiduel pour la plongée suivante
      correct: true
    - text: Donner directement la durée du dernier palier
      correct: false
    - text: Donner directement la durée maximale de la seconde plongée
      correct: false
    explanation: '**À tenir compte du gaz résiduel pour une plongée suivante.** Avec l’intervalle de surface,
      cette lettre permet de lire l’azote résiduel puis une majoration ; elle n’est ni une position géographique
      ni une durée de palier.'
