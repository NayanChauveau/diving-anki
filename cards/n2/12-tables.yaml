  fr:
    question: Une plongée simple à 20 m est lue sur une ligne MN90 ne donnant aucun palier. Quelle remontée
      normale correspond à cette lecture, sans arrêt facultatif ajouté ?
    choices:
    - text: Remonter vers la surface à la vitesse MN90 de 15 à 17 m/min
      correct: true
    - text: Remonter vers la surface à 6 m/min, comme entre deux paliers
      correct: false
    - text: Remonter jusqu’à 3 m à 15 à 17 m/min, puis y rester 3 min
      correct: false
    explanation: La zone sans palier dispense de palier de décompression obligatoire, pas de la vitesse
      prévue. En MN90, la remontée normale du fond suit 15 à 17 m/min ; les 6 m/min concernent les trajets
      entre paliers et du dernier palier à la surface. Un arrêt facultatif ajouté ne fait pas partie de
      la lecture demandée.
