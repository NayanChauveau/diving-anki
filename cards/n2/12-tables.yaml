  fr:
    question: Que comprend la durée totale de remontée, ou DTR, d’un exercice de tables MN90 ?
    choices:
    - text: Trajet du fond au premier palier, arrêts et trajets jusqu’à la surface
      correct: true
    - text: Trajet du fond au premier palier et somme des durées d’arrêt
      correct: false
    - text: Somme des durées d’arrêt aux différentes profondeurs de palier
      correct: false
    explanation: La DTR additionne les trajets de remontée et les durées des paliers. Les déplacements
      entre paliers et du dernier palier à la surface comptent aussi ; elle n’est ni la seule somme des
      arrêts ni le seul accès au premier palier.
