    - S1 — Théorie N2 Stade de Vanves 2024, p.23–26 ; tableaux p.24–25 inspectés visuellement.
    - 'FFESSM — Tables et mode d’emploi, juillet 2005, p.1–2, 4, 6–8, consultés et tableaux contrôlés
      visuellement le 2026-10-06 : https://ffessm-ctr-aura.fr/wp-content/uploads/2019/03/MN90.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    front: 'Exercice MN90 : GPS H, intervalle de surface 2 h, deuxième plongée prévue à 20 m pendant 20
      min. Extraits : H/2 h → azote résiduel 0,98 ; tableau II, 0,99/20 m → majoration 22 min ; à 20 m,
      40 min → sans palier, 45 min → 1 min à 3 m. Quels paliers lire pour la seconde ?'
    back: '**1 min à 3 m.** 0,98 est arrondi à 0,99 dans le tableau II ; majoration 22 min. Durée fictive
      22 + 20 = 42 min, arrondie à la ligne 45 min. L’intervalle exact de 2 h est présent au tableau I.'
