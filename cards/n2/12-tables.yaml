    question: Que comprend la durée totale de remontée, ou DTR, d’un exercice de tables MN90 ?
    choices:
    - text: Trajets de remontée et durées des paliers
      correct: true
    - text: Durée du fond et durées des paliers
      correct: false
    - text: Descente, fond et remontée complète
      correct: false
    explanation: '**Le trajet jusqu’au premier palier, les durées des paliers, les trajets entre eux et
      du dernier palier à la surface.** Elle exclut la durée passée avant le début de remontée.'
