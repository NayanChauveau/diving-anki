    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    front: Dans une plongée successive MN90, que représente la majoration ajoutée au temps de la deuxième
      plongée ?
    back: '**Un temps fictif équivalent à la charge résiduelle en azote**, à la profondeur retenue pour
      la deuxième plongée. Ce n’est pas du temps supplémentaire à passer réellement au fond.'
- id: n2-tables-temps-fictif-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
