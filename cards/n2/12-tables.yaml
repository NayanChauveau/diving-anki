  fr:
    question: Dans les MN90 au niveau de la mer, quelles vitesses distingue-t-on pour remonter du fond
      puis entre les paliers ?
    choices:
    - text: 15 à 17 m/min jusqu’au premier palier, puis 6 m/min
      correct: true
    - text: 6 m/min jusqu’au premier palier, puis 15 à 17 m/min
      correct: false
    - text: 15 à 17 m/min jusqu’au premier palier et entre les paliers
      correct: false
    explanation: '**15 à 17 m/min du fond au premier palier ; 6 m/min entre paliers et jusqu’à la surface.**
      Dans les calculs de DTR, on emploie 15 m/min pour la première partie, puis 30 secondes par trajet
      de 3 m.'
