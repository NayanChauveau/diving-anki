    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    question: 'Exercice MN90 : la profondeur maximale est 19 m et la durée avant remontée 31 min 10 s. La
      table comporte 18 et 20 m, puis 30 et 35 min à 20 m. Quelle ligne retenir ?'
    choices:
    - text: 20 m et 35 min
      correct: true
    - text: 20 m et 30 min
      correct: false
    - text: 18 m et 35 min
      correct: false
    explanation: '**20 m et 35 min.** 31 min 10 s compte d’abord pour 32 min, puis on choisit la durée tabulée
      immédiatement supérieure. Même principe pour 19 m : retenir 20 m, sans interpolation.'
