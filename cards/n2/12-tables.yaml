  fr:
    question: Pour quelles conditions de gaz et d’effort les tables MN90 ont-elles été établies ?
    choices:
    - text: Air et effort physique modéré
      correct: true
    - text: Air et effort physique intense
      correct: false
    - text: Tout mélange suroxygéné et effort modéré
      correct: false
    explanation: '**Respiration d’air et effort physique modéré.** Leur modèle et leurs règles d’emploi
      ne couvrent pas automatiquement un autre mélange ou un effort important ; une profondeur admissible
      dans une table ne donne pas une prérogative au plongeur.'
