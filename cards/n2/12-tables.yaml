    - 'FFESSM — Tables et mode d’emploi, juillet 2005, p.1–2, 4, 6–8, consultés et tableaux contrôlés
      visuellement le 2026-10-06 : https://ffessm-ctr-aura.fr/wp-content/uploads/2019/03/MN90.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    - 'Relecture globale du 2026-10-06 : docs/reviews/REVUE_FINALE_N2.md'
    fact_check: pass
  fr:
    question: Dans la lecture classique des MN90, pourquoi retient-on la profondeur maximale plutôt que
      la profondeur moyenne ?
    choices:
    - text: La table attribue toute la durée retenue à la profondeur maximale
      correct: true
    - text: La table attribue la durée à la moyenne des profondeurs extrêmes
      correct: false
    - text: La table attribue seulement le séjour au fond à la profondeur maximale
      correct: false
    explanation: '**Elle représente la plongée par un profil carré : toute la durée retenue est attribuée
      à la profondeur maximale.** Cette convention permet de lire les paliers à partir de deux valeurs,
      avec les règles propres à la table.'
