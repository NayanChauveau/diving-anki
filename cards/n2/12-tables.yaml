    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    front: Quelles trois données faut-il connaître pour déterminer la majoration MN90 d’une deuxième plongée
      ?
    back: '**Le GPS de la première plongée, l’intervalle de surface et la profondeur prévue pour la deuxième.**
      GPS + intervalle donnent l’azote résiduel au tableau I ; azote résiduel + profondeur donnent la
      majoration au tableau II.'
