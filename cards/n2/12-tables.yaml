    fact_check: pass
  fr:
    front: 'Exercice MN90 : GPS H, intervalle réel 2 h 10. Tableau I : H/2 h = 0,98 ; H/2 h 30 = 0,95.
      Quel intervalle tabulé retenir pour lire l’azote résiduel ?'
    back: '**2 h, donnant 0,98.** Pour l’intervalle de surface absent du tableau I, prendre la valeur
      immédiatement inférieure ; 2 h 30 créditerait une élimination qui n’a pas eu lieu.'
