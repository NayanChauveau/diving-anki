    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    front: 'Exercice de successive : majoration 13 min, durée réelle de la deuxième plongée 22 min. Quelle
      durée sert à lire ses paliers ?'
    back: '**35 min : 13 + 22.** Les 13 min sont fictives ; la durée réelle avant remontée reste 22 min.'
