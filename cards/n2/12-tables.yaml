  status: reviewed
  source_id: P411
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.23–26 ; tableaux p.24–25 inspectés visuellement.
    - 'FFESSM — Tables et mode d’emploi, juillet 2005, p.1–2, 4, 6–8, consultés et tableaux contrôlés
      visuellement le 2026-10-06 : https://ffessm-ctr-aura.fr/wp-content/uploads/2019/03/MN90.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    front: 'Exercice : une ligne MN90 à 25 m indique durée 30 min, palier à 3 m = 2 min, DTR = 4 min et
      GPS H. Quelle durée sépare le départ du fond de l’arrivée en surface ?'
    back: '**4 min, la DTR.** Les 2 min sont seulement le palier ; le trajet ajoute du temps. La lettre
      H sert à une plongée successive, pas à chronométrer la remontée.'
