    - S1 — Théorie N2 Stade de Vanves 2024, p.23–26 ; tableaux p.24–25 inspectés visuellement.
    - 'FFESSM — Tables et mode d’emploi, juillet 2005, p.1–2, 4, 6–8, consultés et tableaux contrôlés
      visuellement le 2026-10-06 : https://ffessm-ctr-aura.fr/wp-content/uploads/2019/03/MN90.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    front: 'Extrait MN90 à 20 m : 40 min sans palier ; 45 min avec 1 min à 3 m. Une plongée simple dure
      41 min avant une remontée normale. Faut-il lire une ligne avec palier ?'
    back: '**Oui : la ligne 45 min, avec 1 min à 3 m.** 41 min dépasse la dernière ligne sans palier et
      on n’interpole pas entre 40 et 45 min.'
