  fr:
    question: À la sortie d’une plongée MN90, comment utilise-t-on la lettre du groupe de plongée successive
      (GPS) pour préparer la suivante ?
    choices:
    - text: Avec l’intervalle de surface, lire l’azote résiduel avant de déterminer la majoration
      correct: true
    - text: La convertir en majoration à ajouter à la durée réelle de la suivante
      correct: false
    - text: La convertir en intervalle minimal permettant de traiter la suivante comme isolée
      correct: false
    explanation: La lettre caractérise un état résiduel du modèle. GPS et intervalle servent à lire l’azote
      résiduel au tableau I ; cette valeur et la profondeur de la suivante donnent ensuite la majoration
      au tableau II. La lettre seule n’est ni un temps fictif ni un délai de récupération.
