    - S1 — Théorie N2 Stade de Vanves 2024, p.23–26 ; tableaux p.24–25 inspectés visuellement.
    - 'FFESSM — Tables et mode d’emploi, juillet 2005, p.1–2, 4, 6–8, consultés et tableaux contrôlés
      visuellement le 2026-10-06 : https://ffessm-ctr-aura.fr/wp-content/uploads/2019/03/MN90.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    front: Que signifie une durée située dans la zone sans palier obligatoire d’une table ?
    back: '**Avec les hypothèses et règles de cette table, la remontée n’exige pas de palier de décompression.**
      La vitesse de remontée reste à respecter ; « sans palier » ne signifie ni remontée instantanée ni
      risque nul.'
- id: n2-tables-dtr-001
  type: basic
