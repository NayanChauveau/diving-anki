  fr:
    question: Dans une plongée simple MN90 à remontée normale, entre quels instants compte-t-on la durée
      utilisée pour entrer dans la table ?
    choices:
    - text: Du départ de la surface au début de la remontée
      correct: true
    - text: De l’arrivée au fond au début de la remontée
      correct: false
    - text: Du départ de la surface à la fin du dernier palier
      correct: false
    explanation: '**Du départ de la surface au début de la remontée vers la surface.** La descente et le
      temps d’exploration sont inclus ; les paliers et la remontée normale viennent ensuite dans la durée
      totale d’immersion.'
