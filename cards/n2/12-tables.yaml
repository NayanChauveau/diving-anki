  fr:
    question: Pourquoi la vitesse MN90 de 15 à 17 m/min ne définit-elle pas automatiquement la limite
      à suivre pour une plongée conduite à l’ordinateur ?
    choices:
    - text: La limite de vitesse fait partie des conditions du modèle utilisé pendant cette plongée
      correct: true
    - text: La vitesse MN90 sert de référence commune aux calculs de toutes les méthodes
      correct: false
    - text: La vitesse utilisée peut être changée en conservant le temps total des paliers
      correct: false
    explanation: La décompression calculée par l’appareil suppose ses propres conditions de remontée,
      dont la vitesse. Une vitesse issue des tables MN90 n’est pas interchangeable avec celle de l’ordinateur
      ; conserver les paliers ne suffit pas à conserver ces hypothèses.
