    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    front: Dans les MN90 au niveau de la mer, quelles vitesses distingue-t-on pour remonter du fond puis
      entre les paliers ?
    back: '**15 à 17 m/min du fond au premier palier ; 6 m/min entre paliers et jusqu’à la surface.**
      Dans les calculs de DTR, on emploie 15 m/min pour la première partie, puis 30 secondes par trajet
      de 3 m.'
