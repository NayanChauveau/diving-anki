cards:
- id: n2-tables-profil-carre-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::12
  - tables
  status: reviewed
  source_id: P381
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.23–26 ; tableaux p.24–25 inspectés visuellement.
    - 'FFESSM — Tables et mode d’emploi, juillet 2005, p.1–2, 4, 6–8, consultés et tableaux contrôlés
      visuellement le 2026-10-06 : https://ffessm-ctr-aura.fr/wp-content/uploads/2019/03/MN90.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    front: Pourquoi une table de décompression utilise-t-elle la profondeur maximale plutôt qu’une simple
      profondeur moyenne ?
    back: '**Elle représente la plongée par un profil carré : toute la durée retenue est attribuée à la
      profondeur maximale.** Cette convention permet de lire les paliers à partir de deux valeurs, avec
      les règles propres à la table.'
- id: n2-tables-duree-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::12
  - tables
  status: reviewed
  source_id: P384
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.23–26 ; tableaux p.24–25 inspectés visuellement.
    - 'FFESSM — Tables et mode d’emploi, juillet 2005, p.1–2, 4, 6–8, consultés et tableaux contrôlés
      visuellement le 2026-10-06 : https://ffessm-ctr-aura.fr/wp-content/uploads/2019/03/MN90.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    front: Dans une plongée simple MN90 à remontée normale, entre quels instants compte-t-on la durée
      utilisée pour entrer dans la table ?
    back: '**Du départ de la surface au début de la remontée vers la surface.** La descente et le temps
      d’exploration sont inclus ; les paliers et la remontée normale viennent ensuite dans la durée totale
      d’immersion.'
- id: n2-tables-arrondis-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::12
  - tables
  - exercice::calcul
  status: reviewed
  source_id: P386
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.23–26 ; tableaux p.24–25 inspectés visuellement.
    - 'FFESSM — Tables et mode d’emploi, juillet 2005, p.1–2, 4, 6–8, consultés et tableaux contrôlés
      visuellement le 2026-10-06 : https://ffessm-ctr-aura.fr/wp-content/uploads/2019/03/MN90.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    front: 'Exercice MN90 : la profondeur maximale est 19 m et la durée avant remontée 31 min 10 s. La
      table comporte 18 et 20 m, puis 30 et 35 min à 20 m. Quelle ligne retenir ?'
    back: '**20 m et 35 min.** 31 min 10 s compte d’abord pour 32 min, puis on choisit la durée tabulée
      immédiatement supérieure. Même principe pour 19 m : retenir 20 m, sans interpolation.'
- id: n2-tables-domaine-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::12
  - tables
  status: reviewed
  source_id: P388
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.23–26 ; tableaux p.24–25 inspectés visuellement.
    - 'FFESSM — Tables et mode d’emploi, juillet 2005, p.1–2, 4, 6–8, consultés et tableaux contrôlés
      visuellement le 2026-10-06 : https://ffessm-ctr-aura.fr/wp-content/uploads/2019/03/MN90.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    front: Pour quelles conditions de gaz et d’effort les tables MN90 utilisées dans les exercices de
      plongée à l’air sont-elles conçues ?
    back: '**Respiration d’air et effort physique modéré.** Leur modèle et leurs règles d’emploi ne couvrent
      pas automatiquement un autre mélange ou un effort important ; une profondeur admissible dans une
      table ne donne pas une prérogative au plongeur.'
- id: n2-tables-deux-plongees-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::12
  - tables
  status: reviewed
  source_id: P375
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.23–26 ; tableaux p.24–25 inspectés visuellement.
    - 'FFESSM — Tables et mode d’emploi, juillet 2005, p.1–2, 4, 6–8, consultés et tableaux contrôlés
      visuellement le 2026-10-06 : https://ffessm-ctr-aura.fr/wp-content/uploads/2019/03/MN90.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    front: La limite de deux plongées par 24 heures des tables MN90 devient-elle automatiquement une limite
      identique pour tout ordinateur ?
    back: '**Non : elle appartient au domaine d’emploi de ces tables.** Un ordinateur a son propre manuel
      et son modèle ; le nombre de plongées se planifie aussi avec leurs profils, les intervalles, la
      fatigue et les consignes du directeur de plongée.'
- id: n2-tables-sans-palier-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::12
  - tables
  status: reviewed
  source_id: P390
  review:
