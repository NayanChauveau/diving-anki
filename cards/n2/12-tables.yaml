  fr:
    question: La limite de deux plongées par 24 heures des tables MN90 devient-elle automatiquement une
      limite identique pour tout ordinateur ?
    choices:
    - text: 'Non : consulter les limites du modèle d’ordinateur utilisé'
      correct: true
    - text: 'Oui : cette limite des MN90 s’applique à tous les algorithmes'
      correct: false
    - text: 'Non : l’usage d’un ordinateur supprime la prise en compte des successives'
      correct: false
    explanation: '**Non : elle appartient au domaine d’emploi de ces tables.** Un ordinateur a son propre
      manuel et son modèle ; le nombre de plongées se planifie aussi avec leurs profils, les intervalles,
      la fatigue et les consignes du directeur de plongée.'
