  fr:
    question: À quel champ d’application se rattache la limite de deux plongées par 24 heures étudiée
      avec les MN90 ?
    choices:
    - text: Au domaine d’emploi des tables MN90
      correct: true
    - text: Au nombre réglementaire de plongées à l’air en établissement
      correct: false
    - text: Au domaine d’emploi commun des ordinateurs à gaz dissous
      correct: false
    explanation: Cette limite appartient aux règles d’utilisation des MN90. Elle ne se transpose pas automatiquement
      à un ordinateur ni au cadre réglementaire de toute plongée adulte. Pour un appareil, consulter son
      manuel et préparer la série avec profils, intervalles, fatigue et consignes du DP.
