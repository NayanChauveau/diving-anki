    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    front: Que comprend la durée totale de remontée, ou DTR, d’un exercice de tables MN90 ?
    back: '**Le trajet jusqu’au premier palier, les durées des paliers, les trajets entre eux et du dernier
      palier à la surface.** Elle exclut la durée passée avant le début de remontée.'
- id: n2-tables-gps-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::12
  - tables
  status: reviewed
  source_id: P395
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.23–26 ; tableaux p.24–25 inspectés visuellement.
    - 'FFESSM — Tables et mode d’emploi, juillet 2005, p.1–2, 4, 6–8, consultés et tableaux contrôlés
      visuellement le 2026-10-06 : https://ffessm-ctr-aura.fr/wp-content/uploads/2019/03/MN90.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    front: À quoi sert le groupe de plongée successive, ou GPS, donné par une lettre à la sortie d’une
      plongée MN90 ?
    back: '**À tenir compte du gaz résiduel pour une plongée suivante.** Avec l’intervalle de surface,
      cette lettre permet de lire l’azote résiduel puis une majoration ; elle n’est ni une position géographique
      ni une durée de palier.'
- id: n2-tables-vitesses-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::12
