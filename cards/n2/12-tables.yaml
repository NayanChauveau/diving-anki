  fr:
    question: Que signifie une durée située dans la zone sans palier obligatoire d’une table ?
    choices:
    - text: Remontée sans palier obligatoire, en respectant la vitesse prévue par la table
      correct: true
    - text: Remontée sans palier obligatoire, avec une vitesse laissée au choix du plongeur
      correct: false
    - text: Remontée avec un palier de confort obligatoire, même sans palier de décompression indiqué
      correct: false
    explanation: '**Avec les hypothèses et règles de cette table, la remontée n’exige pas de palier de
      décompression.** La vitesse de remontée reste à respecter ; « sans palier » ne signifie ni remontée
      instantanée ni risque nul.'
