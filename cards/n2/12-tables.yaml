      correct: true
    - text: Un temps réel supplémentaire à passer au fond
      correct: false
    - text: Un temps d’attente à ajouter à l’intervalle de surface
      correct: false
    explanation: '**Un temps fictif équivalent à la charge résiduelle en azote**, à la profondeur retenue
      pour la deuxième plongée. Ce n’est pas du temps supplémentaire à passer réellement au fond.'
