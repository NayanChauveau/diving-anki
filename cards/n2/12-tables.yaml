      suivre pendant cette plongée conduite à l’ordinateur ?
    choices:
    - text: La limite de l’ordinateur utilisé pendant la plongée
      correct: true
    - text: La limite MN90 dès que le plongeur a déjà appris les tables
      correct: false
    - text: La moyenne entre les deux limites de vitesse
      correct: false
    explanation: '**Le manuel et les indications de cet ordinateur.** La vitesse MN90 est une hypothèse
      des tables ; elle ne remplace pas la limite de l’appareil utilisé.'
