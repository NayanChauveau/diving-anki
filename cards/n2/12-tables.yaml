  fr:
    front: Un ordinateur impose une vitesse de remontée inférieure à celle des MN90. Quelle référence
      suivre pendant cette plongée conduite à l’ordinateur ?
    back: '**Le manuel et les indications de cet ordinateur.** La vitesse MN90 est une hypothèse des tables
      ; elle ne remplace pas la limite de l’appareil utilisé.'
- id: n2-tables-intervalles-001
  type: basic
  deck: Désaturation
  levels:
  - N2
  tags:
  - chapitre::12
  - tables
  status: reviewed
  source_id: P399
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.23–26 ; tableaux p.24–25 inspectés visuellement.
    - 'FFESSM — Tables et mode d’emploi, juillet 2005, p.1–2, 4, 6–8, consultés et tableaux contrôlés
      visuellement le 2026-10-06 : https://ffessm-ctr-aura.fr/wp-content/uploads/2019/03/MN90.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    front: 'Pour les exercices MN90, on classe les intervalles ainsi : consécutive <15 min ; successive
      de 15 min à moins de 12 h ; isolée ≥12 h. Comment classer exactement 15 min et exactement 12 h ?'
    back: '**15 min : successive ; 12 h : isolée.** L’intervalle va de la sortie de la première plongée
      au départ de la seconde. Les bornes annoncées déterminent la catégorie ; elles ne mesurent pas une
      absence réelle et totale d’azote résiduel.'
- id: n2-tables-majoration-001
  type: basic
  deck: Désaturation
  levels:
