    - S1 — Théorie N2 Stade de Vanves 2024, p.23–26 ; tableaux p.24–25 inspectés visuellement.
    - 'FFESSM — Tables et mode d’emploi, juillet 2005, p.1–2, 4, 6–8, consultés et tableaux contrôlés
      visuellement le 2026-10-06 : https://ffessm-ctr-aura.fr/wp-content/uploads/2019/03/MN90.pdf'
    - 'Revue du 2026-10-06 : docs/reviews/12-tables.md'
    fact_check: pass
  fr:
    front: 'Exercice MN90 : 20 min jusqu’au départ du fond, puis 4 min de remontée lente jusqu’au premier
      palier. Quelle durée retenir avant les arrondis de lecture ?'
    back: '**24 min : 20 + 4.** Dans la procédure MN90 de remontée lente, cette phase jusqu’au premier
      palier est intégrée à la durée de plongée. Elle ne se traite pas comme une remontée normale.'
