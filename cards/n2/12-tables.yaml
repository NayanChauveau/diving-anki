    question: Quelles trois données faut-il connaître pour déterminer la majoration MN90 d’une deuxième
      plongée ?
    choices:
    - text: GPS initial, intervalle de surface, profondeur de la seconde
      correct: true
    - text: GPS initial, durée réelle de la seconde, profondeur de la seconde
      correct: false
    - text: Profondeur de la première, intervalle de surface, durée de la seconde
      correct: false
    explanation: '**Le GPS de la première plongée, l’intervalle de surface et la profondeur prévue pour
      la deuxième.** GPS + intervalle donnent l’azote résiduel au tableau I ; azote résiduel + profondeur
      donnent la majoration au tableau II.'
