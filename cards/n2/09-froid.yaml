  fr:
    question: En eau froide, un plongeur frissonne et ne peut plus manipuler ses attaches. Quelle décision
      prend en compte la dégradation de ses capacités ?
    choices:
    - text: L’aider à terminer la plongée de façon contrôlée avec la palanquée
      correct: true
    - text: L’aider à poursuivre la plongée en confiant ses manipulations à l’équipier
      correct: false
    - text: L’aider à poursuivre la plongée à faible profondeur en réduisant les manipulations
      correct: false
    explanation: La perte de dextérité compromet la maîtrise du matériel et peut s’accompagner d’une dégradation
      du jugement. L’assistance sert à terminer la plongée, pas à prolonger l’exposition en déléguant
      les gestes. Choisir une zone moins profonde ne corrige pas à lui seul le refroidissement.
