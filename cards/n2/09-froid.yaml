    fact_check: pass
  fr:
    front: Un plongeur toujours très froid devient confus et cesse de frissonner. Pourquoi cela ne prouve-t-il
      pas qu’il se réchauffe ?
    back: '**La disparition des frissons avec altération de la conscience peut annoncer une hypothermie
      aggravée.** Il faut le protéger du froid, le manipuler doucement et déclencher les secours ; l’absence
      de frissons n’est pas un critère de guérison.'
