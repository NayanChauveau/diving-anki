  fr:
    question: Pendant la lutte contre le froid, avec frissons et perte de dextérité, quel effet combiné
      peut réduire les marges d’une plongée profonde ?
    choices:
    - text: Une hausse des besoins ventilatoires avec une dégradation des gestes et du jugement
      correct: true
    - text: Une baisse des besoins ventilatoires avec une dégradation des gestes et du jugement
      correct: false
    - text: Une hausse des besoins ventilatoires avec une amélioration des gestes et du jugement
      correct: false
    explanation: La réponse au froid peut augmenter les besoins ventilatoires tandis que la dextérité
      et le jugement se dégradent. Ces effets s’ajoutent aux contraintes respiratoires et cognitives de
      la profondeur. Les réactions ne sont pas identiques chez tous les plongeurs.
