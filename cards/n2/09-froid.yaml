  fr:
    question: Pourquoi le froid peut-il compliquer une plongée profonde au-delà du seul inconfort ?
    choices:
    - text: Les besoins ventilatoires peuvent augmenter et les gestes et le jugement se dégrader
      correct: true
    - text: Les gestes se dégradent, mais le froid laisse les besoins ventilatoires inchangés
      correct: false
    - text: La ventilation augmente, mais le froid protège le jugement des effets de la profondeur
      correct: false
    explanation: '**Il peut accroître les besoins ventilatoires et dégrader le jugement et les gestes.**
      Il peut ainsi s’ajouter aux contraintes respiratoires et aux effets de la narcose ; ces facteurs se
      cumulent sans seuil identique pour tous.'
