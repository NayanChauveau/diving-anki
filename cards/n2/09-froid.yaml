  fr:
    question: Dans quelles conditions peut-on proposer une boisson tiède non alcoolisée à un plongeur légèrement
      refroidi ?
    choices:
    - text: Conscience complète et déglutition normale, sans vomissements
      correct: true
    - text: Conscience même fluctuante, si la boisson reste tiède
      correct: false
    - text: Frissons présents, même avec difficulté à avaler
      correct: false
    explanation: '**S’il est pleinement conscient, coopératif et peut avaler normalement.** Une boisson
      tiède peut améliorer le confort et l’hydratation ; une boisson sucrée apporte aussi de l’énergie.
      En cas de trouble de conscience, de difficulté à avaler ou de vomissement, ne rien donner par la bouche.'
