- id: n2-froid-bilan-thermique-001
  type: basic
  deck: Prévention des accidents
  levels:
  - N2
  tags:
  - chapitre::09
  - froid
  status: reviewed
  source_id: P281
  review:
    sources:
    - S1 — Théorie N2 Stade de Vanves 2024, p.17–18.
    - 'DAN — Avoid the Chill, consulté le 2026-10-06 : https://dan.org/safety-prevention/diver-safety/divers-blog/avoid-the-chill/'
    - 'DAN — Exposure-Related Injuries, hypothermie, consulté le 2026-10-06 : https://dan.org/health-medicine/travelers-medical-guide/travel-related-injuries/exposure-related-injuries/'
    - 'Revue du 2026-10-06 : docs/reviews/09-froid.md'
    fact_check: pass
  fr:
    front: Pourquoi peut-on se refroidir même en bougeant pendant une plongée ?
    back: '**Les pertes de chaleur peuvent dépasser la chaleur produite par l’organisme.** L’eau, la durée,
      la protection et l’activité modifient ce bilan. Faire davantage d’effort ne garantit pas de maintenir
      la température centrale.'
