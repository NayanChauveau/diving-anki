  fr:
    question: Après sa sortie de l’eau, un plongeur hypothermique reste confus. Quelle prise en charge
      engager en attendant les secours ?
    choices:
    - text: L’isoler du froid et le manipuler doucement en déclenchant l’alerte
      correct: true
    - text: L’isoler du froid et frictionner vigoureusement ses membres en déclenchant l’alerte
      correct: false
    - text: L’isoler du froid et le faire marcher pour produire de la chaleur en déclenchant l’alerte
      correct: false
    explanation: '**Une hypothermie importante fragilise le fonctionnement cardiaque.** Les manipulations
      brutales et la mobilisation peuvent aggraver son état. L’isoler du froid, alerter les secours et
      suivre leurs consignes de réchauffement.'
