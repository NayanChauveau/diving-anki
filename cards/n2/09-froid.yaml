  fr:
    question: Pourquoi partir fatigué ou avec des apports alimentaires insuffisants réduit-il la marge face
      au froid ?
    choices:
    - text: Le manque d’énergie peut limiter la production de chaleur et les réactions
      correct: true
    - text: Les frissons suffisent à compenser le manque d’énergie tant qu’ils sont présents
      correct: false
    - text: Le repos avant immersion compense des apports insuffisants quelle que soit la durée
      correct: false
    explanation: '**La production de chaleur et les capacités de réaction peuvent être moins efficaces.**
      Préparer la plongée avec repos et alimentation adaptés ; une boisson ou un aliment ne compense pas
      une protection inadéquate.'
