  fr:
    front: Pourquoi partir fatigué ou avec des apports alimentaires insuffisants réduit-il la marge face
      au froid ?
    back: '**La production de chaleur et les capacités de réaction peuvent être moins efficaces.** Préparer
      la plongée avec repos et alimentation adaptés ; une boisson ou un aliment ne compense pas une protection
      inadéquate.'
