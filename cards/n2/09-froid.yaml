  fr:
    question: Un plongeur refroidi mais lucide sort de l’eau sur un pont exposé au vent. Comment organiser
      le passage aux vêtements secs ?
    choices:
    - text: Le mettre à l’abri puis retirer le mouillé en le séchant et le couvrant immédiatement
      correct: true
    - text: Le déshabiller sur le pont puis le mettre à l’abri pour le sécher et le couvrir
      correct: false
    - text: Le couvrir sur le pont en gardant le mouillé puis attendre qu’il sèche sous les couches
      correct: false
    explanation: Réduire l’exposition au vent avant de retirer les vêtements mouillés limite les pertes
      supplémentaires. À l’abri, sécher puis isoler avec du sec, y compris de la surface froide sur laquelle
      il se trouve. Une couverture peut protéger provisoirement, mais laisser du mouillé sous les couches
      n’est pas l’objectif du changement au sec.
