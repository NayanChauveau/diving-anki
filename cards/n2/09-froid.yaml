  fr:
    question: Quel signe contre-indique de donner une boisson tiède à un plongeur refroidi ?
    choices:
    - text: Une conscience fluctuante ou une difficulté à avaler
      correct: true
    - text: Des frissons avec une conscience et une déglutition normales
      correct: false
    - text: Des doigts engourdis avec une conscience et une déglutition normales
      correct: false
    explanation: Donner une boisson suppose une personne pleinement consciente, coopérative et capable
      d’avaler normalement, sans vomissements. Un trouble de conscience ou de déglutition expose à une
      fausse route. Chez une personne légèrement refroidie qui remplit ces conditions, une boisson tiède
      non alcoolisée apporte surtout confort et hydratation ; une boisson sucrée apporte aussi de l’énergie.
