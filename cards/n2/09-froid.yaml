  fr:
    front: Dans quelles conditions peut-on proposer une boisson tiède non alcoolisée à un plongeur légèrement
      refroidi ?
    back: '**S’il est pleinement conscient, coopératif et peut avaler normalement.** Une boisson tiède
      peut améliorer le confort et l’hydratation ; une boisson sucrée apporte aussi de l’énergie. En cas
      de trouble de conscience, de difficulté à avaler ou de vomissement, ne rien donner par la bouche.'
