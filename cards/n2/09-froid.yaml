  fr:
    question: À épaisseur nominale identique, pourquoi une combinaison humide trop ample protège-t-elle
      moins bien qu’une combinaison correctement ajustée ?
    choices:
    - text: Elle favorise le renouvellement de l’eau déjà réchauffée au contact du corps
      correct: true
    - text: Elle augmente la pression de l’eau et comprime davantage le néoprène à même profondeur
      correct: false
    - text: Elle refroidit parce que toute présence d’eau annule l’isolation du néoprène
      correct: false
    explanation: Dans une combinaison humide, une petite quantité d’eau entre et se réchauffe. Un mauvais
      ajustement favorise son renouvellement par de l’eau froide, ce qui augmente les pertes. Le néoprène
      isole malgré la présence d’eau ; sa compression dépend surtout de la profondeur. État du vêtement
      et protection des extrémités comptent également.
