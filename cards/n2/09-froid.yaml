  fr:
    question: Un plongeur toujours très froid devient confus et cesse de frissonner. Pourquoi cela ne prouve-t-il
      pas qu’il se réchauffe ?
    choices:
    - text: La confusion avec disparition des frissons peut indiquer une aggravation de l’hypothermie
      correct: true
    - text: La disparition des frissons indique un réchauffement malgré la confusion persistante
      correct: false
    - text: La confusion permet d’attribuer l’arrêt des frissons à la seule narcose
      correct: false
    explanation: '**La disparition des frissons avec altération de la conscience peut annoncer une hypothermie
      aggravée.** Il faut le protéger du froid, le manipuler doucement et déclencher les secours ; l’absence
      de frissons n’est pas un critère de guérison.'
