  fr:
    question: Après une exposition prolongée au froid, un plongeur cesse de frissonner tout en devenant
      confus. Quelle interprétation guide la prise en charge ?
    choices:
    - text: Une aggravation du refroidissement avec une réponse de thermorégulation diminuée
      correct: true
    - text: Un retour à l’équilibre thermique avec un retard de récupération de la vigilance
      correct: false
    - text: Une stabilisation du refroidissement grâce à une production de chaleur sans frissons
      correct: false
    explanation: L’arrêt des frissons associé à la confusion peut signaler une hypothermie aggravée. Il
      ne démontre ni un réchauffement ni une compensation suffisante. Protéger du froid, manipuler doucement
      et déclencher les secours.
