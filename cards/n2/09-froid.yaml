  fr:
    front: Un plongeur hypothermique reste confus après sa sortie de l’eau. Pourquoi faut-il le manipuler
      doucement et éviter de frictionner vigoureusement ses membres ?
    back: '**Une hypothermie importante fragilise le fonctionnement cardiaque.** Les manipulations brutales
      et la mobilisation peuvent aggraver son état. L’isoler du froid, alerter les secours et suivre leurs
      consignes de réchauffement.'
