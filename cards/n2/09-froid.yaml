  fr:
    question: En eau froide, un plongeur frissonne et n’arrive plus à manipuler ses attaches ou le dévidoir
      du parachute. Que doit faire la palanquée ?
    choices:
    - text: Aider le plongeur et terminer ensemble de façon contrôlée
      correct: true
    - text: Poursuivre plus haut dans l’eau jusqu’à disparition des frissons
      correct: false
    - text: Poursuivre en supprimant les manipulations difficiles
      correct: false
    explanation: '**Prendre en compte une dégradation de ses capacités liée au froid, l’aider et terminer
      ensemble la plongée de façon contrôlée.** Une réponse moins claire peut signaler aussi une altération
      du jugement. Ne pas attendre une perte de contrôle ; la température de l’eau seule ne suffit pas à
      juger son état.'
