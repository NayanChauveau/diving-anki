  fr:
    question: En lutte contre le froid, quelle réponse dépend directement de réserves énergétiques suffisantes
      pour produire de la chaleur ?
    choices:
    - text: Les frissons, par contractions musculaires involontaires
      correct: true
    - text: La vasoconstriction, par réduction du débit sanguin vers la peau
      correct: false
    explanation: 'Les frissons sont des contractions musculaires répétées : ils consomment de l’énergie
      et produisent de la chaleur. La vasoconstriction limite les pertes en réduisant l’irrigation de
      la peau ; elle ne produit pas la chaleur manquante. Des apports énergétiques insuffisants peuvent
      limiter la thermogenèse musculaire. Repos et alimentation adaptés complètent la protection thermique
      sans la remplacer.'
