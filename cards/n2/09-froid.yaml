    - 'Relecture globale du 2026-10-06 : docs/reviews/REVUE_FINALE_N2.md'
    fact_check: pass
  fr:
    front: En eau froide, un plongeur frissonne et n’arrive plus à manipuler ses attaches ou le dévidoir
      du parachute. Que doit faire la palanquée ?
    back: '**Prendre en compte une dégradation de ses capacités liée au froid, l’aider et terminer ensemble
      la plongée de façon contrôlée.** Une réponse moins claire peut signaler aussi une altération du
      jugement. Ne pas attendre une perte de contrôle ; la température de l’eau seule ne suffit pas à
      juger son état.'
