  fr:
    question: À la sortie d’eau, quelles mesures limitent les pertes de chaleur d’un plongeur refroidi qui
      reste conscient ?
    choices:
    - text: Abri du vent, isolation et changement au sec sans nouvelle exposition
      correct: true
    - text: Retrait immédiat des vêtements mouillés avant toute mise à l’abri
      correct: false
    - text: Marche rapide en combinaison mouillée pour se réchauffer
      correct: false
    explanation: '**Le mettre à l’abri du vent, l’isoler et retirer les vêtements mouillés lorsqu’il peut
      être protégé immédiatement.** Sécher et couvrir, notamment la tête ; éviter de le déshabiller longuement
      en plein vent.'
