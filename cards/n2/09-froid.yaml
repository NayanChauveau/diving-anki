  fr:
    question: Pourquoi peut-on se refroidir même en bougeant pendant une plongée ?
    choices:
    - text: Les pertes de chaleur peuvent rester supérieures à la chaleur produite par l’effort
      correct: true
    - text: Produire plus de chaleur par l’effort suffit à rendre positif le bilan thermique
      correct: false
    - text: La protection thermique rend les pertes indépendantes de la durée d’immersion
      correct: false
    explanation: '**Les pertes de chaleur peuvent dépasser la chaleur produite par l’organisme.** L’eau,
      la durée, la protection et l’activité modifient ce bilan. Faire davantage d’effort ne garantit pas
      de maintenir la température centrale.'
