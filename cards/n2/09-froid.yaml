  fr:
    front: À la sortie d’eau, quelles mesures limitent les pertes de chaleur d’un plongeur refroidi qui
      reste conscient ?
    back: '**Le mettre à l’abri du vent, l’isoler et retirer les vêtements mouillés lorsqu’il peut être
      protégé immédiatement.** Sécher et couvrir, notamment la tête ; éviter de le déshabiller longuement
      en plein vent.'
