  fr:
    question: Un plongeur frissonne malgré une activité musculaire. Quel bilan explique que sa température
      centrale puisse continuer à baisser ?
    choices:
    - text: Les pertes vers le milieu dépassent la chaleur produite par l’organisme
      correct: true
    - text: Les pertes vers le milieu diminuent jusqu’à égaler la chaleur produite par l’organisme
      correct: false
    - text: Les pertes vers le milieu sont compensées par la chaleur produite par l’organisme
      correct: false
    explanation: La température centrale peut baisser si l’organisme perd plus de chaleur qu’il n’en produit.
      Un bilan équilibré maintient la température ; un bilan excédentaire permet de réchauffer. Bouger
      ou frissonner augmente la production mais ne garantit pas un bilan suffisant.
