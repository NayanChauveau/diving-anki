  fr:
    question: Pourquoi choisir une protection thermique en fonction de la température et de la durée prévues,
      plutôt que de la seule épaisseur écrite sur la combinaison ?
    choices:
    - text: L’ajustement, l’état et les protections des extrémités comptent aussi
      correct: true
    - text: L’épaisseur nominale détermine à elle seule la protection
      correct: false
    - text: La profondeur maximale détermine à elle seule la protection
      correct: false
    explanation: '**L’efficacité dépend aussi de l’ajustement, de l’état du vêtement et des protections
      des extrémités.** Cagoule, chaussons et gants adaptés limitent certaines pertes ; une combinaison
      qui laisse circuler beaucoup d’eau protège moins bien.'
