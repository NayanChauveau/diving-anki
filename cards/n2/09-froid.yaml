  fr:
    front: Pourquoi le froid peut-il compliquer une plongée profonde au-delà du seul inconfort ?
    back: '**Il peut accroître les besoins ventilatoires et dégrader le jugement et les gestes.** Il peut
      ainsi s’ajouter aux contraintes respiratoires et aux effets de la narcose ; ces facteurs se cumulent
      sans seuil identique pour tous.'
