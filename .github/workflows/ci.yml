name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Quality gate
        run: make check
      - name: Verify imports preserve learning history
        run: uv run --with anki python -m pytest tests/test_anki_import.py
      - name: Build unified package
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: anki-packages
          path: dist/diving-fr.apkg

  latest-release:
    name: Update latest main release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: latest-main-release
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: anki-packages
          path: dist
      - name: Move rolling release tag to this commit
        run: |
          git tag --force latest-main "$GITHUB_SHA"
          git push origin refs/tags/latest-main --force
      - name: Create or update the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-main >/dev/null 2>&1; then
            gh release upload latest-main dist/diving-fr.apkg --clobber
            # Only the unified package remains on the rolling release.
            assets=$(gh release view latest-main --json assets --jq '.assets[].name')
            for legacy in diving-n2-fr.apkg diving-n3-fr.apkg diving-n4-fr.apkg; do
              if grep -Fxq "$legacy" <<< "$assets"; then
                gh release delete-asset latest-main "$legacy" --yes
              fi
            done
            gh release edit latest-main \
              --title "Latest main build" \
              --notes "Automated build from main at commit ${GITHUB_SHA}." \
              --latest
          else
            gh release create latest-main dist/diving-fr.apkg \
              --title "Latest main build" \
              --notes "Automated build from main at commit ${GITHUB_SHA}." \
              --latest
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: anki-packages
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/diving-fr.apkg
          generate_release_notes: true
