[project]
name = "diving-anki"
version = "0.1.0"
description = "Générateur de decks Anki de théorie de plongée N2, N3 et N4"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Plongée contributors" }]
dependencies = [
    "genanki>=0.13.1",
    "markdown>=3.7",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.22",
    "jsonschema>=4.23",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
diving-anki = "diving_anki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diving_anki"]

[tool.hatch.build.targets.wheel.sources]
"src/diving_anki" = "diving_anki"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.basedpyright]
include = ["src", "tests"]
exclude = [".venv", "dist"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
